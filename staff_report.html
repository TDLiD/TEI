<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

<style>
    .mini-cal th { padding: 10px 0; color: #64748b; font-size: 0.8rem; text-transform: uppercase; }
    .mini-cal td { height: 70px; width: 14.28%; border: 1px solid #1e293b; vertical-align: top; padding: 6px; cursor: pointer; transition: all 0.2s; position: relative; }
    .mini-cal td:hover { background-color: #1e293b; }
    .selected-date { background-color: rgba(59, 130, 246, 0.15) !important; border: 2px solid #3b82f6 !important; }
    .selected-date .date-num { color: #3b82f6; font-weight: 900; }
    .report-card-fixed { max-width: 400px; width: 100%; }
    .nav-btn:hover { background-color: #1e293b; color: #3b82f6; }
    .status-tag { position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%); font-size: 8px; font-weight: 900; padding: 2px 5px; border-radius: 4px; white-space: nowrap; pointer-events: none; }
    .status-progress { background: rgba(59, 130, 246, 0.2); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.3); }
    .status-completed { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
    .status-pending { background: rgba(245, 158, 11, 0.2); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); }
    .export-dropdown { position: relative; display: inline-block; }
    .export-content { display: none; position: absolute; right: 0; background-color: #0f172a; min-width: 140px; box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.5); z-index: 50; border: 1px solid #1e293b; border-radius: 12px; overflow: hidden; }
    .export-content button { width: 100%; padding: 10px 15px; text-align: left; font-size: 10px; font-weight: 800; color: #94a3b8; transition: all 0.2s; text-transform: uppercase; }
    .export-content button:hover { background-color: #1e293b; color: #3b82f6; }
    .export-dropdown:hover .export-content { display: block; }
    .import-btn { background: rgba(59, 130, 246, 0.1); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.3); }
    .import-btn:hover { background: #3b82f6; color: white; }
    .year-select { background: transparent; color: #3b82f6; border: none; font-family: inherit; font-weight: 900; cursor: pointer; padding: 0 4px; outline: none; transition: color 0.2s; appearance: none; }
    .year-select:hover { color: #60a5fa; }
    .year-select option { background-color: #0f172a; color: white; padding: 10px; }
/* 기존 style 태그 안에 추가 */
.text-sun { color: #ef4444 !important; } /* Red-500 */
.text-sat { color: #3b82f6 !important; } /* Blue-500 */
/* 툴팁 스타일 추가 */
.mini-cal td .report-tooltip {
    display: none;
    position: absolute;
    bottom: 105%;
    left: 50%;
    transform: translateX(-50%);
    background: #0f172a;
    color: #f0f0f0;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #3b82f6;
    width: 200px;
    font-size: 11px;
    white-space: normal;
    z-index: 100;
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    pointer-events: none;
}
.mini-cal td:hover .report-tooltip { display: block; }
.report-tooltip::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    margin-left: -5px;
    border-width: 5px;
    border-style: solid;
    border-color: #3b82f6 transparent transparent transparent;
}
/* 관리자 메모 알림 점 스타일 */
.admin-dot {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 6px;
    height: 6px;
    background-color: #ef4444; /* Red-500 */
    border-radius: 50%;
    box-shadow: 0 0 5px rgba(239, 68, 68, 0.8);
    z-index: 10;
}
</style>

                    <div class="export-dropdown">
                        <button class="bg-emerald-600/20 text-emerald-500 border border-emerald-500/30 px-3 py-1.5 rounded-lg text-[10px] font-black hover:bg-emerald-600 hover:text-white transition uppercase tracking-widest flex items-center gap-1">Excel Export ▾</button>
                        <div class="export-content">
                            <button onclick="window.exportStaffReport('monthly')">Monthly Report</button>

<div id="productivitySummary" class="mt-4 flex gap-2 justify-center border-t border-slate-800 pt-4">

        <p class="text-[9px] font-black text-emerald-500 uppercase mb-1">Completed</p>

        <p class="text-[9px] font-black text-amber-500 uppercase mb-1">Pending</p>
        <p id="countPending" class="text-lg font-black text-white">0</p>
    </div>
    <div class="bg-slate-800/50 px-3 py-2 rounded-xl border border-slate-700 flex-1 text-center">

        <p id="countProgress" class="text-lg font-black text-white">0</p>

<script>
    (function() {
        const user = sessionStorage.getItem('loggedInUser');

// 이 체크 루틴을 반드시 넣으세요 (leave 방식)
    if (!user || user === "null") {
        alert("Login required.");
        // 화면에 안내 메시지 표시 (선택)
        const container = document.getElementById('workCardContainer');
        if(container) container.innerHTML = '<p class="text-slate-500">Login is required.</p>';
        return; 
    }

        const database = firebase.database();
        let viewDate = new Date();
        const todayStr = new Date().toISOString().split('T')[0];
        let selectedDateStr = todayStr;
        let currentReportData = null;

        window.importStaffReport = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array', cellDates: true });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonData = XLSX.utils.sheet_to_json(firstSheet);
                    if (jsonData.length === 0) {
                        alert("No data found to import.");
                        return;
                    }
                    if (!confirm(`Do you want to save ${jsonData.length} records?`)) {
                        event.target.value = '';
                        return;
                    }
                    let successCount = 0;
                    const promises = jsonData.map(row => {
                        let rawDate = row["Date"];
                        let dateKey = "";
                        if (typeof rawDate === 'number') {
                            const jsDate = new Date(Math.round((rawDate - 25569) * 86400 * 1000));
                            dateKey = jsDate.toISOString().split('T')[0];
                        } else if (rawDate instanceof Date) {
                            dateKey = rawDate.toISOString().split('T')[0];
                        } else if (typeof rawDate === 'string') {
                            dateKey = rawDate.trim();
                        }
                        if (!dateKey || !/^\d{4}-\d{2}-\d{2}$/.test(dateKey)) return Promise.resolve();
                        const reportData = {
                            status: row["Status"] || "In Progress",
                            todo: row["To-Do"] || "",
                            summary: row["Summary"] || "",
                            adminMemo: row["Admin Memo"] || "",
                            time: row["Update Time"] || new Date().getHours().toString().padStart(2, '0') + ":00"
                        };
                        return database.ref(`reports/${dateKey}/${user}`).set(reportData).then(() => { successCount++; });
                    });
                    Promise.all(promises).then(() => {
                        alert(`Successfully imported ${successCount} reports.`);
                        window.loadReport(selectedDateStr);
                        event.target.value = '';
                    });
                } catch (err) {
                    alert("An error occurred while parsing the file.");
                }
            };
            reader.readAsArrayBuffer(file);
        };

        window.exportStaffReport = function(mode) {
            const year = viewDate.getFullYear();
            const month = viewDate.getMonth() + 1;
            let fileName = "";
            database.ref('reports').once('value', (snapshot) => {
                const allData = snapshot.val() || {};
                const exportRows = [];
                const sortedDates = Object.keys(allData).sort();
                sortedDates.forEach(dateKey => {
                    const report = (allData[dateKey] && allData[dateKey][user]) ? allData[dateKey][user] : null;
                    if (!report) return;
                    const [rYear, rMonth] = dateKey.split('-').map(Number);
                    let shouldInclude = false;
                    if (mode === 'monthly') {
                        if (rYear === year && rMonth === month) shouldInclude = true;
                        fileName = `WorkReport_${user}_${year}-${String(month).padStart(2,'0')}.xlsx`;
                    } else if (mode === 'yearly') {
                        if (rYear === year) shouldInclude = true;
                        fileName = `WorkReport_${user}_Year_${year}.xlsx`;
                    } else if (mode === 'all') {
                        shouldInclude = true;
                        fileName = `WorkReport_${user}_AllTime.xlsx`;
                    }
                    if (shouldInclude) {
                        exportRows.push({
                            "Date": dateKey,
                            "Status": report.status || "In Progress",
                            "To-Do": report.todo || "",
                            "Summary": report.summary || report.content || "",
                            "Admin Memo": report.adminMemo || "",
                            "Update Time": report.time || ""
                        });
                    }
                });
                if (exportRows.length === 0) {
                    alert("No report data found.");
                    return;
                }
                const worksheet = XLSX.utils.json_to_sheet(exportRows);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "Report");
                const range = XLSX.utils.decode_range(worksheet['!ref']);
                for (let R = range.s.r; R <= range.e.r; ++R) {
                    for (let C = range.s.c; C <= range.e.c; ++C) {
                        const cellAddress = XLSX.utils.encode_cell({ r: R, c: C });
                        if (!worksheet[cellAddress]) continue;
                        worksheet[cellAddress].s = {
                            alignment: { wrapText: true, vertical: 'top', horizontal: 'left' },
                            font: { name: 'Arial', sz: 10 }
                        };
                        if (R === 0) {
                            worksheet[cellAddress].s.fill = { fgColor: { rgb: "F2F2F2" } };
                            worksheet[cellAddress].s.font.bold = true;
                        }
                    }
                }
                worksheet['!cols'] = [{ wch: 12 }, { wch: 12 }, { wch: 45 }, { wch: 55 }, { wch: 35 }, { wch: 12 }];
                XLSX.writeFile(workbook, fileName);
            });
        };

        const getTempKey = (date) => `temp_report_${user}_${date}`;
        window.saveToTemp = function() {
            const todo = document.getElementById('editTodo')?.value;
            const summary = document.getElementById('editSummary')?.value;
            const status = document.getElementById('editStatus')?.value;
            const tempData = { todo, summary, status, timestamp: new Date().getTime() };
            localStorage.setItem(getTempKey(selectedDateStr), JSON.stringify(tempData));
        };
        window.clearTemp = function(date) { localStorage.removeItem(getTempKey(date)); };
        window.changeViewMonth = function(offset) { viewDate.setMonth(viewDate.getMonth() + offset); renderMiniCalendar(); };
        window.changeViewYear = function(year) { viewDate.setFullYear(parseInt(year)); renderMiniCalendar(); };
        window.goToday = function() { viewDate = new Date(); selectedDateStr = todayStr; loadReport(selectedDateStr); };

        window.saveReport = function() {
            const todoField = document.getElementById('editTodo');
            const summaryField = document.getElementById('editSummary');
            const statusField = document.getElementById('editStatus');
            if(!todoField.value.trim() && !summaryField.value.trim()) return alert("Please enter at least one content.");
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
            const saveData = { todo: todoField.value, summary: summaryField.value, status: statusField.value, time: timeStr };
            if (currentReportData && currentReportData.adminMemo) saveData.adminMemo = currentReportData.adminMemo;
            database.ref('reports/' + selectedDateStr + '/' + user).set(saveData).then(() => {
                alert("Saved successfully.");
                window.clearTemp(selectedDateStr);
                loadReport(selectedDateStr);
            }).catch(() => alert("Failed to save."));
        };

        window.deleteReport = function() {
            if (!confirm("Are you sure you want to delete this report?")) return;
            database.ref('reports/' + selectedDateStr + '/' + user).remove().then(() => {
                alert("Deleted successfully.");
                window.clearTemp(selectedDateStr);
                currentReportData = null;
                loadReport(selectedDateStr);
            });
        };

        window.loadReport = function(dateStr) {
            selectedDateStr = dateStr;
            const d = new Date(dateStr);
            viewDate.setFullYear(d.getFullYear());
            viewDate.setMonth(d.getMonth());
            renderMiniCalendar();
            const actionBtn = document.getElementById('actionButtons');
            actionBtn.innerHTML = ''; 
            database.ref('reports/' + dateStr + '/' + user).once('value', (snapshot) => {
                const report = snapshot.val();
                currentReportData = report;
                const container = document.getElementById('workCardContainer');
                if (!report) { window.showEditor(); } else {
                    actionBtn.innerHTML = `
                        <button onclick="window.deleteReport()" class="text-rose-500 hover:text-rose-400 text-xs font-bold mr-3">Delete</button>
                        <button onclick="window.showEditor()" class="bg-slate-700 text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-slate-600 transition">Edit</button>`;
                    let adminMemoHtml = report.adminMemo ? `<div class="mt-4 p-4 bg-blue-500/10 border border-blue-500/30 rounded-xl"><p class="text-[10px] font-black text-blue-400 uppercase mb-1">Admin Memo</p><p class="text-xs text-blue-200 italic leading-relaxed">${report.adminMemo}</p></div>` : "";
                    container.innerHTML = `
                        <div class="bg-slate-900 p-6 rounded-2xl border ${report.status === 'Completed' ? 'border-green-900/50' : 'border-slate-800'} shadow-lg animate-fadeIn">
                            <div class="flex justify-between items-center mb-6">
                                <div class="flex items-center gap-3">
                                    <span class="text-blue-400 text-xs font-black uppercase tracking-widest">Work Report</span>
                                    <span class="px-2 py-0.5 rounded text-[9px] font-black uppercase ${report.status === 'Completed' ? 'bg-emerald-500/20 text-emerald-500' : report.status === 'Pending' ? 'bg-amber-500/20 text-amber-500' : 'bg-blue-500/20 text-blue-400'}">${report.status || 'In Progress'}</span>
                                </div>
                                <span class="text-slate-500 text-[10px] font-mono">${selectedDateStr}</span>
                            </div>
                            <div class="space-y-6">
                                <div><h4 class="text-[10px] font-black text-blue-500 uppercase tracking-tighter mb-2">Today's To-Do</h4><p class="text-slate-200 text-sm leading-relaxed whitespace-pre-wrap">${report.todo || '-'}</p></div>
                                <div><h4 class="text-[10px] font-black text-emerald-500 uppercase tracking-tighter mb-2">Work Summary</h4><p class="text-slate-200 text-sm leading-relaxed whitespace-pre-wrap">${report.summary || report.content || '-'}</p></div>
                            </div>
                            ${adminMemoHtml}
                            <div class="mt-6 pt-4 border-t border-slate-800 text-right"><span class="text-[10px] text-slate-500 italic">Last Update: ${report.time || 'N/A'}</span></div>
                        </div>`;
                }
            });
        };

function renderMiniCalendar() {
    const year = viewDate.getFullYear();
    const month = viewDate.getMonth();
    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();
    const monthName = viewDate.toLocaleString('en-US', { month: 'long' }).toUpperCase();
    
    // 연도 선택 셀렉트박스 생성
    let yearOptions = '';
    for (let y = year - 5; y <= year + 5; y++) { 
        yearOptions += `<option value="${y}" ${y === year ? 'selected' : ''}>${y}</option>`; 
    }
    document.getElementById('miniCalMonth').innerHTML = `${monthName} <select class="year-select" onchange="window.changeViewYear(this.value)">${yearOptions}</select>`;
    
    database.ref('reports').once('value', (snapshot) => {
        const allReports = snapshot.val() || {};
        const tbody = document.getElementById('miniCalBody');
        tbody.innerHTML = '';

        // --- 생산성 요약 카운트 변수 초기화 ---
        let summaryCount = { "Completed": 0, "Pending": 0, "In Progress": 0 };
        const currentMonthStr = `${year}-${String(month + 1).padStart(2, '0')}`; // 현재 보고 있는 "YYYY-MM"

        let date = 1;
        for (let i = 0; i < 6; i++) {
            let row = document.createElement('tr');
            for (let j = 0; j < 7; j++) {
                let cell = document.createElement('td');
                if ((i === 0 && j < firstDay) || date > lastDate) { 
                    row.appendChild(cell); 
                } else {
                    const curDate = date;
                    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(curDate).padStart(2, '0')}`;
                    
                    // 요일 색상 설정
                    let dayColorClass = "text-slate-500"; 
                    if (j === 0) dayColorClass = "text-sun";
                    else if (j === 6) dayColorClass = "text-sat";
                    if (dateStr === todayStr) dayColorClass = "text-blue-500";

                    let cellHTML = `<div class="date-num text-xs font-bold ${dayColorClass}">${curDate}</div>`;
                    const userReport = (allReports[dateStr] && allReports[dateStr][user]) ? allReports[dateStr][user] : null;

                    if (userReport) {
                        // --- 해당 월의 상태 카운트 합산 ---
                        const status = userReport.status || "In Progress";
                        if (summaryCount.hasOwnProperty(status)) {
                            summaryCount[status]++;
                        }
// [추가 코드] adminMemo가 있으면 빨간 점 표시
    if (userReport.adminMemo && userReport.adminMemo.trim() !== "") {
        cellHTML += `<div class="admin-dot" title="Admin feedback available"></div>`;
    }
                        let statusClass = status === 'Completed' ? "status-completed" : (status === 'Pending' ? "status-pending" : "status-progress");
                        let statusText = status === 'Completed' ? "COMPLETED" : (status === 'Pending' ? "PENDING" : "PROGRESS");
                        
                        const rawSummary = userReport.summary || userReport.content || "";
                        const shortSummary = rawSummary.length > 60 ? rawSummary.substring(0, 60) + "..." : rawSummary;
                        
                        cellHTML += `<div class="status-tag ${statusClass}">${statusText}</div>`;
                        
                        if (shortSummary.trim()) {
                            cellHTML += `<div class="report-tooltip">
                                <div class="text-blue-400 font-black text-[9px] mb-1 uppercase">Summary Preview</div>
                                <div class="leading-relaxed">${shortSummary}</div>
                            </div>`;
                        }
                    }
                    
                    cell.innerHTML = cellHTML;
                    if (dateStr === selectedDateStr) cell.classList.add('selected-date');
                    cell.onclick = () => loadReport(dateStr);
                    row.appendChild(cell);
                    date++;
                }
            }
            tbody.appendChild(row);
            if (date > lastDate) break;
        }

        // --- 캘린더 하단 요약 수치 업데이트 (HTML 엘리먼트가 존재할 경우) ---
        if (document.getElementById('countCompleted')) {
            document.getElementById('countCompleted').innerText = summaryCount["Completed"];
            document.getElementById('countPending').innerText = summaryCount["Pending"];
            document.getElementById('countProgress').innerText = summaryCount["In Progress"];
        }
    });
}


        window.openCopyFromPicker = function() {
            if (!document.getElementById('hiddenCopyInput')) {
                const input = document.createElement('input');
                input.id = 'hiddenCopyInput';
                input.style.display = 'none';
                document.body.appendChild(input);
            }
            if (window.copyPicker) window.copyPicker.destroy();
            window.copyPicker = flatpickr("#hiddenCopyInput", {
                theme: "dark", maxDate: "today", onChange: function(selectedDates, dateStr) {
                    if (confirm(`Do you want to copy the report content from ${dateStr}?`)) {
                        database.ref('reports/' + dateStr + '/' + user).once('value', (snapshot) => {
                            const data = snapshot.val();
                            if (data) {
                                const todoEl = document.getElementById('editTodo');
                                const summaryEl = document.getElementById('editSummary');
                                if(todoEl) todoEl.value = data.todo || "";
                                if(summaryEl) summaryEl.value = data.summary || data.content || "";
                                window.saveToTemp();
                                alert("Data copied successfully.");
                            } else { alert("No report found for the selected date."); }
                        });
                    }
                }
            });
            window.copyPicker.open();
        };

        window.showEditor = function() {
            document.getElementById('actionButtons').innerHTML = '';
            const container = document.getElementById('workCardContainer');
            const serverReport = currentReportData || { todo: "", summary: "", status: "In Progress", content: "" };
            const tempRaw = localStorage.getItem(getTempKey(selectedDateStr));
            let report = serverReport;
            let hasTemp = false;
            if (tempRaw) {
                const tempData = JSON.parse(tempRaw);
                report = { ...serverReport, todo: tempData.todo || serverReport.todo, summary: tempData.summary || serverReport.summary || serverReport.content, status: tempData.status || serverReport.status };
                hasTemp = true;
            }
            const isNew = !currentReportData; 
            container.innerHTML = `
                <div class="bg-slate-900 p-6 rounded-2xl border border-blue-500/50 shadow-lg animate-fadeIn">
                    <div class="flex justify-between items-center mb-5">
                        <div class="flex flex-col"><span class="text-blue-400 text-xs font-black uppercase tracking-widest">${isNew ? 'New Report' : 'Edit Report'}</span>${hasTemp ? '<span class="text-rose-500 text-[8px] animate-pulse font-bold mt-1">(Temp Data Restored)</span>' : ''}</div>
                        <div class="flex items-center gap-3">
<button onclick="window.openCopyFromPicker()" class="bg-blue-600/20 text-blue-400 border border-blue-500/40 px-3 py-1.5 rounded-lg text-[10px] font-black hover:bg-blue-600 hover:text-white transition uppercase tracking-tighter">📋 Copy from date</button>
<span class="text-slate-500 text-[10px] font-mono border-l border-slate-700 pl-3">${selectedDateStr}</span></div>
                    </div>
                    <div class="mb-4"><label class="block text-[10px] font-bold text-slate-500 uppercase mb-2">Status</label><select id="editStatus" onchange="window.saveToTemp()" class="w-full bg-slate-800 text-white p-2 rounded-xl border border-slate-700 outline-none text-sm"><option value="In Progress" ${report.status === 'In Progress' ? 'selected' : ''}>In Progress</option><option value="Completed" ${report.status === 'Completed' ? 'selected' : ''}>Completed</option><option value="Pending" ${report.status === 'Pending' ? 'selected' : ''}>Pending</option></select></div>
                    <div class="mb-4"><label class="block text-[10px] font-bold text-blue-500 uppercase mb-2">Today's To-Do</label><textarea id="editTodo" oninput="window.saveToTemp()" placeholder="Enter planned tasks..." class="w-full bg-slate-800 text-white p-3 rounded-xl border border-slate-700 outline-none text-sm min-h-[100px] resize-none focus:border-blue-500 transition">${report.todo || ''}</textarea></div>
                    <div class="mb-5"><label class="block text-[10px] font-bold text-emerald-500 uppercase mb-2">Work Summary</label><textarea id="editSummary" oninput="window.saveToTemp()" placeholder="Enter work results..." class="w-full bg-slate-800 text-white p-3 rounded-xl border border-slate-700 outline-none text-sm min-h-[150px] resize-none focus:border-emerald-500 transition">${report.summary || report.content || ''}</textarea></div>
                    <div class="flex flex-col gap-2"><button onclick="window.saveReport()" class="w-full bg-blue-600 text-white py-4 rounded-xl text-sm font-black hover:bg-blue-500 transition shadow-lg shadow-blue-900/20 uppercase tracking-widest">Save Report</button><button onclick="if(confirm('Discard all changes?')){ window.clearTemp('${selectedDateStr}'); window.loadReport('${selectedDateStr}'); }" class="w-full bg-slate-800 text-slate-400 py-2 rounded-xl text-[10px] font-bold hover:bg-slate-700 transition">Discard Changes</button></div>
                </div>`;
        };
        loadReport(selectedDateStr);
    })();
</script>
