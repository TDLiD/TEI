<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
    /* 캘린더 및 기본 레이아웃 */
    .mini-cal { width: 100%; border-collapse: collapse; }
    .mini-cal th { padding: 10px 0; color: #64748b; font-size: 0.8rem; text-transform: uppercase; }
    .mini-cal td { height: 70px; width: 14.28%; border: 1px solid #1e293b; vertical-align: top; padding: 6px; cursor: pointer; transition: all 0.2s; position: relative; }
    .mini-cal td:hover, .mini-cal td.has-report:hover { background-color: #1e293b; cursor: pointer; }
    .selected-date { background-color: rgba(59, 130, 246, 0.15) !important; border: 2px solid #3b82f6 !important; }
    .selected-date .date-num { color: #3b82f6; font-weight: 900; }
    .report-card-fixed { max-width: 400px; width: 100%; }
    .nav-btn:hover { background-color: #1e293b; color: #3b82f6; }
    .text-sun { color: #ef4444 !important; }
    .text-sat { color: #3b82f6 !important; }

    /* 상태 태그 */
    .status-tag { position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%); font-size: 8px; font-weight: 900; padding: 2px 5px; border-radius: 4px; white-space: nowrap; pointer-events: none; }
    .status-progress { background: rgba(59, 130, 246, 0.2); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.3); }
    .status-completed { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
    .status-pending { background: rgba(245, 158, 11, 0.2); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); }

    /* 드롭다운 및 버튼 */
    .export-dropdown { position: relative; display: inline-block; }
    .export-content { display: none; position: absolute; right: 0; background: #0f172a; min-width: 140px; box-shadow: 0 8px 16px rgba(0,0,0,0.5); z-index: 50; border: 1px solid #1e293b; border-radius: 12px; overflow: hidden; }
    .export-content button { width: 100%; padding: 10px 15px; text-align: left; font-size: 10px; font-weight: 800; color: #94a3b8; transition: all 0.2s; text-transform: uppercase; }
    .export-content button:hover { background: #1e293b; color: #3b82f6; }
    .export-dropdown:hover .export-content { display: block; }
    .import-btn { background: rgba(59, 130, 246, 0.1); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.3); }
    .import-btn:hover { background: #3b82f6; color: white; }
    .year-select { background: transparent; color: #3b82f6; font-weight: 900; cursor: pointer; padding: 0 4px; border: none; outline: none; appearance: none; }
    .year-select option { background: #0f172a; color: white; padding: 10px; }

    /* 호버 팝업 및 알림 */
    #reportHoverPopup { position: fixed; z-index: 10000; pointer-events: none; background: #1e293b; border: 1px solid #3b82f6; padding: 12px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 280px; display: none; font-size: 0.75rem; color: #f1f5f9; }
    .popup-label { color: #64748b; font-weight: 800; font-size: 0.65rem; text-transform: uppercase; margin-bottom: 2px; display: block; }
    .popup-content { margin-bottom: 8px; white-space: pre-wrap; word-break: break-all; color: #3b82f6; line-height: 1.4; }
    .admin-dot { position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; background: #ef4444; border-radius: 50%; box-shadow: 0 0 5px rgba(239, 68, 68, 0.8); z-index: 10; }

    /* 스태프 리스트 및 모달 */
    .staff-list-container { margin-top: 20px; background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 15px; }
    .staff-list-title { font-size: 0.75rem; font-weight: 900; color: #94a3b8; text-transform: uppercase; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .staff-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .staff-item { background: #1e293b; padding: 10px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; transition: all 0.2s; }
    .staff-item:hover { border-color: #3b82f6; background: #262f3f; }
    .staff-name { font-size: 0.85rem; font-weight: 700; color: #f1f5f9; display: block; }
    .staff-status { font-size: 0.65rem; font-weight: 800; padding: 2px 6px; border-radius: 4px; margin-top: 4px; display: inline-block; }
    .report-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 20000; align-items: center; justify-content: center; padding: 20px; }
    .modal-content { background: #0f172a; border: 1px solid #3b82f6; width: 100%; max-width: 500px; border-radius: 20px; padding: 25px; position: relative; max-height: 80vh; overflow-y: auto; }
    .modal-close { position: absolute; top: 15px; right: 15px; color: #94a3b8; cursor: pointer; font-size: 1.5rem; }
    .modal-close:hover { color: white; }
/* 미작성 날짜 깜빡임 효과 */
@keyframes blink-red {
    0%, 100% { opacity: 1; color: #ef4444; }
    50% { opacity: 0.3; color: #7f1d1d; }
}
.blink-text {
    animation: blink-red 1s infinite;
    font-weight: 900;
}
</style>

<div class="animate-fadeIn flex flex-col lg:flex-row gap-6 items-start">
    <div class="report-card-fixed">
        <div class="flex justify-between items-center mb-6">
            <h3 class="text-xl font-bold text-white">Work Report Detail</h3>
            <div id="actionButtons"></div>
        </div>
        <div id="workCardContainer"><div class="text-slate-500 animate-pulse text-sm">Loading...</div></div>
    </div>
    <div class="flex-1 w-full"> 
        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-700 shadow-xl">
            <div class="flex flex-wrap justify-between items-center mb-4 gap-4 px-1">
                <div class="flex items-center gap-4">
                    <div id="miniCalMonth" class="text-lg font-black text-white italic"></div>
                    <div class="flex bg-slate-800 rounded-lg p-1">
                        <button onclick="window.changeViewMonth(-1)" class="nav-btn px-2 py-1 text-slate-400 rounded-md text-[10px] font-black">PREV</button>
                        <button onclick="window.goToday()" class="nav-btn px-2 py-1 text-blue-400 rounded-md text-[10px] font-black mx-1">TODAY</button>

                    </div>

                <div class="flex items-center gap-2">
                    <input type="file" id="excelImportInput" accept=".xlsx, .xls" class="hidden" onchange="window.importStaffReport(event)">
                    <button onclick="document.getElementById('excelImportInput').click()" class="import-btn px-3 py-1.5 rounded-lg text-[10px] font-black transition uppercase tracking-widest flex items-center gap-1">Excel Import ⬆</button>
                    <div class="export-dropdown">
                        <button class="bg-emerald-600/20 text-emerald-500 border border-emerald-500/30 px-3 py-1.5 rounded-lg text-[10px] font-black hover:bg-emerald-600 hover:text-white transition uppercase tracking-widest flex items-center gap-1">Excel Export ▾</button>
                        <div class="export-content">
                            <button onclick="window.exportStaffReport('monthly')">Monthly Report</button>
                            <button onclick="window.exportStaffReport('yearly')">Yearly Report</button>
                            <button onclick="window.exportStaffReport('all')">All-Time Overall</button>
                        </div>
                    </div>
                </div>
            </div>
            <table class="mini-cal w-full border-collapse">
                <thead><tr class="text-slate-500"><th class="text-sun">SUN</th><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th class="text-sat">SAT</th></tr></thead>
                <tbody id="miniCalBody"></tbody>
            </table>
<div id="productivitySummary" class="mt-4 flex flex-col gap-3 bg-slate-800/30 p-4 rounded-xl border border-slate-700">
    <div class="flex flex-col gap-1">
        <span class="text-[10px] font-black text-slate-500 uppercase">Report Creation Date:</span>
        <div id="writtenDates" class="text-xs text-emerald-400 font-mono flex flex-wrap gap-x-2 italic">-</div>
    </div>
    <div class="flex flex-col gap-1">
        <span class="text-[10px] font-black text-slate-500 uppercase">Report Unwritten Date:</span>
        <div id="missingDates" class="text-xs font-mono flex flex-wrap gap-x-2 italic">-</div>
    </div>
</div>
            <div id="staffListArea" class="staff-list-container hidden">
                <div class="staff-list-title"><span>Staff Reports - <span id="targetDateDisplay"></span></span><span id="staffCount" class="text-blue-500">0 persons</span></div>
                <div id="staffGrid" class="staff-grid"></div>
            </div>
            <div id="reportDetailModal" class="report-modal" onclick="if(event.target===this) window.closeModal()">
                <div class="modal-content animate-fadeIn"><span class="modal-close" onclick="window.closeModal()">&times;</span><div id="modalBody"></div><button onclick="window.closeModal()" class="w-full mt-6 bg-slate-800 text-slate-300 py-3 rounded-xl text-sm font-bold hover:bg-slate-700">Close</button></div>
            </div>
        </div>
    </div>
</div>
<div id="reportHoverPopup"></div>

<script>
(function() {
    const user = sessionStorage.getItem('loggedInUser');
    const db = firebase.database();
    let viewDate = new Date(), selectedDateStr = new Date().toISOString().split('T')[0], currentReportData = null;

    if (!user || user === "null") {
        alert("Login required.");
        if(document.getElementById('workCardContainer')) document.getElementById('workCardContainer').innerHTML = '<p class="text-slate-500">Login is required.</p>';
        return; 
    }

    const getTempKey = (date) => `temp_report_${user}_${date}`;
    const escapeHtml = (s) => s ? s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#039;"}[m])) : '-';

    window.importStaffReport = (e) => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const data = new Uint8Array(ev.target.result), workbook = XLSX.read(data, {type:'array', cellDates:true});
                const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                if (!jsonData.length || !confirm(`Save ${jsonData.length} records?`)) return;
                let sc = 0;
                Promise.all(jsonData.map(row => {
                    let rd = row["Date"], dk = "";
                    if (typeof rd === 'number') dk = new Date(Math.round((rd - 25569) * 86400 * 1000)).toISOString().split('T')[0];
                    else if (rd instanceof Date) dk = rd.toISOString().split('T')[0];
                    else if (typeof rd === 'string') dk = rd.trim();
                    if (!/^\d{4}-\d{2}-\d{2}$/.test(dk)) return Promise.resolve();
                    return db.ref(`reports/${dk}/${user}`).set({
                        status: row["Status"] || "In Progress", todo: row["To-Do"] || "", summary: row["Summary"] || "",
                        adminMemo: row["Admin Memo"] || "", time: row["Update Time"] || new Date().getHours().toString().padStart(2,'0')+":00"
                    }).then(() => sc++);
                })).then(() => { alert(`Imported ${sc} reports.`); window.loadReport(selectedDateStr); e.target.value=''; });
            } catch(err) { alert("Parsing error."); }
        }; reader.readAsArrayBuffer(file);
    };

    window.exportStaffReport = (mode) => {
        const y = viewDate.getFullYear(), m = viewDate.getMonth() + 1;
        db.ref('reports').once('value', (snap) => {
            const allData = snap.val() || {}, rows = [], sDates = Object.keys(allData).sort();
            let fn = "";
            sDates.forEach(dk => {
                const r = allData[dk]?.[user]; if (!r) return;
                const [ry, rm] = dk.split('-').map(Number);
                let inc = (mode==='monthly' && ry===y && rm===m) || (mode==='yearly' && ry===y) || (mode==='all');
                if (inc) {
                    if(!fn) fn = mode==='monthly' ? `WorkReport_${user}_${y}-${String(m).padStart(2,'0')}.xlsx` : mode==='yearly' ? `WorkReport_${user}_Year_${y}.xlsx` : `WorkReport_${user}_AllTime.xlsx`;
                    rows.push({"Date":dk, "Status":r.status||"In Progress", "To-Do":r.todo||"", "Summary":r.summary||r.content||"", "Admin Memo":r.adminMemo||"", "Update Time":r.time||""});
                }
            });
            if (!rows.length) return alert("No data.");
            const ws = XLSX.utils.json_to_sheet(rows), wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Report");
            const range = XLSX.utils.decode_range(ws['!ref']);
            for (let R = range.s.r; R <= range.e.r; ++R) {
                for (let C = range.s.c; C <= range.e.c; ++C) {
                    const addr = XLSX.utils.encode_cell({r:R, c:C}); if (!ws[addr]) continue;
                    ws[addr].s = { alignment:{wrapText:true, vertical:'top', horizontal:'left'}, font:{name:'Arial', sz:10} };
                    if (R === 0) { ws[addr].s.fill = {fgColor:{rgb:"F2F2F2"}}; ws[addr].s.font.bold = true; }
                }
            }
            ws['!cols'] = [{wch:12}, {wch:12}, {wch:45}, {wch:55}, {wch:35}, {wch:12}];
            XLSX.writeFile(wb, fn);
        });
    };

    window.updateCharCount = (tid, cid) => {
        const t = document.getElementById(tid), c = document.getElementById(cid), max = 2000;
        if (t.value.length > max) { alert("Max 2,000 characters exceeded."); t.value = t.value.substring(0, max); }
        c.innerText = `${t.value.length}/${max}`;
        c.style.color = t.value.length >= max ? "#ef4444" : "#64748b";
        c.style.fontWeight = t.value.length >= max ? "900" : "normal";
        if(window.saveToTemp) window.saveToTemp();
    };
    window.saveToTemp = () => {
        let td = document.getElementById('editTodo')?.value || "", sm = document.getElementById('editSummary')?.value || "";
        const st = document.getElementById('editStatus')?.value, max = 2000;
        const data = { todo:td.substring(0,max), summary:sm.substring(0,max), status:st, timestamp: Date.now() };
        localStorage.setItem(getTempKey(selectedDateStr), JSON.stringify(data));
    };

    window.clearTemp = (d) => localStorage.removeItem(getTempKey(d));
    window.changeViewMonth = (o) => { viewDate.setMonth(viewDate.getMonth() + o); if(typeof renderMiniCalendar==='function') renderMiniCalendar(); };
    window.goToday = () => { viewDate = new Date(); selectedDateStr = new Date().toISOString().split('T')[0]; window.loadReport(selectedDateStr); };

    window.saveReport = () => {
        const tdF = document.getElementById('editTodo'), smF = document.getElementById('editSummary'), stF = document.getElementById('editStatus'), max = 2000;
        if(!tdF.value.trim() && !smF.value.trim()) return alert("Enter content.");
        if((tdF.value.length > max || smF.value.length > max) && !confirm(`Exceeds ${max} chars. Save first ${max}?`)) return;
        const now = new Date(), time = now.getHours().toString().padStart(2,'0')+":"+now.getMinutes().toString().padStart(2,'0');
        const data = { todo:tdF.value.substring(0,max), summary:smF.value.substring(0,max), status:stF.value, time:time };
        if (currentReportData?.adminMemo) data.adminMemo = currentReportData.adminMemo;
        db.ref(`reports/${selectedDateStr}/${user}`).set(data).then(() => { alert("Saved."); window.clearTemp(selectedDateStr); window.loadReport(selectedDateStr); }).catch(()=>alert("Error."));
    };

    window.deleteReport = () => {
        if (!confirm("Delete this report?")) return;
        db.ref(`reports/${selectedDateStr}/${user}`).remove().then(() => { alert("Deleted."); window.clearTemp(selectedDateStr); currentReportData = null; window.loadReport(selectedDateStr); });
    };

    window.loadReport = (ds) => {
        selectedDateStr = ds; const d = new Date(ds); viewDate.setFullYear(d.getFullYear()); viewDate.setMonth(d.getMonth());
        if(typeof renderMiniCalendar==='function') renderMiniCalendar();
        const ab = document.getElementById('actionButtons'); ab.innerHTML = '';
        db.ref(`reports/${ds}/${user}`).once('value', (snap) => {
            const r = snap.val(); currentReportData = r;
            const c = document.getElementById('workCardContainer');
            if (!r) { if(window.showEditor) window.showEditor(); } 
            else {
                ab.innerHTML = `<button onclick="window.deleteReport()" class="text-rose-500 hover:text-rose-400 text-xs font-bold mr-3">Delete</button><button onclick="window.showEditor()" class="bg-slate-700 text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-slate-600">Edit</button>`;
                const amH = r.adminMemo ? `<div class="mt-4 p-4 bg-blue-500/10 border border-blue-500/30 rounded-xl"><p class="text-[10px] font-black text-blue-400 uppercase mb-1">Admin Memo</p><p class="text-xs text-blue-200 italic leading-relaxed whitespace-pre-wrap">${escapeHtml(r.adminMemo)}</p></div>` : "";
                c.innerHTML = `<div class="bg-slate-900 p-6 rounded-2xl border ${r.status==='Completed'?'border-green-900/50':'border-slate-800'} shadow-lg animate-fadeIn"><div class="flex justify-between items-center mb-6"><div class="flex items-center gap-3"><span class="text-blue-400 text-xs font-black uppercase tracking-widest">Work Report</span><span class="px-2 py-0.5 rounded text-[9px] font-black uppercase ${r.status==='Completed'?'bg-emerald-500/20 text-emerald-500':r.status==='Pending'?'bg-amber-500/20 text-amber-500':'bg-blue-500/20 text-blue-400'}">${r.status||'In Progress'}</span></div><span class="text-slate-500 text-[10px] font-mono">${ds}</span></div><div class="space-y-6"><div><h4 class="text-[10px] font-black text-blue-500 uppercase tracking-tighter mb-2">Today's To-Do</h4><p class="text-slate-200 text-sm leading-relaxed whitespace-pre-wrap">${escapeHtml(r.todo)}</p></div><div><h4 class="text-[10px] font-black text-emerald-500 uppercase tracking-tighter mb-2">Work Summary</h4><p class="text-slate-200 text-sm leading-relaxed whitespace-pre-wrap">${escapeHtml(r.summary||r.content)}</p></div></div>${amH}<div class="mt-6 pt-4 border-t border-slate-800 text-right"><span class="text-[10px] text-slate-500 italic">Last Update: ${r.time||'N/A'}</span></div></div>`;
            }
        });
    };

function getSafeText(html) {
    if (!html) return "";
    let tmp = document.createElement("DIV");
    tmp.innerHTML = html;
    let text = tmp.textContent || tmp.innerText || "";
    
    // 1. 따옴표 처리 (JS 오류 방지)
    // 2. 줄바꿈(\n)을 HTML 줄바꿈(<br>)으로 변환하여 팝업에서 줄바꿈 유지
    return text.replace(/'/g, "\\'").replace(/\n/g, "<br>");
}

// 팝업 표시/이동/숨기기 함수
window.showReportPopup = function(event, todo, summary) {
    const popup = document.getElementById('reportHoverPopup');
    if(!popup) return;
    
    popup.innerHTML = `
        <span class="popup-label">To-Do</span>
        <div class="popup-content">${todo || 'No data'}</div>
        <span class="popup-label" style="color:#10b981">Summary</span>
        <div class="popup-content" style="color:#f1f5f9">${summary || 'No data'}</div>
    `;
    popup.style.display = 'block';
    window.moveReportPopup(event);
};

window.moveReportPopup = function(event) {
    const popup = document.getElementById('reportHoverPopup');
    if(!popup) return;
    popup.style.left = (event.clientX + 15) + 'px';
    popup.style.top = (event.clientY + 15) + 'px';
};

window.hideReportPopup = function() {
    const popup = document.getElementById('reportHoverPopup');
    if(popup) popup.style.display = 'none';
};


function renderMiniCalendar() {
    const year = viewDate.getFullYear();
    const month = viewDate.getMonth();
    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();
    const monthName = viewDate.toLocaleString('en-US', { month: 'long' }).toUpperCase();
    
    const todayStr = new Date().toISOString().split('T')[0];

    // Year selection
    let yearOptions = '';
    for (let y = year - 5; y <= year + 5; y++) { 
        yearOptions += `<option value="${y}" ${y === year ? 'selected' : ''}>${y}</option>`; 
    }
    document.getElementById('miniCalMonth').innerHTML = `${monthName} <select class="year-select" onchange="window.changeViewYear(this.value)">${yearOptions}</select>`;
    
    db.ref('reports').once('value', (snapshot) => {
        const allReports = snapshot.val() || {};
        const tbody = document.getElementById('miniCalBody');
        tbody.innerHTML = '';

        // --- [수정] 최근 7일 작성 여부 체크 로직 추가 ---
        const writtenDatesContainer = document.getElementById('writtenDates');
        const missingDatesContainer = document.getElementById('missingDates');
        
        if (writtenDatesContainer && missingDatesContainer) {
            let writtenArr = [];
            let missingArr = [];
            
            for (let i = 0; i < 7; i++) {
                let d = new Date();
                d.setDate(d.getDate() - i);
                let dStr = d.toISOString().split('T')[0];
                
                // 로그인한 staff(user)의 리포트가 있는지 확인
                if (allReports[dStr] && allReports[dStr][user]) {
                    writtenArr.push(dStr);
                } else {
                    missingArr.push(dStr);
                }
            }
            
            writtenDatesContainer.innerHTML = writtenArr.length > 0 
                ? writtenArr.map(date => `<span class="mr-2">${date}</span>`).join('') 
                : '<span class="text-slate-600">No records</span>';
                
            missingDatesContainer.innerHTML = missingArr.length > 0 
                ? missingArr.map(date => `<span class="blink-text mr-2">${date}</span>`).join('') 
                : '<span class="text-emerald-500 font-black text-[10px]">ALL COMPLETED!</span>';
        }
        // ------------------------------------------

        let summaryCount = { "Completed": 0, "Pending": 0, "In Progress": 0 };
        let date = 1;

        for (let i = 0; i < 6; i++) {
            let row = document.createElement('tr');
            for (let j = 0; j < 7; j++) {
                let cell = document.createElement('td');
                if ((i === 0 && j < firstDay) || date > lastDate) { 
                    row.appendChild(cell); 
                } else {
                    const curDate = date;
                    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(curDate).padStart(2, '0')}`;
                    
                    let dayColorClass = "text-slate-500"; 
                    if (j === 0) dayColorClass = "text-sun";
                    else if (j === 6) dayColorClass = "text-sat";
                    if (dateStr === todayStr) dayColorClass = "text-blue-500";

                    let cellHTML = `<div class="date-num text-xs font-bold ${dayColorClass}">${curDate}</div>`;
                    const userReport = (allReports[dateStr] && allReports[dateStr][user]) ? allReports[dateStr][user] : null;

                    if (userReport) {
                        cell.classList.add('has-report');
                        const status = userReport.status || "In Progress";
                        if (summaryCount.hasOwnProperty(status)) {
                            summaryCount[status]++;
                        }

                        if (userReport.adminMemo && userReport.adminMemo.trim() !== "") {
                            cellHTML += `<div class="admin-dot" title="Admin feedback available"></div>`;
                        }

                        let statusClass = status === 'Completed' ? "status-completed" : (status === 'Pending' ? "status-pending" : "status-progress");
                        let statusText = status === 'Completed' ? "COMPLETED" : (status === 'Pending' ? "PENDING" : "PROGRESS");
                        
                        cellHTML += `<div class="status-tag ${statusClass}">${statusText}</div>`;
                        
                        const safeTodo = getSafeText(userReport.todo || "-");
                        const safeSummary = getSafeText(userReport.summary || userReport.content || "-");

                        cell.onmouseenter = (e) => window.showReportPopup(e, safeTodo, safeSummary);
                        cell.onmousemove = (e) => window.moveReportPopup(e);
                        cell.onmouseleave = () => window.hideReportPopup();
                    }
                    
                    cell.innerHTML = cellHTML;
                    if (dateStr === selectedDateStr) cell.classList.add('selected-date');
                    cell.onclick = () => {
                        window.hideReportPopup();
                        window.loadReport(dateStr);
                    };
                    row.appendChild(cell);
                    date++;
                }
            }
            tbody.appendChild(row);
            if (date > lastDate) break;
        }

        // 기존 요약 카운트 업데이트 (필요 시 유지)
        if (document.getElementById('countCompleted')) {
            document.getElementById('countCompleted').innerText = summaryCount["Completed"];
            document.getElementById('countPending').innerText = summaryCount["Pending"];
            document.getElementById('countProgress').innerText = summaryCount["In Progress"];
        }
    });
}

        window.openCopyFromPicker = function() {
            if (!document.getElementById('hiddenCopyInput')) {
                const input = document.createElement('input');
                input.id = 'hiddenCopyInput';
                input.style.display = 'none';
                document.body.appendChild(input);
            }
            if (window.copyPicker) window.copyPicker.destroy();
            window.copyPicker = flatpickr("#hiddenCopyInput", {
                theme: "dark", maxDate: "today", onChange: function(selectedDates, dateStr) {
                    if (confirm(`Do you want to copy the report content from ${dateStr}?`)) {
                        database.ref('reports/' + dateStr + '/' + user).once('value', (snapshot) => {
                            const data = snapshot.val();
                            if (data) {
                                const todoEl = document.getElementById('editTodo');
                                const summaryEl = document.getElementById('editSummary');
                                if(todoEl) todoEl.value = data.todo || "";
                                if(summaryEl) summaryEl.value = data.summary || data.content || "";
                                window.saveToTemp();
                                alert("Data copied successfully.");
                            } else { alert("No report found for the selected date."); }
                        });
                    }
                }
            });
            window.copyPicker.open();
        };

// loadReport 함수 끝부분에 아래 내용을 추가하여 전체 리스트를 갱신하도록 합니다.
// (window.loadReport 정의 부분의 마지막에 아래 로직을 병합하세요)
const originalLoadReport = window.loadReport;
window.loadReport = function(dateStr) {
    originalLoadReport(dateStr); // 기존 기능 유지
    
    // 추가: Staff 리스트 갱신 로직
    const staffListArea = document.getElementById('staffListArea');
    const staffGrid = document.getElementById('staffGrid');
    const targetDateDisplay = document.getElementById('targetDateDisplay');
    
    firebase.database().ref(`reports/${dateStr}`).once('value', (snapshot) => {
        const staffData = snapshot.val();
        staffGrid.innerHTML = '';
        targetDateDisplay.innerText = dateStr;
        
        if (staffData) {
            const staffNames = Object.keys(staffData);
            document.getElementById('staffCount').innerText = `${staffNames.length} persons`;
            
            staffNames.forEach(name => {
                const data = staffData[name];
                const statusClass = data.status === 'Completed' ? "status-completed" : (data.status === 'Pending' ? "status-pending" : "status-progress");
                
                const item = document.createElement('div');
                item.className = 'staff-item';
                item.onclick = () => window.openStaffDetail(name, dateStr);
                item.innerHTML = `
                    <span class="staff-name">${name}</span>
                    <span class="staff-status ${statusClass}">${data.status || 'In Progress'}</span>
                `;
                staffGrid.appendChild(item);
            });
            staffListArea.classList.remove('hidden');
        } else {
            staffListArea.classList.add('hidden');
        }
    });
};

// 1. 자동 높이 조절 함수 (Script 상단에 선언되어 있어야 합니다)
window.autoResize = function(obj) {
    if (!obj) return;
    obj.style.height = 'auto'; 
    obj.style.height = (obj.scrollHeight) + 'px';
};

window.showEditor = function() {
    document.getElementById('actionButtons').innerHTML = '';
    const container = document.getElementById('workCardContainer');
    const serverReport = currentReportData || { todo: "", summary: "", status: "In Progress", content: "" };
    const tempRaw = localStorage.getItem(getTempKey(selectedDateStr));
    let report = serverReport, hasTemp = false, max = 2000;

    if (tempRaw) {
        const tmp = JSON.parse(tempRaw);
        report = { ...serverReport, ...tmp };
        report.summary = tmp.summary || serverReport.summary || serverReport.content;
        hasTemp = true;
    }

    const isNew = !currentReportData;
    const s = report.status, t = report.todo || '', c = report.summary || report.content || '';

    container.innerHTML = `
        <div class="bg-slate-900 p-6 rounded-2xl border border-blue-500/50 shadow-lg animate-fadeIn">
            <div class="flex justify-between items-center mb-5">
                <div class="flex flex-col">
                    <span class="text-blue-400 text-xs font-black uppercase tracking-widest">${isNew ? 'New' : 'Edit'} Report</span>
                    ${hasTemp ? '<span class="text-rose-500 text-[8px] animate-pulse font-bold mt-1">(Temp Data Restored)</span>' : ''}
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="window.openCopyFromPicker()" class="bg-blue-600/20 text-blue-400 border border-blue-500/40 px-3 py-1.5 rounded-lg text-[10px] font-black hover:bg-blue-600 transition uppercase tracking-tighter">📋 Copy from date</button>
                    <span class="text-slate-500 text-[10px] font-mono border-l border-slate-700 pl-3">${selectedDateStr}</span>
                </div>
            </div>

            <div class="mb-4">
                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-2">Status</label>
                <select id="editStatus" onchange="window.saveToTemp()" class="w-full bg-slate-800 text-white p-2 rounded-xl border border-slate-700 text-sm outline-none">
                    ${['In Progress', 'Completed', 'Pending'].map(v => `<option value="${v}" ${s===v?'selected':''}>${v}</option>`).join('')}
                </select>
            </div>

            ${[['Todo', 'blue', t], ['Summary', 'emerald', c]].map(([id, col, val]) => `
                <div class="mb-4">
                    <div class="flex justify-between items-end mb-2">
                        <label class="text-[10px] font-bold text-${col}-500 uppercase">Today's ${id}</label>
                        <span id="${id.toLowerCase()}Count" class="text-[9px] text-slate-500 font-mono">${val.length}/${max}</span>
                    </div>
                    <textarea id="edit${id}" 
                        oninput="window.autoResize(this); window.updateCharCount('edit${id}', '${id.toLowerCase()}Count');" 
                        class="w-full bg-slate-800 text-white p-3 rounded-xl border border-slate-700 text-sm min-h-[${id==='Todo'?'100':'150'}px] resize-none focus:border-${col}-500 transition outline-none overflow-hidden" 
                        style="height: auto;"
                        placeholder="Enter ${id}...">${val}</textarea>
                </div>`).join('')}

            <div class="flex flex-col gap-2">
                <button onclick="window.saveReport()" class="w-full bg-blue-600 text-white py-4 rounded-xl text-sm font-black hover:bg-blue-500 transition uppercase tracking-widest shadow-lg shadow-blue-900/20">Save Report</button>
                <button onclick="window.cancelEdit()" class="w-full bg-slate-800 text-slate-400 py-2 rounded-xl text-[10px] font-bold hover:bg-slate-700 transition">Cancel / Discard Changes</button>
            </div>
        </div>`;

    // 초기화 및 데이터 로드 시 실행
    ['editTodo', 'editSummary'].forEach(id => {
        const el = document.getElementById(id);
        if (el) {
            window.updateCharCount(id, id.replace('edit', '').toLowerCase() + 'Count');
            window.autoResize(el); // 텍스트 내용에 맞춰 높이 즉시 조정
        }
    });
};

window.cancelEdit = function() {
    if (confirm("Discard changes and return?")) {
        window.clearTemp(selectedDateStr);
        window.loadReport(selectedDateStr);
    }
};

        loadReport(selectedDateStr);
    })();
