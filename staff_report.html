<script>
    (function() {
        const user = sessionStorage.getItem('loggedInUser');

// 이 체크 루틴을 반드시 넣으세요 (leave 방식)
    if (!user || user === "null") {
        alert("Login required.");
        // 화면에 안내 메시지 표시 (선택)
        const container = document.getElementById('workCardContainer');
        if(container) container.innerHTML = '<p class="text-slate-500">Login is required.</p>';
        return; 
    }

        const database = firebase.database();
        let viewDate = new Date();
        const todayStr = new Date().toISOString().split('T')[0];
        let selectedDateStr = todayStr;
        let currentReportData = null;

        window.importStaffReport = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array', cellDates: true });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonData = XLSX.utils.sheet_to_json(firstSheet);
                    if (jsonData.length === 0) {
                        alert("No data found to import.");
                        return;
                    }
                    if (!confirm(`Do you want to save ${jsonData.length} records?`)) {
                        event.target.value = '';
                        return;
                    }
                    let successCount = 0;
                    const promises = jsonData.map(row => {
                        let rawDate = row["Date"];
                        let dateKey = "";
                        if (typeof rawDate === 'number') {
                            const jsDate = new Date(Math.round((rawDate - 25569) * 86400 * 1000));
                            dateKey = jsDate.toISOString().split('T')[0];
                        } else if (rawDate instanceof Date) {
                            dateKey = rawDate.toISOString().split('T')[0];
                        } else if (typeof rawDate === 'string') {
                            dateKey = rawDate.trim();
                        }
                        if (!dateKey || !/^\d{4}-\d{2}-\d{2}$/.test(dateKey)) return Promise.resolve();
                        const reportData = {
                            status: row["Status"] || "In Progress",
                            todo: row["To-Do"] || "",
                            summary: row["Summary"] || "",
                            adminMemo: row["Admin Memo"] || "",
                            time: row["Update Time"] || new Date().getHours().toString().padStart(2, '0') + ":00"
                        };
                        return database.ref(`reports/${dateKey}/${user}`).set(reportData).then(() => { successCount++; });
                    });
                    Promise.all(promises).then(() => {
                        alert(`Successfully imported ${successCount} reports.`);
                        window.loadReport(selectedDateStr);
                        event.target.value = '';
                    });
                } catch (err) {
                    alert("An error occurred while parsing the file.");
                }
            };
            reader.readAsArrayBuffer(file);
        };

        window.exportStaffReport = function(mode) {
            const year = viewDate.getFullYear();
            const month = viewDate.getMonth() + 1;
            let fileName = "";
            database.ref('reports').once('value', (snapshot) => {
                const allData = snapshot.val() || {};
                const exportRows = [];
                const sortedDates = Object.keys(allData).sort();
                sortedDates.forEach(dateKey => {
                    const report = (allData[dateKey] && allData[dateKey][user]) ? allData[dateKey][user] : null;
                    if (!report) return;
                    const [rYear, rMonth] = dateKey.split('-').map(Number);
                    let shouldInclude = false;
                    if (mode === 'monthly') {
                        if (rYear === year && rMonth === month) shouldInclude = true;
                        fileName = `WorkReport_${user}_${year}-${String(month).padStart(2,'0')}.xlsx`;
                    } else if (mode === 'yearly') {
                        if (rYear === year) shouldInclude = true;
                        fileName = `WorkReport_${user}_Year_${year}.xlsx`;
                    } else if (mode === 'all') {
                        shouldInclude = true;
                        fileName = `WorkReport_${user}_AllTime.xlsx`;
                    }
                    if (shouldInclude) {
                        exportRows.push({
                            "Date": dateKey,
                            "Status": report.status || "In Progress",
                            "To-Do": report.todo || "",
                            "Summary": report.summary || report.content || "",
                            "Admin Memo": report.adminMemo || "",
                            "Update Time": report.time || ""
                        });
                    }
                });
                if (exportRows.length === 0) {
                    alert("No report data found.");
                    return;
                }
                const worksheet = XLSX.utils.json_to_sheet(exportRows);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "Report");
                const range = XLSX.utils.decode_range(worksheet['!ref']);
                for (let R = range.s.r; R <= range.e.r; ++R) {
                    for (let C = range.s.c; C <= range.e.c; ++C) {
                        const cellAddress = XLSX.utils.encode_cell({ r: R, c: C });
                        if (!worksheet[cellAddress]) continue;
                        worksheet[cellAddress].s = {
                            alignment: { wrapText: true, vertical: 'top', horizontal: 'left' },
                            font: { name: 'Arial', sz: 10 }
                        };
                        if (R === 0) {
                            worksheet[cellAddress].s.fill = { fgColor: { rgb: "F2F2F2" } };
                            worksheet[cellAddress].s.font.bold = true;
                        }
                    }
                }
                worksheet['!cols'] = [{ wch: 12 }, { wch: 12 }, { wch: 45 }, { wch: 55 }, { wch: 35 }, { wch: 12 }];
                XLSX.writeFile(workbook, fileName);
            });
        };

        const getTempKey = (date) => `temp_report_${user}_${date}`;
window.updateCharCount = function(textareaId, countId) {
    const textarea = document.getElementById(textareaId);
    const countEl = document.getElementById(countId);
    const maxLength = 2000;
    
    // 입력된 값이 최대치를 넘었는지 확인
    if (textarea.value.length > maxLength) {
        // 1. 알림창 표시
        alert("The maximum number of characters (2,000) has been exceeded.");
        
        // 2. 초과분 즉시 삭제
        textarea.value = textarea.value.substring(0, maxLength);
    }

    // 카운터 업데이트
    const finalLength = textarea.value.length;
    countEl.innerText = `${finalLength}/${maxLength}`;

    // 디자인 피드백
    if (finalLength >= maxLength) {
        countEl.style.color = "#ef4444"; 
        countEl.style.fontWeight = "900";
    } else {
        countEl.style.color = "#64748b";
        countEl.style.fontWeight = "normal";
    }
    
    // 임시 저장 호출
    if(window.saveToTemp) window.saveToTemp();
};

window.saveToTemp = function() {
    let todo = document.getElementById('editTodo')?.value || "";
    let summary = document.getElementById('editSummary')?.value || "";
    const status = document.getElementById('editStatus')?.value;
    const maxLength = 2000;

    // 데이터 안정성을 위해 다시 한번 절삭
    if (todo.length > maxLength) todo = todo.substring(0, maxLength);
    if (summary.length > maxLength) summary = summary.substring(0, maxLength);

    const tempData = { todo, summary, status, timestamp: new Date().getTime() };
    localStorage.setItem(getTempKey(selectedDateStr), JSON.stringify(tempData));
};

        window.clearTemp = function(date) { localStorage.removeItem(getTempKey(date)); };
        window.changeViewMonth = function(offset) { viewDate.setMonth(viewDate.getMonth() + offset); renderMiniCalendar(); };
        window.changeViewYear = function(year) { viewDate.setFullYear(parseInt(year)); renderMiniCalendar(); };
        window.goToday = function() { viewDate = new Date(); selectedDateStr = todayStr; loadReport(selectedDateStr); };

window.saveReport = function() {
    const todoField = document.getElementById('editTodo');
    const summaryField = document.getElementById('editSummary');
    const statusField = document.getElementById('editStatus');
    const maxLength = 2000;
    
    if(!todoField.value.trim() && !summaryField.value.trim()) return alert("Please enter at least one content.");
    
    // 최종 검증 로직
    if(todoField.value.length > maxLength || summaryField.value.length > maxLength) {
        if(!confirm(`Content exceeds ${maxLength} characters. Save only the first ${maxLength} characters?`)) {
            return; // 사용자가 취소를 누르면 저장을 멈추고 수정하게 함
        }
    }

    const now = new Date();
    const timeStr = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
    
    const saveData = { 
        todo: todoField.value.substring(0, maxLength), 
        summary: summaryField.value.substring(0, maxLength), 
        status: statusField.value, 
        time: timeStr 
    };
    
    if (currentReportData && currentReportData.adminMemo) saveData.adminMemo = currentReportData.adminMemo;
    
    database.ref('reports/' + selectedDateStr + '/' + user).set(saveData).then(() => {
        alert("Saved successfully.");
        window.clearTemp(selectedDateStr);
        loadReport(selectedDateStr);
    }).catch(() => alert("Failed to save."));
};

        window.deleteReport = function() {
            if (!confirm("Are you sure you want to delete this report?")) return;
            database.ref('reports/' + selectedDateStr + '/' + user).remove().then(() => {
                alert("Deleted successfully.");
                window.clearTemp(selectedDateStr);
                currentReportData = null;
                loadReport(selectedDateStr);
            });
        };

        window.loadReport = function(dateStr) {
            selectedDateStr = dateStr;
            const d = new Date(dateStr);
            viewDate.setFullYear(d.getFullYear());
            viewDate.setMonth(d.getMonth());
            renderMiniCalendar();
            const actionBtn = document.getElementById('actionButtons');
            actionBtn.innerHTML = ''; 
            database.ref('reports/' + dateStr + '/' + user).once('value', (snapshot) => {
                const report = snapshot.val();
                currentReportData = report;
                const container = document.getElementById('workCardContainer');
                if (!report) { window.showEditor(); } else {
                    actionBtn.innerHTML = `
                        <button onclick="window.deleteReport()" class="text-rose-500 hover:text-rose-400 text-xs font-bold mr-3">Delete</button>
                        <button onclick="window.showEditor()" class="bg-slate-700 text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-slate-600 transition">Edit</button>`;
                    let adminMemoHtml = report.adminMemo ? `<div class="mt-4 p-4 bg-blue-500/10 border border-blue-500/30 rounded-xl"><p class="text-[10px] font-black text-blue-400 uppercase mb-1">Admin Memo</p><p class="text-xs text-blue-200 italic leading-relaxed">${report.adminMemo}</p></div>` : "";
                    container.innerHTML = `
                        <div class="bg-slate-900 p-6 rounded-2xl border ${report.status === 'Completed' ? 'border-green-900/50' : 'border-slate-800'} shadow-lg animate-fadeIn">
                            <div class="flex justify-between items-center mb-6">
                                <div class="flex items-center gap-3">
                                    <span class="text-blue-400 text-xs font-black uppercase tracking-widest">Work Report</span>
                                    <span class="px-2 py-0.5 rounded text-[9px] font-black uppercase ${report.status === 'Completed' ? 'bg-emerald-500/20 text-emerald-500' : report.status === 'Pending' ? 'bg-amber-500/20 text-amber-500' : 'bg-blue-500/20 text-blue-400'}">${report.status || 'In Progress'}</span>
                                </div>
                                <span class="text-slate-500 text-[10px] font-mono">${selectedDateStr}</span>
                            </div>
                            <div class="space-y-6">
                                <div><h4 class="text-[10px] font-black text-blue-500 uppercase tracking-tighter mb-2">Today's To-Do</h4><p class="text-slate-200 text-sm leading-relaxed whitespace-pre-wrap">${report.todo || '-'}</p></div>
                                <div><h4 class="text-[10px] font-black text-emerald-500 uppercase tracking-tighter mb-2">Work Summary</h4><p class="text-slate-200 text-sm leading-relaxed whitespace-pre-wrap">${report.summary || report.content || '-'}</p></div>
                            </div>
                            ${adminMemoHtml}
                            <div class="mt-6 pt-4 border-t border-slate-800 text-right"><span class="text-[10px] text-slate-500 italic">Last Update: ${report.time || 'N/A'}</span></div>
                        </div>`;
                }
            });
        };

// HTML 태그 제거 및 줄바꿈/따옴표 처리 헬퍼 함수
// HTML 태그 제거 및 줄바꿈/따옴표 처리 헬퍼 함수
function getSafeText(html) {
    if (!html) return "";
    let tmp = document.createElement("DIV");
    tmp.innerHTML = html;
    let text = tmp.textContent || tmp.innerText || "";
    
    // 1. 따옴표 처리 (JS 오류 방지)
    // 2. 줄바꿈(\n)을 HTML 줄바꿈(<br>)으로 변환하여 팝업에서 줄바꿈 유지
    return text.replace(/'/g, "\\'").replace(/\n/g, "<br>");
}

window.showReportPopup = function(event, todo, summary) {
    const popup = document.getElementById('reportHoverPopup');

    popup.innerHTML = `
        <span class="popup-label">To-Do</span>
        <div class="popup-content">${todo || 'No data'}</div>
        <span class="popup-label" style="color:#10b981">Summary</span>
        <div class="popup-content" style="color:#f1f5f9">${summary || 'No data'}</div>
    `;
    popup.style.display = 'block';
    window.moveReportPopup(event);
};

window.moveReportPopup = function(event) {
    const popup = document.getElementById('reportHoverPopup');
    if(!popup) return;
    popup.style.left = (event.clientX + 15) + 'px';
    popup.style.top = (event.clientY + 15) + 'px';
};

window.hideReportPopup = function() {
    const popup = document.getElementById('reportHoverPopup');
    if(popup) popup.style.display = 'none';
};


function renderMiniCalendar() {
    const year = viewDate.getFullYear();
    const month = viewDate.getMonth();
    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();
    const monthName = viewDate.toLocaleString('en-US', { month: 'long' }).toUpperCase();
    
    // 연도 선택 셀렉트박스 생성
    let yearOptions = '';
    for (let y = year - 5; y <= year + 5; y++) { 
        yearOptions += `<option value="${y}" ${y === year ? 'selected' : ''}>${y}</option>`; 
    }
    document.getElementById('miniCalMonth').innerHTML = `${monthName} <select class="year-select" onchange="window.changeViewYear(this.value)">${yearOptions}</select>`;
    
    database.ref('reports').once('value', (snapshot) => {
        const allReports = snapshot.val() || {};
        const tbody = document.getElementById('miniCalBody');
        tbody.innerHTML = '';

        // --- 생산성 요약 카운트 변수 초기화 ---
        let summaryCount = { "Completed": 0, "Pending": 0, "In Progress": 0 };
        const currentMonthStr = `${year}-${String(month + 1).padStart(2, '0')}`; // 현재 보고 있는 "YYYY-MM"

        let date = 1;
        for (let i = 0; i < 6; i++) {
            let row = document.createElement('tr');
            for (let j = 0; j < 7; j++) {
                let cell = document.createElement('td');
                if ((i === 0 && j < firstDay) || date > lastDate) { 
                    row.appendChild(cell); 
                } else {
                    const curDate = date;
                    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(curDate).padStart(2, '0')}`;
                    
                    // 요일 색상 설정
                    let dayColorClass = "text-slate-500"; 
                    if (j === 0) dayColorClass = "text-sun";
                    else if (j === 6) dayColorClass = "text-sat";
                    if (dateStr === todayStr) dayColorClass = "text-blue-500";

                    let cellHTML = `<div class="date-num text-xs font-bold ${dayColorClass}">${curDate}</div>`;
                    const userReport = (allReports[dateStr] && allReports[dateStr][user]) ? allReports[dateStr][user] : null;

if (userReport) {
                    // 호버 효과를 위한 클래스 추가
                    cell.classList.add('has-report');

                    // --- 해당 월의 상태 카운트 합산 ---
                    const status = userReport.status || "In Progress";
                    if (summaryCount.hasOwnProperty(status)) {
                        summaryCount[status]++;
                    }

                    // [추가 코드] adminMemo가 있으면 빨간 점 표시
                    if (userReport.adminMemo && userReport.adminMemo.trim() !== "") {
                        cellHTML += `<div class="admin-dot" title="Admin feedback available"></div>`;
                    }

                    let statusClass = status === 'Completed' ? "status-completed" : (status === 'Pending' ? "status-pending" : "status-progress");
                    let statusText = status === 'Completed' ? "COMPLETED" : (status === 'Pending' ? "PENDING" : "PROGRESS");
                    
                    cellHTML += `<div class="status-tag ${statusClass}">${statusText}</div>`;
                    
                    // --- 팝업용 데이터 가공 ---
                    // getSafeText 함수를 사용하여 줄바꿈 및 따옴표 처리된 안전한 텍스트 생성
                    const safeTodo = getSafeText(userReport.todo || "-");
                    const safeSummary = getSafeText(userReport.summary || userReport.content || "-");

                    // 마우스 이벤트 바인딩 (Admin Report와 동일한 로직)
                    cell.onmouseenter = (e) => window.showReportPopup(e, safeTodo, safeSummary);
                    cell.onmousemove = (e) => window.moveReportPopup(e);
                    cell.onmouseleave = () => window.hideReportPopup();
                }
                
                cell.innerHTML = cellHTML;
                if (dateStr === selectedDateStr) cell.classList.add('selected-date');
                cell.onclick = () => {
                    window.hideReportPopup(); // 클릭 시 팝업 가리기
                    loadReport(dateStr);
                };
                row.appendChild(cell);
                date++;
                }
            }
            tbody.appendChild(row);
            if (date > lastDate) break;
        }

        // --- 캘린더 하단 요약 수치 업데이트 (HTML 엘리먼트가 존재할 경우) ---
        if (document.getElementById('countCompleted')) {
            document.getElementById('countCompleted').innerText = summaryCount["Completed"];
            document.getElementById('countPending').innerText = summaryCount["Pending"];
            document.getElementById('countProgress').innerText = summaryCount["In Progress"];
        }
    });
}

// loadReport 함수 끝부분에 아래 내용을 추가하여 전체 리스트를 갱신하도록 합니다.
// (window.loadReport 정의 부분의 마지막에 아래 로직을 병합하세요)
const originalLoadReport = window.loadReport;
window.loadReport = function(dateStr) {
    originalLoadReport(dateStr); // 기존 기능 유지
    
    // 추가: Staff 리스트 갱신 로직
    const staffListArea = document.getElementById('staffListArea');
    const staffGrid = document.getElementById('staffGrid');
    const targetDateDisplay = document.getElementById('targetDateDisplay');
    
    firebase.database().ref(`reports/${dateStr}`).once('value', (snapshot) => {
        const staffData = snapshot.val();
        staffGrid.innerHTML = '';
        targetDateDisplay.innerText = dateStr;
        
        if (staffData) {
            const staffNames = Object.keys(staffData);
            document.getElementById('staffCount').innerText = `${staffNames.length} persons`;
            
            staffNames.forEach(name => {
                const data = staffData[name];
                const statusClass = data.status === 'Completed' ? "status-completed" : (data.status === 'Pending' ? "status-pending" : "status-progress");
                
                const item = document.createElement('div');
                item.className = 'staff-item';
                item.onclick = () => window.openStaffDetail(name, dateStr);
                item.innerHTML = `
                    <span class="staff-name">${name}</span>
                    <span class="staff-status ${statusClass}">${data.status || 'In Progress'}</span>
                `;
                staffGrid.appendChild(item);
            });
            staffListArea.classList.remove('hidden');
        } else {
            staffListArea.classList.add('hidden');
        }
    });
};
