<style>
/* ══════════════════════════════════════════════════════════
   STAFF REPORT — 7-DAY ADAPTIVE DARK THEME
   All colours flow from --r-* tokens. No white backgrounds.
══════════════════════════════════════════════════════════ */

/* ── Semantic aliases (keep original var names working) ── */
:root {
  --bg:        var(--r-bg);
  --surface:   var(--r-surface);
  --surface2:  var(--r-surface2);
  --surface3:  var(--r-surface3);
  --border:    var(--r-border);
  --border2:   var(--r-border2);
  --text:      var(--r-text);
  --muted:     var(--r-muted);
  --dim:       var(--r-dim);
  /* fixed semantic colours */
  --cyan:      #06b6d4;
  --blue:      #3b82f6;
  --emerald:   #10b981;
  --amber:     #f59e0b;
  --rose:      #f43f5e;
  --violet:    #818cf8;
  --glow-blue: rgba(59,130,246,0.25);
  --glow-cyan: rgba(6,182,212,0.2);
}

*, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }

/* ══════════════════════════════════════════════════════════
   3-D CARD BASE
══════════════════════════════════════════════════════════ */
.card-3d {
  position: relative;
  background: linear-gradient(145deg, var(--r-surface2) 0%, var(--r-surface) 100%);
  border: 1px solid var(--r-border);
  border-top: 1px solid var(--r-border2);
  border-radius: var(--r-card-radius);
  box-shadow:
    inset 0 1px 0 var(--r-card-shine),
    inset 0 -1px 0 rgba(0,0,0,0.3),
    0 4px 12px var(--r-card-near),
    0 12px 32px var(--r-card-far);
  will-change: transform;
  transition: transform 0.32s cubic-bezier(0.23,1,0.32,1),
              box-shadow 0.32s ease,
              border-color 0.32s ease;
}
.card-3d::before {
  content:'';
  position:absolute; top:0; left:15%; right:15%; height:1px;
  background: var(--r-card-bevel);
  pointer-events:none;
}
.card-3d::after {
  content:'';
  position:absolute; inset:0;
  background: var(--r-card-face);
  pointer-events:none;
  border-radius:inherit;
}
@media (hover:hover) {
  .card-3d:hover {
    transform: translateY(-5px) perspective(900px) rotateX(2.5deg);
    border-color: var(--r-accent);
    box-shadow:
      inset 0 1px 0 var(--r-card-shine),
      0 6px 14px var(--r-card-near),
      0 22px 45px var(--r-card-far),
      0 0 0 1px var(--r-accent-glow),
      0 0 28px var(--r-accent-glow);
  }
}

/* ══════════════════════════════════════════════════════════
   ROOT LAYOUT — Responsive two-column
══════════════════════════════════════════════════════════ */
.sr-root {
  display: grid;
  grid-template-columns: 1fr;
  gap: clamp(0.75rem, 2.5vw, 1.25rem);
  font-family: var(--r-font-ui);
  color: var(--r-text);
}
@media (min-width: 1024px) {
  .sr-root {
    grid-template-columns: clamp(300px, 30%, 420px) 1fr;
    align-items: start;
  }
}

/* ══════════════════════════════════════════════════════════
   LEFT PANEL (Report detail + editor)
══════════════════════════════════════════════════════════ */
.sr-left {
  display: flex;
  flex-direction: column;
  gap: clamp(0.65rem, 2vw, 1rem);
}

/* Panel wrapper */
.sr-panel {
  background: linear-gradient(145deg, var(--r-surface2) 0%, var(--r-surface) 100%);
  border: 1px solid var(--r-border);
  border-top: 1px solid var(--r-border2);
  border-radius: var(--r-card-radius);
  padding: clamp(14px,4vw,22px);
  position: relative;
  box-shadow: inset 0 1px 0 var(--r-card-shine), 0 8px 28px var(--r-card-far);
}
.sr-panel::before {
  content:'';
  position:absolute; top:0; left:15%; right:15%; height:1px;
  background: var(--r-card-bevel);
  pointer-events:none;
}
.sr-panel::after { background:none; }

/* Panel header */
.sr-panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: clamp(14px,3.5vw,22px);
  gap: 10px;
  flex-wrap: wrap;
}
.sr-panel-title {
  font-size: clamp(14px,4.5vw,20px);
  font-weight: 900;
  color: var(--r-text);
  font-family: var(--r-font-display);
  letter-spacing: -0.02em;
}

/* Action buttons area */
#actionButtons button {
  font-family: var(--r-font-ui) !important;
  font-size: clamp(8px,2.2vw,10px) !important;

  border-radius: 8px !important;
  padding: 5px 11px !important;
  transition: all 0.2s !important;
}

  background: rgba(99,102,241,0.09) !important;

  border: 1px solid var(--r-border2) !important;

  box-shadow: 0 2px 8px rgba(0,0,0,0.3), inset 0 1px 0 var(--r-card-shine) !important;
}

  #actionButtons .bg-slate-700:hover { transform:translateY(-1px) !important; }
}

/* Work card container */
#workCardContainer {
  min-height: 120px;
}
#workCardContainer .bg-slate-900,
#workCardContainer > div {
  background: linear-gradient(145deg, var(--r-surface2) 0%, var(--r-surface) 100%) !important;
  border: 1px solid var(--r-border) !important;
  border-top: 1px solid var(--r-border2) !important;
  border-radius: var(--r-card-radius) !important;
  box-shadow: 0 8px 24px var(--r-card-far), inset 0 1px 0 var(--r-card-shine) !important;
  color: var(--r-text) !important;
  position: relative;
  overflow: hidden;
}
#workCardContainer .bg-slate-900::before {
  content:'';
  position:absolute; top:0; left:15%; right:15%; height:1px;
  background: var(--r-card-bevel);
  pointer-events:none;

/* Editor border accent */
#workCardContainer .bg-slate-900.border-blue-500\/50 {
  border-color: color-mix(in srgb,var(--r-accent) 45%,transparent) !important;
  box-shadow: 0 8px 24px var(--r-card-far), 0 0 0 1px var(--r-accent-glow), inset 0 1px 0 var(--r-card-shine) !important;
}
/* Textarea / select */
#workCardContainer textarea,
#workCardContainer select {

  color: var(--r-text) !important;
  font-family: var(--r-font-mono) !important;

}

#workCardContainer select:focus {
  border-color: var(--r-accent) !important;
  box-shadow: 0 0 0 3px var(--r-accent-glow) !important;
  outline: none !important;

/* Save button */
#workCardContainer button.bg-blue-600 {
  background: linear-gradient(135deg, var(--r-accent), color-mix(in srgb,var(--r-accent) 70%,#000)) !important;
  border-radius: calc(var(--r-card-radius) * 0.75) !important;
  font-family: var(--r-font-ui) !important;
  font-weight: 900 !important;
  letter-spacing: 0.1em !important;
  box-shadow: 0 6px 20px var(--r-accent-glow), inset 0 1px 0 rgba(255,255,255,0.15) !important;
  transition: all 0.2s ease !important;
  border: none !important;
  color: #fff !important;
}
@media (hover:hover) {
  #workCardContainer button.bg-blue-600:hover {
    box-shadow: 0 10px 28px var(--r-accent-glow), inset 0 1px 0 rgba(255,255,255,0.2) !important;
    transform: translateY(-2px) !important;
  }
}
#workCardContainer button.bg-blue-600:active { transform:translateY(1px) !important; }
/* Copy / cancel buttons */
#workCardContainer button.bg-blue-600\/20 {
  border-radius: calc(var(--r-card-radius)*0.6) !important;

/* ══════════════════════════════════════════════════════════

══════════════════════════════════════════════════════════ */

      <!-- Staff detail modal -->
      <div id="reportDetailModal" class="report-modal" onclick="if(event.target===this) window.closeModal()">
        <div class="modal-content animate-fadeIn">
          <span class="modal-close" onclick="window.closeModal()">&times;</span>
          <div id="modalBody"></div>
          <button onclick="window.closeModal()" style="width:100%;margin-top:20px;background:var(--r-surface2);color:var(--r-muted);padding:12px;border-radius:calc(var(--r-card-radius)*0.75);font-size:13px;font-weight:700;border:1px solid var(--r-border);cursor:pointer;transition:all 0.2s;">Close</button>
        </div>
      </div>

    </div><!-- /sr-cal-card -->
  </div><!-- /sr-right -->

</div><!-- /sr-root -->

<div id="reportHoverPopup"></div>

<!-- ══════════════════════════════════════════════════════════
     JAVASCRIPT — all original logic preserved
══════════════════════════════════════════════════════════ -->
<script>
(function() {
  const user = sessionStorage.getItem('loggedInUser');
  const db = firebase.database();
  let viewDate = new Date(), selectedDateStr = new Date().toISOString().split('T')[0], currentReportData = null;

  if (!user || user === "null") {
    alert("Login required.");
    const wcc = document.getElementById('workCardContainer');
    if (wcc) wcc.innerHTML = '<p style="color:var(--r-muted);">Login is required.</p>';
    return;
  }

  const getTempKey  = (date) => `temp_report_${user}_${date}`;
  const escapeHtml  = (s) => s ? s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#039;"}[m])) : '-';

  /* ── Import ── */
  window.importStaffReport = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = new Uint8Array(ev.target.result), workbook = XLSX.read(data,{type:'array',cellDates:true});
        const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
        if (!jsonData.length || !confirm(`Save ${jsonData.length} records?`)) return;
        let sc = 0;
        Promise.all(jsonData.map(row => {
          let rd = row["Date"], dk = "";
          if (typeof rd==='number') dk = new Date(Math.round((rd-25569)*86400*1000)).toISOString().split('T')[0];
          else if (rd instanceof Date) dk = rd.toISOString().split('T')[0];
          else if (typeof rd==='string') dk = rd.trim();
          if (!/^\d{4}-\d{2}-\d{2}$/.test(dk)) return Promise.resolve();
          return db.ref(`reports/${dk}/${user}`).set({
            status:row["Status"]||"In Progress", todo:row["To-Do"]||"", summary:row["Summary"]||"",
            adminMemo:row["Admin Memo"]||"", time:row["Update Time"]||new Date().getHours().toString().padStart(2,'0')+":00"
          }).then(()=>sc++);
        })).then(()=>{ alert(`Imported ${sc} reports.`); window.loadReport(selectedDateStr); e.target.value=''; });
      } catch(err) { alert("Parsing error."); }
    };
    reader.readAsArrayBuffer(file);
  };

  /* ── Export ── */
  window.exportStaffReport = (mode) => {
    const y=viewDate.getFullYear(), m=viewDate.getMonth()+1;
    db.ref('reports').once('value', (snap) => {
      const allData=snap.val()||{}, rows=[], sDates=Object.keys(allData).sort(); let fn="";
      sDates.forEach(dk => {
        const r=allData[dk]?.[user]; if (!r) return;
        const [ry,rm]=dk.split('-').map(Number);
        let inc=(mode==='monthly'&&ry===y&&rm===m)||(mode==='yearly'&&ry===y)||(mode==='all');
        if (inc) {
          if (!fn) fn=mode==='monthly'?`WorkReport_${user}_${y}-${String(m).padStart(2,'0')}.xlsx`:mode==='yearly'?`WorkReport_${user}_Year_${y}.xlsx`:`WorkReport_${user}_AllTime.xlsx`;
          rows.push({"Date":dk,"Status":r.status||"In Progress","To-Do":r.todo||"","Summary":r.summary||r.content||"","Admin Memo":r.adminMemo||"","Update Time":r.time||""});
        }
      });
      if (!rows.length) return alert("No data.");
      const ws=XLSX.utils.json_to_sheet(rows), wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb,ws,"Report");
      const range=XLSX.utils.decode_range(ws['!ref']);
      for (let R=range.s.r;R<=range.e.r;++R) for (let C=range.s.c;C<=range.e.c;++C) {
        const addr=XLSX.utils.encode_cell({r:R,c:C}); if (!ws[addr]) continue;
        ws[addr].s={alignment:{wrapText:true,vertical:'top',horizontal:'left'},font:{name:'Arial',sz:10}};
        if (R===0) {ws[addr].s.fill={fgColor:{rgb:"F2F2F2"}};ws[addr].s.font.bold=true;}
      }
      ws['!cols']=[{wch:12},{wch:12},{wch:45},{wch:55},{wch:35},{wch:12}];
      XLSX.writeFile(wb,fn);
    });
  };

  /* ── Char count / temp save ── */
  window.updateCharCount = (tid, cid) => {
    const t=document.getElementById(tid), c=document.getElementById(cid), max=2000;
    if (t.value.length>max) { alert("Max 2,000 characters exceeded."); t.value=t.value.substring(0,max); }
    c.innerText=`${t.value.length}/${max}`;
    c.style.color=t.value.length>=max?"#ef4444":"var(--r-muted)";
    c.style.fontWeight=t.value.length>=max?"900":"normal";
    if (window.saveToTemp) window.saveToTemp();
  };
  window.saveToTemp = () => {
    let td=document.getElementById('editTodo')?.value||"", sm=document.getElementById('editSummary')?.value||"";
    const st=document.getElementById('editStatus')?.value, max=2000;
    localStorage.setItem(getTempKey(selectedDateStr), JSON.stringify({todo:td.substring(0,max),summary:sm.substring(0,max),status:st,timestamp:Date.now()}));
  };
  window.clearTemp = (d) => localStorage.removeItem(getTempKey(d));
  window.changeViewMonth = (o) => { viewDate.setMonth(viewDate.getMonth()+o); if(typeof renderMiniCalendar==='function') renderMiniCalendar(); };
  window.goToday = () => { viewDate=new Date(); selectedDateStr=new Date().toISOString().split('T')[0]; window.loadReport(selectedDateStr); };

  /* ── Save Report ── */
  window.saveReport = () => {
    const tdF=document.getElementById('editTodo'), smF=document.getElementById('editSummary'), stF=document.getElementById('editStatus'), max=2000;
    if (!tdF.value.trim()&&!smF.value.trim()) return alert("Enter content.");
    if ((tdF.value.length>max||smF.value.length>max)&&!confirm(`Exceeds ${max} chars. Save first ${max}?`)) return;
    const now=new Date(), time=now.getHours().toString().padStart(2,'0')+":"+now.getMinutes().toString().padStart(2,'0');
    const data={todo:tdF.value.substring(0,max),summary:smF.value.substring(0,max),status:stF.value,time};
    if (currentReportData?.adminMemo) data.adminMemo=currentReportData.adminMemo;
    db.ref(`reports/${selectedDateStr}/${user}`).set(data).then(()=>{
      window.showReportAI(selectedDateStr, smF.value);
      window.clearTemp(selectedDateStr); window.loadReport(selectedDateStr);
    }).catch(()=>alert("Error."));
  };

  /* ── AI Analysis popup ── */
  let isAILoading = false;
  window.showReportAI = async function(date, summary) {
    if (isAILoading) return;
    isAILoading = true;
    const container=document.getElementById('leaveStatusAlert');
    const content=document.getElementById('leaveAlertContent');
    const icon=document.getElementById('leaveAlertIcon');
    const title=document.getElementById('leaveAlertTitle');
    const msg=document.getElementById('leaveAlertMsg');
    if (!container||!content) { isAILoading=false; return; }
    container.style.display='flex';
    content.className="p-5 rounded-[1.5rem] border-2 flex items-center justify-between shadow-2xl bg-slate-900/95 border-blue-500 w-full animate-pulse-slow show";
    icon.innerText="🧠"; title.innerText="AI System Checking...";
    msg.innerHTML=`<span class="text-blue-400 text-xs font-bold italic">AI sedang analysis report...</span>`;
    setTimeout(()=>content.classList.add('show'),10);
    let aiResponse="";
    const dateLabel=date.split('-').slice(1).join('/');
    try {
      let apiKey=(typeof config!=='undefined'&&config.LLMAPIkey)?config.LLMAPIkey:"";
      if (!apiKey) { const snap=await firebase.database().ref('settings/config/LLMAPIkey').once('value'); apiKey=snap.val(); }
      if (!apiKey) throw new Error("LLM API Key missing");
      const url="https://api.groq.com/openai/v1/chat/completions";
      const prompt=`[REPORT_ANALYSIS]\nUser: ${sessionStorage.getItem('loggedInUser')||'Staff'}\nWork Summary: ${summary}\nInstruction:\n1. Berikan pujian profesional namun lucu/witty tentang ringkasan pekerjaan ini dalam satu kalimat.\n2. Tambahkan emoji yang relevan di akhir kalimat.\n3. Balas dalam bahasa Indonesia saja.\n4. Maksimum 2 kalimat.`;
      const response=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${apiKey}`},body:JSON.stringify({model:"llama-3.3-70b-versatile",messages:[{role:"system",content:"You are a witty office manager AI. Respond in Indonesian language ONLY."},{role:"user",content:prompt}],temperature:0.8})});
      const data=await response.json();
      aiResponse=data.choices[0].message.content.trim();
    } catch(error) {
      console.error("showReportAI error:",error);
      aiResponse="Catatan kerja berhasil disimpan! Analisis AI gagal dimuat, tapi performa Anda tetap luar biasa! 🚀";
    } finally { isAILoading=false; }
    content.classList.remove('animate-pulse-slow');
    content.className="p-5 rounded-[1.5rem] border-2 flex items-center justify-between shadow-2xl bg-slate-900/95 border-emerald-500 w-full ai-glow-text show";
    icon.innerText="🤖";
    title.innerText="AI Assistant Analysis";
    title.className="text-[11px] font-black uppercase italic tracking-widest text-emerald-400 mb-1";
    msg.innerHTML=`<div class="flex flex-col"><span class="text-white/60 text-[10px] mb-1">[${dateLabel}] Record Success</span><span class="text-white text-sm font-bold leading-tight">${aiResponse}</span></div>`;
    if (window.aiPopupTimer) clearTimeout(window.aiPopupTimer);
    window.aiPopupTimer=setTimeout(()=>{ content.classList.remove('show'); setTimeout(()=>{container.style.display='none';},400); },5000);
  };

  /* ── Delete ── */
  window.deleteReport = () => {
    if (!confirm("Delete this report?")) return;
    db.ref(`reports/${selectedDateStr}/${user}`).remove().then(()=>{ alert("Deleted."); window.clearTemp(selectedDateStr); currentReportData=null; window.loadReport(selectedDateStr); });
  };

  /* ── Load Report ── */
  window.loadReport = (ds) => {
    selectedDateStr=ds;
    const d=new Date(ds); viewDate.setFullYear(d.getFullYear()); viewDate.setMonth(d.getMonth());
    if (typeof renderMiniCalendar==='function') renderMiniCalendar();
    const ab=document.getElementById('actionButtons'); if(ab) ab.innerHTML='';
    db.ref(`reports/${ds}/${user}`).once('value',(snap)=>{
      const r=snap.val(); currentReportData=r;
      const c=document.getElementById('workCardContainer');
      if (!c) return;
      if (!r) { if(window.showEditor) window.showEditor(); }
      else {
        if(ab) ab.innerHTML=`<button onclick="window.copyReportText()" class="text-indigo-400 hover:text-indigo-300 text-xs font-bold mr-3 uppercase tracking-tighter">Copy</button><button onclick="window.deleteReport()" class="text-rose-500 hover:text-rose-400 text-xs font-bold mr-3">Delete</button><button onclick="window.showEditor()" class="bg-slate-700 text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-slate-600">Edit</button>`;
        const amH=r.adminMemo?`<div style="margin-top:16px;padding:14px;background:color-mix(in srgb,var(--r-accent) 8%,transparent);border:1px solid color-mix(in srgb,var(--r-accent) 30%,transparent);border-radius:calc(var(--r-card-radius)*0.75);"><p style="font-size:9px;font-weight:900;color:var(--r-accent);text-transform:uppercase;margin-bottom:4px;">Admin Memo</p><p style="font-size:12px;color:color-mix(in srgb,var(--r-accent2) 80%,white);font-style:italic;line-height:1.6;white-space:pre-wrap;">${escapeHtml(r.adminMemo)}</p></div>`:"";
        const statusColor=r.status==='Completed'?'#10b981':r.status==='Pending'?'#f59e0b':'var(--r-accent)';
        c.innerHTML=`<div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-lg animate-fadeIn"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;"><div style="display:flex;align-items:center;gap:10px;"><span style="color:var(--r-accent);font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:0.1em;">Work Report</span><span style="padding:2px 8px;border-radius:5px;font-size:9px;font-weight:900;text-transform:uppercase;background:color-mix(in srgb,${statusColor} 18%,transparent);color:${statusColor};border:1px solid color-mix(in srgb,${statusColor} 35%,transparent);">${r.status||'In Progress'}</span></div><span style="color:var(--r-muted);font-size:10px;font-family:var(--r-font-mono);">${ds}</span></div><div style="display:flex;flex-direction:column;gap:20px;"><div><h4 style="font-size:10px;font-weight:900;color:var(--r-accent);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:8px;">Today's To-Do</h4><p class="whitespace-pre-wrap">${escapeHtml(r.todo)}</p></div><div><h4 style="font-size:10px;font-weight:900;color:#10b981;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:8px;">Work Summary</h4><p class="whitespace-pre-wrap">${escapeHtml(r.summary||r.content)}</p></div></div>${amH}<div style="margin-top:20px;padding-top:14px;border-top:1px solid var(--r-border);text-align:right;"><span style="font-size:10px;color:var(--r-muted);font-style:italic;font-family:var(--r-font-mono);">Last Update: ${r.time||'N/A'}</span></div></div>`;
      }
    });
    /* Staff list update */
    const staffListArea=document.getElementById('staffListArea');
    const staffGrid=document.getElementById('staffGrid');
    const targetDateDisplay=document.getElementById('targetDateDisplay');
    firebase.database().ref(`reports/${ds}`).once('value',(snapshot)=>{
      const staffData=snapshot.val();
      if(staffGrid) staffGrid.innerHTML='';
      if(targetDateDisplay) targetDateDisplay.innerText=ds;
      if (staffData) {
        const staffNames=Object.keys(staffData);
        const sc=document.getElementById('staffCount'); if(sc) sc.innerText=`${staffNames.length} persons`;
        staffNames.forEach(name=>{
          const data=staffData[name];
          const statusClass=data.status==='Completed'?'status-completed':data.status==='Pending'?'status-pending':'status-progress';
          const item=document.createElement('div'); item.className='staff-item';
          item.onclick=()=>window.openStaffDetail(name,ds);
          item.innerHTML=`<span class="staff-name">${name}</span><span class="staff-status ${statusClass}">${data.status||'In Progress'}</span>`;
          if(staffGrid) staffGrid.appendChild(item);
        });
        if(staffListArea) staffListArea.classList.remove('hidden');
      } else { if(staffListArea) staffListArea.classList.add('hidden'); }
    });
  };

  /* ── Clipboard copy ── */
  window.copyReportText = function() {
    if (!currentReportData) return;
    const todo=currentReportData.todo||"", summary=currentReportData.summary||currentReportData.content||"";
    const text=`[Work Report - ${selectedDateStr}]\n\n■ To-Do:\n${todo}\n\n■ Summary:\n${summary}`;
    navigator.clipboard.writeText(text).then(()=>alert("Report copied to clipboard!")).catch(()=>{
      const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select();
      try{document.execCommand('copy');alert("Report copied to clipboard!");}catch(e){alert("Unable to copy.");}
      document.body.removeChild(ta);
    });
  };

  /* ── Hover popup helpers ── */
  function getSafeText(html) {
    if (!html) return "";
    let tmp=document.createElement("DIV"); tmp.innerHTML=html;
    return (tmp.textContent||tmp.innerText||"").replace(/'/g,"\\'").replace(/\n/g,"<br>");
  }

  window.showReportPopup = function(event, todo, summary) {
    let popup=document.getElementById('reportHoverPopup'); if (!popup) return;
    if (popup.parentElement!==document.body) document.body.appendChild(popup);
    popup.innerHTML=`<span class="popup-label">To-Do</span><div class="popup-content">${todo||'No data'}</div><span class="popup-label" style="color:#10b981">Summary</span><div class="popup-content" style="color:var(--r-text);">${summary||'No data'}</div>`;
    popup.style.visibility='hidden'; popup.style.display='block';
    window.moveReportPopup(event); popup.style.visibility='visible';
  };
  window.moveReportPopup = function(event) {
    const popup=document.getElementById('reportHoverPopup'); if (!popup) return;
    const rawX=event.clientX, rawY=event.clientY;
    const popupW=popup.offsetWidth||290, popupH=popup.offsetHeight||160, gap=14, margin=8;
    let posX=rawX+gap, posY=rawY+gap;
    if (posX+popupW>window.innerWidth-margin) posX=rawX-popupW-gap;
    if (posX<margin) posX=margin;
    if (posY+popupH>window.innerHeight-margin) posY=rawY-popupH-gap;
    if (posY<margin) posY=margin;
    popup.style.left=posX+'px'; popup.style.top=posY+'px';
  };
  window.hideReportPopup = function() { const p=document.getElementById('reportHoverPopup'); if(p) p.style.display='none'; };

  /* ── Copy from picker ── */
  window.openCopyFromPicker = function() {
    if (!document.getElementById('hiddenCopyInput')) {
      const input=document.createElement('input'); input.id='hiddenCopyInput'; input.style.display='none'; document.body.appendChild(input);
    }
    if (window.copyPicker) window.copyPicker.destroy();
    window.copyPicker=flatpickr("#hiddenCopyInput",{theme:"dark",maxDate:"today",onChange:function(selectedDates,dateStr){
      if (confirm(`Copy report content from ${dateStr}?`)) {
        db.ref('reports/'+dateStr+'/'+user).once('value',(snapshot)=>{
          const data=snapshot.val();
          if (data) {
            const todoEl=document.getElementById('editTodo'), summaryEl=document.getElementById('editSummary');
            if(todoEl) todoEl.value=data.todo||"";
            if(summaryEl) summaryEl.value=data.summary||data.content||"";
            window.saveToTemp(); alert("Data copied successfully.");
          } else alert("No report found for the selected date.");
        });
      }
    }});
    window.copyPicker.open();
  };

  /* ── Copy from recent (yesterday-7d) ── */
  window.copyFromRecent = async() => {
    const today=new Date(selectedDateStr); let foundData=null;
    for (let i=1;i<=7;i++) {
      const target=new Date(today); target.setDate(today.getDate()-i);
      const tStr=target.toISOString().split('T')[0];
      const snap=await db.ref(`reports/${tStr}/${user}`).once('value');
      const data=snap.val();
      if (data&&(data.todo||data.summary)) { foundData={date:tStr,todo:data.todo||"",summary:data.summary||data.content||""}; break; }
    }
    if (foundData) {
      const todoField=document.getElementById('editTodo'), summaryField=document.getElementById('editSummary');
      if (todoField&&summaryField) {
        todoField.value=foundData.todo; summaryField.value=foundData.summary;
        window.updateCharCount('editTodo','todoCount'); window.updateCharCount('editSummary','summaryCount');
        if(window.autoResize){window.autoResize(todoField);window.autoResize(summaryField);}
        alert(`Successfully copied data from ${foundData.date}.`);
      }
    } else alert("No report found within the last 7 days.");
  };

  /* ── Staff detail modal ── */
  window.openStaffDetail = function(staffName, dateStr) {
    firebase.database().ref(`reports/${dateStr}/${staffName}`).once('value',(snapshot)=>{
      const report=snapshot.val(); if(!report) return;
      const modalBody=document.getElementById('modalBody');
      const statusColor=report.status==='Completed'?'#10b981':report.status==='Pending'?'#f59e0b':'var(--r-accent)';
      modalBody.innerHTML=`<div style="margin-bottom:16px;"><span style="font-size:10px;font-weight:900;color:var(--r-accent);text-transform:uppercase;letter-spacing:0.1em;">Staff Report Detail</span><h2 style="font-size:22px;font-weight:900;color:var(--r-text);margin-top:4px;font-family:var(--r-font-display);">${staffName}</h2><div style="display:flex;gap:8px;margin-top:8px;"><span style="padding:2px 8px;border-radius:5px;font-size:10px;font-weight:900;text-transform:uppercase;background:color-mix(in srgb,${statusColor} 18%,transparent);color:${statusColor};border:1px solid color-mix(in srgb,${statusColor} 35%,transparent);">${report.status||'In Progress'}</span><span style="color:var(--r-muted);font-size:10px;font-family:var(--r-font-mono);">${dateStr}</span></div></div><div style="display:flex;flex-direction:column;gap:18px;margin-top:20px;"><div><h4 style="font-size:10px;font-weight:900;color:var(--r-accent);text-transform:uppercase;margin-bottom:8px;">Today's To-Do</h4><p style="color:var(--r-text);font-size:13px;line-height:1.7;white-space:pre-wrap;background:rgba(0,0,0,0.2);padding:12px;border-radius:10px;border:1px solid var(--r-border);">${report.todo||'-'}</p></div><div><h4 style="font-size:10px;font-weight:900;color:#10b981;text-transform:uppercase;margin-bottom:8px;">Work Summary</h4><p style="color:var(--r-text);font-size:13px;line-height:1.7;white-space:pre-wrap;background:rgba(0,0,0,0.2);padding:12px;border-radius:10px;border:1px solid var(--r-border);">${report.summary||report.content||'-'}</p></div>${report.adminMemo?`<div><h4 style="font-size:10px;font-weight:900;color:#f43f5e;text-transform:uppercase;margin-bottom:8px;">Admin Memo</h4><p style="color:rgba(244,63,94,0.8);font-size:12px;font-style:italic;background:rgba(244,63,94,0.08);padding:12px;border-radius:10px;border:1px solid rgba(244,63,94,0.2);">${report.adminMemo}</p></div>`:''}</div><div style="margin-top:18px;text-align:right;font-size:10px;color:var(--r-muted);font-style:italic;font-family:var(--r-font-mono);">Update: ${report.time||'N/A'}</div>`;
      document.getElementById('reportDetailModal').style.display='flex';
    });
  };
  window.closeModal = function() { document.getElementById('reportDetailModal').style.display='none'; };

  /* ── Auto resize textarea ── */
  window.autoResize = function(obj) { if (!obj) return; obj.style.height='auto'; obj.style.height=obj.scrollHeight+'px'; };

  /* ── Show editor ── */
  window.showEditor = function() {
    const ab=document.getElementById('actionButtons'); if(ab) ab.innerHTML='';
    const container=document.getElementById('workCardContainer');
    const serverReport=currentReportData||{todo:"",summary:"",status:"In Progress",content:""};
    const tempRaw=localStorage.getItem(getTempKey(selectedDateStr));
    let report=serverReport, hasTemp=false, max=2000;
    if (tempRaw) { const tmp=JSON.parse(tempRaw); report={...serverReport,...tmp}; report.summary=tmp.summary||serverReport.summary||serverReport.content; hasTemp=true; }
    const isNew=!currentReportData, s=report.status, t=report.todo||'', c=report.summary||report.content||'';
    container.innerHTML=`<div class="bg-slate-900 p-6 rounded-2xl border border-blue-500/50 shadow-lg animate-fadeIn"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap;gap:10px;"><div style="display:flex;flex-direction:column;"><span style="color:var(--r-accent);font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:0.1em;">${isNew?'New':'Edit'} Report</span>${hasTemp?'<span style="color:#f43f5e;font-size:8px;font-weight:700;margin-top:3px;">(Temp Data Restored)</span>':''}</div><div style="display:flex;flex-direction:column;align-items:flex-start;gap:6px;"><button onclick="window.openCopyFromPicker()" style="width:100%;background:color-mix(in srgb,var(--r-accent) 12%,transparent);color:var(--r-accent);border:1px solid color-mix(in srgb,var(--r-accent) 35%,transparent);padding:6px 12px;border-radius:8px;font-size:9px;font-weight:900;cursor:pointer;text-transform:uppercase;letter-spacing:0.04em;transition:all 0.2s;">📋 Copy from date</button><button onclick="window.copyFromRecent()" style="width:100%;background:rgba(99,102,241,0.1);color:#818cf8;border:1px solid rgba(99,102,241,0.28);padding:6px 12px;border-radius:8px;font-size:9px;font-weight:900;cursor:pointer;text-transform:uppercase;letter-spacing:0.04em;transition:all 0.2s;">📋 Copy from yesterday</button><span style="font-size:10px;color:var(--r-muted);font-family:var(--r-font-mono);">Target: ${selectedDateStr}</span></div></div><div style="margin-bottom:14px;"><label style="display:block;font-size:9px;font-weight:900;color:var(--r-muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px;">Status</label><select id="editStatus" onchange="window.saveToTemp()" style="width:100%;padding:9px 12px;color:var(--r-text);font-size:13px;outline:none;">${['In Progress','Completed','Pending'].map(v=>`<option value="${v}" ${s===v?'selected':''}>${v}</option>`).join('')}</select></div>${[['Todo','var(--r-accent)',t],['Summary','#10b981',c]].map(([id,col,val])=>`<div style="margin-bottom:14px;"><div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:6px;"><label style="font-size:9px;font-weight:900;text-transform:uppercase;color:${col};">Today's ${id}</label><span id="${id.toLowerCase()}Count" style="font-size:9px;color:var(--r-muted);font-family:var(--r-font-mono);">${val.length}/${max}</span></div><textarea id="edit${id}" oninput="window.autoResize(this);window.updateCharCount('edit${id}','${id.toLowerCase()}Count');" style="width:100%;padding:12px;color:var(--r-text);font-size:13px;min-height:${id==='Todo'?'100':'150'}px;resize:none;overflow:hidden;outline:none;" placeholder="Enter ${id}...">${val}</textarea></div>`).join('')}<div style="display:flex;flex-direction:column;gap:8px;"><button onclick="window.saveReport()" class="bg-blue-600" style="width:100%;padding:16px;color:#fff;font-size:13px;font-weight:900;cursor:pointer;text-transform:uppercase;letter-spacing:0.1em;">Save Report</button><button onclick="window.cancelEdit()" style="width:100%;background:var(--r-surface2);color:var(--r-muted);padding:10px;border-radius:calc(var(--r-card-radius)*0.7);font-size:10px;font-weight:700;border:1px solid var(--r-border);cursor:pointer;transition:all 0.2s;">Cancel / Discard Changes</button></div></div>`;
    ['editTodo','editSummary'].forEach(id=>{ const el=document.getElementById(id); if(el){window.updateCharCount(id,id.replace('edit','').toLowerCase()+'Count');window.autoResize(el);} });
  };

  window.cancelEdit = function() { if(confirm("Discard changes and return?")){ window.clearTemp(selectedDateStr); window.loadReport(selectedDateStr); } };

  /* ── Render Mini Calendar ── */
  async function renderMiniCalendar() {
    const year=viewDate.getFullYear(), month=viewDate.getMonth();
    const firstDay=new Date(year,month,1).getDay(), lastDate=new Date(year,month+1,0).getDate();
    const monthName=viewDate.toLocaleString('en-US',{month:'long'}).toUpperCase();
    const todayStr=new Date().toISOString().split('T')[0];
    /* Year select */
    let yearOptions='';
    for (let y=year-5;y<=year+5;y++) yearOptions+=`<option value="${y}" ${y===year?'selected':''}>${y}</option>`;
    const mcm=document.getElementById('miniCalMonth');
    if(mcm) mcm.innerHTML=`${monthName} <select class="year-select" onchange="window.changeViewYear(this.value)">${yearOptions}</select>`;
    try {
      const [reportSnap,attendSnap]=await Promise.all([db.ref('reports').once('value'),db.ref('attendance').once('value')]);
      const allReports=reportSnap.val()||{}, allAttendance=attendSnap.val()||{};
      const tbody=document.getElementById('miniCalBody'); if(!tbody) return;
      tbody.innerHTML='';
      /* Written / missing dates */
      const writtenEl=document.getElementById('writtenDates'), missingEl=document.getElementById('missingDates');
      if (writtenEl&&missingEl) {
        const userSettingsSnap=await db.ref(`users/${user}/WarnFlag`).once('value');
        const warnFlag=userSettingsSnap.val();
        if (warnFlag==="off") {
          writtenEl.innerHTML='<span style="color:var(--r-muted);font-style:italic;text-transform:uppercase;">Monitoring Paused</span>';
          missingEl.innerHTML=`<span style="color:var(--r-amber,#f59e0b);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;">THIS STAFF IS IN "WARNFLAG OFF" STATUS.</span>`;
        } else {
          let writtenArr=[],missingArr=[]; const leaveTypes=['PEL','ANL','HAL','SIL','SPL'];
          for (let i=0;i<7;i++) { let d=new Date(); d.setDate(d.getDate()-i); const dw=d.getDay(),dStr=d.toISOString().split('T')[0]; const userAtnd=allAttendance[dStr]?.[user]; const isOnLeave=leaveTypes.includes(userAtnd); if(allReports[dStr]&&allReports[dStr][user]) writtenArr.push(dStr); else if(dw!==0&&dw!==6&&!isOnLeave) missingArr.push(dStr); }
          writtenEl.innerHTML=writtenArr.length>0?writtenArr.map(date=>`<span style="margin-right:8px;">${date}</span>`).join(''):'<span style="color:var(--r-dim);">No records</span>';
          missingEl.innerHTML=missingArr.length>0?missingArr.map(date=>`<span class="blink-text" style="margin-right:8px;">${date}</span>`).join(''):'<span style="color:#10b981;font-weight:900;font-size:10px;">ALL COMPLETED! ✓</span>';
        }
      }
      /* Calendar grid */
      let summaryCount={"Completed":0,"Pending":0,"In Progress":0}, date=1;
      const leaveTypes=['PEL','ANL','HAL','SIL','SPL'];
      for (let i=0;i<6;i++) {
        let row=document.createElement('tr');
        for (let j=0;j<7;j++) {
          let cell=document.createElement('td');
          if ((i===0&&j<firstDay)||date>lastDate) { row.appendChild(cell); continue; }
          const curDate=date;
          const dateStr=`${year}-${String(month+1).padStart(2,'0')}-${String(curDate).padStart(2,'0')}`;
          let dayColorClass="date-num"; if(j===0) dayColorClass+=" text-sun"; else if(j===6) dayColorClass+=" text-sat"; if(dateStr===todayStr) dayColorClass+=" today-today";
          let cellHTML=`<div class="${dayColorClass}" ${dateStr===todayStr?`style="color:var(--r-accent);text-shadow:0 0 8px var(--r-accent-glow);"`:""}>${curDate}</div>`;
          const userReport=allReports[dateStr]?.[user]||null;
          const userAtnd=allAttendance[dateStr]?.[user];
          const isLeave=leaveTypes.includes(userAtnd);
          if (userReport) {
            cell.classList.add('has-report');
            const status=userReport.status||"In Progress";
            if (summaryCount.hasOwnProperty(status)) summaryCount[status]++;
            if (userReport.adminMemo&&userReport.adminMemo.trim()!=="") cellHTML+=`<div class="admin-dot" title="Admin feedback"></div>`;
            let statusClass=status==='Completed'?'status-completed':status==='Pending'?'status-pending':'status-progress';
            let statusText=status==='Completed'?'DONE':status==='Pending'?'PENDING':'PROG';
            cellHTML+=`<div class="status-tag ${statusClass}">${statusText}</div>`;
            const safeTodo=getSafeText(userReport.todo||"-"), safeSummary=getSafeText(userReport.summary||userReport.content||"-");
            cell.onmouseenter=(e)=>window.showReportPopup(e,safeTodo,safeSummary);
            cell.onmousemove=(e)=>window.moveReportPopup(e);
            cell.onmouseleave=()=>window.hideReportPopup();
          } else if (isLeave) {
            cellHTML+=`<div class="status-tag" style="background:rgba(244,63,94,0.15);color:#f43f5e;border:1px solid rgba(244,63,94,0.3);">${userAtnd}</div>`;
          }
          cell.innerHTML=cellHTML;
          if (dateStr===selectedDateStr) cell.classList.add('selected-date');
          cell.onclick=()=>{ window.hideReportPopup(); window.loadReport(dateStr); };
          row.appendChild(cell); date++;
        }
        tbody.appendChild(row); if(date>lastDate) break;
      }
      /* Achievement calculation */
      (async function updateAchievement() {
        const now=new Date(), y2=now.getFullYear(), mo=now.getMonth();
        let workdays=0,written=0,streak=0,streakActive=true;
        for (let d=1;d<=now.getDate();d++) {
          const dow=new Date(y2,mo,d).getDay(); if(dow===0||dow===6) continue;
          const dStr=`${y2}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          const attVal=allAttendance[dStr]?.[user];
          if (['PEL','ANL','HAL','SIL','SPL'].includes(attVal)) continue;
          workdays++;
          if (allReports[dStr]?.[user]) { written++; if(streakActive) streak++; } else streakActive=false;
        }
        const pct=workdays>0?Math.round((written/workdays)*100):0;
        const barColor=pct>=90?'linear-gradient(90deg,#10b981,#06b6d4)':pct>=70?'linear-gradient(90deg,var(--r-accent),#10b981)':'linear-gradient(90deg,#f59e0b,#ef4444)';
        const barEl=document.getElementById('achieveBar'),pctEl=document.getElementById('achievePct'),detailEl=document.getElementById('achieveDetail'),streakEl=document.getElementById('achieveStreak');
        if(barEl){barEl.style.width=pct+'%';barEl.style.background=barColor;}
        if(pctEl) pctEl.innerText=pct+'%';
        if(detailEl) detailEl.innerText=`${written} written / ${workdays} workdays`;
        if(streakEl) streakEl.innerText=streak>1?`🔥 ${streak} day streak!`:'';
      })();
    } catch(error) { console.error("Calendar Rendering Error:",error); }
  }

  window.changeViewYear = function(y) { viewDate.setFullYear(parseInt(y)); renderMiniCalendar(); };

  /* ── Export dropdown — click-based, body-appended ── */
  document.querySelectorAll('.export-dropdown').forEach(dropdown=>{
    const btn=dropdown.querySelector('button'), content=dropdown.querySelector('.export-content');
    if (!btn||!content) return;
    document.body.appendChild(content);
    const positionMenu=()=>{ const rect=btn.getBoundingClientRect(); content.style.position='fixed'; content.style.top=(rect.bottom+4)+'px'; content.style.left='auto'; content.style.right=(window.innerWidth-rect.right)+'px'; content.style.zIndex='999999'; };
    btn.addEventListener('click',(e)=>{ e.stopPropagation(); const isVisible=content.style.display==='block'; document.querySelectorAll('.export-content').forEach(c=>c.style.display='none'); if(!isVisible){positionMenu();content.style.display='block';} });
    document.addEventListener('click',()=>content.style.display='none');
    content.addEventListener('click',(e)=>e.stopPropagation());
  });

  /* ── Cleanup on tab switch ── */
  window._leavePageCleanup = function() {
    if (window.aiPopupTimer) clearTimeout(window.aiPopupTimer);
  };

  /* Initial load */
  window.loadReport(selectedDateStr);

})();
</script>
