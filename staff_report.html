<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

<style>
/* ══════════════════════════════════════════
   STAFF REPORT — 3D DARK COCKPIT THEME
   Deep navy + electric cyan + amber accents
   SF Mono / system mono for data readability
══════════════════════════════════════════ */

:root {
    --bg:        #040810;
    --surface:   #080f1e;
    --surface2:  #0d1628;
    --surface3:  #111e33;
    --border:    rgba(255,255,255,0.06);
    --border2:   rgba(255,255,255,0.11);
    --cyan:      #06b6d4;
    --blue:      #3b82f6;
    --emerald:   #10b981;
    --amber:     #f59e0b;
    --rose:      #f43f5e;
    --violet:    #818cf8;
    --text:      #e2e8f0;
    --muted:     #475569;
    --dim:       #1e293b;
    --glow-blue: rgba(59,130,246,0.25);
    --glow-cyan: rgba(6,182,212,0.2);
}

/* ── Base ── */
*, *::before, *::after { box-sizing: border-box; }

/* ── 3D Card Mixin ── */
.card-3d {
    position: relative;
    background: linear-gradient(145deg, var(--surface2) 0%, var(--surface) 100%);
    border: 1px solid var(--border);
    border-top: 1px solid var(--border2);
    border-radius: 20px;
    box-shadow:
        0 2px 0 rgba(255,255,255,0.04) inset,
        0 -1px 0 rgba(0,0,0,0.4) inset,
        0 12px 32px rgba(0,0,0,0.5),
        0 4px 12px rgba(0,0,0,0.3);
    transform-style: preserve-3d;
    transition: transform 0.35s cubic-bezier(0.23,1,0.32,1),
                box-shadow 0.35s ease;
}
.card-3d::before {
    content: '';
    position: absolute; top: 0; left: 15%; right: 15%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(99,179,237,0.35), transparent);
    border-radius: 50%;
    pointer-events: none;
}
.card-3d:hover {
    transform: translateY(-5px) rotateX(3deg);
    box-shadow:
        0 2px 0 rgba(255,255,255,0.06) inset,
        0 -1px 0 rgba(0,0,0,0.5) inset,
        0 24px 48px rgba(0,0,0,0.65),
        0 8px 20px rgba(0,0,0,0.4);
}

/* ── Layout ── */
.animate-fadeIn { animation: fadeIn 0.45s cubic-bezier(0.22,1,0.36,1) both; }
@keyframes fadeIn { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }

/* ── Mini Calendar ── */
.mini-cal {
    width: 100%;
    border-collapse: separate;
    border-spacing: 2px;
}
.mini-cal th {
    padding: 10px 0;
    color: var(--muted);
    font-size: 9px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.12em;
}
.mini-cal td {
    height: 68px;
    width: 14.28%;
    background: linear-gradient(145deg, var(--surface3) 0%, var(--surface2) 100%);
    border: 1px solid var(--border);
    border-radius: 10px;
    vertical-align: top;
    padding: 6px;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.23,1,0.32,1);
    position: relative;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.04);
}
.mini-cal td:hover,
.mini-cal td.has-report:hover {
    background: linear-gradient(145deg, rgba(59,130,246,0.12) 0%, var(--surface2) 100%);
    border-color: rgba(59,130,246,0.3);
    transform: translateY(-3px) scale(1.04);
    box-shadow: 0 8px 20px rgba(59,130,246,0.2), inset 0 1px 0 rgba(255,255,255,0.07);
    z-index: 2;
}

.selected-date {
    background: linear-gradient(145deg, rgba(59,130,246,0.2) 0%, rgba(6,182,212,0.1) 100%) !important;
    border: 1px solid rgba(59,130,246,0.55) !important;
    box-shadow: 0 0 0 2px rgba(59,130,246,0.2), 0 8px 24px rgba(59,130,246,0.25) !important;
    transform: translateY(-2px) !important;
}
.selected-date .date-num {
    color: #60a5fa !important;
    font-weight: 900;
    text-shadow: 0 0 10px rgba(59,130,246,0.6);
}

/* ── Date Number ── */
.date-num {
    font-size: 11px;
    font-weight: 900;
    font-family: 'SF Mono', 'Fira Code', monospace;
    color: var(--muted);
    letter-spacing: -0.02em;
}
.text-sun { color: #f87171 !important; text-shadow: 0 0 8px rgba(248,113,113,0.3); }
.text-sat { color: #60a5fa !important; text-shadow: 0 0 8px rgba(96,165,250,0.3); }

/* ── Status Tags ── */
.status-tag {
    position: absolute;
    bottom: 5px; left: 50%;
    transform: translateX(-50%);
    font-size: 7px; font-weight: 900;
    padding: 2px 6px; border-radius: 5px;
    white-space: nowrap; pointer-events: none;
    letter-spacing: 0.06em;
    backdrop-filter: blur(4px);
}
.status-progress {
    background: rgba(59,130,246,0.18);
    color: #93c5fd;
    border: 1px solid rgba(59,130,246,0.35);
    box-shadow: 0 0 8px rgba(59,130,246,0.2);
}
.status-completed {
    background: rgba(16,185,129,0.18);
    color: #6ee7b7;
    border: 1px solid rgba(16,185,129,0.35);
    box-shadow: 0 0 8px rgba(16,185,129,0.2);
}
.status-pending {
    background: rgba(245,158,11,0.18);
    color: #fcd34d;
    border: 1px solid rgba(245,158,11,0.35);
    box-shadow: 0 0 8px rgba(245,158,11,0.2);
}

/* ── Admin dot ── */
.admin-dot {
    position: absolute; top: 6px; right: 6px;
    width: 6px; height: 6px;
    background: #ef4444; border-radius: 50%;
    box-shadow: 0 0 8px rgba(239,68,68,0.8);
    z-index: 10;
    animation: dotPulse 2s ease-in-out infinite;
}
@keyframes dotPulse {
    0%,100% { box-shadow: 0 0 6px rgba(239,68,68,0.8); }
    50% { box-shadow: 0 0 14px rgba(239,68,68,0.4); }
}

/* ── Report Card Fixed (left panel) ── */
.report-card-fixed {
    max-width: 400px;
    width: 100%;
}

/* ── Work Card Container ── */
#workCardContainer .bg-slate-900 {
    background: linear-gradient(145deg, var(--surface2) 0%, var(--surface) 100%) !important;
    border: 1px solid var(--border) !important;
    border-top: 1px solid var(--border2) !important;
    border-radius: 20px !important;
    box-shadow: 0 12px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05) !important;
    transition: box-shadow 0.3s ease !important;
    position: relative;
    overflow: hidden;
}
#workCardContainer .bg-slate-900::before {
    content: '';
    position: absolute; top: 0; left: 15%; right: 15%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(6,182,212,0.3), transparent);
}

/* Editor container */
#workCardContainer .bg-slate-900.border-blue-500\/50 {
    border-color: rgba(59,130,246,0.4) !important;
    box-shadow: 0 12px 32px rgba(0,0,0,0.5), 0 0 0 1px rgba(59,130,246,0.1), inset 0 1px 0 rgba(255,255,255,0.06) !important;
}

/* Textarea & Select in editor */
#workCardContainer textarea,
#workCardContainer select {
    background: rgba(4,8,16,0.8) !important;
    border: 1px solid var(--dim) !important;
    border-radius: 12px !important;
    color: var(--text) !important;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace !important;
    font-size: 12px !important;
    transition: border-color 0.2s, box-shadow 0.2s !important;
}
#workCardContainer textarea:focus,
#workCardContainer select:focus {
    border-color: var(--blue) !important;
    box-shadow: 0 0 0 3px rgba(59,130,246,0.12) !important;
    outline: none !important;
}

/* Save button */
#workCardContainer button.bg-blue-600 {
    background: linear-gradient(135deg, #2563eb, #1d4ed8) !important;
    border-radius: 14px !important;
    font-family: 'SF Mono', monospace !important;
    font-weight: 900 !important;
    letter-spacing: 0.1em !important;
    box-shadow: 0 6px 20px rgba(37,99,235,0.4), inset 0 1px 0 rgba(255,255,255,0.15) !important;
    transition: all 0.2s ease !important;
    border: none !important;
}
#workCardContainer button.bg-blue-600:hover {
    background: linear-gradient(135deg, #3b82f6, #2563eb) !important;
    box-shadow: 0 10px 28px rgba(59,130,246,0.5), inset 0 1px 0 rgba(255,255,255,0.2) !important;
    transform: translateY(-2px) !important;
}
#workCardContainer button.bg-blue-600:active {
    transform: translateY(1px) !important;
    box-shadow: 0 3px 10px rgba(37,99,235,0.3) !important;
}

/* Copy / cancel buttons */
#workCardContainer button.bg-blue-600\/20,
#workCardContainer button.bg-indigo-600\/20 {
    border-radius: 10px !important;
    font-size: 9px !important;
    font-weight: 900 !important;
    letter-spacing: 0.06em !important;
    transition: all 0.2s !important;
}

/* ── Right Panel: Calendar Wrapper ── */
.flex-1.w-full > .bg-slate-900 {
    background: linear-gradient(145deg, var(--surface2) 0%, var(--surface) 100%) !important;
    border: 1px solid var(--border) !important;
    border-top: 1px solid var(--border2) !important;
    border-radius: 24px !important;
    box-shadow:
        0 16px 40px rgba(0,0,0,0.55),
        0 4px 12px rgba(0,0,0,0.3),
        inset 0 1px 0 rgba(255,255,255,0.05) !important;
    position: relative;
    overflow: hidden;
}
.flex-1.w-full > .bg-slate-900::before {
    content: '';
    position: absolute; top: 0; left: 10%; right: 10%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(59,130,246,0.25), rgba(6,182,212,0.25), transparent);
}

/* ── Nav buttons ── */
.nav-btn {
    transition: all 0.2s ease;
    border-radius: 8px;
    font-family: 'SF Mono', monospace;
    font-size: 9px !important;
    font-weight: 900 !important;
    letter-spacing: 0.05em;
}
.nav-btn:hover {
    background: rgba(59,130,246,0.12) !important;
    color: #60a5fa !important;
    box-shadow: 0 0 12px rgba(59,130,246,0.2);
}
.nav-btn:active { transform: scale(0.95); }

/* Nav bar wrapper */
.flex.bg-slate-800.rounded-lg {
    background: linear-gradient(145deg, var(--surface3), var(--surface2)) !important;
    border: 1px solid var(--border) !important;
    border-radius: 10px !important;
    padding: 3px !important;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.04) !important;
}

/* Month title */
#miniCalMonth {
    font-family: 'SF Mono', 'Fira Code', monospace !important;
    font-weight: 900 !important;
    font-style: italic !important;
    color: var(--text) !important;
    letter-spacing: -0.02em !important;
    text-shadow: 0 0 20px rgba(59,130,246,0.2);
}

.year-select {
    background: transparent !important;
    color: var(--cyan) !important;
    font-weight: 900 !important;
    cursor: pointer;
    padding: 0 4px;
    border: none; outline: none; appearance: none;
    text-shadow: 0 0 10px rgba(6,182,212,0.4);
}
.year-select option { background: #0d1628; color: white; }

/* ── Productivity Summary ── */
#productivitySummary {
    background: linear-gradient(145deg, rgba(8,15,30,0.8) 0%, rgba(5,10,20,0.6) 100%) !important;
    border: 1px solid var(--border) !important;
    border-top: 1px solid var(--border2) !important;
    border-radius: 16px !important;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.04) !important;
}

/* Progress bar track */
.w-full.bg-slate-700.rounded-full {
    background: rgba(30,41,59,0.8) !important;
    border-radius: 99px !important;
    overflow: hidden;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.4) !important;
}
#achieveBar {
    border-radius: 99px !important;
    box-shadow: 0 0 12px rgba(6,182,212,0.4) !important;
    transition: width 0.8s cubic-bezier(0.4,0,0.2,1) !important;
}

/* ── Blinking missing dates ── */
@keyframes blink-red {
    0%,100% { opacity: 1; color: #f87171; text-shadow: 0 0 8px rgba(248,113,113,0.6); }
    50% { opacity: 0.3; color: #7f1d1d; text-shadow: none; }
}
.blink-text {
    animation: blink-red 1.2s infinite;
    font-weight: 900;
    font-family: 'SF Mono', monospace;
}

/* ── Import / Export Buttons ── */
.import-btn {
    background: rgba(59,130,246,0.08) !important;
    color: var(--blue) !important;
    border: 1px solid rgba(59,130,246,0.3) !important;
    border-radius: 10px !important;
    font-family: 'SF Mono', monospace !important;
    font-size: 9px !important;
    font-weight: 900 !important;
    letter-spacing: 0.06em !important;
    transition: all 0.2s !important;
    padding: 6px 12px !important;
}
.import-btn:hover {
    background: var(--blue) !important;
    color: white !important;
    box-shadow: 0 4px 16px rgba(59,130,246,0.35) !important;
    transform: translateY(-1px) !important;
}

/* Export dropdown */
.export-dropdown { position: relative; display: inline-block; }
.export-content {
    display: none;
    position: fixed; /* absolute → fixed 로 변경 */
    background: linear-gradient(145deg, #0d1628, #080f1e);
    min-width: 150px;
    box-shadow: 0 16px 32px rgba(0,0,0,0.6), 0 0 0 1px var(--border);
    z-index: 99999; /* 최상위로 올림 */
    border: 1px solid var(--border2);
    border-radius: 14px;
    overflow: hidden;
    backdrop-filter: blur(12px);
}

.export-content button {
    width: 100%; padding: 10px 16px; text-align: left;
    font-size: 9px; font-weight: 900;
    font-family: 'SF Mono', monospace;
    color: var(--muted); transition: all 0.15s;
    text-transform: uppercase; letter-spacing: 0.06em;
    border-bottom: 1px solid var(--border);
    background: none;
}
.export-content button:last-child { border-bottom: none; }
.export-content button:hover {
    background: rgba(59,130,246,0.1);
    color: #60a5fa;
    padding-left: 22px;
}

/* ── Staff List ── */
.staff-list-container {
    margin-top: 16px;
    background: linear-gradient(145deg, var(--surface2) 0%, var(--surface) 100%);
    border: 1px solid var(--border);
    border-top: 1px solid var(--border2);
    border-radius: 18px;
    padding: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.04);
}
.staff-list-title {
    font-size: 9px; font-weight: 900;
    font-family: 'SF Mono', monospace;
    color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 14px;
    display: flex; justify-content: space-between; align-items: center;
}
.staff-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 8px;
}
.staff-item {
    background: linear-gradient(145deg, var(--surface3), var(--surface2));
    padding: 10px 12px;
    border-radius: 12px;
    cursor: pointer;
    border: 1px solid var(--border);
    transition: all 0.2s cubic-bezier(0.23,1,0.32,1);
    box-shadow: 0 2px 8px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.04);
}
.staff-item:hover {
    border-color: rgba(59,130,246,0.4);
    background: linear-gradient(145deg, rgba(59,130,246,0.1), var(--surface2));
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 8px 20px rgba(59,130,246,0.2), inset 0 1px 0 rgba(255,255,255,0.07);
}
.staff-name {
    font-size: 11px; font-weight: 700;
    color: var(--text); display: block;
    font-family: 'SF Mono', monospace;
}
.staff-status {
    font-size: 7px; font-weight: 900;
    padding: 2px 7px; border-radius: 5px;
    margin-top: 5px; display: inline-block;
    text-transform: uppercase; letter-spacing: 0.06em;
}

/* ── Modal ── */
.report-modal {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(10px);
    z-index: 20000;
    align-items: center; justify-content: center;
    padding: 20px;
}
.modal-content {
    background: linear-gradient(145deg, #0d1628 0%, #080f1e 100%);
    border: 1px solid rgba(59,130,246,0.3);
    border-top: 1px solid rgba(59,130,246,0.5);
    width: 100%; max-width: 520px;
    border-radius: 24px; padding: 28px;
    position: relative; max-height: 85vh; overflow-y: auto;
    box-shadow:
        0 40px 80px rgba(0,0,0,0.7),
        0 0 0 1px rgba(255,255,255,0.05),
        inset 0 1px 0 rgba(255,255,255,0.07);
    animation: modalIn 0.35s cubic-bezier(0.23,1,0.32,1) both;
}
@keyframes modalIn {
    from { opacity:0; transform: scale(0.94) translateY(20px); }
    to   { opacity:1; transform: none; }
}
.modal-close {
    position: absolute; top: 18px; right: 18px;
    color: var(--muted); cursor: pointer;
    font-size: 22px; line-height: 1;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    transition: all 0.2s;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
}
.modal-close:hover {
    color: white;
    background: rgba(244,63,94,0.15);
    border-color: rgba(244,63,94,0.3);
    box-shadow: 0 0 12px rgba(244,63,94,0.2);
}

/* ── Hover Popup ── */
#reportHoverPopup {
    position: fixed;
    z-index: 999999 !important;
    pointer-events: none;
    background: linear-gradient(145deg, #0d1628, #080f1e);
    border: 1px solid rgba(59,130,246,0.4);
    padding: 14px 16px;
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.05);
    width: 290px;
    display: none;
    font-size: 11px;
    color: var(--text);
    backdrop-filter: blur(16px);
}
.popup-label {
    color: var(--blue);
    font-weight: 900;
    font-size: 8px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 3px;
    display: block;
    font-family: 'SF Mono', monospace;
}
.popup-content {
    margin-bottom: 10px;
    white-space: pre-wrap;
    word-break: break-all;
    color: #93c5fd;
    line-height: 1.5;
    font-family: 'SF Mono', monospace;
    font-size: 10px;
}

/* ── AI Alert Popup ── */
#leaveStatusAlert {
    position: fixed;
    top: 24px; left: 0; right: 0;
    display: none;
    justify-content: center;
    align-items: flex-start;
    z-index: 100000;
    pointer-events: none;
    padding: 0 16px;
}
#leaveAlertContent {
    pointer-events: auto;
    background: linear-gradient(145deg, rgba(8,15,30,0.97), rgba(5,10,20,0.97));
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1.5px solid var(--emerald);
    box-shadow:
        0 0 30px rgba(16,185,129,0.3),
        0 24px 48px rgba(0,0,0,0.7),
        inset 0 1px 0 rgba(255,255,255,0.07);
    width: 90%; max-width: 460px;
    border-radius: 20px;
    opacity: 0;
    transform: scale(0.92) translateY(-16px);
    transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
}
#leaveAlertContent.show {
    opacity: 1;
    transform: scale(1) translateY(0);
}
.ai-glow-text { text-shadow: 0 0 10px rgba(16,185,129,0.5); }
@keyframes pulse-slow {
    0%,100% { box-shadow: 0 0 20px rgba(59,130,246,0.2), 0 24px 48px rgba(0,0,0,0.7); }
    50% { box-shadow: 0 0 35px rgba(59,130,246,0.4), 0 24px 48px rgba(0,0,0,0.7); }
}
.animate-pulse-slow { animation: pulse-slow 2s infinite; }

@media (max-width: 640px) {
    #leaveStatusAlert { top: 35%; align-items: center; }
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: #334155; }

/* ── Weekend col width ── */
.mini-cal col.weekend { width: 5%; }
.mini-cal col.weekday { width: calc((100% - 10%) / 5); }
.mini-cal td:nth-child(1),
.mini-cal td:nth-child(7) { width: 5%; padding: 3px 2px; }
.mini-cal td:nth-child(1) .date-num,
.mini-cal td:nth-child(7) .date-num { font-size: 8px; }

/* ── Action Buttons (Edit/Delete/Copy) ── */
#actionButtons button {
    font-family: 'SF Mono', monospace !important;
    font-size: 9px !important;
    font-weight: 900 !important;
    letter-spacing: 0.06em !important;
    border-radius: 8px !important;
    padding: 6px 12px !important;
    transition: all 0.2s !important;
}
#actionButtons .text-indigo-400 {
    background: rgba(99,102,241,0.08) !important;
    border: 1px solid rgba(99,102,241,0.2) !important;
    padding: 5px 10px !important;
    border-radius: 8px !important;
}
#actionButtons .text-indigo-400:hover {
    background: rgba(99,102,241,0.2) !important;
    color: #a5b4fc !important;
}
#actionButtons .text-rose-500 {
    background: rgba(244,63,94,0.08) !important;
    border: 1px solid rgba(244,63,94,0.2) !important;
    padding: 5px 10px !important;
    border-radius: 8px !important;
}
#actionButtons .text-rose-500:hover {

<script>
(function() {
    const user = sessionStorage.getItem('loggedInUser');
    const db = firebase.database();
    let viewDate = new Date(), selectedDateStr = new Date().toISOString().split('T')[0], currentReportData = null;

    if (!user || user === "null") {
        alert("Login required.");
        if(document.getElementById('workCardContainer')) document.getElementById('workCardContainer').innerHTML = '<p class="text-slate-500">Login is required.</p>';
        return; 
    }

    const getTempKey = (date) => `temp_report_${user}_${date}`;
    const escapeHtml = (s) => s ? s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#039;"}[m])) : '-';

    window.importStaffReport = (e) => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const data = new Uint8Array(ev.target.result), workbook = XLSX.read(data, {type:'array', cellDates:true});
                const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                if (!jsonData.length || !confirm(`Save ${jsonData.length} records?`)) return;
                let sc = 0;
                Promise.all(jsonData.map(row => {
                    let rd = row["Date"], dk = "";
                    if (typeof rd === 'number') dk = new Date(Math.round((rd - 25569) * 86400 * 1000)).toISOString().split('T')[0];
                    else if (rd instanceof Date) dk = rd.toISOString().split('T')[0];
                    else if (typeof rd === 'string') dk = rd.trim();
                    if (!/^\d{4}-\d{2}-\d{2}$/.test(dk)) return Promise.resolve();
                    return db.ref(`reports/${dk}/${user}`).set({
                        status: row["Status"] || "In Progress", todo: row["To-Do"] || "", summary: row["Summary"] || "",
                        adminMemo: row["Admin Memo"] || "", time: row["Update Time"] || new Date().getHours().toString().padStart(2,'0')+":00"
                    }).then(() => sc++);
                })).then(() => { alert(`Imported ${sc} reports.`); window.loadReport(selectedDateStr); e.target.value=''; });
            } catch(err) { alert("Parsing error."); }
        }; reader.readAsArrayBuffer(file);
    };

    window.exportStaffReport = (mode) => {
        const y = viewDate.getFullYear(), m = viewDate.getMonth() + 1;
        db.ref('reports').once('value', (snap) => {
            const allData = snap.val() || {}, rows = [], sDates = Object.keys(allData).sort();
            let fn = "";
            sDates.forEach(dk => {
                const r = allData[dk]?.[user]; if (!r) return;
                const [ry, rm] = dk.split('-').map(Number);
                let inc = (mode==='monthly' && ry===y && rm===m) || (mode==='yearly' && ry===y) || (mode==='all');
                if (inc) {
                    if(!fn) fn = mode==='monthly' ? `WorkReport_${user}_${y}-${String(m).padStart(2,'0')}.xlsx` : mode==='yearly' ? `WorkReport_${user}_Year_${y}.xlsx` : `WorkReport_${user}_AllTime.xlsx`;
                    rows.push({"Date":dk, "Status":r.status||"In Progress", "To-Do":r.todo||"", "Summary":r.summary||r.content||"", "Admin Memo":r.adminMemo||"", "Update Time":r.time||""});
                }
            });
            if (!rows.length) return alert("No data.");
            const ws = XLSX.utils.json_to_sheet(rows), wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Report");
            const range = XLSX.utils.decode_range(ws['!ref']);
            for (let R = range.s.r; R <= range.e.r; ++R) {
                for (let C = range.s.c; C <= range.e.c; ++C) {
                    const addr = XLSX.utils.encode_cell({r:R, c:C}); if (!ws[addr]) continue;
                    ws[addr].s = { alignment:{wrapText:true, vertical:'top', horizontal:'left'}, font:{name:'Arial', sz:10} };
                    if (R === 0) { ws[addr].s.fill = {fgColor:{rgb:"F2F2F2"}}; ws[addr].s.font.bold = true; }
                }
            }
            ws['!cols'] = [{wch:12}, {wch:12}, {wch:45}, {wch:55}, {wch:35}, {wch:12}];
            XLSX.writeFile(wb, fn);
        });
    };

    window.updateCharCount = (tid, cid) => {
        const t = document.getElementById(tid), c = document.getElementById(cid), max = 2000;
        if (t.value.length > max) { alert("Max 2,000 characters exceeded."); t.value = t.value.substring(0, max); }
        c.innerText = `${t.value.length}/${max}`;
        c.style.color = t.value.length >= max ? "#ef4444" : "#64748b";
        c.style.fontWeight = t.value.length >= max ? "900" : "normal";
        if(window.saveToTemp) window.saveToTemp();
    };
    window.saveToTemp = () => {
        let td = document.getElementById('editTodo')?.value || "", sm = document.getElementById('editSummary')?.value || "";
        const st = document.getElementById('editStatus')?.value, max = 2000;
        const data = { todo:td.substring(0,max), summary:sm.substring(0,max), status:st, timestamp: Date.now() };
        localStorage.setItem(getTempKey(selectedDateStr), JSON.stringify(data));
    };

    window.clearTemp = (d) => localStorage.removeItem(getTempKey(d));
    window.changeViewMonth = (o) => { viewDate.setMonth(viewDate.getMonth() + o); if(typeof renderMiniCalendar==='function') renderMiniCalendar(); };
    window.goToday = () => { viewDate = new Date(); selectedDateStr = new Date().toISOString().split('T')[0]; window.loadReport(selectedDateStr); };

// --- [수정] saveReport 함수 ---
window.saveReport = () => {
    const tdF = document.getElementById('editTodo'), 
          smF = document.getElementById('editSummary'), 
          stF = document.getElementById('editStatus'), 
          max = 2000;
    
    if(!tdF.value.trim() && !smF.value.trim()) return alert("Enter content.");
    if((tdF.value.length > max || smF.value.length > max) && !confirm(`Exceeds ${max} chars. Save first ${max}?`)) return;
    
    const now = new Date(), 
          time = now.getHours().toString().padStart(2,'0')+":"+now.getMinutes().toString().padStart(2,'0');
    
    const data = { 
        todo: tdF.value.substring(0,max), 
        summary: smF.value.substring(0,max), 
        status: stF.value, 
        time: time 
    };
    
    if (currentReportData?.adminMemo) data.adminMemo = currentReportData.adminMemo;
    
    db.ref(`reports/${selectedDateStr}/${user}`).set(data).then(() => {
        // [추가] 저장 성공 후 AI Assistant 팝업 호출
        window.showReportAI(selectedDateStr, smF.value); 
        
        window.clearTemp(selectedDateStr); 
        window.loadReport(selectedDateStr); 
    }).catch(() => alert("Error."));
};

// 전역 변수 설정
let isAILoading = false;

window.showReportAI = async function(date, summary) {
    // 중복 클릭 방지: 이미 로딩 중이면 실행하지 않음
    if (isAILoading) return;
    isAILoading = true;

    const container = document.getElementById('leaveStatusAlert');
    const content = document.getElementById('leaveAlertContent');
    const icon = document.getElementById('leaveAlertIcon');
    const title = document.getElementById('leaveAlertTitle');
    const msg = document.getElementById('leaveAlertMsg');

    if(!container || !content) {
        isAILoading = false;
        return;
    }

    // 1. UI 즉시 표시 (로딩 상태)
    container.style.display = 'flex';
    content.className = "p-5 rounded-[1.5rem] border-2 flex items-center justify-between shadow-2xl bg-slate-900/95 border-blue-500 w-full animate-pulse-slow show";
    icon.innerText = "🧠";
    title.innerText = "AI System Checking...";
    msg.innerHTML = `<span class="text-blue-400 text-xs font-bold italic">AI sedang analysis report...</span>`;
    
    setTimeout(() => content.classList.add('show'), 10);

    let aiResponse = "";
    const dateLabel = date.split('-').slice(1).join('/');

    try {
        // Firebase 경로 확인 및 API Key 호출
        let apiKey = (typeof config !== 'undefined' && config.LLMAPIkey) ? config.LLMAPIkey : "";
        
        if (!apiKey) {
            console.log("Config not ready, fetching API Key from Firebase...");
            // 경로가 'settings/config/LLMAPIkey'인지 확인 필요
            const snap = await firebase.database().ref('settings/config/LLMAPIkey').once('value');
            apiKey = snap.val();
        }

        if (!apiKey) throw new Error("LLM API Key missing");

        const url = "https://api.groq.com/openai/v1/chat/completions";
        const prompt = `[REPORT_ANALYSIS]
            User: ${sessionStorage.getItem('loggedInUser') || 'Staff'}
            Work Summary: ${summary}

function getSafeText(html) {
    if (!html) return "";
    let tmp = document.createElement("DIV");
    tmp.innerHTML = html;
    let text = tmp.textContent || tmp.innerText || "";
    
    // 1. 따옴표 처리 (JS 오류 방지)
    // 2. 줄바꿈(\n)을 HTML 줄바꿈(<br>)으로 변환하여 팝업에서 줄바꿈 유지
    return text.replace(/'/g, "\\'").replace(/\n/g, "<br>");
}

window.showReportPopup = function(event, todo, summary) {
    // 팝업을 body 직하위로 이동 (컨테이너 overflow 제약 탈출)
    let popup = document.getElementById('reportHoverPopup');
    if (!popup) return;
    if (popup.parentElement !== document.body) {
        document.body.appendChild(popup);
    }

    popup.innerHTML = `
        <span class="popup-label">To-Do</span>
        <div class="popup-content">${todo || 'No data'}</div>
        <span class="popup-label" style="color:#10b981">Summary</span>
        <div class="popup-content" style="color:#f1f5f9">${summary || 'No data'}</div>
    `;
    popup.style.visibility = 'hidden';
    popup.style.display = 'block';
    window.moveReportPopup(event);
    popup.style.visibility = 'visible';
};

window.moveReportPopup = function(event) {
    const popup = document.getElementById('reportHoverPopup');
    if (!popup) return;

    // staff.html의 <main> 스크롤 컨테이너 찾기
    // contentFrame을 감싸는 overflow-y:auto 컨테이너의 scrollTop을 반영
    let scrollContainerTop = 0;
    let scrollContainerLeft = 0;
    let el = event.target;
    while (el && el !== document.body) {
        const style = window.getComputedStyle(el);
        const overflow = style.overflow + style.overflowY + style.overflowX;
        if (/auto|scroll/.test(overflow)) {
            scrollContainerTop  += el.scrollTop;
            scrollContainerLeft += el.scrollLeft;
        }
        el = el.parentElement;
    }

    // clientX/Y (뷰포트 기준) + 스크롤 컨테이너 보정
    const rawX = event.clientX;
    const rawY = event.clientY;

    const popupW = popup.offsetWidth || 290;
    const popupH = popup.offsetHeight || 160;
    const gap    = 14;
    const margin = 8;

    let posX = rawX + gap;
    let posY = rawY + gap;

    if (posX + popupW > window.innerWidth  - margin) posX = rawX - popupW - gap;
    if (posX < margin) posX = margin;
    if (posY + popupH > window.innerHeight - margin) posY = rawY - popupH - gap;
    if (posY < margin) posY = margin;

    popup.style.left = posX + 'px';
    popup.style.top  = posY + 'px';
};

window.hideReportPopup = function() {
    const popup = document.getElementById('reportHoverPopup');
    if(popup) popup.style.display = 'none';
};


async function renderMiniCalendar() {
    const year = viewDate.getFullYear();
    const month = viewDate.getMonth();
    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();
    const monthName = viewDate.toLocaleString('en-US', { month: 'long' }).toUpperCase();
    
    const todayStr = new Date().toISOString().split('T')[0];

    // Year selection
    let yearOptions = '';
    for (let y = year - 5; y <= year + 5; y++) { 
        yearOptions += `<option value="${y}" ${y === year ? 'selected' : ''}>${y}</option>`; 
    }
    document.getElementById('miniCalMonth').innerHTML = `${monthName} <select class="year-select" onchange="window.changeViewYear(this.value)">${yearOptions}</select>`;
    
    try {
        // [추가] reports와 attendance 데이터를 동시에 가져옵니다.
        const [reportSnap, attendSnap] = await Promise.all([
            db.ref('reports').once('value'),
            db.ref('attendance').once('value')
        ]);

        const allReports = reportSnap.val() || {};
        const allAttendance = attendSnap.val() || {};
        const tbody = document.getElementById('miniCalBody');
        tbody.innerHTML = '';

        // --- [수정] 최근 7일 작성 여부 체크 (토/일 제외 + 휴가 제외) ---
        const writtenDatesContainer = document.getElementById('writtenDates');
        const missingDatesContainer = document.getElementById('missingDates');
        
if (writtenDatesContainer && missingDatesContainer) {
            // 1. 해당 유저의 WarnFlag 상태 확인 (users 노드 참조)
            const userSettingsSnap = await db.ref(`users/${user}/WarnFlag`).once('value');
            const warnFlag = userSettingsSnap.val();

            if (warnFlag === "off") {
                // WarnFlag가 off인 경우 표시할 메시지
                writtenDatesContainer.innerHTML = '<span class="text-slate-500 italic uppercase">Monitoring Paused</span>';
                missingDatesContainer.innerHTML = `<span class="text-amber-500 font-bold text-[10px] uppercase tracking-wider">
                    THIS STAFF IS IN "WARNFLAG OFF" STATUS.
                </span>`;
            } else {
                // 기존 로직: WarnFlag가 on이거나 설정이 없을 때 (정상 체크)
                let writtenArr = [];
                let missingArr = [];
                const leaveTypes = ['PEL', 'ANL', 'HAL', 'SIL', 'SPL'];
                
                for (let i = 0; i < 7; i++) {
                    let d = new Date();
                    d.setDate(d.getDate() - i);
                    
                    let dayOfWeek = d.getDay(); 
                    let dStr = d.toISOString().split('T')[0];
                    
                    const userAtnd = allAttendance[dStr]?.[user];
                    const isOnLeave = leaveTypes.includes(userAtnd);
                    
                    if (allReports[dStr] && allReports[dStr][user]) {
                        writtenArr.push(dStr);
                    } else {
                        if (dayOfWeek !== 0 && dayOfWeek !== 6 && !isOnLeave) {
                            missingArr.push(dStr);
                        }
                    }
                }
                
                writtenDatesContainer.innerHTML = writtenArr.length > 0 
                    ? writtenArr.map(date => `<span class="mr-2">${date}</span>`).join('') 
                    : '<span class="text-slate-600">No records</span>';
                    
                missingDatesContainer.innerHTML = missingArr.length > 0 
                    ? missingArr.map(date => `<span class="blink-text mr-2">${date}</span>`).join('') 
                    : '<span class="text-emerald-500 font-black text-[10px]">ALL COMPLETED!</span>';
            }
        }

        // --- 캘린더 그리드 그리기 ---
        let summaryCount = { "Completed": 0, "Pending": 0, "In Progress": 0 };
        let date = 1;
        const leaveTypes = ['PEL', 'ANL', 'HAL', 'SIL', 'SPL'];

        for (let i = 0; i < 6; i++) {
            let row = document.createElement('tr');
            for (let j = 0; j < 7; j++) {
                let cell = document.createElement('td');
                if ((i === 0 && j < firstDay) || date > lastDate) { 
                    row.appendChild(cell); 
                } else {
                    const curDate = date;
                    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(curDate).padStart(2, '0')}`;
                    
                    let dayColorClass = "text-slate-500"; 
                    if (j === 0) dayColorClass = "text-sun";
                    else if (j === 6) dayColorClass = "text-sat";
                    if (dateStr === todayStr) dayColorClass = "text-blue-500";

                    let cellHTML = `<div class="date-num text-xs font-bold ${dayColorClass}">${curDate}</div>`;
                    
                    const userReport = (allReports[dateStr] && allReports[dateStr][user]) ? allReports[dateStr][user] : null;
                    const userAtnd = allAttendance[dateStr]?.[user];
                    const isLeave = leaveTypes.includes(userAtnd);

                    // 1. 리포트가 있는 경우 (기존 로직)
                    if (userReport) {
                        cell.classList.add('has-report');
                        const status = userReport.status || "In Progress";
                        if (summaryCount.hasOwnProperty(status)) {
                            summaryCount[status]++;
                        }

                        if (userReport.adminMemo && userReport.adminMemo.trim() !== "") {
                            cellHTML += `<div class="admin-dot" title="Admin feedback available"></div>`;
                        }

                        let statusClass = status === 'Completed' ? "status-completed" : (status === 'Pending' ? "status-pending" : "status-progress");
                        let statusText = status === 'Completed' ? "COMPLETED" : (status === 'Pending' ? "PENDING" : "PROGRESS");
                        
                        cellHTML += `<div class="status-tag ${statusClass}">${statusText}</div>`;
                        
                        const safeTodo = getSafeText(userReport.todo || "-");
                        const safeSummary = getSafeText(userReport.summary || userReport.content || "-");

                        cell.onmouseenter = (e) => window.showReportPopup(e, safeTodo, safeSummary);
                        cell.onmousemove = (e) => window.moveReportPopup(e);
                        cell.onmouseleave = () => window.hideReportPopup();
                    } 
                    // 2. 리포트는 없지만 휴가인 경우 (추가된 기능)
                    else if (isLeave) {
                        cellHTML += `<div class="status-tag bg-rose-500/20 text-rose-500 border border-rose-500/30 font-black">${userAtnd}</div>`;
                    }
                    
                    cell.innerHTML = cellHTML;
                    if (dateStr === selectedDateStr) cell.classList.add('selected-date');
                    
                    cell.onclick = () => {
                        window.hideReportPopup();
                        window.loadReport(dateStr);
                    };
                    row.appendChild(cell);
                    date++;
                }
            }
            tbody.appendChild(row);
            if (date > lastDate) break;
        }

        // 하단 요약 카운트 업데이트
        if (document.getElementById('countCompleted')) {
            document.getElementById('countCompleted').innerText = summaryCount["Completed"];
            document.getElementById('countPending').innerText = summaryCount["Pending"];
            document.getElementById('countProgress').innerText = summaryCount["In Progress"];
        }

        // ▼ 여기에 추가 (summaryCount 업데이트 바로 다음)
        (async function updateAchievement() {
            const now = new Date();
            const y = now.getFullYear(), mo = now.getMonth();
            let workdays = 0, written = 0, streak = 0, streakActive = true;

            for (let d = 1; d <= now.getDate(); d++) {
                const dow = new Date(y, mo, d).getDay();
                if (dow === 0 || dow === 6) continue;

                const dStr = `${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const attVal = allAttendance[dStr]?.[user];

                // 휴가일은 workday에서 제외
                if (['PEL','ANL','HAL','SIL','SPL'].includes(attVal)) continue;

                workdays++;
                if (allReports[dStr]?.[user]) {
                    written++;
                    if (streakActive) streak++;
                } else {
                    streakActive = false;
                }
            }

            const pct = workdays > 0 ? Math.round((written / workdays) * 100) : 0;
            const barColor = pct >= 90
                ? 'linear-gradient(90deg,#10b981,#06b6d4)'
                : pct >= 70
                    ? 'linear-gradient(90deg,#3b82f6,#10b981)'
                    : 'linear-gradient(90deg,#f59e0b,#ef4444)';

            const barEl    = document.getElementById('achieveBar');
            const pctEl    = document.getElementById('achievePct');
            const detailEl = document.getElementById('achieveDetail');
            const streakEl = document.getElementById('achieveStreak');

            if (barEl)    { barEl.style.width = pct + '%'; barEl.style.background = barColor; }
            if (pctEl)    pctEl.innerText = pct + '%';
            if (detailEl) detailEl.innerText = `${written} written / ${workdays} workdays`;
            if (streakEl) streakEl.innerText = streak > 1 ? `🔥 ${streak} day streak!` : '';
        })();


    } catch (error) {
        console.error("Calendar Rendering Error:", error);
    }
}

window.copyReportText = function() {

    // 클립보드 API 사용
    navigator.clipboard.writeText(textToCopy).then(() => {
        alert("Report copied to clipboard!");
    }).catch(err => {
        // 구형 브라우저 대응용 fallback
        const textArea = document.createElement("textarea");
        textArea.value = textToCopy;
        document.body.appendChild(textArea);
        textArea.select();
        try {
            document.execCommand('copy');
            alert("Report copied to clipboard!");

        }
        document.body.removeChild(textArea);
    });
};

    const staffListArea = document.getElementById('staffListArea');
    const staffGrid = document.getElementById('staffGrid');
    const targetDateDisplay = document.getElementById('targetDateDisplay');
    
    firebase.database().ref(`reports/${dateStr}`).once('value', (snapshot) => {
        const staffData = snapshot.val();
        staffGrid.innerHTML = '';
        targetDateDisplay.innerText = dateStr;
        
        if (staffData) {
            const staffNames = Object.keys(staffData);
            document.getElementById('staffCount').innerText = `${staffNames.length} persons`;
            
            staffNames.forEach(name => {
                const data = staffData[name];
                const statusClass = data.status === 'Completed' ? "status-completed" : (data.status === 'Pending' ? "status-pending" : "status-progress");
                
                const item = document.createElement('div');
                item.className = 'staff-item';
                item.onclick = () => window.openStaffDetail(name, dateStr);
                item.innerHTML = `
                    <span class="staff-name">${name}</span>
                    <span class="staff-status ${statusClass}">${data.status || 'In Progress'}</span>
                `;
                staffGrid.appendChild(item);
            });
            staffListArea.classList.remove('hidden');
        } else {
            staffListArea.classList.add('hidden');
        }
    });
};

// ─ 자동 Numbering (Summary용) ─
window.autoNumberingSummary = function(textarea) {
    let text = textarea.value;
    
    // 자동으로 번호를 붙이기: 새 줄 시작할 때 번호 없으면 추가
    const lines = text.split('\n');
    let numbered = false;
    
    for (let i = 0; i < lines.length; i++) {
        const trimmed = lines[i].trim();
        // 숫자로 시작하지 않는 줄이면
        if (trimmed && !/^\d+\.\s/.test(trimmed) && trimmed !== "") {
            // 이미 다른 번호가 있는지 확인
            if (!/^\d+/.test(trimmed)) {
                // 현재 섹션의 번호 찾기
                let sectionNum = 1;
                for (let j = i - 1; j >= 0; j--) {
                    const match = lines[j].match(/^(\d+)\.\s/);
                    if (match) {
                        sectionNum = parseInt(match[1]) + 1;
                        break;
                    }
                }
                lines[i] = `${sectionNum}. ${trimmed}`;
                numbered = true;
            }
        }
    }
    
    if (numbered) {
        textarea.value = lines.join('\n');
        window.autoResize(textarea);
    }
};

// ─ To-Do 자동 공백 및 Numbering ─
window.autoNumberingTodo = function(textarea) {
    let text = textarea.value;
    
    // 빈 줄 감지 및 자동 공백 추가 (최대 10개 항목)
    const lines = text.split('\n');
    const maxItems = 10;
    
    // 기존 항목 수 세기
    let itemCount = lines.filter(line => /^[\d\-\*]\s/.test(line.trim())).length;
    
    // 마지막 줄에서 Enter를 누르면 다음 항목 자동 추가
    if (lines.length > 0) {
        const lastLine = lines[lines.length - 1].trim();
        
        // 마지막 줄이 비어있고, 항목이 10개 미만이면 다음 번호 제안
        if (lastLine === '' && itemCount < maxItems) {
            // 자동으로 다음 번호 추가 (선택 사항)
            // 이 부분은 주석 처리함 - 사용자가 자유롭게 입력할 수 있도록
        }
    }
};

// ─ Bold 토글 (Drag 버그 수정) ─
window.toggleBold = function(textareaId) {
    const el = document.getElementById(textareaId);
    if (!el) return;
    
    el.focus();
    const start = el.selectionStart;
    const end = el.selectionEnd;
    const selected = el.value.substring(start, end);
    
    if (selected) {
        const replacement = `**${selected}**`;
        el.value = el.value.substring(0, start) + replacement + el.value.substring(end);
        setTimeout(() => {
            el.selectionStart = start + 2;
            el.selectionEnd = start + 2 + selected.length;
        }, 0);
    } else {
        el.value = el.value.substring(0, start) + '**bold**' + el.value.substring(start);
    }
    window.autoResize(el);
    window.saveToTemp();
};

};

// ─ Emoji Picker 열기 (Drag 버그 수정) ─
window.openEmojiPicker = function(event, textareaId) {
    event.preventDefault();
    event.stopPropagation();
    
    const el = document.getElementById(textareaId);
    if (!el) return;
    
    el.focus();
    const emojis = ['😊', '👍', '✅', '📝', '🚀', '💯', '⭐', '🎯', 
                     '📌', '💡', '🔥', '⚡', '🎨', '🛠️', '✨', '🎁'];
    
    let picker = document.getElementById('emojiPicker');
    if (picker) picker.remove();
    
    picker = document.createElement('div');
    picker.id = 'emojiPicker';
    picker.className = 'emoji-picker-grid';
    picker.style.top = (event.clientY + 10) + 'px';
    picker.style.left = (event.clientX) + 'px';
    
    emojis.forEach(emoji => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'emoji-btn';
        btn.innerText = emoji;
        btn.onmousedown = (e) => {
            e.preventDefault();
            const start = el.selectionStart;
            el.value = el.value.substring(0, start) + emoji + el.value.substring(start);
            el.selectionStart = start + emoji.length;
            el.focus();
            window.autoResize(el);
            window.saveToTemp();
            picker.remove();
        };
        picker.appendChild(btn);
    });
    
    document.body.appendChild(picker);
    
    setTimeout(() => {
        document.addEventListener('click', function closeEmojiPicker(e) {
            if (picker && !picker.contains(e.target)) {
                picker.remove();
                document.removeEventListener('click', closeEmojiPicker);
            }
        });
    }, 0);
};

window.cancelEdit = function() {
    if (confirm("Discard changes and return?")) {
        window.clearTemp(selectedDateStr);
        window.loadReport(selectedDateStr);
    }
};
// Export 드롭다운 — click 방식으로 변경 (hover 위치 문제 완전 해결)
        document.querySelectorAll('.export-dropdown').forEach(dropdown => {
            const btn     = dropdown.querySelector('button');
            const content = dropdown.querySelector('.export-content');
            if (!btn || !content) return;

            // content를 body로 이동 (overflow 완전 탈출)
            document.body.appendChild(content);

            const positionMenu = () => {
                const rect = btn.getBoundingClientRect();
                content.style.position = 'fixed';
                content.style.top      = (rect.bottom + 4) + 'px';
                content.style.left     = 'auto';
                content.style.right    = (window.innerWidth - rect.right) + 'px';
                content.style.zIndex   = '999999';
            };

            // 클릭으로 토글
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const isVisible = content.style.display === 'block';
                // 다른 열린 드롭다운 모두 닫기
                document.querySelectorAll('.export-content').forEach(c => c.style.display = 'none');
                if (!isVisible) {
                    positionMenu();
                    content.style.display = 'block';
                }
            });

            // 외부 클릭 시 닫기
            document.addEventListener('click', () => {
                content.style.display = 'none';
            });

            // content 내부 클릭이 외부 클릭으로 전파되지 않도록
            content.addEventListener('click', (e) => e.stopPropagation());
        });

        loadReport(selectedDateStr);
    })();
</script>
