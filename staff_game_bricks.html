<style>
    /* 전체 화면 설정 및 스크롤 방지 */
    html, body { 
        margin: 0; padding: 0; width: 100%; height: 100%; 
        overflow: hidden; background: #0f172a; position: fixed; 
    }
    #gameCanvas { display: block; touch-action: none; width: 100%; height: 100%; }
    
    /* 상단 UI 바 */
    #gameUI { 
        position: absolute; top: 0; left: 0; width: 100%; height: 60px;
        background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px);
        border-bottom: 2px solid rgba(59, 130, 246, 0.3);
        display: none; justify-content: space-between; align-items: center;
        padding: 0 15px; z-index: 100; box-sizing: border-box;
    }
    
    .stat-group { display: flex; align-items: center; gap: 10px; }
    .stat-box { 
        background: rgba(255, 255, 255, 0.05); padding: 4px 10px;
        border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1);
        display: flex; flex-direction: column; min-width: 60px;
    }
    .stat-label { font-size: 8px; color: #94a3b8; font-weight: 800; text-transform: uppercase; }
    .stat-value { font-size: 18px; font-weight: 900; color: #fff; font-family: monospace; line-height: 1.2; }
    #livesDisplay { font-size: 14px; }
</style>

<div id="gameIntro" class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center z-50 bg-slate-950/95 backdrop-blur-md">
    <h2 class="text-4xl font-black text-white italic mb-2 tracking-tighter uppercase text-transparent bg-clip-text bg-gradient-to-b from-white to-slate-500">Brick Breaker</h2>
    <div class="w-full max-w-xs bg-slate-800/30 rounded-3xl p-6 border border-slate-700/50 mb-8 shadow-2xl">
        <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Daily Top Records</h3>
        <div id="rankingList" class="space-y-2 text-left">
            <p class="text-slate-600 text-xs py-2 text-center">Loading...</p>
        </div>
    </div>
    <button onclick="startGame()" class="px-12 py-4 bg-blue-600 hover:bg-blue-500 text-white font-black rounded-2xl transition-all active:scale-95 shadow-xl uppercase tracking-widest">
        Game Start
    </button>
</div>

<div id="gameUI">
    <div class="stat-group">
        <div class="stat-box">
            <span class="stat-label">LV</span>
            <span id="levelDisplay" class="stat-value text-yellow-400">01</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">SCORE</span>
            <span id="scoreDisplay" class="stat-value text-blue-400">0</span>
        </div>
    </div>
    <div class="stat-box text-right" style="min-width: fit-content;">
        <span class="stat-label">LIVES</span>
        <span id="livesDisplay" class="stat-value text-rose-500">❤️❤️❤️</span>
    </div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
(function() {
    const cvs = document.getElementById("gameCanvas");
    const ctx = cvs.getContext("2d");
    const db = firebase.database();

    let score = 0, lives = 3, level = 1, maxLevel = 20, gameRunning = false, bricks = [];
    let paddle = { width: 0, height: 16, x: 0, bottomOffset: 80 }; 
    let ball = { x: 0, y: 0, dx: 0, dy: 0, radius: 7, baseSpeed: 4.5 };
    let brickConfig = { rowCount: 0, columnCount: 0, width: 0, height: 20, padding: 5, offsetTop: 100 };

    // 1. 랭킹 로드 함수를 window에 안전하게 등록
    window.loadRankings = function() {
        const today = new Date().toISOString().split('T')[0];
        db.ref(`game_scores/bricks/${today}`).orderByChild('score').limitToLast(5).once('value', (snap) => {
            const list = document.getElementById('rankingList');
            if (!list) return;
            if (!snap.exists()) { list.innerHTML = '<p class="text-slate-700 text-[10px] font-bold text-center">NO RECORDS</p>'; return; }
            let sortedArr = [];
            snap.forEach(c => { sortedArr.unshift(c.val()); });
            list.innerHTML = sortedArr.map((d, i) => `
                <div class="flex justify-between items-center bg-slate-900/40 p-2 rounded-lg border border-white/5 mb-1">
                    <span class="text-slate-500 font-black text-[10px]">${i+1}</span>
                    <span class="flex-grow text-slate-200 font-bold text-[11px] ml-2">${d.userId}</span>
                    <span class="text-blue-400 font-black text-[11px]">${d.score.toLocaleString()}</span>
                </div>`).join('');
        });
    };

    function updateUI(id, text) {
        const el = document.getElementById(id);
        if (el) el.innerText = text;
    }

    // 기존 레벨 별 패턴 생성 알고리즘 (유지)
    function createLevelPattern() {
        const type = level % 5;
        brickConfig.columnCount = 9; 
        brickConfig.rowCount = 8 + Math.floor(level / 2);
        brickConfig.width = Math.floor((cvs.width - (brickConfig.columnCount + 1) * brickConfig.padding) / brickConfig.columnCount);
        
        const totalWidth = brickConfig.columnCount * (brickConfig.width + brickConfig.padding) - brickConfig.padding;
        const startX = (cvs.width - totalWidth) / 2;
        
        bricks = [];
        for (let c = 0; c < brickConfig.columnCount; c++) {
            bricks[c] = [];
            for (let r = 0; r < brickConfig.rowCount; r++) {
                let status = 0;
                const midC = Math.floor(brickConfig.columnCount / 2);
                const midR = Math.floor(brickConfig.rowCount / 2);

                switch(type) {
                    case 1: if (c >= midC - r && c <= midC + r && r <= midC + 2) status = 1; break;
                    case 2: if (Math.abs(c - midC) + Math.abs(r - midR) <= midC) status = 1; break;
                    case 3: if ((r === 0 && (c === 1 || c === 2 || c === 6 || c === 7)) || (r === 1 && (c >= 0 && c <= 3 || c >= 5 && c <= 8)) || (r >= 2 && c >= r - 2 && c <= brickConfig.columnCount - (r - 1))) status = 1; break;
                    case 4: if (Math.abs(c - midC) >= Math.abs(r - midR) - 1) status = 1; break;
                    default: if ((c + r) % 2 === 0) status = 1; break;
                }

                bricks[c][r] = { 
                    x: startX + c * (brickConfig.width + brickConfig.padding), 
                    y: r * (brickConfig.height + brickConfig.padding) + brickConfig.offsetTop, 
                    status: status,
                    color: `hsl(${(level * 70 + r * 20) % 360}, 70%, 55%)`
                };
            }
        }
    }

    function initLevel() {
        cvs.width = window.innerWidth;
        cvs.height = window.innerHeight;
        paddle.width = Math.max(100, (cvs.width * 0.3) - (level * 2));
        paddle.x = (cvs.width - paddle.width) / 2;
        ball.x = cvs.width / 2;
        ball.y = cvs.height - paddle.bottomOffset - 40;
        
        let speed = ball.baseSpeed + (level * 0.3);
        ball.dx = speed * (Math.random() > 0.5 ? 1 : -1);
        ball.dy = -speed;

        createLevelPattern();
        updateUI("levelDisplay", level < 10 ? "0" + level : level);
    }

    window.startGame = function() {
        document.getElementById('gameIntro').style.display = 'none';
        document.getElementById('gameUI').style.display = 'flex';
        score = 0; lives = 3; level = 1; gameRunning = true;
        updateUI("scoreDisplay", "0");
        updateUI("livesDisplay", "❤️❤️❤️");
        initLevel();
        draw();
    };

    function draw() {
        if (!gameRunning) return;
        ctx.fillStyle = "#0f172a"; 
        ctx.fillRect(0, 0, cvs.width, cvs.height);

        let activeBricks = 0;
        bricks.forEach((col) => col.forEach((b) => {
            if (b.status === 1) {
                activeBricks++;
                ctx.fillStyle = b.color;
                ctx.shadowBlur = 5; ctx.shadowColor = "rgba(0,0,0,0.5)";
                if(ctx.roundRect) {
                    ctx.beginPath(); ctx.roundRect(b.x, b.y, brickConfig.width, brickConfig.height, 4); ctx.fill();
                } else {
                    ctx.fillRect(b.x, b.y, brickConfig.width, brickConfig.height);
                }
                ctx.shadowBlur = 0;
                
                if (ball.x > b.x && ball.x < b.x + brickConfig.width && ball.y > b.y && ball.y < b.y + brickConfig.height) {
                    ball.dy = -ball.dy; b.status = 0;
                    score += (10 * level); updateUI("scoreDisplay", score.toLocaleString());
                }
            }
        }));

        if (activeBricks === 0) { gameRunning = false; setTimeout(nextLevel, 800); return; }

        const paddleY = cvs.height - paddle.bottomOffset;
        ctx.fillStyle = "#3b82f6";
        ctx.beginPath();
        if(ctx.roundRect) ctx.roundRect(paddle.x, paddleY, paddle.width, paddle.height, 8);
        else ctx.rect(paddle.x, paddleY, paddle.width, paddle.height);
        ctx.fill();

        ctx.shadowBlur = 10; ctx.shadowColor = "#fff";
        ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2);
        ctx.fillStyle = "#fff"; ctx.fill();
        ctx.shadowBlur = 0;

        if (ball.x + ball.dx > cvs.width - ball.radius || ball.x + ball.dx < ball.radius) ball.dx = -ball.dx;
        if (ball.y + ball.dy < 60 + ball.radius) ball.dy = -ball.dy;
        
        if (ball.y + ball.dy > paddleY - ball.radius) {
            if (ball.x > paddle.x && ball.x < paddle.x + paddle.width) {
                ball.dy = -ball.dy;
                let hitPos = (ball.x - (paddle.x + paddle.width/2)) / (paddle.width/2);
                ball.dx = hitPos * (ball.baseSpeed + level);
            } else if (ball.y > cvs.height) {
                lives--; updateUI("livesDisplay", "❤️".repeat(Math.max(0, lives)));
                if (lives <= 0) {
                    gameRunning = false;
                    alert("GAME OVER\nFINAL SCORE: " + score); location.reload();
                } else {
                    ball.x = cvs.width/2; ball.y = paddleY - 50;
                    ball.dy = -(ball.baseSpeed + level); ball.dx = (Math.random()-0.5)*5;
                }
            }
        }
        ball.x += ball.dx; ball.y += ball.dy;
        requestAnimationFrame(draw);
    }

    function nextLevel() {
        level++; initLevel(); gameRunning = true; draw();
    }

    const move = (e) => {
        if (!gameRunning) return;
        const x = (e.touches ? e.touches[0].clientX : e.clientX);
        paddle.x = Math.max(0, Math.min(cvs.width - paddle.width, x - paddle.width / 2));
        if(e.touches) e.preventDefault();
    };
    
    document.addEventListener("mousemove", move);
    document.addEventListener("touchmove", move, { passive: false });
    window.addEventListener('resize', initLevel);
    
    // 2. 실행부: 안전하게 순서 제어
    initLevel();
    
    // 0.1초 뒤에 랭킹 함수가 존재하는지 체크 후 호출 (Uncaught TypeError 방지)
    setTimeout(() => {
        if (typeof window.loadRankings === 'function') {
            window.loadRankings();
        }
    }, 100);
})();
</script>
