<style>
.stat-card {
    --day-accent: #3b82f6;
    --day-depth: rgba(59,130,246,0.22);
    background: linear-gradient(145deg, #0d1424 0%, #080d18 100%);
    border: 1px solid #1a2540;
    border-top: 1px solid #243050;
    border-radius: 1.5rem;
    padding: 1.2rem;
    margin-bottom: 1rem;
    box-shadow:
        0 8px 32px rgba(0,0,0,0.5),
        8px 10px 0 -6px var(--day-depth),
        inset 0 1px 0 rgba(255,255,255,0.05);
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    position: relative;
    overflow: hidden;
    transform: translateZ(0);
    contain: layout paint style;
}
.stat-card::before {
    content: '';
    position: absolute; top: 0; left: 15%; right: 15%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(59,130,246,0.3), transparent);
    pointer-events: none;
}
.stat-card:hover {
    transform: translateY(-3px) rotateX(1deg);
    border-color: color-mix(in srgb, var(--day-accent) 42%, #1a2540);
    box-shadow:
        0 16px 40px rgba(0,0,0,0.6),
        12px 14px 0 -7px var(--day-depth),
        inset 0 1px 0 rgba(255,255,255,0.07);
}
@media (min-width: 768px) { .stat-card { padding: 1.5rem; margin-bottom: 1.2rem; } }
.chart-container { position: relative; height: clamp(260px, 48vh, 360px); width: 100%; }
@media (min-width: 768px) { .chart-container { height: clamp(260px, 34vh, 340px); } }

/* 3D 원근감 래퍼 */
.chart-3d-wrap {
    perspective: 1200px;
    perspective-origin: 50% 40%;
}
.chart-3d-inner {
    transform: rotateX(4deg) scale(0.99);
    transform-style: preserve-3d;
    transition: transform 0.18s ease;
    border-radius: 12px;
    overflow: hidden;
    background: rgba(5,8,18,0.6);
    border: 1px solid rgba(255,255,255,0.04);
    box-shadow:
        0 20px 40px rgba(0,0,0,0.6),
        0 8px 16px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.06);
    padding: 12px;
}
.stat-card:hover .chart-3d-inner {
    transform: rotateX(1deg) scale(1);
}

    .nav-btn { transition: all 0.2s ease; }
    .nav-btn:hover { background-color: #1e293b; color: #3b82f6; }
    .nav-btn:active { scale: 0.95; }
    .export-btn { background: #10b981; color: white; padding: 0.5rem 1rem; border-radius: 0.75rem; font-size: 10px; font-weight: 900; text-transform: uppercase; transition: transform 0.18s ease, background 0.18s ease; }
    .export-btn:hover { background: #059669; transform: translateY(-1px); }
    .admin-stat-tab {
        transition: transform 0.18s ease, color 0.18s ease, opacity 0.18s ease, background 0.18s ease;
        position: relative;
        opacity: 0.62;
        border: 1px solid rgba(148,163,184,0.14);
        border-radius: 0.8rem;
        padding: 0.68rem 0.9rem;
        background: rgba(15,23,42,0.56);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 10px 24px rgba(0,0,0,0.25);
        white-space: nowrap;
    }
    .admin-stat-tab:hover { opacity: 0.9; transform: translateY(-1px); }
    .admin-stat-tab.active { opacity: 1; color: #3b82f6; background: linear-gradient(145deg, rgba(59,130,246,0.18), rgba(8,13,24,0.92)); border-color: rgba(59,130,246,0.34); }
    .admin-stat-tab.active-rep { color: #06b6d4; background: linear-gradient(145deg, rgba(6,182,212,0.18), rgba(8,13,24,0.92)); border-color: rgba(6,182,212,0.34); }
    .admin-stat-tab.active-vac { color: #a855f7; background: linear-gradient(145deg, rgba(168,85,247,0.18), rgba(8,13,24,0.92)); border-color: rgba(168,85,247,0.34); }
    .admin-stat-tab.active::after { content: ''; position: absolute; bottom: -7px; left: 10%; width: 80%; height: 2px; background: currentColor; border-radius: 10px; box-shadow: 0 0 10px currentColor; }

    .admin-stat-root {
        background:
            radial-gradient(circle at 12% 0%, rgba(59,130,246,0.12), transparent 26rem),
            radial-gradient(circle at 88% 4%, rgba(168,85,247,0.12), transparent 24rem),
            linear-gradient(135deg, #040712 0%, #08101f 52%, #03050d 100%);
        border-radius: 1.25rem;
        color: #f8fafc;
    }
    .admin-tab-bar {
        display: flex;
        gap: 0.65rem;
        flex-wrap: wrap;
        justify-content: flex-end;
        border-bottom: 1px solid rgba(30,41,59,0.9);
        padding: 0 0.5rem 0.75rem;
    }
    .weekday-strip {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: clamp(0.45rem, 1.2vw, 0.8rem);
        perspective: 1000px;
        margin: -0.35rem 0 1rem;
    }
    .day-cube {
        --cube-accent: #3b82f6;
        --cube-depth: rgba(59,130,246,0.28);
        min-height: 54px;
        display: grid;
        place-items: center;
        border-radius: 0.85rem;
        border: 1px solid color-mix(in srgb, var(--cube-accent) 38%, transparent);
        background: linear-gradient(145deg, rgba(255,255,255,0.07), rgba(15,23,42,0.86) 42%, rgba(3,7,18,0.98));
        color: var(--cube-accent);
        font-size: 0.78rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        box-shadow: 0 16px 26px rgba(0,0,0,0.38), 7px 8px 0 -5px var(--cube-depth);
        transform: rotateX(5deg) rotateY(-4deg);
    }
    .day-cube:nth-child(1) { --cube-accent:#22c55e; --cube-depth:rgba(34,197,94,0.30); }
    .day-cube:nth-child(2) { --cube-accent:#06b6d4; --cube-depth:rgba(6,182,212,0.30); transform:rotateX(-4deg) rotateY(4deg); }
    .day-cube:nth-child(3) { --cube-accent:#facc15; --cube-depth:rgba(250,204,21,0.28); }
    .day-cube:nth-child(4) { --cube-accent:#a855f7; --cube-depth:rgba(168,85,247,0.30); transform:rotateX(-3deg) rotateY(-5deg); }
    .day-cube:nth-child(5) { --cube-accent:#fb7185; --cube-depth:rgba(251,113,133,0.30); }
    .day-cube:nth-child(6) { --cube-accent:#f97316; --cube-depth:rgba(249,115,22,0.30); transform:rotateX(-5deg) rotateY(3deg); }
    .day-cube:nth-child(7) { --cube-accent:#ef4444; --cube-depth:rgba(239,68,68,0.30); }
    .day-theme-0 { --day-accent:#ef4444; --day-depth:rgba(239,68,68,0.24); }
    .day-theme-1 { --day-accent:#22c55e; --day-depth:rgba(34,197,94,0.24); }
    .day-theme-2 { --day-accent:#06b6d4; --day-depth:rgba(6,182,212,0.24); }
    .day-theme-3 { --day-accent:#facc15; --day-depth:rgba(250,204,21,0.22); }
    .day-theme-4 { --day-accent:#a855f7; --day-depth:rgba(168,85,247,0.24); }
    .day-theme-5 { --day-accent:#fb7185; --day-depth:rgba(251,113,133,0.24); }
    .day-theme-6 { --day-accent:#f97316; --day-depth:rgba(249,115,22,0.24); }

    /* 모달 스타일 추가 */
    #statDetailModal { z-index: 9999 !important; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
    @media (max-width: 767px) {
        .admin-tab-bar {
            justify-content: flex-start;
            flex-wrap: nowrap;
            overflow-x: auto;
            scrollbar-width: thin;
        }
        .admin-stat-tab { flex: 0 0 auto; font-size: 0.72rem; padding: 0.62rem 0.78rem; }
        .weekday-strip { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .day-cube { min-height: 46px; font-size: 0.68rem; }
        .stat-card { border-radius: 1rem; padding: 1rem; }
        .chart-3d-inner { padding: 8px; transform: none; }
        .stat-card:hover, .stat-card:hover .chart-3d-inner { transform: none; }
    }
    @media (prefers-reduced-motion: reduce), (max-width: 767px) {
        *, *::before, *::after {
            animation-duration: 0.001ms !important;
            animation-iteration-count: 1 !important;
            scroll-behavior: auto !important;
        }
        .stat-card, .chart-3d-inner, .admin-stat-tab, .export-btn, .nav-btn { transition-duration: 0.12s !important; }
    }
</style>

<script>
window.switchAdminStatTab = function(mode) {
    // DOM이 준비되지 않은 경우 대비
    if (!document.getElementById('tabAtt')) return;
    if (typeof window._switchLogic === 'function') {
        window._switchLogic(mode === 'leave' ? 'vac' : mode);
    }
};

    (function() {
        const db = firebase.database();
        let monthViewDate = new Date(); 
        let yearViewDate = new Date();
        let currentMode = 'att'; 
        const typeColors = { 'ATT': '#10b981', 'LATE': '#f43f5e', 'WO': '#3b82f6', 'PEL': '#eab308', 'ANL': '#f97316', 'HAL': '#a855f7', 'SIL': '#2dd4bf', 'SPL': '#64748b', 'EVL': '#475569', 'LEAVE': '#6366f1' };
        const reportColors = { Completed: '#10b981', 'In Progress': '#06b6d4', Pending: '#f59e0b' };
        let charts = { month: null, year: null, overall: null };
        let cachedData = null;
        let cachedReports = null;
        let resizeTimer = null;

        function normalizeMode(mode) {
            return mode === 'leave' ? 'vac' : mode;
        }

        function getDayThemeClass(dateValue) {
            const d = dateValue instanceof Date ? dateValue : new Date(dateValue);
            return `day-theme-${Number.isNaN(d.getTime()) ? 1 : d.getDay()}`;
        }

        function applyDayThemes() {
            const cards = document.querySelectorAll('.admin-stat-root .stat-card');
            cards.forEach((card, index) => {
                card.classList.remove('day-theme-0','day-theme-1','day-theme-2','day-theme-3','day-theme-4','day-theme-5','day-theme-6');
                const base = index === 0 ? monthViewDate : (index === 1 ? yearViewDate : new Date());
                const shifted = new Date(base);
                shifted.setDate(shifted.getDate() + index);
                card.classList.add(getDayThemeClass(shifted));
            });
        }

        function fmtDate(d) {
            return d.toISOString().split('T')[0];
        }

        function countWorkdays(filterFn) {
            let total = 0;
            Object.keys(cachedData || {}).forEach(date => {
                const d = new Date(date);
                const dow = d.getDay();
                if (filterFn(date) && dow !== 0 && dow !== 6) total++;
            });
            return total;
        }

        // 팝업 닫기 함수
        window.closeStatModal = function() {
            document.getElementById('statDetailModal').classList.add('hidden');
        };

        // 상세 정보 표시 함수
        window.showUserDetail = function(userName, periodType) {
            if (!cachedData) return;
            const mKey = monthViewDate.toISOString().substring(0, 7);
            const yKey = yearViewDate.getFullYear().toString();
            const tbody = document.getElementById('detailTableBody');
            
            document.getElementById('detailUserName').innerText = userName;
            tbody.innerHTML = '';

            const source = currentMode === 'rep' ? (cachedReports || {}) : cachedData;
            const entries = Object.entries(source).filter(([date]) => {
                if (periodType === 'month') return date.startsWith(mKey);
                if (periodType === 'year') return date.startsWith(yKey);
                return true;
            }).sort((a,b) => b[0].localeCompare(a[0]));

            entries.forEach(([date, dayData]) => {
                if (dayData[userName]) {
                    const record = dayData[userName];
                    let typeDisplay = "";
                    let note = record.remark || record.reason || record.content || record.summary || "-";
                    let rowColor = "#475569";

                    if (currentMode === 'rep') {
                        typeDisplay = record.status || 'Submitted';
                        rowColor = reportColors[typeDisplay] || '#475569';
                    } else if (typeof record === 'string') {
                        typeDisplay = record;
                    } else if (record.attend) {
                        typeDisplay = record.attend;
                    } else if (record.leave) {
                        typeDisplay = `Out: ${record.leave}`;
                    }

                    const typeKey = typeDisplay.includes("ATT") ? "ATT" : (typeDisplay.includes("LATE") ? "LATE" : typeDisplay);
                    const bgColor = currentMode === 'rep' ? rowColor : (typeColors[typeKey] || "#475569");

                    const tr = `
                        <tr class="hover:bg-slate-700/30 transition">
                            <td class="py-3 px-2 font-mono text-xs">${date}</td>
                            <td class="py-3 px-2">
                                <span class="px-2 py-0.5 rounded text-[10px] font-bold text-white" style="background:${bgColor}">
                                    ${typeDisplay}
                                </span>
                            </td>
                            <td class="py-3 px-2 text-slate-400 text-xs">${note}</td>
                        </tr>
                    `;
                    tbody.insertAdjacentHTML('beforeend', tr);
                }
            });

            if (tbody.innerHTML === '') {
                tbody.innerHTML = '<tr><td colspan="3" class="py-10 text-center text-slate-500">No records found.</td></tr>';
            }
            document.getElementById('statDetailModal').classList.remove('hidden');
        };

        window._switchLogic = function(mode) {
            currentMode = normalizeMode(mode);
            const tabAtt = document.getElementById('tabAtt');
            const tabRep = document.getElementById('tabRep');
            const tabVac = document.getElementById('tabVac');
            if(tabAtt) tabAtt.className = 'admin-stat-tab text-sm font-black tracking-widest uppercase' + (currentMode === 'att' ? ' active' : '');
            if(tabRep) tabRep.className = 'admin-stat-tab text-sm font-black tracking-widest uppercase' + (currentMode === 'rep' ? ' active active-rep' : '');
            if(tabVac) tabVac.className = 'admin-stat-tab text-sm font-black tracking-widest uppercase' + (currentMode === 'vac' ? ' active active-vac' : '');

            const lblMonth = document.getElementById('labelMonth');
            const lblYear = document.getElementById('labelYear');
            const lblOverall = document.getElementById('labelOverall');
            const labels = {
                att: ['Monthly Performance', 'Yearly Accumulation', 'Records'],
                rep: ['Monthly Work Reports', 'Yearly Work Reports', 'Report Records'],
                vac: ['Monthly Vacation Times', 'Yearly Vacation Times', 'Vacation Records']
            }[currentMode];
            if(lblMonth) lblMonth.innerText = labels[0];
            if(lblYear) lblYear.innerText = labels[1];
            if(lblOverall) lblOverall.innerText = labels[2];

            processAndRender();
        };

        window.exportToExcel = function(periodType) {
            if (!cachedData) return alert("No data loaded.");
            let filterKey = "";
            let fileNameSuffix = "";
            if (periodType === 'month') { filterKey = monthViewDate.toISOString().substring(0, 7); fileNameSuffix = filterKey; }
            else if (periodType === 'year') { filterKey = yearViewDate.getFullYear().toString(); fileNameSuffix = filterKey; }
            else { fileNameSuffix = "Overall"; }

            if (currentMode === 'rep') {
                const rows = [["WORK REPORT SUMMARY"], ["Staff Name", "Reports Written", "Completed", "In Progress", "Pending", "Completion Rate"]];
                const targetStats = {};
                Object.entries(cachedReports || {}).forEach(([date, dayData]) => {
                    if (filterKey && !date.startsWith(filterKey)) return;
                    Object.entries(dayData || {}).forEach(([user, report]) => {
                        if (!targetStats[user]) targetStats[user] = { total: 0, Completed: 0, 'In Progress': 0, Pending: 0 };
                        const status = report.status || 'In Progress';
                        targetStats[user].total++;
                        targetStats[user][status] = (targetStats[user][status] || 0) + 1;
                    });
                });
                Object.keys(targetStats).sort().forEach(staff => {
                    const s = targetStats[staff];
                    const rate = s.total > 0 ? ((s.Completed / s.total) * 100).toFixed(1) + '%' : '0%';
                    rows.push([staff, s.total, s.Completed || 0, s['In Progress'] || 0, s.Pending || 0, rate]);
                });
                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.aoa_to_sheet(rows);
                XLSX.utils.book_append_sheet(wb, ws, "Work Reports");
                XLSX.writeFile(wb, `Work_Report_${fileNameSuffix}.xlsx`);
                return;
            }
            
            const fileName = `${currentMode === 'vac' ? 'Vacation' : 'Performance'}_Report_${fileNameSuffix}.xlsx`;
            let targetStats = {};
            const attendanceTypes = Object.keys(typeColors).filter(k => k !== 'LEAVE');
            
            Object.entries(cachedData).forEach(([date, dayData]) => {
                if (filterKey && !date.startsWith(filterKey)) return;
                Object.entries(dayData).forEach(([user, record]) => {
                    if (!targetStats[user]) { targetStats[user] = { totalCount: 0, leaveTimes: [] }; attendanceTypes.forEach(t => targetStats[user][t] = 0); }
                    let type = "";
                    if (typeof record === 'string') type = record;
                    else if (record.attend) {
                        if (record.attend.includes("ATT")) type = "ATT";
                        else if (record.attend.includes("LATE")) type = "LATE";
                        else type = record.attend;
                    }
                    if (type && attendanceTypes.includes(type)) { targetStats[user][type]++; targetStats[user].totalCount++; }
                    if (typeof record !== 'string' && record.leave) {
                        const [h, m] = record.leave.split(':').map(Number);
                        targetStats[user].leaveTimes.push(h * 60 + m);
                    }
                });
            });

            const rows = [["INDIVIDUAL PERFORMANCE REPORT"]];
            const header = ["Staff Name", ...attendanceTypes.map(t => `${t} (Qty)`), ...attendanceTypes.map(t => `${t} (%)`), "Avg. Leave Time"];
            rows.push(header);
            Object.keys(targetStats).sort().forEach(staff => {
                const s = targetStats[staff];
                const row = [staff];
                attendanceTypes.forEach(t => row.push(s[t]));
                attendanceTypes.forEach(t => { row.push(s.totalCount > 0 ? ((s[t] / s.totalCount) * 100).toFixed(1) + "%" : "0%"); });
                if (s.leaveTimes.length > 0) {
                    const avgMin = s.leaveTimes.reduce((a, b) => a + b, 0) / s.leaveTimes.length;
                    row.push(`${Math.floor(avgMin / 60)}:${Math.round(avgMin % 60).toString().padStart(2, '0')}`);
                } else { row.push("-"); }
                rows.push(row);
            });
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(rows);
            XLSX.utils.book_append_sheet(wb, ws, "Performance Report");
            XLSX.writeFile(wb, fileName);
        };

        window.changeStatPeriod = function(type, offset) {
            if(type === 'month') monthViewDate.setMonth(monthViewDate.getMonth() + offset);
            else if(type === 'year') yearViewDate.setFullYear(yearViewDate.getFullYear() + offset);
            processAndRender();
        };

        window.initAdminStats = async function() {
            try {
                const [attSnap, repSnap] = await Promise.all([
                    db.ref('attendance').once('value'),
                    db.ref('reports').once('value')
                ]);
                cachedData = attSnap.val() || {};
                cachedReports = repSnap.val() || {};
                processAndRender();
            } catch (e) { console.error(e); }
        };

function processAndRender() {
    if (!cachedData) return;
    if (!document.getElementById('monthlyChart') || 
        !document.getElementById('yearlyChart') || 
        !document.getElementById('overallChart')) return;
            applyDayThemes();
            const mKey = monthViewDate.toISOString().substring(0, 7);
            const yKey = yearViewDate.getFullYear().toString();
            
            const txtMonth = document.getElementById('txtMonth');
            const txtYear = document.getElementById('txtYear');
            if(txtMonth) txtMonth.innerText = monthViewDate.toLocaleString('en-US', { month: 'short', year: 'numeric' });
            if(txtYear) txtYear.innerText = yKey;

            const stats = { month: {}, year: {}, overall: {} };
            if (currentMode === 'rep') {
                Object.entries(cachedReports || {}).forEach(([date, dayData]) => {
                    Object.entries(dayData || {}).forEach(([user, report]) => {
                        const status = report.status || 'In Progress';
                        const up = (obj) => {
                            if (!obj[user]) obj[user] = { total: 0, statuses: {} };
                            obj[user].total++;
                            obj[user].statuses[status] = (obj[user].statuses[status] || 0) + 1;
                        };
                        if (date.startsWith(mKey)) up(stats.month);
                        if (date.startsWith(yKey)) up(stats.year);
                        up(stats.overall);
                    });
                });
            } else {
                Object.entries(cachedData).forEach(([date, dayData]) => {
                    Object.entries(dayData).forEach(([user, record]) => {
                    if (currentMode === 'att') {
                        let type = (typeof record === 'string') ? record : (record.attend?.includes("ATT") ? "ATT" : (record.attend?.includes("LATE") ? "LATE" : record.attend));
                        if (!type || !typeColors[type]) return;
                        const up = (obj) => { if (!obj[user]) obj[user] = {}; obj[user][type] = (obj[user][type] || 0) + 1; };
                        if (date.startsWith(mKey)) up(stats.month); if (date.startsWith(yKey)) up(stats.year); up(stats.overall);
                    } else if (currentMode === 'vac' && typeof record !== 'string' && record.leave) {
                        const [hh, mm] = record.leave.split(':').map(Number);
                        const ut = (obj) => { if (!obj[user]) obj[user] = []; obj[user].push({ x: date, y: hh + (mm / 60) }); };
                        if (date.startsWith(mKey)) ut(stats.month); if (date.startsWith(yKey)) ut(stats.year); ut(stats.overall);
                    }
                });
                });
            }
            renderChart('monthlyChart', 'month', stats.month);
            renderChart('yearlyChart', 'year', stats.year);
            renderChart('overallChart', 'overall', stats.overall);
        }

        function renderChart(canvasId, chartType, chartData) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const existingChart = Chart.getChart(canvas);
            if (existingChart) existingChart.destroy();

            const isMobile = window.innerWidth < 768;
            const ctx = canvas.getContext('2d');
            let config = {};

            if (currentMode === 'att') {
                const users = Object.keys(chartData).sort();
                const types = Object.keys(typeColors).filter(k => k !== 'LEAVE');
const ds = types.map(t => ({
    label: t,
    data: users.map(u => chartData[u][t] || 0),
    backgroundColor: typeColors[t] + 'cc',
    hoverBackgroundColor: typeColors[t],
    borderColor: typeColors[t],
    borderWidth: 1,
    borderRadius: 6,
    borderSkipped: false,
})).filter(d => d.data.some(v => v > 0));

                config = {
                    type: 'bar',
                    data: { labels: users, datasets: ds },
options: {
    responsive: true,
    maintainAspectRatio: false,
    indexAxis: isMobile ? 'y' : 'x',
    onClick: (e, activeEls) => {
        if (activeEls.length > 0) {
            const index = activeEls[0].index;
            const label = charts[chartType].data.labels[index];
            showUserDetail(label, chartType);
        }
    },
    animation: false,
    scales: {
        y: {
            beginAtZero: true,
            grid: { color: 'rgba(255,255,255,0.04)', lineWidth: 1 },
            border: { dash: [4,4] },
            ticks: { color: '#475569', font: { size: 10, weight: '700' } }
        },
        x: {
            grid: { display: false },
            ticks: { color: '#94a3b8', font: { size: 10, weight: '900' } }
        }
    },
    plugins: {
        legend: {
            labels: {
                color: '#94a3b8',
                font: { size: 10, weight: '700' },
                boxWidth: 10, boxHeight: 10,
                borderRadius: 3, useBorderRadius: true,
                padding: 16
            }
        },
        tooltip: {
            backgroundColor: 'rgba(8,12,24,0.95)',
            borderColor: 'rgba(59,130,246,0.3)',
            borderWidth: 1,
            titleColor: '#f8fafc',
            bodyColor: '#94a3b8',
            padding: 12,
            cornerRadius: 10,
            titleFont: { weight: '900', size: 12 },
            bodyFont: { size: 11 },
            boxWidth: 10, boxHeight: 10, boxPadding: 4
        }
    }
}
                };
            } else if (currentMode === 'rep') {
                const users = Object.keys(chartData).sort();
                const statuses = Object.keys(reportColors);
                const ds = [
                    {
                        label: 'Reports Written',
                        data: users.map(u => chartData[u].total || 0),
                        backgroundColor: '#06b6d4cc',
                        hoverBackgroundColor: '#06b6d4',
                        borderColor: '#06b6d4',
                        borderWidth: 1,
                        borderRadius: 6,
                        borderSkipped: false
                    },
                    ...statuses.map(status => ({
                        label: status,
                        data: users.map(u => chartData[u].statuses?.[status] || 0),
                        backgroundColor: `${reportColors[status]}99`,
                        hoverBackgroundColor: reportColors[status],
                        borderColor: reportColors[status],
                        borderWidth: 1,
                        borderRadius: 6,
                        borderSkipped: false
                    }))
                ].filter(d => d.data.some(v => v > 0));

                config = {
                    type: 'bar',
                    data: { labels: users, datasets: ds },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        indexAxis: isMobile ? 'y' : 'x',
                        onClick: (e, activeEls) => {
                            if (activeEls.length > 0) {
                                const index = activeEls[0].index;
                                const label = charts[chartType].data.labels[index];
                                showUserDetail(label, chartType);
                            }
                        },
                        animation: false,
                        scales: {
                            y: {
                                beginAtZero: true,
                                grid: { color: 'rgba(255,255,255,0.04)', lineWidth: 1 },
                                border: { dash: [4,4] },
                                ticks: { color: '#64748b', font: { size: 10, weight: '700' } }
                            },
                            x: {
                                grid: { display: false },
                                ticks: { color: '#94a3b8', font: { size: 10, weight: '900' } }
                            }
                        },
                        plugins: {
                            legend: {
                                labels: {
                                    color: '#94a3b8',
                                    font: { size: 10, weight: '700' },
                                    boxWidth: 10, boxHeight: 10,
                                    borderRadius: 3, useBorderRadius: true,
                                    padding: 16
                                }
                            },
                            tooltip: {
                                backgroundColor: 'rgba(8,12,24,0.95)',
                                borderColor: 'rgba(6,182,212,0.3)',
                                borderWidth: 1,
                                titleColor: '#f8fafc',
                                bodyColor: '#94a3b8',
                                padding: 12,
                                cornerRadius: 10
                            }
                        }
                    }
                };
            } else {
                const ds = Object.entries(chartData).map(([u, p], i) => ({
                    label: u,
                    data: p.sort((a,b) => a.x.localeCompare(b.x)),
                    borderColor: `hsl(${(i*137.5)%360},70%,60%)`,
                    borderWidth: 2, tension: 0.3, fill: false, pointRadius: 4, pointHoverRadius: 6
                }));
                config = {
                    type: 'line',
                    data: { datasets: ds },
options: {
    responsive: true, maintainAspectRatio: false,
    animation: false,
    scales: {
        x: {
            type: 'category',
            grid: { display: false },
            ticks: { color: '#94a3b8', font: { size: 10, weight: '700' } }
        },
        y: {
            min: 17.5, max: 23.0,
            grid: { color: 'rgba(255,255,255,0.04)' },
            border: { dash: [4,4] },
            ticks: {
                color: '#94a3b8', font: { size: 9 },
                callback: v => { let h = Math.floor(v); let m = Math.round((v-h)*60); return `${h}:${m.toString().padStart(2,'0')}`; }
            }
        }
    },
    plugins: {
        legend: {
            labels: {
                color: '#94a3b8', font: { size: 10, weight: '700' },
                boxWidth: 10, boxHeight: 2,
                borderRadius: 2, useBorderRadius: true, padding: 14
            }
        },
        tooltip: {
            backgroundColor: 'rgba(8,12,24,0.95)',
            borderColor: 'rgba(59,130,246,0.3)',
            borderWidth: 1,
            titleColor: '#f8fafc', bodyColor: '#94a3b8',
            padding: 12, cornerRadius: 10,
            callbacks: {
                label: ctx => {
                    const v = ctx.parsed.y;
                    const h = Math.floor(v);
                    const m = Math.round((v-h)*60);
                    return ` ${ctx.dataset.label}: ${h}:${m.toString().padStart(2,'0')}`;
                }
            }
        }
    }
}
                };
            }
            charts[chartType] = new Chart(ctx, config);
        }

        window.addEventListener('resize', () => {
            window.clearTimeout(resizeTimer);
            resizeTimer = window.setTimeout(() => { if (cachedData) processAndRender(); }, 180);
        });
        setTimeout(initAdminStats, 300);
    })();
</script>
