<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
.stat-card {
    background: linear-gradient(145deg, #0d1424 0%, #080d18 100%);
    border: 1px solid #1a2540;
    border-top: 1px solid #243050;
    border-radius: 1.5rem;
    padding: 1.2rem;
    margin-bottom: 1rem;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    position: relative;
    overflow: hidden;
}
.stat-card::before {
    content: '';
    position: absolute; top: 0; left: 15%; right: 15%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(59,130,246,0.3), transparent);
    pointer-events: none;
}
.stat-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 16px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.07);
}
@media (min-width: 768px) { .stat-card { padding: 1.5rem; margin-bottom: 1.2rem; } }
.chart-container { position: relative; height: 280px; width: 100%; }
@media (min-width: 768px) { .chart-container { height: 260px; } }

/* 3D 원근감 래퍼 */
.chart-3d-wrap {
    perspective: 1200px;
    perspective-origin: 50% 40%;
}
.chart-3d-inner {
    transform: rotateX(6deg) scale(0.98);
    transform-style: preserve-3d;
    transition: transform 0.4s ease;
    border-radius: 12px;
    overflow: hidden;
    background: rgba(5,8,18,0.6);
    border: 1px solid rgba(255,255,255,0.04);
    box-shadow:
        0 20px 40px rgba(0,0,0,0.6),
        0 8px 16px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.06);
    padding: 12px;
}
.stat-card:hover .chart-3d-inner {
    transform: rotateX(2deg) scale(1);
}

    .nav-btn { transition: all 0.2s ease; }
    .nav-btn:hover { background-color: #1e293b; color: #3b82f6; }
    .nav-btn:active { scale: 0.95; }
    .export-btn { background: #10b981; color: white; padding: 0.5rem 1rem; border-radius: 0.75rem; font-size: 10px; font-weight: 900; text-transform: uppercase; transition: all 0.2s; }
    .export-btn:hover { background: #059669; transform: translateY(-1px); }
    .admin-stat-tab { transition: all 0.3s; position: relative; opacity: 0.5; }
    .admin-stat-tab.active { opacity: 1; color: #3b82f6; }
    .admin-stat-tab.active::after { content: ''; position: absolute; bottom: -8px; left: 0; width: 100%; height: 3px; background: #3b82f6; border-radius: 10px; box-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }

    /* 모달 스타일 추가 */
    #statDetailModal { z-index: 9999 !important; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
</style>

<div class="animate-fadeIn space-y-6 md:space-y-8 pb-10 max-w-[1200px] mx-auto px-4">
    <div class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-2">
        <div class="flex items-center gap-3">
            <div class="w-1.5 h-7 md:w-2 md:h-8 bg-blue-500 rounded-full"></div>
            <h2 class="text-xl md:text-2xl font-black uppercase tracking-tighter text-white">Analytics</h2>
        </div>
        <div class="flex gap-8 border-b border-slate-800 pb-2 px-2">
            <button onclick="switchAdminStatTab('att')" id="tabAtt" class="admin-stat-tab active text-sm font-black tracking-widest uppercase">Attendance</button>
            <button onclick="switchAdminStatTab('leave')" id="tabLeave" class="admin-stat-tab text-sm font-black tracking-widest uppercase">Leave (Out)</button>
        </div>
    </div>

    <section class="stat-card shadow-2xl backdrop-blur-sm border-slate-800/50">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 md:mb-8 gap-4">
            <div>
                <h3 class="text-base md:text-lg font-black text-white flex items-center gap-2">
                    <span class="text-blue-500">●</span> <span id="labelMonth">Monthly Performance</span> (<span id="txtMonth" class="text-blue-400"></span>)
                </h3>
            </div>
            <div class="flex gap-2 w-full md:w-auto">
                <button onclick="exportToExcel('month')" class="export-btn">Export Excel</button>
                <div class="flex bg-slate-800/50 rounded-xl p-1 border border-slate-700">
                    <button onclick="changeStatPeriod('month', -1)" class="nav-btn flex-1 md:flex-none px-4 py-2.5 text-slate-400 rounded-lg text-[10px] font-black tracking-widest uppercase">Prev</button>
                    <button onclick="changeStatPeriod('month', 1)" class="nav-btn flex-1 md:flex-none px-4 py-2.5 text-slate-400 rounded-lg text-[10px] font-black tracking-widest ml-1 uppercase">Next</button>
                </div>
            </div>
        </div>
<div class="chart-3d-wrap"><div class="chart-3d-inner"><div class="chart-container"><canvas id="monthlyChart"></canvas></div></div></div>

    </section>

    <section class="stat-card">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 md:mb-8 gap-4">
            <div>
                <h3 class="text-base md:text-lg font-black text-white flex items-center gap-2">
                    <span class="text-purple-500">●</span> <span id="labelYear">Yearly Accumulation</span> (<span id="txtYear" class="text-purple-400"></span>)
                </h3>
            </div>
            <div class="flex gap-2 w-full md:w-auto">
                <button onclick="exportToExcel('year')" class="export-btn">Export Excel</button>
                <div class="flex bg-slate-800/50 rounded-xl p-1 border border-slate-700">
                    <button onclick="changeStatPeriod('year', -1)" class="nav-btn flex-1 md:flex-none px-4 py-2.5 text-slate-400 rounded-lg text-[10px] font-black tracking-widest uppercase">Prev Year</button>
                    <button onclick="changeStatPeriod('year', 1)" class="nav-btn flex-1 md:flex-none px-4 py-2.5 text-slate-400 rounded-lg text-[10px] font-black tracking-widest ml-1 uppercase">Next Year</button>
                </div>
            </div>
        </div>
<div class="chart-3d-wrap"><div class="chart-3d-inner"><div class="chart-container"><canvas id="yearlyChart"></canvas></div></div></div>
    </section>

    <section class="stat-card">
        <div class="flex justify-between items-center mb-6 md:mb-8">
            <h3 class="text-base md:text-lg font-black text-white flex items-center gap-2">
                <span class="text-emerald-500">●</span> Overall All-Time <span id="labelOverall">Records</span>
            </h3>
            <button onclick="exportToExcel('overall')" class="export-btn">Export Excel</button>
        </div>
<div class="chart-3d-wrap"><div class="chart-3d-inner"><div class="chart-container"><canvas id="overallChart"></canvas></div></div></div>
    </section>
</div>

<div id="statDetailModal" class="hidden fixed inset-0 bg-slate-900/90 backdrop-blur-md flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden">
        <div class="p-6 border-b border-slate-700 flex justify-between items-center bg-slate-800/50">
            <h3 class="text-xl font-black text-blue-400"><span id="detailUserName" class="text-white"></span>'s Detail Logs</h3>
            <button onclick="closeStatModal()" class="text-slate-400 hover:text-white text-3xl">&times;</button>
        </div>
        <div class="p-6 max-h-[60vh] overflow-y-auto custom-scrollbar">
            <table class="w-full text-left text-sm text-slate-300">
                <thead class="text-xs uppercase text-slate-500 border-b border-slate-700 sticky top-0 bg-slate-800">
                    <tr>
                        <th class="py-3 px-2">Date</th>
                        <th class="py-3 px-2">Status / Time</th>
                        <th class="py-3 px-2">Notes</th>
                    </tr>
                </thead>
                <tbody id="detailTableBody" class="divide-y divide-slate-700/50"></tbody>
            </table>
        </div>
        <div class="p-4 bg-slate-900/30 border-t border-slate-700 flex justify-end">
            <button onclick="closeStatModal()" class="px-6 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-xl text-sm font-bold transition">Close</button>
        </div>
    </div>
</div>

<script>
window.switchAdminStatTab = function(mode) {
    // DOM이 준비되지 않은 경우 대비
    if (!document.getElementById('tabAtt')) return;
    if (typeof window._switchLogic === 'function') {
        window._switchLogic(mode);
    }
};

    (function() {
        const db = firebase.database();
        let monthViewDate = new Date(); 
        let yearViewDate = new Date();
        let currentMode = 'att'; 
        const typeColors = { 'ATT': '#10b981', 'LATE': '#f43f5e', 'WO': '#3b82f6', 'PEL': '#eab308', 'ANL': '#f97316', 'HAL': '#a855f7', 'SIL': '#2dd4bf', 'SPL': '#64748b', 'EVL': '#475569', 'LEAVE': '#6366f1' };
        let charts = { month: null, year: null, overall: null };
        let cachedData = null;

        // 팝업 닫기 함수
        window.closeStatModal = function() {
            document.getElementById('statDetailModal').classList.add('hidden');
        };

        // 상세 정보 표시 함수
        window.showUserDetail = function(userName, periodType) {
            if (!cachedData) return;
            const mKey = monthViewDate.toISOString().substring(0, 7);
            const yKey = yearViewDate.getFullYear().toString();
            const tbody = document.getElementById('detailTableBody');
            
            document.getElementById('detailUserName').innerText = userName;
            tbody.innerHTML = '';

            // 데이터 필터링 (기간별)
            const entries = Object.entries(cachedData).filter(([date]) => {
                if (periodType === 'month') return date.startsWith(mKey);
                if (periodType === 'year') return date.startsWith(yKey);
                return true;
            }).sort((a,b) => b[0].localeCompare(a[0]));

            entries.forEach(([date, dayData]) => {
                if (dayData[userName]) {
                    const record = dayData[userName];
                    let typeDisplay = "";
                    let note = record.remark || record.reason || "-";
                    let rowColor = "#475569";

                    if (typeof record === 'string') {
                        typeDisplay = record;
                    } else if (record.attend) {
                        typeDisplay = record.attend;
                    } else if (record.leave) {
                        typeDisplay = `Out: ${record.leave}`;
                    }

                    const typeKey = typeDisplay.includes("ATT") ? "ATT" : (typeDisplay.includes("LATE") ? "LATE" : typeDisplay);
                    const bgColor = typeColors[typeKey] || "#475569";

                    const tr = `
                        <tr class="hover:bg-slate-700/30 transition">
                            <td class="py-3 px-2 font-mono text-xs">${date}</td>
                            <td class="py-3 px-2">
                                <span class="px-2 py-0.5 rounded text-[10px] font-bold text-white" style="background:${bgColor}">
                                    ${typeDisplay}
                                </span>
                            </td>
                            <td class="py-3 px-2 text-slate-400 text-xs">${note}</td>
                        </tr>
                    `;
                    tbody.insertAdjacentHTML('beforeend', tr);
                }
            });

            if (tbody.innerHTML === '') {
                tbody.innerHTML = '<tr><td colspan="3" class="py-10 text-center text-slate-500">No records found.</td></tr>';
            }
            document.getElementById('statDetailModal').classList.remove('hidden');
        };

        window._switchLogic = function(mode) {
            currentMode = mode;
            const tabAtt = document.getElementById('tabAtt');
            const tabLeave = document.getElementById('tabLeave');
            if(tabAtt) tabAtt.classList.toggle('active', mode === 'att');
            if(tabLeave) tabLeave.classList.toggle('active', mode === 'leave');

            const isAtt = mode === 'att';
            const lblMonth = document.getElementById('labelMonth');
            const lblYear = document.getElementById('labelYear');
            const lblOverall = document.getElementById('labelOverall');
            if(lblMonth) lblMonth.innerText = isAtt ? 'Monthly Performance' : 'Monthly Leave Times';
            if(lblYear) lblYear.innerText = isAtt ? 'Yearly Accumulation' : 'Yearly Leave Times';
            if(lblOverall) lblOverall.innerText = isAtt ? 'Records' : 'Leave Records';

            processAndRender();
        };

        window.exportToExcel = function(periodType) {
            if (!cachedData) return alert("No data loaded.");
            let filterKey = "";
            let fileNameSuffix = "";
            if (periodType === 'month') { filterKey = monthViewDate.toISOString().substring(0, 7); fileNameSuffix = filterKey; }
            else if (periodType === 'year') { filterKey = yearViewDate.getFullYear().toString(); fileNameSuffix = filterKey; }
            else { fileNameSuffix = "Overall"; }
            
            const fileName = `Performance_Report_${fileNameSuffix}.xlsx`;
            let targetStats = {};
            const attendanceTypes = Object.keys(typeColors).filter(k => k !== 'LEAVE');
            
            Object.entries(cachedData).forEach(([date, dayData]) => {
                if (filterKey && !date.startsWith(filterKey)) return;
                Object.entries(dayData).forEach(([user, record]) => {
                    if (!targetStats[user]) { targetStats[user] = { totalCount: 0, leaveTimes: [] }; attendanceTypes.forEach(t => targetStats[user][t] = 0); }
                    let type = "";
                    if (typeof record === 'string') type = record;
                    else if (record.attend) {
                        if (record.attend.includes("ATT")) type = "ATT";
                        else if (record.attend.includes("LATE")) type = "LATE";
                        else type = record.attend;
                    }
                    if (type && attendanceTypes.includes(type)) { targetStats[user][type]++; targetStats[user].totalCount++; }
                    if (typeof record !== 'string' && record.leave) {
                        const [h, m] = record.leave.split(':').map(Number);
                        targetStats[user].leaveTimes.push(h * 60 + m);
                    }
                });
            });

            const rows = [["INDIVIDUAL PERFORMANCE REPORT"]];
            const header = ["Staff Name", ...attendanceTypes.map(t => `${t} (Qty)`), ...attendanceTypes.map(t => `${t} (%)`), "Avg. Leave Time"];
            rows.push(header);
            Object.keys(targetStats).sort().forEach(staff => {
                const s = targetStats[staff];
                const row = [staff];
                attendanceTypes.forEach(t => row.push(s[t]));
                attendanceTypes.forEach(t => { row.push(s.totalCount > 0 ? ((s[t] / s.totalCount) * 100).toFixed(1) + "%" : "0%"); });
                if (s.leaveTimes.length > 0) {
                    const avgMin = s.leaveTimes.reduce((a, b) => a + b, 0) / s.leaveTimes.length;
                    row.push(`${Math.floor(avgMin / 60)}:${Math.round(avgMin % 60).toString().padStart(2, '0')}`);
                } else { row.push("-"); }
                rows.push(row);
            });
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(rows);
            XLSX.utils.book_append_sheet(wb, ws, "Performance Report");
            XLSX.writeFile(wb, fileName);
        };

        window.changeStatPeriod = function(type, offset) {
            if(type === 'month') monthViewDate.setMonth(monthViewDate.getMonth() + offset);
            else if(type === 'year') yearViewDate.setFullYear(yearViewDate.getFullYear() + offset);
            processAndRender();
        };

        window.initAdminStats = async function() {
            try {
                const snap = await db.ref('attendance').once('value');
                cachedData = snap.val() || {};
                processAndRender();
            } catch (e) { console.error(e); }
        };

function processAndRender() {
    if (!cachedData) return;
    if (!document.getElementById('monthlyChart') || 
        !document.getElementById('yearlyChart') || 
        !document.getElementById('overallChart')) return;
            const mKey = monthViewDate.toISOString().substring(0, 7);
            const yKey = yearViewDate.getFullYear().toString();
            
            const txtMonth = document.getElementById('txtMonth');
            const txtYear = document.getElementById('txtYear');
            if(txtMonth) txtMonth.innerText = monthViewDate.toLocaleString('en-US', { month: 'short', year: 'numeric' });
            if(txtYear) txtYear.innerText = yKey;

            const stats = { month: {}, year: {}, overall: {} };
            Object.entries(cachedData).forEach(([date, dayData]) => {
                Object.entries(dayData).forEach(([user, record]) => {
                    if (currentMode === 'att') {
                        let type = (typeof record === 'string') ? record : (record.attend?.includes("ATT") ? "ATT" : (record.attend?.includes("LATE") ? "LATE" : record.attend));
                        if (!type || !typeColors[type]) return;
                        const up = (obj) => { if (!obj[user]) obj[user] = {}; obj[user][type] = (obj[user][type] || 0) + 1; };
                        if (date.startsWith(mKey)) up(stats.month); if (date.startsWith(yKey)) up(stats.year); up(stats.overall);
                    } else if (typeof record !== 'string' && record.leave) {
                        const [hh, mm] = record.leave.split(':').map(Number);
                        const ut = (obj) => { if (!obj[user]) obj[user] = []; obj[user].push({ x: date, y: hh + (mm / 60) }); };
                        if (date.startsWith(mKey)) ut(stats.month); if (date.startsWith(yKey)) ut(stats.year); ut(stats.overall);
                    }
                });
            });
            renderChart('monthlyChart', 'month', stats.month);
            renderChart('yearlyChart', 'year', stats.year);
            renderChart('overallChart', 'overall', stats.overall);
        }

        function renderChart(canvasId, chartType, chartData) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const existingChart = Chart.getChart(canvas);
            if (existingChart) existingChart.destroy();

            const isMobile = window.innerWidth < 768;
            const ctx = canvas.getContext('2d');
            let config = {};

            if (currentMode === 'att') {
                const users = Object.keys(chartData).sort();
                const types = Object.keys(typeColors).filter(k => k !== 'LEAVE');
const ds = types.map(t => ({
    label: t,
    data: users.map(u => chartData[u][t] || 0),
    backgroundColor: typeColors[t] + 'cc',
    hoverBackgroundColor: typeColors[t],
    borderColor: typeColors[t],
    borderWidth: 1,
    borderRadius: 6,
    borderSkipped: false,
})).filter(d => d.data.some(v => v > 0));

                config = {
                    type: 'bar',
                    data: { labels: users, datasets: ds },
options: {
    responsive: true,
    maintainAspectRatio: false,
    indexAxis: isMobile ? 'y' : 'x',
    onClick: (e, activeEls) => {
        if (activeEls.length > 0) {
            const index = activeEls[0].index;
            const label = charts[chartType].data.labels[index];
            showUserDetail(label, chartType);
        }
    },
    animation: {
        duration: 900,
        easing: 'easeOutQuart',
        delay: (ctx) => ctx.dataIndex * 60
    },
    scales: {
        y: {
            beginAtZero: true,
            grid: { color: 'rgba(255,255,255,0.04)', lineWidth: 1 },
            border: { dash: [4,4] },
            ticks: { color: '#475569', font: { size: 10, weight: '700' } }
        },
        x: {
            grid: { display: false },
            ticks: { color: '#94a3b8', font: { size: 10, weight: '900' } }
        }
    },
    plugins: {
        legend: {
            labels: {
                color: '#94a3b8',
                font: { size: 10, weight: '700' },
                boxWidth: 10, boxHeight: 10,
                borderRadius: 3, useBorderRadius: true,
                padding: 16
            }
        },
        tooltip: {
            backgroundColor: 'rgba(8,12,24,0.95)',
            borderColor: 'rgba(59,130,246,0.3)',
            borderWidth: 1,
            titleColor: '#f8fafc',
            bodyColor: '#94a3b8',
            padding: 12,
            cornerRadius: 10,
            titleFont: { weight: '900', size: 12 },
            bodyFont: { size: 11 },
            boxWidth: 10, boxHeight: 10, boxPadding: 4
        }
    }
}
                };
            } else {
                const ds = Object.entries(chartData).map(([u, p], i) => ({
                    label: u,
                    data: p.sort((a,b) => a.x.localeCompare(b.x)),
                    borderColor: `hsl(${(i*137.5)%360},70%,60%)`,
                    borderWidth: 2, tension: 0.3, fill: false, pointRadius: 4, pointHoverRadius: 6
                }));
                config = {
                    type: 'line',
                    data: { datasets: ds },
options: {
    responsive: true, maintainAspectRatio: false,
    animation: { duration: 800, easing: 'easeOutQuart' },
    scales: {
        x: {
            type: 'category',
            grid: { display: false },
            ticks: { color: '#94a3b8', font: { size: 10, weight: '700' } }
        },
        y: {
            min: 17.5, max: 23.0,
            grid: { color: 'rgba(255,255,255,0.04)' },
            border: { dash: [4,4] },
            ticks: {
                color: '#94a3b8', font: { size: 9 },
                callback: v => { let h = Math.floor(v); let m = Math.round((v-h)*60); return `${h}:${m.toString().padStart(2,'0')}`; }
            }
        }
    },
    plugins: {
        legend: {
            labels: {
                color: '#94a3b8', font: { size: 10, weight: '700' },
                boxWidth: 10, boxHeight: 2,
                borderRadius: 2, useBorderRadius: true, padding: 14
            }
        },
        tooltip: {
            backgroundColor: 'rgba(8,12,24,0.95)',
            borderColor: 'rgba(59,130,246,0.3)',
            borderWidth: 1,
            titleColor: '#f8fafc', bodyColor: '#94a3b8',
            padding: 12, cornerRadius: 10,
            callbacks: {
                label: ctx => {
                    const v = ctx.parsed.y;
                    const h = Math.floor(v);
                    const m = Math.round((v-h)*60);
                    return ` ${ctx.dataset.label}: ${h}:${m.toString().padStart(2,'0')}`;
                }
            }
        }
    }
}
                };
            }
            charts[chartType] = new Chart(ctx, config);
        }

        window.addEventListener('resize', () => { if (cachedData) processAndRender(); });
        setTimeout(initAdminStats, 300);
    })();
</script>
