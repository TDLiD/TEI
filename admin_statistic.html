<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
    .stat-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 2rem; padding: 1.5rem; margin-bottom: 1.5rem; }
    @media (min-width: 768px) { .stat-card { padding: 2rem; margin-bottom: 2rem; } }
    .chart-container { position: relative; height: 500px; width: 100%; }
    @media (min-width: 768px) { .chart-container { height: 400px; } }
    .nav-btn { transition: all 0.2s ease; }
    .nav-btn:hover { background-color: #1e293b; color: #3b82f6; }
    .nav-btn:active { scale: 0.95; }
    .export-btn { background: #10b981; color: white; padding: 0.5rem 1rem; border-radius: 0.75rem; font-size: 10px; font-weight: 900; text-transform: uppercase; transition: all 0.2s; }
    .export-btn:hover { background: #059669; transform: translateY(-1px); }
    .admin-stat-tab { transition: all 0.3s; position: relative; opacity: 0.5; }
    .admin-stat-tab.active { opacity: 1; color: #3b82f6; }
    .admin-stat-tab.active::after { content: ''; position: absolute; bottom: -8px; left: 0; width: 100%; height: 3px; background: #3b82f6; border-radius: 10px; box-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
</style>
<div class="animate-fadeIn space-y-6 md:space-y-8 pb-10 max-w-[1200px] mx-auto px-4">
    <div class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-2">
        <div class="flex items-center gap-3">
            <div class="w-1.5 h-7 md:w-2 md:h-8 bg-blue-500 rounded-full"></div>
            <h2 class="text-xl md:text-2xl font-black uppercase tracking-tighter text-white">Analytics</h2>
        </div>
        <div class="flex gap-8 border-b border-slate-800 pb-2 px-2">
            <button onclick="switchAdminStatTab('att')" id="tabAtt" class="admin-stat-tab active text-sm font-black tracking-widest uppercase">Attendance</button>
            <button onclick="switchAdminStatTab('leave')" id="tabLeave" class="admin-stat-tab text-sm font-black tracking-widest uppercase">Leave (Out)</button>
        </div>
    </div>
    <section class="stat-card shadow-2xl backdrop-blur-sm border-slate-800/50">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 md:mb-8 gap-4">
            <div>
                <h3 class="text-base md:text-lg font-black text-white flex items-center gap-2">
                    <span class="text-blue-500">●</span> <span id="labelMonth">Monthly Performance</span> (<span id="txtMonth" class="text-blue-400"></span>)
                </h3>
            </div>
            <div class="flex gap-2 w-full md:w-auto">
                <button onclick="exportToExcel('month')" class="export-btn">Export Excel</button>
                <div class="flex bg-slate-800/50 rounded-xl p-1 border border-slate-700">
                    <button onclick="changeStatPeriod('month', -1)" class="nav-btn flex-1 md:flex-none px-4 py-2.5 text-slate-400 rounded-lg text-[10px] font-black tracking-widest uppercase">Prev</button>
                    <button onclick="changeStatPeriod('month', 1)" class="nav-btn flex-1 md:flex-none px-4 py-2.5 text-slate-400 rounded-lg text-[10px] font-black tracking-widest ml-1 uppercase">Next</button>
                </div>
            </div>
        </div>
        <div class="chart-container"><canvas id="monthlyChart"></canvas></div>
    </section>
    <section class="stat-card">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 md:mb-8 gap-4">
            <div>
                <h3 class="text-base md:text-lg font-black text-white flex items-center gap-2">
                    <span class="text-purple-500">●</span> <span id="labelYear">Yearly Accumulation</span> (<span id="txtYear" class="text-purple-400"></span>)
                </h3>
            </div>
            <div class="flex gap-2 w-full md:w-auto">
                <button onclick="exportToExcel('year')" class="export-btn">Export Excel</button>
                <div class="flex bg-slate-800/50 rounded-xl p-1 border border-slate-700">
                    <button onclick="changeStatPeriod('year', -1)" class="nav-btn flex-1 md:flex-none px-4 py-2.5 text-slate-400 rounded-lg text-[10px] font-black tracking-widest uppercase">Prev Year</button>
                    <button onclick="changeStatPeriod('year', 1)" class="nav-btn flex-1 md:flex-none px-4 py-2.5 text-slate-400 rounded-lg text-[10px] font-black tracking-widest ml-1 uppercase">Next Year</button>
                </div>
            </div>
        </div>
        <div class="chart-container"><canvas id="yearlyChart"></canvas></div>
    </section>
    <section class="stat-card">
        <div class="flex justify-between items-center mb-6 md:mb-8">
            <h3 class="text-base md:text-lg font-black text-white flex items-center gap-2">
                <span class="text-emerald-500">●</span> Overall All-Time <span id="labelOverall">Records</span>
            </h3>
            <button onclick="exportToExcel('overall')" class="export-btn">Export Excel</button>
        </div>
        <div class="chart-container"><canvas id="overallChart"></canvas></div>
    </section>
</div>
<script>
    (function() {
        const db = firebase.database();
        let monthViewDate = new Date(); 
        let yearViewDate = new Date();
        let currentMode = 'att'; 
        const typeColors = { 'ATT': '#10b981', 'LATE': '#f43f5e', 'WO': '#3b82f6', 'PEL': '#eab308', 'ANL': '#f97316', 'HAL': '#a855f7', 'SIL': '#2dd4bf', 'SPL': '#64748b', 'EVL': '#475569', 'LEAVE': '#6366f1' };
        let charts = { month: null, year: null, overall: null };
        let cachedData = null;
        window.exportToExcel = function(periodType) {
            if (!cachedData) return alert("No data loaded.");
            let filterKey = "";
            let fileNameSuffix = "";
            if (periodType === 'month') { filterKey = monthViewDate.toISOString().substring(0, 7); fileNameSuffix = filterKey; }
            else if (periodType === 'year') { filterKey = yearViewDate.getFullYear().toString(); fileNameSuffix = filterKey; }
            else { fileNameSuffix = "Overall"; }
            const fileName = `Performance_Report_${fileNameSuffix}.xlsx`;
            let targetStats = {};
            const attendanceTypes = Object.keys(typeColors).filter(k => k !== 'LEAVE');
            Object.entries(cachedData).forEach(([date, dayData]) => {
                if (filterKey && !date.startsWith(filterKey)) return;
                Object.entries(dayData).forEach(([user, record]) => {
                    if (!targetStats[user]) { targetStats[user] = { totalCount: 0, leaveTimes: [] }; attendanceTypes.forEach(t => targetStats[user][t] = 0); }
                    let type = "";
                    if (typeof record === 'string') type = record;
                    else if (record.attend) {
                        if (record.attend.includes("ATT")) type = "ATT";
                        else if (record.attend.includes("LATE")) type = "LATE";
                        else type = record.attend;
                    }
                    if (type && attendanceTypes.includes(type)) { targetStats[user][type]++; targetStats[user].totalCount++; }
                    if (typeof record !== 'string' && record.leave) {
                        const [h, m] = record.leave.split(':').map(Number);
                        targetStats[user].leaveTimes.push(h * 60 + m);
                    }
                });
            });
            const rows = [["INDIVIDUAL PERFORMANCE REPORT"]];
            const header = ["Staff Name", ...attendanceTypes.map(t => `${t} (Qty)`), ...attendanceTypes.map(t => `${t} (%)`), "Avg. Leave Time"];
            rows.push(header);
            Object.keys(targetStats).sort().forEach(staff => {
                const s = targetStats[staff];
                const row = [staff];
                attendanceTypes.forEach(t => row.push(s[t]));
                attendanceTypes.forEach(t => { row.push(s.totalCount > 0 ? ((s[t] / s.totalCount) * 100).toFixed(1) + "%" : "0%"); });
                if (s.leaveTimes.length > 0) {
                    const avgMin = s.leaveTimes.reduce((a, b) => a + b, 0) / s.leaveTimes.length;
                    row.push(`${Math.floor(avgMin / 60)}:${Math.round(avgMin % 60).toString().padStart(2, '0')}`);
                } else { row.push("-"); }
                rows.push(row);
            });
            rows.push([], [], ["TOTAL TEAM SUMMARY"], ["Status Type", "Total Qty", "Team Average (%)"]);
            let teamTotalCount = 0;
            attendanceTypes.forEach(t => { Object.keys(targetStats).forEach(s => teamTotalCount += targetStats[s][t]); });
            attendanceTypes.forEach(t => {
                let typeQty = 0;
                Object.keys(targetStats).forEach(s => typeQty += targetStats[s][t]);
                rows.push([t, typeQty, teamTotalCount > 0 ? ((typeQty / teamTotalCount) * 100).toFixed(1) + "%" : "0%"]);
            });
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(rows);
            ws['!cols'] = [{wch: 20}, ...header.slice(1).map(() => ({wch: 12}))];
            XLSX.utils.book_append_sheet(wb, ws, "Performance Report");
            XLSX.writeFile(wb, fileName);
        };
        window.switchAdminStatTab = function(mode) {
            currentMode = mode;
            document.getElementById('tabAtt').classList.toggle('active', mode === 'att');
            document.getElementById('tabLeave').classList.toggle('active', mode === 'leave');
            const isAtt = mode === 'att';
            document.getElementById('labelMonth').innerText = isAtt ? 'Monthly Performance' : 'Monthly Leave Times';
            document.getElementById('labelYear').innerText = isAtt ? 'Yearly Accumulation' : 'Yearly Leave Times';
            document.getElementById('labelOverall').innerText = isAtt ? 'Records' : 'Leave Records';
            processAndRender();
        };
        window.changeStatPeriod = function(type, offset) {
            if(type === 'month') monthViewDate.setMonth(monthViewDate.getMonth() + offset);
            else if(type === 'year') yearViewDate.setFullYear(yearViewDate.getFullYear() + offset);
            processAndRender();
        };
        window.initAdminStats = async function() {
            try {
                const snap = await db.ref('attendance').once('value');
                cachedData = snap.val() || {};
                processAndRender();
            } catch (e) { console.error(e); }
        };
        function processAndRender() {
            if (!cachedData || !document.getElementById('monthlyChart')) return;
            const mKey = monthViewDate.toISOString().substring(0, 7);
            const yKey = yearViewDate.getFullYear().toString();
            document.getElementById('txtMonth').innerText = monthViewDate.toLocaleString('en-US', { month: 'short', year: 'numeric' });
            document.getElementById('txtYear').innerText = yKey;
            const stats = { month: {}, year: {}, overall: {} };
            Object.entries(cachedData).forEach(([date, dayData]) => {
                Object.entries(dayData).forEach(([user, record]) => {
                    if (currentMode === 'att') {
                        let type = (typeof record === 'string') ? record : (record.attend?.includes("ATT") ? "ATT" : (record.attend?.includes("LATE") ? "LATE" : record.attend));
                        if (!type || !typeColors[type]) return;
                        const up = (obj) => { if (!obj[user]) obj[user] = {}; obj[user][type] = (obj[user][type] || 0) + 1; };
                        if (date.startsWith(mKey)) up(stats.month); if (date.startsWith(yKey)) up(stats.year); up(stats.overall);
                    } else if (typeof record !== 'string' && record.leave) {
                        const [hh, mm] = record.leave.split(':').map(Number);
                        const ut = (obj) => { if (!obj[user]) obj[user] = []; obj[user].push({ x: date, y: hh + (mm / 60) }); };
                        if (date.startsWith(mKey)) ut(stats.month); if (date.startsWith(yKey)) ut(stats.year); ut(stats.overall);
                    }
                });
            });
            renderChart('monthlyChart', 'month', stats.month);
            renderChart('yearlyChart', 'year', stats.year);
            renderChart('overallChart', 'overall', stats.overall);
        }
        function renderChart(canvasId, chartType, chartData) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const existingChart = Chart.getChart(canvas);
            if (existingChart) existingChart.destroy();
            const isMobile = window.innerWidth < 768;
            const ctx = canvas.getContext('2d');
            if (currentMode === 'att') {
                const users = Object.keys(chartData).sort();
                const types = Object.keys(typeColors).filter(k => k !== 'LEAVE');
                const ds = types.map(t => ({ label: t, data: users.map(u => chartData[u][t] || 0), backgroundColor: typeColors[t], borderRadius: 4 })).filter(d => d.data.some(v => v > 0));
                charts[chartType] = new Chart(ctx, { type: 'bar', data: { labels: users, datasets: ds }, options: { responsive: true, maintainAspectRatio: false, indexAxis: isMobile ? 'y' : 'x', scales: { y: { beginAtZero: true, ticks: { color: '#64748b' } }, x: { ticks: { color: '#94a3b8' } } } } });
            } else {
                const ds = Object.entries(chartData).map(([u, p], i) => ({ label: u, data: p.sort((a,b)=>a.x.localeCompare(b.x)), borderColor: `hsl(${(i*137.5)%360},70%,60%)`, borderWidth: 2, tension: 0.3, fill: false }));
                charts[chartType] = new Chart(ctx, { type: 'line', data: { datasets: ds }, options: { responsive: true, maintainAspectRatio: false, scales: { x: { type: 'category', ticks: { color: '#94a3b8', font: { size: 10 } } }, y: { min: 17.5, max: 23.0, afterBuildTicks: a => { let t = []; for(let v=17.5; v<=19.5; v+=1/6) t.push({value:v}); for(let v=19.5+1/3; v<=23; v+=1/3) t.push({value:v}); a.ticks=t; }, ticks: { color: '#94a3b8', font: { size: 9 }, callback: v => { let h=Math.floor(v); let m=Math.round((v-h)*60); return `${h}:${m.toString().padStart(2,'0')}`; } } } }, plugins: { legend: { labels: { color: '#f8fafc' } } } } });
            }
        }
        window.addEventListener('resize', () => { if (cachedData) processAndRender(); });
        setTimeout(initAdminStats, 300);
    })();
</script>
