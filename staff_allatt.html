<style>
    .calendar-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }

</style>
<div class="animate-fadeIn space-y-6">
    <div class="flex justify-between items-center px-2">
        <div>
            <p class="text-slate-500 text-[10px] uppercase font-black tracking-[0.2em] mb-1">Organization View</p>
            <h2 class="text-3xl font-black text-white uppercase italic">All Staff <span class="text-blue-500">Records</span></h2>

<button onclick="parent.loadHTML('staff_main.html')" class="bg-slate-800 text-slate-400 px-4 py-2 rounded-xl text-xs font-bold hover:bg-slate-700 transition border border-slate-700">            BACK TO MY DASHBOARD
        </button>
    </div>
    <div class="bg-slate-900/50 p-4 md:p-6 rounded-[2rem] md:rounded-3xl border border-slate-800 shadow-2xl">
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-6">
            <div class="flex items-center gap-3 bg-slate-800/50 p-1.5 rounded-2xl border border-slate-700/50">
                <button onclick="changeAllMonth(-1)" class="p-2 hover:bg-slate-700 rounded-xl transition-all active:scale-90 text-slate-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7" /></svg>
                </button>
                <div id="allMonthYear" class="text-sm md:text-base font-black text-white min-w-[120px] text-center uppercase tracking-tighter italic"></div>
                <button onclick="changeAllMonth(1)" class="p-2 hover:bg-slate-700 rounded-xl transition-all active:scale-90 text-slate-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7" /></svg>
                </button>
                <button onclick="goTodayAll()" class="ml-1 px-3 py-1.5 bg-blue-600/20 text-blue-400 text-[10px] font-black rounded-lg hover:bg-blue-600 hover:text-white transition-all">TODAY</button>
            </div>
            <div class="text-[10px] font-bold text-slate-500 bg-black/30 px-4 py-2 rounded-full border border-white/5 uppercase tracking-widest">
                Viewing All Staff Attendance
            </div>
<select id="staffFilter" onchange="window.renderAllStaffCalendar()"
    class="bg-slate-800 border border-slate-700 text-white text-[10px] font-black rounded-xl px-3 py-2 outline-none focus:border-blue-500">

        </div>
<!-- 달력 wrapper div 바로 위에 추가 -->
<div id="todaySummaryBar" class="flex flex-wrap gap-3 mb-4 px-1">
    <div class="flex items-center gap-2 bg-emerald-500/10 border border-emerald-500/20 px-3 py-2 rounded-xl">
        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
        <span class="text-[10px] font-black text-slate-400 uppercase">Present</span>
        <span id="sumCountPresent" class="text-sm font-black text-emerald-400">0</span>
    </div>
    <div class="flex items-center gap-2 bg-rose-500/10 border border-rose-500/20 px-3 py-2 rounded-xl">
        <span class="w-2 h-2 rounded-full bg-rose-500"></span>
        <span class="text-[10px] font-black text-slate-400 uppercase">Late</span>
        <span id="sumCountLate" class="text-sm font-black text-rose-400">0</span>
    </div>
    <div class="flex items-center gap-2 bg-amber-500/10 border border-amber-500/20 px-3 py-2 rounded-xl">
        <span class="w-2 h-2 rounded-full bg-amber-500"></span>
        <span class="text-[10px] font-black text-slate-400 uppercase">Leave</span>
        <span id="sumCountLeave" class="text-sm font-black text-amber-400">0</span>
    </div>
    <div class="flex items-center gap-2 bg-slate-500/10 border border-slate-500/20 px-3 py-2 rounded-xl">
        <span class="w-2 h-2 rounded-full bg-slate-500"></span>
        <span class="text-[10px] font-black text-slate-400 uppercase">Absent</span>
        <span id="sumCountAbsent" class="text-sm font-black text-slate-400">0</span>
    </div>
    <div class="flex items-center gap-2 bg-blue-500/10 border border-blue-500/20 px-3 py-2 rounded-xl ml-auto">
        <span class="text-[10px] font-black text-slate-400 uppercase">Checkout</span>
        <span id="sumCountOut" class="text-sm font-black text-blue-400">0</span>

    </div>
<div class="bg-slate-900/50 p-4 md:p-6 rounded-[2rem] border border-slate-800">
    <h3 class="text-xs font-black text-white uppercase tracking-widest mb-4 flex items-center gap-2">
        <span class="w-2 h-2 bg-blue-500 rounded-full animate-pulse"></span>
        Monthly Attendance Rate
    </h3>
    <div id="staffLeaderboard" class="space-y-2"></div>
</div>
</div>

<script>
    (function() {
        const db = firebase.database();
        let viewDate = new Date();

        function formatTime(timeStr) {
            if (!timeStr) return "";
            const parts = timeStr.split(':');
            if (parts.length >= 2) return `${parts[0]}:${parts[1]}`;
            return timeStr;
        }

        window.changeAllMonth = function(offset) {
            viewDate.setMonth(viewDate.getMonth() + offset);
            renderAllStaffCalendar();
        };

        window.goTodayAll = function() {
            viewDate = new Date();
            renderAllStaffCalendar();
        };

        // 날짜 셀 생성을 위한 헬퍼 함수
        function createAllStaffDateCell(dateNum, year, month, attData, users, todayStr, isMobile, parentElement) {
            const dStr = `${year}-${String(month+1).padStart(2,'0')}-${String(dateNum).padStart(2,'0')}`;
            const isToday = dStr === todayStr;
            const dayOfWeek = new Date(year, month, dateNum).getDay(); // 0:일, 6:토
            
            let cell = document.createElement('td');
            cell.className = isMobile ? `mobile-date-card ${isToday ? 'today-highlight' : ''}` : `border border-slate-800 md:min-h-32 p-2 vertical-top align-top transition-all ${isToday ? 'today-highlight' : ''}`;
            
            let content = `<div class="flex justify-between items-center mb-2"><span class="text-[11px] font-black ${isToday ? 'text-blue-400' : (dayOfWeek===0?'text-rose-500':dayOfWeek===6?'text-blue-500':'text-slate-500')}">${dateNum}</span>${isToday ? '<span class="text-[8px] bg-blue-600 text-white px-1.5 py-0.5 rounded font-black">TODAY</span>' : ''}</div>`;
            
            const dayRecords = attData[dStr] || {};
Object.keys(users).forEach(uid => {
    if (users[uid].role === 'admin' || uid.toLowerCase() === 'admin') return;
    const selectedStaff = document.getElementById('staffFilter')?.value || '';
    if (selectedStaff && uid !== selectedStaff) return; // ← 필터 적용
    const info = dayRecords[uid];
                if(info) {
                    let attHtml = '';
                    if (typeof info === 'string') {
                        attHtml = `<span class="px-2 py-0.5 rounded-md bg-amber-500/10 text-amber-500 font-black text-[9px] border border-amber-500/20">${info}</span>`;
                    } else {
                        const attend = info.attend || "";
                        const leave = info.leave || "";
                        const sClass = attend.includes("LATE") ? "text-rose-500" : (attend.includes("ATT") ? "text-emerald-500" : "text-slate-500");
                        attHtml = `<div class="flex flex-col items-end gap-0"><span class="${sClass} font-black tracking-tighter scale-90 origin-right">☀️ ${formatTime(attend)}</span><span class="text-slate-400 font-black tracking-tighter scale-90 origin-right">🌙 ${formatTime(leave) || '--:--'}</span></div>`;
                    }
                    content += `<div class="attendance-record-item flex justify-between items-center text-[10px] mb-1 bg-slate-800/40 p-1.5 rounded-xl border border-slate-700/30 gap-2"><span class="truncate font-black text-slate-300" style="max-width: 45%">${uid}</span>${attHtml}</div>`;
                }
            });
            cell.innerHTML = content;
            parentElement.appendChild(cell);
        }

        window.renderAllStaffCalendar = function() {
            const monthLabel = document.getElementById('allMonthYear');
            const tbody = document.getElementById('allStaffCalendarBody');
            if (!monthLabel || !tbody) return;
            
            monthLabel.innerText = viewDate.toLocaleString('en-US', {month:'long', year:'numeric'}).toUpperCase();
            
            Promise.all([
                db.ref('users').once('value'),
                db.ref('attendance').once('value')
            ]).then(([userSnap, attSnap]) => {
                const users = userSnap.val() || {};
                const attData = attSnap.val() || {};
                tbody.innerHTML = '';
// renderAllStaffCalendar 함수 안 tbody.innerHTML = ''; 바로 아래에 추가
function updateTodaySummary() {
    const now = new Date();
    const tStr = now.toISOString().split('T')[0];
    const todayRec = attData[tStr] || {};
    const leaveTypes = ['PEL','ANL','HAL','SIL','SPL','WO'];
    const staffList = Object.keys(users).filter(u => u.toLowerCase() !== 'admin' && users[u].role !== 'admin');

    let present = 0, late = 0, leave = 0, absent = 0, out = 0;
    staffList.forEach(uid => {
        const info = todayRec[uid];
        if (!info) { absent++; return; }
        if (typeof info === 'string') {
            if (leaveTypes.includes(info)) leave++;
            else absent++;
            return;
        }
        if (info.attend) {
            if (info.attend.includes('LATE')) late++;
            else present++;
            if (info.leave) out++;
        } else { absent++; }
    });

    const el = id => document.getElementById(id);
    if (el('sumCountPresent')) el('sumCountPresent').innerText = present;
    if (el('sumCountLate'))    el('sumCountLate').innerText    = late;
    if (el('sumCountLeave'))   el('sumCountLeave').innerText   = leave;
    if (el('sumCountAbsent'))  el('sumCountAbsent').innerText  = absent;
    if (el('sumCountOut'))     el('sumCountOut').innerText     = out;
}
// 수정 후 올바른 순서
updateTodaySummary();

const filterEl = document.getElementById('staffFilter');
if (filterEl && filterEl.options.length === 1) {
    Object.keys(users)
        .filter(u => u.toLowerCase() !== 'admin' && users[u].role !== 'admin')
        .sort()
        .forEach(uid => {
            const opt = document.createElement('option');
            opt.value = uid; opt.textContent = uid;
            filterEl.appendChild(opt);
        });
}
const selectedStaff = filterEl ? filterEl.value : '';

const year = viewDate.getFullYear(), month = viewDate.getMonth();
const lastDate = new Date(year, month + 1, 0).getDate();
const now = new Date();
const todayStr = now.toISOString().split('T')[0];
const isCurrentMonth = (now.getFullYear() === year && now.getMonth() === month);
const isMobile = window.innerWidth <= 768;

function renderLeaderboard() {
    const leaderEl = document.getElementById('staffLeaderboard');
    if (!leaderEl) return;

    const leaveTypes = ['PEL','ANL','HAL','SIL','SPL','WO'];
    const staffList = Object.keys(users).filter(u =>
        u.toLowerCase() !== 'admin' && users[u].role !== 'admin'
    );

    const workdays = [];
    for (let d = 1; d <= lastDate; d++) {
        const dow = new Date(year, month, d).getDay();
        if (dow === 0 || dow === 6) continue;
        const dStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        if (dStr > todayStr) continue;
        workdays.push(dStr);
    }

    const stats = staffList.map(uid => {
        let present = 0, late = 0, leaveCount = 0;
        workdays.forEach(dStr => {
            const info = attData[dStr]?.[uid];
            if (!info) return;
            if (typeof info === 'string') { if (leaveTypes.includes(info)) leaveCount++; return; }
            if (info.attend) {
                if (info.attend.includes('LATE')) late++;
                else present++;
            }
        });
        const eligible = workdays.length - leaveCount;
        const rate = eligible > 0 ? Math.round(((present + late) / eligible) * 100) : 0;
        return { uid, present, late, leaveCount, rate, total: present + late };
    }).sort((a, b) => b.rate - a.rate);

    leaderEl.innerHTML = stats.map((s, idx) => {
        const barColor = s.rate >= 90 ? '#10b981' : s.rate >= 70 ? '#f59e0b' : '#f43f5e';
        const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `${idx+1}.`;
        return `
            <div class="flex items-center gap-3 p-2.5 rounded-xl bg-slate-800/40 border border-slate-700/30">
                <span class="text-[11px] font-black text-slate-400 w-6 text-center flex-shrink-0">${medal}</span>
                <span class="text-[11px] font-black text-white truncate flex-shrink-0"
                      style="min-width:60px;max-width:80px;">${s.uid}</span>
                <div class="flex-1 h-1.5 bg-slate-700 rounded-full overflow-hidden">
                    <div style="width:${s.rate}%;background:${barColor};height:100%;border-radius:999px;transition:width 0.8s ease;"></div>
                </div>
                <span style="font-size:10px;font-weight:900;color:${barColor};min-width:36px;text-align:right;">${s.rate}%</span>
                <span class="text-[9px] text-slate-600 font-bold">${s.total}d</span>
            </div>`;
    }).join('');
}
renderLeaderboard(); // ← year, month, lastDate 선언 후 호출
 


                if (isMobile) {
                    // 모바일: 오늘(또는 말일)부터 역순 표시, 미래 날짜 숨김
                    let startDay = isCurrentMonth ? now.getDate() : lastDate;
                    for (let d = startDay; d >= 1; d--) {
                        createAllStaffDateCell(d, year, month, attData, users, todayStr, true, tbody);
                    }
                } else {
                    // 데스크톱: 표준 그리드 (1일부터 표시)
                    const firstDay = new Date(year, month, 1).getDay();
                    let dateNum = 1;
                    for (let i = 0; i < 6; i++) {
                        let row = document.createElement('tr');
                        for (let j = 0; j < 7; j++) {
                            if (i === 0 && j < firstDay || dateNum > lastDate) { 
                                row.appendChild(document.createElement('td')); 
                            } else {
                                createAllStaffDateCell(dateNum, year, month, attData, users, todayStr, false, row);
                                dateNum++;
                            }
                        }
                        tbody.appendChild(row);
                        if (dateNum > lastDate) break;
                    }
                }
            });
        };

        window.renderAllStaffCalendar();
        window.addEventListener('resize', window.renderAllStaffCalendar);
    })();
</script>
