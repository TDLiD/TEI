<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
<style>
/* ══════════════════════════════════════════
   STAFF DASHBOARD — 3D DARK COCKPIT THEME
   Deep navy + electric accents
   Pretendard / SF Mono
══════════════════════════════════════════ */

@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css');

:root {
    --bg:       #040810;
    --surface:  #080f1e;
    --surface2: #0d1628;
    --surface3: #111e33;
    --border:   rgba(255,255,255,0.06);
    --border2:  rgba(255,255,255,0.12);
    --text:     #f1f5f9;
    --muted:    #475569;
    --dim:      #1e293b;
    --green:    #10b981;
    --red:      #f43f5e;
    --blue:     #3b82f6;
    --amber:    #f59e0b;
    --cyan:     #06b6d4;
    --green-dim:  rgba(16,185,129,0.12);
    --red-dim:    rgba(244,63,94,0.12);
    --blue-dim:   rgba(59,130,246,0.12);
    --amber-dim:  rgba(245,158,11,0.12);
}

/* ── Base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── 3D Card Base ── */
.card-3d {
    position: relative;
    background: linear-gradient(145deg, var(--surface2) 0%, var(--surface) 100%);
    border: 1px solid var(--border);
    border-top: 1px solid var(--border2);
    border-radius: 18px;
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.06),
        inset 0 -1px 0 rgba(0,0,0,0.3),
        0 8px 24px rgba(0,0,0,0.45),
        0 2px 8px rgba(0,0,0,0.3);
    transition: transform 0.3s cubic-bezier(0.23,1,0.32,1), box-shadow 0.3s ease;
}
.card-3d::before {
    content: '';
    position: absolute; top: 0; left: 15%; right: 15%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(99,179,237,0.3), transparent);
    pointer-events: none;
}
.card-3d:hover {
    transform: translateY(-4px) rotateX(3deg);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 20px 40px rgba(0,0,0,0.6),
        0 6px 16px rgba(0,0,0,0.4);
}

/* ── Hero Card ── */
.sm-hero {
    background: linear-gradient(145deg, var(--surface2) 0%, var(--surface) 100%);
    border: 1px solid var(--border);
    border-top: 1px solid var(--border2);
    border-radius: 18px;
    padding: 18px;
    position: relative; overflow: hidden;
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.07),
        0 8px 24px rgba(0,0,0,0.45),
        0 2px 8px rgba(0,0,0,0.3);
    transition: transform 0.3s cubic-bezier(0.23,1,0.32,1), box-shadow 0.3s ease;
}
.sm-hero::before {
    content: '';
    position: absolute; top: 0; left: 15%; right: 15%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(59,130,246,0.35), transparent);
}
.sm-hero::after {
    content: '';
    position: absolute; top: -40px; right: -40px;
    width: 120px; height: 120px;
    background: radial-gradient(circle, rgba(59,130,246,0.18), transparent 70%);
    border-radius: 50%;
}
.sm-hero:hover {
    transform: translateY(-4px) rotateX(3deg);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.09), 0 20px 40px rgba(0,0,0,0.6);
}

.sm-hero-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
.sm-hero-label {
    font-size: 8px; font-weight: 900; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.14em;
}
.sm-hero-name {
    font-size: 22px; font-weight: 900; color: var(--text);
    letter-spacing: -0.02em; margin-top: 2px; line-height: 1;
    text-shadow: 0 0 20px rgba(59,130,246,0.2);
}
.sm-live-date {
    font-size: 9px; font-weight: 800; color: var(--blue);
    background: var(--blue-dim);
    border: 1px solid rgba(59,130,246,0.25);
    padding: 3px 9px; border-radius: 7px; white-space: nowrap;
    box-shadow: 0 0 10px rgba(59,130,246,0.15);
}

.sm-fortune {
    margin-top: 10px; padding: 8px 10px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border); border-radius: 10px;
    font-size: 10px; color: #64748b; font-weight: 700;
}

/* ── Leave Alert ── */
#leaveStatusAlert { display: none; }
#leaveStatusAlert.visible { display: block; }
.sm-leave-alert {
    border-radius: 14px; padding: 12px 14px;
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
}
.sm-leave-alert.pending {
    background: linear-gradient(135deg, var(--amber-dim), rgba(245,158,11,0.06));
    border: 1px solid rgba(245,158,11,0.35);
    border-top: 1px solid rgba(245,158,11,0.5);
}
.sm-leave-alert.rejected {
    background: linear-gradient(135deg, var(--red-dim), rgba(244,63,94,0.06));
    border: 1px solid rgba(244,63,94,0.35);
    border-top: 1px solid rgba(244,63,94,0.5);
}
.sm-leave-alert-icon { font-size: 18px; flex-shrink: 0; }
.sm-leave-alert-title { font-size: 9px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.08em; }
.sm-leave-alert-title.pending { color: var(--amber); text-shadow: 0 0 10px rgba(245,158,11,0.4); }
.sm-leave-alert-title.rejected { color: var(--red); text-shadow: 0 0 10px rgba(244,63,94,0.4); }
.sm-leave-alert-msg { font-size: 10px; color: var(--text); font-weight: 600; margin-top: 2px; }
.sm-leave-alert-close { margin-left: auto; color: #475569; cursor: pointer; font-size: 16px; flex-shrink: 0; transition: color 0.2s; }
.sm-leave-alert-close:hover { color: var(--text); }

/* ── Bar ── */
.sm-bar {
    width: 100%; height: 3px;
    background: var(--dim); border-radius: 10px; overflow: hidden; margin-bottom: 8px;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.4);
}
.sm-bar-fill {
    height: 100%; background: var(--blue); border-radius: 10px;
    transition: width 1s ease;
    box-shadow: 0 0 8px rgba(59,130,246,0.4);
}
.sm-bar-fill.warning { background: var(--red); box-shadow: 0 0 8px rgba(244,63,94,0.4); }
#warningIcon { display: none; }
#warningIcon.visible { display: inline; }

/* ── Today Status Strip ── */
.sm-today-strip {
    background: linear-gradient(145deg, var(--surface2) 0%, var(--surface) 100%);
    border: 1px solid var(--border);
    border-top: 1px solid var(--border2);
    border-radius: 16px; padding: 14px 16px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    align-content: center;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 4px 16px rgba(0,0,0,0.35);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.sm-today-strip:hover {
    transform: translateY(-3px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 12px 28px rgba(0,0,0,0.5);
}
.sm-today-item { display: flex; flex-direction: column; gap: 3px; }
.sm-today-lbl { font-size: 8px; font-weight: 900; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
.sm-today-val { font-size: 16px; font-weight: 900; letter-spacing: -0.01em; }
.sm-today-val.in { color: var(--green); text-shadow: 0 0 12px rgba(16,185,129,0.4); }
.sm-today-val.out { color: #60a5fa; text-shadow: 0 0 12px rgba(59,130,246,0.4); }
.sm-today-val.empty { color: var(--dim); font-size: 13px; }

/* ── Attendance Panel ── */
.sm-panel {
    background: linear-gradient(145deg, var(--surface2) 0%, var(--surface) 100%);
    border: 1px solid var(--border);
    border-top: 1px solid var(--border2);
    border-radius: 20px; padding: 18px; flex: 1;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 8px 24px rgba(0,0,0,0.45);
    position: relative;
}
.sm-panel::before {
    content: '';
    position: absolute; top: 0; left: 15%; right: 15%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(6,182,212,0.25), transparent);
}
.sm-panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.sm-panel-title {
    font-size: 8px; font-weight: 900; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.12em;
}

/* ── Time Input & Select ── */
.sm-time-label { font-size: 8px; font-weight: 900; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
.sm-time-input {
    width: 100%;
    background: linear-gradient(145deg, #050a14, #070d1a);
    color: var(--text); font-size: 24px; font-weight: 900; text-align: center;
    letter-spacing: 0.05em; padding: 10px;
    border-radius: 12px;
    border: 1px solid var(--dim);
    outline: none;
    font-family: 'SF Mono', 'Fira Code', monospace;
    transition: border-color 0.2s, box-shadow 0.2s;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.03);
}
.sm-time-input:focus {
    border-color: var(--blue);
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.4), 0 0 0 3px rgba(59,130,246,0.12);
}
.sm-select {
    width: 100%;
    background: linear-gradient(145deg, #050a14, #070d1a);
    color: var(--text); font-weight: 800;
    padding: 10px 12px; border-radius: 12px;
    border: 1px solid var(--dim); outline: none; cursor: pointer;
    font-size: 11px; font-family: 'SF Mono', monospace; margin-bottom: 10px;
    transition: border-color 0.2s, box-shadow 0.2s;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
}
.sm-select:focus {
    border-color: var(--blue);
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.3), 0 0 0 3px rgba(59,130,246,0.12);
}

/* ── Buttons ── */
.sm-btn {
    padding: 12px 8px; border-radius: 12px; border: none; cursor: pointer;
    font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.06em;
    transition: all 0.2s cubic-bezier(0.23,1,0.32,1);
    font-family: 'Pretendard', sans-serif;
    position: relative;
}
.sm-btn:active { transform: scale(0.96) translateY(1px); }
.sm-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.sm-btn.in {
    background: linear-gradient(135deg, #10b981, #059669);
    color: #fff;
    box-shadow: 0 4px 14px rgba(16,185,129,0.35), inset 0 1px 0 rgba(255,255,255,0.2);
}
.sm-btn.in:hover:not(:disabled) {
    background: linear-gradient(135deg, #34d399, #10b981);
    box-shadow: 0 6px 20px rgba(16,185,129,0.5), inset 0 1px 0 rgba(255,255,255,0.25);
    transform: translateY(-2px);
}
.sm-btn.out {
    background: linear-gradient(135deg, #f43f5e, #e11d48);
    color: #fff;
    box-shadow: 0 4px 14px rgba(244,63,94,0.35), inset 0 1px 0 rgba(255,255,255,0.2);
}
.sm-btn.out:hover:not(:disabled) {
    background: linear-gradient(135deg, #fb7185, #f43f5e);
    box-shadow: 0 6px 20px rgba(244,63,94,0.5), inset 0 1px 0 rgba(255,255,255,0.25);
    transform: translateY(-2px);
}
.sm-btn.special {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: #fff; width: 100%;
    box-shadow: 0 4px 14px rgba(59,130,246,0.35), inset 0 1px 0 rgba(255,255,255,0.2);
}
.sm-btn.special:hover {
    background: linear-gradient(135deg, #60a5fa, #3b82f6);
    box-shadow: 0 6px 20px rgba(59,130,246,0.5), inset 0 1px 0 rgba(255,255,255,0.25);
    transform: translateY(-2px);
}

/* All Staff button */
.sm-all-staff-btn {
    display: flex; align-items: center; gap: 10px;
    background: linear-gradient(145deg, var(--surface2), var(--surface));
    border: 1px solid var(--border); border-top: 1px solid var(--border2);
    border-radius: 14px; padding: 10px 14px; cursor: pointer;
    transition: all 0.25s ease; color: var(--text); width: 100%;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 3px 10px rgba(0,0,0,0.3);
}
.sm-all-staff-btn:hover {
    border-color: rgba(59,130,246,0.3);
    background: linear-gradient(145deg, rgba(59,130,246,0.08), var(--surface));
    box-shadow: 0 6px 18px rgba(59,130,246,0.15), inset 0 1px 0 rgba(255,255,255,0.07);
    transform: translateY(-2px);
}
.sm-all-staff-btn img { width: 28px; height: 28px; object-fit: contain; }
.sm-all-staff-btn span { font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.08em; }
.sm-all-staff-btn .arrow { margin-left: auto; color: var(--muted); font-size: 11px; }

/* ── Right Panel: Calendar ── */
.sm-right { display: flex; flex-direction: column; gap: 10px; }
.sm-cal-card {
    background: linear-gradient(145deg, var(--surface2) 0%, var(--surface) 100%);
    border: 1px solid var(--border);
    border-top: 1px solid var(--border2);
    border-radius: 22px; padding: 18px; flex: 1;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.07), 0 12px 32px rgba(0,0,0,0.5);
    position: relative;
}
.sm-cal-card::before {
    content: '';
    position: absolute; top: 0; left: 10%; right: 10%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(59,130,246,0.25), rgba(6,182,212,0.2), transparent);
}

.sm-cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 10px; flex-wrap: wrap; }
.sm-cal-title {
    font-size: 16px; font-weight: 900; color: var(--text);
    letter-spacing: -0.01em; font-style: italic;
    text-decoration: underline; text-decoration-color: var(--blue); text-underline-offset: 4px;
    text-shadow: 0 0 20px rgba(59,130,246,0.2);
}
.sm-cal-nav {
    display: flex;
    background: linear-gradient(145deg, var(--surface3), var(--surface2));
    border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 2px 8px rgba(0,0,0,0.3);
}
.sm-nav-btn {
    padding: 5px 12px; font-size: 9px; font-weight: 900; color: var(--muted);
    background: none; border: none; cursor: pointer;
    font-family: 'SF Mono', monospace; text-transform: uppercase; letter-spacing: 0.05em;
    transition: all 0.15s;
}
.sm-nav-btn:hover {
    color: var(--text);
    background: rgba(59,130,246,0.1);
    box-shadow: inset 0 0 8px rgba(59,130,246,0.1);
}
.sm-nav-btn.today-btn { color: var(--blue); text-shadow: 0 0 8px rgba(59,130,246,0.4); }

/* ── Calendar Table ── */
.sm-cal-table { width: 100%; border-collapse: separate; border-spacing: 2px; table-layout: fixed; }
.sm-cal-table th {
    padding: 6px 2px; font-size: 8px; font-weight: 900;
    text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
    text-align: center; border-bottom: 1px solid var(--border);
}
.sm-cal-table th.sun { color: rgba(244,63,94,0.8); text-shadow: 0 0 6px rgba(244,63,94,0.3); }
.sm-cal-table th.sat { color: rgba(59,130,246,0.8); text-shadow: 0 0 6px rgba(59,130,246,0.3); }

.sm-cal-table td {
    height: 68px; vertical-align: top; padding: 4px;
    border: 1px solid rgba(20,30,50,0.8);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.18s cubic-bezier(0.23,1,0.32,1);
    position: relative;
    background: linear-gradient(145deg, var(--surface3) 0%, var(--surface2) 100%);
    box-shadow: 0 1px 4px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.03);
}
.sm-cal-table td:hover {
    background: linear-gradient(145deg, rgba(59,130,246,0.1) 0%, var(--surface2) 100%);
    border-color: rgba(59,130,246,0.25);
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 6px 16px rgba(59,130,246,0.15), inset 0 1px 0 rgba(255,255,255,0.06);
    z-index: 2;
}
.sm-cal-table td.sun-cell { background: linear-gradient(145deg, rgba(244,63,94,0.05), var(--surface2)); }
.sm-cal-table td.sat-cell { background: linear-gradient(145deg, rgba(59,130,246,0.05), var(--surface2)); }
.sm-cal-table td.today-highlight {
    background: linear-gradient(145deg, rgba(59,130,246,0.12), rgba(6,182,212,0.06)) !important;
    border-color: rgba(59,130,246,0.4) !important;
    box-shadow: 0 0 0 1px rgba(59,130,246,0.2), 0 4px 12px rgba(59,130,246,0.15) !important;
}

.sm-cal-date { font-size: 9px; font-weight: 900; color: var(--muted); margin-bottom: 2px; padding: 1px 2px; }
.sm-cal-date.sun { color: rgba(244,63,94,0.65); }
.sm-cal-date.sat { color: rgba(59,130,246,0.65); }
.sm-cal-date.today { color: var(--blue); text-shadow: 0 0 8px rgba(59,130,246,0.5); }

.time-label {
    display: block; font-size: 8px; font-weight: 900;
    padding: 1px 3px; margin-top: 1px; border-radius: 4px;
    text-align: center; font-family: 'SF Mono', monospace;
    letter-spacing: -0.03em; line-height: 1.4;
}
.att-color  { background: rgba(16,185,129,0.14); color: #10b981; border: 1px solid rgba(16,185,129,0.2); box-shadow: 0 0 6px rgba(16,185,129,0.15); }
.late-color { background: rgba(244,63,94,0.14);  color: #f43f5e; border: 1px solid rgba(244,63,94,0.2);  box-shadow: 0 0 6px rgba(244,63,94,0.15); }
.other-color{ background: rgba(245,158,11,0.14); color: #f59e0b; border: 1px solid rgba(245,158,11,0.2); box-shadow: 0 0 6px rgba(245,158,11,0.15); }
.out-time   { background: rgba(100,116,139,0.1); color: #64748b; border: 1px solid rgba(100,116,139,0.15); }

/* ── Modals ── */
.missing-modal-overlay, .edit-modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.88); backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center; z-index: 9999;
}
.edit-modal-overlay { z-index: 10000; }
.missing-modal, .edit-modal {
    background: linear-gradient(145deg, #0d1628, #080f1e);
    border: 1px solid rgba(255,255,255,0.08);
    border-top: 1px solid rgba(255,255,255,0.14);
    border-radius: 24px; width: 90%; max-width: 420px; padding: 2rem;
    box-shadow: 0 40px 80px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.07);
    animation: modalIn 0.35s cubic-bezier(0.23,1,0.32,1) both;
}
@keyframes modalIn {
    from { opacity:0; transform: scale(0.94) translateY(20px); }
    to   { opacity:1; transform: none; }
}
.edit-modal input[readonly] { background: #1e293b; color: #64748b; cursor: not-allowed; }
.edit-modal input[type="time"] { color-scheme: dark; }
.modal-footer {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 1.5rem; padding-top: 1rem;
    border-top: 1px solid rgba(255,255,255,0.06);
}
.dont-show-btn { color: #64748b; font-size: 11px; font-weight: 800; text-transform: uppercase; cursor: pointer; transition: color 0.2s; }
.dont-show-btn:hover { color: #94a3b8; }
.close-modal-btn {
    background: linear-gradient(135deg, #334155, #253047);
    color: white; padding: 8px 18px; border-radius: 10px;
    font-size: 11px; font-weight: 900;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.08);
    border: none; cursor: pointer; transition: all 0.2s;
}
.close-modal-btn:hover { background: linear-gradient(135deg, #475569, #334155); transform: translateY(-1px); }

/* ── Animations ── */
@keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(244,63,94,0); } 50% { box-shadow: 0 0 14px rgba(244,63,94,0.35); } 100% { box-shadow: 0 0 0 0 rgba(244,63,94,0); } }
.warning-pulse { animation: pulse-red 2s infinite; }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
.animate-blink { animation: blink 1s infinite; }
@keyframes pulse-border { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
.animate-pulse-slow { animation: pulse-border 2s infinite; }
@keyframes fadeSlideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.sm-root > * { animation: fadeSlideIn 0.45s cubic-bezier(0.22,1,0.36,1) both; }
.sm-left > *:nth-child(1) { animation-delay: 0s; }
.sm-left > *:nth-child(2) { animation-delay: 0.07s; }
.sm-left > *:nth-child(3) { animation-delay: 0.14s; }
.sm-left > *:nth-child(4) { animation-delay: 0.2s; }
.sm-left > *:nth-child(5) { animation-delay: 0.26s; }
.sm-right { animation-delay: 0.1s; }

.fortune-bubble {
    display: block; margin-top: 8px; padding: 8px 12px;
    background: rgba(255,255,255,0.03); border: 1px solid var(--border);
    border-radius: 10px; font-size: 10px; color: #64748b; font-weight: 700;
    animation: float 3s ease-in-out infinite;
}
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: #334155; }
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

/* ── Responsive ── */
@media (max-width: 640px) {
    .sm-cal-table td { height: 52px; padding: 2px; }
    .sm-cal-table th { font-size: 7px; }
    .time-label { font-size: 7px; }
    .sm-hero-name { font-size: 18px; }
    .sm-top-layout { flex-direction: column; }
}

/* ── Root font ── */
.sm-root {
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
}
.sm-fortune, .sm-leave-alert-msg, .fortune-bubble,
.sm-time-input, .sm-select, .sm-btn, .sm-nav-btn, .time-label {
    font-family: "Pretendard", sans-serif;
}

/* ── Layout: Top Row ── */
.sm-top-layout {
    display: flex; gap: 10px; margin-bottom: 10px; align-items: stretch;
}
.sm-top-layout > div { flex: 1; }

/* ── Weekend col width ── */
.sm-cal-table col.weekend { width: 5%; }
.sm-cal-table col.weekday { width: calc((100% - 10%) / 5); }
.sm-cal-table td.sun-cell,
.sm-cal-table td.sat-cell { width: 5%; padding: 2px 1px; }
.sm-cal-table td.sun-cell .sm-cal-date,
.sm-cal-table td.sat-cell .sm-cal-date { font-size: 7px; }

/* ── Streak Card ── */
#streakCard {
    background: linear-gradient(145deg, var(--surface2), var(--surface)) !important;
    border: 1px solid var(--border) !important;
    border-top: 1px solid var(--border2) !important;
    border-radius: 14px !important;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 4px 14px rgba(0,0,0,0.35) !important;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
}
#streakCard:hover {
    transform: translateY(-3px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.07), 0 10px 24px rgba(245,158,11,0.12) !important;
}

/* ── Month Summary Card ── */
#monthSummaryCard {
    position: relative;
}
#monthSummaryCard::before {
    content: '';
    position: absolute; top: 0; left: 15%; right: 15%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(59,130,246,0.2), transparent);
}
</style>

<script>
/* ── Fortune ── */
function showFortune() {
    const fortunes = [
        "Waktunya istirahat kopi sejenak! ☕","Item Keberuntungan: Pulpen biru 🖋️","Fokus Anda luar biasa hari ini! 🔥",
        "Sapa rekan kerja Anda hari ini! 😊","Manjakan diri dengan makan siang yang enak! 🍱","Bagaimana kalau peregangan sejenak? 🧘",
        "Senyum Anda mencerahkan tim ini! ✨","Rencanakan sesuatu yang seru setelah kerja! 🎈","Kesuksesan sedang menuju ke arah Anda! 🚀",
        "Dengarkan lagu favorit Anda sekarang 🎵","Anda melakukan pekerjaan yang luar biasa! 👍","Jangan lupa minum air putih 💧",
        "Ada kejutan kecil menanti Anda 🎁","Percayalah pada potensi Anda! 🌟","Tarik napas dalam-dalam santai sejenak 🌬️",
        "Warna Keberuntungan: Hijau Zamrud 🟢","Kerja keras Anda akan membuahkan hasil! 💰","Tetap positif, kerja keras! ✨",
        "Efisiensi adalah nama tengah Anda hari ini ⏱️","Seseorang berterima kasih atas bantuan Anda! ❤️",
        "Hari ini hari yang sempurna untuk awal yang baru 🌅","Yang terbaik masih akan datang! 🌈",
        "Jangan lupa berkedip! Istirahatkan mata Anda 👀","Kreativitas Anda tidak ada batasnya 🎨",
        "Teruslah melangkah, Anda hampir sampai! 🏁","Kata-kata baik sangat berarti bagi orang lain 🗣️",
        "Keberuntungan memihak mereka yang berani! 💪","Keajaiban terjadi di luar zona nyaman Anda ✨",
        "Anda lebih mampu dari yang Anda kira 🧠","JACKPOT! Keberuntungan super langka! 🎰"
    ];
    const area = document.getElementById('fortuneArea');
    if (!area) return;
    const div = document.createElement('div');
    div.className = 'fortune-bubble';
    div.textContent = fortunes[Math.floor(Math.random() * fortunes.length)];
    area.innerHTML = '';
    area.appendChild(div);
}
setTimeout(showFortune, 1000);

function getJakartaDate() {
    return new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Jakarta" }));
}

(function () {
    const user = sessionStorage.getItem('loggedInUser');
    const db = firebase.database();

    /* Welcome */
const welcomeMsg = document.getElementById('mainWelcomeMsg');
if (welcomeMsg) {
    welcomeMsg.innerText = user || '—'; // 로딩 전 fallback
    firebase.database().ref(`users/${user}/displayName`).once('value', snap => {
        welcomeMsg.innerText = snap.val() || user || '—';
    });
}

    if (user) { checkLeaveStatus(user); autoFillYesterdayLeave(user); }

    let now = getJakartaDate();
    let viewDate = new Date(now);
    const y = now.getFullYear(), m = String(now.getMonth()+1).padStart(2,'0'), d = String(now.getDate()).padStart(2,'0');
    const todayStr = `${y}-${m}-${d}`;
    let standardTime = "", hasCheckedMissing = false;
    const btnIn = document.getElementById('btnIn');
    const timeInput = document.getElementById('manualTime');

    /* Live date label */
    document.getElementById('liveDate').innerText = now.toLocaleDateString('en-US',{month:'short',day:'numeric',weekday:'short',timeZone:'Asia/Jakarta'}).toUpperCase();

    /* ── Today's In/Out display ── */
function updateTodayStrip(data) {
    const inEl = document.getElementById('todayInDisplay');
    const outEl = document.getElementById('todayOutDisplay');
    if (!inEl || !outEl) return; // ← DOM 없으면 즉시 종료
    const rec = data && data[user] ? data[user] : null;
    if (!rec) { inEl.textContent = '—'; outEl.textContent = '—'; return; }
        if (typeof rec === 'string') { inEl.textContent = rec; outEl.textContent = '—'; return; }
        if (rec.attend) {
            const m = rec.attend.match(/\d{1,2}:\d{2}/);
            const prefix = rec.attend.includes('LATE') ? '⚠ ' : '';
            inEl.textContent = prefix + (m ? m[0] : rec.attend);
            inEl.style.color = rec.attend.includes('LATE') ? 'var(--red)' : 'var(--green)';
        } else { inEl.textContent = '—'; }
        if (rec.leave) {
            const m = rec.leave.match(/\d{1,2}:\d{2}/);
            outEl.textContent = m ? m[0] : rec.leave;
        } else { outEl.textContent = '—'; }
    }
db.ref(`attendance/${todayStr}`).on('value', snap => {
    if (!document.getElementById('todayInDisplay')) {
        db.ref(`attendance/${todayStr}`).off();
        return;
    }
    updateTodayStrip(snap.val());
});
    /* ── Leave Status Alert ── */
    function checkLeaveStatus(uid) {
        db.ref(`leaves/${uid}/${new Date().getFullYear()}`).on('value', snap => {
            const leaves = snap.val(); if (!leaves) return;
            const target = Object.values(leaves).find(l => l.status === 'Pending' || l.status === 'Rejected');
            const alertDiv = document.getElementById('leaveStatusAlert');
            const content = document.getElementById('leaveAlertContent');
            const icon = document.getElementById('leaveAlertIcon');
            const title = document.getElementById('leaveAlertTitle');
            const msg = document.getElementById('leaveAlertMsg');
            if (target) {
                alertDiv.classList.add('visible');
                if (target.status === 'Pending') {
                    content.className = 'sm-leave-alert pending animate-pulse-slow';
                    icon.innerText = '⏳'; title.className = 'sm-leave-alert-title pending'; title.innerText = 'Leave Request Pending';
                    msg.innerText = `${target.type} (${target.startDate}) awaiting approval.`;
                } else {
                    content.className = 'sm-leave-alert rejected';
                    icon.innerText = '🚫'; title.className = 'sm-leave-alert-title rejected'; title.innerText = 'Leave Request Rejected';
                    msg.innerText = `${target.type} was rejected. Check admin memo.`;
                }
            } else { alertDiv.classList.remove('visible'); }
        });
    }

    /* ── Auto Fill Yesterday Leave ── */
    function autoFillYesterdayLeave(uid) {
        const now = getJakartaDate(), dow = now.getDay();
        const target = getJakartaDate();
        if (dow === 1) target.setDate(now.getDate()-3); else target.setDate(now.getDate()-1);
        const ty=target.getFullYear(), tm=String(target.getMonth()+1).padStart(2,'0'), td=String(target.getDate()).padStart(2,'0');
        const tStr=`${ty}-${tm}-${td}`, tdow=target.getDay();
        if (tdow===0||tdow===6) return;
        db.ref('settings/config/autoLeave').once('value', cs => {
            const autoLeaveTime = cs.val()||"18:00";
            db.ref('attendance/'+tStr).once('value', snap => {
                const all=snap.val(); if (!all) return;
                const my=all[uid];
                if (my&&typeof my==='object'&&my.attend&&!my.leave) {
                    db.ref(`attendance/${tStr}/${uid}`).update({leave:autoLeaveTime}).then(()=>{ if(typeof renderCalendar==='function') renderCalendar(); });
                }
            });
        });
    }

    /* ── Live Time ── */
/* ── Live Time ── */
    function updateLiveTime() {
        if (document.activeElement === timeInput) return;
        const n = getJakartaDate();
        timeInput.value = `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}:${String(n.getSeconds()).padStart(2,'0')}`;
    }
    setInterval(updateLiveTime, 1000);
    updateLiveTime();

    /* ── Late Warning ── */
    function checkLateWarning() {
        if (!standardTime) return;
        const now = getJakartaDate();
        const [sH, sM] = standardTime.split(':').map(Number);
        const stdMins = sH * 60 + sM;
        const nowMins = now.getHours() * 60 + now.getMinutes();
        const btn = document.getElementById('btnIn');
        if (!btn) return;
        db.ref(`attendance/${todayStr}/${user}/attend`).once('value', snap => {
            if (snap.val()) {
                btn.style.background = 'var(--green)';
                btn.innerHTML = 'SET IN';
                return;
            }
            if (nowMins > stdMins + 5) {
                btn.style.background = 'linear-gradient(135deg,#f43f5e,#dc2626)';
                btn.innerHTML = `⚠ SET IN (LATE +${nowMins - stdMins}m)`;
            } else if (nowMins > stdMins - 10) {
                btn.style.background = 'linear-gradient(135deg,#f59e0b,#d97706)';
                btn.innerHTML = `⏰ SET IN (Hurry!)`;
            } else {
                btn.style.background = 'var(--green)';
                btn.innerHTML = 'SET IN';
            }
        });
    }
    setInterval(checkLateWarning, 30000);
    checkLateWarning();

    timeInput.addEventListener('input', e => {
        let v = e.target.value.replace(/[^0-9]/g, '');
        if (v.length >= 5) v = v.substring(0,2) + ':' + v.substring(2,4) + ':' + v.substring(4,6);
        else if (v.length >= 3) v = v.substring(0,2) + ':' + v.substring(2,4);
        e.target.value = v;
    });

    function isValidTime(t) { return t && /^([01][0-9]|2[0-3]):([0-5][0-9])(:([0-5][0-9]))?$/.test(t); }

    /* ── Config ── */
    let config = { LLMAPIkey:"", autoLeave:"18:00", stdAttendance:"08:00" };
    db.ref('settings/config').on('value', snap => {
        const data=snap.val(); if(data) { config={...config,...data}; const e=document.getElementById('displayStdTime'); if(e) e.innerText=config.stdAttendance; standardTime=config.stdAttendance; }
    });
    db.ref('settings/config/stdAttendance').on('value', snap => {
        const v=snap.val(); if(v) { standardTime=v; const e=document.getElementById('displayStdTime'); if(e) e.innerText=v; if(btnIn) btnIn.disabled=false; }
    });

    /* ── AI ── */
    let isAILoading=false;
    async function fetchAIComment(type, time, userName) {
        if (!config.LLMAPIkey||isAILoading) return getFallbackMessage(type);
        isAILoading=true;
        let weatherInfo="sedang bagus";
        try { const wr=await fetch("https://api.open-meteo.com/v1/forecast?latitude=-6.2088&longitude=106.8456&current_weather=true"); const wd=await wr.json(); if(wd.current_weather) weatherInfo=`${wd.current_weather.temperature}°C`; } catch(e){}
        const isAttend=type==='attend';
        const prompt=isAttend?`[ATTENDANCE] User:${userName} Time:${time} Jakarta Temp:${weatherInfo} 1.Greet+mention temp 2.One short Indonesian Peribahasa 3.Short tebak-tebakan about coffee/work. Indonesian only.`:`[LEAVING] User:${userName} Time:${time} 1.Thank for hard work 2.One Indonesian Peribahasa about resting 3.Short witty office joke. Indonesian only.`;
        try {
            const res=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${config.LLMAPIkey}`},body:JSON.stringify({model:"llama-3.3-70b-versatile",messages:[{role:"system",content:"Respond in Indonesian, concise under 3 sentences."},{role:"user",content:prompt}],temperature:0.8,max_tokens:250})});
            if(res.status===429) return getFallbackMessage(type);
            const data=await res.json(); return data.choices[0].message.content.trim();
        } catch(e) { return getFallbackMessage(type); } finally { setTimeout(()=>{isAILoading=false;},2000); }
    }
    function getFallbackMessage(type) { return type==='attend'?"Selamat pagi! Semoga hari Anda menyenangkan! 😊":"Terima kasih atas kerja keras Anda hari ini! Selamat beristirahat! 👏"; }
    function showAIPopup(message) {
        const overlay=document.createElement('div'); overlay.className='missing-modal-overlay';
        overlay.innerHTML=`<div class="missing-modal border-blue-500/50 border-2 text-center"><p class="text-[10px] font-black text-blue-500 uppercase tracking-widest mb-4">AI Assistant Message</p><div class="text-white text-lg font-bold leading-relaxed mb-6">"${message}"</div><button onclick="this.parentElement.parentElement.remove()" class="close-modal-btn w-full py-3 hover:bg-blue-600 transition-colors">OK, NOTED!</button></div>`;

function updateMonthSummary(data) {
    const vy = viewDate.getFullYear(), vm = viewDate.getMonth();
    const monthStr = `${vy}-${String(vm+1).padStart(2,'0')}`;
    const leaveTypes = ['PEL','ANL','HAL','SIL','SPL','WO'];

    let present = 0, late = 0, leave = 0, workdays = 0;
    let totalInMins = 0, inCount = 0, totalOutMins = 0, outCount = 0;

    // 이번 달 평일만 순회
    const lastDay = new Date(vy, vm+1, 0).getDate();
    for (let d = 1; d <= lastDay; d++) {
        const dow = new Date(vy, vm, d).getDay();
        if (dow === 0 || dow === 6) continue;
        const dStr = `${monthStr}-${String(d).padStart(2,'0')}`;
        const today = getJakartaDate().toISOString().split('T')[0];
        if (dStr > today) continue; // 미래 날짜 제외
        workdays++;

        const rec = data[dStr]?.[user];
        if (!rec) continue;

        if (typeof rec === 'string') {
            if (leaveTypes.includes(rec)) leave++;
        } else if (rec.attend) {
            if (leaveTypes.includes(rec.attend)) { leave++; continue; }
            present++;
            if (rec.attend.includes('LATE')) late++;

            // 평균 IN 계산
            const inMatch = rec.attend.match(/(\d{1,2}):(\d{2})/);
            if (inMatch) { totalInMins += parseInt(inMatch[1])*60 + parseInt(inMatch[2]); inCount++; }

            // 평균 OUT 계산
            if (rec.leave) {
                const outMatch = rec.leave.match(/(\d{1,2}):(\d{2})/);
                if (outMatch) { totalOutMins += parseInt(outMatch[1])*60 + parseInt(outMatch[2]); outCount++; }
            }
        }
    }

    const rate = workdays > 0 ? Math.round((present / workdays) * 100) : 0;
    const toTime = mins => `${String(Math.floor(mins/60)).padStart(2,'0')}:${String(mins%60).padStart(2,'0')}`;
    const barColor = rate >= 90 ? 'var(--green)' : rate >= 70 ? 'var(--amber)' : 'var(--red)';

    const el = id => document.getElementById(id);
    if (el('sumPresent'))   el('sumPresent').innerText   = present;
    if (el('sumLate'))      el('sumLate').innerText      = late;
    if (el('sumLeave'))     el('sumLeave').innerText     = leave;
    if (el('sumRatePct'))   el('sumRatePct').innerText   = rate + '%';
    if (el('sumRateBar'))   { el('sumRateBar').style.width = rate + '%'; el('sumRateBar').style.background = barColor; }
    if (el('sumAvgIn'))     el('sumAvgIn').innerText     = inCount  > 0 ? `Avg In: ${toTime(Math.round(totalInMins/inCount))}`   : 'Avg In: --:--';
    if (el('sumAvgOut'))    el('sumAvgOut').innerText    = outCount > 0 ? `Avg Out: ${toTime(Math.round(totalOutMins/outCount))}` : 'Avg Out: --:--';

    const lbl = el('summaryMonthLabel');
    if (lbl) lbl.innerText = viewDate.toLocaleString('en-US',{month:'short',year:'numeric'}).toUpperCase();
}

// renderCalendar 안 updateAttendanceStats(data); 호출 바로 아래에 추가

}

        if(document.getElementById('missingPopup')) return;
        const overlay=document.createElement('div'); overlay.id='missingPopup'; overlay.className='missing-modal-overlay';
        let listHtml=missingInfo.map(i=>`<div class="bg-slate-800/50 p-3 rounded-xl border border-slate-700/50 mb-2 flex justify-between items-center"><div class="text-left"><p class="text-[10px] font-black text-slate-500 uppercase tracking-tighter">${i.date}</p><p class="text-rose-400 font-mono text-xs font-black uppercase">Missing: <span class="text-white">${i.status}</span></p></div><div class="w-1.5 h-1.5 rounded-full bg-rose-500 animate-pulse"></div></div>`).join('');
        overlay.innerHTML=`<div class="missing-modal text-center"><div class="w-16 h-16 bg-rose-500/10 rounded-full flex items-center justify-center mx-auto mb-4 border border-rose-500/20"><span class="text-2xl">✍️</span></div><h3 class="text-xl font-black text-white mb-2 uppercase tracking-tight italic">Missing Report</h3><p class="text-slate-400 text-[10px] mb-2 font-bold leading-tight uppercase">Daily Work Report is not submitted:</p><div class="flex items-center gap-2 mb-6"><span class="bg-rose-500 text-white text-[9px] px-2 py-0.5 rounded font-black animate-blink shrink-0">REQUIRED</span><span class="text-[10px] text-slate-500 font-bold tracking-tight flex-grow text-left">Please complete your work reports for the dates below</span></div><div class="max-h-[200px] overflow-y-auto no-scrollbar mb-6 px-1">${listHtml}</div><div class="space-y-3"><button onclick="document.getElementById('missingPopup').remove()" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-black py-4 rounded-2xl transition-all active:scale-95 shadow-xl shadow-rose-900/20 uppercase tracking-widest text-xs">I will write it now</button><button onclick="hidePopupToday()" class="w-full text-slate-500 hover:text-slate-300 text-[10px] font-bold uppercase tracking-widest transition-colors">Don't show this again today</button></div></div>`;
        document.body.appendChild(overlay);
    }

    window.hidePopupToday = function() {
        localStorage.setItem('hideReportPopup', getJakartaDate().toISOString().split('T')[0]);
        const p=document.getElementById('missingPopup'); if(p) p.remove();
    };

    document.addEventListener('DOMContentLoaded', ()=>{ setTimeout(()=>{ if(typeof showFortune==='function') showFortune(); checkMissingRecords(); },800); });
    renderCalendar();
})();
</script>
