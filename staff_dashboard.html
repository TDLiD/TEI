<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
<style>
/* ── Base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --bg: #060910; --surface: #0d1117; --surface2: #111827; --border: #1e293b; --border2: #253047; --text: #f1f5f9; --muted: #475569; --subtle: #1e293b; --green: #10b981; --red: #f43f5e; --blue: #3b82f6; --amber: #f59e0b; --green-dim: rgba(16,185,129,0.12); --red-dim: rgba(244,63,94,0.12); --blue-dim: rgba(59,130,246,0.12); --amber-dim: rgba(245,158,11,0.12); }
/* ── Hero Card ── */
.sm-hero { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 20px; position: relative; overflow: hidden; }
.sm-hero::before { content: ''; position: absolute; top: -40px; right: -40px; width: 120px; height: 120px; background: radial-gradient(circle, rgba(59,130,246,0.15), transparent 70%); border-radius: 50%; }
.sm-hero-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.sm-hero-label { font-size: 8px; font-weight: 900; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; }
.sm-hero-name { font-size: 22px; font-weight: 900; color: var(--text); letter-spacing: -0.02em; margin-top: 2px; line-height: 1; }
.sm-live-date { font-size: 9px; font-weight: 800; color: var(--blue); background: var(--blue-dim); border: 1px solid rgba(59,130,246,0.2); padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
.sm-fortune { margin-top: 10px; padding: 8px 10px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 10px; font-size: 10px; color: #64748b; font-weight: 700; font-family: -apple-system, sans-serif; }
/* ── Leave Alert ── */
#leaveStatusAlert { display: none; }
#leaveStatusAlert.visible { display: block; }
.sm-leave-alert { border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
.sm-leave-alert.pending { background: var(--amber-dim); border: 1px solid rgba(245,158,11,0.3); }
.sm-leave-alert.rejected { background: var(--red-dim); border: 1px solid rgba(244,63,94,0.3); }
.sm-leave-alert-icon { font-size: 18px; flex-shrink: 0; }
.sm-leave-alert-title { font-size: 9px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.08em; }
.sm-leave-alert-title.pending { color: var(--amber); }
.sm-leave-alert-title.rejected { color: var(--red); }
.sm-leave-alert-msg { font-size: 10px; color: var(--text); font-weight: 600; margin-top: 2px; font-family: -apple-system, sans-serif; }
.sm-leave-alert-close { margin-left: auto; color: #475569; cursor: pointer; font-size: 16px; flex-shrink: 0; }
.sm-leave-alert-close:hover { color: var(--text); }

.sm-bar { width: 100%; height: 3px; background: var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 8px; }
.sm-bar-fill { height: 100%; background: var(--blue); border-radius: 10px; transition: width 1s ease; }
.sm-bar-fill.warning { background: var(--red); }
#warningIcon { display: none; }
#warningIcon.visible { display: inline; }
/* ── Today Status Strip ── */
.sm-today-strip { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sm-today-item { display: flex; flex-direction: column; gap: 3px; }
.sm-today-lbl { font-size: 8px; font-weight: 900; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
.sm-today-val { font-size: 16px; font-weight: 900; letter-spacing: -0.01em; }
.sm-today-val.in { color: var(--green); }
.sm-today-val.out { color: #60a5fa; }
.sm-today-val.empty { color: var(--border2); font-size: 13px; }
/* ── Attendance Panel ── */
.sm-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 18px; flex: 1; }
.sm-panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.sm-panel-title { font-size: 8px; font-weight: 900; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
.sm-time-block { margin-bottom: 10px; }
.sm-time-label { font-size: 8px; font-weight: 900; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
.sm-time-input { width: 100%; background: var(--surface2); color: var(--text); font-size: 24px; font-weight: 900; text-align: center; letter-spacing: 0.05em; padding: 10px; border-radius: 10px; border: 1px solid var(--border2); outline: none; font-family: 'SF Mono', monospace; transition: border-color 0.2s; }
.sm-time-input:focus { border-color: var(--blue); }
.sm-select { width: 100%; background: var(--surface2); color: var(--text); font-weight: 800; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border2); outline: none; cursor: pointer; font-size: 11px; font-family: 'SF Mono', monospace; margin-bottom: 10px; transition: border-color 0.2s; }
.sm-select:focus { border-color: var(--blue); }
.sm-btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.sm-btn { padding: 12px 8px; border-radius: 10px; border: none; cursor: pointer; font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.06em; transition: all 0.15s; font-family: 'SF Mono', monospace; }
.sm-btn:active { transform: scale(0.96); }
.sm-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.sm-btn.in { background: var(--green); color: #fff; }
.sm-btn.in:hover:not(:disabled) { background: #059669; }
.sm-btn.out { background: var(--red); color: #fff; }
.sm-btn.out:hover:not(:disabled) { background: #e11d48; }
.sm-btn.special { background: var(--blue); color: #fff; width: 100%; }
.sm-btn.special:hover { background: #2563eb; }
.sm-log { background: rgba(0,0,0,0.3); border-radius: 8px; padding: 8px 10px; font-size: 9px; font-weight: 700; color: var(--muted); text-align: center; font-style: italic; border: 1px solid var(--border); }
.sm-all-staff-btn { display: flex; align-items: center; gap: 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 14px; padding: 10px 14px; cursor: pointer; transition: all 0.2s; color: var(--text); width: 100%; font-family: 'SF Mono', monospace; }
.sm-all-staff-btn:hover { border-color: var(--border2); background: #161f2e; }
.sm-all-staff-btn img { width: 28px; height: 28px; object-fit: contain; }
.sm-all-staff-btn span { font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.08em; }
.sm-all-staff-btn .arrow { margin-left: auto; color: var(--muted); font-size: 11px; }
/* ── Right Panel: Calendar ── */
.sm-right { display: flex; flex-direction: column; gap: 10px; }
.sm-cal-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 18px; flex: 1; }
.sm-cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 10px; flex-wrap: wrap; }
.sm-cal-title { font-size: 16px; font-weight: 900; color: var(--text); letter-spacing: -0.01em; font-style: italic; text-decoration: underline; text-decoration-color: var(--blue); text-underline-offset: 4px; }
.sm-cal-nav { display: flex; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.sm-nav-btn { padding: 5px 10px; font-size: 9px; font-weight: 900; color: var(--muted); background: none; border: none; cursor: pointer; font-family: 'SF Mono', monospace; text-transform: uppercase; letter-spacing: 0.05em; transition: all 0.15s; }
.sm-nav-btn:hover { color: var(--text); background: var(--border); }
.sm-nav-btn.today-btn { color: var(--blue); }
.sm-cal-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.sm-cal-table th { padding: 6px 2px; font-size: 8px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); text-align: center; border-bottom: 1px solid var(--border); }
.sm-cal-table th.sun { color: var(--red); }
.sm-cal-table th.sat { color: var(--blue); }
.sm-cal-table td { height: 68px; vertical-align: top; padding: 3px; border: 1px solid rgba(30,41,59,0.6); cursor: pointer; transition: background 0.15s; position: relative; }
.sm-cal-table td:hover { background: rgba(255,255,255,0.03); }
.sm-cal-table td.sun-cell { background: rgba(244,63,94,0.04); }
.sm-cal-table td.sat-cell { background: rgba(59,130,246,0.04); }
.sm-cal-table td.today-highlight { background: rgba(59,130,246,0.08); border-color: var(--blue) !important; }
.sm-cal-date { font-size: 9px; font-weight: 900; color: var(--muted); margin-bottom: 2px; padding: 1px 2px; }
.sm-cal-date.sun { color: rgba(244,63,94,0.6); }
.sm-cal-date.sat { color: rgba(59,130,246,0.6); }
.sm-cal-date.today { color: var(--blue); }
.time-label { display: block; font-size: 8px; font-weight: 900; padding: 1px 3px; margin-top: 1px; border-radius: 3px; text-align: center; font-family: 'SF Mono', monospace; letter-spacing: -0.03em; line-height: 1.4; }
.att-color { background: rgba(16,185,129,0.12); color: #10b981; }
.late-color { background: rgba(244,63,94,0.12); color: #f43f5e; }
.other-color { background: rgba(245,158,11,0.12); color: #f59e0b; }
.out-time { background: rgba(148,163,184,0.08); color: #64748b; border: 1px solid rgba(148,163,184,0.15); }
/* ── Modals ── */
.missing-modal-overlay, .edit-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 9999; }
.edit-modal-overlay { z-index: 10000; }
.missing-modal, .edit-modal { background: #0f172a; border: 1px solid #334155; border-radius: 1.5rem; width: 90%; max-width: 400px; padding: 2rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
.edit-modal input[readonly] { background-color: #1e293b; color: #64748b; cursor: not-allowed; }
.edit-modal input[type="time"] { color-scheme: dark; }
.modal-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #334155; }
.dont-show-btn { color: #64748b; font-size: 11px; font-weight: 800; text-transform: uppercase; cursor: pointer; transition: color 0.2s; }
.dont-show-btn:hover { color: #94a3b8; }
.close-modal-btn { background: #334155; color: white; padding: 8px 16px; border-radius: 0.75rem; font-size: 11px; font-weight: 900; }
/* ── Animations ── */
@keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(244,63,94,0); } 50% { box-shadow: 0 0 12px rgba(244,63,94,0.3); } 100% { box-shadow: 0 0 0 0 rgba(244,63,94,0); } }
.warning-pulse { animation: pulse-red 2s infinite; }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
.animate-blink { animation: blink 1s infinite; }
@keyframes pulse-border { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
.animate-pulse-slow { animation: pulse-border 2s infinite; }
@keyframes fadeSlideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.sm-root > * { animation: fadeSlideIn 0.4s ease both; }
.sm-left > *:nth-child(1) { animation-delay: 0s; }
.sm-left > *:nth-child(2) { animation-delay: 0.06s; }
.sm-left > *:nth-child(3) { animation-delay: 0.12s; }
.sm-left > *:nth-child(4) { animation-delay: 0.18s; }
.sm-left > *:nth-child(5) { animation-delay: 0.22s; }
.sm-right { animation-delay: 0.1s; }
.fortune-bubble { display: block; margin-top: 8px; padding: 7px 10px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 9px; font-size: 10px; color: #64748b; font-weight: 700; font-family: -apple-system, sans-serif; animation: float 3s ease-in-out infinite; }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
/* Scrollbar */
::-webkit-scrollbar { width: 3px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
.no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
/* Responsive */
@media (max-width: 640px) { .sm-cal-table td { height: 52px; padding: 2px; } .sm-cal-table th { font-size: 7px; } .time-label { font-size: 7px; } .sm-hero-name { font-size: 18px; } }
.sm-root { font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
.sm-fortune, .sm-leave-alert-msg, .fortune-bubble, .sm-time-input, .sm-select, .sm-btn, .sm-nav-btn, .time-label { font-family: "Pretendard", sans-serif; }
/* 상단 가로 배치 레이아웃 */
.sm-top-layout {
    display: flex;
    gap: 10px; /* 두 창 사이의 간격 */

}

.sm-top-layout > div {

}

/* Today Strip 내부 그리드 조정 (가로로 좁아지므로 텍스트 크기 등 최적화) */
.sm-today-strip {
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-content: center; /* 내용 중앙 정렬 */
}

/* 모바일 환경에서는 다시 세로로 쌓이도록 설정 */
@media (max-width: 640px) {
    .sm-top-layout {
        flex-direction: column;

/* 토/일 열 너비 축소 */
.sm-cal-table col.weekend { width: 5%; }

</style>

<script>
/* ── Fortune ── */
function showFortune() {

        "Waktunya istirahat kopi sejenak! ☕","Item Keberuntungan: Pulpen biru 🖋️","Fokus Anda luar biasa hari ini! 🔥",
        "Sapa rekan kerja Anda hari ini! 😊","Manjakan diri dengan makan siang yang enak! 🍱","Bagaimana kalau peregangan sejenak? 🧘",
        "Senyum Anda mencerahkan tim ini! ✨","Rencanakan sesuatu yang seru setelah kerja! 🎈","Kesuksesan sedang menuju ke arah Anda! 🚀",
        "Dengarkan lagu favorit Anda sekarang 🎵","Anda melakukan pekerjaan yang luar biasa! 👍","Jangan lupa minum air putih 💧",
        "Ada kejutan kecil menanti Anda 🎁","Percayalah pada potensi Anda! 🌟","Tarik napas dalam-dalam santai sejenak 🌬️",
        "Warna Keberuntungan: Hijau Zamrud 🟢","Kerja keras Anda akan membuahkan hasil! 💰","Tetap positif, kerja keras! ✨",
        "Efisiensi adalah nama tengah Anda hari ini ⏱️","Seseorang berterima kasih atas bantuan Anda! ❤️",
        "Hari ini hari yang sempurna untuk awal yang baru 🌅","Yang terbaik masih akan datang! 🌈",
        "Jangan lupa berkedip! Istirahatkan mata Anda 👀","Kreativitas Anda tidak ada batasnya 🎨",
        "Teruslah melangkah, Anda hampir sampai! 🏁","Kata-kata baik sangat berarti bagi orang lain 🗣️",
        "Keberuntungan memihak mereka yang berani! 💪","Keajaiban terjadi di luar zona nyaman Anda ✨",
        "Anda lebih mampu dari yang Anda kira 🧠","JACKPOT! Keberuntungan super langka! 🎰"
    ];
    const area = document.getElementById('fortuneArea');
    if (!area) return;
    const div = document.createElement('div');
    div.className = 'fortune-bubble';
    div.textContent = fortunes[Math.floor(Math.random() * fortunes.length)];
    area.innerHTML = '';
    area.appendChild(div);
}
setTimeout(showFortune, 1000);

function getJakartaDate() {
    return new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Jakarta" }));
}

(function () {
    const user = sessionStorage.getItem('loggedInUser');
    const db = firebase.database();

    /* Welcome */
    const welcomeMsg = document.getElementById('mainWelcomeMsg');
    if (welcomeMsg) welcomeMsg.innerText = user || '—';

    if (user) { checkLeaveStatus(user); autoFillYesterdayLeave(user); }

    let now = getJakartaDate();
    let viewDate = new Date(now);
    const y = now.getFullYear(), m = String(now.getMonth()+1).padStart(2,'0'), d = String(now.getDate()).padStart(2,'0');
    const todayStr = `${y}-${m}-${d}`;
    let standardTime = "", hasCheckedMissing = false;
    const btnIn = document.getElementById('btnIn');
    const timeInput = document.getElementById('manualTime');

    /* Live date label */
    document.getElementById('liveDate').innerText = now.toLocaleDateString('en-US',{month:'short',day:'numeric',weekday:'short',timeZone:'Asia/Jakarta'}).toUpperCase();

    /* ── Today's In/Out display ── */
    function updateTodayStrip(data) {
        const rec = data && data[user] ? data[user] : null;
        const inEl = document.getElementById('todayInDisplay');
        const outEl = document.getElementById('todayOutDisplay');
        if (!rec) { inEl.textContent = '—'; outEl.textContent = '—'; return; }
        if (typeof rec === 'string') { inEl.textContent = rec; outEl.textContent = '—'; return; }
        if (rec.attend) {
            const m = rec.attend.match(/\d{1,2}:\d{2}/);
            const prefix = rec.attend.includes('LATE') ? '⚠ ' : '';
            inEl.textContent = prefix + (m ? m[0] : rec.attend);
            inEl.style.color = rec.attend.includes('LATE') ? 'var(--red)' : 'var(--green)';
        } else { inEl.textContent = '—'; }

        try { const wr=await fetch("https://api.open-meteo.com/v1/forecast?latitude=-6.2088&longitude=106.8456&current_weather=true"); const wd=await wr.json(); if(wd.current_weather) weatherInfo=`${wd.current_weather.temperature}°C`; } catch(e){}
        const isAttend=type==='attend';
        const prompt=isAttend?`[ATTENDANCE] User:${userName} Time:${time} Jakarta Temp:${weatherInfo} 1.Greet+mention temp 2.One short Indonesian Peribahasa 3.Short tebak-tebakan about coffee/work. Indonesian only.`:`[LEAVING] User:${userName} Time:${time} 1.Thank for hard work 2.One Indonesian Peribahasa about resting 3.Short witty office joke. Indonesian only.`;
        try {
            const res=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${config.LLMAPIkey}`},body:JSON.stringify({model:"llama-3.3-70b-versatile",messages:[{role:"system",content:"Respond in Indonesian, concise under 3 sentences."},{role:"user",content:prompt}],temperature:0.8,max_tokens:250})});
            if(res.status===429) return getFallbackMessage(type);

        btn.disabled=true; btn.style.opacity="0.5";

    /* ── Stats ── */
    function updateAttendanceStats(data) {
        const vy=viewDate.getFullYear(), vm=viewDate.getMonth()+1;
        let total=0,late=0,att=0,totalLeaveMins=0,leaveCnt=0;
        Object.keys(data).forEach(ds=>{
            const [yr,mo]=ds.split('-').map(Number);
            if(yr===vy&&mo===vm) {
                const rec=data[ds][user];
                if(rec&&typeof rec==='object'&&rec.attend) {
                    total++; if(rec.attend.includes("LATE")) late++; else if(rec.attend.includes("ATT")) att++;
                    if(rec.leave){const tm=rec.leave.match(/(\d{2}):(\d{2})/);if(tm){totalLeaveMins+=(parseInt(tm[1])*60+parseInt(tm[2]));leaveCnt++;}}
                }
            }
        });
        const ratio=total>0?Math.round((late/total)*100):0;
        const pct=document.getElementById('lateRatioPercent');
        const bar=document.getElementById('lateRatioBar');
        const card=document.getElementById('weeklySummaryCard');
        const status=document.getElementById('lateRatioStatus');
        const warnIcon=document.getElementById('warningIcon');
        if(pct) pct.innerText=`${ratio}%`;
        if(bar&&card&&status&&warnIcon) {
            bar.style.width=`${ratio}%`;
            if(ratio>=50) {
                bar.className="sm-bar-fill warning"; card.classList.add('warning-pulse');
                status.innerText="Aku terlambat!"; status.className="sm-stats-status warning animate-blink";
                if(pct){pct.classList.add('animate-blink','warning');}
                warnIcon.classList.add('visible');
            } else {
                bar.className="sm-bar-fill"; card.classList.remove('warning-pulse');
                status.innerText="GOOD STANDING"; status.className="sm-stats-status";
                if(pct){pct.classList.remove('animate-blink','warning');}
                warnIcon.classList.remove('visible');
            }
        }
        const sc=document.getElementById('statCounts'); if(sc) sc.innerText=`T:${total} | A:${att} | L:${late}`;
        const avg=document.getElementById('avgLeaveTime');
        if(avg) {
            if(leaveCnt>0){const a=Math.round(totalLeaveMins/leaveCnt);avg.innerText=`Avg Out: ${String(Math.floor(a/60)).padStart(2,'0')}:${String(a%60).padStart(2,'0')}`;}
            else avg.innerText="Avg Out: --:--";
        }
    }

            }
        });

window.saveFutureLeave = function(dateStr) {
    const leaveType = document.getElementById('futureLeaveType').value;
    
    if(!leaveType) {
        alert("Please select a leave type.");
        return;
    }
    
    // 기존 데이터 확인
    db.ref(`attendance/${dateStr}/${user}`).once('value', snapshot => {
        const existingData = snapshot.val();
        
        // 동일한 휴가 타입이 이미 저장되어 있는지 확인
        if(existingData === leaveType) {
            alert("You have already applied for the same leave type!");
            return;
        }
        
        // 다른 휴가 타입이거나 데이터가 없으면 저장 진행
        if(confirm(`Set ${leaveType} for ${dateStr}?`)) {
            db.ref(`attendance/${dateStr}/${user}`).set(leaveType)
            .then(() => {
                alert("Future leave has been saved successfully.");
                document.getElementById('editPopup').remove();
                if(typeof renderCalendar === 'function') renderCalendar();
            })
            .catch(e => {
                console.error(e);
                alert("Failed to save: " + e.message);
            });
        }
    });
};

            const uSnap=await db.ref(`users/${user}/WarnFlag`).once('value');
            if(uSnap.val()==="off") return;
            const ts=getJakartaDate().toISOString().split('T')[0];
            if(localStorage.getItem('hideReportPopup')===ts) return;
            const attSnap=await db.ref('attendance').once('value');
            const attData=attSnap.val()||{};
            const missing=[]; const today=getJakartaDate();
            for(let i=1;i<=6;i++){
                const cd=new Date(today); cd.setDate(today.getDate()-i);
                const dw=cd.getDay(); if(dw===0||dw===6) continue;
                const cy=cd.getFullYear(),cm=String(cd.getMonth()+1).padStart(2,'0'),cdd=String(cd.getDate()).padStart(2,'0');
                const dStr=`${cy}-${cm}-${cdd}`;
                const attStatus=(attData[dStr]&&attData[dStr][user])?attData[dStr][user]:null;
                const leaveCodes=["ANL","PEL","HAL","SIL","SPL"];
                if(leaveCodes.includes(attStatus)) continue;
                const snap=await db.ref(`reports/${dStr}/${user}`).once('value');
                if(!snap.exists()) missing.push({date:`${dStr} (${cd.toLocaleDateString('en-US',{weekday:'short'})})`,status:"Work Report"});
            }
            if(missing.length>0) showMissingPopup(missing);
        } catch(e){console.error(e);}
    }

    function showMissingPopup(missingInfo) {
        if(document.getElementById('missingPopup')) return;
        const overlay=document.createElement('div'); overlay.id='missingPopup'; overlay.className='missing-modal-overlay';
        let listHtml=missingInfo.map(i=>`<div class="bg-slate-800/50 p-3 rounded-xl border border-slate-700/50 mb-2 flex justify-between items-center"><div class="text-left"><p class="text-[10px] font-black text-slate-500 uppercase tracking-tighter">${i.date}</p><p class="text-rose-400 font-mono text-xs font-black uppercase">Missing: <span class="text-white">${i.status}</span></p></div><div class="w-1.5 h-1.5 rounded-full bg-rose-500 animate-pulse"></div></div>`).join('');
        overlay.innerHTML=`<div class="missing-modal text-center"><div class="w-16 h-16 bg-rose-500/10 rounded-full flex items-center justify-center mx-auto mb-4 border border-rose-500/20"><span class="text-2xl">✍️</span></div><h3 class="text-xl font-black text-white mb-2 uppercase tracking-tight italic">Missing Report</h3><p class="text-slate-400 text-[10px] mb-2 font-bold leading-tight uppercase">Daily Work Report is not submitted:</p><div class="flex items-center gap-2 mb-6"><span class="bg-rose-500 text-white text-[9px] px-2 py-0.5 rounded font-black animate-blink shrink-0">REQUIRED</span><span class="text-[10px] text-slate-500 font-bold tracking-tight flex-grow text-left">Please complete your work reports for the dates below</span></div><div class="max-h-[200px] overflow-y-auto no-scrollbar mb-6 px-1">${listHtml}</div><div class="space-y-3"><button onclick="document.getElementById('missingPopup').remove()" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-black py-4 rounded-2xl transition-all active:scale-95 shadow-xl shadow-rose-900/20 uppercase tracking-widest text-xs">I will write it now</button><button onclick="hidePopupToday()" class="w-full text-slate-500 hover:text-slate-300 text-[10px] font-bold uppercase tracking-widest transition-colors">Don't show this again today</button></div></div>`;
        document.body.appendChild(overlay);
    }

    window.hidePopupToday = function() {
        localStorage.setItem('hideReportPopup', getJakartaDate().toISOString().split('T')[0]);
        const p=document.getElementById('missingPopup'); if(p) p.remove();
    };

    document.addEventListener('DOMContentLoaded', ()=>{ setTimeout(()=>{ if(typeof showFortune==='function') showFortune(); checkMissingRecords(); },800); });
    renderCalendar();
})();
</script>
