<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />

<style>
/* ══════════════════════════════════════════════════════════
   STAFF DASHBOARD — 7-DAY ADAPTIVE THEME SYSTEM
   CSS Custom Properties injected by JS per day-of-week
   All colours flow from --t-* tokens → zero per-day duplication
══════════════════════════════════════════════════════════ */

/* ── Day-neutral token defaults (Mon / Deep-Space baseline) ── */
:root {
  /* Surface */
  --t-bg:        #040810;
  --t-surface:   #080f1e;
  --t-surface2:  #0d1628;
  --t-surface3:  #111e33;
  --t-border:    rgba(255,255,255,0.06);
  --t-border2:   rgba(255,255,255,0.12);
  /* Text */
  --t-text:      #f1f5f9;
  --t-muted:     #475569;
  --t-dim:       #1e293b;
  /* Accent */
  --t-accent:    #3b82f6;
  --t-accent2:   #06b6d4;
  --t-accent-glow: rgba(59,130,246,0.18);
  --t-accent-gradient: linear-gradient(90deg,#3b82f6,#06b6d4);
  /* Semantic */
  --t-green:     #10b981;   --t-green-dim:  rgba(16,185,129,0.12);
  --t-red:       #f43f5e;   --t-red-dim:    rgba(244,63,94,0.12);
  --t-amber:     #f59e0b;   --t-amber-dim:  rgba(245,158,11,0.12);
  --t-cyan:      #06b6d4;
  /* Card 3-D */
  --t-card-shine:  rgba(255,255,255,0.07);
  --t-card-bevel:  linear-gradient(90deg,transparent,rgba(99,179,237,0.28),transparent);
  --t-card-face:   linear-gradient(155deg,rgba(255,255,255,0.04) 0%,transparent 55%);
  --t-card-radius: 18px;
  --t-card-shadow-near: rgba(0,0,0,0.3);
  --t-card-shadow-far:  rgba(0,0,0,0.45);
  /* Typography */
  --t-font-display: 'Pretendard', sans-serif;
  --t-font-ui:      'Pretendard', sans-serif;
  --t-font-mono:    'SF Mono','Fira Code',monospace;
}

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ══════════════════════════════════════════════════════════
   SCROLLBAR
══════════════════════════════════════════════════════════ */
::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--t-dim); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: #334155; }
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

/* ══════════════════════════════════════════════════════════
   DASHBOARD WRAPPER + BIG ROAMING CREATURE LAYER
   Two inline SVGs (primary + smaller companion), each an
   original per-day creature design recoloured to match this
   page's own --t-accent / --t-accent2 tokens, so it reads as
   one consistent brand across login → main menu → dashboard.
   Movement is a single transform keyframe per day, GPU-only
   (translate/rotate/scale) -- zero per-frame JS cost. Sized and
   kept at lower opacity than the lighter pages since this is a
   data-dense screen (tables/calendar) that needs to stay readable.
══════════════════════════════════════════════════════════ */
.sm-dashboard-wrap { position: relative; }

.bg-creature {
  position: fixed;
  top: 0; left: 0;
  width: clamp(200px, 30vw, 420px);
  height: auto;
  z-index: 0;
  pointer-events: none;
  opacity: 0.32;
  will-change: transform;
  animation: creatureRoamMon 26s ease-in-out infinite;
}
.bg-creature.second {
  width: clamp(130px, 18vw, 260px);
  opacity: 0.2;
  animation-direction: reverse;
  display: none;
}
@media (min-width: 768px) {
  .bg-creature.second { display: block; }
}
@media (max-width: 479px) {
  .bg-creature { width: clamp(150px, 42vw, 240px); opacity: 0.26; }
}

/* Pause every decorative animation while the tab is hidden --
   the main CPU/GPU cost lever for a page with several loops. */
.sm-dashboard-wrap.anim-paused .bg-creature,
.sm-dashboard-wrap.anim-paused .fortune-bubble,
.sm-dashboard-wrap.anim-paused .warning-pulse,
.sm-dashboard-wrap.anim-paused .animate-blink,
.sm-dashboard-wrap.anim-paused .animate-pulse-slow {
  animation-play-state: paused !important;
}

/* Seven full-viewport roaming paths, one per day theme. */
@keyframes creatureRoamMon {
  0%   { transform: translate(-6vw, 65vh) rotate(-4deg) scale(1); }
  20%  { transform: translate(55vw, 10vh) rotate(3deg) scale(1.05); }
  40%  { transform: translate(85vw, 55vh) rotate(-2deg) scale(0.96); }
  50%  { transform: translate(85vw, 55vh) rotate(-2deg) scale(0.96) scaleX(-1); }
  70%  { transform: translate(40vw, 78vh) rotate(4deg) scale(1.02) scaleX(-1); }
  90%  { transform: translate(0vw, 30vh) rotate(-3deg) scale(1) scaleX(-1); }
  100% { transform: translate(-6vw, 65vh) rotate(-4deg) scale(1); }
}
@keyframes creatureRoamTue {
  0%, 100% { transform: translate(4vw, 60vh) rotate(0deg) scale(1); }
  25%      { transform: translate(60vw, 20vh) rotate(3deg) scale(1.06); }
  50%      { transform: translate(30vw, 70vh) rotate(-2deg) scale(0.95); }
  75%      { transform: translate(75vw, 45vh) rotate(2deg) scale(1.03); }
}
@keyframes creatureRoamWed {
  0%    { transform: translate(-8vw, 20vh) rotate(-6deg) scale(1); }
  49%   { transform: translate(78vw, 60vh) rotate(4deg) scale(1.04); }
  50%   { transform: translate(78vw, 60vh) rotate(4deg) scale(1.04) scaleX(-1); }
  99%   { transform: translate(-8vw, 20vh) rotate(-6deg) scale(1) scaleX(-1); }
  100%  { transform: translate(-8vw, 20vh) rotate(-6deg) scale(1); }
}
@keyframes creatureRoamThu {
  0%   { transform: translate(0vw, 66vh) rotate(-2deg) scale(1); }
  10%  { transform: translate(12vw, 46vh) rotate(2deg) scale(1.02); }
  20%  { transform: translate(24vw, 66vh) rotate(-2deg) scale(1); }
  30%  { transform: translate(38vw, 40vh) rotate(2deg) scale(1.03); }
  40%  { transform: translate(52vw, 66vh) rotate(-2deg) scale(1); }
  50%  { transform: translate(66vw, 36vh) rotate(2deg) scale(1.04) scaleX(-1); }
  60%  { transform: translate(52vw, 66vh) rotate(-2deg) scale(1) scaleX(-1); }
  70%  { transform: translate(38vw, 40vh) rotate(2deg) scale(1.03) scaleX(-1); }
  80%  { transform: translate(24vw, 66vh) rotate(-2deg) scale(1) scaleX(-1); }
  90%  { transform: translate(12vw, 46vh) rotate(2deg) scale(1.02) scaleX(-1); }
  100% { transform: translate(0vw, 66vh) rotate(-2deg) scale(1); }
}
@keyframes creatureRoamFri {
  0%   { transform: translate(-4vw, 30vh) rotate(-8deg) scale(1); }
  20%  { transform: translate(48vw, 8vh) rotate(10deg) scale(1.08); }
  40%  { transform: translate(20vw, 55vh) rotate(-10deg) scale(0.95); }
  50%  { transform: translate(72vw, 20vh) rotate(8deg) scale(1.06) scaleX(-1); }
  70%  { transform: translate(50vw, 68vh) rotate(-8deg) scale(1) scaleX(-1); }
  90%  { transform: translate(10vw, 42vh) rotate(6deg) scale(1.03) scaleX(-1); }
  100% { transform: translate(-4vw, 30vh) rotate(-8deg) scale(1); }
}
@keyframes creatureRoamSat {
  0%    { transform: translate(-6vw, 50vh) rotate(0deg) scale(1); }
  49%   { transform: translate(88vw, 25vh) rotate(0deg) scale(1.05); }
  50%   { transform: translate(88vw, 25vh) rotate(0deg) scale(1.05) scaleX(-1); }
  99%   { transform: translate(-6vw, 50vh) rotate(0deg) scale(1) scaleX(-1); }
  100%  { transform: translate(-6vw, 50vh) rotate(0deg) scale(1); }
}
@keyframes creatureRoamSun {
  0%   { transform: translate(10vw, 70vh) rotate(-4deg) scale(1); opacity: 0.32; }
  50%  { transform: translate(60vw, 12vh) rotate(4deg) scale(1.12); opacity: 0.42; }
  100% { transform: translate(10vw, 70vh) rotate(-4deg) scale(1); opacity: 0.32; }
}
.theme-day-1 .bg-creature { animation-name: creatureRoamMon; animation-duration: 28s; filter: drop-shadow(0 0 20px rgba(56,189,248,0.55)) drop-shadow(0 0 34px rgba(129,140,248,0.3)); }
.theme-day-2 .bg-creature { animation-name: creatureRoamTue; animation-duration: 32s; filter: drop-shadow(0 0 18px rgba(212,180,131,0.5))  drop-shadow(0 0 30px rgba(138,106,62,0.28)); }
.theme-day-3 .bg-creature { animation-name: creatureRoamWed; animation-duration: 26s; filter: drop-shadow(0 0 18px rgba(200,168,75,0.5))  drop-shadow(0 0 30px rgba(232,212,138,0.28)); }
.theme-day-4 .bg-creature { animation-name: creatureRoamThu; animation-duration: 20s; filter: drop-shadow(0 0 18px rgba(111,191,95,0.5))  drop-shadow(0 0 30px rgba(217,154,91,0.28)); }
.theme-day-5 .bg-creature { animation-name: creatureRoamFri; animation-duration: 16s; filter: drop-shadow(0 0 24px rgba(255,0,204,0.55)) drop-shadow(0 0 38px rgba(0,238,255,0.35)); }
.theme-day-6 .bg-creature { animation-name: creatureRoamSat; animation-duration: 22s; filter: drop-shadow(0 0 20px rgba(96,165,250,0.55)) drop-shadow(0 0 32px rgba(165,200,255,0.3)); }
.theme-day-0 .bg-creature { animation-name: creatureRoamSun; animation-duration: 26s; filter: drop-shadow(0 0 22px rgba(249,115,22,0.55)) drop-shadow(0 0 36px rgba(190,24,93,0.3)); }

/* ══════════════════════════════════════════════════════════
   ROOT ELEMENT
══════════════════════════════════════════════════════════ */
.sm-root {
  position: relative;
  z-index: 1;
  font-family: var(--t-font-ui);
  color: var(--t-text);
  /* Layout: two columns on tablet+, one column on mobile */
  display: grid;
  grid-template-columns: 1fr;
  gap: clamp(0.65rem, 2vw, 1rem);
  transition: color 0.4s ease;
}
@media (min-width: 640px) {
  .sm-root {
    grid-template-columns: minmax(0,1fr) minmax(0,1.55fr);
    align-items: start;
  }
}
@media (min-width: 1440px) {
  .sm-root { max-width: 1400px; margin: 0 auto; }
}

/* ══════════════════════════════════════════════════════════
   3-D CARD BASE — shared by all panel components
══════════════════════════════════════════════════════════ */
.card-3d {
  position: relative;
  background: linear-gradient(145deg, var(--t-surface2) 0%, var(--t-surface) 100%);
  border: 1px solid var(--t-border);
  border-top: 1px solid var(--t-border2);
  border-radius: var(--t-card-radius);
  /* Multi-layer shadow → floating 3-D depth */
  box-shadow:
    inset 0 1px 0 var(--t-card-shine),
    inset 0 -1px 0 rgba(0,0,0,0.25),
    0 2px 6px var(--t-card-shadow-near),
    0 8px 24px var(--t-card-shadow-far);
  will-change: transform;
  transition: transform 0.32s cubic-bezier(0.23,1,0.32,1),
              box-shadow  0.32s ease,
              border-color 0.32s ease;
}
/* Top-edge bevel line (3-D illusion) */
.card-3d::before {
  content: '';
  position: absolute; top: 0; left: 15%; right: 15%; height: 1px;
  background: var(--t-card-bevel);
  pointer-events: none;
  border-radius: inherit;
}
/* Face gloss */
.card-3d::after {
  content: '';
  position: absolute; inset: 0;
  background: var(--t-card-face);
  pointer-events: none;
  border-radius: inherit;
}
@media (hover:hover) {
  .card-3d:hover {
    transform: translateY(-5px) perspective(900px) rotateX(2.5deg);
    border-color: var(--t-accent);
    box-shadow:
      inset 0 1px 0 var(--t-card-shine),
      0 4px 10px var(--t-card-shadow-near),
      0 18px 40px var(--t-card-shadow-far),
      0 0 0 1px var(--t-accent-glow),
      0 0 28px var(--t-accent-glow);
  }
}

/* ══════════════════════════════════════════════════════════
   HERO CARD (Name + Date)
══════════════════════════════════════════════════════════ */
.sm-hero {
  padding: clamp(14px,4vw,20px);
  position: relative; overflow: hidden;
}
.sm-hero::after { background: none; } /* override card-3d gloss here */
.sm-hero-glow {
  /* decorative radial behind hero */
  position: absolute; top: -40px; right: -40px;
  width: 130px; height: 130px;
  background: radial-gradient(circle, var(--t-accent-glow), transparent 70%);
  border-radius: 50%;
  pointer-events: none;
}

.sm-hero-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.sm-hero-label {
  font-size: clamp(7px,2vw,9px); font-weight: 900;
  color: var(--t-muted); text-transform: uppercase; letter-spacing: 0.14em;
  font-family: var(--t-font-ui);
}
.sm-hero-name {
  font-size: clamp(16px,5vw,22px); font-weight: 900;
  color: var(--t-text); letter-spacing: -0.02em; line-height: 1;
  margin-top: 3px;
  font-family: var(--t-font-display);
  text-shadow: 0 0 20px var(--t-accent-glow);
}
.sm-live-date {
  font-size: clamp(8px,2.2vw,10px); font-weight: 800;
  color: var(--t-accent);
  background: var(--t-accent-glow);
  border: 1px solid color-mix(in srgb, var(--t-accent) 35%, transparent);
  padding: 3px 10px; border-radius: 8px; white-space: nowrap;
  box-shadow: 0 0 10px var(--t-accent-glow);
  font-family: var(--t-font-ui);
}

/* ── Fortune bubble ── */
.fortune-bubble {
  display: block; margin-top: 10px; padding: 8px 12px;
  background: rgba(255,255,255,0.025);
  border: 1px solid var(--t-border);
  border-radius: 10px;
  font-size: clamp(9px,2.5vw,11px); color: var(--t-muted); font-weight: 700;
  font-family: var(--t-font-ui);
  animation: floatBubble 4s ease-in-out infinite;
}
@keyframes floatBubble { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }

/* ══════════════════════════════════════════════════════════
   LEAVE ALERT
══════════════════════════════════════════════════════════ */
#leaveStatusAlert { display: none; }
#leaveStatusAlert.visible { display: block; }
.sm-leave-alert {
  border-radius: 14px; padding: 12px 14px;
  display: flex; align-items: center; gap: 10px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
}
.sm-leave-alert.pending {
  background: linear-gradient(135deg,var(--t-amber-dim),rgba(245,158,11,0.04));
  border: 1px solid rgba(245,158,11,0.35); border-top-color: rgba(245,158,11,0.5);
}
.sm-leave-alert.rejected {
  background: linear-gradient(135deg,var(--t-red-dim),rgba(244,63,94,0.04));
  border: 1px solid rgba(244,63,94,0.35); border-top-color: rgba(244,63,94,0.5);
}
.sm-leave-alert-icon { font-size: 18px; flex-shrink: 0; }
.sm-leave-alert-title { font-size: 9px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.08em; font-family: var(--t-font-ui); }
.sm-leave-alert-title.pending { color: var(--t-amber); text-shadow: 0 0 10px rgba(245,158,11,0.4); }
.sm-leave-alert-title.rejected { color: var(--t-red);  text-shadow: 0 0 10px rgba(244,63,94,0.4); }
.sm-leave-alert-msg { font-size: 10px; color: var(--t-text); font-weight: 600; margin-top: 2px; font-family: var(--t-font-ui); }
.sm-leave-alert-close { margin-left: auto; color: var(--t-muted); cursor: pointer; font-size: 18px; flex-shrink: 0; transition: color 0.2s; }
.sm-leave-alert-close:hover { color: var(--t-text); }

/* ══════════════════════════════════════════════════════════
   TODAY STRIP (In / Out)
══════════════════════════════════════════════════════════ */
.sm-today-strip {
  border-radius: var(--t-card-radius);
  padding: clamp(12px,3vw,16px) clamp(14px,4vw,18px);
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  background: linear-gradient(145deg, var(--t-surface2) 0%, var(--t-surface) 100%);
  border: 1px solid var(--t-border); border-top-color: var(--t-border2);
  box-shadow: inset 0 1px 0 var(--t-card-shine), 0 4px 16px rgba(0,0,0,0.3);
  will-change: transform;
  transition: transform 0.28s cubic-bezier(0.23,1,0.32,1), box-shadow 0.28s;
}
@media (hover:hover) {
  .sm-today-strip:hover {
    transform: translateY(-3px);
    box-shadow: inset 0 1px 0 var(--t-card-shine), 0 12px 28px rgba(0,0,0,0.45);
  }
}
.sm-today-item { display: flex; flex-direction: column; gap: 3px; }
.sm-today-lbl { font-size: clamp(7px,2vw,9px); font-weight: 900; color: var(--t-muted); text-transform: uppercase; letter-spacing: 0.1em; font-family: var(--t-font-ui); }
.sm-today-val { font-size: clamp(14px,4.5vw,18px); font-weight: 900; letter-spacing: -0.01em; font-family: var(--t-font-display); }
.sm-today-val.in  { color: var(--t-green);  text-shadow: 0 0 12px rgba(16,185,129,0.4); }
.sm-today-val.out { color: var(--t-accent); text-shadow: 0 0 12px var(--t-accent-glow); }
.sm-today-val.empty { color: var(--t-dim); font-size: clamp(12px,3.5vw,14px); }

/* ══════════════════════════════════════════════════════════
   ALL-STAFF TODAY CARD
══════════════════════════════════════════════════════════ */
.sm-all-staff-card {
  background: linear-gradient(145deg, var(--t-surface2), var(--t-surface));
  border: 1px solid var(--t-border); border-top-color: var(--t-border2);
  border-radius: var(--t-card-radius);
  padding: 12px 14px;
  box-shadow: inset 0 1px 0 var(--t-card-shine), 0 4px 14px rgba(0,0,0,0.28);
  transition: transform 0.28s ease, box-shadow 0.28s;
}
@media (hover:hover) {
  .sm-all-staff-card:hover {
    transform: translateY(-2px);
    box-shadow: inset 0 1px 0 var(--t-card-shine), 0 8px 22px rgba(0,0,0,0.38);
  }
}
.sm-all-staff-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.sm-all-staff-lbl { font-size: clamp(7px,2vw,9px); font-weight: 900; color: var(--t-muted); text-transform: uppercase; letter-spacing: 0.1em; font-family: var(--t-font-ui); }
.sm-all-staff-count { font-size: 10px; font-weight: 800; color: var(--t-accent); font-family: var(--t-font-display); }

/* ── Staff rows inside the card ── */
.staff-row {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--t-surface3);
  border: 1px solid var(--t-border); border-radius: 8px;
  padding: 5px 10px;
  transition: all 0.18s ease;
}
@media (hover:hover) {
  .staff-row:hover { border-color: var(--t-accent); background: color-mix(in srgb, var(--t-accent) 8%, transparent); transform: translateX(2px); }
}
.staff-name { font-size: clamp(8px,2.2vw,10px); font-weight: 900; color: var(--t-text); text-transform: uppercase; letter-spacing: 0.03em; font-family: var(--t-font-ui); }
.staff-time { font-size: clamp(7px,2vw,9px); font-weight: 800; font-family: var(--t-font-mono); padding: 2px 7px; border-radius: 5px; }
.staff-time.present { color: var(--t-green); background: var(--t-green-dim); border: 1px solid rgba(16,185,129,0.22); }
.staff-time.late    { color: var(--t-red);   background: var(--t-red-dim);   border: 1px solid rgba(244,63,94,0.22); }

/* ══════════════════════════════════════════════════════════
   ATTENDANCE PANEL
══════════════════════════════════════════════════════════ */
.sm-panel {
  background: linear-gradient(145deg, var(--t-surface2) 0%, var(--t-surface) 100%);
  border: 1px solid var(--t-border); border-top-color: var(--t-border2);
  border-radius: var(--t-card-radius);
  padding: clamp(14px,4vw,20px);
  position: relative;
  box-shadow: inset 0 1px 0 var(--t-card-shine), 0 8px 24px rgba(0,0,0,0.4);
}
.sm-panel::before {
  content: '';
  position: absolute; top: 0; left: 15%; right: 15%; height: 1px;
  background: var(--t-card-bevel);
  pointer-events: none;
}
.sm-panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: clamp(10px,3vw,16px); }
.sm-panel-title  { font-size: clamp(7px,2vw,9px); font-weight: 900; color: var(--t-muted); text-transform: uppercase; letter-spacing: 0.12em; font-family: var(--t-font-ui); }

/* ── Bar ── */
.sm-bar { width:100%; height:3px; background:var(--t-dim); border-radius:10px; overflow:hidden; margin-bottom:8px; box-shadow:inset 0 1px 2px rgba(0,0,0,0.4); }
.sm-bar-fill { height:100%; background:var(--t-accent); border-radius:10px; transition:width 1s ease; box-shadow: 0 0 8px var(--t-accent-glow); }
.sm-bar-fill.warning { background:var(--t-red); box-shadow:0 0 8px rgba(244,63,94,0.4); }
#warningIcon { display:none; }
#warningIcon.visible { display:inline; }

/* ── Time input ── */
.sm-time-label { font-size: clamp(7px,2vw,9px); font-weight:900; color:var(--t-muted); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:4px; font-family:var(--t-font-ui); }
.sm-time-input {
  width:100%;
  background: linear-gradient(145deg,#050a14,#070d1a);
  color:var(--t-text); font-size:clamp(18px,5vw,24px); font-weight:900; text-align:center;
  letter-spacing:0.05em; padding:10px;
  border-radius: calc(var(--t-card-radius) * 0.7);
  border:1px solid var(--t-dim); outline:none;
  font-family:var(--t-font-mono);
  transition:border-color 0.2s, box-shadow 0.2s;

  background: linear-gradient(135deg,#f43f5e,#e11d48); color:#fff;

/* ══════════════════════════════════════════════════════════
   MONTH SUMMARY CARD
══════════════════════════════════════════════════════════ */

}

.sm-cal-card {

}
.sm-cal-card::before {
  content:'';
  position:absolute; top:0; left:10%; right:10%; height:1px;
  background: var(--t-card-bevel);
  pointer-events:none;
}
.sm-cal-card::after { background:none; } /* no face gloss on cal */

.sm-cal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:clamp(12px,3vw,18px); gap:10px; flex-wrap:wrap; }
.sm-cal-title {
  font-size:clamp(14px,4vw,18px); font-weight:900;
  color:var(--t-text); letter-spacing:-0.01em; font-style:italic;

}

.sm-cal-nav {
  display:flex;

  border:1px solid var(--t-border); border-radius:10px; overflow:hidden;

  padding: clamp(4px,1.5vw,6px) clamp(8px,3vw,13px);
  font-size:clamp(7px,2vw,10px); font-weight:900; color:var(--t-muted);
  background:none; border:none; cursor:pointer;
  font-family:var(--t-font-mono); text-transform:uppercase; letter-spacing:0.05em;
  transition:color 0.15s, background 0.15s;
}
@media (hover:hover) {
  .sm-nav-btn:hover { color:var(--t-text); background:color-mix(in srgb,var(--t-accent) 12%,transparent); }
}
.sm-nav-btn.today-btn { color:var(--t-accent); text-shadow:0 0 8px var(--t-accent-glow); }

/* ── Calendar Table ── */
.sm-cal-table { width:100%; border-collapse:separate; border-spacing:2px; table-layout:fixed; }
.sm-cal-table th {
  padding:clamp(4px,1.5vw,7px) 2px;
  font-size:clamp(7px,2vw,9px); font-weight:900; text-transform:uppercase; letter-spacing:0.06em;
  color:var(--t-muted); text-align:center; border-bottom:1px solid var(--t-border);
  font-family:var(--t-font-ui);
}
.sm-cal-table th.sun { color:rgba(244,63,94,0.8); text-shadow:0 0 6px rgba(244,63,94,0.3); }
.sm-cal-table th.sat { color:color-mix(in srgb,var(--t-accent) 80%,white); text-shadow:0 0 6px var(--t-accent-glow); }

.sm-cal-table td {
  height: clamp(52px,13vw,72px);
  vertical-align:top; padding:4px;
  border:1px solid rgba(20,30,50,0.8); border-radius:8px;
  cursor:pointer;
  will-change:transform;
  transition:all 0.18s cubic-bezier(0.23,1,0.32,1);
  position:relative;
  background: linear-gradient(145deg,var(--t-surface3) 0%,var(--t-surface2) 100%);
  box-shadow:0 1px 4px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.025);
}
@media (hover:hover) {
  .sm-cal-table td:hover {
    background: linear-gradient(145deg,color-mix(in srgb,var(--t-accent) 12%,var(--t-surface3)) 0%,var(--t-surface2) 100%);
    border-color: color-mix(in srgb,var(--t-accent) 35%,transparent);
    transform:translateY(-2px) scale(1.035);
    box-shadow:0 6px 16px var(--t-accent-glow), inset 0 1px 0 rgba(255,255,255,0.05);
    z-index:2;
  }
}
.sm-cal-table td.sun-cell { background: linear-gradient(145deg,rgba(244,63,94,0.05),var(--t-surface2)); }
.sm-cal-table td.sat-cell { background: linear-gradient(145deg,color-mix(in srgb,var(--t-accent) 7%,transparent),var(--t-surface2)); }
.sm-cal-table td.today-highlight {
  background: linear-gradient(145deg,color-mix(in srgb,var(--t-accent) 14%,transparent),color-mix(in srgb,var(--t-accent2) 7%,transparent)) !important;

.sm-cal-date { font-size:clamp(7px,2vw,10px); font-weight:900; color:var(--t-muted); margin-bottom:2px; padding:1px 2px; font-family:var(--t-font-ui); }
.sm-cal-date.sun   { color:rgba(244,63,94,0.65); }
.sm-cal-date.sat   { color:color-mix(in srgb,var(--t-accent) 65%,white); }
.sm-cal-date.today { color:var(--t-accent); text-shadow:0 0 8px var(--t-accent-glow); }

.time-label {
  display:block; font-size:clamp(6px,1.8vw,9px); font-weight:900;
  padding:1px 3px; margin-top:1px; border-radius:4px;
  text-align:center; font-family:var(--t-font-mono);
  letter-spacing:-0.03em; line-height:1.4;

══════════════════════════════════════════════════════════ */
.missing-modal-overlay, .edit-modal-overlay {
  position:fixed; inset:0;
  background:rgba(0,0,0,0.88); backdrop-filter:blur(12px);
  display:flex; align-items:center; justify-content:center; z-index:9999;
}
.edit-modal-overlay { z-index:10000; }
.missing-modal, .edit-modal {
  background: linear-gradient(145deg,var(--t-surface2),var(--t-surface));
  border:1px solid var(--t-border); border-top-color:var(--t-border2);
  border-radius:24px; width:90%; max-width:420px; padding:2rem;
  box-shadow:0 40px 80px rgba(0,0,0,0.7), inset 0 1px 0 var(--t-card-shine);
  animation:modalIn 0.35s cubic-bezier(0.23,1,0.32,1) both;
}

.edit-modal input[readonly] { background:#1e293b; color:#64748b; cursor:not-allowed; }

  border:none; cursor:pointer; transition:all 0.2s;
}
.close-modal-btn:hover { background:linear-gradient(135deg,#475569,#334155); transform:translateY(-1px); }

/* ══════════════════════════════════════════════════════════
   ANIMATIONS
══════════════════════════════════════════════════════════ */
@keyframes pulse-red { 0%{box-shadow:0 0 0 0 rgba(244,63,94,0)} 50%{box-shadow:0 0 14px rgba(244,63,94,0.35)} 100%{box-shadow:0 0 0 0 rgba(244,63,94,0)} }
.warning-pulse { animation:pulse-red 2s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
.animate-blink { animation:blink 1s infinite; }
@keyframes pulse-border { 0%,100%{opacity:1} 50%{opacity:0.5} }
.animate-pulse-slow { animation:pulse-border 2s infinite; }

/* Entry animations */
@keyframes fadeSlideIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
.sm-left > * { animation:fadeSlideIn 0.42s cubic-bezier(0.22,1,0.36,1) both; }
.sm-left > *:nth-child(1) { animation-delay:0s; }
.sm-left > *:nth-child(2) { animation-delay:0.06s; }
.sm-left > *:nth-child(3) { animation-delay:0.12s; }
.sm-left > *:nth-child(4) { animation-delay:0.18s; }
.sm-left > *:nth-child(5) { animation-delay:0.24s; }
.sm-right { animation:fadeSlideIn 0.45s 0.1s cubic-bezier(0.22,1,0.36,1) both; }

@media (prefers-reduced-motion:reduce) {
  .card-3d, .sm-today-strip, .sm-cal-table td, .sm-btn, .staff-row { transition:none !important; }

  .animate-blink, .animate-pulse-slow, .warning-pulse, .bg-creature { animation:none; }
}

/* ══════════════════════════════════════════════════════════
   RESPONSIVE EXTRAS
══════════════════════════════════════════════════════════ */
/* Stack the hero + strip + all-staff on mobile */
.sm-top-layout {
  display:flex; gap:10px; align-items:stretch; flex-wrap:wrap;

          isAttReadOnly=true;
        }
        if (currentRec.leave) { const lm=currentRec.leave.match(/(\d{1,2}:\d{2})/); if(lm){const[h,mn]=lm[1].split(':');leaveVal=`${h.padStart(2,'0')}:${mn}`;}else leaveVal=currentRec.leave; }
      }
    }
    const overlay=document.createElement('div'); overlay.id='editPopup'; overlay.className='edit-modal-overlay';
    let footerButtons=isLeaveInfo?
      `<button onclick="document.getElementById('editPopup').remove()" class="w-full bg-slate-700 text-white py-4 rounded-xl text-xs font-black uppercase tracking-widest transition active:scale-95">Close (Read Only)</button>`
      :`<button onclick="document.getElementById('editPopup').remove()" class="bg-slate-800 text-slate-400 py-4 rounded-xl text-xs font-black uppercase tracking-widest transition active:scale-95">Cancel</button><button onclick="saveEditRecord('${dateStr}',${isAttReadOnly})" class="bg-blue-600 text-white py-4 rounded-xl text-xs font-black uppercase tracking-widest transition active:scale-95 shadow-lg shadow-blue-500/20">Save Change</button>`;
    overlay.innerHTML=`<div class="edit-modal"><div class="mb-4 text-center"><p class="text-[10px] font-black ${isLeaveInfo?'text-amber-500':(isAttReadOnly?'text-rose-500':'text-emerald-500')} uppercase tracking-widest mb-1">${isLeaveInfo?'📅 Leave Information':(isAttReadOnly?'⚠️ Attendance Locked':'✍️ Attendance Missing')}</p><h3 class="text-white font-black text-lg">${dateStr}</h3></div><div class="space-y-4"><div><label class="block text-[9px] font-black text-slate-500 uppercase mb-1">Attendance / Status</label>${isLeaveInfo?`<div class="w-full bg-slate-800 text-amber-500 p-3 rounded-xl border border-amber-500/30 font-black text-xl text-center">${leaveTypeText}</div>`:`<input type="time" id="editAttTime" value="${attVal}" ${isAttReadOnly?'readonly':''} class="w-full ${isAttReadOnly?'bg-slate-800 text-slate-400 border-slate-700':'bg-slate-800 text-white border-emerald-500/50'} p-3 rounded-xl border outline-none font-black text-xl">`}</div>${!isLeaveInfo?`<div><label class="block text-[9px] font-black text-blue-500 uppercase mb-1">Leave Time</label><div class="flex gap-2"><input type="time" id="editLeaveTime" value="${leaveVal}" class="flex-1 bg-slate-800 text-white p-3 rounded-xl border border-blue-500/50 outline-none font-black text-xl"><button onclick="deleteLeaveTime('${dateStr}')" class="bg-rose-600/20 hover:bg-rose-600 text-rose-500 hover:text-white px-4 rounded-xl border border-rose-600/30 transition-all active:scale-95" title="Delete">🗑️</button></div></div>`:'<p class="text-[10px] text-slate-500 text-center italic">This record is a registered leave and cannot be modified.</p>'}<div class="${isLeaveInfo?'':'grid grid-cols-2'} gap-3 mt-6">${footerButtons}</div></div></div>`;
    document.body.appendChild(overlay);
  };

  window.saveFutureLeave = function(dateStr) {
    const leaveType=document.getElementById('futureLeaveType').value;
    if (!leaveType) { alert("Please select a leave type."); return; }
    db.ref(`attendance/${dateStr}/${user}`).once('value', snapshot => {
      if (snapshot.val()===leaveType) { alert("You have already applied for the same leave type!"); return; }
      if (confirm(`Set ${leaveType} for ${dateStr}?`)) {
        db.ref(`attendance/${dateStr}/${user}`).set(leaveType)
        .then(()=>{ alert("Future leave has been saved successfully."); document.getElementById('editPopup').remove(); if(typeof renderCalendar==='function') renderCalendar(); })
        .catch(e=>{ console.error(e); alert("Failed to save: "+e.message); });
      }
    });
  };

  window.deleteFutureLeave = function(dateStr) {
    if (!confirm(`Delete leave record for ${dateStr}?`)) return;
    db.ref(`attendance/${dateStr}/${user}`).remove()
    .then(()=>{ alert("Leave record has been deleted successfully."); document.getElementById('editPopup').remove(); if(typeof renderCalendar==='function') renderCalendar(); })
    .catch(e=>{ console.error(e); alert("Failed to delete: "+e.message); });
  };

  window.deleteLeaveTime = function(dateStr) {
    if (!confirm(`${dateStr}의 Leave Time 기록을 삭제하시겠습니까?`)) return;
    db.ref(`attendance/${dateStr}/${user}/leave`).remove()
    .then(()=>{ alert("Leave time has been deleted."); const p=document.getElementById('editPopup'); if(p) p.remove(); if(typeof renderCalendar==='function') renderCalendar(); })
    .catch(e=>{ console.error(e); alert("Failed to delete record."); });
  };

  window.saveEditRecord = function(dateStr, isAttReadOnly) {
    const newAtt=document.getElementById('editAttTime').value;
    const newLeave=document.getElementById('editLeaveTime').value;
    const updateData={};
    if (!isAttReadOnly&&newAtt) {
      if (typeof standardTime==='undefined') { alert("Standard time loading..."); return; }
      const[iH,iM]=newAtt.split(':').map(Number),[sH,sM]=standardTime.split(':').map(Number);
      updateData.attend=(iH*60+iM<=sH*60+sM)?`ATT(${newAtt})`:`LATE(${newAtt})`;
    }
    if (newLeave) updateData.leave=newLeave;
    if (Object.keys(updateData).length===0) { alert("No changes to save."); return; }
    if (confirm(`Save changes for ${dateStr}?`)) {
      firebase.database().ref('attendance/'+dateStr+'/'+user).update(updateData)
      .then(()=>{ alert("Record updated successfully."); document.getElementById('editPopup').remove(); if(typeof renderCalendar==='function') renderCalendar(); })
      .catch(e=>alert("Error: "+e.message));
    }
  };

  /* ── Missing Records ── */
  async function checkMissingRecords() {
    if (!user) return;
    try {
      const uSnap=await db.ref(`users/${user}/WarnFlag`).once('value');
      if (uSnap.val()==="off") return;
      const ts=getJakartaDate().toISOString().split('T')[0];
      if (localStorage.getItem('hideReportPopup')===ts) return;
      const attSnap=await db.ref('attendance').once('value');
      const attData=attSnap.val()||{};
      const missing=[]; const today=getJakartaDate();
      for (let i=1;i<=6;i++) {
        const cd=new Date(today); cd.setDate(today.getDate()-i);
        const dw=cd.getDay(); if(dw===0||dw===6) continue;
        const cy=cd.getFullYear(),cm=String(cd.getMonth()+1).padStart(2,'0'),cdd=String(cd.getDate()).padStart(2,'0');
        const dStr=`${cy}-${cm}-${cdd}`;
        const attStatus=(attData[dStr]&&attData[dStr][user])?attData[dStr][user]:null;
        const leaveCodes=["ANL","PEL","HAL","SIL","SPL"];
        if (leaveCodes.includes(attStatus)) continue;
        const snap=await db.ref(`reports/${dStr}/${user}`).once('value');
        if (!snap.exists()) missing.push({date:`${dStr} (${cd.toLocaleDateString('en-US',{weekday:'short'})})`,status:"Work Report"});
      }
      if (missing.length>0) showMissingPopup(missing);
    } catch(e) { console.error(e); }
  }

  function showMissingPopup(missingInfo) {
    if (document.getElementById('missingPopup')) return;
    const overlay=document.createElement('div'); overlay.id='missingPopup'; overlay.className='missing-modal-overlay';
    let listHtml=missingInfo.map(i=>`<div class="bg-slate-800/50 p-3 rounded-xl border border-slate-700/50 mb-2 flex justify-between items-center"><div class="text-left"><p class="text-[10px] font-black text-slate-500 uppercase tracking-tighter">${i.date}</p><p class="text-rose-400 font-mono text-xs font-black uppercase">Missing: <span class="text-white">${i.status}</span></p></div><div class="w-1.5 h-1.5 rounded-full bg-rose-500 animate-pulse"></div></div>`).join('');
    overlay.innerHTML=`<div class="missing-modal text-center"><div class="w-16 h-16 bg-rose-500/10 rounded-full flex items-center justify-center mx-auto mb-4 border border-rose-500/20"><span class="text-2xl">✍️</span></div><h3 class="text-xl font-black text-white mb-2 uppercase tracking-tight italic">Missing Report</h3><p class="text-slate-400 text-[10px] mb-2 font-bold leading-tight uppercase">Daily Work Report is not submitted:</p><div class="flex items-center gap-2 mb-6"><span class="bg-rose-500 text-white text-[9px] px-2 py-0.5 rounded font-black animate-blink shrink-0">REQUIRED</span><span class="text-[10px] text-slate-500 font-bold tracking-tight flex-grow text-left">Please complete your work reports for the dates below</span></div><div class="max-h-[200px] overflow-y-auto no-scrollbar mb-6 px-1">${listHtml}</div><div class="space-y-3"><button onclick="document.getElementById('missingPopup').remove()" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-black py-4 rounded-2xl transition-all active:scale-95 shadow-xl shadow-rose-900/20 uppercase tracking-widest text-xs">I will write it now</button><button onclick="hidePopupToday()" class="w-full text-slate-500 hover:text-slate-300 text-[10px] font-bold uppercase tracking-widest transition-colors">Don't show this again today</button></div></div>`;
    document.body.appendChild(overlay);
  }

  window.hidePopupToday = function() {
    localStorage.setItem('hideReportPopup', getJakartaDate().toISOString().split('T')[0]);
    const p=document.getElementById('missingPopup'); if(p) p.remove();
  };

  document.addEventListener('DOMContentLoaded', ()=>{
    setTimeout(()=>{ if(typeof showFortune==='function') showFortune(); checkMissingRecords(); }, 800);
  });

  renderCalendar();

  /* ── Page Cleanup ── */
  const prevCleanup2 = window._leavePageCleanup;
  window._leavePageCleanup = function() {
    clearInterval(liveTimeTimer);
    clearInterval(lateWarnTimer);
    db.ref(`attendance/${todayStr}`).off();
    db.ref('attendance').off();
    db.ref('settings/config').off();
    db.ref('settings/config/stdAttendance').off();
    if (leaveStatusRef) { leaveStatusRef.off(); leaveStatusRef=null; }
    if (typeof prevCleanup2 === 'function') prevCleanup2();
  };

})();

/* Safety stub */
window.setKpi = window.setKpi || function(...args) {
  console.log("setKpi stub called", args);
};
</script>
