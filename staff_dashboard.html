<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />

<style>
/* ══════════════════════════════════════════════════════════
   STAFF DASHBOARD v2 — compact dark command-center layout
   Top   : identity · KPIs · calendar · today's roster
   Bottom: sticky check-in / check-out dock
   All colours come from the --t-* tokens injected per weekday.
══════════════════════════════════════════════════════════ */
:root {
  --t-bg:#040810; --t-surface:#080f1e; --t-surface2:#0d1628; --t-surface3:#111e33;
  --t-border:rgba(255,255,255,0.06); --t-border2:rgba(255,255,255,0.12);
  --t-text:#f1f5f9; --t-muted:#64748b; --t-dim:#1e293b;
  --t-accent:#3b82f6; --t-accent2:#06b6d4; --t-accent-glow:rgba(59,130,246,0.18);
  --t-accent-gradient:linear-gradient(90deg,#3b82f6,#06b6d4);
  --t-green:#10b981; --t-green-dim:rgba(16,185,129,0.12);
  --t-red:#f43f5e;   --t-red-dim:rgba(244,63,94,0.12);
  --t-amber:#f59e0b; --t-amber-dim:rgba(245,158,11,0.12);
  --t-cyan:#06b6d4;
  --t-card-shine:rgba(255,255,255,0.05);
  --t-card-bevel:linear-gradient(90deg,transparent,rgba(99,179,237,0.28),transparent);
  --t-card-radius:16px;
  --t-font-display:'Pretendard',sans-serif; --t-font-ui:'Pretendard',sans-serif;
  --t-font-mono:'SF Mono','Fira Code',ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--t-dim);border-radius:10px}
.no-scrollbar::-webkit-scrollbar{display:none}
.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}

/* ── Wrapper + decorative creature (kept, but quieter) ── */
.sm-dashboard-wrap{position:relative}
.bg-creature{position:fixed;top:0;left:0;width:clamp(200px,28vw,380px);height:auto;z-index:0;pointer-events:none;opacity:.14;will-change:transform;animation:creatureRoamMon 26s ease-in-out infinite}
.bg-creature.second{width:clamp(130px,16vw,230px);opacity:.09;animation-direction:reverse;display:none}
@media(min-width:768px){.bg-creature.second{display:block}}
@media(max-width:479px){.bg-creature{width:clamp(150px,42vw,240px);opacity:.1}}
.sm-dashboard-wrap.anim-paused .bg-creature,
.sm-dashboard-wrap.anim-paused .fortune-bubble,
.sm-dashboard-wrap.anim-paused .warning-pulse,
.sm-dashboard-wrap.anim-paused .animate-blink,
.sm-dashboard-wrap.anim-paused .animate-pulse-slow,
.sm-dashboard-wrap.anim-paused .live-dot{animation-play-state:paused!important}

@keyframes creatureRoamMon {
  0%   { transform: translate(-6vw, 65vh) rotate(-4deg) scale(1); }
  20%  { transform: translate(55vw, 10vh) rotate(3deg) scale(1.05); }
  40%  { transform: translate(85vw, 55vh) rotate(-2deg) scale(0.96); }
  50%  { transform: translate(85vw, 55vh) rotate(-2deg) scale(0.96) scaleX(-1); }
  70%  { transform: translate(40vw, 78vh) rotate(4deg) scale(1.02) scaleX(-1); }
  90%  { transform: translate(0vw, 30vh) rotate(-3deg) scale(1) scaleX(-1); }
  100% { transform: translate(-6vw, 65vh) rotate(-4deg) scale(1); }
}
@keyframes creatureRoamTue {
  0%, 100% { transform: translate(4vw, 60vh) rotate(0deg) scale(1); }
  25%      { transform: translate(60vw, 20vh) rotate(3deg) scale(1.06); }
  50%      { transform: translate(30vw, 70vh) rotate(-2deg) scale(0.95); }
  75%      { transform: translate(75vw, 45vh) rotate(2deg) scale(1.03); }
}
@keyframes creatureRoamWed {
  0%    { transform: translate(-8vw, 20vh) rotate(-6deg) scale(1); }
  49%   { transform: translate(78vw, 60vh) rotate(4deg) scale(1.04); }
  50%   { transform: translate(78vw, 60vh) rotate(4deg) scale(1.04) scaleX(-1); }
  99%   { transform: translate(-8vw, 20vh) rotate(-6deg) scale(1) scaleX(-1); }
  100%  { transform: translate(-8vw, 20vh) rotate(-6deg) scale(1); }
}
@keyframes creatureRoamThu {
  0%   { transform: translate(0vw, 66vh) rotate(-2deg) scale(1); }
  10%  { transform: translate(12vw, 46vh) rotate(2deg) scale(1.02); }
  20%  { transform: translate(24vw, 66vh) rotate(-2deg) scale(1); }
  30%  { transform: translate(38vw, 40vh) rotate(2deg) scale(1.03); }
  40%  { transform: translate(52vw, 66vh) rotate(-2deg) scale(1); }
  50%  { transform: translate(66vw, 36vh) rotate(2deg) scale(1.04) scaleX(-1); }
  60%  { transform: translate(52vw, 66vh) rotate(-2deg) scale(1) scaleX(-1); }
  70%  { transform: translate(38vw, 40vh) rotate(2deg) scale(1.03) scaleX(-1); }
  80%  { transform: translate(24vw, 66vh) rotate(-2deg) scale(1) scaleX(-1); }
  90%  { transform: translate(12vw, 46vh) rotate(2deg) scale(1.02) scaleX(-1); }
  100% { transform: translate(0vw, 66vh) rotate(-2deg) scale(1); }
}
@keyframes creatureRoamFri {
  0%   { transform: translate(-4vw, 30vh) rotate(-8deg) scale(1); }
  20%  { transform: translate(48vw, 8vh) rotate(10deg) scale(1.08); }
  40%  { transform: translate(20vw, 55vh) rotate(-10deg) scale(0.95); }
  50%  { transform: translate(72vw, 20vh) rotate(8deg) scale(1.06) scaleX(-1); }
  70%  { transform: translate(50vw, 68vh) rotate(-8deg) scale(1) scaleX(-1); }
  90%  { transform: translate(10vw, 42vh) rotate(6deg) scale(1.03) scaleX(-1); }
  100% { transform: translate(-4vw, 30vh) rotate(-8deg) scale(1); }
}
@keyframes creatureRoamSat {
  0%    { transform: translate(-6vw, 50vh) rotate(0deg) scale(1); }
  49%   { transform: translate(88vw, 25vh) rotate(0deg) scale(1.05); }
  50%   { transform: translate(88vw, 25vh) rotate(0deg) scale(1.05) scaleX(-1); }
  99%   { transform: translate(-6vw, 50vh) rotate(0deg) scale(1) scaleX(-1); }
  100%  { transform: translate(-6vw, 50vh) rotate(0deg) scale(1); }
}
@keyframes creatureRoamSun {
  0%   { transform: translate(10vw, 70vh) rotate(-4deg) scale(1); opacity: 0.32; }
  50%  { transform: translate(60vw, 12vh) rotate(4deg) scale(1.12); opacity: 0.42; }
  100% { transform: translate(10vw, 70vh) rotate(-4deg) scale(1); opacity: 0.32; }
}
.theme-day-1 .bg-creature { animation-name: creatureRoamMon; animation-duration: 28s; filter: drop-shadow(0 0 20px rgba(56,189,248,0.55)) drop-shadow(0 0 34px rgba(129,140,248,0.3)); }
.theme-day-2 .bg-creature { animation-name: creatureRoamTue; animation-duration: 32s; filter: drop-shadow(0 0 18px rgba(212,180,131,0.5))  drop-shadow(0 0 30px rgba(138,106,62,0.28)); }
.theme-day-3 .bg-creature { animation-name: creatureRoamWed; animation-duration: 26s; filter: drop-shadow(0 0 18px rgba(200,168,75,0.5))  drop-shadow(0 0 30px rgba(232,212,138,0.28)); }
.theme-day-4 .bg-creature { animation-name: creatureRoamThu; animation-duration: 20s; filter: drop-shadow(0 0 18px rgba(111,191,95,0.5))  drop-shadow(0 0 30px rgba(217,154,91,0.28)); }
.theme-day-5 .bg-creature { animation-name: creatureRoamFri; animation-duration: 16s; filter: drop-shadow(0 0 24px rgba(255,0,204,0.55)) drop-shadow(0 0 38px rgba(0,238,255,0.35)); }
.theme-day-6 .bg-creature { animation-name: creatureRoamSat; animation-duration: 22s; filter: drop-shadow(0 0 20px rgba(96,165,250,0.55)) drop-shadow(0 0 32px rgba(165,200,255,0.3)); }
.theme-day-0 .bg-creature { animation-name: creatureRoamSun; animation-duration: 26s; filter: drop-shadow(0 0 22px rgba(249,115,22,0.55)) drop-shadow(0 0 36px rgba(190,24,93,0.3)); }



/* ══════════════════════════════════════════════════════════
   LAYOUT
══════════════════════════════════════════════════════════ */
.sm-root{position:relative;z-index:1;font-family:var(--t-font-ui);color:var(--t-text);
  display:flex;flex-direction:column;gap:clamp(.6rem,1.6vw,.9rem);
  max-width:1400px;margin:0 auto;padding-bottom:6px}

.dcard{position:relative;background:linear-gradient(160deg,var(--t-surface2),var(--t-surface));
  border:1px solid var(--t-border);border-top-color:var(--t-border2);border-radius:var(--t-card-radius);
  box-shadow:inset 0 1px 0 var(--t-card-shine),0 8px 24px rgba(0,0,0,.35)}
.dlabel{font-size:10px;font-weight:800;color:var(--t-muted);text-transform:uppercase;letter-spacing:.12em;font-family:var(--t-font-ui)}

/* ══════════════════════════════════════════════════════════
   1) TOP BAR : identity · fortune · date
══════════════════════════════════════════════════════════ */
.dash-top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:12px 16px;overflow:hidden}
.dash-top::before{content:'';position:absolute;top:0;left:12%;right:12%;height:1px;background:var(--t-card-bevel)}
.dash-id{display:flex;align-items:center;gap:12px;min-width:0}
.live-dot{width:9px;height:9px;border-radius:50%;background:var(--t-green);box-shadow:0 0 0 0 rgba(16,185,129,.55);animation:livePing 2s infinite;flex-shrink:0}
@keyframes livePing{0%{box-shadow:0 0 0 0 rgba(16,185,129,.55)}70%{box-shadow:0 0 0 9px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
.sm-hero-label{font-size:9px;font-weight:800;color:var(--t-muted);text-transform:uppercase;letter-spacing:.14em}
.sm-hero-name{font-size:clamp(17px,4.4vw,24px);font-weight:900;letter-spacing:-.02em;line-height:1.1;margin-top:2px;font-family:var(--t-font-display);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
#fortuneArea{min-width:0;display:flex;justify-content:center}
.fortune-bubble{display:block;max-width:100%;padding:7px 14px;background:rgba(255,255,255,.03);border:1px solid var(--t-border);border-radius:999px;
  font-size:11px;color:var(--t-muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:floatBubble 4s ease-in-out infinite}
@keyframes floatBubble{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.sm-live-date{font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--t-accent);background:var(--t-accent-glow);
  border:1px solid color-mix(in srgb,var(--t-accent) 35%,transparent);padding:6px 12px;border-radius:10px;white-space:nowrap}
@media(max-width:700px){
  .dash-top{grid-template-columns:1fr auto;padding:11px 13px}
  #fortuneArea{grid-column:1 / -1;order:3;justify-content:flex-start}
  .sm-hero-name{max-width:56vw}
}

/* ── Leave alert (JS toggles .visible) ── */
#leaveStatusAlert{display:none}
#leaveStatusAlert.visible{display:block}
.sm-leave-alert{border-radius:14px;padding:11px 14px;display:flex;align-items:center;gap:10px}
.sm-leave-alert.pending{background:linear-gradient(135deg,var(--t-amber-dim),rgba(245,158,11,.04));border:1px solid rgba(245,158,11,.35)}
.sm-leave-alert.rejected{background:linear-gradient(135deg,var(--t-red-dim),rgba(244,63,94,.04));border:1px solid rgba(244,63,94,.35)}
.sm-leave-alert-icon{font-size:18px;flex-shrink:0}
.sm-leave-alert-title{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}
.sm-leave-alert-title.pending{color:var(--t-amber)}
.sm-leave-alert-title.rejected{color:var(--t-red)}
.sm-leave-alert-msg{font-size:11px;color:var(--t-text);font-weight:600;margin-top:2px}
.sm-leave-alert-close{margin-left:auto;color:var(--t-muted);cursor:pointer;font-size:20px;line-height:1;flex-shrink:0;transition:color .2s}
.sm-leave-alert-close:hover{color:var(--t-text)}

/* ══════════════════════════════════════════════════════════
   2) KPI STRIP : today in/out + month summary
══════════════════════════════════════════════════════════ */
.kpi-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(.5rem,1.4vw,.8rem)}
.kpi{padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi-val{font-size:clamp(22px,3.2vw,30px);font-weight:900;letter-spacing:-.02em;line-height:1;font-family:var(--t-font-display);font-variant-numeric:tabular-nums}
.kpi.in  .kpi-val{color:var(--t-green)}
.kpi.out .kpi-val{color:var(--t-accent)}
.kpi.in  {border-left:3px solid var(--t-green)}
.kpi.out {border-left:3px solid var(--t-accent)}
.kpi.p   .kpi-val{color:var(--t-green)}
.kpi.l   .kpi-val{color:var(--t-red)}
.kpi.v   .kpi-val{color:var(--t-amber)}
.kpi-head{display:flex;justify-content:space-between;align-items:center;gap:6px}
.kpi.rate{grid-column:span 1}
.sm-bar{width:100%;height:5px;background:var(--t-dim);border-radius:10px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.sm-bar-fill{height:100%;background:var(--t-accent);border-radius:10px;transition:width 1s ease}
.sm-bar-fill.warning{background:var(--t-red)}
.kpi-sub{display:flex;justify-content:space-between;gap:6px;font-size:9px;font-weight:700;color:var(--t-muted);font-variant-numeric:tabular-nums}
.sm-month-tag{font-size:10px;font-weight:900;color:var(--t-accent);letter-spacing:.06em}
#warningIcon{display:none}#warningIcon.visible{display:inline}
@media(max-width:900px){.kpi-row{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:480px){.kpi{padding:10px 11px}.kpi-row{gap:.45rem}}

/* ══════════════════════════════════════════════════════════
   3) BODY : calendar + today's roster
══════════════════════════════════════════════════════════ */
.dash-body{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:clamp(.6rem,1.6vw,.9rem);align-items:start}
@media(max-width:1000px){.dash-body{grid-template-columns:1fr}}

.sm-cal-card{padding:clamp(12px,2.4vw,18px)}
.sm-cal-card::before{content:'';position:absolute;top:0;left:10%;right:10%;height:1px;background:var(--t-card-bevel)}
.sm-cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.sm-cal-title{font-size:clamp(14px,3.4vw,18px);font-weight:900;letter-spacing:.02em;font-family:var(--t-font-display);
  padding-left:10px;border-left:3px solid var(--t-accent)}
.sm-cal-nav{display:flex;background:var(--t-surface3);border:1px solid var(--t-border);border-radius:10px;overflow:hidden}
.sm-nav-btn{padding:7px 14px;font-size:10px;font-weight:900;color:var(--t-muted);background:none;border:none;cursor:pointer;
  font-family:var(--t-font-mono);letter-spacing:.06em;transition:color .15s,background .15s}
.sm-nav-btn+.sm-nav-btn{border-left:1px solid var(--t-border)}
@media(hover:hover){.sm-nav-btn:hover{color:var(--t-text);background:color-mix(in srgb,var(--t-accent) 14%,transparent)}}
.sm-nav-btn.today-btn{color:var(--t-accent)}

.sm-cal-table{width:100%;border-collapse:separate;border-spacing:3px;table-layout:fixed}
.sm-cal-table th{padding:6px 2px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--t-muted);text-align:center}
.sm-cal-table th.sun{color:rgba(244,63,94,.85)}
.sm-cal-table th.sat{color:color-mix(in srgb,var(--t-accent) 85%,white)}
.sm-cal-table td{height:clamp(56px,7.4vw,78px);vertical-align:top;padding:5px;border:1px solid var(--t-border);border-radius:9px;cursor:pointer;
  background:color-mix(in srgb,var(--t-surface3) 70%,transparent);transition:background .15s,border-color .15s,transform .15s}
@media(hover:hover){.sm-cal-table td:hover{background:color-mix(in srgb,var(--t-accent) 12%,var(--t-surface3));border-color:color-mix(in srgb,var(--t-accent) 40%,transparent);transform:translateY(-1px)}}
.sm-cal-table td.sun-cell{background:linear-gradient(145deg,rgba(244,63,94,.05),var(--t-surface2))}
.sm-cal-table td.sat-cell{background:linear-gradient(145deg,color-mix(in srgb,var(--t-accent) 7%,transparent),var(--t-surface2))}
.sm-cal-table td.today-highlight{background:linear-gradient(145deg,color-mix(in srgb,var(--t-accent) 18%,transparent),color-mix(in srgb,var(--t-accent2) 8%,transparent))!important;
  border-color:color-mix(in srgb,var(--t-accent) 60%,transparent)!important;box-shadow:0 0 0 1px color-mix(in srgb,var(--t-accent) 25%,transparent),0 4px 14px var(--t-accent-glow)}
.sm-cal-table col.weekend{width:8%}
.sm-cal-table col.weekday{width:calc((100% - 16%)/5)}
.sm-cal-date{font-size:11px;font-weight:900;color:var(--t-muted);margin-bottom:2px;padding:1px 2px}
.sm-cal-date.sun{color:rgba(244,63,94,.75)}
.sm-cal-date.sat{color:color-mix(in srgb,var(--t-accent) 70%,white)}
.sm-cal-date.today{color:var(--t-accent);font-size:12px}
.time-label{display:block;font-size:9px;font-weight:900;padding:1px 3px;margin-top:2px;border-radius:4px;text-align:center;font-family:var(--t-font-mono);letter-spacing:-.03em;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-color{background:rgba(16,185,129,.14);color:#10b981;border:1px solid rgba(16,185,129,.22)}
.late-color{background:rgba(244,63,94,.14);color:#f43f5e;border:1px solid rgba(244,63,94,.22)}
.other-color{background:rgba(245,158,11,.14);color:#f59e0b;border:1px solid rgba(245,158,11,.22)}
.out-time{background:rgba(100,116,139,.1);color:#94a3b8;border:1px solid rgba(100,116,139,.18)}
@media(max-width:480px){.sm-cal-table{border-spacing:2px}.sm-cal-table td{height:48px;padding:2px}.sm-cal-table th{font-size:8px}.time-label{font-size:6.5px;padding:0 1px}.sm-cal-date{font-size:9px}}

/* ── Today's roster ── */
.roster{padding:14px 14px 12px;display:flex;flex-direction:column;min-height:0}
.roster-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sm-all-staff-count{font-size:12px;font-weight:900;color:var(--t-accent);background:var(--t-accent-glow);padding:2px 10px;border-radius:999px;font-family:var(--t-font-display)}
#allStaffList{display:flex;flex-direction:column;gap:5px;max-height:min(440px,52vh);overflow-y:auto}
@media(max-width:1000px){#allStaffList{max-height:230px}}
.staff-row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--t-surface3);border:1px solid var(--t-border);border-radius:9px;padding:8px 10px;transition:border-color .18s,background .18s}
@media(hover:hover){.staff-row:hover{border-color:var(--t-accent);background:color-mix(in srgb,var(--t-accent) 8%,var(--t-surface3))}}
.staff-name{font-size:11px;font-weight:800;color:var(--t-text);text-transform:uppercase;letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.staff-time{font-size:10px;font-weight:800;font-family:var(--t-font-mono);padding:2px 7px;border-radius:5px}
.staff-time.present{color:var(--t-green);background:var(--t-green-dim);border:1px solid rgba(16,185,129,.22)}
.staff-time.late{color:var(--t-red);background:var(--t-red-dim);border:1px solid rgba(244,63,94,.22)}

/* ══════════════════════════════════════════════════════════
   4) BOTTOM DOCK : check-in / check-out  (sticky, high visibility)
══════════════════════════════════════════════════════════ */
.att-dock{position:sticky;bottom:10px;z-index:20;padding:14px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--t-surface2) 92%,transparent),color-mix(in srgb,var(--t-surface) 96%,transparent));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--t-border2);box-shadow:0 -6px 40px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.4),0 0 0 1px var(--t-accent-glow)}
.att-dock::before{content:'';position:absolute;top:0;left:8%;right:8%;height:2px;background:var(--t-accent-gradient);border-radius:2px;opacity:.9}
.dock-grid{display:grid;grid-template-columns:minmax(200px,1.1fr) minmax(170px,.8fr) minmax(0,2.2fr) auto;gap:12px;align-items:stretch}
.dock-field{display:flex;flex-direction:column;gap:5px;min-width:0}
.dock-field .dlabel{display:flex;justify-content:space-between;gap:6px}
.dock-field .dlabel b{color:var(--t-accent);font-weight:900;letter-spacing:.04em}

.sm-time-input{width:100%;height:60px;background:#03070f;color:var(--t-text);font-size:clamp(24px,3.4vw,32px);font-weight:900;text-align:center;
  letter-spacing:.06em;padding:0 8px;border-radius:12px;border:1px solid var(--t-border2);outline:none;font-family:var(--t-font-mono);font-variant-numeric:tabular-nums;
  transition:border-color .2s,box-shadow .2s;box-shadow:inset 0 2px 8px rgba(0,0,0,.5)}
.sm-time-input:focus{border-color:var(--t-accent);box-shadow:inset 0 2px 8px rgba(0,0,0,.5),0 0 0 3px var(--t-accent-glow)}

      '--t-card-face':   'linear-gradient(155deg,rgba(188,213,250,0.1) 0%,transparent 55%)',
      '--t-card-radius': '16px',
      '--t-card-shadow-near': 'rgba(0,0,0,0.28)',
      '--t-card-shadow-far':  'rgba(10,30,80,0.38)',
      '--t-font-display': "'Inter', sans-serif",
      '--t-font-ui':      "'Inter', sans-serif",
    },
  };

  /* ?day=0..6 lets you preview any theme without redeploying,
     e.g. loading this dashboard tab with ?day=5 in the URL shows
     Friday's theme. Falls back to the real current day otherwise. */
  const _dayParam = new URLSearchParams(window.location.search).get('day');
  const idx = (_dayParam !== null && /^[0-6]$/.test(_dayParam)) ? Number(_dayParam) : new Date().getDay();

  const tokens = THEMES[idx] || THEMES[1];
  const root = document.documentElement;
  for (const [k, v] of Object.entries(tokens)) root.style.setProperty(k, v);

  /* Expose day index for JS below */
  window._dashDayIdx = idx;
})();
</script>

(function () {
  const user = sessionStorage.getItem('loggedInUser');
  const db = firebase.database();
  let leaveStatusRef = null;

  /* Welcome */
  const welcomeMsg = document.getElementById('mainWelcomeMsg');
  if (welcomeMsg) {
    welcomeMsg.innerText = user || '—';
    db.ref(`users/${user}/displayName`).once('value', snap => {
      welcomeMsg.innerText = snap.val() || user || '—';
    });
  }

  if (user) { checkLeaveStatus(user); autoFillYesterdayLeave(user); }

  let now = getJakartaDate();
  let viewDate = new Date(now);
  const y = now.getFullYear(), m = String(now.getMonth()+1).padStart(2,'0'), d = String(now.getDate()).padStart(2,'0');
  const todayStr = `${y}-${m}-${d}`;
  let standardTime = "", hasCheckedMissing = false;
  const btnIn = document.getElementById('btnIn');
  const timeInput = document.getElementById('manualTime');

  /* Live date label */
  const liveDate = document.getElementById('liveDate');
  if (liveDate) liveDate.innerText = now.toLocaleDateString('en-US',{month:'short',day:'numeric',weekday:'short',timeZone:'Asia/Jakarta'}).toUpperCase();

  /* ── Today In/Out ── */
  function updateTodayStrip(data) {
    const inEl  = document.getElementById('todayInDisplay');
    const outEl = document.getElementById('todayOutDisplay');
    if (!inEl || !outEl) return;
    const rec = data && data[user] ? data[user] : null;
    if (!rec) { inEl.textContent = '—'; outEl.textContent = '—'; return; }
    if (typeof rec === 'string') { inEl.textContent = rec; outEl.textContent = '—'; return; }
    if (rec.attend) {
      const mt = rec.attend.match(/\d{1,2}:\d{2}/);
      const prefix = rec.attend.includes('LATE') ? '⚠ ' : '';
      inEl.textContent = prefix + (mt ? mt[0] : rec.attend);
      inEl.style.color = rec.attend.includes('LATE') ? 'var(--t-red)' : 'var(--t-green)';
    } else { inEl.textContent = '—'; }
    if (rec.leave) {
      const ml = rec.leave.match(/\d{1,2}:\d{2}/);
      outEl.textContent = ml ? ml[0] : rec.leave;
    } else { outEl.textContent = '—'; }
  }

  db.ref(`attendance/${todayStr}`).on('value', snap => {
    if (!document.getElementById('todayInDisplay')) { db.ref(`attendance/${todayStr}`).off(); return; }
    updateTodayStrip(snap.val());
  });

  /* ── Leave status ── */
  function checkLeaveStatus(uid) {
    leaveStatusRef = db.ref(`leaves/${uid}/${new Date().getFullYear()}`);
    leaveStatusRef.on('value', snap => {
      const alertDiv = document.getElementById('leaveStatusAlert');
      if (!alertDiv) { leaveStatusRef.off(); return; }
      const content = document.getElementById('leaveAlertContent');
      const icon    = document.getElementById('leaveAlertIcon');
      const title   = document.getElementById('leaveAlertTitle');
      const msg     = document.getElementById('leaveAlertMsg');
      if (!content || !icon || !title || !msg) { leaveStatusRef.off(); return; }
      const leaves = snap.val(); if (!leaves) return;
      const target = Object.values(leaves).find(l => l.status === 'Pending' || l.status === 'Rejected');
      if (target) {
        alertDiv.classList.add('visible');
        if (target.status === 'Pending') {
          content.className = 'sm-leave-alert pending animate-pulse-slow';
          icon.innerText = '⏳'; title.className = 'sm-leave-alert-title pending'; title.innerText = 'Leave Request Pending';
          msg.innerText = `${target.type} (${target.startDate}) awaiting approval.`;
        } else {
          content.className = 'sm-leave-alert rejected';
          icon.innerText = '🚫'; title.className = 'sm-leave-alert-title rejected'; title.innerText = 'Leave Request Rejected';
          msg.innerText = `${target.type} was rejected. Check admin memo.`;
        }
      } else { alertDiv.classList.remove('visible'); }
    });
  }

  /* ── Auto-fill yesterday leave ── */
  function autoFillYesterdayLeave(uid) {
    const now = getJakartaDate(), dow = now.getDay();
    const target = getJakartaDate();
    if (dow === 1) target.setDate(now.getDate()-3); else target.setDate(now.getDate()-1);
    const ty=target.getFullYear(), tm=String(target.getMonth()+1).padStart(2,'0'), td=String(target.getDate()).padStart(2,'0');
    const tStr=`${ty}-${tm}-${td}`, tdow=target.getDay();
    if (tdow===0||tdow===6) return;
    db.ref('settings/config/autoLeave').once('value', cs => {
      const autoLeaveTime = cs.val()||"18:00";
      db.ref('attendance/'+tStr).once('value', snap => {
        const all=snap.val(); if (!all) return;
        const my=all[uid];
        if (my&&typeof my==='object'&&my.attend&&!my.leave) {
          db.ref(`attendance/${tStr}/${uid}`).update({leave:autoLeaveTime}).then(()=>{ if(typeof renderCalendar==='function') renderCalendar(); });
        }
      });

    const [sH, sM] = standardTime.split(':').map(Number);

        let finalVal=storageTime;
        if (type==='attend') {
          if (!standardTime) { alert("Standard time is loading..."); btn.disabled=false; btn.style.opacity="1"; return; }
          if (warnFlag==="off") { finalVal=`ATT(${storageTime})`; }
          else { const [iH,iM]=storageTime.split(':').map(Number),[sH,sM]=standardTime.split(':').map(Number); finalVal=(iH*60+iM<=sH*60+sM)?`ATT(${storageTime})`:`LATE(${storageTime})`; }
        }

          db.ref('attendance/'+todayStr+'/'+user).update({[type]:finalVal})
          .then(()=>{ alert("Success!"); })
          .finally(()=>{ btn.disabled=false; btn.style.opacity="1"; });
        } else { btn.disabled=false; btn.style.opacity="1"; }
      });
    });

  /* ── Attendance Stats ── */
  function updateAttendanceStats(data) {
    const vy=viewDate.getFullYear(), vm=viewDate.getMonth()+1;
    let total=0,late=0,att=0,totalLeaveMins=0,leaveCnt=0;
    Object.keys(data).forEach(ds=>{
      const [yr,mo]=ds.split('-').map(Number);
      if (yr===vy&&mo===vm) {
        const rec=data[ds][user];
        if (rec&&typeof rec==='object'&&rec.attend) {
          total++; if(rec.attend.includes("LATE")) late++; else if(rec.attend.includes("ATT")) att++;
          if(rec.leave){const tm=rec.leave.match(/(\d{2}):(\d{2})/);if(tm){totalLeaveMins+=(parseInt(tm[1])*60+parseInt(tm[2]));leaveCnt++;}}
        }
      }
    });
    const ratio=total>0?Math.round((late/total)*100):0;
    const pct=document.getElementById('lateRatioPercent'),bar=document.getElementById('lateRatioBar'),card=document.getElementById('weeklySummaryCard'),status=document.getElementById('lateRatioStatus'),warnIcon=document.getElementById('warningIcon');
    if (pct) pct.innerText=`${ratio}%`;
    if (bar&&card&&status&&warnIcon) {
      bar.style.width=`${ratio}%`;
      if (ratio>=50) { bar.className="sm-bar-fill warning"; card.classList.add('warning-pulse'); status.innerText="Aku terlambat!"; status.className="sm-stats-status warning animate-blink"; if(pct){pct.classList.add('animate-blink','warning');} warnIcon.classList.add('visible'); }
      else { bar.className="sm-bar-fill"; card.classList.remove('warning-pulse'); status.innerText="GOOD STANDING"; status.className="sm-stats-status"; if(pct){pct.classList.remove('animate-blink','warning');} warnIcon.classList.remove('visible'); }
    }
    const sc=document.getElementById('statCounts'); if(sc) sc.innerText=`T:${total} | A:${att} | L:${late}`;
    const avg=document.getElementById('avgLeaveTime');
    if (avg) { if(leaveCnt>0){const a=Math.round(totalLeaveMins/leaveCnt);avg.innerText=`Avg Out: ${String(Math.floor(a/60)).padStart(2,'0')}:${String(a%60).padStart(2,'0')}`;}else avg.innerText="Avg Out: --:--"; }
  }

  /* ── Render Calendar ── */
  function renderCalendar() {
    const year=viewDate.getFullYear(), month=viewDate.getMonth();
    const firstDay=new Date(year,month,1).getDay(), lastDate=new Date(year,month+1,0).getDate();
    const mye=document.getElementById('currentMonthYear');
    if (mye) mye.innerText=viewDate.toLocaleString('en-US',{month:'long',year:'numeric'}).toUpperCase();
    db.ref('attendance').off();

    db.ref('attendance').on('value', snap => {
      const tbody=document.getElementById('calendarBody');
      if (!tbody) { db.ref('attendance').off(); return; }
      const data=snap.val()||{};
      updateAttendanceStats(data);
      updateMonthSummary(data);
      updateAllStaffToday();
      if (!hasCheckedMissing) { checkMissingRecords(data); hasCheckedMissing=true; }

      tbody.innerHTML=''; let dc=1;
      for (let i=0;i<6;i++) {
        let row=document.createElement('tr');
        for (let j=0;j<7;j++) {
          let cell=document.createElement('td');
          if (i===0&&j<firstDay||dc>lastDate) { row.appendChild(cell); continue; }
          const dStr=`${year}-${String(month+1).padStart(2,'0')}-${String(dc).padStart(2,'0')}`;
          const rec=data[dStr]?data[dStr][user]:null;
          if (j===0) cell.classList.add('sun-cell'); else if (j===6) cell.classList.add('sat-cell');
          if (dStr===todayStr) cell.classList.add('today-highlight');
          cell.style.cursor='pointer';
          cell.onclick=()=>openEditPopup(dStr,rec);
          const numCls=j===0?'sun':j===6?'sat':dStr===todayStr?'today':'';
          let content=`<div class="sm-cal-date ${numCls}">${dc}</div>`;
          if (rec) {
            if (typeof rec==='string') { content+=`<span class="time-label other-color">${rec}</span>`; }
            else {
              let at=rec.attend||"";
              if (at) { const am=at.match(/(\d{1,2}:\d{2})/),px=at.includes("LATE")?"LATE":"ATT",cl=at.includes("ATT")?"att-color":"late-color"; content+=`<span class="time-label ${cl}">☀${am?px+'('+am[1]+')':at}</span>`; }
              if (rec.leave) { const lm=rec.leave.match(/(\d{1,2}:\d{2})/); content+=`<span class="time-label out-time">🌙${lm?lm[1]:rec.leave}</span>`; }
            }
          }
          cell.innerHTML=content; row.appendChild(cell); dc++;
        }
        tbody.appendChild(row); if (dc>lastDate) break;
      }
    });
  }

  /* ── Month Summary ── */
  function updateMonthSummary(data) {
    const vy=viewDate.getFullYear(), vm=viewDate.getMonth();
    const monthStr=`${vy}-${String(vm+1).padStart(2,'0')}`;
    const leaveTypes=['PEL','ANL','HAL','SIL','SPL','WO'];
    let present=0,late=0,leave=0,workdays=0,totalInMins=0,inCount=0,totalOutMins=0,outCount=0;
    const lastDay=new Date(vy,vm+1,0).getDate();
    for (let d=1;d<=lastDay;d++) {
      const dow=new Date(vy,vm,d).getDay(); if (dow===0||dow===6) continue;
      const dStr=`${monthStr}-${String(d).padStart(2,'0')}`;
      const today=getJakartaDate().toISOString().split('T')[0]; if (dStr>today) continue;
      workdays++;
      const rec=data[dStr]?.[user]; if (!rec) continue;
      if (typeof rec==='string') { if(leaveTypes.includes(rec)) leave++; }
      else if (rec.attend) {
        if (leaveTypes.includes(rec.attend)) { leave++; continue; }
        present++; if (rec.attend.includes('LATE')) late++;
        const inMatch=rec.attend.match(/(\d{1,2}):(\d{2})/);
        if (inMatch) { totalInMins+=parseInt(inMatch[1])*60+parseInt(inMatch[2]); inCount++; }
        if (rec.leave) { const outMatch=rec.leave.match(/(\d{1,2}):(\d{2})/); if(outMatch){totalOutMins+=parseInt(outMatch[1])*60+parseInt(outMatch[2]);outCount++;} }
      }
    }
    const rate=workdays>0?Math.round((present/workdays)*100):0;
    const toTime=mins=>`${String(Math.floor(mins/60)).padStart(2,'0')}:${String(mins%60).padStart(2,'0')}`;
    const barColor=rate>=90?'var(--t-green)':rate>=70?'var(--t-amber)':'var(--t-red)';
    const el=id=>document.getElementById(id);
    if(el('sumPresent'))  el('sumPresent').innerText=present;
    if(el('sumLate'))     el('sumLate').innerText=late;
    if(el('sumLeave'))    el('sumLeave').innerText=leave;
    if(el('sumRatePct'))  el('sumRatePct').innerText=rate+'%';
    if(el('sumRateBar'))  { el('sumRateBar').style.width=rate+'%'; el('sumRateBar').style.background=barColor; }
    if(el('sumAvgIn'))    el('sumAvgIn').innerText=inCount>0?`Avg In: ${toTime(Math.round(totalInMins/inCount))}`:'Avg In: --:--';
    if(el('sumAvgOut'))   el('sumAvgOut').innerText=outCount>0?`Avg Out: ${toTime(Math.round(totalOutMins/outCount))}`:'Avg Out: --:--';
    const lbl=el('summaryMonthLabel'); if(lbl) lbl.innerText=viewDate.toLocaleString('en-US',{month:'short',year:'numeric'}).toUpperCase();
  }

  /* ── All-Staff Today ── */
  async function updateAllStaffToday() {
    const todayStr=getJakartaDate().toISOString().split('T')[0];
    const usersSnap=await db.ref('users').once('value');
    const allUsers=usersSnap.val()||{};
    const userList=Object.keys(allUsers).filter(uid=>allUsers[uid].role!=='admin');
    const attSnap=await db.ref(`attendance/${todayStr}`).once('value');
    const attData=attSnap.val()||{};
    const attendedStaff=[];
    userList.forEach(uid=>{
      const displayName=allUsers[uid].displayName||uid;
      const rec=attData[uid];
      if (rec&&typeof rec==='object'&&rec.attend) {
        const timeMatch=rec.attend.match(/(\d{1,2}:\d{2})/);
        const inTime=timeMatch?timeMatch[1]:'--:--';
        const isLate=rec.attend.includes('LATE');
        let outTime='--:--';
        if (rec.leave) { const outMatch=rec.leave.match(/(\d{1,2}:\d{2})/); outTime=outMatch?outMatch[1]:rec.leave; }
        attendedStaff.push({name:displayName,inTime,outTime,isLate});
      }
    });
    attendedStaff.sort((a,b)=>a.inTime.localeCompare(b.inTime));
    const rows=attendedStaff.map(s=>`<div class="staff-row">
      <span class="staff-name">${s.name}</span>
      <div style="display:flex;gap:4px;align-items:center;">
        <span class="staff-time ${s.isLate?'late':'present'}">${s.inTime}</span>
        <span style="font-size:7px;color:var(--t-muted);">→</span>
        <span class="staff-time" style="color:${s.outTime==='--:--'?'var(--t-muted)':'var(--t-accent)'};background:${s.outTime==='--:--'?'rgba(100,116,139,0.1)':'color-mix(in srgb,var(--t-accent) 14%,transparent)'};border:1px solid ${s.outTime==='--:--'?'rgba(100,116,139,0.15)':'color-mix(in srgb,var(--t-accent) 28%,transparent)'};">${s.outTime}</span>
      </div>
    </div>`);
    const listEl=document.getElementById('allStaffList'),countEl=document.getElementById('allStaffCount');
    if(listEl) listEl.innerHTML=rows.length>0?rows.join(''):'<div style="font-size:9px;color:var(--t-muted);text-align:center;padding:10px;">No attendance yet</div>';
    if(countEl) countEl.innerText=`${attendedStaff.length}`;
  }

/* ── 16시 이전 3D 출석 체크 확인 팝업 ── */
  function autoCheckInPrompt() {
    if (!user) return;

    const now = getJakartaDate();
    const currentHour = now.getHours();

    // 16시 이전인 경우에만 동작 (원하시는 시각 기준)
    if (currentHour < 16) {
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      const todayKey = `${y}-${m}-${d}`;

      // DB에서 오늘 출석(attend) 여부 조회
      db.ref(`attendance/${todayKey}/${user}/attend`).once('value', snap => {
        // 출석 기록이 존재하지 않는 경우에만 3D 팝업 띄우기
        if (!snap.val()) {
          setTimeout(show3DCheckInModal, 500);
        }
      });
    }
  }

  // 3D 팝업 생성 및 표시 함수
  function show3DCheckInModal() {
    if (document.getElementById('autoCheckInModal')) return;

    const overlay = document.createElement('div');
    overlay.id = 'autoCheckInModal';
    overlay.className = 'checkin-modal-overlay';

    overlay.innerHTML = `
      <div class="checkin-modal-card">
        <div class="checkin-icon-box">☀️</div>
        <h3 class="checkin-modal-title">Have a nice day!</h3>
        <p class="checkin-modal-msg">
          Have a great day today and please <b>CHECK IN</b> for attendance.
        </p>
        <div class="checkin-modal-btns">
          <button class="checkin-btn-cancel" onclick="closeCheckInModal()">Cancel</button>
          <button class="checkin-btn-confirm" onclick="confirmCheckInAction()">Check In Now</button>
        </div>
      </div>
    `;

    document.body.appendChild(overlay);
  }

  // [Cancel] 클릭 시
  window.closeCheckInModal = function() {
    const modal = document.getElementById('autoCheckInModal');
    if (modal) modal.remove();
  };

  // [Check In Now] 클릭 시
  window.confirmCheckInAction = function() {
    closeCheckInModal();
    if (typeof handleAttendance === 'function') {
      handleAttendance('attend');
    }
  };

  // 페이지 로딩 후 1초 뒤 자동 실행
  setTimeout(autoCheckInPrompt, 1000);


  /* ── Missing Records ── */
  async function checkMissingRecords() {
    if (!user) return;
    try {
      const uSnap=await db.ref(`users/${user}/WarnFlag`).once('value');
      if (uSnap.val()==="off") return;
      const ts=getJakartaDate().toISOString().split('T')[0];
      if (localStorage.getItem('hideReportPopup')===ts) return;
      const attSnap=await db.ref('attendance').once('value');
      const attData=attSnap.val()||{};
      const missing=[]; const today=getJakartaDate();
      for (let i=1;i<=6;i++) {
        const cd=new Date(today); cd.setDate(today.getDate()-i);
        const dw=cd.getDay(); if(dw===0||dw===6) continue;
        const cy=cd.getFullYear(),cm=String(cd.getMonth()+1).padStart(2,'0'),cdd=String(cd.getDate()).padStart(2,'0');
        const dStr=`${cy}-${cm}-${cdd}`;
        const attStatus=(attData[dStr]&&attData[dStr][user])?attData[dStr][user]:null;
        const leaveCodes=["ANL","PEL","HAL","SIL","SPL"];
        if (leaveCodes.includes(attStatus)) continue;
        const snap=await db.ref(`reports/${dStr}/${user}`).once('value');
        if (!snap.exists()) missing.push({date:`${dStr} (${cd.toLocaleDateString('en-US',{weekday:'short'})})`,status:"Work Report"});
      }
      if (missing.length>0) showMissingPopup(missing);
    } catch(e) { console.error(e); }
  }

  function showMissingPopup(missingInfo) {
    if (document.getElementById('missingPopup')) return;
    const overlay=document.createElement('div'); overlay.id='missingPopup'; overlay.className='missing-modal-overlay';
    let listHtml=missingInfo.map(i=>`<div class="bg-slate-800/50 p-3 rounded-xl border border-slate-700/50 mb-2 flex justify-between items-center"><div class="text-left"><p class="text-[10px] font-black text-slate-500 uppercase tracking-tighter">${i.date}</p><p class="text-rose-400 font-mono text-xs font-black uppercase">Missing: <span class="text-white">${i.status}</span></p></div><div class="w-1.5 h-1.5 rounded-full bg-rose-500 animate-pulse"></div></div>`).join('');
    overlay.innerHTML=`<div class="missing-modal text-center"><div class="w-16 h-16 bg-rose-500/10 rounded-full flex items-center justify-center mx-auto mb-4 border border-rose-500/20"><span class="text-2xl">✍️</span></div><h3 class="text-xl font-black text-white mb-2 uppercase tracking-tight italic">Missing Report</h3><p class="text-slate-400 text-[10px] mb-2 font-bold leading-tight uppercase">Daily Work Report is not submitted:</p><div class="flex items-center gap-2 mb-6"><span class="bg-rose-500 text-white text-[9px] px-2 py-0.5 rounded font-black animate-blink shrink-0">REQUIRED</span><span class="text-[10px] text-slate-500 font-bold tracking-tight flex-grow text-left">Please complete your work reports for the dates below</span></div><div class="max-h-[200px] overflow-y-auto no-scrollbar mb-6 px-1">${listHtml}</div><div class="space-y-3"><button onclick="document.getElementById('missingPopup').remove()" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-black py-4 rounded-2xl transition-all active:scale-95 shadow-xl shadow-rose-900/20 uppercase tracking-widest text-xs">I will write it now</button><button onclick="hidePopupToday()" class="w-full text-slate-500 hover:text-slate-300 text-[10px] font-bold uppercase tracking-widest transition-colors">Don't show this again today</button></div></div>`;
    document.body.appendChild(overlay);
  }

  window.hidePopupToday = function() {
    localStorage.setItem('hideReportPopup', getJakartaDate().toISOString().split('T')[0]);
    const p=document.getElementById('missingPopup'); if(p) p.remove();
  };

  document.addEventListener('DOMContentLoaded', ()=>{
    setTimeout(()=>{ if(typeof showFortune==='function') showFortune(); checkMissingRecords(); }, 800);
  });

  renderCalendar();

  /* ── Page Cleanup ── */
  const prevCleanup2 = window._leavePageCleanup;
  window._leavePageCleanup = function() {
    clearInterval(liveTimeTimer);
    clearInterval(lateWarnTimer);
    db.ref(`attendance/${todayStr}`).off();
    db.ref('attendance').off();
    db.ref('settings/config').off();
    db.ref('settings/config/stdAttendance').off();
    if (leaveStatusRef) { leaveStatusRef.off(); leaveStatusRef=null; }
    if (typeof prevCleanup2 === 'function') prevCleanup2();
  };

})();

/* Safety stub */
window.setKpi = window.setKpi || function(...args) {
  console.log("setKpi stub called", args);
};
</script>
