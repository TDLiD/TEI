<style>
/* ══════════════════════════════════════════
   STAFF CALENDAR — 3D DARK COCKPIT THEME
   Deep navy + violet command center
   Pretendard Font System
══════════════════════════════════════════ */

@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css');

:root {
    --bg:        #040810;
    --surface:   #080f1e;
    --surface2:  #0d1628;
    --surface3:  #111e33;
    --border:    rgba(255,255,255,0.06);
    --border2:   rgba(255,255,255,0.12);
    --text:      #f1f5f9;
    --muted:     #475569;
    --dim:       #1e293b;
    --violet:    #a855f7;
    --blue:      #3b82f6;
    --green:     #10b981;
    --red:       #f43f5e;
    --amber:     #f59e0b;
    --cyan:      #06b6d4;
}

*, *::before, *::after { 
    box-sizing: border-box; 
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif;
}

/* ── Calendar Table ── */
.schedule-cal {
    width: 100%;
    border-collapse: separate;
    border-spacing: 2px;
}
.schedule-cal th {
    padding: 10px 0;
    color: var(--muted);
    font-size: 8px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    border-bottom: 1px solid var(--border);
}
.schedule-cal th:first-child { color: rgba(244,63,94,0.8); text-shadow: 0 0 6px rgba(244,63,94,0.3); }
.schedule-cal th:last-child  { color: rgba(59,130,246,0.8);  text-shadow: 0 0 6px rgba(59,130,246,0.3); }

.schedule-cal td {
    position: relative;
    width: 14.28%;
    min-height: 120px;
    padding: 0;
    vertical-align: top;
    border: 1px solid rgba(15,25,45,0.9);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.18s cubic-bezier(0.23,1,0.32,1);
    background: linear-gradient(145deg, var(--surface3) 0%, var(--surface2) 100%);
    box-shadow: 0 1px 4px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.03);
}
.schedule-cal td:hover {
    background: linear-gradient(145deg, rgba(168,85,247,0.08) 0%, var(--surface2) 100%) !important;
    border-color: rgba(168,85,247,0.25) !important;
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 6px 18px rgba(168,85,247,0.12), inset 0 1px 0 rgba(255,255,255,0.06);
    z-index: 2;
}
.schedule-cal tr { min-height: 140px; }

/* Sun / Sat cell tint */
.schedule-cal tr td:first-child {
    background: linear-gradient(145deg, rgba(244,63,94,0.06), var(--surface2));
}
.schedule-cal tr td:last-child {
    background: linear-gradient(145deg, rgba(59,130,246,0.06), var(--surface2));
}
.schedule-cal td.today-highlight {
    background: linear-gradient(145deg, rgba(168,85,247,0.14), rgba(59,130,246,0.06)) !important;
    border-color: rgba(168,85,247,0.4) !important;
    box-shadow: 0 0 0 1px rgba(168,85,247,0.2), 0 4px 14px rgba(168,85,247,0.15) !important;
}

/* Drag over */
.schedule-cal td.drag-over {
    background: rgba(59,130,246,0.15) !important;
    outline: 2px dashed rgba(59,130,246,0.6);
    outline-offset: -2px;
}

/* ── Date text ── */
.date-wrapper {
    padding: 6px 8px;
    position: relative;
    z-index: 20;
    pointer-events: none;
}
.date-text {
    font-size: 10px;
    font-weight: 900;
    color: var(--muted);
    padding: 2px 5px;
    display: inline-block;
    min-width: 20px;
    text-align: center;
    border-radius: 6px;
    letter-spacing: -0.02em;
}
.date-text.is-today {
    background: linear-gradient(135deg, #a855f7, #7c3aed) !important;
    color: white !important;
    border-radius: 999px;
    box-shadow: 0 0 12px rgba(168,85,247,0.55), 0 2px 6px rgba(168,85,247,0.3);
    text-shadow: none;
}

/* ── Event items ── */
.event-item {
    position: absolute;
    z-index: 10;
    height: 22px;
    line-height: 22px;
    padding: 0 7px;
    border-radius: 6px;
    font-size: 10px;
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.2);
    transition: all 0.2s cubic-bezier(0.23,1,0.32,1);
}
.event-item:hover {
    filter: brightness(1.15);
    transform: translateY(-2px) scale(1.02);
    z-index: 20;
    box-shadow: 0 6px 16px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.25);
}
.event-item.dragging { opacity: 0.4; transform: scale(0.97); cursor: grabbing; }
.event-item.touch-ready {
    filter: brightness(1.5);
    box-shadow: 0 0 20px rgba(255,255,255,0.5);
    transform: scale(1.05);
}
.continued-from-prev { border-top-left-radius: 0; border-bottom-left-radius: 0; }
.continues-to-next   { border-top-right-radius: 0; border-bottom-right-radius: 0; }

.ev-title-text  { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.ev-author-text {
    font-size: 8px; opacity: 0.85;
    background: rgba(0,0,0,0.25);
    padding: 0 4px; border-radius: 4px;
    flex-shrink: 0;
}

/* ── Category colors (3D gradient) ── */
.bg-cat-default { background: linear-gradient(135deg, #3b82f6, #2563eb) !important; }
.bg-cat-vacation{ background: linear-gradient(135deg, #10b981, #059669) !important; }
.bg-cat-urgent  { background: linear-gradient(135deg, #ef4444, #dc2626) !important; }
.bg-cat-meeting { background: linear-gradient(135deg, #f59e0b, #d97706) !important; }
.bg-cat-admin   { background: linear-gradient(135deg, #a855f7, #7c3aed) !important; }

/* ── Stats bar ── */
.flex.gap-3.mb-4 > div {
    background: linear-gradient(145deg, var(--surface2), var(--surface)) !important;
    border: 1px solid var(--border) !important;
    border-top: 1px solid var(--border2) !important;
    border-radius: 12px !important;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 3px 10px rgba(0,0,0,0.3);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    padding: 8px 14px !important;
}
.flex.gap-3.mb-4 > div:hover {
    transform: translateY(-2px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.07), 0 8px 20px rgba(0,0,0,0.4);
}

/* ── Calendar wrapper card ── */
.bg-slate-950.rounded-\\[2rem\\] {
    background: linear-gradient(145deg, var(--surface2) 0%, var(--surface) 100%) !important;
    border: 1px solid var(--border) !important;
    border-top: 1px solid var(--border2) !important;
    border-radius: 22px !important;
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.06),
        0 16px 40px rgba(0,0,0,0.55),
        0 4px 12px rgba(0,0,0,0.3) !important;
    overflow: hidden;
    position: relative;
}
.bg-slate-950.rounded-\\[2rem\\]::before {
    content: '';
    position: absolute; top: 0; left: 10%; right: 10%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(168,85,247,0.25), rgba(59,130,246,0.2), transparent);
    pointer-events: none;
}

/* ── Upcoming list card ── */
.mt-6.bg-slate-950 {
    background: linear-gradient(145deg, var(--surface2) 0%, var(--surface) 100%) !important;
    border: 1px solid var(--border) !important;
    border-top: 1px solid var(--border2) !important;
    border-radius: 22px !important;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 8px 24px rgba(0,0,0,0.45) !important;
    position: relative;
}
.mt-6.bg-slate-950::before {
    content: '';
    position: absolute; top: 0; left: 15%; right: 15%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(59,130,246,0.2), transparent);
}

/* Upcoming items */
#upcomingList > div {
    background: linear-gradient(145deg, var(--surface3), var(--surface2)) !important;
    border: 1px solid var(--border) !important;
    border-radius: 12px !important;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.03);
    transition: all 0.2s ease !important;
}
#upcomingList > div:hover {
    border-color: rgba(168,85,247,0.3) !important;
    background: linear-gradient(145deg, rgba(168,85,247,0.06), var(--surface2)) !important;
    transform: translateX(4px);
    box-shadow: 0 4px 14px rgba(168,85,247,0.1), inset 0 1px 0 rgba(255,255,255,0.05) !important;
}

/* ── Page header ── */
.flex.justify-between.items-center.mb-8 h2 {
    font-weight: 900 !important;
    font-style: italic !important;
    letter-spacing: -0.02em !important;
    color: var(--text) !important;
    text-shadow: 0 0 24px rgba(168,85,247,0.2);
}

/* Nav buttons */
.flex.bg-slate-900.rounded-xl {
    background: linear-gradient(145deg, var(--surface3), var(--surface2)) !important;
    border: 1px solid var(--border) !important;
    border-radius: 12px !important;
    padding: 3px !important;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.04) !important;
}
.flex.bg-slate-900.rounded-xl button {
    font-size: 9px !important;
    font-weight: 900 !important;
    letter-spacing: 0.05em;
    border-radius: 8px !important;
    transition: all 0.15s;
    padding: 5px 10px !important;
}
.flex.bg-slate-900.rounded-xl button:hover {
    background: rgba(168,85,247,0.12) !important;
    color: #c084fc !important;
    box-shadow: 0 0 10px rgba(168,85,247,0.15);
}
.flex.bg-slate-900.rounded-xl .text-blue-500 {
    color: #c084fc !important;
    text-shadow: 0 0 8px rgba(168,85,247,0.4) !important;
}

/* ── Modal Input Fields (staff_report 스타일 적용) ── */
.modal-input,
#eventModal input[type="text"],
#eventModal input[type="date"],
#eventModal input[type="time"],
#eventModal select,
#eventModal textarea {
    width: 100%; 
    padding: 10px 12px;
    font-size: 12px !important; 
    color: var(--text) !important;
    background: rgba(4,8,16,0.8) !important;
    border: 1px solid var(--dim) !important;
    border-radius: 12px !important; 
    outline: none;
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif !important;
    transition: border-color 0.2s, box-shadow 0.2s !important;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.4) !important;
}
.modal-input:focus,
#eventModal input:focus,
#eventModal select:focus,
#eventModal textarea:focus {
    border-color: var(--violet) !important;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.4), 0 0 0 3px rgba(168,85,247,0.12) !important;
}

/* ── Modal ── */
#eventModal {
    background: rgba(0,0,0,0.88) !important;
    backdrop-filter: blur(12px) !important;
}
#eventModal > div {
    background: linear-gradient(145deg, #0d1628, #080f1e) !important;
    border: 1px solid rgba(255,255,255,0.07) !important;
    border-top: 1px solid rgba(255,255,255,0.13) !important;
    border-radius: 24px !important;
    box-shadow:
        0 40px 80px rgba(0,0,0,0.7),
        inset 0 1px 0 rgba(255,255,255,0.07) !important;
    animation: modalIn 0.35s cubic-bezier(0.23,1,0.32,1) both;
}
@keyframes modalIn {
    from { opacity:0; transform: scale(0.93) translateY(20px); }
    to   { opacity:1; transform: none; }
}
#eventModal label {
    font-size: 8px !important;
    letter-spacing: 0.12em !important;
    color: var(--muted) !important;
    text-transform: uppercase;
    font-weight: 700;
}
#eventModal #btnSave {
    background: linear-gradient(135deg, #a855f7, #7c3aed) !important;
    border-radius: 14px !important;
    font-weight: 900 !important;
    letter-spacing: 0.1em !important;
    box-shadow: 0 6px 20px rgba(168,85,247,0.4), inset 0 1px 0 rgba(255,255,255,0.2) !important;
    transition: all 0.2s ease !important;
    border: none !important;
}
#eventModal #btnSave:hover {
    background: linear-gradient(135deg, #c084fc, #a855f7) !important;
    box-shadow: 0 10px 28px rgba(168,85,247,0.55), inset 0 1px 0 rgba(255,255,255,0.25) !important;
    transform: translateY(-2px) !important;
}
#eventModal #btnDel {
    border-radius: 14px !important;
    font-weight: 900 !important;
    letter-spacing: 0.08em !important;
    background: rgba(244,63,94,0.1) !important;
    border: 1px solid rgba(244,63,94,0.25) !important;
    transition: all 0.2s !important;
}
#eventModal #btnDel:hover {
    background: rgba(244,63,94,0.2) !important;
    border-color: rgba(244,63,94,0.4) !important;
    transform: translateY(-1px) !important;
}
#eventModal h3 {
    font-weight: 900 !important;
    font-style: italic !important;
    letter-spacing: -0.01em !important;
    font-size: 16px !important;
    color: var(--text) !important;
    text-shadow: 0 0 16px rgba(168,85,247,0.2);
}
#eventModal .w-10.h-10 {
    background: rgba(255,255,255,0.05) !important;
    border: 1px solid var(--border) !important;
    transition: all 0.2s !important;
}
#eventModal .w-10.h-10:hover {
    background: rgba(244,63,94,0.15) !important;
    border-color: rgba(244,63,94,0.3) !important;
    color: white !important;
}

/* ── Flatpickr dark override ── */
.flatpickr-mobile { display: none !important; }
.flatpickr-calendar.static { position: absolute !important; top: 100% !important; }
.flatpickr-calendar {
    background: #0d1628 !important;
    border: 1px solid var(--border2) !important;
    border-radius: 14px !important;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6) !important;
}
.flatpickr-day.selected,
.flatpickr-day.selected:hover {
    background: var(--violet) !important;
    border-color: var(--violet) !important;
}

/* ── Scrollbar ── */
#upcomingList::-webkit-scrollbar { width: 3px; }
#upcomingList::-webkit-scrollbar-track { background: transparent; }
#upcomingList::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 10px; }

/* ── Animation ── */
.animate-fadeIn { animation: fadeIn 0.45s cubic-bezier(0.22,1,0.36,1) both; }
@keyframes fadeIn { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: none; } }
</style>

<script>
(function() {
    const db = firebase.database();
    const user = sessionStorage.getItem('loggedInUser');
    const userRole = sessionStorage.getItem('userRole');
    let calViewDate = new Date();
    let selectedId = null;
    let currentEventData = null;
    let startPicker, endPicker;
    let draggedId = null;
    let touchTimer = null;
    let holidayData = {}; 
    let googleApiKey = null; 

    const todayObj = new Date();
    const todayStr = `${todayObj.getFullYear()}-${String(todayObj.getMonth()+1).padStart(2,'0')}-${String(todayObj.getDate()).padStart(2,'0')}`;

    // 시스템 초기화
    async function initCalendarSystem() {
        try {
            const snapshot = await db.ref('settings/config/GoogleCAPI').once('value');
            googleApiKey = snapshot.val();
            
            if (googleApiKey) {
                console.log("System: API Key loaded. Syncing ID & KR Holidays...");
                await fetchAllHolidays(calViewDate.getFullYear());
            } else {
                console.warn("System: No API Key. Skipping holidays.");
                renderSchedule();
            }
        } catch (error) {
            console.error("System Init Error:", error);
            renderSchedule();
        }
    }

    window.closeModal = () => { 
        const modal = document.getElementById('eventModal');
        if(modal) {
            modal.classList.add('hidden'); 
            modal.classList.remove('block');
        }
        document.body.style.overflow = '';
    };

    window.toggleTimePicker = (isAllDay) => {
        const config = {
            enableTime: !isAllDay,
            dateFormat: isAllDay ? "Y-m-d" : "Y-m-d\\TH:i",
            altInput: true,
            altFormat: isAllDay ? "Y-m-d" : "Y-m-d h:i K",
            disableMobile: true, 
            static: true
        };
        if (startPicker) startPicker.set(config);
        if (endPicker) endPicker.set(config);
    };

    window.openAddModal = (dateStr) => {
        selectedId = null; 
        currentEventData = null;
        document.getElementById('evTitle').value = "";
        document.getElementById('evDesc').value = "";
        document.getElementById('evCategory').value = "default";
        const memoArea = document.getElementById('adminMemoArea');
        if (memoArea) memoArea.classList.add('hidden');
        document.getElementById('evAllDay').checked = false; 
        window.toggleTimePicker(false);
        startPicker.setDate(dateStr + "T09:00");
        endPicker.setDate(dateStr + "T10:00");
        document.getElementById('btnDel').classList.add('hidden');
        document.getElementById('btnSave').classList.remove('hidden');
        const modal = document.getElementById('eventModal');
        if(modal) { modal.classList.remove('hidden'); modal.classList.add('block'); }
        document.body.style.overflow = 'hidden'; 
    };

    window.openEditModal = (id, ev) => {
        selectedId = id; 
        currentEventData = ev;
        const canEdit = (ev.author === user || userRole === 'admin');
        document.getElementById('evTitle').value = ev.title;
        document.getElementById('evDesc').value = ev.desc || "";
        document.getElementById('evCategory').value = ev.category || "default";
        const memoArea = document.getElementById('adminMemoArea');
        const memoText = document.getElementById('evAdminMemo');
        if (memoArea) {
            if (ev.adminMemo) {
                memoArea.classList.remove('hidden');
                if (memoText) memoText.innerText = ev.adminMemo;
            } else { memoArea.classList.add('hidden'); }
        }
        window.toggleTimePicker(ev.allDay);
        document.getElementById('evAllDay').checked = ev.allDay;
        startPicker.setDate(ev.start);
        endPicker.setDate(ev.end);
        document.getElementById('btnSave').classList.toggle('hidden', !canEdit);
        document.getElementById('btnDel').classList.toggle('hidden', !canEdit);
        const modal = document.getElementById('eventModal');
        if(modal) { modal.classList.remove('hidden'); modal.classList.add('block'); }
        document.body.style.overflow = 'hidden';
    };

    window.saveEvent = () => {
        const title = document.getElementById('evTitle').value;
        if(!title) return alert("Title required");
        const data = {
            title: title, desc: document.getElementById('evDesc').value || "",
            category: document.getElementById('evCategory').value,
            start: document.getElementById('evStart').value,
            end: document.getElementById('evEnd').value,
            allDay: document.getElementById('evAllDay').checked,
            author: selectedId ? currentEventData.author : user,
            timestamp: Date.now()
        };
        if (selectedId && currentEventData.adminMemo) data.adminMemo = currentEventData.adminMemo;
        const ref = db.ref('shared_schedules');
        const promise = selectedId ? ref.child(selectedId).update(data) : ref.push(data);
        promise.then(window.closeModal);
    };

    window.deleteEvent = () => { if(confirm("Delete?")) db.ref('shared_schedules/' + selectedId).remove().then(window.closeModal); };

    window.changeCalMonth = (offset) => { 
        const oldYear = calViewDate.getFullYear();
        calViewDate.setMonth(calViewDate.getMonth() + offset); 
        const newYear = calViewDate.getFullYear();
        if(oldYear !== newYear && googleApiKey) fetchAllHolidays(newYear);
        else renderSchedule();
    };

    window.goTodayCal = () => { 
        calViewDate = new Date(); 
        if(googleApiKey) fetchAllHolidays(calViewDate.getFullYear());
        else renderSchedule();
    };

    window.handleDragStart = (e, id) => { draggedId = id; e.target.classList.add('dragging'); e.dataTransfer.setData('text/plain', id); e.dataTransfer.effectAllowed = 'move'; };
    window.handleDragEnd = (e) => { e.target.classList.remove('dragging'); document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over')); };
    window.handleDragOver = (e) => { e.preventDefault(); e.currentTarget.classList.add('drag-over'); };
    window.handleDragLeave = (e) => { e.currentTarget.classList.remove('drag-over'); };
    window.handleDrop = (e, targetDate) => { e.preventDefault(); e.currentTarget.classList.remove('drag-over'); const id = draggedId || e.dataTransfer.getData('text/plain'); if (id) moveEvent(id, targetDate); };
    window.handleTouchStart = (e, id) => { const el = e.currentTarget; touchTimer = setTimeout(() => { draggedId = id; el.classList.add('touch-ready'); if (navigator.vibrate) navigator.vibrate(50); }, 600); };
    window.handleTouchEnd = (e, id, dateStr) => { clearTimeout(touchTimer); const el = e.currentTarget; if (el.classList.contains('touch-ready')) { const touch = e.changedTouches[0]; const targetEl = document.elementFromPoint(touch.clientX, touch.clientY); const targetTd = targetEl ? targetEl.closest('td') : null; if (targetTd && targetTd.dataset.date && targetTd.dataset.date !== dateStr) moveEvent(id, targetTd.dataset.date); } el.classList.remove('touch-ready'); draggedId = null; };

    function moveEvent(id, newStartDateStr) {
        const ref = db.ref('shared_schedules/' + id);
        ref.once('value').then(snap => {
            const ev = snap.val();
            if (!ev || (ev.author !== user && userRole !== 'admin')) return;
            const oldStart = new Date(ev.start);
            const oldEnd = new Date(ev.end);
            const durationMs = oldEnd.getTime() - oldStart.getTime();
            let nextStart, nextEnd;
            if (ev.allDay) {
                nextStart = new Date(newStartDateStr);
                nextEnd = new Date(nextStart.getTime() + durationMs);
                const formatYMD = (d) => d.toISOString().split('T')[0];
                ref.update({ start: formatYMD(nextStart), end: formatYMD(nextEnd) });
            } else {
                const timePart = ev.start.includes('T') ? ev.start.split('T')[1] : "09:00";
                nextStart = new Date(newStartDateStr + 'T' + timePart);
                nextEnd = new Date(nextStart.getTime() + durationMs);
                const formatFull = (d) => d.toISOString().split('.')[0].slice(0, 16);
                ref.update({ start: formatFull(nextStart), end: formatFull(nextEnd) });
            }
        });
    }

    // [수정] 인도네시아와 한국 휴일을 모두 가져오는 함수
    async function fetchAllHolidays(year) {
        if(!googleApiKey) return;
        holidayData = {}; // 초기화
        
        // 캘린더 ID 목록 (인도네시아, 한국)
        const calendars = [
            { id: 'en.indonesian#holiday@group.v.calendar.google.com', name: 'ID' },
            { id: 'ko.south_korea#holiday@group.v.calendar.google.com', name: 'KR' }
        ];

        const timeMin = `${year}-01-01T00:00:00Z`;
        const timeMax = `${year}-12-31T23:59:59Z`;

        try {
            await Promise.all(calendars.map(async (cal) => {
                const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(cal.id)}/events?key=${googleApiKey}&timeMin=${timeMin}&timeMax=${timeMax}&singleEvents=true`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.items) {
                    data.items.forEach(event => {
                        const date = event.start.date;
                        // 같은 날짜에 휴일이 중복될 경우 대비해 이름을 합침
                        if (holidayData[date]) {
                            holidayData[date] += `, ${event.summary}`;
                        } else {
                            holidayData[date] = event.summary;
                        }
                    });
                }
            }));
            console.log("All Holidays Synced (ID & KR)");
            renderSchedule();
        } catch (error) {
            console.error("Holiday API Error:", error);
            renderSchedule();
        }
    }

function renderSchedule() {
    if (!document.getElementById('scheduleBody') || !document.getElementById('calMonthYear')) {
        db.ref('shared_schedules').off();
        return;
    }

    const year = calViewDate.getFullYear(), month = calViewDate.getMonth();
    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();
    const monthYearEl = document.getElementById('calMonthYear');
    if (monthYearEl) {
        monthYearEl.innerText = calViewDate.toLocaleString('en-US', { month: 'long', year: 'numeric' });
    }

    const scheduleRef = db.ref('shared_schedules');
    scheduleRef.off();
    scheduleRef.on('value', snap => {
        const events = snap.val() || {};
        const tbody = document.getElementById('scheduleBody');
        if (!tbody) { scheduleRef.off(); return; }
        tbody.innerHTML = '';

        // ── Stats 업데이트 ──
        (function updateStats() {
            const monthStr = `${year}-${String(month+1).padStart(2,'0')}`;
            const todayStr = new Date().toISOString().split('T')[0];
            let total = 0, mine = 0, upcoming = 0, urgent = 0;
            Object.values(events).forEach(ev => {
                const sDate = ev.start.split('T')[0];
                if (!sDate.startsWith(monthStr)) return;
                total++;
                if (ev.author === user) mine++;
                if (sDate >= todayStr) upcoming++;
                if (ev.category === 'urgent') urgent++;
            });
            const s = document.getElementById('statTotal');
            const m = document.getElementById('statMine');
            const u = document.getElementById('statUpcoming');
            const r = document.getElementById('statUrgent');
            if (s) s.innerText = total;
            if (m) m.innerText = mine;
            if (u) u.innerText = upcoming;
            if (r) r.innerText = urgent;
        })();

        // ── Upcoming List 업데이트 ──
        (function renderUpcomingList() {
            const listEl = document.getElementById('upcomingList');
            if (!listEl) return;
            const todayStr = new Date().toISOString().split('T')[0];
            const monthStr = `${year}-${String(month+1).padStart(2,'0')}`;

            const upcoming = Object.entries(events)
                .filter(([, ev]) => {
                    const s = ev.start.split('T')[0];
                    return s >= todayStr && s.startsWith(monthStr);
                })
                .sort(([, a], [, b]) => a.start.localeCompare(b.start))
                .slice(0, 8);

            if (upcoming.length === 0) {
                listEl.innerHTML = `<p class="text-xs text-slate-600 italic text-center py-4">No upcoming events this month.</p>`;
                return;
            }

            const catColors = {
                default: '#3b82f6', vacation: '#10b981',
                urgent: '#ef4444', meeting: '#f59e0b', admin: '#a855f7'
            };

            listEl.innerHTML = upcoming.map(([id, ev]) => {
                const sDate = ev.start.split('T')[0];
                const isToday = sDate === todayStr;
                const color = ev.adminMemo
                    ? catColors.admin
                    : (catColors[ev.category] || catColors.default);
                const timeStr = ev.allDay
                    ? 'All Day'
                    : (ev.start.includes('T') ? ev.start.split('T')[1].slice(0,5) : '');
                const evJson = JSON.stringify(ev).replace(/"/g, '&quot;');

                return `
                    <div onclick="window.openEditModal('${id}', ${evJson})"
                         class="flex items-center gap-3 p-3 rounded-xl bg-slate-900 border border-slate-800
                                cursor-pointer hover:border-slate-600 transition-all">
                        <div class="w-1 h-10 rounded-full flex-shrink-0" style="background:${color}"></div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-black text-white truncate">${ev.title}</span>
                                ${isToday ? '<span class="text-[8px] bg-purple-600 text-white px-1.5 py-0.5 rounded font-black flex-shrink-0">TODAY</span>' : ''}
                            </div>
                            <div class="flex items-center gap-2 mt-0.5">
                                <span class="text-[10px] text-slate-500 font-mono">${sDate.substring(5).replace('-','/')}</span>
                                ${timeStr ? `<span class="text-[10px] text-slate-600">${timeStr}</span>` : ''}
                                <span class="text-[10px] text-slate-600">${ev.author || ''}</span>
                            </div>
                        </div>
                    </div>`;
            }).join('');
        })();

        // ── 달력 그리드 렌더링 ──
        const sortedEvents = Object.keys(events).map(id => ({
            id, ...events[id],
            sDate: events[id].start.split('T')[0],
            eDate: events[id].end.split('T')[0]
        })).sort((a, b) => (new Date(b.eDate) - new Date(b.sDate)) || a.sDate.localeCompare(b.sDate));

        const eventSlots = {};
        const dayOccupancy = {};
        sortedEvents.forEach(ev => {
            let slot = 0;
            while (true) {
                let ok = true;
                for (let d = new Date(ev.sDate); d <= new Date(ev.eDate); d.setDate(d.getDate() + 1)) {
                    const dStr = d.toISOString().split('T')[0];
                    if (dayOccupancy[dStr]?.has(slot)) { ok = false; break; }
                }
                if (ok) {
                    for (let d = new Date(ev.sDate); d <= new Date(ev.eDate); d.setDate(d.getDate() + 1)) {
                        const dStr = d.toISOString().split('T')[0];
                        if (!dayOccupancy[dStr]) dayOccupancy[dStr] = new Set();
                        dayOccupancy[dStr].add(slot);
                    }
                    eventSlots[ev.id] = slot; break;
                }
                slot++;
            }
        });

        const todayStr = new Date().toISOString().split('T')[0];
        let dateNum = 1;

        for (let i = 0; i < 6; i++) {
            const tr = document.createElement('tr');
            let weekDates = [];
            let maxSlotsInWeek = 0;
            let hasHolidayInWeek = false;

            for (let j = 0; j < 7; j++) {
                if ((i === 0 && j < firstDay) || dateNum > lastDate) {
                    weekDates.push(null);
                } else {
                    const dStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(dateNum).padStart(2, '0')}`;
                    weekDates.push(dStr);
                    if (holidayData[dStr]) hasHolidayInWeek = true;
                    dateNum++;
                }
            }

            weekDates.forEach(dStr => {
                if (dStr && dayOccupancy[dStr]) {
                    const dayMaxSlot = Math.max(...Array.from(dayOccupancy[dStr]), -1);
                    if (dayMaxSlot >= maxSlotsInWeek) maxSlotsInWeek = dayMaxSlot + 1;
                }
            });

            const commonBaseTop = hasHolidayInWeek ? 58 : 38;
            const calculatedHeight = commonBaseTop + (maxSlotsInWeek * 28) + 15;
            tr.style.height = Math.max(140, calculatedHeight) + 'px';

            weekDates.forEach((dStr, j) => {
                const td = document.createElement('td');
                if (dStr) {
                    td.dataset.date = dStr;
                    td.ondragover = (e) => window.handleDragOver(e);
                    td.ondragleave = (e) => window.handleDragLeave(e);
                    td.ondrop = (e) => window.handleDrop(e, dStr);
                    td.onclick = (e) => { if (e.target.tagName === 'TD') window.openAddModal(dStr); };

                    const holidayName = holidayData[dStr];
                    const isSunday = (j === 0);
                    const isSaturday = (j === 6);
                    const isToday = (dStr === todayStr);

                    if (isSunday || holidayName) {
                        td.style.backgroundColor = 'rgba(244, 63, 94, 0.08)';
                    } else if (isSaturday) {
                        td.style.backgroundColor = 'rgba(59, 130, 246, 0.08)';
                    }

                    let dateColorClass = 'text-slate-400';
                    if (isSunday || holidayName) dateColorClass = 'text-red-500';
                    else if (isSaturday) dateColorClass = 'text-blue-500';

                    let html = `<div class="date-wrapper">
                                    <span class="date-text ${isToday ? 'is-today' : ''} ${dateColorClass}">
                                        ${parseInt(dStr.split('-')[2])}
                                    </span>
                                    ${holidayName ? `<div style="font-size:9px;color:rgba(239,68,68,0.8);font-weight:bold;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;pointer-events:none;max-width:100%;width:0;min-width:100%;">${holidayName}</div>` : ''}
                                </div>`;

                    sortedEvents.filter(ev => dStr >= ev.sDate && dStr <= ev.eDate).forEach(ev => {
                        if (dStr === ev.sDate || j === 0) {
                            const slot = eventSlots[ev.id];
                            const span = Math.min(Math.ceil((new Date(ev.eDate) - new Date(dStr)) / (86400000)) + 1, 7 - j);
                            const isCont = dStr > ev.sDate ? 'continued-from-prev' : '';
                            const willCont = ev.eDate > (weekDates[j + span - 1] || '9999-12-31') ? 'continues-to-next' : '';
                            const evData = JSON.stringify(ev).replace(/"/g, '&quot;');
                            const catClass = ev.adminMemo ? 'bg-cat-admin' : `bg-cat-${ev.category || 'default'}`;

                            html += `<div onclick="event.stopPropagation(); window.openEditModal('${ev.id}', ${evData})"
                                          class="event-item ${isCont} ${willCont} ${catClass}"
                                          style="top: ${commonBaseTop + (slot * 28)}px; width: calc(${span * 100}% - 8px);"
                                          draggable="true"
                                          ondragstart="window.handleDragStart(event, '${ev.id}')"
                                          ondragend="window.handleDragEnd(event)"
                                          ontouchstart="window.handleTouchStart(event, '${ev.id}')"
                                          ontouchend="window.handleTouchEnd(event, '${ev.id}', '${dStr}')">
                                          <span class="ev-title-text">${isCont ? '' : ev.title}</span>
                                          <span class="ev-author-text">${isCont ? '' : (ev.author || 'Staff')}</span>
                                     </div>`;
                        }
                    });
                    td.innerHTML = html;
                }
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
            if (dateNum > lastDate) break;
        }
    });
}

    const baseConfig = { enableTime: true, dateFormat: "Y-m-d\\TH:i", altInput: true, altFormat: "Y-m-d h:i K", static: true, disableMobile: true };
    startPicker = flatpickr("#evStart", baseConfig);
    endPicker = flatpickr("#evEnd", baseConfig);

    initCalendarSystem();

})();
</script>
