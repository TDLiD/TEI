      '--c-accent':'#38bdf8','--c-accent2':'#818cf8',
      '--c-accent-glow':'rgba(56,189,248,0.18)',
      '--c-card-shine':'rgba(56,189,248,0.07)',

      '--c-bg':'#080e09','--c-surface':'#0d1a0f','--c-surface2':'#122014','--c-surface3':'#172618',
      '--c-border':'rgba(200,168,75,0.1)','--c-border2':'rgba(200,168,75,0.22)',

      '--c-ev-border':'rgba(106,170,64,0.28)',
      '--c-today-bg':'linear-gradient(145deg,rgba(106,170,64,0.14),rgba(168,192,96,0.06))',
      '--c-today-badge':'linear-gradient(135deg,#6aaa40,#3d6820)',

      '--c-ev-border':'rgba(255,0,204,0.28)',

    6: { /* SAT — Arctic Dark */
      '--c-bg':'#08122a','--c-surface':'#0c1a38','--c-surface2':'#102044','--c-surface3':'#142650',
      '--c-border':'rgba(96,165,250,0.12)','--c-border2':'rgba(96,165,250,0.24)',
      '--c-text':'#e8f0fe','--c-muted':'#4a6090','--c-dim':'#1e3060',

      '--c-accent-glow':'rgba(96,165,250,0.2)',
      '--c-card-shine':'rgba(188,213,250,0.12)',
      '--c-card-bevel':'linear-gradient(90deg,transparent,rgba(188,213,250,0.32),transparent)',
      '--c-card-face':'linear-gradient(155deg,rgba(188,213,250,0.1) 0%,transparent 55%)',
      '--c-card-radius':'16px',
      '--c-ev-hover':'rgba(96,165,250,0.08)',
      '--c-ev-border':'rgba(96,165,250,0.3)',
      '--c-today-bg':'linear-gradient(145deg,rgba(96,165,250,0.16),rgba(165,200,255,0.06))',
      '--c-today-badge':'linear-gradient(135deg,#60a5fa,#1d4ed8)',
    },
  };
  const idx = new Date().getDay();
  const t = THEMES[idx] || THEMES[1];
  const root = document.documentElement;
  for (const [k, v] of Object.entries(t)) root.style.setProperty(k, v);
  window._calDayIdx = idx;
})();

<style>
/* ══════════════════════════════════════════════════════════
   STAFF CALENDAR — 7-DAY ADAPTIVE DARK THEME
   All colours from --c-* tokens. No white backgrounds.
══════════════════════════════════════════════════════════ */

/* ── Semantic compat aliases (keep old var names working) ── */
:root {
  --bg:       var(--c-bg);
  --surface:  var(--c-surface);
  --surface2: var(--c-surface2);
  --surface3: var(--c-surface3);
  --border:   var(--c-border);
  --border2:  var(--c-border2);
  --text:     var(--c-text);
  --muted:    var(--c-muted);
  --dim:      var(--c-dim);
  --violet:   #a855f7;
  --blue:     #3b82f6;
  --green:    #10b981;
  --red:      #f43f5e;
  --amber:    #f59e0b;
  --cyan:     #06b6d4;
}

*, *::before, *::after {
  box-sizing: border-box;
  font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui,
               Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo",
               "Noto Sans KR", "Malgun Gothic", sans-serif;
}

/* ══════════════════════════════════════════════════════════
   3-D CARD BASE
══════════════════════════════════════════════════════════ */
.card-3d {
  position: relative;
  background: linear-gradient(145deg, var(--c-surface2) 0%, var(--c-surface) 100%);
  border: 1px solid var(--c-border);
  border-top: 1px solid var(--c-border2);
  border-radius: var(--c-card-radius);
  box-shadow:
    inset 0 1px 0 var(--c-card-shine),
    inset 0 -1px 0 rgba(0,0,0,0.25),
    0 4px 12px rgba(0,0,0,0.3),
    0 12px 32px rgba(0,0,0,0.45);
  will-change: transform;
  transition: transform 0.3s cubic-bezier(0.23,1,0.32,1),
              box-shadow 0.3s ease,
              border-color 0.3s ease;
}
.card-3d::before {
  content: '';
  position: absolute; top: 0; left: 15%; right: 15%; height: 1px;
  background: var(--c-card-bevel);
  pointer-events: none;
}
.card-3d::after {
  content: '';
  position: absolute; inset: 0;
  background: var(--c-card-face);
  pointer-events: none;
  border-radius: inherit;
}
@media (hover:hover) {
  .card-3d:hover {
    transform: translateY(-4px) perspective(900px) rotateX(2deg);
    border-color: var(--c-accent);
    box-shadow:
      inset 0 1px 0 var(--c-card-shine),
      0 6px 14px rgba(0,0,0,0.35),
      0 20px 44px rgba(0,0,0,0.5),
      0 0 0 1px var(--c-accent-glow),
      0 0 28px var(--c-accent-glow);
  }
}

/* ══════════════════════════════════════════════════════════
   PAGE LAYOUT
══════════════════════════════════════════════════════════ */
.sc-root {
  display: flex;
  flex-direction: column;
  gap: clamp(0.75rem,2.5vw,1.25rem);
  color: var(--c-text);
}

/* ── Page header ── */
.sc-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
#calMonthYear {
  font-size: clamp(16px,5vw,24px);
  font-weight: 900;
  font-style: italic;
  letter-spacing: -0.02em;
  color: var(--c-text);
  text-shadow: 0 0 24px var(--c-accent-glow);
  text-transform: uppercase;
  text-decoration: underline;
  text-decoration-color: var(--c-accent);
  text-underline-offset: 6px;
}

/* ── Nav bar ── */
.sc-nav {
  display: flex;
  background: linear-gradient(145deg,var(--c-surface3),var(--c-surface2));
  border: 1px solid var(--c-border);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: inset 0 1px 0 var(--c-card-shine), 0 2px 8px rgba(0,0,0,0.3);
}
.sc-nav button {
  padding: clamp(4px,1.5vw,6px) clamp(8px,3vw,12px);
  font-size: clamp(7px,2vw,10px);
  font-weight: 900;
  letter-spacing: 0.05em;
  color: var(--c-muted);
  background: none; border: none; cursor: pointer;
  transition: color 0.15s, background 0.15s;
  text-transform: uppercase;
}
@media (hover:hover) {
  .sc-nav button:hover { color:var(--c-text); background:color-mix(in srgb,var(--c-accent) 12%,transparent); }
}
.sc-nav .today-btn { color:var(--c-accent); text-shadow:0 0 8px var(--c-accent-glow); }

/* ── Stats bar ── */
.sc-stats {
  display: flex;
  gap: clamp(6px,2vw,12px);
  flex-wrap: wrap;
}
.sc-stat {
  background: linear-gradient(145deg,var(--c-surface2),var(--c-surface));
  border: 1px solid var(--c-border);
  border-top: 1px solid var(--c-border2);
  border-radius: calc(var(--c-card-radius) * 0.7);
  padding: clamp(6px,2vw,10px) clamp(10px,3vw,16px);
  display: flex;
  align-items: center;
  gap: 7px;
  box-shadow: inset 0 1px 0 var(--c-card-shine), 0 3px 10px rgba(0,0,0,0.28);
  will-change: transform;
  transition: transform 0.22s ease, box-shadow 0.22s ease;
}
@media (hover:hover) {
  .sc-stat:hover { transform:translateY(-2px); box-shadow:inset 0 1px 0 var(--c-card-shine),0 8px 20px rgba(0,0,0,0.38); }
}
.sc-stat-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.sc-stat-lbl { font-size:clamp(7px,2vw,9px); font-weight:900; color:var(--c-muted); text-transform:uppercase; letter-spacing:0.1em; }
.sc-stat-val { font-size:clamp(12px,3.5vw,15px); font-weight:900; }

/* ══════════════════════════════════════════════════════════
   CALENDAR CARD WRAPPER
══════════════════════════════════════════════════════════ */
.sc-cal-card {
  background: linear-gradient(145deg,var(--c-surface2),var(--c-surface));
  border: 1px solid var(--c-border);
  border-top: 1px solid var(--c-border2);
  border-radius: calc(var(--c-card-radius) * 1.3);
  overflow: hidden;
  position: relative;
  box-shadow:
    inset 0 1px 0 var(--c-card-shine),
    0 16px 40px rgba(0,0,0,0.55),
    0 4px 12px rgba(0,0,0,0.3);
}
.sc-cal-card::before {
  content:'';
  position:absolute; top:0; left:10%; right:10%; height:1px;
  background: var(--c-card-bevel);
  pointer-events:none;
}

/* ══════════════════════════════════════════════════════════
   CALENDAR TABLE
══════════════════════════════════════════════════════════ */
.schedule-cal {
  width: 100%;
  border-collapse: separate;
  border-spacing: 2px;
  table-layout: fixed;
}
.schedule-cal th {
  padding: clamp(6px,2vw,10px) 0;
  color: var(--c-muted);
  font-size: clamp(7px,1.8vw,9px);
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  border-bottom: 1px solid var(--c-border);
}
.schedule-cal th.th-sun { color:rgba(244,63,94,0.85); text-shadow:0 0 6px rgba(244,63,94,0.3); }
.schedule-cal th.th-sat { color:color-mix(in srgb,var(--c-accent) 80%,white); text-shadow:0 0 6px var(--c-accent-glow); }

.schedule-cal td {
  position: relative;
  width: 14.28%;
  min-height: 100px;
  padding: 0;
  vertical-align: top;
  border: 1px solid rgba(10,16,30,0.9);
  border-radius: 8px;
  cursor: pointer;
  will-change: transform;
  transition: transform 0.18s cubic-bezier(0.23,1,0.32,1),
              box-shadow 0.18s ease,
              border-color 0.18s ease;
  background: linear-gradient(145deg,var(--c-surface3) 0%,var(--c-surface2) 100%);
  box-shadow: 0 1px 4px rgba(0,0,0,0.25), inset 0 1px 0 var(--c-card-shine);
}
@media (hover:hover) {
  .schedule-cal td:hover {
    background: linear-gradient(145deg,var(--c-ev-hover),var(--c-surface2)) !important;
    border-color: var(--c-ev-border) !important;
    transform: translateY(-2px) scale(1.015);
    box-shadow: 0 6px 18px var(--c-accent-glow), inset 0 1px 0 var(--c-card-shine);
    z-index: 2;
  }
}

/* Sunday / Saturday tint */
.schedule-cal td.td-sun {
  background: linear-gradient(145deg,rgba(244,63,94,0.06),var(--c-surface2));
}
.schedule-cal td.td-sat {
  background: linear-gradient(145deg,color-mix(in srgb,var(--c-accent) 7%,transparent),var(--c-surface2));
}
.schedule-cal td.today-highlight {
  background: var(--c-today-bg) !important;
  border-color: color-mix(in srgb,var(--c-accent) 45%,transparent) !important;
  box-shadow: 0 0 0 1px var(--c-accent-glow), 0 4px 14px var(--c-accent-glow) !important;
}
.schedule-cal td.drag-over {
  background: color-mix(in srgb,var(--c-accent) 15%,transparent) !important;
  outline: 2px dashed color-mix(in srgb,var(--c-accent) 65%,transparent);
  outline-offset: -2px;
}

/* ── Date number ── */
.date-wrapper {
  padding: clamp(3px,1.2vw,6px) clamp(4px,1.5vw,8px);
  position: relative;
  z-index: 20;
  pointer-events: none;
}
.date-text {
  font-size: clamp(8px,2.2vw,11px);
  font-weight: 900;
  color: var(--c-muted);
  padding: 2px 5px;
  display: inline-block;
  min-width: 18px;
  text-align: center;
  border-radius: 6px;
  letter-spacing: -0.02em;
}
.date-text.is-today {
  background: var(--c-today-badge) !important;
  color: #fff !important;
  border-radius: 999px;
  box-shadow: 0 0 12px var(--c-accent-glow), 0 2px 6px rgba(0,0,0,0.3);
  text-shadow: none;
}
.date-text.sun-color  { color:#f87171; }
.date-text.sat-color  { color:color-mix(in srgb,var(--c-accent) 80%,white); }
.date-text.holi-color { color:rgba(239,68,68,0.85); }

/* Holiday label */
.holiday-label {
  font-size: clamp(7px,1.8vw,9px);
  color: rgba(239,68,68,0.8);
  font-weight: 700;
  line-height: 1.2;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-top: 2px;
  pointer-events: none;
  max-width: 100%;
}

/* ══════════════════════════════════════════════════════════
   EVENT ITEMS
══════════════════════════════════════════════════════════ */
.event-item {
  position: absolute;
  z-index: 10;
  height: 22px;
  line-height: 22px;
  padding: 0 6px;
  border-radius: 6px;
  font-size: clamp(8px,1.8vw,10px);
  font-weight: 700;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.2);
  will-change: transform;
  transition: transform 0.2s cubic-bezier(0.23,1,0.32,1), filter 0.2s, box-shadow 0.2s;
}
@media (hover:hover) {
  .event-item:hover {
    filter: brightness(1.18);
    transform: translateY(-2px) scale(1.02);
    z-index: 20;
    box-shadow: 0 6px 16px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.25);
  }
}
.event-item.dragging { opacity:0.4; transform:scale(0.97); cursor:grabbing; }
.event-item.touch-ready { filter:brightness(1.5); box-shadow:0 0 20px rgba(255,255,255,0.5); transform:scale(1.05); }
.continued-from-prev { border-top-left-radius:0; border-bottom-left-radius:0; }
.continues-to-next   { border-top-right-radius:0; border-bottom-right-radius:0; }
.ev-title-text  { flex:1; overflow:hidden; text-overflow:ellipsis; }
.ev-author-text { font-size:clamp(6px,1.5vw,8px); opacity:0.85; background:rgba(0,0,0,0.25); padding:0 4px; border-radius:4px; flex-shrink:0; }

/* Category gradients */
.bg-cat-default { background:linear-gradient(135deg,#3b82f6,#2563eb) !important; }
.bg-cat-vacation{ background:linear-gradient(135deg,#10b981,#059669) !important; }
.bg-cat-urgent  { background:linear-gradient(135deg,#ef4444,#dc2626) !important; }
.bg-cat-meeting { background:linear-gradient(135deg,#f59e0b,#d97706) !important; }
.bg-cat-admin   { background:linear-gradient(135deg,#a855f7,#7c3aed) !important; }

/* ══════════════════════════════════════════════════════════
   UPCOMING CARD
══════════════════════════════════════════════════════════ */
.sc-upcoming-card {
  background: linear-gradient(145deg,var(--c-surface2),var(--c-surface));
  border: 1px solid var(--c-border);
  border-top: 1px solid var(--c-border2);

          <label style="display:block;margin-bottom:5px;">End</label>

        <span style="font-size:8px;font-weight:900;color:var(--c-accent);text-transform:uppercase;letter-spacing:0.1em;display:block;margin-bottom:5px;">Admin Memo</span>

      <button id="btnSave" onclick="saveEvent()" style="flex:2;padding:14px 8px;font-size:11px;color:#fff;text-transform:uppercase;letter-spacing:0.1em;cursor:pointer;transition:all 0.2s;">Save</button>

<!-- ══════════════════════════════════════════════════════════
     JAVASCRIPT — all original logic preserved
══════════════════════════════════════════════════════════ -->
<script>
(function () {
  const db = firebase.database();
  const user = sessionStorage.getItem('loggedInUser');
  const userRole = sessionStorage.getItem('userRole');
  let calViewDate = new Date();
  let selectedId = null, currentEventData = null;
  let startPicker, endPicker;
  let draggedId = null, touchTimer = null;
  let holidayData = {}, googleApiKey = null;
  let _scheduleRef = null; /* for cleanup */

  const todayObj = new Date();
  const todayStr = `${todayObj.getFullYear()}-${String(todayObj.getMonth()+1).padStart(2,'0')}-${String(todayObj.getDate()).padStart(2,'0')}`;

  /* ── Helpers ── */
  const catColors = { default:'#3b82f6', vacation:'#10b981', urgent:'#ef4444', meeting:'#f59e0b', admin:'#a855f7' };

  /* ── System init ── */
  async function initCalendarSystem() {
    try {
      const snapshot = await db.ref('settings/config/GoogleCAPI').once('value');
      googleApiKey = snapshot.val();
      if (googleApiKey) {
        await fetchAllHolidays(calViewDate.getFullYear());
      } else {
        renderSchedule();
      }
    } catch (e) { console.error("Calendar init error:", e); renderSchedule(); }
  }

  /* ── Modal controls ── */
  window.closeModal = () => {
    const modal = document.getElementById('eventModal');
    if (modal) { modal.classList.add('hidden'); modal.classList.remove('block'); }
    document.body.style.overflow = '';
  };

  window.toggleTimePicker = (isAllDay) => {
    const cfg = { enableTime:!isAllDay, dateFormat:isAllDay?"Y-m-d":"Y-m-d\\TH:i", altInput:true, altFormat:isAllDay?"Y-m-d":"Y-m-d h:i K", disableMobile:true, static:true };
    if (startPicker) startPicker.set(cfg);
    if (endPicker) endPicker.set(cfg);
  };

  window.openAddModal = (dateStr) => {
    selectedId = null; currentEventData = null;
    document.getElementById('evTitle').value = "";
    document.getElementById('evDesc').value = "";
    document.getElementById('evCategory').value = "default";
    const ma = document.getElementById('adminMemoArea'); if (ma) ma.classList.add('hidden');
    document.getElementById('evAllDay').checked = false;
    window.toggleTimePicker(false);
    startPicker.setDate(dateStr + "T09:00");
    endPicker.setDate(dateStr + "T10:00");
    document.getElementById('btnDel').classList.add('hidden');
    document.getElementById('btnSave').classList.remove('hidden');
    const modal = document.getElementById('eventModal');
    if (modal) { modal.classList.remove('hidden'); modal.classList.add('block'); }
    document.body.style.overflow = 'hidden';
  };

  window.openEditModal = (id, ev) => {
    selectedId = id; currentEventData = ev;
    const canEdit = (ev.author === user || userRole === 'admin');
    document.getElementById('evTitle').value = ev.title;
    document.getElementById('evDesc').value = ev.desc || "";
    document.getElementById('evCategory').value = ev.category || "default";
    const ma = document.getElementById('adminMemoArea'), mt = document.getElementById('evAdminMemo');
    if (ma) { if (ev.adminMemo) { ma.classList.remove('hidden'); if (mt) mt.innerText = ev.adminMemo; } else ma.classList.add('hidden'); }
    window.toggleTimePicker(ev.allDay);
    document.getElementById('evAllDay').checked = ev.allDay;
    startPicker.setDate(ev.start);
    endPicker.setDate(ev.end);
    document.getElementById('btnSave').classList.toggle('hidden', !canEdit);
    document.getElementById('btnDel').classList.toggle('hidden', !canEdit);
    const modal = document.getElementById('eventModal');
    if (modal) { modal.classList.remove('hidden'); modal.classList.add('block'); }
    document.body.style.overflow = 'hidden';
  };

  window.saveEvent = () => {
    const title = document.getElementById('evTitle').value;
    if (!title) return alert("Title required");
    const data = {
      title, desc: document.getElementById('evDesc').value || "",
      category: document.getElementById('evCategory').value,
      start: document.getElementById('evStart').value,
      end: document.getElementById('evEnd').value,
      allDay: document.getElementById('evAllDay').checked,
      author: selectedId ? currentEventData.author : user,
      timestamp: Date.now()
    };
    if (selectedId && currentEventData.adminMemo) data.adminMemo = currentEventData.adminMemo;
    const ref = db.ref('shared_schedules');
    (selectedId ? ref.child(selectedId).update(data) : ref.push(data)).then(window.closeModal);
  };

  window.deleteEvent = () => {
    if (confirm("Delete?")) db.ref('shared_schedules/' + selectedId).remove().then(window.closeModal);
  };

  window.changeCalMonth = (offset) => {
    const oldYear = calViewDate.getFullYear();
    calViewDate.setMonth(calViewDate.getMonth() + offset);
    const newYear = calViewDate.getFullYear();
    if (oldYear !== newYear && googleApiKey) fetchAllHolidays(newYear);
    else renderSchedule();
  };

  window.goTodayCal = () => {
    calViewDate = new Date();
    if (googleApiKey) fetchAllHolidays(calViewDate.getFullYear());
    else renderSchedule();
  };

  /* ── Drag & Drop ── */
  window.handleDragStart  = (e, id) => { draggedId=id; e.target.classList.add('dragging'); e.dataTransfer.setData('text/plain',id); e.dataTransfer.effectAllowed='move'; };
  window.handleDragEnd    = (e)     => { e.target.classList.remove('dragging'); document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over')); };
  window.handleDragOver   = (e)     => { e.preventDefault(); e.currentTarget.classList.add('drag-over'); };
  window.handleDragLeave  = (e)     => { e.currentTarget.classList.remove('drag-over'); };
  window.handleDrop       = (e, tDate) => { e.preventDefault(); e.currentTarget.classList.remove('drag-over'); const id=draggedId||e.dataTransfer.getData('text/plain'); if(id) moveEvent(id,tDate); };
  window.handleTouchStart = (e, id) => {
    const el=e.currentTarget;
    touchTimer=setTimeout(()=>{ draggedId=id; el.classList.add('touch-ready'); if(navigator.vibrate) navigator.vibrate(50); }, 600);
  };
  window.handleTouchEnd   = (e, id, dateStr) => {
    clearTimeout(touchTimer);
    const el=e.currentTarget;
    if (el.classList.contains('touch-ready')) {
      const touch=e.changedTouches[0], targetEl=document.elementFromPoint(touch.clientX,touch.clientY);
      const targetTd=targetEl?targetEl.closest('td'):null;
      if (targetTd&&targetTd.dataset.date&&targetTd.dataset.date!==dateStr) moveEvent(id,targetTd.dataset.date);
    }
    el.classList.remove('touch-ready'); draggedId=null;
  };

  function moveEvent(id, newStartDateStr) {
    const ref = db.ref('shared_schedules/' + id);
    ref.once('value').then(snap => {
      const ev = snap.val();
      if (!ev || (ev.author !== user && userRole !== 'admin')) return;
      const oldStart = new Date(ev.start), oldEnd = new Date(ev.end);
      const durationMs = oldEnd - oldStart;
      if (ev.allDay) {
        const ns = new Date(newStartDateStr), ne = new Date(ns.getTime() + durationMs);
        const fmt = d => d.toISOString().split('T')[0];
        ref.update({ start:fmt(ns), end:fmt(ne) });
      } else {
        const timePart = ev.start.includes('T') ? ev.start.split('T')[1] : "09:00";
        const ns = new Date(newStartDateStr+'T'+timePart), ne = new Date(ns.getTime() + durationMs);
        const fmt = d => d.toISOString().split('.')[0].slice(0,16);
        ref.update({ start:fmt(ns), end:fmt(ne) });
      }
    });
  }

  /* ── Holiday fetch ── */
  async function fetchAllHolidays(year) {
    if (!googleApiKey) return;
    holidayData = {};
    const calendars = [
      { id:'en.indonesian#holiday@group.v.calendar.google.com' },
      { id:'ko.south_korea#holiday@group.v.calendar.google.com' }
    ];
    const timeMin = `${year}-01-01T00:00:00Z`, timeMax = `${year}-12-31T23:59:59Z`;
    try {
      await Promise.all(calendars.map(async (cal) => {
        const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(cal.id)}/events?key=${googleApiKey}&timeMin=${timeMin}&timeMax=${timeMax}&singleEvents=true`;
        const data = await (await fetch(url)).json();
        if (data.items) data.items.forEach(ev => {
          const date = ev.start.date;
          holidayData[date] = holidayData[date] ? holidayData[date]+', '+ev.summary : ev.summary;
        });
      }));
      renderSchedule();
    } catch(e) { console.error("Holiday API error:", e); renderSchedule(); }
  }

  /* ── Render ── */
  function renderSchedule() {
    /* Guard: DOM must still exist */
    const tbody = document.getElementById('scheduleBody');
    if (!tbody) { if (_scheduleRef) { _scheduleRef.off(); _scheduleRef = null; } return; }

    const year = calViewDate.getFullYear(), month = calViewDate.getMonth();
    const firstDay = new Date(year,month,1).getDay();
    const lastDate  = new Date(year,month+1,0).getDate();

    const mye = document.getElementById('calMonthYear');
    if (mye) mye.innerText = calViewDate.toLocaleString('en-US',{month:'long',year:'numeric'});

    if (_scheduleRef) _scheduleRef.off();
    _scheduleRef = db.ref('shared_schedules');

    _scheduleRef.on('value', snap => {
      const tbody2 = document.getElementById('scheduleBody');
      if (!tbody2) { _scheduleRef.off(); _scheduleRef=null; return; }

      const events = snap.val() || {};
      tbody2.innerHTML = '';

      /* Stats */
      (function updateStats() {
        const monthStr = `${year}-${String(month+1).padStart(2,'0')}`;
        const todayNow = new Date().toISOString().split('T')[0];
        let total=0, mine=0, upcoming=0, urgent=0;
        Object.values(events).forEach(ev => {
          const sDate = ev.start.split('T')[0];
          if (!sDate.startsWith(monthStr)) return;
          total++; if(ev.author===user) mine++; if(sDate>=todayNow) upcoming++; if(ev.category==='urgent') urgent++;
        });
        const els = {statTotal:total,statMine:mine,statUpcoming:upcoming,statUrgent:urgent};
        for (const [id,v] of Object.entries(els)) { const el=document.getElementById(id); if(el) el.innerText=v; }
      })();

      /* Upcoming list */
      (function renderUpcoming() {
        const listEl = document.getElementById('upcomingList'); if (!listEl) return;
        const todayNow = new Date().toISOString().split('T')[0];
        const monthStr = `${year}-${String(month+1).padStart(2,'0')}`;
        const upcoming = Object.entries(events)
          .filter(([,ev])=>{ const s=ev.start.split('T')[0]; return s>=todayNow&&s.startsWith(monthStr); })
          .sort(([,a],[,b])=>a.start.localeCompare(b.start))
          .slice(0,8);
        if (!upcoming.length) {
          listEl.innerHTML=`<p style="font-size:12px;color:var(--c-muted);font-style:italic;text-align:center;padding:16px;">No upcoming events this month.</p>`;
          return;
        }
        listEl.innerHTML = upcoming.map(([id,ev]) => {
          const sDate=ev.start.split('T')[0];
          const isToday=(sDate===todayNow);
          const color=ev.adminMemo?catColors.admin:(catColors[ev.category]||catColors.default);
          const timeStr=ev.allDay?'All Day':(ev.start.includes('T')?ev.start.split('T')[1].slice(0,5):'');
          const evJson=JSON.stringify(ev).replace(/"/g,'&quot;');
          return `<div class="sc-upcoming-item" onclick="window.openEditModal('${id}',${evJson})">
            <div class="sc-upcoming-bar" style="background:${color};"></div>
            <div style="flex:1;min-width:0;">
              <div style="display:flex;align-items:center;gap:8px;">
                <span class="sc-upcoming-name" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${ev.title}</span>
                ${isToday?`<span class="sc-upcoming-badge">TODAY</span>`:''}
              </div>
              <div class="sc-upcoming-meta">${sDate.substring(5).replace('-','/')}${timeStr?` · ${timeStr}`:''} ${ev.author?`· ${ev.author}`:''}</div>
            </div>
          </div>`;
        }).join('');
      })();

      /* Calendar grid */
      const sortedEvents = Object.keys(events).map(id=>({id,...events[id],sDate:events[id].start.split('T')[0],eDate:events[id].end.split('T')[0]}))
        .sort((a,b)=>(new Date(b.eDate)-new Date(b.sDate))||a.sDate.localeCompare(b.sDate));

      /* Slot assignment */
      const eventSlots={}, dayOccupancy={};
      sortedEvents.forEach(ev=>{
        let slot=0;
        while(true){
          let ok=true;
          for(let d=new Date(ev.sDate);d<=new Date(ev.eDate);d.setDate(d.getDate()+1)){
            const dStr=d.toISOString().split('T')[0];
            if(dayOccupancy[dStr]?.has(slot)){ok=false;break;}
          }
          if(ok){
            for(let d=new Date(ev.sDate);d<=new Date(ev.eDate);d.setDate(d.getDate()+1)){
              const dStr=d.toISOString().split('T')[0];
              if(!dayOccupancy[dStr]) dayOccupancy[dStr]=new Set();
              dayOccupancy[dStr].add(slot);
            }
            eventSlots[ev.id]=slot; break;
          }
          slot++;
        }
      });

      let dateNum=1;
      for(let i=0;i<6;i++){
        const tr=document.createElement('tr');
        let weekDates=[], maxSlots=0, hasHoliday=false;
        for(let j=0;j<7;j++){
          if((i===0&&j<firstDay)||dateNum>lastDate){weekDates.push(null);}
          else{
            const dStr=`${year}-${String(month+1).padStart(2,'0')}-${String(dateNum).padStart(2,'0')}`;
            weekDates.push(dStr);
            if(holidayData[dStr]) hasHoliday=true;
            dateNum++;
          }
        }
        weekDates.forEach(dStr=>{
          if(dStr&&dayOccupancy[dStr]){
            const ms=Math.max(...Array.from(dayOccupancy[dStr]),-1);
            if(ms+1>maxSlots) maxSlots=ms+1;
          }
        });
        const baseTop = hasHoliday ? 58 : 38;
        const rowH = Math.max(120, baseTop + maxSlots*28 + 14);
        tr.style.height = rowH + 'px';

        weekDates.forEach((dStr,j)=>{
          const td=document.createElement('td');
          if(dStr){
            td.dataset.date=dStr;
            td.ondragover =(e)=>window.handleDragOver(e);
            td.ondragleave=(e)=>window.handleDragLeave(e);
            td.ondrop     =(e)=>window.handleDrop(e,dStr);
            td.onclick    =(e)=>{ if(e.target.tagName==='TD') window.openAddModal(dStr); };

            const isSun=(j===0), isSat=(j===6), isToday=(dStr===todayStr), holidayName=holidayData[dStr];

            if(isSun||holidayName) td.classList.add('td-sun');
            else if(isSat) td.classList.add('td-sat');
            if(isToday) td.classList.add('today-highlight');

            let numCls='date-text';
            if(isToday) numCls+=' is-today';
            else if(isSun||holidayName) numCls+=' sun-color holi-color';
            else if(isSat) numCls+=' sat-color';

            let html=`<div class="date-wrapper">
              <span class="${numCls}">${parseInt(dStr.split('-')[2])}</span>
              ${holidayName?`<div class="holiday-label">${holidayName}</div>`:''}
            </div>`;

            sortedEvents.filter(ev=>dStr>=ev.sDate&&dStr<=ev.eDate).forEach(ev=>{
              if(dStr===ev.sDate||j===0){
                const slot=eventSlots[ev.id];
                const span=Math.min(Math.ceil((new Date(ev.eDate)-new Date(dStr))/86400000)+1,7-j);
                const isCont=dStr>ev.sDate?'continued-from-prev':'';
                const willCont=ev.eDate>(weekDates[j+span-1]||'9999-12-31')?'continues-to-next':'';
                const evData=JSON.stringify(ev).replace(/"/g,'&quot;');
                const catClass=ev.adminMemo?'bg-cat-admin':`bg-cat-${ev.category||'default'}`;
                html+=`<div onclick="event.stopPropagation();window.openEditModal('${ev.id}',${evData})"
                  class="event-item ${isCont} ${willCont} ${catClass}"
                  style="top:${baseTop+slot*28}px;width:calc(${span*100}% - 8px);"
                  draggable="true"
                  ondragstart="window.handleDragStart(event,'${ev.id}')"
                  ondragend="window.handleDragEnd(event)"
                  ontouchstart="window.handleTouchStart(event,'${ev.id}')"
                  ontouchend="window.handleTouchEnd(event,'${ev.id}','${dStr}')">
                  <span class="ev-title-text">${isCont?'':ev.title}</span>
                  <span class="ev-author-text">${isCont?'':(ev.author||'Staff')}</span>
                </div>`;
              }
            });
            td.innerHTML=html;
          }
          tr.appendChild(td);
        });
        tbody2.appendChild(tr);
        if(dateNum>lastDate) break;
      }
    });
  }

  /* ── Flatpickr init ── */
  const baseConfig = { enableTime:true, dateFormat:"Y-m-d\\TH:i", altInput:true, altFormat:"Y-m-d h:i K", static:true, disableMobile:true };
  startPicker = flatpickr("#evStart", baseConfig);
  endPicker   = flatpickr("#evEnd",   baseConfig);

  /* ── Cleanup on tab switch ── */
  window._leavePageCleanup = function () {
    if (_scheduleRef) { _scheduleRef.off(); _scheduleRef=null; }
  };

  initCalendarSystem();
})();
</script>
