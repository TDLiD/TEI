/* ── Online Staff Panel ── */
(function initOnlineTracker() {
    function formatElapsed(ms) {
        const s = Math.floor(ms / 1000);
        if (s < 60) return `${s}s ago`;
        const m = Math.floor(s / 60);
        if (m < 60) return `${m}m ago`;
        return `${Math.floor(m/60)}h ago`;
    }
    function formatHHMM(ts) {
        const d = new Date(ts);
        return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    function renderOnlinePanel(userList) {
        const listEl  = document.getElementById('onlineUsersList');
        const countEl = document.getElementById('onlineCountBadge');
        if (!listEl) return;
        const now = Date.now();
        const online = userList.filter(u => u.online_sts === 'ON').sort((a, b) => (b.lastSeen || 0) - (a.lastSeen || 0));
        if (countEl) countEl.textContent = online.length;
        if (online.length === 0) { listEl.innerHTML = `<div class="online-empty">NO ACTIVE SESSIONS</div>`; return; }
        listEl.innerHTML = online.map((u, i) => {
            const lastSeen = u.lastSeen || now;
            const elapsed  = now - lastSeen;
            const timeStr  = elapsed < 120000 ? 'LIVE' : formatElapsed(elapsed);
            const loginStr = u.loginTime ? formatHHMM(u.loginTime) : '—';
            const imgSrc   = u.profileImg ? (u.profileImg.includes('/') ? u.profileImg : `images/profile/${u.profileImg}`) : `https://ui-avatars.com/api/?name=${encodeURIComponent(u.name || u.id)}&background=0D1A24&color=64748b&size=64`;
            const isLive   = elapsed < 120000;
            return `<div class="online-user-item" style="animation-delay:${i*0.05}s">
                <img src="${imgSrc}" class="online-user-avatar" alt="${u.name || u.id}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(u.name || u.id)}&background=0D1A24&color=64748b'">
                <div class="flex flex-col flex-1 min-w-0">
                    <span class="online-user-name">${u.displayName || u.name || u.id}</span>
                    <span style="font-size:0.46rem;color:#475569;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;">${u.role || 'Staff'} · IN ${loginStr}</span>
                </div>
                <div class="flex flex-col items-end gap-0.5">
                    <span class="online-user-time">${timeStr}</span>
                    ${isLive ? '<span class="online-live-dot"></span>' : ''}
                </div>
            </div>`;
        }).join('');
    }

    function startOnlineListener() {
        if (typeof db === 'undefined') { setTimeout(startOnlineListener, 500); return; }
        db.ref('users').on('value', snap => {
            const usersData = snap.val() || {};
            const userList = Object.keys(usersData).map(uid => ({ id: uid, ...usersData[uid] }));
            renderOnlinePanel(userList);
        });
    }
    document.addEventListener('DOMContentLoaded', () => { setTimeout(startOnlineListener, 800); });
})();

/* ── Auto-logout timer ── */
(function() {
    const INACTIVE_TIMEOUT = 10 * 60 * 1000;
    let remainingTime = INACTIVE_TIMEOUT;
    let timerInterval = null;
    let logoutTimeout = null;

    function updateTimerUI() {
        const timerEl = document.getElementById('logout-timer');
        if (!timerEl) return;
        const minutes = Math.floor(remainingTime / 60000);
        const seconds = Math.floor((remainingTime % 60000) / 1000);
        timerEl.textContent = `${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
        timerEl.style.color = remainingTime <= 60000 ? '#ef4444' : 'var(--da3)';
    }

    function resetInactivityTimer() {
        remainingTime = INACTIVE_TIMEOUT;
        updateTimerUI();
        if (logoutTimeout) clearTimeout(logoutTimeout);
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            remainingTime -= 1000;
            if (remainingTime <= 0) clearInterval(timerInterval);
            updateTimerUI();
        }, 1000);
        logoutTimeout = setTimeout(() => {
            if (typeof window.logout === 'function') {
                const name = sessionStorage.getItem('loggedInUser') || localStorage.getItem('loggedInUser');
                const finalizeLogout = () => {
                    sessionStorage.clear();
                    localStorage.removeItem('loggedInUser');
                    firebase.auth().signOut().finally(() => { window.location.replace("index.html"); });
                };
                const dbRef = typeof database !== 'undefined' ? database : (typeof firebase !== 'undefined' ? firebase.database() : null);
                if (name && dbRef) {
                    dbRef.ref('users/' + name).update({ online_sts: 'OFF' }).then(finalizeLogout).catch(finalizeLogout);
                } else finalizeLogout();
            }
        }, INACTIVE_TIMEOUT);
    }

    ['mousedown','mousemove','keypress','scroll','touchstart'].forEach(event => {
        window.addEventListener(event, resetInactivityTimer, { passive: true });
    });
    document.addEventListener('DOMContentLoaded', () => { resetInactivityTimer(); });
})();

/* ── Browser close hook ── */
function setupDisconnectHook() {
    const name  = sessionStorage.getItem('loggedInUser') || localStorage.getItem('loggedInUser');
    const dbRef = typeof database !== 'undefined' ? database : (typeof firebase !== 'undefined' ? firebase.database() : null);
    if (name && dbRef) {
        dbRef.ref('users/' + name + '/online_sts').onDisconnect().set('OFF');
    }
}
document.addEventListener('DOMContentLoaded', () => { setTimeout(setupDisconnectHook, 1000); });

/* ── Logout ── */
window.logout = function() {
    if (!confirm("Log out?")) return;
    const name = sessionStorage.getItem('loggedInUser');
    const doLogout = () => {
        sessionStorage.clear();
        localStorage.removeItem('loggedInUser');
        firebase.auth().signOut().finally(() => { window.location.replace("index.html"); });
    };
    const dbRef = typeof database !== 'undefined' ? database : (typeof firebase !== 'undefined' ? firebase.database() : null);
    if (name && dbRef) {
        dbRef.ref('users/' + name).update({ online_sts: 'OFF' }).then(doLogout).catch(doLogout);
    } else doLogout();
};

/* ── Init ── */
document.addEventListener('DOMContentLoaded', () => {
    const urlParams   = new URLSearchParams(window.location.search);
    const tabParam    = urlParams.get('tab');
    const initialPage = sessionStorage.getItem('targetPage');
    sessionStorage.removeItem('targetPage');
    setTimeout(() => {
        if (tabParam) { switchTab(tabParam); }
        else if (initialPage) {
            if      (initialPage.includes('report'))    switchTab('work');
            else if (initialPage.includes('calendar'))  switchTab('schedule');
            else if (initialPage.includes('vacation'))  switchTab('vacation');
            else if (initialPage.includes('statistic')) switchTab('statistic');
            else if (initialPage.includes('photos'))    switchTab('photos');
            else if (initialPage.includes('promo'))     switchTab('promo');
            else if (initialPage.includes('setting'))   switchTab('setting');
            else switchTab('dash');
        } else { switchTab('dash'); }
    }, 200);
});


/* ── 3D interaction layer ──
   Pointer tilt + glare on the sidebar keys/cards and a soft parallax on the
   background orbs. Desktop (hover + fine pointer) only, and skipped entirely
   when the OS asks for reduced motion. Touch devices keep the press effects
   that are pure CSS. */
(function init3DInteractions() {
    const fine = window.matchMedia('(hover:hover) and (pointer:fine)');
    const calm = window.matchMedia('(prefers-reduced-motion: reduce)');
    if (!fine.matches || calm.matches) return;

    let cur = null, pt = null, raf = 0, par = null, parRaf = 0;
    const VARS = ['--rx', '--ry', '--mx', '--my'];
    const reset = (el) => { if (el) VARS.forEach(v => el.style.removeProperty(v)); };

    function paintTilt() {
        raf = 0;
        if (!cur || !pt) return;
        const r = cur.getBoundingClientRect();
        if (!r.width || !r.height) return;
        const px = Math.min(1, Math.max(0, (pt.x - r.left) / r.width));
        const py = Math.min(1, Math.max(0, (pt.y - r.top)  / r.height));
        const m  = parseFloat(cur.dataset.tilt) || 6;
        cur.style.setProperty('--ry', ((px - 0.5) *  2 * m).toFixed(2) + 'deg');
        cur.style.setProperty('--rx', ((0.5 - py) *  2 * m).toFixed(2) + 'deg');
        cur.style.setProperty('--mx', (px * 100).toFixed(1) + '%');
        cur.style.setProperty('--my', (py * 100).toFixed(1) + '%');
    }

    function paintParallax() {
        parRaf = 0;
        if (!par) return;
        document.body.style.setProperty('--pxo', ((par.x / window.innerWidth  - 0.5) * 36).toFixed(1));
        document.body.style.setProperty('--pyo', ((par.y / window.innerHeight - 0.5) * 36).toFixed(1));
    }

    document.addEventListener('pointermove', (e) => {
        if (e.pointerType === 'touch') return;
        const el = e.target && e.target.closest ? e.target.closest('.sb-tilt') : null;
        if (el !== cur) { reset(cur); cur = el; }
        if (cur) { pt = { x: e.clientX, y: e.clientY }; if (!raf) raf = requestAnimationFrame(paintTilt); }
        par = { x: e.clientX, y: e.clientY };
        if (!parRaf) parRaf = requestAnimationFrame(paintParallax);
    }, { passive: true });

    document.documentElement.addEventListener('mouseleave', () => { reset(cur); cur = null; });
})();

/* ── Background music player (auto-play, floating + sidebar mini UIs) ── */
(function initBgmPlayer() {
    const bgm = document.getElementById('bgmAudio');
    if (!bgm) return;

    /* 요일별 곡 목록 — days: 0=일, 1=월, 2=화, 3=수, 4=목, 5=금, 6=토 */
    const ALL_TRACKS = [
        { title: "Monday - My Heart Will Go On",    src: "music/monday_My_Heart_Will_Go_On.mp3",  days: [1] },
        { title: "Tuesday - Stay with me",          src: "music/tuesday_Stay_with_me.mp3",        days: [2] },
        { title: "Wednesday - Farinelli",           src: "music/wednedsay_Farinelli.mp3",         days: [3] },
        { title: "Thursday - Marriage of Figaro",   src: "music/thursday_Marriage_of_Figaro.mp3", days: [4] },
        { title: "Chopin - Nocturne No. 20",        src: "music/Chopin_Nocturne_No_20.mp3",       days: [5, 6, 0] }
    ];

    /* 오늘 요일 (인도네시아 시간 기준, index.html과 동일). 테스트: staff.html?day=3 */
    const _dp = new URLSearchParams(location.search).get('day');
    const todayDow = (_dp !== null && /^[0-6]$/.test(_dp))
        ? Number(_dp)
        : new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Jakarta' })).getDay();

    const playlist = ALL_TRACKS.filter(t => t.days.includes(todayDow));


    let currentTrackIndex = 0;

    const playlistDropdown = document.getElementById('playlistDropdown');
    const playlistItemsEl  = document.getElementById('playlistItems');
    const playlistArrow    = document.getElementById('playlistArrow');

    /* Every play/pause icon, "now playing" equalizer, and track-title
       label on the page (floating bar + sidebar full + sidebar mini)
       shares these two sync helpers, so all three stay in lockstep
       no matter which one the user actually clicked. */
    function syncPlayIcons(isPlaying) {
        document.querySelectorAll('.js-play-icon').forEach(el => el.classList.toggle('hidden', isPlaying));
        document.querySelectorAll('.js-pause-icon').forEach(el => el.classList.toggle('hidden', !isPlaying));
        document.querySelectorAll('.sp-eq').forEach(el => el.classList.toggle('is-playing', isPlaying));
        document.body.classList.toggle('bgm-playing', isPlaying);   /* spins the vinyl */
    }
    function syncTrackTitle(title) {
        document.querySelectorAll('.js-track-title').forEach(el => { el.textContent = title; });
    }

    function renderPlaylistUI() {
        if (!playlistItemsEl) return;
        playlistItemsEl.innerHTML = '';
        playlist.forEach((track, idx) => {
            const li = document.createElement('li');
            li.className = `playlist-item ${idx === currentTrackIndex ? 'active' : ''}`;
            li.innerHTML = `<span>${idx + 1}. ${track.title}</span>${idx === currentTrackIndex ? '<span>♬</span>' : ''}`;
            li.onclick = (e) => { e.stopPropagation(); playTrack(idx); };
            playlistItemsEl.appendChild(li);
        });
    }

    function playTrack(index) {
        currentTrackIndex = index;
        const track = playlist[currentTrackIndex];
        bgm.src = track.src;
        syncTrackTitle(track.title);
        document.querySelectorAll('.js-progress-fill').forEach(el => { el.style.width = '0%'; });
        renderPlaylistUI();
        bgm.play().catch(() => { syncTrackTitle('Click to play'); });
    }

    window.togglePlayPause = function() {
        if (bgm.paused) { bgm.play().catch(() => {}); }
        else { bgm.pause(); }
    };
    window.prevTrack = function() {
        currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
        playTrack(currentTrackIndex);
    };
    window.nextTrack = function() {
        currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
        playTrack(currentTrackIndex);
    };
    bgm.addEventListener('ended', () => window.nextTrack());
    bgm.addEventListener('play',  () => {
        syncPlayIcons(true);
        /* autoplay may have been blocked earlier ("Click to play"): restore the real title once playback starts */
        const t = playlist[currentTrackIndex];
        if (t) syncTrackTitle(t.title);
    });
    /* progress bar (sidebar card): fills while playing, click to seek */
    bgm.addEventListener('timeupdate', () => {
        if (!bgm.duration) return;
        const pct = (bgm.currentTime / bgm.duration) * 100;
        document.querySelectorAll('.js-progress-fill').forEach(el => { el.style.width = pct + '%'; });
    });
    document.querySelectorAll('.js-progress').forEach(bar => bar.addEventListener('click', (e) => {
        if (!bgm.duration) return;
        const r = bar.getBoundingClientRect();
        bgm.currentTime = bgm.duration * Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    }));
    bgm.addEventListener('pause', () => syncPlayIcons(false));

    window.togglePlaylistMenu = function() {
        if (!playlistDropdown) return;
        const isHidden = playlistDropdown.classList.toggle('hidden');
        if (playlistArrow) playlistArrow.style.transform = isHidden ? 'rotate(0deg)' : 'rotate(180deg)';
    };
    document.addEventListener('click', (e) => {
        const container = document.getElementById('playerContainer');
        if (container && !container.contains(e.target)) {
            if (playlistDropdown) playlistDropdown.classList.add('hidden');
            if (playlistArrow) playlistArrow.style.transform = 'rotate(0deg)';
        }
    });

    function initPlayer() {
        renderPlaylistUI();
        playTrack(0);

        const enableAudioOnInteraction = () => {
            if (bgm.paused) { bgm.play().catch(() => {}); }
            document.removeEventListener('click', enableAudioOnInteraction);
            document.removeEventListener('keydown', enableAudioOnInteraction);
            document.removeEventListener('touchstart', enableAudioOnInteraction);
        };
        document.addEventListener('click', enableAudioOnInteraction);
        document.addEventListener('keydown', enableAudioOnInteraction);
        document.addEventListener('touchstart', enableAudioOnInteraction);
    }
    document.addEventListener('DOMContentLoaded', initPlayer);
})();
