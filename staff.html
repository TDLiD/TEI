<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - DAILY SYSTEM</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-database-compat.js"></script>

    <script src="staff-level.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />

    <style>
        body { font-family: "Pretendard", sans-serif; background-color: #000000; color: #f8fafc; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        .tab-btn { transition: all 0.3s; position: relative; display: flex; align-items: center; gap: 0.5rem; white-space: nowrap; }
        .tab-active { color: #3b82f6; font-weight: 900; background: rgba(59, 130, 246, 0.1); border-radius: 0.75rem; }
        .tab-inactive { color: #64748b; }
        @media (min-width: 1024px) {
            .tab-active::after { content: ''; position: absolute; bottom: -4px; left: 20%; width: 60%; height: 3px; background: #3b82f6; border-radius: 10px; }
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .animate-fadeIn { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .nav-profile-img {
            width: 60px !important;
            height: 60px !important;
            border-radius: 50%;
            border: 2px solid #334155;
            object-fit: cover;
            display: block;
            margin-bottom: 8px;
            transition: all 0.3s ease;
        }

        @media (min-width: 1024px) {
            .nav-profile-img {
                width: 100px !important;
                height: 100px !important;
            }
        }
    </style>
</head>
<body class="flex flex-col lg:flex-row min-h-screen bg-slate-950">

    <aside class="w-full lg:w-72 lg:h-screen bg-black/50 border-b lg:border-b-0 lg:border-r border-slate-800 backdrop-blur-xl sticky top-0 z-[100] flex-shrink-0">
        <div class="p-4 lg:p-8 flex flex-col h-full">
            <div class="flex lg:flex-col justify-between items-center lg:items-start gap-4 mb-6 lg:mb-12">
                <div class="w-full">
                    <h1 class="text-xl lg:text-2xl font-black tracking-tighter text-white uppercase">Daily <span class="text-blue-500">System</span></h1>
                    
                    <div class="flex items-center gap-3 mt-4">
                        <div id="navEmojiContainer"></div>
                        <div class="flex flex-col">
                            <p id="desktopUser" class="text-[10px] font-bold text-slate-500 uppercase tracking-widest"></p>
                            <span class="text-[8px] text-emerald-500 font-bold">● ONLINE</span>
                        </div>
                    </div>

                    <div id="levelDisplayContainer" class="w-full"></div>
                </div>
                <button onclick="logout()" class="text-[10px] font-black bg-slate-800 hover:bg-red-900/30 text-slate-400 hover:text-red-400 px-3 py-1.5 rounded-full border border-slate-700 transition uppercase flex-shrink-0">Logout</button>
            </div>

            <nav class="flex lg:flex-col gap-1 overflow-x-auto no-scrollbar pb-2 lg:pb-0 flex-grow">
                <button onclick="switchTab('dash')" id="tabDash" class="tab-btn px-4 py-3 text-xs md:text-sm uppercase tracking-widest tab-active">
                    <span class="lg:inline hidden">🏠</span> Dashboard
                </button>
                <button onclick="switchTab('schedule')" id="tabSchedule" class="tab-btn px-4 py-3 text-xs md:text-sm uppercase tracking-widest tab-inactive">
                    <span class="lg:inline hidden">📅</span> Schedule
                </button>
                <button onclick="switchTab('leave')" id="tabLeave" class="tab-btn px-4 py-3 text-xs md:text-sm uppercase tracking-widest tab-inactive">
                    <span class="lg:inline hidden">🏖️</span> Leave Application
                </button>
                <button onclick="switchTab('work')" id="tabWork" class="tab-btn px-4 py-3 text-xs md:text-sm uppercase tracking-widest tab-inactive">
                    <span class="lg:inline hidden">📝</span> Work Report
                </button>
                <button onclick="switchTab('statistic')" id="tabStatistic" class="tab-btn px-4 py-3 text-xs md:text-sm uppercase tracking-widest tab-inactive">
                    <span class="lg:inline hidden">📈</span> Statistics
                </button>
                <button onclick="switchTab('setting')" id="tabSetting" class="tab-btn px-4 py-3 text-xs md:text-sm uppercase tracking-widest tab-inactive">
                    <span class="lg:inline hidden">⚙️</span> Settings
                </button>
            </nav>

            <div class="hidden lg:block pt-4 mt-4 border-t border-slate-800/50">
                <p class="text-[9px] text-slate-600 font-bold tracking-widest uppercase mb-2 ml-4">External Link</p>
                <a href="https://tdlid.github.io" target="_blank" class="flex items-center gap-2 px-4 py-3 text-xs uppercase tracking-widest text-slate-400 hover:text-white transition-colors bg-slate-900/50 rounded-xl border border-slate-800">
                    <span>🌐</span> TDLiD Homepage
                </a>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col min-w-0 h-screen overflow-y-auto overflow-x-hidden p-4 lg:p-10">
        <div class="max-w-[1400px] w-full mx-auto">
            <div id="contentFrame" class="animate-fadeIn">
                <div class="flex items-center justify-center h-64">
                    <div class="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                </div>
            </div>
            <div id="footerContainer" class="mt-12 opacity-50"></div>
        </div>
    </main>

    <script>
        const loggedInUser = sessionStorage.getItem('loggedInUser');
        if (!loggedInUser) { location.href = "index.html"; }
        
        const firebaseConfig = { databaseURL: "https://tdlid-dailyreport-default-rtdb.firebaseio.com" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        // 1. 유저 정보 로드 및 레벨 시스템 실행
        if(loggedInUser) {
            document.getElementById('desktopUser').innerText = loggedInUser;
            
            firebase.database().ref('users/' + loggedInUser).on('value', snap => {
                const userData = snap.val();
                const profileImg = userData?.profileImg || '1.webp';
                const emojiContainer = document.getElementById('navEmojiContainer');
                
                if(emojiContainer) {
                    emojiContainer.innerHTML = `<img src="images/profile/${profileImg}" class="nav-profile-img shadow-xl shadow-blue-500/10">`;
                }

                // 레벨 시스템 안전하게 시작
                startLevelSystem();
            });
        }

        // 레벨 시스템 스크립트가 로드되었는지 확인 후 실행하는 함수
        function startLevelSystem() {
            if (window.LevelSystem && typeof window.LevelSystem.init === 'function') {
                window.LevelSystem.init(loggedInUser);
            } else {
                // 파일 로딩 대기를 위해 재시도
                setTimeout(startLevelSystem, 300);
            }
        }

        // 2. 탭 전환 로직
        function switchTab(type) {
            const tabs = {
                'dash': document.getElementById('tabDash'),
                'schedule': document.getElementById('tabSchedule'),
                'leave': document.getElementById('tabLeave'),
                'work': document.getElementById('tabWork'),
                'statistic': document.getElementById('tabStatistic'),
                'setting': document.getElementById('tabSetting')
            };
            
            Object.values(tabs).forEach(tab => {
                if(tab) tab.className = 'tab-btn px-4 py-3 text-xs md:text-sm uppercase tracking-widest tab-inactive';
            });
            
            if(tabs[type]) {
                tabs[type].className = 'tab-btn px-4 py-3 text-xs md:text-sm uppercase tracking-widest tab-active';
                tabs[type].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
            
            const urls = {
                'dash': 'staff_main.html',
                'schedule': 'staff_calendar.html',
                'leave': 'staff_leave.html',
                'work': 'staff_report.html',
                'statistic': 'staff_statistic.html',
                'setting': 'staff_setting.html',
'all': 'staff_allatt.html' // 👈 이 줄을 반드시 추가하세요!
            };

            loadHTML(urls[type], function() {
                if (type === 'leave' && typeof window.initLeavePage === 'function') { window.initLeavePage(); }
                else if (type === 'dash' && typeof window.initDashboard === 'function') { window.initDashboard(); }
            });
        }

        // 3. 페이지 로더
        async function loadHTML(url, callback) {
            try {
                if (!url) return;
                const frame = document.getElementById('contentFrame');
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                const text = await response.text();
                frame.innerHTML = text;
                
                const footerContainer = document.getElementById('footerContainer');
                if (!footerContainer.innerHTML) {
                    const footerRes = await fetch('staff_footer.html');
                    const footerText = await footerRes.text();
                    footerContainer.innerHTML = footerText;
                    executeScripts(footerContainer);
                }

                executeScripts(frame);
                if (typeof callback === 'function') callback();
                
            } catch (e) { 
                console.error("Failed to load page:", e); 
                document.getElementById('contentFrame').innerHTML = 
                    `<div class="p-10 text-center text-rose-500 font-bold uppercase">File Not Found: ${url}</div>`;
            }
        }

        function executeScripts(container) {
            const scripts = container.querySelectorAll('script');
            scripts.forEach(oldScript => {
                const newScript = document.createElement('script');
                if (oldScript.src) {
                    newScript.src = oldScript.src;
                    newScript.async = false;
                } else {
                    newScript.textContent = oldScript.textContent;
                }
                document.head.appendChild(newScript).parentNode.removeChild(newScript);
            });
        }

        // 4. 로그아웃
        function logout() { 
            if (confirm("Are you sure you want to log out?")) {
                sessionStorage.clear();
                localStorage.removeItem('loggedInUser');
                window.location.replace("index.html");
            }
        }

        // 5. 자동 로그아웃 (보안)
        (function() {
            let timeoutTimer;
            const INACTIVITY_TIME = 15 * 60 * 1000; 

            function autoLogout() {
                sessionStorage.clear();
                location.href = "index.html";
            }

            function resetTimer() {
                clearTimeout(timeoutTimer);
                timeoutTimer = setTimeout(autoLogout, INACTIVITY_TIME);
            }

            ['mousedown', 'mousemove', 'keypress', 'scroll', 'touchstart', 'click'].forEach(evt => {
                window.addEventListener(evt, resetTimer, true);
            });
            resetTimer();
        })();

        // 초기 대시보드 로드
        switchTab('dash');
    </script>
</body>
</html>
