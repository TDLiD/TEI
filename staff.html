if (!loggedInUser) { location.href = "index.html"; }

// 2. Firebase 초기화 (이 정보는 노출되어도 DB 규칙이 설정되어 있다면 안전합니다)

    appId: "1:922333077514:web:8914e5b06ac1f417707ff3",

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function preloadUsersData() {
    db.ref('users').once('value', snap => {

    }).catch(e => console.error("Pre-load error:", e));
}

// Firebase 초기화 후 즉시 실행
preloadUsersData();

// 4. DB에서 GoogleCAPI 값을 동적으로 로드
db.ref('settings/config/GoogleCAPI').once('value').then((snap) => {
    dynamicApiKey = snap.val();
    console.log("API Key loaded from Firebase.");
    
    // [중요] 키가 로드된 후에 실행되어야 하는 함수들을 여기서 호출합니다.

    // fetchJakartaWeather(dynamicApiKey); 
    
}).catch(e => console.error("Key Load Error:", e));

const PROFILE_IMAGES = [
    // 기본 WebP 이미지
    'image-001.webp', 'image-002.webp', 'image-003.webp', 'image-004.webp', 'image-005.webp',

    'image-21.gif', 'image-22.gif', 'image-23.gif', 'image-24.gif', 'image-25.gif',

    'image-21.jfif', 'image-22.jpg', 'image-23.jfif', 'Yuda.png'
];

window.openProfileModal = function(title, bodyHtml) { const m = document.getElementById('profileCustomModal'); document.getElementById('modalTitle').innerText = title; document.getElementById('modalBody').innerHTML = bodyHtml; m.classList.remove('hidden'); };
window.closeProfileModal = () => document.getElementById('profileCustomModal').classList.add('hidden');

/* ── 프로필 관리 관련 수정 ── */
let tempSelectedProfileImg = null; // 선택된 이미지를 임시로 담을 변수

window.openProfileImagePicker = function() { 
    tempSelectedProfileImg = null; 
    
    let gridHtml = `<div class="grid grid-cols-3 sm:grid-cols-4 gap-4">`; 
    PROFILE_IMAGES.forEach(i => { 
        gridHtml += `
            <div onclick="selectProfileTemp(this, '${i}')" class="profile-opt group relative aspect-square rounded-2xl overflow-hidden cursor-pointer border-2 border-transparent hover:border-white/20 transition-all shadow-lg">
                <img src="images/profile/${i}" class="w-full h-full object-cover">
            </div>`; 
    }); 
    gridHtml += `</div>`; 

    // 1. modalBody에는 이미지 그리드만 넣습니다.
    document.getElementById('modalBody').innerHTML = gridHtml;
    
    // 2. modalBody 다음에 버튼 영역을 추가합니다. (기존 영역이 있다면 교체)
    let footerHtml = `
        <div class="modal-footer-btns px-8 pb-8">
            <button class="btn-modal-cancel btn-3d" onclick="closeProfileModal()">Cancel</button>
            <button id="btnConfirmProfile" class="btn-modal-save btn-3d" onclick="confirmSaveProfile()" disabled>Save Identity</button>
        </div>
    `;
    
    // 타이틀 변경 및 모달 열기
    document.getElementById('modalTitle').innerText = 'Change Profile';
    
    // 버튼이 중복 생성되지 않도록 처리 후 삽입
    const existingFooter = document.querySelector('.modal-footer-btns');
    if(existingFooter) existingFooter.remove();
    document.getElementById('modalBody').insertAdjacentHTML('afterend', footerHtml);

    document.getElementById('profileCustomModal').classList.remove('hidden');
};

// 이미지를 클릭했을 때 (임시 선택)
window.selectProfileTemp = function(element, fileName) {
    // 모든 옵션에서 active 클래스 제거
    document.querySelectorAll('.profile-opt').forEach(opt => {
        opt.classList.remove('profile-option-active');
    });

// 스크립트 내 checkTodayBirthdays 함수 (Line 135 부근) 수정
async function checkTodayBirthdays() {
    const today = new Date();
    const tMonthDay = `${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
    const lunar = Lunar.fromDate(today);
    const lMonthDay = `${String(lunar.getMonth()).padStart(2, '0')}-${String(lunar.getDay()).padStart(2, '0')}`;
    
    // ✅ 이미 캐시된 데이터 사용
    const checkCache = () => {
        if (!cachedUsers) return;
        
        let birthdayMessages = [];
        Object.keys(cachedUsers).forEach(id => {
            const u = cachedUsers[id];
            if (!u || !u.birthday) return;
            
            const bMonthDay = u.birthday.substring(5); 
            const type = u.birthType || "Solar";
            const bDateFull = u.birthday.replace(/-/g, '.'); 
            const isSolarMatch = (type === "Solar" || type === "양력") && bMonthDay === tMonthDay;
            const isLunarMatch = (type === "Lunar" || type === "음력") && bMonthDay === lMonthDay;
            
            if (isSolarMatch || isLunarMatch) { 
                birthdayMessages.push(`${id}: ${bDateFull}`); 
            }
        });

        // UI 업데이트
        const alertBox = document.getElementById('birthdayAlert');
        const nameText = document.getElementById('birthdayNames');
        const mobileAlertBox = document.getElementById('mobileBirthdayAlert');
        const mobileNameText = document.getElementById('mobileBirthdayNames');
        const mobileDot = document.getElementById('mobile-birthday-dot');

        if (!alertBox && !mobileAlertBox) return;

        if (birthdayMessages.length > 0) {
            const namesHtml = birthdayMessages.join('<br>');
            
            if (alertBox) alertBox.classList.remove('hidden');
            if (nameText) nameText.innerHTML = namesHtml;
            if (mobileAlertBox) mobileAlertBox.classList.remove('hidden');
            if (mobileNameText) mobileNameText.innerHTML = namesHtml;
            if (mobileDot) mobileDot.classList.remove('hidden');
            
            const isMyBirthday = birthdayMessages.some(msg => msg.startsWith(loggedInUser + ":"));
            if (isMyBirthday) {
                const ub = document.getElementById('desktopUser');
                if(ub) ub.classList.replace('text-blue-400', 'text-yellow-400');
                const mub = document.getElementById('mobileUserName');
                if(mub) mub.classList.replace('text-blue-400', 'text-yellow-400');
            }
        }
    };

    // ✅ 캐시가 있으면 즉시 실행
    if (cachedUsers) {
        checkCache();
    } else {
        // 캐시 없으면 로드 후 실행
        db.ref('users').once('value', snap => {
            cachedUsers = snap.val();
            checkCache();
        });
    }
}

window.switchTab = function(t) {
    // ▼ 탭 전환 시 이전 페이지 리스너 정리
    try {
        const now = new Date();
        const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        firebase.database().ref(`attendance/${todayStr}`).off();
        firebase.database().ref('attendance').off();
        firebase.database().ref('settings/config').off();
        firebase.database().ref('settings/config/stdAttendance').off();
    } catch(e) { console.warn('Listener cleanup error:', e); }

    if (typeof window._leavePageCleanup === 'function') {
        window._leavePageCleanup();
        window._leavePageCleanup = null;
    }

    const pB = document.querySelectorAll('.pc-tab-btn'); 
    const mB = document.querySelectorAll('.mobile-tab-btn');
const tabMapping = { dash: 'staff_dashboard.html', work: 'staff_report.html', schedule: 'staff_calendar.html', vacation: 'staff_vacation.html', statistic: 'staff_statistic.html', setting: 'staff_setting.html', photos: 'staff_photos.html', all: 'staff_allatt.html' };

    const activeTab = tabMapping[t] ? t : 'dash';
    pB.forEach(b => b.classList.remove('tab-active')); 
    mB.forEach(b => b.classList.remove('mobile-tab-active'));
const navIndex = { dash: 0, work: 1, schedule: 2, vacation: 3, statistic: 4, setting: 5, photos: 6 };

    const i = navIndex[activeTab];
    if(i !== undefined) { if(pB[i]) pB[i].classList.add('tab-active'); if(mB[i]) mB[i].classList.add('mobile-tab-active'); }
    loadHTML(tabMapping[activeTab]);
}
window.loadHTML = async function(u) {
    try {
        const f = document.getElementById('contentFrame'); 
        f.innerHTML = `<div class="flex items-center justify-center h-64"><div class="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div></div>`;
        const r = await fetch(u); const h = await r.text(); f.innerHTML = h;
        const fc = document.getElementById('footerContainer'); 
        if (fc && !fc.innerHTML) { const fr = await fetch('staff_footer.html'); if(fr.ok) fc.innerHTML = await fr.text(); }
        executeScripts(f);
    } catch (e) { document.getElementById('contentFrame').innerHTML = `<div class="p-10 glass-panel text-center text-rose-500 font-black">PAGE NOT FOUND</div>`; }
}
function executeScripts(con) {
    con.querySelectorAll('script').forEach(os => {
        const ns = document.createElement('script'); Array.from(os.attributes).forEach(at => ns.setAttribute(at.name, at.value));
        if (os.src) { ns.src = os.src; ns.async = false; } else { ns.textContent = os.textContent; }
        document.head.appendChild(ns).parentNode.removeChild(ns);
    });
}
async function fetchJakartaWeather() {
    try {
        const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-6.2088&longitude=106.8456&current_weather=true');
        const data = await response.json();
        const weather = data.current_weather;
        const temp = Math.round(weather.temperature);
        const code = weather.weathercode;
        let icon = '☀️';
        if (code >= 1 && code <= 3) icon = '⛅'; 
        else if (code >= 45 && code <= 48) icon = '☁️'; 
        else if (code >= 51 && code <= 67) icon = '🌧️'; 
        else if (code >= 95) icon = '⛈️';
        if(document.getElementById('weatherTemp')) document.getElementById('weatherTemp').innerText = `${temp}°C`;
        if(document.getElementById('weatherIcon')) document.getElementById('weatherIcon').innerText = icon;
        if(document.getElementById('mobileWeatherTemp')) document.getElementById('mobileWeatherTemp').innerText = `${temp}°C`;
        if(document.getElementById('mobileWeatherIcon')) document.getElementById('mobileWeatherIcon').innerText = icon;
    } catch (error) { console.error("Weather load failed"); }
}

window.showAllStaffBirthdays = function() {

            return;
        }
        
        let html = `<div class="space-y-3">`;
        let hasBirthdayData = false;

        const userList = Object.keys(users)
            .map(key => ({ id: key, ...users[key] }))
            .sort((a, b) => a.id.localeCompare(b.id));

        userList.forEach(u => {
            if (u && u.birthday) {
                hasBirthdayData = true;
                const bType = u.birthType || "Solar";
                const bDate = u.birthday.replace(/-/g, '.');
                const pImg = (typeof u.profileImg === 'string') ? u.profileImg : 'image-001.webp';
                
                let imgSrc = "";
                if (u.id === 'Admin') {

                } else {
                    imgSrc = pImg.includes('images/') ? pImg : `images/profile/${pImg}`;
                }

                html += `
                <div class="flex items-center justify-between bg-white/5 p-3 rounded-2xl border border-white/5 hover:bg-white/10 transition-colors">
                    <div class="flex items-center gap-3">
                        <img src="${imgSrc}" 
                             class="w-10 h-10 rounded-full border border-white/10 object-cover shadow-sm" 
                             loading="lazy"
                             onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(u.id)}&background=0D8ABC&color=fff'">
                        <div class="flex flex-col">
                            <span class="text-xs font-black text-white uppercase leading-tight">${u.displayName || u.id}</span>
                            <span class="text-[9px] text-slate-500 font-bold uppercase tracking-widest mt-0.5">${u.role || 'Staff'}</span>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="text-[9px] font-black text-blue-400 uppercase tracking-widest italic mb-0.5">${bType}</div>
                        <div class="text-[11px] font-black text-slate-200 tracking-tighter">${bDate}</div>
                    </div>
                </div>`;
            }
        });
        
        if (!hasBirthdayData) {
            html += `<div class="p-5 text-center text-slate-500">No birthday records found.</div>`;
        }

        html += `</div>`;
        openProfileModal('Staff Birthdays', html);
    };

    // ✅ 캐시가 있으면 즉시 렌더링
    if (cachedUsers) {
        console.log("✅ Using cached data");
        renderList(cachedUsers);
    } else {
        // ✅ 캐시 없을 때만 로딩 표시
        openProfileModal('Staff Birthdays', 
            '<div class="flex justify-center p-10"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500"></div></div>');
        
        db.ref('users').once('value', snap => {
            cachedUsers = snap.val();
            renderList(cachedUsers);
        }).catch(e => {
            console.error("Birthday list load failed:", e);
            openProfileModal('Staff Birthdays', 
                '<div class="p-5 text-center text-rose-500">Failed to load data.</div>');
        });
    }
};


// 렌더링 로직을 별도 함수로 분리 (성능 및 재사용성)
function renderBirthdayModal() {
    const users = cachedUsers;
    let html = `<div class="space-y-3">`;
    const userList = Object.keys(users)
        .map(key => ({ id: key, ...users[key] }))
        .sort((a, b) => a.id.localeCompare(b.id));

    userList.forEach(u => {
        if (u.birthday) {
            const pImg = u.profileImg || 'image-001.webp';
            const imgSrc = u.id === 'Admin' 
                ? (pImg.includes('/') ? pImg : `images/profile/admin/${pImg}`) 
                : (pImg.includes('/') ? pImg : `images/profile/${pImg}`);
            
            html += `
                <div class="flex items-center justify-between bg-white/5 p-3 rounded-2xl border border-white/5">

                    </div>

}

window.logout = function() { if (!confirm("Log out?")) return; sessionStorage.clear(); localStorage.removeItem('loggedInUser'); firebase.auth().signOut().finally(() => window.location.replace("index.html")); };
document.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const tabParam = urlParams.get('tab'); 
    const initialPage = sessionStorage.getItem('targetPage');
    sessionStorage.removeItem('targetPage');
    setTimeout(() => {
        if (tabParam) { switchTab(tabParam); }
        else if (initialPage) {
            if (initialPage.includes('report')) switchTab('work');
            else if (initialPage.includes('calendar')) switchTab('schedule');
            else if (initialPage.includes('vacation')) switchTab('vacation');
            else if (initialPage.includes('statistic')) switchTab('statistic');
            else if (initialPage.includes('photos')) switchTab('photos'); 
            else if (initialPage.includes('setting')) switchTab('setting');
            else switchTab('dash');
        } else { switchTab('dash'); }
    }, 200);
});
