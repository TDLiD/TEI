<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - DAILY SYSTEM</title>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />

    <style>
        /* =====================================================
           DAY-BASED THEME SYSTEM
           0=Sun 1=Mon 2=Tue 3=Wed 4=Thu 5=Fri 6=Sat
        ===================================================== */

        /* ── MON ── Deep Navy Steel : 격자 홀로그램 */
        body.day-1 {
            --da: #3b82f6; --da2: #1d4ed8; --da3: #60a5fa;
            --dg: rgba(59,130,246,0.16); --dg2: rgba(29,78,216,0.10);
            --db: rgba(59,130,246,0.22); --db2: rgba(59,130,246,0.08);
            --ds: rgba(12,20,40,0.95); --dc: rgba(10,18,36,0.82);
            --panel-bg: linear-gradient(150deg,#020812 0%,#050f26 55%,#03091e 100%);
            --aside-bg: linear-gradient(180deg,#020714 0%,#060d22 60%,#040a1e 100%);
            --day-pattern: repeating-linear-gradient(
                0deg, transparent, transparent 39px, rgba(59,130,246,0.12) 39px, rgba(59,130,246,0.12) 40px
            ), repeating-linear-gradient(
                90deg, transparent, transparent 39px, rgba(59,130,246,0.12) 39px, rgba(59,130,246,0.12) 40px
            );
            --day-label: "MON BLUEPRINT";
            --day-font-style: normal;
            --day-letter-spacing: 0.2em;
        }

        /* ── TUE ── Dark Emerald Forge : 사선 해킹 스캔라인 */
        body.day-2 {
            --da: #10b981; --da2: #047857; --da3: #34d399;
            --dg: rgba(16,185,129,0.16); --dg2: rgba(4,120,87,0.10);
            --db: rgba(16,185,129,0.22); --db2: rgba(16,185,129,0.08);
            --ds: rgba(2,14,10,0.95); --dc: rgba(2,12,9,0.82);
            --panel-bg: linear-gradient(150deg,#010d06 0%,#031a0c 55%,#021008 100%);
            --aside-bg: linear-gradient(180deg,#010905 0%,#041408 60%,#030e07 100%);
            --day-pattern: repeating-linear-gradient(
                -45deg,
                transparent 0px, transparent 8px,
                rgba(16,185,129,0.05) 8px, rgba(16,185,129,0.05) 9px
            );
            --day-label: "TUE//MATRIX";
            --day-font-style: italic;
            --day-letter-spacing: 0.05em;
        }

        /* ── WED ── Crimson Obsidian : 다이아몬드 경고 패턴 */
        body.day-3 {
            --da: #ef4444; --da2: #b91c1c; --da3: #f87171;
            --dg: rgba(239,68,68,0.16); --dg2: rgba(185,28,28,0.10);
            --db: rgba(239,68,68,0.22); --db2: rgba(239,68,68,0.08);
            --ds: rgba(16,4,4,0.95); --dc: rgba(14,3,3,0.82);
            --panel-bg: linear-gradient(150deg,#0e0202 0%,#1c0404 55%,#130303 100%);
            --aside-bg: linear-gradient(180deg,#0b0202 0%,#160303 60%,#100202 100%);
            --day-pattern: repeating-conic-gradient(
                rgba(239,68,68,0.07) 0% 25%, transparent 0% 50%
            ) 0 0 / 28px 28px;
            --day-label: "WED ◆ ALERT";
            --day-font-style: normal;
            --day-letter-spacing: 0.15em;
        }

        /* ── THU ── Violet Abyss : 육각형 우주 허니콤 */
        body.day-4 {
            --da: #a855f7; --da2: #7c3aed; --da3: #c084fc;
            --dg: rgba(168,85,247,0.16); --dg2: rgba(124,58,237,0.10);
            --db: rgba(168,85,247,0.22); --db2: rgba(168,85,247,0.08);
            --ds: rgba(9,3,17,0.95); --dc: rgba(8,3,16,0.82);
            --panel-bg: linear-gradient(150deg,#060112 0%,#0d031e 55%,#090216 100%);
            --aside-bg: linear-gradient(180deg,#04010e 0%,#0a021a 60%,#070112 100%);
            --day-pattern: radial-gradient(circle at 50% 50%, rgba(168,85,247,0.06) 15%, transparent 16%) 0 0 / 26px 26px,
                           radial-gradient(circle at 0 100%, rgba(168,85,247,0.06) 15%, transparent 16%) 0 0 / 26px 26px;
            --day-label: "THU ✦ COSMOS";
            --day-font-style: italic;
            --day-letter-spacing: 0.1em;
        }

        /* ── FRI ── Amber Furnace : 물결 열기 이퀄라이저 */
        body.day-5 {
            --da: #f59e0b; --da2: #d97706; --da3: #fcd34d;
            --dg: rgba(245,158,11,0.16); --dg2: rgba(217,119,6,0.10);
            --db: rgba(245,158,11,0.22); --db2: rgba(245,158,11,0.08);
            --ds: rgba(18,12,2,0.95); --dc: rgba(16,11,2,0.82);
            --panel-bg: linear-gradient(150deg,#0f0700 0%,#1a0e00 55%,#130b00 100%);
            --aside-bg: linear-gradient(180deg,#0c0600 0%,#160c00 60%,#100900 100%);
            --day-pattern: repeating-radial-gradient(
                ellipse at 50% 200%,
                transparent 0%, transparent 20%,
                rgba(245,158,11,0.06) 21%, rgba(245,158,11,0.06) 22%,
                transparent 23%
            );
            --day-label: "FRI // IGNITE";
            --day-font-style: italic;
            --day-letter-spacing: 0.08em;
        }

        /* ── SAT ── Slate Void */
        body.day-6 {
            --da: #64748b; --da2: #475569; --da3: #94a3b8;
            --dg: rgba(100,116,139,0.14); --dg2: rgba(71,85,105,0.08);
            --db: rgba(100,116,139,0.20); --db2: rgba(100,116,139,0.07);
            --ds: rgba(7,9,13,0.95); --dc: rgba(6,8,12,0.82);
            --panel-bg: linear-gradient(150deg,#040507 0%,#070a0f 55%,#050608 100%);
            --aside-bg: linear-gradient(180deg,#030406 0%,#060810 60%,#040507 100%);
            --day-pattern: radial-gradient(circle, rgba(100,116,139,0.12) 1px, transparent 1px) 0 0 / 18px 18px;
            --day-label: "SAT · VOID";
            --day-font-style: normal;
            --day-letter-spacing: 0.25em;
        }

        /* ── SUN ── Slate Void : 동심원 파동 */
        body.day-0 {
            --da: #64748b; --da2: #475569; --da3: #94a3b8;
            --dg: rgba(100,116,139,0.14); --dg2: rgba(71,85,105,0.08);
            --db: rgba(100,116,139,0.20); --db2: rgba(100,116,139,0.07);
            --ds: rgba(7,9,13,0.95); --dc: rgba(6,8,12,0.82);
            --panel-bg: radial-gradient(ellipse at 30% 40%, #0a0c10 0%, #050608 100%);
            --aside-bg: linear-gradient(180deg,#030406 0%,#060810 60%,#040507 100%);
            --day-pattern: repeating-radial-gradient(circle at 50% 50%,
                transparent 0px, transparent 30px,
                rgba(100,116,139,0.06) 31px, rgba(100,116,139,0.06) 32px
            );
            --day-label: "SUN · REST";
            --day-font-style: normal;
            --day-letter-spacing: 0.25em;
        }

        /* =====================================================
           ASIDE TOP SHIMMER BAR — per day
        ===================================================== */
        body.day-1 aside::before { background: linear-gradient(90deg, #1d4ed8, #3b82f6, #60a5fa, #3b82f6, #1d4ed8); }
        body.day-2 aside::before { background: linear-gradient(90deg, #047857, #10b981, #34d399, #10b981, #047857); }
        body.day-3 aside::before { background: linear-gradient(90deg, #b91c1c, #ef4444, #f87171, #ef4444, #b91c1c); }
        body.day-4 aside::before { background: linear-gradient(90deg, #7c3aed, #a855f7, #c084fc, #a855f7, #7c3aed); }
        body.day-5 aside::before { background: linear-gradient(90deg, #d97706, #f59e0b, #fcd34d, #f59e0b, #d97706); }
        body.day-0 aside::before, body.day-6 aside::before { background: linear-gradient(90deg, #475569, #64748b, #94a3b8, #64748b, #475569); }

        body.day-1 #mobileHeader::before { background: linear-gradient(90deg, #1d4ed8, #3b82f6, #60a5fa, #3b82f6, #1d4ed8); background-size:200% 100%; animation: shimmer 3s linear infinite; }
        body.day-2 #mobileHeader::before { background: linear-gradient(90deg, #047857, #10b981, #34d399, #10b981, #047857); background-size:200% 100%; animation: shimmer 3s linear infinite; }
        body.day-3 #mobileHeader::before { background: linear-gradient(90deg, #b91c1c, #ef4444, #f87171, #ef4444, #b91c1c); background-size:200% 100%; animation: shimmer 3s linear infinite; }
        body.day-4 #mobileHeader::before { background: linear-gradient(90deg, #7c3aed, #a855f7, #c084fc, #a855f7, #7c3aed); background-size:200% 100%; animation: shimmer 3s linear infinite; }
        body.day-5 #mobileHeader::before { background: linear-gradient(90deg, #d97706, #f59e0b, #fcd34d, #f59e0b, #d97706); background-size:200% 100%; animation: shimmer 3s linear infinite; }
        body.day-0 #mobileHeader::before, body.day-6 #mobileHeader::before { background: linear-gradient(90deg, #475569, #64748b, #94a3b8, #64748b, #475569); background-size:200% 100%; animation: shimmer 3s linear infinite; }

        /* ── Orbs ── */
        body.day-1 .day-orb  { background: radial-gradient(circle, rgba(59,130,246,0.25) 0%, transparent 70%); }
        body.day-2 .day-orb  { background: radial-gradient(circle, rgba(16,185,129,0.25) 0%, transparent 70%); }
        body.day-3 .day-orb  { background: radial-gradient(circle, rgba(239,68,68,0.25) 0%, transparent 70%); }
        body.day-4 .day-orb  { background: radial-gradient(circle, rgba(168,85,247,0.25) 0%, transparent 70%); }
        body.day-5 .day-orb  { background: radial-gradient(circle, rgba(245,158,11,0.25) 0%, transparent 70%); }
        body.day-0 .day-orb, body.day-6 .day-orb { background: radial-gradient(circle, rgba(100,116,139,0.2) 0%, transparent 70%); }

        /* ── Badge shapes ── */
        body.day-1 .day-badge { border-radius: 4px; }
        body.day-2 .day-badge { border-radius: 0; clip-path: polygon(6px 0%,100% 0%,calc(100% - 6px) 100%,0% 100%); }
        body.day-3 .day-badge { clip-path: polygon(8px 0%,100% 0%,100% 100%,0 100%,0 8px); border-radius:0; }
        body.day-4 .day-badge { border-radius: 999px; }
        body.day-5 .day-badge { border-radius: 2px 12px 2px 12px; }
        body.day-0 .day-badge, body.day-6 .day-badge { border-radius: 50%; width: 40px; height: 40px; display:inline-flex;align-items:center;justify-content:center; }

        /* ── Brand title per-day ── */
        body.day-1 .brand-title { font-weight: 900; letter-spacing: -0.04em; font-style: normal; }
        body.day-2 .brand-title { font-weight: 900; letter-spacing: 0.02em; font-style: italic; text-transform: uppercase; }
        body.day-3 .brand-title { font-weight: 900; letter-spacing: 0.08em; font-style: normal; text-transform: uppercase; }
        body.day-4 .brand-title { font-weight: 900; letter-spacing: -0.02em; font-style: italic; }
        body.day-5 .brand-title { font-weight: 900; letter-spacing: 0.04em; font-style: italic; }
        body.day-0 .brand-title, body.day-6 .brand-title { font-weight: 400; letter-spacing: 0.15em; font-style: normal; }


        /* =====================================================
           SIDEBAR 3D DECORATIONS — per day
        ===================================================== */

        /* MON: three vertical lines on the right edge */
        body.day-1 aside .deco-lines { position:absolute;right:6px;top:80px;bottom:80px;display:flex;gap:3px;pointer-events:none;z-index:0; }
        body.day-1 aside .deco-lines span { display:block;width:1px;border-radius:999px;background:var(--db); }
        body.day-1 aside .deco-lines span:nth-child(1){opacity:.8;}
        body.day-1 aside .deco-lines span:nth-child(2){opacity:.4;}
        body.day-1 aside .deco-lines span:nth-child(3){opacity:.15;}

        /* WED: warning corner notches */
        body.day-3 aside .deco-corner    { position:absolute;bottom:16px;left:16px;width:24px;height:24px;border-left:2px solid var(--da);border-bottom:2px solid var(--da);opacity:.4;pointer-events:none; }
        body.day-3 aside .deco-corner-tr { position:absolute;top:16px;right:16px;width:24px;height:24px;border-right:2px solid var(--da);border-top:2px solid var(--da);opacity:.4;pointer-events:none; }

        /* THU: star particles */
        body.day-4 .star-particle { position:fixed;pointer-events:none;z-index:0;width:2px;height:2px;border-radius:50%;background:var(--da);animation:starFloat var(--dur,8s) ease-in-out infinite alternate; }

        /* FRI: ember particles */
        body.day-5 .ember-particle { position:fixed;pointer-events:none;z-index:0;width:3px;height:3px;border-radius:50%;background:var(--da);animation:emberRise var(--dur,6s) ease-out infinite;opacity:0; }
        @keyframes emberRise {
            0%   { opacity:0.8;transform:translateY(0) translateX(0) scale(1); }
            100% { opacity:0;transform:translateY(-120px) translateX(var(--dx,20px)) scale(0.3); }
        }

        /* =====================================================
           ★ SIDEBAR COLLAPSE SYSTEM ★
        ===================================================== */

        /* The sidebar itself: collapsible on desktop */
        aside {
            --aside-w: 20rem;      /* 320px open */
            --aside-w-closed: 0px; /* fully hidden */
            background: var(--aside-bg);
            border-right: 1px solid var(--db);
            box-shadow: 4px 0 32px rgba(0,0,0,0.6), inset 0 0 50px var(--dg2);
            position: relative;
            /* transition for slide */
            transition:
                width 0.45s cubic-bezier(0.4,0,0.2,1),
                min-width 0.45s cubic-bezier(0.4,0,0.2,1),
                box-shadow 0.45s ease,
                opacity 0.35s ease;
            overflow: hidden;
            will-change: width;
        }

        /* Desktop: open = 320px, closed = 0 */
        @media (min-width: 1024px) {
            aside {
                width: var(--aside-w);
                min-width: var(--aside-w);
                height: 100vh;
                position: sticky;
                top: 0;
                flex-shrink: 0;
            }
            aside.sidebar-collapsed {
                width: var(--aside-w-closed) !important;
                min-width: var(--aside-w-closed) !important;
                opacity: 0;
                pointer-events: none;
                box-shadow: none;
                border-right-color: transparent;
            }
        }

        /* Desktop sidebar inner wrapper — prevent content from flashing during slide */
        aside > .sidebar-inner {
            width: var(--aside-w); /* fixed, not shrunk */
            min-width: var(--aside-w);
            height: 100%;
            overflow: hidden;
        }

        /* ── Toggle button (peek tab) shown when collapsed on desktop ── */
        #sidebarToggleTab {
            position: fixed;
            left: 0; top: 50%;
            transform: translateY(-50%);
            z-index: 1200;
            background: var(--da2);
            border: 1px solid var(--db);
            border-left: none;
            border-radius: 0 10px 10px 0;
            padding: 12px 6px;
            cursor: pointer;
            box-shadow: 4px 0 16px var(--dg), 0 0 0 1px var(--db);
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            opacity: 0;
            transition: opacity 0.3s ease, background 0.2s;
        }
        #sidebarToggleTab.visible {
            opacity: 1;
        }
        #sidebarToggleTab:hover {
            background: var(--da);
        }
        #sidebarToggleTab .tab-chevron {
            font-size: 11px;
            color: white;
            font-weight: 900;
            line-height: 1;
        }
        #sidebarToggleTab .tab-label {
            font-size: 8px;
            color: rgba(255,255,255,0.7);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }

        /* ── Collapsed indicator line on left edge ── */
        #sidebarEdgeLine {
            position: fixed;
            left: 0; top: 0; bottom: 0;
            width: 2px;
            background: linear-gradient(180deg, transparent, var(--da), var(--da3), var(--da), transparent);
            z-index: 1050;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #sidebarEdgeLine.visible { opacity: 1; }

        /* ── Main content expands when sidebar collapses ── */
        main {
            flex: 1;
            min-width: 0;
            transition: all 0.45s cubic-bezier(0.4,0,0.2,1);
        }
        /* =====================================================
           GLOBAL BASE
        ===================================================== */
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: "Pretendard", sans-serif;
            background: var(--panel-bg);
            color: #e2e8f0;
            margin: 0; padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }

        /* Day pattern layer */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background: var(--day-pattern);
            opacity: 0.9;
            pointer-events: none;
            z-index: 0;
            animation: patternDrift 60s linear infinite;
        }
        @keyframes patternDrift {
            0%   { background-position: 0 0, 0 0; }
            100% { background-position: 60px 60px, 60px 60px; }
        }
        body.day-1::before { animation: patternDrift 45s linear infinite; }
        body.day-2::before { animation: patternDrift 80s linear infinite; }

        /* Ambient orbs */
        .day-orb {
            position: fixed;
            top: -20%; left: -10%;
            width: 65%; height: 65%;
            pointer-events: none; z-index: 0;
            animation: orbFloat 16s ease-in-out infinite alternate;
        }
        @keyframes orbFloat {
            0%   { transform: translate(0,0) scale(1) rotate(0deg); }
            100% { transform: translate(8%,5%) scale(1.12) rotate(3deg); }
        }
        .day-orb-2 {
            position: fixed;
            bottom: -15%; right: -10%;
            width: 45%; height: 45%;
            pointer-events: none; z-index: 0;
            animation: orbFloat2 20s ease-in-out infinite alternate;
        }
        @keyframes orbFloat2 {
            0%   { transform: translate(0,0) scale(1); opacity: 0.5; }
            100% { transform: translate(-5%,-5%) scale(1.08); opacity: 0.8; }
        }

        main, aside, header, nav { position: relative; z-index: 1; }

        /* =====================================================
           GLASS PANEL
        ===================================================== */
        .glass-panel {
            background: var(--dc);
            border: 1px solid var(--db);
            box-shadow:
                0 0 0 1px var(--db),
                0 8px 24px rgba(0,0,0,0.5),
                0 20px 60px rgba(0,0,0,0.4),
                inset 0 1px 0 rgba(255,255,255,0.06),
                inset 0 -1px 0 rgba(0,0,0,0.25);
            backdrop-filter: blur(16px);
        }

        /* =====================================================
           ASIDE :: before top shimmer
        ===================================================== */
        aside::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background-size: 200% 100%;
            animation: shimmer 3s linear infinite;
            z-index: 10;
        }
        @keyframes shimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        /* =====================================================
           DAY BADGE
        ===================================================== */
        .day-badge {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 3px 10px;
            background: var(--dg2);
            border: 1px solid var(--db);
            font-size: 0.6rem;
            font-weight: 900;
            letter-spacing: 0.12em;
            color: var(--da3);
            text-transform: uppercase;
            box-shadow: 0 0 10px var(--dg2), 0 0 20px var(--dg);
            transition: all 0.3s ease;
        }
        .day-dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--da);
            box-shadow: 0 0 5px var(--da);
            animation: dotPulse 2s ease-in-out infinite;
        }
        @keyframes dotPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.5; transform: scale(0.65); }
        }

        /* =====================================================
           WEATHER CHIP
        ===================================================== */
        #jakartaWeather, #mobileWeatherChip {
            background: rgba(0,0,0,0.35);
            border: 1px solid var(--db);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
        }
        #weatherTemp, #mobileWeatherTemp { color: var(--da3) !important; }
        /* =====================================================
           FLOATING MUSIC PLAYER — bottom-right, ported from index.html
        ===================================================== */
        .player-container { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 2500; }
        .player-bar {
            display: flex; align-items: center; gap: 0.75rem;
            padding: 0.55rem 0.9rem;
            background: var(--dc, rgba(10,11,17,0.9));
            border: 1px solid var(--da);
            border-radius: 2rem;
            backdrop-filter: blur(14px) saturate(160%);
            -webkit-backdrop-filter: blur(14px) saturate(160%);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 24px -10px var(--da);
        }
        .track-info-btn {
            display: flex; align-items: center; gap: 0.45rem;
            background: transparent; border: none; color: #fff; cursor: pointer;
            padding: 0.2rem 0.4rem; border-radius: 1rem; transition: background 0.2s ease;
        }
        .track-info-btn:hover { background: rgba(255,255,255,0.08); }
        .current-track-title { font-size: 0.72rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
        .playlist-arrow { font-size: 0.6rem; color: var(--da); transition: transform 0.25s ease; }
        .player-controls { display: flex; align-items: center; gap: 0.25rem; border-left: 1px solid var(--db); padding-left: 0.5rem; }
        .ctrl-btn {
            background: transparent; border: none; color: rgba(255,255,255,0.75);
            width: 1.8rem; height: 1.8rem; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: all 0.2s ease;
        }
        .ctrl-btn svg { width: 1rem; height: 1rem; fill: currentColor; }
        .ctrl-btn:hover { color: var(--da); background: rgba(255,255,255,0.08); }
        .ctrl-btn.main-ctrl { color: var(--da); background: var(--dg2); }
        .ctrl-btn.main-ctrl:hover { transform: scale(1.1); box-shadow: 0 0 14px -4px var(--da); }
        .playlist-dropdown {
            position: absolute; bottom: calc(100% + 0.6rem); right: 0; width: 270px;
            background: var(--dc, rgba(8,9,15,0.95));
            border: 1px solid var(--da);
            border-radius: 1rem;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 12px 32px rgba(0,0,0,0.7);
            overflow: hidden;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        .playlist-dropdown.hidden { display: none; }
        .playlist-header-title { font-size: 0.62rem; font-weight: 800; letter-spacing: 0.15em; color: var(--da); padding: 0.6rem 0.85rem 0.3rem; border-bottom: 1px solid var(--db); }
        .playlist-items { list-style: none; margin: 0; padding: 0.3rem; max-height: 180px; overflow-y: auto; }
        .playlist-item {
            padding: 0.5rem 0.7rem; font-size: 0.7rem; color: rgba(255,255,255,0.7);
            border-radius: 0.5rem; cursor: pointer; display: flex; align-items: center; justify-content: space-between;
            transition: background 0.15s ease, color 0.15s ease;
        }
        .playlist-item:hover { background: rgba(255,255,255,0.08); color: #fff; }
        .playlist-item.active { background: var(--dg); color: var(--da); font-weight: 700; }
        @media (max-width: 1023px) { .player-container { bottom: 6.5rem; right: 1rem; } }

        /* =====================================================
           MOBILE HEADER & NAV
        ===================================================== */
        #mobileHeader {
            background: var(--aside-bg);
            border-bottom: 1px solid var(--db);
            box-shadow: 0 2px 20px rgba(0,0,0,0.5), 0 0 30px var(--dg2), inset 0 -1px 0 var(--db);
            position: relative;
        }
        #mobileHeader::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 2px;
        }

        .mobile-bottom-nav {
            background: var(--aside-bg) !important;
            border-top: 1px solid var(--db) !important;
            box-shadow: 0 -4px 24px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.04) !important;
        }

        /* =====================================================
           MODAL
        ===================================================== */
        #profileCustomModal > div {
            background: var(--ds);
            border: 1px solid var(--db);
            box-shadow:
                0 0 0 1px var(--db),
                0 24px 70px rgba(0,0,0,0.85),
                0 0 80px var(--dg2),
                inset 0 1px 0 rgba(255,255,255,0.06);
        }
        #profileCustomModal > div > div:first-child {
            background: var(--dg2);
            border-bottom: 1px solid var(--db);
        }
        #modalTitle { color: var(--da3) !important; text-shadow: 0 0 10px var(--dg); }
        #profileCustomModal > div > div:first-child button { color: #475569; transition: all 0.2s; }
        #profileCustomModal > div > div:first-child button:hover { color: var(--da); background: var(--dg2); }

        .modal-footer-btns {
            display: flex; gap: 12px; margin-top: 20px;
            padding: 20px 0 10px 0;
            border-top: 1px solid var(--db);
            position: sticky; bottom: 0;
            background: var(--ds); z-index: 20;
        }
        .modal-footer-btns button {
            flex: 1; padding: 14px; border-radius: 1rem;
            font-size: 11px; font-weight: 900;
            text-transform: uppercase; letter-spacing: 0.1em;
            transition: all 0.2s;
        }
        .btn-modal-cancel { background: rgba(255,255,255,0.04); color: #94a3b8; border: 1px solid rgba(255,255,255,0.08); }
        .btn-modal-save { background: var(--da2); color: white; border: 1px solid var(--db); box-shadow: 0 6px 14px var(--dg2); }
        .btn-modal-save:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(1); }

        /* =====================================================
           PROFILE PICKER
        ===================================================== */
        .profile-opt {
            border: 2px solid transparent; border-radius: 1rem;
            overflow: hidden; background: rgba(255,255,255,0.04); transition: all 0.2s;
        }
        .profile-opt:hover { border-color: var(--da); box-shadow: 0 0 10px var(--dg); transform: scale(1.04); }
        .profile-option-active {
            border-color: var(--da) !important;
            box-shadow: 0 0 18px var(--dg) !important;
            transform: scale(1.06) !important;
            z-index: 10;
        }

        /* =====================================================
           BIRTHDAY
        ===================================================== */
        @keyframes birthdayBlink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.7; transform: scale(1.05); }
        }
        .birthday-active { animation: birthdayBlink 1.5s infinite ease-in-out; }
        #birthdayAlert span:first-child,
        #mobileBirthdayAlert span:first-child { color: var(--da3) !important; }

        /* =====================================================
           TIMER & ONLINE PANEL
        ===================================================== */
        .day-spin { border-color: var(--db); border-top-color: var(--da); }

        .timer-wrapper {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--db);
            border-radius: 0.75rem;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 10px;
            color: #64748b;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        #logout-timer {
            color: var(--da3);
            font-weight: 900;
            font-size: 12px;
            letter-spacing: 0.08em;
            font-family: 'Courier New', monospace;
        }

        #onlineUsersPanel {
            border-radius: 0.875rem;
            border: 1px solid var(--db);
            overflow: hidden;
            position: relative;
            background: rgba(0,0,0,0.4);
            box-shadow: 0 0 0 1px var(--db), 0 4px 16px rgba(0,0,0,0.4), inset 0 0 20px var(--dg2);
            margin-bottom: 0.5rem;
        }
        #onlineUsersPanel::before {
            content: '';
            position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, var(--dg2), transparent);
            animation: onlineScan 5s linear infinite;
            pointer-events: none; z-index: 0;
        }
        @keyframes onlineScan { 0%{left:-60%}100%{left:160%} }

        .online-panel-header {
            background: var(--dg2);
            border-bottom: 1px solid var(--db);
            padding: 7px 12px;
            display: flex; align-items: center; justify-content: space-between;
            position: relative; z-index: 1;
        }
        .online-panel-title {
            font-size: 0.58rem; font-weight: 900;
            letter-spacing: 0.15em; color: var(--da3);
            text-transform: uppercase;
            display: flex; align-items: center; gap: 6px;
        }
        .online-count-badge {
            font-size: 0.55rem; font-weight: 900;
            padding: 2px 7px; border-radius: 999px;
            background: var(--da); color: #000;
            letter-spacing: 0.05em; min-width: 18px; text-align: center;
            box-shadow: 0 0 8px var(--dg);
            animation: countPop 0.3s ease;
        }
        @keyframes countPop { 0%{transform:scale(0.7)}60%{transform:scale(1.2)}100%{transform:scale(1)} }

        #onlineUsersList {
            position: relative; z-index: 1;
            max-height: 160px; overflow-y: auto; overflow-x: hidden;
            scrollbar-width: none; padding: 5px;
            display: flex; flex-direction: column; gap: 3px;
        }
        #onlineUsersList::-webkit-scrollbar { display: none; }

        .online-user-item {
            display: flex; align-items: center; gap: 8px;
            padding: 5px 8px; border-radius: 0.6rem;
            background: var(--dg2); border: 1px solid transparent;
            transition: all 0.25s ease;
            position: relative; overflow: hidden;
            animation: slideInUser 0.35s ease both;
        }
        @keyframes slideInUser { from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)} }
        .online-user-item:hover { background: var(--dg); border-color: var(--db); transform: translateX(2px); }
        .online-user-item::before {
            content:''; position:absolute; left:0; top:0; bottom:0; width:2px;
            background:var(--da); border-radius:0 2px 2px 0; box-shadow:0 0 6px var(--dg);
        }
        .online-user-avatar { width:24px;height:24px;border-radius:50%;border:1.5px solid var(--db);object-fit:cover;flex-shrink:0;box-shadow:0 0 8px var(--dg2); }
        .online-user-name { font-size:0.63rem;font-weight:900;color:#e2e8f0;text-transform:uppercase;letter-spacing:0.05em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
        .online-user-time { font-size:0.5rem;font-weight:700;color:var(--da3);letter-spacing:0.04em;white-space:nowrap;flex-shrink:0; }
        .online-live-dot { width:5px;height:5px;border-radius:50%;background:var(--da);box-shadow:0 0 5px var(--da);flex-shrink:0;animation:livePulse 1.8s ease-in-out infinite; }
        @keyframes livePulse { 0%,100%{opacity:1}50%{opacity:0.4} }
        .online-empty { text-align:center;padding:12px 8px;font-size:0.58rem;font-weight:700;color:#334155;letter-spacing:0.1em;text-transform:uppercase; }

        /* =====================================================
           ANIMATIONS
        ===================================================== */
        .animate-fadeIn {
            animation: fadeInUp 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* =====================================================
           RESPONSIVE
        ===================================================== */
        @media (max-width: 1023px) {
            body { padding-top: 65px; padding-bottom: 90px; }
            aside {
                width: 100% !important; height: 65px !important;
                position: fixed; top: 0; z-index: 1000;
                border-right: none !important;
                transition: none !important; /* no slide on mobile */
            }
            aside.sidebar-collapsed {
                width: 100% !important;
                min-width: unset !important;
                opacity: 1 !important;
                pointer-events: all !important;
            }
        }
        @media (min-width: 1024px) {
            body { padding-top: 0; padding-bottom: 0; }
            aside { height: 100vh !important; position: sticky; top: 0; }
        }

        #mobile-birthday-dot.active { display: block !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* =====================================================
           MAIN PAGE 3D RIPPLE CLICK EFFECT
        ===================================================== */
        .click-ripple {
            position: fixed;
            border-radius: 50%;
            background: radial-gradient(circle, var(--da) 0%, transparent 70%);
            pointer-events: none;
            z-index: 9999;
            transform: scale(0);
            opacity: 0.35;
            animation: rippleExpand 0.6s cubic-bezier(0.22,1,0.36,1) forwards;
        }
        @keyframes rippleExpand {
            0%   { transform: scale(0); opacity: 0.35; }
            100% { transform: scale(1); opacity: 0; }
        }

        /* =====================================================================
           ★★★ 3D UPGRADE LAYER ★★★
           Everything below is scoped to the sidebar / dock / floating player,
           so the tab pages loaded into #contentFrame are not affected.
        ===================================================================== */
        :root { --sb-ease: cubic-bezier(.22,1,.36,1); }

        /* ── Stage: slow ambient parallax on the background orbs ── */
        .day-orb   { translate: calc(var(--pxo,0) * 1px) calc(var(--pyo,0) * 1px); transition: translate .5s ease-out; }
        .day-orb-2 { translate: calc(var(--pxo,0) * -1px) calc(var(--pyo,0) * -1px); transition: translate .5s ease-out; }

        /* ── Sidebar surface ── */
        aside {
            box-shadow:
                6px 0 40px rgba(0,0,0,.65),
                inset -1px 0 0 var(--db),
                inset 0 0 90px var(--dg2);
        }
        aside > .sidebar-inner { position: relative; }

        /* perspective grid "floor" at the foot of the sidebar */
        .sb-floor { display: none; }
        @media (min-width: 1024px) {
            .sb-floor {
                display: block; position: absolute; left: -25%; right: -25%; bottom: -6px; height: 190px;
                background:
                    linear-gradient(var(--db) 1px, transparent 1px) 0 0 / 100% 24px,
                    linear-gradient(90deg, var(--db) 1px, transparent 1px) 0 0 / 30px 100%;
                transform: perspective(260px) rotateX(64deg);
                transform-origin: 50% 100%;
                -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 90%);
                mask-image: linear-gradient(to top, #000 10%, transparent 90%);
                opacity: .55; pointer-events: none; z-index: 0;
                animation: floorGlide 6s linear infinite;
            }
        }
        @keyframes floorGlide { from { background-position: 0 0, 0 0; } to { background-position: 0 24px, 0 0; } }

        /* ── Desktop scroll container (replaces the old fixed layout) ── */
        .sb-desktop { display: none; }
        @media (min-width: 1024px) { .sb-desktop { display: flex; } }
        .sb-scroll {
            position: relative; z-index: 1; flex-direction: column; gap: 1rem;
            height: 100%; min-height: 0; overflow-y: auto; overflow-x: hidden;
            padding: 1.35rem 1.15rem 1.6rem;
            scrollbar-width: thin; scrollbar-color: var(--da) transparent;
        }
        /* children keep their natural height; the column scrolls instead of squashing them */
        .sb-scroll > * { flex-shrink: 0; }
        body.day-3 aside .deco-corner-tr { top: 8px; right: 10px; }
        .sb-scroll::-webkit-scrollbar { width: 3px; }
        .sb-scroll::-webkit-scrollbar-thumb { background: var(--da); border-radius: 99px; }

        /* staggered 3D entrance (plays once; items always end visible) */
        @keyframes sbRise {
            from { opacity: 0; transform: perspective(800px) translateY(22px) rotateX(-28deg) scale(.96); }
            to   { opacity: 1; transform: perspective(800px) translateY(0) rotateX(0deg) scale(1); }
        }
        .sb-in { animation: sbRise .75s var(--sb-ease) backwards; animation-delay: calc(var(--i, 0) * 70ms + 120ms); }

        /* ── Brand (extruded 3D lettering) ── */
        .brand-title { transition: all .3s ease; }
        .brand-3d {
            text-shadow:
                0 1px 0 rgba(0,0,0,.55), 0 2px 0 rgba(0,0,0,.5), 0 3px 0 rgba(0,0,0,.45),
                0 4px 0 rgba(0,0,0,.4), 0 9px 14px rgba(0,0,0,.6), 0 0 26px var(--dg);
        }
        .brand-accent { color: var(--da); text-shadow: 0 1px 0 var(--da2), 0 2px 0 var(--da2), 0 3px 0 rgba(0,0,0,.5), 0 0 22px var(--da); }
        .sb-head { display: flex; align-items: center; justify-content: space-between; gap: .6rem; }
        .sb-brand { display: flex; align-items: center; gap: .65rem; min-width: 0; flex-wrap: wrap; }

        /* ── Shared "glass slab" card ── */
        .sb-card {
            position: relative; border-radius: 1.25rem; border: 1px solid var(--db);
            background:
                linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.015) 45%, rgba(0,0,0,.18)),
                var(--dc);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.1), inset 0 -12px 24px rgba(0,0,0,.28),
                0 2px 0 rgba(0,0,0,.55), 0 14px 26px -12px rgba(0,0,0,.85), 0 0 0 1px rgba(0,0,0,.4);
        }

        /* ── Tilt helper (driven by JS: --rx / --ry / --mx / --my) ── */
        .sb-tilt {
            transform: perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
            transform-style: preserve-3d;
            transition: transform .22s var(--sb-ease), box-shadow .25s ease;
        }

        /* ── Profile card ── */
        .sb-profile { display: grid; grid-template-columns: auto 1fr; gap: .85rem 1rem; align-items: center; padding: 1rem; }
        .sb-profile-info { min-width: 0; display: flex; flex-direction: column; gap: .35rem; }
        .sb-username {
            font-size: .82rem; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--da3);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 0 12px var(--dg);
        }
        .sb-online { font-size: 9px; font-weight: 900; display: flex; align-items: center; gap: .3rem; }
        .sb-bday-btn {
            grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; gap: .4rem;
            padding: .45rem .8rem; border-radius: .85rem; font-size: 9px; font-weight: 800; letter-spacing: .16em;
            text-transform: uppercase; color: var(--da3); cursor: pointer;
            background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(0,0,0,.2)), var(--dg2);
            border: 1px solid var(--db);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 3px 0 rgba(0,0,0,.55), 0 8px 12px -6px rgba(0,0,0,.8);
            transition: transform .15s ease, box-shadow .2s ease, background .2s ease;
        }
        .sb-bday-btn:hover { background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(0,0,0,.12)), var(--dg); }
        .sb-bday-btn:active { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 1px 0 rgba(0,0,0,.55); }

        /* spinning conic ring + floating shadow around the avatar */
        .avatar-3d { position: relative; padding: 5px; border-radius: 50%; flex-shrink: 0; }
        .avatar-3d::before {
            content: ''; position: absolute; inset: 0; border-radius: 50%;
            background: conic-gradient(from 0deg, var(--da), transparent 28%, var(--da3) 52%, transparent 76%, var(--da));
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
                    mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
            animation: ringSpin 6s linear infinite;
        }
        .avatar-3d::after {
            content: ''; position: absolute; left: 14%; right: 14%; bottom: -13px; height: 12px; border-radius: 50%;
            background: radial-gradient(ellipse, rgba(0,0,0,.75), transparent 70%); filter: blur(3px); z-index: -1;
            animation: avatarShadow 4s ease-in-out infinite alternate;
        }
        @keyframes ringSpin { to { transform: rotate(360deg); } }
        @keyframes avatarShadow { from { transform: scaleX(1); opacity: .9; } to { transform: scaleX(.82); opacity: .6; } }
        .nav-profile-img {
            display: block; width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: none;
            box-shadow: 0 6px 14px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.1);
            transition: transform .3s ease;
        }
        @media (min-width: 1024px) { .nav-profile-img { width: 76px !important; height: 76px !important; } }
        .avatar-3d:hover .nav-profile-img { transform: scale(1.04) translateZ(10px); }
        .edit-badge {
            position: absolute; bottom: 4px; right: 4px; background: var(--da); width: 22px; height: 22px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; border: 2px solid #000;
            box-shadow: 0 0 10px var(--dg), 0 3px 0 rgba(0,0,0,.5); z-index: 2;
        }
        #mobileProfileImg { box-shadow: 0 0 0 2px var(--dg), 0 4px 10px rgba(0,0,0,.6); }

        /* weather chip as a small bevelled pill */
        #jakartaWeather, #mobileWeatherChip {
            background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.3)), rgba(0,0,0,.35);
            border: 1px solid var(--db);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 2px 0 rgba(0,0,0,.5);
        }

        /* ── Menu (always visible) ── */
        .sb-nav { display: flex; flex-direction: column; gap: .55rem; }
        .sb-section-label { font-size: .55rem; font-weight: 900; letter-spacing: .3em; color: #475569; text-transform: uppercase; margin: .1rem 0 .05rem .4rem; }
        .aside-divider { height: 1px; background: linear-gradient(90deg, transparent, var(--db), transparent); margin: .35rem 0; }

        .btn-3d { transition: all .2s; border: 1px solid rgba(255,255,255,.05); }
        .btn-3d:active { transform: translateY(2px) scale(.97); }

        .nav-key {
            --ty: 0px; --tz: 0px;
            position: relative; display: flex; align-items: center; gap: .8rem; width: 100%;
            padding: .6rem .8rem .6rem .65rem; border-radius: 1.05rem;
            font-size: .7rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; text-align: left;
            color: #94a3b8; cursor: pointer;
            background:
                linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.02) 55%, rgba(0,0,0,.2)),
                rgba(8,12,22,.72);
            border: 1px solid rgba(255,255,255,.07);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.12), inset 0 -2px 0 rgba(0,0,0,.4),
                0 4px 0 rgba(0,0,0,.6), 0 12px 18px -8px rgba(0,0,0,.8);
            transform: perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty)) translateZ(var(--tz));
            transform-style: preserve-3d;
            transition: transform .2s var(--sb-ease), box-shadow .25s ease, color .2s ease, background .25s ease, border-color .25s ease;
        }
        /* pointer-following glare */
        .nav-key::before {
            content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0;
            background: radial-gradient(170px circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,.17), transparent 62%);
            transition: opacity .25s ease;
        }
        .nav-key:hover::before { opacity: 1; }
        .nav-key:hover {
            --ty: -2px; --tz: 12px; color: #fff; border-color: var(--db);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.16), inset 0 -2px 0 rgba(0,0,0,.4),
                0 6px 0 rgba(0,0,0,.6), 0 18px 28px -10px var(--da);
        }
        .nav-key:active {
            --ty: 3px; --tz: 0px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.1), inset 0 -1px 0 rgba(0,0,0,.4), 0 1px 0 rgba(0,0,0,.6), 0 4px 8px -4px rgba(0,0,0,.8);
        }
        .nav-key:focus-visible, .sp-ctrl:focus-visible, .ctrl-btn:focus-visible, .sb-collapse-btn:focus-visible, .dock-item:focus-visible {
            outline: 2px solid var(--da3); outline-offset: 2px;
        }
        .nk-rail {
            position: absolute; left: 0; top: 18%; bottom: 18%; width: 3px; border-radius: 0 3px 3px 0;

            border: 1px solid rgba(255,255,255,.08);

        /* active tab = raised accent key with coloured edge */
        .tab-active { font-weight: 900; text-shadow: 0 0 8px var(--dg); }
        .nav-key.tab-active {
            color: var(--da3); border-color: var(--da);

                linear-gradient(180deg, rgba(255,255,255,.1), rgba(0,0,0,.2)),

                inset 0 1px 0 rgba(255,255,255,.22), inset 0 0 22px var(--dg), var(--tab-glow, 0 0 0 transparent),

        .nav-key.tab-active .nk-chev { opacity: 1; }
        .nav-key.tab-active .nk-icon {
            background: linear-gradient(145deg, var(--da3), var(--da2)); border-color: var(--da3);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 3px 0 rgba(0,0,0,.5), 0 0 18px var(--dg), 0 8px 14px -4px var(--da);
        }
        .nav-key.tab-active::after {
            content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
            background: linear-gradient(110deg, transparent 35%, rgba(255,255,255,.2) 50%, transparent 65%) 200% 0 / 250% 100% no-repeat;
            animation: keySheen 4.5s ease-in-out infinite;
        }
        @keyframes keySheen { 0%, 55% { background-position: 200% 0; } 100% { background-position: -100% 0; } }
        body.day-3 { --tab-stripe: repeating-linear-gradient(45deg, var(--dg), var(--dg) 3px, transparent 3px, transparent 8px); }
        body.day-4 { --tab-glow: 0 0 20px var(--dg); }

        /* primary key: "Main Menu" */
        .main-menu-btn { color: var(--da3); }
        .nav-key--primary {
            background: linear-gradient(180deg, rgba(255,255,255,.13), rgba(0,0,0,.14)), var(--dg);
            border-color: var(--db); color: var(--da3); font-weight: 900;
        }
        .nav-key--primary .nk-icon { background: linear-gradient(145deg, var(--da3), var(--da2)); border-color: var(--da3); }

        .tdlid-link { color: var(--da3); border: 1px solid var(--db); transition: all .2s; }
        .tdlid-link:hover { background: var(--dg2); }
        .online-dot { background: var(--da) !important; box-shadow: 0 0 5px var(--da); }
        .online-text { color: var(--da3) !important; }

        /* collapse button (manual — the menu never hides on its own) */
        .sb-collapse-btn {
            flex: 0 0 auto; width: 1.9rem; height: 1.9rem; border-radius: .65rem; display: grid; place-items: center;
            font-size: 1.1rem; line-height: 1; font-weight: 900; color: var(--da3); cursor: pointer;
            background: linear-gradient(180deg, rgba(255,255,255,.1), rgba(0,0,0,.25)), rgba(8,12,22,.8);
            border: 1px solid var(--db);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 3px 0 rgba(0,0,0,.6), 0 6px 10px -4px rgba(0,0,0,.8);
            transition: transform .15s ease, box-shadow .2s ease, color .2s ease;
        }
        .sb-collapse-btn:hover { color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 3px 0 rgba(0,0,0,.6), 0 8px 16px -4px var(--da); }
        .sb-collapse-btn:active { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 1px 0 rgba(0,0,0,.6); }
        #sidebarToggleTab {
            background: linear-gradient(180deg, var(--da), var(--da2));
            box-shadow: 4px 0 18px var(--dg), 0 0 0 1px var(--db), inset 0 1px 0 rgba(255,255,255,.3);
        }

        /* ── Music card in the sidebar ── */
        .sb-player { display: flex; flex-direction: column; gap: .65rem; padding: .85rem .9rem .9rem; }
        .sp-row { display: flex; align-items: center; gap: .75rem; }
        .vinyl {
            position: relative; flex: 0 0 auto; width: 2.9rem; height: 2.9rem; border-radius: 50%;
            background: conic-gradient(from 30deg, #1a1f2b, #2d3647 12%, #11141b 25%, #252d3c 40%, #0d1016 55%, #2d3647 70%, #11141b 85%, #1a1f2b);
            box-shadow: 0 0 0 2px rgba(0,0,0,.6), 0 7px 12px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.08);
            animation: vinylSpin 3.2s linear infinite; animation-play-state: paused;
        }
        .vinyl::before { content: ''; position: absolute; inset: 0; margin: auto; width: 36%; height: 36%; border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, var(--da3), var(--da2)); box-shadow: 0 0 10px var(--dg); }
        .vinyl::after { content: ''; position: absolute; inset: 0; margin: auto; width: 8%; height: 8%; border-radius: 50%; background: #05070b; }
        body.bgm-playing .vinyl { animation-play-state: running; }
        @keyframes vinylSpin { to { transform: rotate(360deg); } }
        .sb-player .sp-info { display: flex; flex-direction: column; gap: .3rem; flex: 1; min-width: 0; }
        .sidebar-player .sp-title, .sp-title {
            font-size: .66rem; font-weight: 800; letter-spacing: .04em; color: var(--da3);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .sp-progress { height: 5px; border-radius: 99px; background: rgba(255,255,255,.08); box-shadow: inset 0 1px 2px rgba(0,0,0,.7); cursor: pointer; overflow: hidden; }
        .sp-progress > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--da2), var(--da3)); box-shadow: 0 0 8px var(--da); transition: width .3s linear; }
        .sp-controls { display: flex; align-items: center; justify-content: center; gap: .7rem; }
        .sp-ctrl {
            width: 2rem; height: 2rem; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #cbd5e1;
            background: linear-gradient(180deg, rgba(255,255,255,.1), rgba(0,0,0,.25)), rgba(8,12,22,.8);
            border: 1px solid rgba(255,255,255,.08);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.15), 0 3px 0 rgba(0,0,0,.6), 0 7px 10px -3px rgba(0,0,0,.7);
            transition: transform .15s ease, box-shadow .2s ease, color .2s ease;
        }
        .sp-ctrl svg { width: .9rem; height: .9rem; fill: currentColor; }
        .sp-ctrl:hover { color: var(--da3); }
        .sp-ctrl:active { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 1px 0 rgba(0,0,0,.6); }
        .sp-ctrl.sp-main {
            width: 2.6rem; height: 2.6rem; color: #fff; border-color: var(--da3);
            background: linear-gradient(145deg, var(--da3), var(--da2));
            box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 4px 0 rgba(0,0,0,.55), 0 10px 18px -4px var(--da);
        }
        .sp-ctrl.sp-main svg { width: 1.05rem; height: 1.05rem; }

        /* equalizer bars (shared by every player UI) */
        .sp-eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; flex-shrink: 0; }
        .sp-eq i { display: block; width: 2px; background: var(--da); border-radius: 1px; height: 3px; transition: height .2s ease; }
        .sp-eq.is-playing i { animation: eqBounce .9s ease-in-out infinite; }
        .sp-eq.is-playing i:nth-child(2) { animation-delay: .15s; }
        .sp-eq.is-playing i:nth-child(3) { animation-delay: .3s; }
        @keyframes eqBounce { 0%,100% { height: 3px; } 50% { height: 11px; } }

        /* ── Floating player (bottom-right): glossy 3D pill ── */
        .player-bar {
            background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.01) 50%, rgba(0,0,0,.2)), var(--dc, rgba(10,11,17,.9));
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.14), inset 0 -2px 0 rgba(0,0,0,.35),
                0 4px 0 rgba(0,0,0,.6), 0 16px 32px rgba(0,0,0,.6), 0 0 26px -8px var(--da);
        }
        .ctrl-btn {
            background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(0,0,0,.2));
            box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 2px 0 rgba(0,0,0,.55);
        }
        .ctrl-btn:active { transform: translateY(2px); box-shadow: none; }
        .ctrl-btn.main-ctrl {
            width: 2.1rem; height: 2.1rem; color: #fff; background: linear-gradient(145deg, var(--da3), var(--da2));
            box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 3px 0 rgba(0,0,0,.55), 0 8px 14px -4px var(--da);
        }
        .playlist-dropdown { box-shadow: 0 16px 36px rgba(0,0,0,.75), 0 0 24px -8px var(--da); }

        /* ── Logout + timer foot ── */
        .sb-foot { display: flex; flex-direction: column; gap: .6rem; }
        .sb-logout {
            display: flex; align-items: center; justify-content: center; gap: .4rem; padding: .65rem 1rem;

            color: #fb7185; border-radius: 1rem;
            background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(0,0,0,.2)), rgba(225,29,72,.12);
            border: 1px solid rgba(244,63,94,.3);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 3px 0 rgba(0,0,0,.6), 0 10px 16px -8px rgba(0,0,0,.8);
            transition: transform .15s ease, box-shadow .2s ease, background .2s ease;
        }
        .sb-logout:hover { background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(0,0,0,.15)), rgba(225,29,72,.22); }
        .sb-logout:active { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 1px 0 rgba(0,0,0,.6); }
        .timer-wrapper {
            background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.25)), rgba(0,0,0,.3);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 2px 0 rgba(0,0,0,.5);
        }
        #onlineUsersPanel { box-shadow: 0 0 0 1px var(--db), 0 2px 0 rgba(0,0,0,.55), 0 14px 24px -12px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.08), inset 0 0 22px var(--dg2); margin-bottom: 0; }
        .tdlid-link { background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.2)), rgba(255,255,255,.02);
            border-radius: 1rem; box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 3px 0 rgba(0,0,0,.55), 0 10px 16px -8px rgba(0,0,0,.8); }
        .tdlid-link:active { transform: translateY(2px); }

        /* ── Mobile header polish ── */
        #mobileHeader { box-shadow: 0 6px 22px rgba(0,0,0,.6), 0 0 30px var(--dg2), inset 0 -1px 0 var(--db), inset 0 1px 0 rgba(255,255,255,.05); }

        /* ── Mobile bottom dock: 3D bubbles, active one floats up ── */
        .mobile-bottom-nav { align-items: flex-end !important; gap: 1px; padding-left: .35rem !important; padding-right: .35rem !important;
            box-shadow: 0 -4px 24px rgba(0,0,0,.6), 0 14px 30px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08) !important; }
        .dock-item {
            flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: .22rem; color: #64748b;
            transition: transform .3s var(--sb-ease), color .2s ease; text-decoration: none;
        }
        .dock-ico {
            width: 1.95rem; height: 1.95rem; display: grid; place-items: center; font-size: 1.02rem; line-height: 1; border-radius: .75rem;
            background: linear-gradient(145deg, rgba(255,255,255,.1), rgba(255,255,255,.02)), rgba(0,0,0,.35);
            border: 1px solid rgba(255,255,255,.07);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 3px 0 rgba(0,0,0,.55), 0 6px 8px -3px rgba(0,0,0,.7);
            transition: transform .2s var(--sb-ease), background .25s ease, box-shadow .25s ease;
        }
        .dock-lbl { font-size: 7.5px; font-weight: 800; line-height: 1.05; text-align: center; letter-spacing: .02em; max-width: 100%; }
        .dock-item:active .dock-ico { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 1px 0 rgba(0,0,0,.55); }
        .dock-item.mobile-tab-active { transform: translateY(-7px); }
        .dock-item.mobile-tab-active .dock-ico {
            background: linear-gradient(145deg, var(--da3), var(--da2)); border-color: var(--da3);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 3px 0 rgba(0,0,0,.5), 0 10px 16px -4px var(--da);
        }
        .mobile-tab-active { color: var(--da) !important; font-weight: 900; text-shadow: 0 0 8px var(--dg); }
        @media (max-width: 359px) { .dock-ico { width: 1.6rem; height: 1.6rem; font-size: .88rem; } }

        /* ── Modal: 3D pop-in ── */
        #profileCustomModal > div { animation: modalPop .5s var(--sb-ease) both; transform-origin: 50% 60%; }
        @keyframes modalPop { from { opacity: 0; transform: perspective(900px) rotateX(14deg) translateY(24px) scale(.95); } to { opacity: 1; transform: none; } }

        /* ── Mobile: header container must be full width (inner wrapper used a fixed 20rem) ── */
        @media (max-width: 1023px) {
            aside > .sidebar-inner { width: 100%; min-width: 0; }
        }

        /* ── Respect reduced-motion preferences ── */
        @media (prefers-reduced-motion: reduce) {
            .sb-in, .avatar-3d::before, .avatar-3d::after, .vinyl, .sb-floor, .nav-key.tab-active::after { animation: none !important; }
            .sb-tilt, .nav-key { transition: none; }
        }
    </style>
</head>

/* ── Birthday check ── */
async function checkTodayBirthdays() {
    const today = new Date();
    const tMonthDay = `${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
    const lunar = Lunar.fromDate(today);
    const lMonthDay = `${String(lunar.getMonth()).padStart(2,'0')}-${String(lunar.getDay()).padStart(2,'0')}`;

    const checkCache = () => {
        if (!cachedUsers) return;
        let birthdayMessages = [];
        Object.keys(cachedUsers).forEach(id => {
            const u = cachedUsers[id];
            if (!u || !u.birthday) return;
            const bMonthDay = u.birthday.substring(5);
            const type = u.birthType || "Solar";
            const bDateFull = u.birthday.replace(/-/g, '.');
            const isSolarMatch = (type === "Solar" || type === "양력") && bMonthDay === tMonthDay;
            const isLunarMatch = (type === "Lunar" || type === "음력") && bMonthDay === lMonthDay;
            if (isSolarMatch || isLunarMatch) birthdayMessages.push(`${id}: ${bDateFull}`);
        });
        const alertBox  = document.getElementById('birthdayAlert');
        const nameText  = document.getElementById('birthdayNames');
        const mAlertBox = document.getElementById('mobileBirthdayAlert');
        const mNameText = document.getElementById('mobileBirthdayNames');
        const mobileDot = document.getElementById('mobile-birthday-dot');
        if (birthdayMessages.length > 0) {
            const namesHtml = birthdayMessages.join('<br>');
            if (alertBox)  alertBox.classList.remove('hidden');
            if (nameText)  nameText.innerHTML = namesHtml;
            if (mAlertBox) mAlertBox.classList.remove('hidden');
            if (mNameText) mNameText.innerHTML = namesHtml;
            if (mobileDot) mobileDot.classList.remove('hidden');
        }
    };

    if (cachedUsers) checkCache();
    else db.ref('users').once('value', snap => { cachedUsers = snap.val(); checkCache(); });
}

/* =====================================================
   ★ SIDEBAR (manual collapse only) ★
   The menu is ALWAYS shown. It no longer hides by itself:
   it folds away only when you press the ‹ button, and the
   edge tab (or the button) brings it back.
===================================================== */
(function initSidebarCollapse() {
    const aside       = document.getElementById('mainAside');
    const toggleTab   = document.getElementById('sidebarToggleTab');
    const edgeLine    = document.getElementById('sidebarEdgeLine');
    const collapseBtn = document.getElementById('sidebarCollapseBtn');
    let   collapsed   = false;

    function isDesktop() { return window.innerWidth >= 1024; }

    function collapseSidebar() {
        if (!isDesktop() || collapsed) return;
        collapsed = true;
        aside.classList.add('sidebar-collapsed');
        toggleTab.style.display = 'flex';
        edgeLine.classList.add('visible');
        requestAnimationFrame(() => toggleTab.classList.add('visible'));
    }

    function expandSidebar() {
        if (!isDesktop() || !collapsed) return;
        collapsed = false;
        aside.classList.remove('sidebar-collapsed');
        toggleTab.classList.remove('visible');
        edgeLine.classList.remove('visible');
        setTimeout(() => {
            if (!collapsed) toggleTab.style.display = 'none';
        }, 300);
    }

    if (collapseBtn) collapseBtn.addEventListener('click', collapseSidebar);
    if (toggleTab)   toggleTab.addEventListener('click', expandSidebar);

    /* Click ripple effect on main area */
    const mainEl = document.querySelector('main');
    if (mainEl) {
        mainEl.addEventListener('click', (e) => {
            if (!isDesktop()) return;
            const ripple = document.createElement('div');
            ripple.className = 'click-ripple';
            const size = 120;
            ripple.style.cssText = `width:${size}px;height:${size}px;top:${e.clientY - size/2}px;left:${e.clientX - size/2}px;`;
            document.body.appendChild(ripple);
            setTimeout(() => ripple.remove(), 650);
        });
    }

    /* Restore on resize to mobile */
    window.addEventListener('resize', () => {
        if (!isDesktop()) {
            aside.classList.remove('sidebar-collapsed');
            toggleTab.style.display = 'none';
            toggleTab.classList.remove('visible');
            edgeLine.classList.remove('visible');
            collapsed = false;
        }
    });
})();


/* ── Tab switcher ── */
window.switchTab = function(t) {
    if (typeof window._leavePageCleanup === 'function') {
        window._leavePageCleanup();
        window._leavePageCleanup = null;
    }
    const pB = document.querySelectorAll('.pc-tab-btn');
    const mB = document.querySelectorAll('.mobile-tab-btn');
    const tabMapping = {
        dash: 'staff_dashboard.html', work: 'staff_report.html',
        schedule: 'staff_calendar.html', vacation: 'staff_vacation.html',
        statistic: 'staff_statistic.html', setting: 'staff_setting.html',
        photos: 'staff_photos.html', promo: 'staff_promo.html', all: 'staff_allatt.html'
    };
    const activeTab = tabMapping[t] ? t : 'dash';
    pB.forEach(b => b.classList.remove('tab-active'));
    mB.forEach(b => b.classList.remove('mobile-tab-active'));
    const navIndex = { dash:0, work:1, schedule:2, vacation:3, statistic:4, setting:5, photos:6, promo:7 };
    const i = navIndex[activeTab];
    if (i !== undefined) {
        if (pB[i]) pB[i].classList.add('tab-active');
        if (mB[i]) mB[i].classList.add('mobile-tab-active');
    }
    pB.forEach(b => b.removeAttribute('aria-current'));
    mB.forEach(b => b.removeAttribute('aria-current'));
    if (i !== undefined) {
        if (pB[i]) pB[i].setAttribute('aria-current', 'page');
        if (mB[i]) mB[i].setAttribute('aria-current', 'page');
    }
    document.body.dataset.activeTab = activeTab;
    loadHTML(tabMapping[activeTab]);
};

window.loadHTML = async function(u) {
    try {
        const f = document.getElementById('contentFrame');
        if (!f) return;
        f.innerHTML = `<div class="flex items-center justify-center h-64"><div class="w-10 h-10 border-4 rounded-full animate-spin day-spin"></div></div>`;
        const r = await fetch(u);
        const h = await r.text();
        f.innerHTML = h;
        setTimeout(() => {
            const fc = document.getElementById('footerContainer');
            if (fc && !fc.innerHTML) {
                fetch('staff_footer.html').then(fr => { if (fr.ok) return fr.text(); })
                .then(footerHtml => { if (footerHtml && fc) fc.innerHTML = footerHtml; });
            }
            try { executeScripts(f); } catch (scriptError) { console.error("Script execution error:", scriptError); }
        }, 50);
    } catch(e) {
        console.error("Page load failed:", e);
        const f = document.getElementById('contentFrame');
        if (f) f.innerHTML = `<div class="p-10 glass-panel text-center font-black" style="color:var(--da)">PAGE NOT FOUND</div>`;
    }
};

function executeScripts(con) {
    if (!con) return;
    con.querySelectorAll('script').forEach(os => {
        const ns = document.createElement('script');
        Array.from(os.attributes).forEach(at => ns.setAttribute(at.name, at.value));
        if (os.src) { ns.src = os.src; ns.async = false; }
        else { ns.textContent = os.textContent; }
        document.head.appendChild(ns).parentNode.removeChild(ns);
    });
}

/* ── Weather ── */
async function fetchJakartaWeather() {
    try {
        const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-6.2088&longitude=106.8456&current_weather=true');
        const data = await response.json();
        const weather = data.current_weather;
        const temp = Math.round(weather.temperature);
        const code = weather.weathercode;
        let icon = '☀️';
        if (code >= 1 && code <= 3) icon = '⛅';
        else if (code >= 45 && code <= 48) icon = '☁️';
        else if (code >= 51 && code <= 67) icon = '🌧️';
        else if (code >= 95) icon = '⛈️';
        if (document.getElementById('weatherTemp'))       document.getElementById('weatherTemp').innerText = `${temp}°C`;
        if (document.getElementById('weatherIcon'))       document.getElementById('weatherIcon').innerText = icon;
        if (document.getElementById('mobileWeatherTemp')) document.getElementById('mobileWeatherTemp').innerText = `${temp}°C`;
        if (document.getElementById('mobileWeatherIcon')) document.getElementById('mobileWeatherIcon').innerText = icon;
    } catch(e) { console.error("Weather load failed"); }
}
