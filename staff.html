<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - DAILY SYSTEM</title>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        :root { --glass: rgba(15, 23, 42, 0.7); --border: rgba(255, 255, 255, 0.1); }
        body { font-family: "Pretendard", sans-serif; background: radial-gradient(circle at top right, #0f172a, #020617); color: #f8fafc; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        
        /* 3D Glassmorphism 카드 */
        .glass-panel { background: var(--glass); backdrop-filter: blur(16px); border: 1px solid var(--border); border-top: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        
        /* 탭 활성화 (3D 효과) */
        .tab-active { background: linear-gradient(135deg, #3b82f6, #2563eb) !important; color: white !important; font-weight: 800; border-radius: 1rem; box-shadow: 0 8px 15px rgba(37, 99, 235, 0.4); transform: translateY(-2px); }
        .mobile-tab-active { color: #60a5fa !important; font-weight: 900; transform: scale(1.1); }

        /* 애니메이션 */
        .animate-fadeIn { animation: fadeIn 0.4s cubic-bezier(0.22, 1, 0.36, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .nav-profile-img { width: 60px; height: 60px; border-radius: 50%; border: 3px solid #1e293b; object-fit: cover; box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); }
        @media (min-width: 1024px) { .nav-profile-img { width: 90px !important; height: 90px !important; } }

        .edit-badge { position: absolute; bottom: 5px; right: 5px; background: #3b82f6; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid #000; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* 버튼 3D 눌림 효과 */
        .btn-3d { transition: all 0.2s; border: 1px solid rgba(255,255,255,0.05); }
        .btn-3d:active { transform: translateY(2px) scale(0.98); }
    </style>
</head>
<body class="flex flex-col lg:flex-row min-h-screen">

<aside class="w-full lg:w-80 lg:h-screen bg-slate-900/60 border-b lg:border-b-0 lg:border-r border-white/5 backdrop-blur-2xl sticky top-0 z-[1000] flex-shrink-0">
    <div class="p-5 lg:p-8 flex flex-col h-full">
        <div class="flex lg:flex-col justify-between items-center lg:items-start gap-4 mb-4 lg:mb-10">
            <div class="w-full">
                <div class="flex justify-between items-center lg:block">
                    <h1 class="text-xl lg:text-2xl font-black tracking-tighter text-white uppercase italic">Daily <span class="text-blue-500">System</span></h1>
                    <a href="https://tdlid.github.io" target="_blank" class="lg:hidden flex items-center gap-1.5 px-3 py-1.5 bg-blue-600/20 border border-blue-500/30 rounded-full text-[10px] text-blue-300 font-black uppercase">
                        <span>🌐</span> Homepage
                    </a>
                </div>
                <div class="flex items-center gap-4 mt-5">
                    <div id="navEmojiContainer" class="cursor-pointer relative group inline-block btn-3d" onclick="openProfileImagePicker()"></div>
                    <div class="flex flex-col">
                        <div id="jakartaWeather" class="flex items-center gap-2 mb-1.5 bg-black/40 px-2.5 py-1 rounded-lg border border-white/5 w-fit">
                            <span id="weatherIcon" class="text-sm">⏳</span>
                            <span id="weatherTemp" class="text-[11px] font-black text-white">--°C</span>
                            <span class="text-[9px] text-slate-500 font-bold tracking-widest uppercase">JKT</span>
                        </div>
                        <p id="desktopUser" class="text-[11px] font-black text-blue-400 uppercase tracking-widest"></p>
                        <span class="text-[9px] text-emerald-500 font-black flex items-center gap-1">
                            <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span> ONLINE
                        </span>
                    </div>
                </div>
            </div>
            <button onclick="logout()" class="btn-3d text-[10px] font-black bg-rose-600/10 hover:bg-rose-600/20 text-rose-500 px-4 py-2 rounded-xl border border-rose-500/20 transition uppercase flex-shrink-0">Logout</button>
        </div>

        <nav class="hidden lg:flex flex-col gap-1.5 flex-grow">
            <button onclick="switchTab('dash')" class="pc-tab-btn btn-3d flex items-center gap-4 px-5 py-3.5 text-xs uppercase tracking-widest text-slate-400 hover:text-white transition-all rounded-2xl"><span>🏠</span> Dashboard</button>
            <button onclick="switchTab('work')" class="pc-tab-btn btn-3d flex items-center gap-4 px-5 py-3.5 text-xs uppercase tracking-widest text-slate-400 hover:text-white transition-all rounded-2xl"><span>📝</span> Work Report</button>
            <button onclick="switchTab('schedule')" class="pc-tab-btn btn-3d flex items-center gap-4 px-5 py-3.5 text-xs uppercase tracking-widest text-slate-400 hover:text-white transition-all rounded-2xl"><span>📅</span> Calendar</button>
            <button onclick="switchTab('leave')" class="pc-tab-btn btn-3d flex items-center gap-4 px-5 py-3.5 text-xs uppercase tracking-widest text-slate-400 hover:text-white transition-all rounded-2xl"><span>🏖️</span> Vacation</button>
            <button onclick="switchTab('statistic')" class="pc-tab-btn btn-3d flex items-center gap-4 px-5 py-3.5 text-xs uppercase tracking-widest text-slate-400 hover:text-white transition-all rounded-2xl"><span>📈</span> Statistics</button>
            <button onclick="switchTab('setting')" class="pc-tab-btn btn-3d flex items-center gap-4 px-5 py-3.5 text-xs uppercase tracking-widest text-slate-400 hover:text-white transition-all rounded-2xl"><span>⚙️</span> Settings</button>
            
            <div class="mt-5 pt-5 border-t border-white/5">
                <button onclick="location.href='staff_list.html'" class="w-full btn-3d flex items-center gap-4 px-5 py-4 text-xs uppercase tracking-widest text-blue-400 font-black bg-blue-500/5 hover:bg-blue-500/10 border border-blue-500/20 rounded-2xl">
                    <span>⬅️</span> Main Menu
                </button>
            </div>
        </nav>

        <div class="hidden lg:block pt-5 border-t border-white/5">
            <p class="text-[9px] text-slate-600 font-black tracking-[0.2em] uppercase mb-3 ml-2">External Portal</p>
            <a href="https://tdlid.github.io" target="_blank" class="btn-3d flex items-center gap-3 px-5 py-4 text-[10px] font-black uppercase tracking-widest text-slate-400 hover:text-white transition-colors bg-white/5 rounded-2xl border border-white/5">
                <span>🌐</span> TDLiD Homepage
            </a>
        </div>
    </div>
</aside>

<main class="flex-1 flex flex-col min-w-0 h-screen overflow-y-auto pb-28 lg:pb-0 p-4 lg:p-12">
    <div class="max-w-[1300px] w-full mx-auto">
        <div id="contentFrame" class="animate-fadeIn"></div>
        <div id="footerContainer" class="mt-20 opacity-30"></div>
    </div>
</main>

<nav class="lg:hidden fixed bottom-5 left-5 right-5 glass-panel rounded-[2rem] px-2 py-3 z-[2000] flex justify-around items-center border border-white/10 shadow-2xl">
    <button onclick="location.href='staff_list.html'" class="flex flex-col items-center gap-1.5 text-blue-400 group transition-transform active:scale-90">
        <span class="text-xl">⬅️</span><span class="text-[8px] font-black uppercase tracking-tighter">Menu</span>
    </button>
    <div class="w-[1px] h-8 bg-white/10 mx-1"></div>
    <button onclick="switchTab('dash')" class="mobile-tab-btn flex flex-col items-center gap-1 transition-all"><span class="text-xl">🏠</span><span class="text-[8px] font-bold">HOME</span></button>
    <button onclick="switchTab('work')" class="mobile-tab-btn flex flex-col items-center gap-1 transition-all"><span class="text-xl">📝</span><span class="text-[8px] font-bold">WORK</span></button>
    <button onclick="switchTab('schedule')" class="mobile-tab-btn flex flex-col items-center gap-1 transition-all"><span class="text-xl">📅</span><span class="text-[8px] font-bold">CAL</span></button>
    <button onclick="switchTab('leave')" class="mobile-tab-btn flex flex-col items-center gap-1 transition-all"><span class="text-xl">🏖️</span><span class="text-[8px] font-bold">VAC</span></button>
    <button onclick="switchTab('statistic')" class="mobile-tab-btn flex flex-col items-center gap-1 transition-all"><span class="text-xl">📈</span><span class="text-[8px] font-bold">STAT</span></button>
    <button onclick="switchTab('setting')" class="mobile-tab-btn flex flex-col items-center gap-1 transition-all"><span class="text-xl">⚙️</span><span class="text-[8px] font-bold">SET</span></button>
</nav>

<div id="profileCustomModal" class="hidden fixed inset-0 z-[3000] flex items-center justify-center p-4 bg-black/90 backdrop-blur-xl">
    <div class="glass-panel w-full max-w-xl rounded-[2.5rem] overflow-hidden border border-white/10 animate-fadeIn">
        <div class="p-7 border-b border-white/5 flex justify-between items-center bg-white/5">
            <h3 id="modalTitle" class="text-lg font-black text-white uppercase tracking-widest italic">Identity Select</h3>
            <button onclick="closeProfileModal()" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-white text-3xl hover:bg-white/10 rounded-full transition-all">&times;</button>
        </div>
        <div id="modalBody" class="p-8 max-h-[60vh] overflow-y-auto no-scrollbar"></div>
    </div>
</div>

<script>
/* ───── 기존 기능 100% 수용 Logic ───── */
const loggedInUser = sessionStorage.getItem('loggedInUser');
if (!loggedInUser) { location.href = "index.html"; }
const firebaseConfig = { apiKey: "AIzaSyD7AmDGW7b03SHjvnH5YyAx4yyaHR0qWZQ", authDomain: "tdlid-dailyreport.firebaseapp.com", databaseURL: "https://tdlid-dailyreport-default-rtdb.firebaseio.com", projectId: "tdlid-dailyreport", storageBucket: "tdlid-dailyreport.firebasestorage.app", messagingSenderId: "922333077514", appId: "1:922333077514:web:8914e5b06ac1f417707ff3", measurementId: "G-1TVZQYHWDL" };
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const PROFILE_IMAGES = ['image-001.webp', 'image-002.webp', 'image-003.webp', 'image-004.webp', 'image-005.webp', 'image-01.gif', 'image-02.gif', 'image-03.gif', 'image-04.gif', 'image-05.gif', 'image-06.gif', 'image-07.gif', 'image-08.gif', 'image-09.gif', 'image-10.gif', 'image-11.gif', 'image-12.gif', 'image-13.gif', 'image-14.gif', 'image-15.gif', 'image-16.gif', 'image-17.gif', 'image-18.gif', 'image-19.gif', 'image-20.gif', 'image-21.gif', 'image-22.gif', 'image-23.gif', 'image-24.gif', 'image-25.gif', 'image-26.gif', 'image-27.gif'];

/* ───── UI Helpers ───── */
window.openProfileModal = function(title, bodyHtml) { 
    const m = document.getElementById('profileCustomModal'); 
    document.getElementById('modalTitle').innerText = title; 
    document.getElementById('modalBody').innerHTML = bodyHtml; 
    m.classList.remove('hidden'); 
};
window.closeProfileModal = () => document.getElementById('profileCustomModal').classList.add('hidden');
window.openProfileImagePicker = function() { 
    let g = `<div class="grid grid-cols-3 sm:grid-cols-4 gap-4">`; 
    PROFILE_IMAGES.forEach(i => { g += `<div onclick="saveStaffProfile('${i}')" class="group relative aspect-square rounded-2xl overflow-hidden cursor-pointer border-2 border-transparent hover:border-blue-500 hover:scale-105 transition-all shadow-lg"><img src="images/profile/${i}" class="w-full h-full object-cover"></div>`; }); 
    g += `</div>`; openProfileModal('Change Profile', g); 
};
window.saveStaffProfile = function(i) { 
    if(!confirm("변경하시겠습니까?")) return; 
    db.ref('users/' + loggedInUser).update({ profileImg: i, profileUpdatedAt: firebase.database.ServerValue.TIMESTAMP }).then(() => closeProfileModal());
};

if(loggedInUser) { 
    document.getElementById('desktopUser').innerText = loggedInUser; 
    db.ref('users/' + loggedInUser).on('value', snap => { 
        const ud = snap.val(); if (!ud) return; 
        const pi = ud.profileImg || 'image-001.webp'; 
        const ec = document.getElementById('navEmojiContainer'); 
        if(ec) { ec.innerHTML = `<img src="images/profile/${pi}" class="nav-profile-img shadow-xl shadow-blue-500/20"><div class="edit-badge"><svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></div>`; } 
    }); 
}

/* ───── Tab & Content Load ───── */
window.switchTab = function(t) {
    const pB = document.querySelectorAll('.pc-tab-btn'); 
    const mB = document.querySelectorAll('.mobile-tab-btn');
    const tabMapping = { dash: 'staff_main.html', work: 'staff_report.html', schedule: 'staff_calendar.html', leave: 'staff_leave.html', statistic: 'staff_statistic.html', setting: 'staff_setting.html', all: 'staff_allatt.html' };
    const activeTab = tabMapping[t] ? t : 'dash';
    
    pB.forEach(b => b.classList.remove('tab-active')); 
    mB.forEach(b => b.classList.remove('mobile-tab-active'));
    
    const navIndex = { dash: 0, work: 1, schedule: 2, leave: 3, statistic: 4, setting: 5 };
    const i = navIndex[activeTab];
    if(i !== undefined) { if(pB[i]) pB[i].classList.add('tab-active'); if(mB[i]) mB[i].classList.add('mobile-tab-active'); }

    loadHTML(tabMapping[activeTab]);
}

window.loadHTML = async function(u) {
    try {
        const f = document.getElementById('contentFrame'); 
        f.innerHTML = `<div class="flex items-center justify-center h-64"><div class="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div></div>`;
        const r = await fetch(u); const h = await r.text(); f.innerHTML = h;
        const fc = document.getElementById('footerContainer'); 
        if (fc && !fc.innerHTML) { const fr = await fetch('staff_footer.html'); if(fr.ok) fc.innerHTML = await fr.text(); }
        executeScripts(f);
    } catch (e) { document.getElementById('contentFrame').innerHTML = `<div class="p-10 glass-panel text-center text-rose-500 font-black">PAGE NOT FOUND</div>`; }
}

function executeScripts(con) {
    con.querySelectorAll('script').forEach(os => {
        const ns = document.createElement('script'); Array.from(os.attributes).forEach(at => ns.setAttribute(at.name, at.value));
        if (os.src) { ns.src = os.src; ns.async = false; } else { ns.textContent = os.textContent; }
        document.head.appendChild(ns).parentNode.removeChild(ns);
    });
}

/* ───── Weather Service ───── */
async function fetchJakartaWeather() {
    try {
        const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-6.2088&longitude=106.8456&current_weather=true');
        const data = await response.json();
        const weather = data.current_weather;
        document.getElementById('weatherTemp').innerText = `${Math.round(weather.temperature)}°C`;
        const code = weather.weathercode;
        let icon = '☀️';
        if (code >= 1 && code <= 3) icon = '⛅'; else if (code >= 45 && code <= 48) icon = '☁️'; else if (code >= 51 && code <= 67) icon = '🌧️'; else if (code >= 95) icon = '⛈️';
        document.getElementById('weatherIcon').innerText = icon;
    } catch (error) { }
}

window.logout = function() { if (!confirm("Log out?")) return; sessionStorage.clear(); localStorage.removeItem('loggedInUser'); firebase.auth().signOut().finally(() => window.location.replace("index.html")); };

fetchJakartaWeather();
setTimeout(() => switchTab('dash'), 200);
</script>
</body>
</html>
