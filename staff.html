<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - DAILY SYSTEM</title>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />

    <style>
        /* =====================================================
           DAY-BASED THEME SYSTEM
           0=Sun 1=Mon 2=Tue 3=Wed 4=Thu 5=Fri 6=Sat
        ===================================================== */

        /* MON — Deep Navy Steel */
        body.day-1 {
            --da: #3b82f6;
            --da2: #1d4ed8;
            --da3: #60a5fa;
            --dg: rgba(59,130,246,0.16);
            --dg2: rgba(29,78,216,0.10);
            --db: rgba(59,130,246,0.22);
            --db2: rgba(59,130,246,0.10);
            --ds: rgba(12,20,40,0.92);
            --dc: rgba(10,18,36,0.80);
            --panel-bg: linear-gradient(150deg,#03091a 0%,#060f26 55%,#04091e 100%);
            --aside-bg: linear-gradient(180deg,#030818 0%,#060e22 60%,#040a1c 100%);
        }
        /* TUE — Dark Emerald Forge */
        body.day-2 {
            --da: #10b981;
            --da2: #047857;
            --da3: #34d399;
            --dg: rgba(16,185,129,0.16);
            --dg2: rgba(4,120,87,0.10);
            --db: rgba(16,185,129,0.22);
            --db2: rgba(16,185,129,0.10);
            --ds: rgba(2,16,11,0.92);
            --dc: rgba(2,14,10,0.80);
            --panel-bg: linear-gradient(150deg,#010d06 0%,#031608 55%,#021009 100%);
            --aside-bg: linear-gradient(180deg,#010905 0%,#031407 60%,#020e06 100%);
        }
        /* WED — Crimson Obsidian */
        body.day-3 {
            --da: #ef4444;
            --da2: #b91c1c;
            --da3: #f87171;
            --dg: rgba(239,68,68,0.16);
            --dg2: rgba(185,28,28,0.10);
            --db: rgba(239,68,68,0.22);
            --db2: rgba(239,68,68,0.10);
            --ds: rgba(18,4,4,0.92);
            --dc: rgba(16,3,3,0.80);
            --panel-bg: linear-gradient(150deg,#0e0202 0%,#180404 55%,#120303 100%);
            --aside-bg: linear-gradient(180deg,#0a0101 0%,#140303 60%,#0e0202 100%);
        }
        /* THU — Violet Abyss */
        body.day-4 {
            --da: #a855f7;
            --da2: #7c3aed;
            --da3: #c084fc;
            --dg: rgba(168,85,247,0.16);
            --dg2: rgba(124,58,237,0.10);
            --db: rgba(168,85,247,0.22);
            --db2: rgba(168,85,247,0.10);
            --ds: rgba(10,4,18,0.92);
            --dc: rgba(8,3,16,0.80);
            --panel-bg: linear-gradient(150deg,#060110 0%,#0c0319 55%,#080214 100%);
            --aside-bg: linear-gradient(180deg,#04010c 0%,#0a0217 60%,#060110 100%);
        }
        /* FRI — Amber Furnace */
        body.day-5 {
            --da: #f59e0b;
            --da2: #d97706;
            --da3: #fcd34d;
            --dg: rgba(245,158,11,0.16);
            --dg2: rgba(217,119,6,0.10);
            --db: rgba(245,158,11,0.22);
            --db2: rgba(245,158,11,0.10);
            --ds: rgba(18,12,2,0.92);
            --dc: rgba(16,10,1,0.80);
            --panel-bg: linear-gradient(150deg,#0e0700 0%,#170e00 55%,#120a00 100%);
            --aside-bg: linear-gradient(180deg,#0a0500 0%,#140c00 60%,#0e0700 100%);
        }
        /* SAT/SUN — Slate Void */
        body.day-0, body.day-6 {
            --da: #64748b;
            --da2: #475569;
            --da3: #94a3b8;
            --dg: rgba(100,116,139,0.14);
            --dg2: rgba(71,85,105,0.08);
            --db: rgba(100,116,139,0.20);
            --db2: rgba(100,116,139,0.08);
            --ds: rgba(8,10,14,0.92);
            --dc: rgba(6,8,12,0.80);
            --panel-bg: linear-gradient(150deg,#040507 0%,#07090d 55%,#050608 100%);
            --aside-bg: linear-gradient(180deg,#030406 0%,#060810 60%,#040507 100%);
        }

        /* =====================================================
           GLOBAL BASE
        ===================================================== */
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: "Pretendard", sans-serif;
            background: var(--panel-bg);
            color: #e2e8f0;
            margin: 0; padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }

        /* Animated grid */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image:
                linear-gradient(var(--db2) 1px, transparent 1px),
                linear-gradient(90deg, var(--db2) 1px, transparent 1px);
            background-size: 56px 56px;
            opacity: 0.22;
            pointer-events: none;
            z-index: 0;
            animation: gridDrift 35s linear infinite;
        }
        @keyframes gridDrift {
            0%   { background-position: 0 0; }
            100% { background-position: 56px 56px; }
        }

        /* Ambient radial glow */
        body::after {
            content: '';
            position: fixed;
            top: -25%; left: -15%;
            width: 75%; height: 75%;
            background: radial-gradient(ellipse, var(--dg) 0%, transparent 68%);
            pointer-events: none; z-index: 0;
            animation: glowFloat 14s ease-in-out infinite alternate;
        }
        @keyframes glowFloat {
            0%   { transform: translate(0,0) scale(1); }
            100% { transform: translate(6%,4%) scale(1.08); }
        }

        main, aside, header, nav { position: relative; z-index: 1; }

        /* =====================================================
           GLASS PANEL (replaces .glass-panel)
        ===================================================== */
        .glass-panel {
            background: var(--dc);
            border: 1px solid var(--db);
            box-shadow:
                0 0 0 1px var(--db),
                0 8px 24px rgba(0,0,0,0.5),
                0 20px 60px rgba(0,0,0,0.4),
                inset 0 1px 0 rgba(255,255,255,0.06),
                inset 0 -1px 0 rgba(0,0,0,0.25);
            backdrop-filter: blur(16px);
        }

        /* =====================================================
           ASIDE / SIDEBAR
        ===================================================== */
        aside {
            background: var(--aside-bg);
            border-right: 1px solid var(--db);
            box-shadow:
                4px 0 32px rgba(0,0,0,0.6),
                inset 0 0 50px var(--dg2);
        }

        /* Sidebar scrollable nav */
        aside .hidden.lg\:flex { min-height: 0; }
        aside .hidden.lg\:flex > nav.flex {
            overflow-y: auto;
            overflow-x: hidden;
            min-height: 0;
            scrollbar-width: thin;
            scrollbar-color: var(--da) transparent;
            padding-bottom: 0.5rem;
        }
        aside .hidden.lg\:flex > nav.flex::-webkit-scrollbar { width: 2px; }
        aside .hidden.lg\:flex > nav.flex::-webkit-scrollbar-track { background: transparent; }
        aside .hidden.lg\:flex > nav.flex::-webkit-scrollbar-thumb { background: var(--da); border-radius: 99px; }

        /* =====================================================
           BRAND
        ===================================================== */
        .brand-title {
            font-weight: 900;
            font-style: italic;
            letter-spacing: -0.03em;
            text-shadow: 0 0 18px var(--dg), 0 2px 4px rgba(0,0,0,0.5);
        }
        .brand-accent { color: var(--da); }

        /* =====================================================
           PROFILE
        ===================================================== */
        .nav-profile-img {
            width: 60px; height: 60px;
            border-radius: 50%;
            border: 2px solid var(--da);
            object-fit: cover;
            box-shadow:
                0 0 0 3px var(--dg),
                0 0 18px var(--dg),
                0 4px 12px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }
        .nav-profile-img:hover {
            box-shadow:
                0 0 0 4px var(--da),
                0 0 28px var(--dg),
                0 4px 16px rgba(0,0,0,0.6);
            transform: scale(1.04);
        }
        @media (min-width: 1024px) {
            .nav-profile-img { width: 90px !important; height: 90px !important; }
        }

        .edit-badge {
            position: absolute;
            bottom: 5px; right: 5px;
            background: var(--da);
            width: 22px; height: 22px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid #000;
            box-shadow: 0 0 10px var(--dg), 0 2px 6px rgba(0,0,0,0.5);
        }

        /* =====================================================
           DAY BADGE
        ===================================================== */
        .day-badge {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 3px 10px;
            border-radius: 999px;
            background: var(--dg2);
            border: 1px solid var(--db);
            font-size: 0.62rem;
            font-weight: 900;
            letter-spacing: 0.12em;
            color: var(--da3);
            text-transform: uppercase;
            box-shadow: 0 0 10px var(--dg2);
        }
        .day-dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--da);
            box-shadow: 0 0 5px var(--da);
            animation: dotPulse 2s ease-in-out infinite;
        }
        @keyframes dotPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.5; transform: scale(0.65); }
        }

        /* =====================================================
           WEATHER CHIP
        ===================================================== */
        #jakartaWeather, #mobileWeatherChip {
            background: rgba(0,0,0,0.35);
            border: 1px solid var(--db);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
        }
        #weatherTemp, #mobileWeatherTemp {
            color: var(--da3) !important;
        }

        /* =====================================================
           NAV BUTTONS
        ===================================================== */
        .btn-3d {
            transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .btn-3d:active { transform: translateY(2px) scale(0.97); }

        .pc-tab-btn {
            position: relative;
            overflow: hidden;
            border: 1px solid transparent !important;
            transition: all 0.2s ease;
        }
        .pc-tab-btn::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: var(--da);
            border-radius: 0 2px 2px 0;
            transform: scaleY(0);
            transition: transform 0.2s ease;
        }
        .tab-active {
            background: var(--dg) !important;
            color: var(--da3) !important;
            font-weight: 900 !important;
            border-color: var(--db) !important;
            box-shadow:
                0 4px 12px var(--dg2),
                inset 0 1px 0 rgba(255,255,255,0.05) !important;
            transform: translateY(0) !important;
            text-shadow: 0 0 8px var(--dg);
        }
        .tab-active::before { transform: scaleY(1); }

        .mobile-tab-active {
            color: var(--da) !important;
            font-weight: 900;
            text-shadow: 0 0 8px var(--dg);
        }

        /* Back-to-main button */
        .main-menu-btn {
            color: var(--da3) !important;
            background: var(--dg2) !important;
            border: 1px solid var(--db) !important;
        }
        .main-menu-btn:hover {
            background: var(--dg) !important;
        }

        /* TDLiD link */
        .tdlid-link {
            color: var(--da3) !important;
            border: 1px solid var(--db);
            transition: all 0.2s;
        }
        .tdlid-link:hover {
            background: var(--dg2);
        }

        /* Online dot */
        .online-dot {
            background: var(--da) !important;
            box-shadow: 0 0 5px var(--da);
        }
        .online-text { color: var(--da3) !important; }

        /* Section divider */
        .aside-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--db), transparent);
            margin: 1rem 0;
        }

        /* =====================================================
           MOBILE HEADER & NAV
        ===================================================== */
        #mobileHeader {
            background: var(--aside-bg);
            border-bottom: 1px solid var(--db);
            box-shadow:
                0 2px 20px rgba(0,0,0,0.5),
                0 0 30px var(--dg2),
                inset 0 -1px 0 var(--db);
        }

        /* Mobile bottom nav uses glass-panel colors */
        .mobile-bottom-nav {
            background: var(--aside-bg) !important;
            border-top: 1px solid var(--db) !important;
            box-shadow:
                0 -4px 24px rgba(0,0,0,0.6),
                inset 0 1px 0 rgba(255,255,255,0.04) !important;
        }

        /* =====================================================
           MODAL
        ===================================================== */
        #profileCustomModal > div {
            background: var(--ds);
            border: 1px solid var(--db);
            box-shadow:
                0 0 0 1px var(--db),
                0 24px 70px rgba(0,0,0,0.85),
                0 0 80px var(--dg2),
                inset 0 1px 0 rgba(255,255,255,0.06);
        }
        #profileCustomModal > div > div:first-child {
            background: var(--dg2);
            border-bottom: 1px solid var(--db);
        }
        #modalTitle {
            color: var(--da3) !important;
            text-shadow: 0 0 10px var(--dg);
        }
        #profileCustomModal > div > div:first-child button {
            color: #475569;
            transition: all 0.2s;
        }
        #profileCustomModal > div > div:first-child button:hover {
            color: var(--da);
            background: var(--dg2);
        }

        /* Modal footer */
        .modal-footer-btns {
            display: flex; gap: 12px;
            margin-top: 20px;
            padding: 20px 0 10px 0;
            border-top: 1px solid var(--db);
            position: sticky; bottom: 0;
            background: var(--ds);
            z-index: 20;
        }
        .modal-footer-btns button {
            flex: 1; padding: 14px;
            border-radius: 1rem;
            font-size: 11px; font-weight: 900;
            text-transform: uppercase; letter-spacing: 0.1em;
            transition: all 0.2s;
        }
        .btn-modal-cancel {
            background: rgba(255,255,255,0.04);
            color: #94a3b8;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .btn-modal-save {
            background: var(--da2);
            color: white;
            border: 1px solid var(--db);
            box-shadow: 0 6px 14px var(--dg2);
        }
        .btn-modal-save:disabled {
            opacity: 0.4; cursor: not-allowed; filter: grayscale(1);
        }

        /* =====================================================
           PROFILE PICKER
        ===================================================== */
        .profile-opt {
            border: 2px solid transparent;
            border-radius: 1rem;
            overflow: hidden;
            background: rgba(255,255,255,0.04);
            transition: all 0.2s;
        }
        .profile-opt:hover {
            border-color: var(--da);
            box-shadow: 0 0 10px var(--dg);
            transform: scale(1.04);
        }
        .profile-option-active {
            border-color: var(--da) !important;
            box-shadow: 0 0 18px var(--dg) !important;
            transform: scale(1.06) !important;
            z-index: 10;
        }

        /* =====================================================
           BIRTHDAY
        ===================================================== */
        @keyframes birthdayBlink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.7; transform: scale(1.05); }
        }
        .birthday-active { animation: birthdayBlink 1.5s infinite ease-in-out; }
        #birthdayAlert span:first-child,
        #mobileBirthdayAlert span:first-child { color: var(--da3) !important; }

        /* =====================================================
           LOADING SPINNER
        ===================================================== */
        .day-spin {
            border-color: var(--db);
            border-top-color: var(--da);
        }

        /* =====================================================
           ANIMATIONS
        ===================================================== */
        .animate-fadeIn {
            animation: fadeInUp 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* =====================================================
           RESPONSIVE — keep original breakpoints
        ===================================================== */
        @media (max-width: 1023px) {
            body { padding-top: 65px; padding-bottom: 90px; }
            aside { width: 100% !important; height: 65px !important; position: fixed; top: 0; z-index: 1000; border-right: none !important; }
            aside > div:not(.lg\:hidden) { display: none !important; }
        }
        @media (min-width: 1024px) {
            body { padding-top: 0; padding-bottom: 0; }
            aside { height: 100vh !important; position: sticky; top: 0; }
        }

        /* Birthday dot */
        #mobile-birthday-dot.active { display: block !important; }

        /* No scrollbar utility */
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>

<body class="flex flex-col lg:flex-row min-h-screen">

<!-- =====================================================
     ASIDE / SIDEBAR
===================================================== -->
<aside class="w-full lg:w-80 lg:h-screen border-b lg:border-b-0 backdrop-blur-2xl sticky top-0 z-[1000] flex-shrink-0">

    <!-- MOBILE HEADER -->
    <div id="mobileHeader" class="lg:hidden flex items-center justify-between w-full h-[65px] px-5 border-b border-white/5">
        <div class="flex items-center gap-3">
            <div id="mobileProfileImg"
                 class="w-10 h-10 rounded-full overflow-hidden border bg-white/5 btn-3d relative cursor-pointer"
                 style="border-color:var(--db)"
                 onclick="openProfileImagePicker()"></div>
            <div class="flex flex-col">
                <div class="flex items-center gap-2">
                    <h1 class="brand-title text-lg text-white leading-none">Daily <span class="brand-accent">System</span></h1>
                    <div class="day-badge" id="mobileDayBadge">
                        <span class="day-dot"></span>
                        <span id="mobileDayLabel">MON</span>
                    </div>
                </div>

                <div id="mobileBirthdayAlert" class="hidden flex flex-col mt-0.5">
                    <span class="text-[9px] font-black birthday-active flex items-center gap-1">🎂 HAPPY BIRTHDAY!</span>
                    <span id="mobileBirthdayNames" class="text-[8px] font-bold text-white uppercase tracking-tight leading-tight"></span>
                </div>

                <div class="flex items-center gap-2 mt-1">
                    <div id="mobileWeatherChip" class="flex items-center gap-1 px-1.5 py-0.5 rounded border">
                        <span id="mobileWeatherIcon" class="text-[10px]">⏳</span>
                        <span id="mobileWeatherTemp" class="text-[9px] font-black">--°C</span>
                    </div>
                    <span class="text-slate-600 text-[8px]">|</span>
                    <span id="mobileUserName" class="text-[9px] font-black uppercase tracking-widest" style="color:var(--da3)">STAFF</span>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <button onclick="showAllStaffBirthdays()"
                    class="relative p-2 rounded-xl border btn-3d"
                    style="background:var(--dg2);border-color:var(--db)">
                <span class="text-lg">🎂</span>
                <div id="mobile-birthday-dot" class="hidden absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full border-2 border-slate-950 animate-pulse"
                     style="background:var(--da)"></div>
            </button>
            <button onclick="logout()"
                    class="p-2 bg-rose-600/10 rounded-xl border border-rose-500/20 text-rose-500 btn-3d">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- DESKTOP SIDEBAR -->
    <div class="hidden lg:flex p-8 flex-col h-full min-h-0 overflow-hidden">

        <!-- Brand + Day Badge -->
        <div class="flex flex-col gap-4 mb-8">
            <div class="flex items-center justify-between">
                <h1 class="brand-title text-2xl text-white">Daily <span class="brand-accent">System</span></h1>
                <div class="day-badge" id="desktopDayBadge">
                    <span class="day-dot"></span>
                    <span id="desktopDayLabel">MON</span>
                </div>
            </div>

            <!-- Profile Row -->
            <div class="flex items-center gap-4 mt-3">
                <div id="navEmojiContainer"
                     class="cursor-pointer relative group inline-block btn-3d"
                     onclick="openProfileImagePicker()"></div>
                <div class="flex flex-col">
                    <!-- Weather -->
                    <div id="jakartaWeather" class="flex items-center gap-2 mb-1.5 px-2.5 py-1 rounded-lg border w-fit">
                        <span id="weatherIcon" class="text-sm">⏳</span>
                        <span id="weatherTemp" class="text-[11px] font-black">--°C</span>
                        <span class="text-[9px] text-slate-500 font-bold tracking-widest uppercase">JKT</span>
                    </div>

                    <!-- Birthday list button -->
                    <button onclick="showAllStaffBirthdays()"
                            class="mt-2 ml-1 text-[9px] font-bold transition-colors uppercase tracking-widest flex items-center gap-1"
                            style="color:var(--da3)">
                        <img src="images/gif/staff.gif" alt="birthday" class="w-7 h-7 object-contain"> Staff Birthdays
                    </button>

                    <!-- Birthday Alert -->
                    <div id="birthdayAlert" class="hidden flex flex-col mb-3 ml-1 mt-2">
                        <span class="text-[10px] font-black birthday-active flex items-center gap-1">🎂 HAPPY BIRTHDAY!</span>
                        <span id="birthdayNames" class="text-[9px] font-bold text-white uppercase tracking-widest mt-0.5"></span>
                    </div>

                    <p id="desktopUser" class="text-[11px] font-black uppercase tracking-widest mt-1" style="color:var(--da3)"></p>
                    <span class="text-[9px] font-black flex items-center gap-1 mt-0.5 online-text">
                        <span class="w-1.5 h-1.5 rounded-full animate-pulse online-dot"></span> ONLINE
                    </span>
                </div>
            </div>

            <button onclick="logout()"
                    class="btn-3d text-[10px] font-black bg-rose-600/10 hover:bg-rose-600/20 text-rose-500 px-4 py-2 rounded-xl border border-rose-500/20 transition uppercase mt-2">

/* ── Birthday check ── */
async function checkTodayBirthdays() {
    const today = new Date();
    const tMonthDay = `${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
    const lunar = Lunar.fromDate(today);
    const lMonthDay = `${String(lunar.getMonth()).padStart(2,'0')}-${String(lunar.getDay()).padStart(2,'0')}`;

    const checkCache = () => {
        if (!cachedUsers) return;
        let birthdayMessages = [];
        Object.keys(cachedUsers).forEach(id => {
            const u = cachedUsers[id];
            if (!u || !u.birthday) return;
            const bMonthDay = u.birthday.substring(5);
            const type = u.birthType || "Solar";
            const bDateFull = u.birthday.replace(/-/g, '.');
            const isSolarMatch = (type === "Solar" || type === "양력") && bMonthDay === tMonthDay;
            const isLunarMatch = (type === "Lunar" || type === "음력") && bMonthDay === lMonthDay;
            if (isSolarMatch || isLunarMatch) birthdayMessages.push(`${id}: ${bDateFull}`);
        });

        const alertBox    = document.getElementById('birthdayAlert');
        const nameText    = document.getElementById('birthdayNames');
        const mAlertBox   = document.getElementById('mobileBirthdayAlert');
        const mNameText   = document.getElementById('mobileBirthdayNames');
        const mobileDot   = document.getElementById('mobile-birthday-dot');

        if (!alertBox && !mAlertBox) return;
        if (birthdayMessages.length > 0) {
            const namesHtml = birthdayMessages.join('<br>');
            if (alertBox)  alertBox.classList.remove('hidden');
            if (nameText)  nameText.innerHTML = namesHtml;
            if (mAlertBox) mAlertBox.classList.remove('hidden');
            if (mNameText) mNameText.innerHTML = namesHtml;
            if (mobileDot) mobileDot.classList.remove('hidden');

            const isMyBirthday = birthdayMessages.some(msg => msg.startsWith(loggedInUser + ":"));
            if (isMyBirthday) {
                const ub = document.getElementById('desktopUser');
                if (ub) { ub.style.color = 'var(--da3)'; }
                const mub = document.getElementById('mobileUserName');
                if (mub) { mub.style.color = 'var(--da3)'; }
            }
        }
    };

    if (cachedUsers) { checkCache(); }
    else {
        db.ref('users').once('value', snap => {
            cachedUsers = snap.val();
            checkCache();
        });
    }
}

/* ── Tab switcher ── */
window.switchTab = function(t) {
    try {
        const now = new Date();
        const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        firebase.database().ref(`attendance/${todayStr}`).off();
        firebase.database().ref('attendance').off();
        firebase.database().ref('settings/config').off();
        firebase.database().ref('settings/config/stdAttendance').off();
    } catch(e) { console.warn('Listener cleanup error:', e); }

    if (typeof window._leavePageCleanup === 'function') {
        window._leavePageCleanup();
        window._leavePageCleanup = null;
    }

    const pB = document.querySelectorAll('.pc-tab-btn');
    const mB = document.querySelectorAll('.mobile-tab-btn');
    const tabMapping = {
        dash: 'staff_dashboard.html', work: 'staff_report.html',
        schedule: 'staff_calendar.html', vacation: 'staff_vacation.html',
        statistic: 'staff_statistic.html', setting: 'staff_setting.html',
        photos: 'staff_photos.html', all: 'staff_allatt.html'
    };
    const activeTab = tabMapping[t] ? t : 'dash';
    pB.forEach(b => b.classList.remove('tab-active'));
    mB.forEach(b => b.classList.remove('mobile-tab-active'));

    const navIndex = { dash:0, work:1, schedule:2, vacation:3, statistic:4, setting:5, photos:6 };
    const i = navIndex[activeTab];
    if (i !== undefined) {
        if (pB[i]) pB[i].classList.add('tab-active');
        if (mB[i]) mB[i].classList.add('mobile-tab-active');
    }
    loadHTML(tabMapping[activeTab]);
};

window.loadHTML = async function(u) {
    try {
        const f = document.getElementById('contentFrame');
        // 로딩 스피너 표시
        f.innerHTML = `<div class="flex items-center justify-center h-64"><div class="w-10 h-10 border-4 rounded-full animate-spin day-spin"></div></div>`;
        
        const r = await fetch(u);
        const h = await r.text();
        
        // 1. 컨텐츠 삽입
        f.innerHTML = h;

        // 2. 브라우저가 DOM을 파싱하고 렌더링할 시간을 줍니다.
        // requestAnimationFrame은 다음 화면 갱신 직전에 실행되므로 DOM 안정성을 높여줍니다.
        requestAnimationFrame(() => {
            const fc = document.getElementById('footerContainer');
            if (fc && !fc.innerHTML) {
                fetch('staff_footer.html').then(fr => {
                    if (fr.ok) return fr.text();
                }).then(footerHtml => {
                    if (footerHtml) fc.innerHTML = footerHtml;
                });
            }

            // 3. 요소들이 확실히 존재할 때 스크립트 실행
            try {
                executeScripts(f);
            } catch (scriptError) {
                console.error("스크립트 실행 중 오류 발생:", scriptError);
            }
        });

    } catch(e) {
        console.error("페이지 로드 실패:", e);
        document.getElementById('contentFrame').innerHTML = 
            `<div class="p-10 glass-panel text-center font-black" style="color:var(--da)">PAGE NOT FOUND</div>`;
    }
};

function executeScripts(con) {
    con.querySelectorAll('script').forEach(os => {
        const ns = document.createElement('script');
        Array.from(os.attributes).forEach(at => ns.setAttribute(at.name, at.value));
        if (os.src) { ns.src = os.src; ns.async = false; } else { ns.textContent = os.textContent; }
        document.head.appendChild(ns).parentNode.removeChild(ns);
    });
}

/* ── Weather ── */
async function fetchJakartaWeather() {
    try {
        const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-6.2088&longitude=106.8456&current_weather=true');
        const data = await response.json();
        const weather = data.current_weather;
        const temp = Math.round(weather.temperature);
        const code = weather.weathercode;
        let icon = '☀️';
        if (code >= 1 && code <= 3) icon = '⛅';
        else if (code >= 45 && code <= 48) icon = '☁️';
        else if (code >= 51 && code <= 67) icon = '🌧️';
        else if (code >= 95) icon = '⛈️';
        if (document.getElementById('weatherTemp'))      document.getElementById('weatherTemp').innerText = `${temp}°C`;
        if (document.getElementById('weatherIcon'))      document.getElementById('weatherIcon').innerText = icon;
        if (document.getElementById('mobileWeatherTemp')) document.getElementById('mobileWeatherTemp').innerText = `${temp}°C`;
        if (document.getElementById('mobileWeatherIcon')) document.getElementById('mobileWeatherIcon').innerText = icon;
    } catch(e) { console.error("Weather load failed"); }
}

            return;
        }
        let html = `<div class="space-y-3">`;

            .map(key => ({ id: key, ...users[key] }))

        userList.forEach(u => {

                const bDate = u.birthday.replace(/-/g, '.');
                const pImg = (typeof u.profileImg === 'string') ? u.profileImg : 'image-001.webp';

        openProfileModal('Staff Birthdays', html);
    };

    if (cachedUsers) { renderList(cachedUsers); }

        openProfileModal('Staff Birthdays',
            '<div class="flex justify-center p-10"><div class="animate-spin rounded-full h-8 w-8 border-b-2 day-spin"></div></div>');
        db.ref('users').once('value', snap => {
            cachedUsers = snap.val();
            renderList(cachedUsers);
        }).catch(() => {
            openProfileModal('Staff Birthdays',
                `<div class="p-5 text-center font-black" style="color:var(--da)">Failed to load data.</div>`);
        });
    }
};

        if (u.birthday) {
            const pImg = u.profileImg || 'image-001.webp';
            const imgSrc = pImg.includes('/') ? pImg : `images/profile/${pImg}`;
            html += `
                <div class="flex items-center justify-between p-3 rounded-2xl border" style="background:var(--dg2);border-color:var(--db)">
                    <div class="flex items-center gap-3">
                        <img src="${imgSrc}" class="w-8 h-8 rounded-full object-cover" style="border:1px solid var(--db)"
                             loading="lazy" onerror="this.src='https://ui-avatars.com/api/?name=${u.id}'">
                        <div class="flex flex-col">
                            <span class="text-xs font-black text-white uppercase">${u.displayName || u.id}</span>
                            <span class="text-[10px] text-slate-400">${u.birthType || 'Solar'} ${u.birthday.replace(/-/g,'.')}</span>
                        </div>
                    </div>
                    <span class="text-[18px]">🎂</span>
                </div>`;
        }
    });
    html += `</div>`;
    openProfileModal('Staff Birthdays', html);
}

/* ── Logout ── */
window.logout = function() {
    if (!confirm("Log out?")) return;
    sessionStorage.clear();
    localStorage.removeItem('loggedInUser');
    firebase.auth().signOut().finally(() => window.location.replace("index.html"));
};

/* ── Init ── */
document.addEventListener('DOMContentLoaded', () => {
    const urlParams    = new URLSearchParams(window.location.search);
    const tabParam     = urlParams.get('tab');
    const initialPage  = sessionStorage.getItem('targetPage');
    sessionStorage.removeItem('targetPage');
    setTimeout(() => {
        if (tabParam) { switchTab(tabParam); }
        else if (initialPage) {
            if      (initialPage.includes('report'))    switchTab('work');
            else if (initialPage.includes('calendar'))  switchTab('schedule');
            else if (initialPage.includes('vacation'))  switchTab('vacation');
            else if (initialPage.includes('statistic')) switchTab('statistic');
            else if (initialPage.includes('photos'))    switchTab('photos');
            else if (initialPage.includes('setting'))   switchTab('setting');
            else switchTab('dash');
        } else { switchTab('dash'); }
    }, 200);
});
</script>
