<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - DAILY SYSTEM</title>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />

    <style>
        /* =====================================================
           DAY-BASED THEME SYSTEM — REVOLUTIONARY EDITION
           0=Sun 1=Mon 2=Tue 3=Wed 4=Thu 5=Fri 6=Sat
           
           각 요일: 색상 + 고유한 배경 패턴 + 특수 효과
        ===================================================== */

        /* ── MON ── Deep Navy Steel : 격자 홀로그램 */
        body.day-1 {
            --da: #3b82f6; --da2: #1d4ed8; --da3: #60a5fa;
            --dg: rgba(59,130,246,0.16); --dg2: rgba(29,78,216,0.10);
            --db: rgba(59,130,246,0.22); --db2: rgba(59,130,246,0.08);
            --ds: rgba(12,20,40,0.95); --dc: rgba(10,18,36,0.82);
            --panel-bg: linear-gradient(150deg,#020812 0%,#050f26 55%,#03091e 100%);
            --aside-bg: linear-gradient(180deg,#020714 0%,#060d22 60%,#040a1e 100%);
            /* MON 전용 — 청사진 격자 */
            --day-pattern: repeating-linear-gradient(
                0deg, transparent, transparent 39px, rgba(59,130,246,0.12) 39px, rgba(59,130,246,0.12) 40px
            ), repeating-linear-gradient(
                90deg, transparent, transparent 39px, rgba(59,130,246,0.12) 39px, rgba(59,130,246,0.12) 40px
            );
            --day-label: "MON BLUEPRINT";
            --day-font-style: normal;
            --day-letter-spacing: 0.2em;
        }

        /* ── TUE ── Dark Emerald Forge : 사선 해킹 스캔라인 */
        body.day-2 {
            --da: #10b981; --da2: #047857; --da3: #34d399;
            --dg: rgba(16,185,129,0.16); --dg2: rgba(4,120,87,0.10);
            --db: rgba(16,185,129,0.22); --db2: rgba(16,185,129,0.08);
            --ds: rgba(2,14,10,0.95); --dc: rgba(2,12,9,0.82);
            --panel-bg: linear-gradient(150deg,#010d06 0%,#031a0c 55%,#021008 100%);
            --aside-bg: linear-gradient(180deg,#010905 0%,#041408 60%,#030e07 100%);
            /* TUE 전용 — 매트릭스 사선 스캔 */
            --day-pattern: repeating-linear-gradient(
                -45deg,
                transparent 0px, transparent 8px,
                rgba(16,185,129,0.05) 8px, rgba(16,185,129,0.05) 9px
            );
            --day-label: "TUE//MATRIX";
            --day-font-style: italic;
            --day-letter-spacing: 0.05em;
        }

        /* ── WED ── Crimson Obsidian : 다이아몬드 경고 패턴 */
        body.day-3 {
            --da: #ef4444; --da2: #b91c1c; --da3: #f87171;
            --dg: rgba(239,68,68,0.16); --dg2: rgba(185,28,28,0.10);
            --db: rgba(239,68,68,0.22); --db2: rgba(239,68,68,0.08);
            --ds: rgba(16,4,4,0.95); --dc: rgba(14,3,3,0.82);
            --panel-bg: linear-gradient(150deg,#0e0202 0%,#1c0404 55%,#130303 100%);
            --aside-bg: linear-gradient(180deg,#0b0202 0%,#160303 60%,#100202 100%);
            /* WED 전용 — 위험 다이아몬드 격자 */
            --day-pattern: repeating-conic-gradient(
                rgba(239,68,68,0.07) 0% 25%, transparent 0% 50%
            ) 0 0 / 28px 28px;
            --day-label: "WED ◆ ALERT";
            --day-font-style: normal;
            --day-letter-spacing: 0.15em;
        }

        /* ── THU ── Violet Abyss : 육각형 우주 허니콤 */
        body.day-4 {
            --da: #a855f7; --da2: #7c3aed; --da3: #c084fc;
            --dg: rgba(168,85,247,0.16); --dg2: rgba(124,58,237,0.10);
            --db: rgba(168,85,247,0.22); --db2: rgba(168,85,247,0.08);
            --ds: rgba(9,3,17,0.95); --dc: rgba(8,3,16,0.82);
            --panel-bg: linear-gradient(150deg,#060112 0%,#0d031e 55%,#090216 100%);
            --aside-bg: linear-gradient(180deg,#04010e 0%,#0a021a 60%,#070112 100%);
            /* THU 전용 — 허니콤 육각형 */
            --day-pattern: radial-gradient(circle at 50% 50%, rgba(168,85,247,0.06) 15%, transparent 16%) 0 0 / 26px 26px,
                           radial-gradient(circle at 0 100%, rgba(168,85,247,0.06) 15%, transparent 16%) 0 0 / 26px 26px;
            --day-label: "THU ✦ COSMOS";
            --day-font-style: italic;
            --day-letter-spacing: 0.1em;
        }

        /* ── FRI ── Amber Furnace : 물결 열기 이퀄라이저 */
        body.day-5 {
            --da: #f59e0b; --da2: #d97706; --da3: #fcd34d;
            --dg: rgba(245,158,11,0.16); --dg2: rgba(217,119,6,0.10);
            --db: rgba(245,158,11,0.22); --db2: rgba(245,158,11,0.08);
            --ds: rgba(18,12,2,0.95); --dc: rgba(16,11,2,0.82);
            --panel-bg: linear-gradient(150deg,#0f0700 0%,#1a0e00 55%,#130b00 100%);
            --aside-bg: linear-gradient(180deg,#0c0600 0%,#160c00 60%,#100900 100%);
            /* FRI 전용 — 불꽃 물결 */
            --day-pattern: repeating-radial-gradient(
                ellipse at 50% 200%,
                transparent 0%, transparent 20%,
                rgba(245,158,11,0.06) 21%, rgba(245,158,11,0.06) 22%,
                transparent 23%
            );
            --day-label: "FRI // IGNITE";
            --day-font-style: italic;
            --day-letter-spacing: 0.08em;
        }

        /* ── SAT ── Slate Void : 노이즈 점점이 성운 */
        body.day-6 {
            --da: #64748b; --da2: #475569; --da3: #94a3b8;
            --dg: rgba(100,116,139,0.14); --dg2: rgba(71,85,105,0.08);
            --db: rgba(100,116,139,0.20); --db2: rgba(100,116,139,0.07);
            --ds: rgba(7,9,13,0.95); --dc: rgba(6,8,12,0.82);
            --panel-bg: linear-gradient(150deg,#040507 0%,#070a0f 55%,#050608 100%);
            --aside-bg: linear-gradient(180deg,#030406 0%,#060810 60%,#040507 100%);
            --day-pattern: radial-gradient(circle, rgba(100,116,139,0.12) 1px, transparent 1px) 0 0 / 18px 18px;
            --day-label: "SAT · VOID";
            --day-font-style: normal;
            --day-letter-spacing: 0.25em;
        }

        /* ── SUN ── Slate Void : 동심원 에너지 파동 */
        body.day-0 {
            --da: #64748b; --da2: #475569; --da3: #94a3b8;
            --dg: rgba(100,116,139,0.14); --dg2: rgba(71,85,105,0.08);
            --db: rgba(100,116,139,0.20); --db2: rgba(100,116,139,0.07);
            --ds: rgba(7,9,13,0.95); --dc: rgba(6,8,12,0.82);
            --panel-bg: radial-gradient(ellipse at 30% 40%, #0a0c10 0%, #050608 100%);
            --aside-bg: linear-gradient(180deg,#030406 0%,#060810 60%,#040507 100%);
            --day-pattern: repeating-radial-gradient(circle at 50% 50%,
                transparent 0px, transparent 30px,
                rgba(100,116,139,0.06) 31px, rgba(100,116,139,0.06) 32px
            );
            --day-label: "SUN · REST";
            --day-font-style: normal;
            --day-letter-spacing: 0.25em;
        }

        /* =====================================================
           요일별 ASIDE 특수 장식 (상단 바 스타일)
        ===================================================== */
        body.day-1 aside::before { background: linear-gradient(90deg, #1d4ed8, #3b82f6, #60a5fa, #3b82f6, #1d4ed8); }
        body.day-2 aside::before { background: linear-gradient(90deg, #047857, #10b981, #34d399, #10b981, #047857); }
        body.day-3 aside::before { background: linear-gradient(90deg, #b91c1c, #ef4444, #f87171, #ef4444, #b91c1c); }
        body.day-4 aside::before { background: linear-gradient(90deg, #7c3aed, #a855f7, #c084fc, #a855f7, #7c3aed); }
        body.day-5 aside::before { background: linear-gradient(90deg, #d97706, #f59e0b, #fcd34d, #f59e0b, #d97706); }
        body.day-0 aside::before, body.day-6 aside::before { background: linear-gradient(90deg, #475569, #64748b, #94a3b8, #64748b, #475569); }

        /* 요일별 글로우 애니메이션 색상 */
        body.day-1 .day-orb { background: radial-gradient(circle, rgba(59,130,246,0.25) 0%, transparent 70%); }
        body.day-2 .day-orb { background: radial-gradient(circle, rgba(16,185,129,0.25) 0%, transparent 70%); }
        body.day-3 .day-orb { background: radial-gradient(circle, rgba(239,68,68,0.25) 0%, transparent 70%); }
        body.day-4 .day-orb { background: radial-gradient(circle, rgba(168,85,247,0.25) 0%, transparent 70%); }
        body.day-5 .day-orb { background: radial-gradient(circle, rgba(245,158,11,0.25) 0%, transparent 70%); }
        body.day-0 .day-orb, body.day-6 .day-orb { background: radial-gradient(circle, rgba(100,116,139,0.2) 0%, transparent 70%); }

        /* 요일별 BADGE 모양 */
        body.day-1 .day-badge { border-radius: 4px; }            /* MON: 각진 사각형 */
        body.day-2 .day-badge { border-radius: 0; clip-path: polygon(6px 0%,100% 0%,calc(100% - 6px) 100%,0% 100%); }  /* TUE: 평행사변형 */
        body.day-3 .day-badge { clip-path: polygon(8px 0%,100% 0%,100% 100%,0 100%,0 8px); border-radius:0; }          /* WED: 노치 코너 */
        body.day-4 .day-badge { border-radius: 999px; }          /* THU: 풀 알약 */
        body.day-5 .day-badge { border-radius: 2px 12px 2px 12px; } /* FRI: 대각 라운드 */
        body.day-0 .day-badge, body.day-6 .day-badge { border-radius: 50%; width: 40px; height: 40px; display:inline-flex;align-items:center;justify-content:center; } /* SAT/SUN: 원 */

        /* 요일별 사이드바 특수 타이포 스타일 */
        body.day-1 .brand-title { font-weight: 900; letter-spacing: -0.04em; font-style: normal; }
        body.day-2 .brand-title { font-weight: 900; letter-spacing: 0.02em; font-style: italic; text-transform: uppercase; }
        body.day-3 .brand-title { font-weight: 900; letter-spacing: 0.08em; font-style: normal; text-transform: uppercase; }
        body.day-4 .brand-title { font-weight: 900; letter-spacing: -0.02em; font-style: italic; }
        body.day-5 .brand-title { font-weight: 900; letter-spacing: 0.04em; font-style: italic; }
        body.day-0 .brand-title, body.day-6 .brand-title { font-weight: 400; letter-spacing: 0.15em; font-style: normal; }

        /* =====================================================
           GLOBAL BASE
        ===================================================== */
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: "Pretendard", sans-serif;
            background: var(--panel-bg);
            color: #e2e8f0;
            margin: 0; padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }

        /* 요일별 배경 패턴 레이어 */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background: var(--day-pattern);
            opacity: 0.9;
            pointer-events: none;
            z-index: 0;
            animation: patternDrift 60s linear infinite;
        }
        @keyframes patternDrift {
            0%   { background-position: 0 0, 0 0; }
            100% { background-position: 60px 60px, 60px 60px; }
        }

        /* 보조 미세 격자 (MON 전용은 더 촘촘) */
        body.day-1::before {
            animation: patternDrift 45s linear infinite;
        }
        body.day-2::before {
            animation: patternDrift 80s linear infinite;
        }

        /* 앰비언트 글로우 오브 */
        .day-orb {
            position: fixed;
            top: -20%; left: -10%;
            width: 65%; height: 65%;
            pointer-events: none; z-index: 0;
            animation: orbFloat 16s ease-in-out infinite alternate;
        }
        @keyframes orbFloat {
            0%   { transform: translate(0,0) scale(1) rotate(0deg); }
            100% { transform: translate(8%,5%) scale(1.12) rotate(3deg); }
        }

        /* 보조 글로우 (우측 하단) */
        .day-orb-2 {
            position: fixed;
            bottom: -15%; right: -10%;
            width: 45%; height: 45%;
            pointer-events: none; z-index: 0;
            animation: orbFloat2 20s ease-in-out infinite alternate;
        }
        @keyframes orbFloat2 {
            0%   { transform: translate(0,0) scale(1); opacity: 0.5; }
            100% { transform: translate(-5%,-5%) scale(1.08); opacity: 0.8; }
        }

        main, aside, header, nav { position: relative; z-index: 1; }

        /* =====================================================
           GLASS PANEL
        ===================================================== */
        .glass-panel {
            background: var(--dc);
            border: 1px solid var(--db);
            box-shadow:
                0 0 0 1px var(--db),
                0 8px 24px rgba(0,0,0,0.5),
                0 20px 60px rgba(0,0,0,0.4),
                inset 0 1px 0 rgba(255,255,255,0.06),
                inset 0 -1px 0 rgba(0,0,0,0.25);
            backdrop-filter: blur(16px);
        }

        /* =====================================================
           ASIDE / SIDEBAR
        ===================================================== */
        aside {
            background: var(--aside-bg);
            border-right: 1px solid var(--db);
            box-shadow:
                4px 0 32px rgba(0,0,0,0.6),
                inset 0 0 50px var(--dg2);
            position: relative;
        }

        /* 요일별 상단 색상 바 */
        aside::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background-size: 200% 100%;
            animation: shimmer 3s linear infinite;
            z-index: 10;
        }
        @keyframes shimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* 사이드바 nav 스크롤 */
        aside .hidden.lg\:flex { min-height: 0; }
        aside .hidden.lg\:flex > nav.flex {
            overflow-y: auto;
            overflow-x: hidden;
            min-height: 0;
            scrollbar-width: thin;
            scrollbar-color: var(--da) transparent;
            padding-bottom: 0.5rem;
        }
        aside .hidden.lg\:flex > nav.flex::-webkit-scrollbar { width: 2px; }
        aside .hidden.lg\:flex > nav.flex::-webkit-scrollbar-thumb { background: var(--da); border-radius: 99px; }

        /* =====================================================
           BRAND
        ===================================================== */
        .brand-title {
            text-shadow: 0 0 20px var(--dg), 0 2px 4px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }
        .brand-accent { color: var(--da); }

        /* =====================================================
           PROFILE
        ===================================================== */
        .nav-profile-img {
            width: 60px; height: 60px;
            border-radius: 50%;
            border: 2px solid var(--da);
            object-fit: cover;
            box-shadow:
                0 0 0 3px var(--dg),
                0 0 18px var(--dg),
                0 4px 12px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }
        .nav-profile-img:hover {
            box-shadow:
                0 0 0 4px var(--da),
                0 0 28px var(--dg),
                0 4px 16px rgba(0,0,0,0.6);
            transform: scale(1.04);
        }
        @media (min-width: 1024px) {
            .nav-profile-img { width: 90px !important; height: 90px !important; }
        }

        .edit-badge {
            position: absolute; bottom: 5px; right: 5px;
            background: var(--da);
            width: 22px; height: 22px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid #000;
            box-shadow: 0 0 10px var(--dg), 0 2px 6px rgba(0,0,0,0.5);
        }

        /* =====================================================
           DAY BADGE — 요일별 다른 모양
        ===================================================== */
        .day-badge {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 3px 10px;
            background: var(--dg2);
            border: 1px solid var(--db);
            font-size: 0.6rem;
            font-weight: 900;
            letter-spacing: 0.12em;
            color: var(--da3);
            text-transform: uppercase;
            box-shadow: 0 0 10px var(--dg2), 0 0 20px var(--dg);
            transition: all 0.3s ease;
        }
        .day-dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--da);
            box-shadow: 0 0 5px var(--da);
            animation: dotPulse 2s ease-in-out infinite;
        }
        @keyframes dotPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.5; transform: scale(0.65); }
        }

        /* =====================================================
           WEATHER CHIP
        ===================================================== */
        #jakartaWeather, #mobileWeatherChip {
            background: rgba(0,0,0,0.35);
            border: 1px solid var(--db);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
        }
        #weatherTemp, #mobileWeatherTemp { color: var(--da3) !important; }

        /* =====================================================
           NAV BUTTONS — 요일별 활성화 스타일
        ===================================================== */
        .btn-3d {
            transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .btn-3d:active { transform: translateY(2px) scale(0.97); }

        .pc-tab-btn {
            position: relative; overflow: hidden;
            border: 1px solid transparent !important;
            transition: all 0.2s ease;
        }

        /* 요일별 좌측 액티브 바 */
        .pc-tab-btn::before {
            content: '';
            position: absolute; left: 0; top: 0; bottom: 0;
            width: 3px;
            background: var(--da);
            border-radius: 0 2px 2px 0;
            transform: scaleY(0);
            transition: transform 0.2s ease;
        }

        /* MON: 우측에도 미러 바 */
        body.day-1 .pc-tab-btn.tab-active::after {
            content: '';
            position: absolute; right: 0; top: 0; bottom: 0;
            width: 1px;
            background: var(--db);
        }

        /* WED: 활성시 배경에 위험 패턴 */
        body.day-3 .tab-active {
            background: repeating-linear-gradient(
                45deg, var(--dg), var(--dg) 3px, transparent 3px, transparent 8px
            ) !important;
        }

        /* THU: 활성시 글로우 강화 */
        body.day-4 .tab-active {
            box-shadow: 0 0 20px var(--dg), inset 0 0 10px var(--dg2) !important;
        }

        .tab-active {
            background: var(--dg) !important;
            color: var(--da3) !important;
            font-weight: 900 !important;
            border-color: var(--db) !important;
            box-shadow: 0 4px 12px var(--dg2), inset 0 1px 0 rgba(255,255,255,0.05) !important;
            text-shadow: 0 0 8px var(--dg);
        }
        .tab-active::before { transform: scaleY(1); }
        .mobile-tab-active {
            color: var(--da) !important;
            font-weight: 900;
            text-shadow: 0 0 8px var(--dg);
        }

        .main-menu-btn {
            color: var(--da3) !important;
            background: var(--dg2) !important;
            border: 1px solid var(--db) !important;
        }
        .main-menu-btn:hover { background: var(--dg) !important; }
        .tdlid-link {
            color: var(--da3) !important;
            border: 1px solid var(--db);
            transition: all 0.2s;
        }
        .tdlid-link:hover { background: var(--dg2); }
        .online-dot { background: var(--da) !important; box-shadow: 0 0 5px var(--da); }
        .online-text { color: var(--da3) !important; }
        .aside-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--db), transparent);
            margin: 1rem 0;
        }

        /* =====================================================
           MOBILE HEADER & NAV
        ===================================================== */
        #mobileHeader {
            background: var(--aside-bg);
            border-bottom: 1px solid var(--db);
            box-shadow: 0 2px 20px rgba(0,0,0,0.5), 0 0 30px var(--dg2), inset 0 -1px 0 var(--db);
            position: relative;
        }
        /* 모바일 헤더도 상단 컬러 바 */
        #mobileHeader::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, var(--da2), var(--da), var(--da3), var(--da), var(--da2));
            background-size: 200% 100%;
            animation: shimmer 3s linear infinite;
        }

        .mobile-bottom-nav {
            background: var(--aside-bg) !important;
            border-top: 1px solid var(--db) !important;
            box-shadow: 0 -4px 24px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.04) !important;
        }

        /* =====================================================
           MODAL
        ===================================================== */
        #profileCustomModal > div {
            background: var(--ds);

            border-top: 1px solid var(--db);
            position: sticky; bottom: 0;
            background: var(--ds); z-index: 20;
        }
        .modal-footer-btns button {
            flex: 1; padding: 14px; border-radius: 1rem;
            font-size: 11px; font-weight: 900;
            text-transform: uppercase; letter-spacing: 0.1em;

        .btn-modal-save { background: var(--da2); color: white; border: 1px solid var(--db); box-shadow: 0 6px 14px var(--dg2); }
        .btn-modal-save:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(1); }

        /* =====================================================
           PROFILE PICKER
        ===================================================== */
        .profile-opt {
            border: 2px solid transparent; border-radius: 1rem;
            overflow: hidden; background: rgba(255,255,255,0.04); transition: all 0.2s;
        }
        .profile-opt:hover { border-color: var(--da); box-shadow: 0 0 10px var(--dg); transform: scale(1.04); }
        .profile-option-active {
            border-color: var(--da) !important;
            box-shadow: 0 0 18px var(--dg) !important;
            transform: scale(1.06) !important;
            z-index: 10;
        }

        /* =====================================================
           BIRTHDAY
        ===================================================== */
        @keyframes birthdayBlink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.7; transform: scale(1.05); }
        }
        .birthday-active { animation: birthdayBlink 1.5s infinite ease-in-out; }
        #birthdayAlert span:first-child,
        #mobileBirthdayAlert span:first-child { color: var(--da3) !important; }

        /* =====================================================
           요일별 타이머 & 온라인 패널 테마
        ===================================================== */
        .day-spin { border-color: var(--db); border-top-color: var(--da); }

        /* 타이머 컨테이너 */
        .timer-wrapper {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--db);
            border-radius: 0.75rem;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 10px;
            color: #64748b;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        #logout-timer {
            color: var(--da3);
            font-weight: 900;
            font-size: 12px;
            letter-spacing: 0.08em;
            font-family: 'Courier New', monospace;
        }

        /* =====================================================
           ONLINE USERS PANEL — 요일 테마 완전 적용
        ===================================================== */
        #onlineUsersPanel {
            border-radius: 0.875rem;
            border: 1px solid var(--db);
            overflow: hidden;
            position: relative;
            background: rgba(0,0,0,0.4);
            box-shadow: 0 0 0 1px var(--db), 0 4px 16px rgba(0,0,0,0.4), inset 0 0 20px var(--dg2);
            margin-bottom: 0.5rem;
        }

        /* 스캔라인 효과 */
        #onlineUsersPanel::before {
            content: '';
            position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, var(--dg2), transparent);
            animation: onlineScan 5s linear infinite;
            pointer-events: none; z-index: 0;
        }
        @keyframes onlineScan {
            0% { left: -60%; } 100% { left: 160%; }
        }

        .online-panel-header {
            background: var(--dg2);
            border-bottom: 1px solid var(--db);
            padding: 7px 12px;
            display: flex; align-items: center; justify-content: space-between;
            position: relative; z-index: 1;
        }
        .online-panel-title {
            font-size: 0.58rem; font-weight: 900;
            letter-spacing: 0.15em; color: var(--da3);
            text-transform: uppercase;
            display: flex; align-items: center; gap: 6px;
        }
        .online-count-badge {
            font-size: 0.55rem; font-weight: 900;
            padding: 2px 7px; border-radius: 999px;
            background: var(--da); color: #000;
            letter-spacing: 0.05em; min-width: 18px; text-align: center;
            box-shadow: 0 0 8px var(--dg);
            animation: countPop 0.3s ease;
        }
        @keyframes countPop {
            0% { transform: scale(0.7); } 60% { transform: scale(1.2); } 100% { transform: scale(1); }
        }

        #onlineUsersList {
            position: relative; z-index: 1;
            max-height: 160px; overflow-y: auto; overflow-x: hidden;
            scrollbar-width: none; padding: 5px; display: flex;
            flex-direction: column; gap: 3px;
        }
        #onlineUsersList::-webkit-scrollbar { display: none; }

        .online-user-item {
            display: flex; align-items: center; gap: 8px;
            padding: 5px 8px; border-radius: 0.6rem;
            background: var(--dg2); border: 1px solid transparent;
            transition: all 0.25s ease;
            position: relative; overflow: hidden;
            animation: slideInUser 0.35s ease both;
        }
        @keyframes slideInUser {
            from { opacity: 0; transform: translateX(-8px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        .online-user-item:hover { background: var(--dg); border-color: var(--db); transform: translateX(2px); }
        .online-user-item::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
            background: var(--da); border-radius: 0 2px 2px 0;
            box-shadow: 0 0 6px var(--dg);
        }

        .online-user-avatar {
            width: 24px; height: 24px; border-radius: 50%;
            border: 1.5px solid var(--db); object-fit: cover; flex-shrink: 0;
            box-shadow: 0 0 8px var(--dg2);
        }
        .online-user-name {
            font-size: 0.63rem; font-weight: 900; color: #e2e8f0;
            text-transform: uppercase; letter-spacing: 0.05em; flex: 1;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .online-user-time {
            font-size: 0.5rem; font-weight: 700; color: var(--da3);
            letter-spacing: 0.04em; white-space: nowrap; flex-shrink: 0;
        }
        .online-live-dot {
            width: 5px; height: 5px; border-radius: 50%;
            background: var(--da); box-shadow: 0 0 5px var(--da); flex-shrink: 0;
            animation: livePulse 1.8s ease-in-out infinite;
        }
        @keyframes livePulse {
            0%, 100% { opacity: 1; } 50% { opacity: 0.4; }
        }
        .online-empty {
            text-align: center; padding: 12px 8px;
            font-size: 0.58rem; font-weight: 700; color: #334155;
            letter-spacing: 0.1em; text-transform: uppercase;
        }

        /* =====================================================
           요일별 사이드바 장식 요소
        ===================================================== */

        /* MON: 사이드바 좌측 세로 라인 3개 */
        body.day-1 aside .deco-lines {
            position: absolute; right: 6px; top: 80px; bottom: 80px;
            display: flex; gap: 3px; pointer-events: none; z-index: 0;
        }
        body.day-1 aside .deco-lines span {
            display: block; width: 1px; border-radius: 999px;
            background: var(--db);
        }
        body.day-1 aside .deco-lines span:nth-child(1) { opacity: 0.8; }
        body.day-1 aside .deco-lines span:nth-child(2) { opacity: 0.4; }
        body.day-1 aside .deco-lines span:nth-child(3) { opacity: 0.15; }

        /* WED: 경고 코너 노치 */
        body.day-3 aside .deco-corner {
            position: absolute; bottom: 16px; left: 16px;
            width: 24px; height: 24px;
            border-left: 2px solid var(--da);
            border-bottom: 2px solid var(--da);
            opacity: 0.4; pointer-events: none;
        }
        body.day-3 aside .deco-corner-tr {
            position: absolute; top: 16px; right: 16px;
            width: 24px; height: 24px;
            border-right: 2px solid var(--da);
            border-top: 2px solid var(--da);
            opacity: 0.4; pointer-events: none;
        }

        /* THU: 떠다니는 별 파티클 */
        body.day-4 .star-particle {
            position: fixed; pointer-events: none; z-index: 0;
            width: 2px; height: 2px;
            border-radius: 50%; background: var(--da);
            animation: starFloat var(--dur, 8s) ease-in-out infinite alternate;
        }

        /* FRI: 불꽃 파티클 */
        body.day-5 .ember-particle {
            position: fixed; pointer-events: none; z-index: 0;
            width: 3px; height: 3px; border-radius: 50%;
            background: var(--da);
            animation: emberRise var(--dur, 6s) ease-out infinite;
            opacity: 0;
        }
        @keyframes emberRise {
            0%   { opacity: 0.8; transform: translateY(0) translateX(0) scale(1); }
            100% { opacity: 0; transform: translateY(-120px) translateX(var(--dx,20px)) scale(0.3); }
        }

        /* =====================================================
           ANIMATIONS
        ===================================================== */
        .animate-fadeIn {
            animation: fadeInUp 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* =====================================================
           RESPONSIVE
        ===================================================== */
        @media (max-width: 1023px) {
            body { padding-top: 65px; padding-bottom: 90px; }
            aside { width: 100% !important; height: 65px !important; position: fixed; top: 0; z-index: 1000; border-right: none !important; }
            aside > div:not(.lg\:hidden) { display: none !important; }
        }
        @media (min-width: 1024px) {
            body { padding-top: 0; padding-bottom: 0; }
            aside { height: 100vh !important; position: sticky; top: 0; }
        }

        #mobile-birthday-dot.active { display: block !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>

/* ── Day theme init + 요일별 특수 효과 ── */
(function() {
    const day = new Date().getDay();
    document.body.classList.add('day-' + day);
    const labels = {0:'SUN',1:'MON',2:'TUE',3:'WED',4:'THU',5:'FRI',6:'SAT'};
    const lbl = labels[day] || 'MON';
    document.addEventListener('DOMContentLoaded', () => {
        ['desktopDayLabel','mobileDayLabel'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.textContent = lbl;
        });

        /* THU: 별 파티클 생성 */
        if (day === 4) {
            for (let i = 0; i < 12; i++) {
                const star = document.createElement('div');
                star.className = 'star-particle';
                star.style.cssText = `
                    left: ${Math.random()*100}%;
                    top: ${Math.random()*100}%;
                    --dur: ${6+Math.random()*8}s;
                    opacity: ${0.3+Math.random()*0.5};
                    width: ${1+Math.random()*2}px;
                    height: ${1+Math.random()*2}px;
                    animation: starFloat var(--dur) ease-in-out infinite alternate;
                    animation-delay: ${Math.random()*5}s;
                `;
                document.body.appendChild(star);
            }
            const style = document.createElement('style');
            style.textContent = `@keyframes starFloat {
                0%   { transform: translate(0,0) scale(1); opacity:0.3; }
                50%  { opacity: 0.8; }
                100% { transform: translate(${Math.random()>0.5?'':'-'}${10+Math.floor(Math.random()*20)}px,${Math.random()>0.5?'':'-'}${10+Math.floor(Math.random()*20)}px) scale(1.5); opacity:0.2; }
            }`;
            document.head.appendChild(style);
        }

        /* FRI: 불꽃 파티클 생성 */
        if (day === 5) {
            for (let i = 0; i < 8; i++) {
                const ember = document.createElement('div');
                ember.className = 'ember-particle';
                ember.style.cssText = `
                    left: ${10+Math.random()*30}%;
                    bottom: ${Math.random()*20}%;
                    --dur: ${3+Math.random()*4}s;
                    --dx: ${Math.random()>0.5?'':'-'}${10+Math.floor(Math.random()*30)}px;
                    animation-delay: ${Math.random()*3}s;
                    background: ${Math.random()>0.5 ? '#f59e0b' : '#ef4444'};
                `;
                document.body.appendChild(ember);
            }
        }
    });
})();

window.selectProfileTemp = function(element, fileName) {

window.confirmSaveProfile = function() {
    if (!tempSelectedProfileImg) return;

    const originalText = saveBtn.innerText;

    db.ref('users/' + loggedInUser).update({
        profileImg: tempSelectedProfileImg,
        profileUpdatedAt: firebase.database.ServerValue.TIMESTAMP

    .catch(e => { alert("Save failed: " + e.message); saveBtn.innerText = originalText; saveBtn.disabled = false; });
};

        profileUpdatedAt: firebase.database.ServerValue.TIMESTAMP

/* ── Birthday check ── */
async function checkTodayBirthdays() {
    const today = new Date();
    const tMonthDay = `${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
    const lunar = Lunar.fromDate(today);
    const lMonthDay = `${String(lunar.getMonth()).padStart(2,'0')}-${String(lunar.getDay()).padStart(2,'0')}`;

    const checkCache = () => {
        if (!cachedUsers) return;
        let birthdayMessages = [];
        Object.keys(cachedUsers).forEach(id => {
            const u = cachedUsers[id];
            if (!u || !u.birthday) return;
            const bMonthDay = u.birthday.substring(5);
            const type = u.birthType || "Solar";
            const bDateFull = u.birthday.replace(/-/g, '.');
            const isSolarMatch = (type === "Solar" || type === "양력") && bMonthDay === tMonthDay;
            const isLunarMatch = (type === "Lunar" || type === "음력") && bMonthDay === lMonthDay;
            if (isSolarMatch || isLunarMatch) birthdayMessages.push(`${id}: ${bDateFull}`);
        });

        const alertBox   = document.getElementById('birthdayAlert');
        const nameText   = document.getElementById('birthdayNames');
        const mAlertBox  = document.getElementById('mobileBirthdayAlert');
        const mNameText  = document.getElementById('mobileBirthdayNames');
        const mobileDot  = document.getElementById('mobile-birthday-dot');

        if (birthdayMessages.length > 0) {
            const namesHtml = birthdayMessages.join('<br>');
            if (alertBox)  alertBox.classList.remove('hidden');
            if (nameText)  nameText.innerHTML = namesHtml;
            if (mAlertBox) mAlertBox.classList.remove('hidden');
            if (mNameText) mNameText.innerHTML = namesHtml;
            if (mobileDot) mobileDot.classList.remove('hidden');
        }
    };

    if (cachedUsers) checkCache();
    else db.ref('users').once('value', snap => { cachedUsers = snap.val(); checkCache(); });
}

/* ── Tab switcher ── */
window.switchTab = function(t) {
    if (typeof window._leavePageCleanup === 'function') {
        window._leavePageCleanup();
        window._leavePageCleanup = null;
    }
    const pB = document.querySelectorAll('.pc-tab-btn');
    const mB = document.querySelectorAll('.mobile-tab-btn');
    const tabMapping = {
        dash: 'staff_dashboard.html', work: 'staff_report.html',
        schedule: 'staff_calendar.html', vacation: 'staff_vacation.html',
        statistic: 'staff_statistic.html', setting: 'staff_setting.html',
        photos: 'staff_photos.html', all: 'staff_allatt.html'
    };
    const activeTab = tabMapping[t] ? t : 'dash';
    pB.forEach(b => b.classList.remove('tab-active'));
    mB.forEach(b => b.classList.remove('mobile-tab-active'));
    const navIndex = { dash:0, work:1, schedule:2, vacation:3, statistic:4, setting:5, photos:6 };
    const i = navIndex[activeTab];
    if (i !== undefined) {
        if (pB[i]) pB[i].classList.add('tab-active');
        if (mB[i]) mB[i].classList.add('mobile-tab-active');
    }
    loadHTML(tabMapping[activeTab]);
};

window.loadHTML = async function(u) {
    try {
        const f = document.getElementById('contentFrame');
        if (!f) return;
        f.innerHTML = `<div class="flex items-center justify-center h-64"><div class="w-10 h-10 border-4 rounded-full animate-spin day-spin"></div></div>`;
        const r = await fetch(u);
        const h = await r.text();
        f.innerHTML = h;
        setTimeout(() => {
            const fc = document.getElementById('footerContainer');
            if (fc && !fc.innerHTML) {
                fetch('staff_footer.html').then(fr => { if (fr.ok) return fr.text(); })
                .then(footerHtml => { if (footerHtml && fc) fc.innerHTML = footerHtml; });
            }
            try { executeScripts(f); } catch (scriptError) { console.error("Script execution error:", scriptError); }
        }, 50);
    } catch(e) {
        console.error("Page load failed:", e);
        const f = document.getElementById('contentFrame');
        if (f) f.innerHTML = `<div class="p-10 glass-panel text-center font-black" style="color:var(--da)">PAGE NOT FOUND</div>`;
    }
};

function executeScripts(con) {
    if (!con) return;
    con.querySelectorAll('script').forEach(os => {
        const ns = document.createElement('script');
        Array.from(os.attributes).forEach(at => ns.setAttribute(at.name, at.value));
        if (os.src) { ns.src = os.src; ns.async = false; }
        else { ns.textContent = os.textContent; }
        document.head.appendChild(ns).parentNode.removeChild(ns);
    });
}

/* ── Weather ── */
async function fetchJakartaWeather() {
    try {
        const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-6.2088&longitude=106.8456&current_weather=true');
        const data = await response.json();
        const weather = data.current_weather;
        const temp = Math.round(weather.temperature);
        const code = weather.weathercode;
        let icon = '☀️';
        if (code >= 1 && code <= 3) icon = '⛅';
        else if (code >= 45 && code <= 48) icon = '☁️';
        else if (code >= 51 && code <= 67) icon = '🌧️';
        else if (code >= 95) icon = '⛈️';
        if (document.getElementById('weatherTemp'))       document.getElementById('weatherTemp').innerText = `${temp}°C`;
        if (document.getElementById('weatherIcon'))       document.getElementById('weatherIcon').innerText = icon;
        if (document.getElementById('mobileWeatherTemp')) document.getElementById('mobileWeatherTemp').innerText = `${temp}°C`;
        if (document.getElementById('mobileWeatherIcon')) document.getElementById('mobileWeatherIcon').innerText = icon;
    } catch(e) { console.error("Weather load failed"); }
}

/* ── 온라인 스태프 패널 ── */
(function initOnlineTracker() {
    function formatElapsed(ms) {
        const s = Math.floor(ms / 1000);
        if (s < 60) return `${s}s ago`;
        const m = Math.floor(s / 60);
        if (m < 60) return `${m}m ago`;
        return `${Math.floor(m/60)}h ago`;
    }
    function formatHHMM(ts) {
        const d = new Date(ts);
        return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    function renderOnlinePanel(userList) {
        const listEl = document.getElementById('onlineUsersList');
        const countEl = document.getElementById('onlineCountBadge');
        if (!listEl) return;

        const now = Date.now();
        // online_sts === 'ON' 인 유저 필터링 (5분 이내 lastSeen 또는 online_sts 기준)
        const online = userList.filter(u => u.online_sts === 'ON').sort((a, b) => (b.lastSeen || 0) - (a.lastSeen || 0));

        if (countEl) {
            countEl.textContent = online.length;
        }

        if (online.length === 0) {
            listEl.innerHTML = `<div class="online-empty">NO ACTIVE SESSIONS</div>`;
            return;
        }

        listEl.innerHTML = online.map((u, i) => {
            const lastSeen = u.lastSeen || now;
            const elapsed = now - lastSeen;
            const timeStr = elapsed < 120000 ? 'LIVE' : formatElapsed(elapsed);
            const loginStr = u.loginTime ? formatHHMM(u.loginTime) : '—';
            const imgSrc = u.profileImg
                ? (u.profileImg.includes('/') ? u.profileImg : `images/profile/${u.profileImg}`)
                : `https://ui-avatars.com/api/?name=${encodeURIComponent(u.name || u.id)}&background=0D1A24&color=64748b&size=64`;
            const isLive = elapsed < 120000;
            return `<div class="online-user-item" style="animation-delay:${i*0.05}s">
                <img src="${imgSrc}" class="online-user-avatar" alt="${u.name || u.id}"
                     onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(u.name || u.id)}&background=0D1A24&color=64748b'">
                <div class="flex flex-col flex-1 min-w-0">
                    <span class="online-user-name">${u.displayName || u.name || u.id}</span>
                    <span style="font-size:0.46rem;color:#475569;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;">${u.role || 'Staff'} · IN ${loginStr}</span>
                </div>
                <div class="flex flex-col items-end gap-0.5">
                    <span class="online-user-time">${timeStr}</span>
                    ${isLive ? '<span class="online-live-dot"></span>' : ''}
                </div>
            </div>`;
        }).join('');
    }

    function startOnlineListener() {
        if (typeof db === 'undefined') { setTimeout(startOnlineListener, 500); return; }
        db.ref('users').on('value', snap => {
            const usersData = snap.val() || {};
            const userList = Object.keys(usersData).map(uid => ({
                id: uid, ...usersData[uid]
            }));
            renderOnlinePanel(userList);
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        setTimeout(startOnlineListener, 800);
    });
})();

/* ── 10분 미활동 자동 로그아웃 ── */
(function() {
    const INACTIVE_TIMEOUT = 10 * 60 * 1000;
    let remainingTime = INACTIVE_TIMEOUT;
    let timerInterval = null;
    let logoutTimeout = null;

    function updateTimerUI() {
        const timerEl = document.getElementById('logout-timer');
        if (!timerEl) return;
        const minutes = Math.floor(remainingTime / 60000);
        const seconds = Math.floor((remainingTime % 60000) / 1000);
        timerEl.textContent = `${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
        /* 1분 이하: 경고색 */
        timerEl.style.color = remainingTime <= 60000 ? '#ef4444' : 'var(--da3)';
    }

    function resetInactivityTimer() {
        remainingTime = INACTIVE_TIMEOUT;
        updateTimerUI();
        if (logoutTimeout) clearTimeout(logoutTimeout);
        if (timerInterval) clearInterval(timerInterval);

        timerInterval = setInterval(() => {
            remainingTime -= 1000;
            if (remainingTime <= 0) clearInterval(timerInterval);
            updateTimerUI();
        }, 1000);

        logoutTimeout = setTimeout(() => {
            if (typeof window.logout === 'function') {
                const name = sessionStorage.getItem('loggedInUser') || localStorage.getItem('loggedInUser');
                const finalizeLogout = () => {
                    sessionStorage.clear();
                    localStorage.removeItem('loggedInUser');
                    firebase.auth().signOut().finally(() => { window.location.replace("index.html"); });
                };
                const dbRef = typeof database !== 'undefined' ? database : (typeof firebase !== 'undefined' ? firebase.database() : null);
                if (name && dbRef) {
                    dbRef.ref('users/' + name).update({ online_sts: 'OFF' }).then(finalizeLogout).catch(finalizeLogout);
                } else finalizeLogout();
            }
        }, INACTIVE_TIMEOUT);
    }

    ['mousedown','mousemove','keypress','scroll','touchstart'].forEach(event => {
        window.addEventListener(event, resetInactivityTimer, { passive: true });
    });
    document.addEventListener('DOMContentLoaded', () => { resetInactivityTimer(); });
})();

/* ── 브라우저 강제 종료 대응 ── */
function setupDisconnectHook() {
    const name = sessionStorage.getItem('loggedInUser') || localStorage.getItem('loggedInUser');
    const dbRef = typeof database !== 'undefined' ? database : (typeof firebase !== 'undefined' ? firebase.database() : null);
    if (name && dbRef) {
        dbRef.ref('users/' + name + '/online_sts').onDisconnect().set('OFF');
    }
}
document.addEventListener('DOMContentLoaded', () => { setTimeout(setupDisconnectHook, 1000); });

/* ── Logout ── */
window.logout = function() {
    if (!confirm("Log out?")) return;
    const name = sessionStorage.getItem('loggedInUser');
    const doLogout = () => {
        sessionStorage.clear();
        localStorage.removeItem('loggedInUser');
        firebase.auth().signOut().finally(() => { window.location.replace("index.html"); });
    };
    const dbRef = typeof database !== 'undefined' ? database : (typeof firebase !== 'undefined' ? firebase.database() : null);
    if (name && dbRef) {
        dbRef.ref('users/' + name).update({ online_sts: 'OFF' }).then(doLogout).catch(doLogout);
    } else doLogout();
};

/* ── Init ── */
document.addEventListener('DOMContentLoaded', () => {
    const urlParams   = new URLSearchParams(window.location.search);
    const tabParam    = urlParams.get('tab');
    const initialPage = sessionStorage.getItem('targetPage');
    sessionStorage.removeItem('targetPage');
    setTimeout(() => {
        if (tabParam) { switchTab(tabParam); }
        else if (initialPage) {
            if      (initialPage.includes('report'))    switchTab('work');
            else if (initialPage.includes('calendar'))  switchTab('schedule');
            else if (initialPage.includes('vacation'))  switchTab('vacation');
            else if (initialPage.includes('statistic')) switchTab('statistic');
            else if (initialPage.includes('photos'))    switchTab('photos');
            else if (initialPage.includes('setting'))   switchTab('setting');
            else switchTab('dash');
        } else { switchTab('dash'); }
    }, 200);
});
</script>
