<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<style>
/* ══════════════════════════════════════════
   STAFF VACATION — 3D DARK COCKPIT THEME
   Deep navy + indigo/violet command center
   Pretendard Font System
══════════════════════════════════════════ */

@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css');

:root {
    --bg:        #040810;
    --surface:   #080f1e;
    --surface2:  #0d1628;
    --surface3:  #111e33;
    --border:    rgba(255,255,255,0.06);
    --border2:   rgba(255,255,255,0.12);
    --text:      #f1f5f9;
    --muted:     #475569;
    --dim:       #1e293b;
    --indigo:    #6366f1;
    --green:     #10b981;
    --red:       #f43f5e;
    --blue:      #3b82f6;
    --amber:     #f59e0b;
    --violet:    #a855f7;
}

*, *::before, *::after { 
    box-sizing: border-box; 
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif;
}

/* ══ Leave Calendar Table ══ */
.leave-calendar-table {
    width: 100%; border-collapse: separate; border-spacing: 2px; table-layout: fixed;
}
.leave-calendar-table th {
    padding: 10px 0;
    font-size: 8px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
}
/* 이하 기존 CSS 계속... */
.leave-calendar-table th.text-rose-500   { color: rgba(244,63,94,0.8); text-shadow: 0 0 8px rgba(244,63,94,0.3); }
.leave-calendar-table th.text-blue-500   { color: rgba(59,130,246,0.8); text-shadow: 0 0 8px rgba(59,130,246,0.3); }
.leave-calendar-table th.text-slate-500  { color: var(--muted); }

/* ── Calendar Cells ── */
.leave-calendar-table td {
    height: 90px;
    background: linear-gradient(145deg, var(--surface3) 0%, var(--surface2) 100%);
    border: 1px solid rgba(20,30,50,0.8);
    border-radius: 8px;
    vertical-align: top; padding: 5px;
    position: relative;
    transition: all 0.18s cubic-bezier(0.23,1,0.32,1);
    box-shadow: 0 1px 4px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.03);
    cursor: pointer;
}
.leave-calendar-table td:hover {
    background: linear-gradient(145deg, rgba(99,102,241,0.1) 0%, var(--surface2) 100%);
    border-color: rgba(99,102,241,0.3);
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 6px 16px rgba(99,102,241,0.15), inset 0 1px 0 rgba(255,255,255,0.06);
    z-index: 2;
}

/* Weekend col width */
.leave-calendar-table col.weekend { width: 5%; }
.leave-calendar-table col.weekday { width: calc((100% - 10%) / 5); }
.leave-calendar-table td.sun-col,
.leave-calendar-table td.sat-col { width: 5%; padding: 3px 1px; }
.leave-calendar-table td.sun-col .leave-day-num,
.leave-calendar-table td.sat-col .leave-day-num { font-size: 8px; }

/* ── Date Number ── */
.leave-day-num {
    font-size: 10px; font-weight: 900;
    color: var(--muted); margin-bottom: 3px;
    font-family: 'SF Mono', monospace; letter-spacing: -0.02em;
}
.leave-day-num.text-rose-500 { color: rgba(244,63,94,0.7); }
.leave-day-num.text-blue-500 { color: rgba(59,130,246,0.7); }

/* ── Today Cell ── */
.today-cell {
    background: linear-gradient(145deg, rgba(99,102,241,0.14), rgba(99,102,241,0.06)) !important;
    border: 1px solid rgba(99,102,241,0.45) !important;
    box-shadow: 0 0 0 1px rgba(99,102,241,0.2), 0 4px 14px rgba(99,102,241,0.15) !important;
}
.today-cell .leave-day-num {
    color: var(--indigo);
    text-shadow: 0 0 10px rgba(99,102,241,0.5);
}
.today-mark {
    background: linear-gradient(135deg, #6366f1, #4f46e5);
    color: white; padding: 1px 5px; border-radius: 5px;
    font-size: 7px; font-weight: 900; margin-left: 4px;
    vertical-align: middle; display: inline-block;
    box-shadow: 0 0 8px rgba(99,102,241,0.4);
    font-family: 'SF Mono', monospace; letter-spacing: 0.05em;
}

/* ── Leave Badges ── */
.leave-badge {
    font-size: 8px; padding: 2px 5px; border-radius: 5px;
    margin-top: 2px; font-weight: 900; color: white;
    display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    font-family: 'SF Mono', monospace; letter-spacing: 0.03em;
}
.badge-pending {
    background: linear-gradient(135deg, rgba(245,158,11,0.9), rgba(180,115,9,0.9));
    border-left: 2px solid #f59e0b;
    box-shadow: 0 0 8px rgba(245,158,11,0.2);
}
.badge-approved {
    background: linear-gradient(135deg, rgba(16,185,129,0.9), rgba(4,120,87,0.9));
    border-left: 2px solid #10b981;
    box-shadow: 0 0 8px rgba(16,185,129,0.2);
}
.badge-others {
    background: linear-gradient(135deg, rgba(99,102,241,0.8), rgba(67,56,202,0.8));
    border-left: 2px solid #6366f1;
    box-shadow: 0 0 8px rgba(99,102,241,0.2);
    opacity: 0.85;
}

/* ══ Panel Cards (3D) ══ */
.bg-slate-900\/50 {
    position: relative;
    background: linear-gradient(145deg, var(--surface2) 0%, var(--surface) 100%) !important;
    border: 1px solid var(--border) !important;
    border-top: 1px solid var(--border2) !important;
    border-radius: 20px !important;
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.07),
        0 8px 28px rgba(0,0,0,0.5),
        0 2px 8px rgba(0,0,0,0.3) !important;
    transition: transform 0.3s cubic-bezier(0.23,1,0.32,1), box-shadow 0.3s ease;
    overflow: hidden;
}
.bg-slate-900\/50::before {
    content: '';
    position: absolute; top: 0; left: 10%; right: 10%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(99,102,241,0.28), transparent);
    pointer-events: none; z-index: 1;
}

/* ── NEW REQUEST button ── */
button[onclick="openLeaveModal()"] {
    background: linear-gradient(135deg, #6366f1, #4f46e5) !important;
    box-shadow: 0 4px 16px rgba(99,102,241,0.4), inset 0 1px 0 rgba(255,255,255,0.2) !important;
    border: none !important;
    transition: all 0.2s cubic-bezier(0.23,1,0.32,1) !important;
}
button[onclick="openLeaveModal()"]:hover {
    background: linear-gradient(135deg, #818cf8, #6366f1) !important;
    box-shadow: 0 8px 24px rgba(99,102,241,0.55), inset 0 1px 0 rgba(255,255,255,0.25) !important;
    transform: translateY(-2px) !important;
}

/* ── Nav buttons (prev/next/today) ── */
button[onclick*="changeLeaveMonth"],
button[onclick="goToToday()"] {
    background: linear-gradient(145deg, var(--surface3), var(--surface2)) !important;
    border: 1px solid var(--border) !important;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 2px 8px rgba(0,0,0,0.3) !important;
    transition: all 0.2s !important;
}
button[onclick*="changeLeaveMonth"]:hover,
button[onclick="goToToday()"]:hover {
    border-color: rgba(99,102,241,0.3) !important;
    background: rgba(99,102,241,0.1) !important;
    box-shadow: 0 0 12px rgba(99,102,241,0.2) !important;
    transform: translateY(-1px) !important;
    color: #a5b4fc !important;
}

/* ── Calendar month title ── */
#calendarMonthTitle {
    font-family: 'SF Mono', 'Fira Code', monospace !important;
    text-shadow: 0 0 20px rgba(99,102,241,0.2);
}

/* ── History Table ── */
#leaveHistoryBody tr { transition: background 0.15s; }
#leaveHistoryBody tr:hover { background: rgba(99,102,241,0.04) !important; }
#leaveHistoryBody td { font-family: 'SF Mono', monospace; }

/* ══ Modal ══ */
#leaveModal {
    background: rgba(0,0,0,0.88) !important;
    backdrop-filter: blur(12px) !important;
}
#leaveModal > div {
    position: relative;
    background: linear-gradient(145deg, #0d1628, #080f1e) !important;
    border: 1px solid rgba(255,255,255,0.08) !important;
    border-top: 1px solid rgba(99,102,241,0.3) !important;
    border-radius: 24px !important;
    box-shadow:
        0 40px 80px rgba(0,0,0,0.7),
        0 0 0 1px rgba(99,102,241,0.08),
        inset 0 1px 0 rgba(255,255,255,0.07) !important;
}
#leaveModal > div::before {
    content: '';
    position: absolute; top: 0; left: 15%; right: 15%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(99,102,241,0.4), transparent);
    pointer-events: none; border-radius: 50%;
}

/* Modal inputs */
#leaveModal select,
#leaveModal input[id="leaveDateRange"],
#leaveModal textarea {
    background: linear-gradient(145deg, #050a14, #070d1a) !important;
    border: 1px solid var(--dim) !important;
    border-radius: 12px !important;
    color: var(--text) !important;
    font-family: 'SF Mono', monospace !important;
    font-size: 12px !important;
    padding: 12px 14px !important;
    transition: border-color 0.2s, box-shadow 0.2s !important;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.35) !important;
    width: 100%;
}
#leaveModal select:focus,
#leaveModal input:focus,
#leaveModal textarea:focus {
    border-color: var(--indigo) !important;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.35), 0 0 0 3px rgba(99,102,241,0.12) !important;
    outline: none !important;
}
#leaveModal select:disabled,
#leaveModal textarea:disabled {
    opacity: 0.45; cursor: not-allowed;
}

/* Submit button */
#saveLeaveBtn {
    background: linear-gradient(135deg, #6366f1, #4f46e5) !important;
    box-shadow: 0 4px 16px rgba(99,102,241,0.4), inset 0 1px 0 rgba(255,255,255,0.18) !important;
    border: none !important;
    transition: all 0.2s ease !important;
    border-radius: 14px !important;
}
#saveLeaveBtn:hover {
    background: linear-gradient(135deg, #818cf8, #6366f1) !important;
    box-shadow: 0 8px 24px rgba(99,102,241,0.55), inset 0 1px 0 rgba(255,255,255,0.22) !important;
    transform: translateY(-1px) !important;
}

/* Cancel button */
#leaveModal button[onclick="closeLeaveModal()"] {
    background: linear-gradient(145deg, var(--surface3), var(--surface2)) !important;
    border: 1px solid var(--border) !important;
    color: var(--muted) !important;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 2px 8px rgba(0,0,0,0.3) !important;
    transition: all 0.2s !important;
    border-radius: 14px !important;
}
#leaveModal button[onclick="closeLeaveModal()"]:hover {
    background: rgba(255,255,255,0.05) !important;
    border-color: var(--border2) !important;
    color: var(--text) !important;
    transform: translateY(-1px) !important;
}

/* Delete button */
#deleteLeaveBtn {
    background: transparent !important;
    border: 1px solid rgba(244,63,94,0.2) !important;
    color: var(--red) !important;
    transition: all 0.2s !important;
    border-radius: 12px !important;
    padding: 10px !important;
}
#deleteLeaveBtn:hover {
    background: rgba(244,63,94,0.1) !important;
    border-color: rgba(244,63,94,0.4) !important;
    box-shadow: 0 0 12px rgba(244,63,94,0.2) !important;
}

/* Modal close button */
#leaveModal button[onclick="closeLeaveModal()"]:first-of-type {
    background: linear-gradient(145deg, var(--surface3), var(--surface2)) !important;
    border: 1px solid var(--border) !important;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 2px 6px rgba(0,0,0,0.3) !important;
    transition: all 0.2s !important;
}
#leaveModal button[onclick="closeLeaveModal()"]:first-of-type:hover {
    background: rgba(244,63,94,0.15) !important;
    border-color: rgba(244,63,94,0.3) !important;
    color: #fca5a5 !important;
}

/* Admin memo container */
#adminMemoContainer {
    background: linear-gradient(145deg, rgba(244,63,94,0.05), rgba(244,63,94,0.02)) !important;
    border: 1px solid rgba(244,63,94,0.15) !important;
    border-radius: 12px !important;
    padding: 14px !important;
}
#adminMemoText {
    color: rgba(252,165,165,0.9) !important;
    font-family: 'SF Mono', monospace !important;
    font-size: 11px !important;
    line-height: 1.6 !important;
}

/* Animation */
@keyframes modalZoom {
    from { opacity: 0; transform: scale(0.95) translateY(10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
}
.animate-zoomIn { animation: modalZoom 0.2s ease-out forwards; }

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}
.animate-fadeIn { animation: fadeIn 0.4s ease-out forwards; }

/* Scrollbar styling */
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

/* Flatpickr dark theme override */
.flatpickr-calendar {
    background: var(--surface2) !important;
    border: 1px solid var(--border) !important;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6) !important;
    border-radius: 16px !important;
}
.flatpickr-day.selected {
    background: var(--indigo) !important;
    border-color: var(--indigo) !important;
    box-shadow: 0 0 12px rgba(99,102,241,0.4) !important;
}
.flatpickr-day:hover {
    background: rgba(99,102,241,0.2) !important;
}

/* Responsive adjustments */
@media (max-width: 768px) {
    .leave-calendar-table td {
        height: 70px;
        padding: 3px;
    }
    .leave-day-num {
        font-size: 9px;
    }
    .leave-badge {
        font-size: 7px;
        padding: 2px 4px;
    }
}

<script>
(function() {
    const db = firebase.database();
    const user = sessionStorage.getItem('loggedInUser');
    let datePicker, editingId = null, editingData = null, currentViewDate = new Date();

    window.initLeavePage = function() {
        if (!user || user === "null") {
            alert("Login required.");
            return;
        }
        initFlatpickr();
        loadLeaveHistory();
        renderCalendar();
    };

    function initFlatpickr() {
        datePicker = flatpickr("#leaveDateRange", {
            mode: "range", dateFormat: "Y-m-d", theme: "dark", minDate: "today", 
            locale: { rangeSeparator: ' ~ ' }, static: true, disableMobile: true
        });
    }

window.renderCalendar = function() {
    const container = document.getElementById('leaveCalendarContainer');
    const title = document.getElementById('calendarMonthTitle');
    const year = currentViewDate.getFullYear(), month = currentViewDate.getMonth();
    title.innerText = currentViewDate.toLocaleString('en-US', { month: 'long', year: 'numeric' });
    
    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();
    const today = new Date();
    const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

    // 본인 데이터만이 아니라 전체 leaves 노드를 참조합니다.
    db.ref(`leaves`).once('value', snap => {
        const allLeavesData = snap.val() || {};
let html = `<table class="leave-calendar-table">
<colgroup>
    <col class="weekend">
    <col class="weekday">
    <col class="weekday">
    <col class="weekday">
    <col class="weekday">
    <col class="weekday">
    <col class="weekend">
</colgroup><thead><tr>`;

['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach((day, idx) => {
    let colorClass = idx === 0 ? 'text-rose-500' : (idx === 6 ? 'text-blue-500' : 'text-slate-500');
    html += `<th class="${colorClass}">${day}</th>`;
});

html += `</tr></thead><tbody><tr>`;
for(let i=0; i<firstDay; i++) html += `<td></td>`;
        
        for(let d=1; d<=lastDate; d++) {
            const dayOfWeek = (firstDay + d - 1) % 7;
            if(dayOfWeek === 0 && d > 1) html += `</tr><tr>`;
            
            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const isToday = dateStr === todayStr;
            
            let tdStyle = "";
            let dayNumClass = "leave-day-num";
            if (dayOfWeek === 0) { tdStyle = "background-color: rgba(244, 63, 94, 0.08);"; dayNumClass += " text-rose-500"; }
            else if (dayOfWeek === 6) { tdStyle = "background-color: rgba(59, 130, 246, 0.08);"; dayNumClass += " text-blue-500"; }

            const tdClass = isToday ? 'today-cell' : '';
            const todayBadge = isToday ? `<span class="today-mark">TODAY</span>` : '';
            
            let badges = '';
            
            // 모든 사용자의 데이터를 순회하며 해당 날짜의 휴가를 찾습니다.
            Object.entries(allLeavesData).forEach(([userId, yearsData]) => {
                const userYearLeaves = yearsData[year] || {};
                Object.entries(userYearLeaves).forEach(([id, item]) => {
                    if(dateStr >= item.startDate && dateStr <= item.endDate && item.status === 'Approved') {
                        if (userId === user) {
                            // 본인 휴가
                            const sClass = 'badge-approved';
                            badges += `<div class="leave-badge ${sClass}">${item.type}</div>`;
                        } else {
                            // 다른 팀원 휴가 (이름만 표시, 사유 비공개)
                            // userId가 이메일 형태라면 @ 앞부분만 추출
                            const displayName = userId.split('@')[0].toUpperCase();
                            badges += `<div class="leave-badge badge-others" title="Team member is off">${displayName} OFF</div>`;
                        }
                    }
                });
            });

            html += `<td class="${tdClass}" style="${tdStyle}">
                        <div class="${dayNumClass}">${d}${todayBadge}</div>
                        <div class="overflow-y-auto max-h-[60px] no-scrollbar">${badges}</div>
                     </td>`;
        }
        html += `</tr></tbody></table>`;
        if(container) container.innerHTML = html;
    });
};


    window.changeLeaveMonth = function(val) { currentViewDate.setMonth(currentViewDate.getMonth() + val); renderCalendar(); };
    window.goToToday = function() { currentViewDate = new Date(); renderCalendar(); };

// ═══════════════════════════════════════════════════════════════
// 1. loadLeaveHistory() 함수를 완전히 교체하세요
// ═══════════════════════════════════════════════════════════════

function loadLeaveHistory() {
    const now = new Date();
    const thisYear = now.getFullYear();
    const thisMonth = String(now.getMonth() + 1).padStart(2, '0');
    const LEAVE_TYPES = ['PEL', 'ANL', 'HAL', 'SIL', 'SPL'];

    let leaveListenerRef = null;

    function detachLeaveListener() {
        if (leaveListenerRef) {
            leaveListenerRef.off('value');
            leaveListenerRef = null;
        }
    }

    window._leavePageCleanup = detachLeaveListener;

    // Step 1: attendance 스캔
    db.ref('attendance').once('value', attSnap => {
        const attData = attSnap.val() || {};
        const writes = [];

        Object.entries(attData).forEach(([dateStr, dayData]) => {
            if (!dayData || typeof dayData !== 'object') return;
            const attYear = parseInt(dateStr.split('-')[0]);

            Object.entries(dayData).forEach(([name, info]) => {
                if (name !== user) return;
                if (typeof info !== 'string') return;
                const leaveType = info.trim().toUpperCase();
                if (!LEAVE_TYPES.includes(leaveType)) return;

                writes.push(
                    db.ref(`leaves/${user}/${attYear}`).once('value').then(leaveSnap => {
                        const yearLeaves = leaveSnap.val() || {};
                        const isDuplicate = Object.values(yearLeaves).some(item =>
                            item.startDate <= dateStr && item.endDate >= dateStr
                        );
                        if (isDuplicate) return;
                        return db.ref(`leaves/${user}/${attYear}`).push({
                            type: leaveType,
                            startDate: dateStr,
                            endDate: dateStr,
                            reason: '(From attendance record)',
                            status: 'Approved',
                            requestedAt: new Date(dateStr).getTime(),
                            reviewedAt: new Date(dateStr).getTime(),
                            totalWeekdays: 1,
                            source: 'attendance'
                        });
                    })
                );
            });
        });

        Promise.all(writes).then(() => {
            startLeaveListener();
            loadStaffList(); // 스태프 리스트 로드 추가
        });
    });

    // Step 2: leaves 리스너 (모든 상태 포함)
    function startLeaveListener() {
        leaveListenerRef = db.ref(`leaves/${user}`);

        leaveListenerRef.on('value', snap => {
            const tbody = document.getElementById('leaveHistoryBody');
            if (!tbody) {
                detachLeaveListener();
                return;
            }

            const allYearsData = snap.val() || {};
            let allLeaves = []; // Approved만 아니라 모든 상태 포함

            Object.entries(allYearsData).forEach(([yr, yearData]) => {
                if (!yearData || typeof yearData !== 'object') return;
                Object.entries(yearData).forEach(([id, item]) => {
                    if (item) {
                        allLeaves.push({ id, year: parseInt(yr), ...item });
                    }
                });
            });

            const monthPrefix = `${thisYear}-${thisMonth}`;
            const thisMonthItems = allLeaves.filter(i => i.startDate && i.startDate.startsWith(monthPrefix));
            const thisYearItems  = allLeaves.filter(i => i.startDate && i.startDate.startsWith(`${thisYear}`));
            const overallItems   = allLeaves;
            const sumDays = arr => arr.reduce((acc, i) => acc + (i.totalWeekdays || 0), 0);

            const renderSection = (label, color, items, totalDays) => {
                let html = `
                    <tr>
                        <td colspan="6" class="pt-6 pb-2">
                            <div class="flex items-center justify-between">
                                <span class="text-[9px] font-black uppercase tracking-widest ${color}">${label}</span>
                                <span class="text-[9px] font-black ${color} bg-slate-800 px-3 py-1 rounded-full">${totalDays} day${totalDays !== 1 ? 's' : ''} used</span>
                            </div>
                            <div class="h-px bg-slate-800 mt-2"></div>
                        </td>
                    </tr>`;

                if (items.length === 0) {
                    html += `<tr><td colspan="6" class="py-3 text-center text-[10px] text-slate-600 italic">No records</td></tr>`;
                } else {
                    items.sort((a, b) => (b.requestedAt || 0) - (a.requestedAt || 0)).forEach(item => {
                        let statusColor = 'text-emerald-500';
                        if (item.status === 'Pending') statusColor = 'text-amber-500';
                        else if (item.status === 'Rejected') statusColor = 'text-rose-500';

                        const sourceTag = item.source === 'attendance'
                            ? `<span class="text-[8px] bg-slate-700 text-slate-400 px-1.5 py-0.5 rounded ml-1">ATT</span>`
                            : '';
                        const memoHtml = item.adminMemo
                            ? `<div class="flex items-center gap-1 text-amber-500/80 italic"><span class="text-[10px]">💬</span><span class="truncate max-w-[80px] text-[10px]">${item.adminMemo}</span></div>`
                            : `-`;
                        const dateRange = item.endDate !== item.startDate
                            ? `${item.startDate} → ${item.endDate}`
                            : item.startDate;

                        html += `
                            <tr class="hover:bg-white/5 transition-colors cursor-pointer"
                                onclick="window.openLeaveModal('${item.id}', JSON.parse(decodeURIComponent('${encodeURIComponent(JSON.stringify(item))}')))">
                                <td class="py-3 font-black text-indigo-400">${item.type}${sourceTag}</td>
                                <td class="py-3 text-slate-300 font-mono text-[11px]">${dateRange}</td>
                                <td class="py-3 text-slate-500 max-w-[120px] truncate text-[11px]">${item.reason || '-'}</td>
                                <td class="py-3">${memoHtml}</td>
                                <td class="py-3 font-bold ${statusColor} text-[10px] uppercase">${item.status}</td>
                                <td class="py-3 text-right text-[10px] text-slate-600 font-bold">${item.totalWeekdays || 0}d</td>
                            </tr>`;
                    });
                }
                return html;
            };

            tbody.innerHTML =
                renderSection(`This Month (${thisYear}.${thisMonth})`, 'text-indigo-400', thisMonthItems, sumDays(thisMonthItems)) +
                renderSection(`This Year (${thisYear})`,               'text-emerald-400', thisYearItems,  sumDays(thisYearItems))  +
                renderSection('Overall',                                'text-slate-400',   overallItems,   sumDays(overallItems));
        });
    }
}

// 2. 스태프 리스트 로드 함수 추가

window.loadStaffList = function() {
    db.ref('leaves').once('value', snap => {
        const allUsers = Object.keys(snap.val() || {});
        const container = document.getElementById('staffListContainer');
        if (!container) return;

        const staffButtons = allUsers
            .filter(u => u !== user) // 자신 제외
            .sort()
            .map(staffName => {
                const displayName = staffName.includes('@') 
                    ? staffName.split('@')[0].toUpperCase() 
                    : staffName.toUpperCase();
                return `<button type="button" onclick="window.showStaffLeaveOverview('${staffName}')" class="px-3 py-2 bg-slate-800 hover:bg-indigo-600 text-slate-300 hover:text-white text-[10px] font-black uppercase tracking-widest rounded-xl transition-all active:scale-95">${displayName}</button>`;
            })
            .join('');

        container.innerHTML = staffButtons || '<p class="text-slate-500 text-xs">No team members</p>';
    });
};

// 3. 스태프 휴가 개요 팝업 함수 추가
// ═══════════════════════════════════════════════════════════════

window.showStaffLeaveOverview = function(staffName) {
    db.ref(`leaves/${staffName}`).once('value', snap => {
        const yearData = snap.val() || {};
        const modal = document.getElementById('staffLeaveModal');
        const title = document.getElementById('staffModalTitle');
        const content = document.getElementById('staffLeaveContent');
        
        if (!modal || !content) return;

        // 타이틀 설정
        title.innerText = `${staffName.toUpperCase()} - Leave Records`;

        // 모든 휴가 데이터를 평탄화하여 정렬
        let allLeaves = [];
        Object.keys(yearData).forEach(year => {
            const yearLeaves = yearData[year] || {};
            Object.entries(yearLeaves).forEach(([id, item]) => {
                if (item) {
                    allLeaves.push({
                        id,
                        year: parseInt(year),
                        ...item
                    });
                }
            });
        });

        // 날짜 역순 정렬 (최신순)
        allLeaves.sort((a, b) => {
            const dateA = new Date(a.startDate);
            const dateB = new Date(b.startDate);
            return dateB - dateA;
        });

        // 연도별로 그룹화
        const groupedByYear = {};
        allLeaves.forEach(leave => {
            if (!groupedByYear[leave.year]) {
                groupedByYear[leave.year] = [];
            }
            groupedByYear[leave.year].push(leave);
        });

        // HTML 생성
        let html = '';
        
        if (allLeaves.length === 0) {
            html = '<div class="text-center py-8"><p class="text-slate-400 text-sm">No leave records found</p></div>';
        } else {
            Object.keys(groupedByYear)
                .sort()
                .reverse()
                .forEach(year => {
                    const leaves = groupedByYear[year];
                    
                    html += `
                        <div class="border-l-4 border-indigo-500 pl-4 py-2">
                            <h4 class="text-sm font-black text-indigo-400 uppercase mb-3">━━ ${year} ━━</h4>
                            <div class="space-y-2">
                    `;

                    leaves.forEach(item => {
                        // 상태별 색상
                        let statusColor = 'text-emerald-400';
                        let statusBg = 'bg-emerald-500/10';
                        if (item.status === 'Pending') {
                            statusColor = 'text-amber-400';
                            statusBg = 'bg-amber-500/10';
                        } else if (item.status === 'Rejected') {
                            statusColor = 'text-rose-400';
                            statusBg = 'bg-rose-500/10';
                        }

                        // 날짜 포맷
                        const dateDisplay = item.startDate === item.endDate 
                            ? item.startDate 
                            : `${item.startDate} ~ ${item.endDate}`;

                        html += `
                            <div class="bg-slate-800/50 border border-slate-700 rounded-lg p-4 hover:bg-slate-800 transition-colors">
                                <div class="flex items-center justify-between mb-2">
                                    <div class="flex items-center gap-3">
                                        <span class="text-indigo-300 font-black text-sm">${item.type}</span>
                                        <span class="text-slate-500 text-xs font-bold">${dateDisplay}</span>
                                    </div>
                                    <span class="font-black text-xs px-3 py-1 rounded-full ${statusColor} ${statusBg} uppercase">${item.status}</span>
                                </div>
                                <div class="text-slate-400 text-xs">${item.reason || 'No reason provided'}</div>
                                ${item.totalWeekdays ? `<div class="text-slate-500 text-xs mt-2">Days: <span class="text-slate-300 font-bold">${item.totalWeekdays}d</span></div>` : ''}
                            </div>
                        `;
                    });

                    html += `
                            </div>
                        </div>
                    `;
                });
        }

        content.innerHTML = html;
        modal.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
    });
};

window.closeStaffLeaveModal = function() {
    const modal = document.getElementById('staffLeaveModal');
    if (modal) modal.classList.add('hidden');
    document.body.style.overflow = '';
};

// 5. submitLeaveRequest() 함수 수정 (Rejected도 수정 가능하도록)
// ═══════════════════════════════════════════════════════════════

window.submitLeaveRequest = function() {
    // Approved만 수정 불가 (Rejected/Pending은 수정 가능)
    if (editingData && editingData.status === 'Approved') {
        return alert("Approved requests cannot be modified.");
    }

    const type = document.getElementById('leaveType').value;
    const range = datePicker.selectedDates;
    
    const escapeHTML = (str) => {
        return str.replace(/[&<>"']/g, (m) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[m]);
    };
    const reasonRaw = document.getElementById('leaveReason').value.trim();
    const reason = escapeHTML(reasonRaw);

    const wordCount = reasonRaw.match(/\b\w+\b/g)?.length || 0;
    if (wordCount < 5) {
        alert("Please describe your reason in more detail (at least 5 words).");
        document.getElementById('leaveReason').focus();
        return;
    }

    if (range.length === 0) return alert("Please select dates.");
    
    const start = new Date(range[0]);
    const end = range.length > 1 ? new Date(range[1]) : new Date(range[0]);
    
    let validDates = [], tempDate = new Date(start);
    while (tempDate <= end) {
        if (tempDate.getDay() !== 0 && tempDate.getDay() !== 6) validDates.push(new Date(tempDate));
        tempDate.setDate(tempDate.getDate() + 1);
    }
    
    if (validDates.length === 0) return alert("Weekends are excluded. Please select weekdays.");
    
    const startDate = validDates[0].toLocaleDateString('en-CA');
    const endDate = validDates[validDates.length - 1].toLocaleDateString('en-CA');
    const year = new Date(startDate).getFullYear();
    
    const leaveData = {
        type, startDate, endDate, reason,
        status: editingData && editingData.status === 'Rejected' ? "Pending" : "Pending",
        requestedAt: editingData?.requestedAt || firebase.database.ServerValue.TIMESTAMP,
        totalWeekdays: validDates.length
    };

    const ref = editingId ? db.ref(`leaves/${user}/${year}/${editingId}`) : db.ref(`leaves/${user}/${year}`).push();
    ref.set(leaveData).then(() => {
        alert("Request submitted successfully.");
        closeLeaveModal();
    });
};

// ═══════════════════════════════════════════════════════════════
// 6. openLeaveModal() 함수 수정 (Rejected/Pending 수정 가능)
// ═══════════════════════════════════════════════════════════════

window.openLeaveModal = function(id = null, data = null) {
    editingId = id; 
    editingData = data;
    const modal = document.getElementById('leaveModal');
    if (!modal) return;

    modal.classList.remove('hidden');
    document.body.style.overflow = 'hidden';

    const deleteBtn = document.getElementById('deleteLeaveBtn');
    const saveBtn = document.getElementById('saveLeaveBtn');
    const memoContainer = document.getElementById('adminMemoContainer');
    const memoText = document.getElementById('adminMemoText');
    const leaveTypeInput = document.getElementById('leaveType');
    const leaveReasonInput = document.getElementById('leaveReason');
    const dateInput = document.getElementById('leaveDateRange');
    const modalTitle = document.getElementById('modalTitle');

    if (id && data) {
        if (data.status === 'Approved') {
            if (modalTitle) modalTitle.innerText = "View Approved Leave";
            if (leaveTypeInput) leaveTypeInput.disabled = true;
            if (leaveReasonInput) leaveReasonInput.disabled = true;
            if (dateInput) dateInput.disabled = true;
            if (deleteBtn) deleteBtn.classList.add('hidden');
            if (saveBtn) saveBtn.classList.add('hidden');
        } else {
            if (modalTitle) modalTitle.innerText = `Edit Leave Request (${data.status})`;
            if (leaveTypeInput) leaveTypeInput.disabled = false;
            if (leaveReasonInput) leaveReasonInput.disabled = false;
            if (dateInput) dateInput.disabled = false;
            if (deleteBtn) deleteBtn.classList.remove('hidden');
            if (saveBtn) saveBtn.classList.remove('hidden');
        }

        if (leaveTypeInput) leaveTypeInput.value = data.type;
        if (datePicker) datePicker.setDate([data.startDate, data.endDate]);
        if (leaveReasonInput) leaveReasonInput.value = data.reason || "";
        
        if (data.adminMemo) {
            if (memoContainer) memoContainer.classList.remove('hidden');
            if (memoText) memoText.innerText = data.adminMemo;
        } else {
            if (memoContainer) memoContainer.classList.add('hidden');
        }
    } else {
        if (modalTitle) modalTitle.innerText = "New Leave Request";
        if (leaveTypeInput) {
            leaveTypeInput.selectedIndex = 0;
            leaveTypeInput.disabled = false;
        }
        if (datePicker) datePicker.clear();
        if (leaveReasonInput) {
            leaveReasonInput.value = "";
            leaveReasonInput.disabled = false;
        }
        if (dateInput) dateInput.disabled = false;
        if (deleteBtn) deleteBtn.classList.add('hidden');
        if (saveBtn) saveBtn.classList.remove('hidden');
        if (memoContainer) memoContainer.classList.add('hidden');
    }
};


    window.closeLeaveModal = function() { 
        const modal = document.getElementById('leaveModal');
        if(modal) modal.classList.add('hidden'); 
        document.body.style.overflow = '';
    };


    window.deleteLeave = function() {
        if (!editingId || !editingData || editingData.status === 'Approved') return;
        if (!confirm("Cancel this request?")) return;
        const year = new Date(editingData.startDate).getFullYear();
        db.ref(`leaves/${user}/${year}/${editingId}`).remove().then(() => {
            alert("Deleted.");
            closeLeaveModal();
        });
    };

    initLeavePage();
})();
</script>
