      '--v-text':'#e8f0fe','--v-muted':'#4a6090','--v-dim':'#1e3060',
      '--v-accent':'#60a5fa','--v-accent2':'#a5c8ff',

  const idx = new Date().getDay();
  const t = THEMES[idx] || THEMES[1];

  for (const [k, v] of Object.entries(t)) root.style.setProperty(k, v);

<style>
/* ══════════════════════════════════════════════════════════
   STAFF VACATION — 7-DAY ADAPTIVE DARK THEME
   All colours from --v-* tokens. No white backgrounds.
══════════════════════════════════════════════════════════ */

/* ── compat aliases ── */
:root {
  --bg:       var(--v-bg);
  --surface:  var(--v-surface);
  --surface2: var(--v-surface2);
  --surface3: var(--v-surface3);
  --border:   var(--v-border);
  --border2:  var(--v-border2);
  --text:     var(--v-text);
  --muted:    var(--v-muted);
  --dim:      var(--v-dim);
  --indigo:   var(--v-accent);
  --green:    #10b981;
  --red:      #f43f5e;
  --blue:     #3b82f6;
  --amber:    #f59e0b;
  --violet:   #a855f7;
}

*, *::before, *::after {
  box-sizing: border-box;
  font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui,
               Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo",
               "Noto Sans KR", "Malgun Gothic", sans-serif;
}

/* ══════════════════════════════════════════════════════════
   3-D CARD BASE
══════════════════════════════════════════════════════════ */
.card-3d {
  position: relative;
  background: linear-gradient(145deg, var(--v-surface2) 0%, var(--v-surface) 100%);
  border: 1px solid var(--v-border);
  border-top: 1px solid var(--v-border2);
  border-radius: var(--v-card-radius);
  box-shadow:
    inset 0 1px 0 var(--v-card-shine),
    inset 0 -1px 0 rgba(0,0,0,0.25),
    0 4px 14px rgba(0,0,0,0.32),
    0 12px 32px rgba(0,0,0,0.45);
  will-change: transform;
  transition: transform 0.3s cubic-bezier(0.23,1,0.32,1),
              box-shadow 0.3s ease,
              border-color 0.3s ease;
}
.card-3d::before {
  content: '';
  position: absolute; top: 0; left: 15%; right: 15%; height: 1px;
  background: var(--v-card-bevel);
  pointer-events: none;
}
.card-3d::after {
  content: '';
  position: absolute; inset: 0;
  background: var(--v-card-face);
  pointer-events: none;
  border-radius: inherit;
}
@media (hover:hover) {
  .card-3d:hover {
    transform: translateY(-4px) perspective(900px) rotateX(2deg);
    border-color: var(--v-accent);
    box-shadow:
      inset 0 1px 0 var(--v-card-shine),
      0 6px 16px rgba(0,0,0,0.38),
      0 20px 45px rgba(0,0,0,0.5),
      0 0 0 1px var(--v-accent-glow),
      0 0 28px var(--v-accent-glow);
  }
}

/* ══════════════════════════════════════════════════════════
   PAGE LAYOUT
══════════════════════════════════════════════════════════ */
.sv-root {
  display: flex;
  flex-direction: column;
  gap: clamp(0.75rem, 2.5vw, 1.25rem);
  padding-bottom: clamp(1.5rem, 6vw, 5rem);
  color: var(--v-text);
}

/* ── Header card ── */
.sv-header-card {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  padding: clamp(14px, 4vw, 22px);
}
.sv-header-title {
  font-size: clamp(18px, 5.5vw, 26px);
  font-weight: 900;
  color: var(--v-text);
  display: flex;
  align-items: center;
  gap: 10px;
  letter-spacing: -0.02em;
  font-style: italic;
  text-transform: uppercase;
}
.sv-header-accent { width: 5px; height: clamp(22px,5vw,28px); background: var(--v-accent); border-radius: 3px; flex-shrink: 0; box-shadow: 0 0 10px var(--v-accent-glow); }
.sv-header-sub { font-size: clamp(8px,2vw,10px); color: var(--v-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; margin-top: 4px; }

/* ── NEW REQUEST button ── */
.sv-new-btn {
  background: var(--v-btn-bg) !important;
  color: #fff !important;
  padding: clamp(10px,3vw,14px) clamp(16px,5vw,24px);
  border-radius: calc(var(--v-card-radius) * 1.1);
  font-weight: 900;
  font-size: clamp(9px,2.2vw,12px);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  border: none;
  cursor: pointer;
  white-space: nowrap;
  box-shadow: 0 4px 16px var(--v-accent-glow), inset 0 1px 0 rgba(255,255,255,0.2);
  transition: all 0.2s cubic-bezier(0.23,1,0.32,1);
  flex-shrink: 0;
}
@media (hover:hover) {
  .sv-new-btn:hover {
    background: var(--v-btn-hover) !important;
    box-shadow: 0 8px 24px var(--v-accent-glow), inset 0 1px 0 rgba(255,255,255,0.25) !important;
    transform: translateY(-2px);
  }
}
.sv-new-btn:active { transform: scale(0.96) translateY(1px) !important; }

/* ══════════════════════════════════════════════════════════
   CALENDAR CARD
══════════════════════════════════════════════════════════ */
.sv-cal-card {
  padding: clamp(12px,3.5vw,20px);
}
.sv-cal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: clamp(12px,3vw,20px);
  gap: 10px;
  flex-wrap: wrap;
}
#calendarMonthTitle {
  font-size: clamp(13px,4vw,18px);
  font-weight: 900;
  font-style: italic;
  text-transform: uppercase;
  letter-spacing: -0.02em;
  color: var(--v-text);
  text-shadow: 0 0 20px var(--v-accent-glow);
}
.sv-nav-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  background: linear-gradient(145deg,var(--v-surface3),var(--v-surface2));
  border: 1px solid var(--v-border);
  border-radius: calc(var(--v-card-radius)*0.75);
  padding: 4px;
  box-shadow: inset 0 1px 0 var(--v-card-shine), 0 2px 8px rgba(0,0,0,0.3);
}
.sv-nav-btn {
  display: flex; align-items: center; justify-content: center;
  padding: clamp(5px,1.5vw,8px) clamp(8px,2.5vw,12px);
  font-size: clamp(7px,2vw,10px);
  font-weight: 900;
  color: var(--v-muted);
  background: none; border: none; cursor: pointer;
  border-radius: calc(var(--v-card-radius)*0.55);
  transition: all 0.15s;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
@media (hover:hover) {
  .sv-nav-btn:hover { background:color-mix(in srgb,var(--v-accent) 14%,transparent); color:var(--v-text); }
}
.sv-nav-btn.today-btn { color: var(--v-accent); text-shadow: 0 0 8px var(--v-accent-glow); }

/* ══════════════════════════════════════════════════════════
   LEAVE CALENDAR TABLE
══════════════════════════════════════════════════════════ */
.leave-calendar-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 2px;
  table-layout: fixed;
}
.leave-calendar-table th {
  padding: clamp(5px,1.5vw,10px) 0;
  font-size: clamp(7px,1.8vw,9px);
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--v-muted);
  border-bottom: 1px solid var(--v-border);
}
.leave-calendar-table th.th-sun { color: rgba(244,63,94,0.85); text-shadow:0 0 8px rgba(244,63,94,0.3); }
.leave-calendar-table th.th-sat { color: color-mix(in srgb,var(--v-accent) 80%,white); text-shadow:0 0 6px var(--v-accent-glow); }

/* Col widths */
.leave-calendar-table col.weekend { width: 6%; }
.leave-calendar-table col.weekday { width: calc((100% - 12%) / 5); }

.leave-calendar-table td {
  height: clamp(52px,12vw,90px);
  background: linear-gradient(145deg, var(--v-surface3) 0%, var(--v-surface2) 100%);
  border: 1px solid rgba(10,16,30,0.85);
  border-radius: 8px;
  vertical-align: top;
  padding: clamp(3px,1vw,5px);
  position: relative;
  will-change: transform;
  transition: all 0.18s cubic-bezier(0.23,1,0.32,1);
  box-shadow: 0 1px 4px rgba(0,0,0,0.25), inset 0 1px 0 var(--v-card-shine);
  cursor: pointer;
}
.leave-calendar-table td.td-sun { background: linear-gradient(145deg,rgba(244,63,94,0.07),var(--v-surface2)); }
.leave-calendar-table td.td-sat { background: linear-gradient(145deg,color-mix(in srgb,var(--v-accent) 7%,transparent),var(--v-surface2)); }
.leave-calendar-table td.today-cell {
  background: var(--v-today-bg) !important;
  border: 1px solid color-mix(in srgb,var(--v-accent) 48%,transparent) !important;
  box-shadow: 0 0 0 1px var(--v-accent-glow), 0 4px 14px var(--v-accent-glow) !important;
}
@media (hover:hover) {
  .leave-calendar-table td:hover {
    background: linear-gradient(145deg,var(--v-cell-hover),var(--v-surface2)) !important;
    border-color: var(--v-cell-border) !important;
    transform: translateY(-2px) scale(1.015);
    box-shadow: 0 6px 16px var(--v-accent-glow), inset 0 1px 0 var(--v-card-shine);
    z-index: 2;
  }
}

/* ── Date number ── */
.leave-day-num {
  font-size: clamp(8px,2.2vw,11px);
  font-weight: 900;
  color: var(--v-muted);
  margin-bottom: 2px;
  font-family: 'SF Mono','Fira Code',monospace;
  letter-spacing: -0.02em;
}
.leave-day-num.sun-color  { color: rgba(244,63,94,0.75); }
.leave-day-num.sat-color  { color: color-mix(in srgb,var(--v-accent) 75%,white); }
.leave-day-num.today-color { color: var(--v-accent); text-shadow: 0 0 10px var(--v-accent-glow); }

/* Today mark badge */
.today-mark {
  background: var(--v-today-badge);
  color: #fff;
  padding: 1px 5px;
  border-radius: 5px;
  font-size: clamp(6px,1.5vw,8px);
  font-weight: 900;
  margin-left: 3px;
  vertical-align: middle;
  display: inline-block;
  box-shadow: 0 0 8px var(--v-accent-glow);
  font-family: 'SF Mono',monospace;
  letter-spacing: 0.05em;
}

/* ── Leave badges ── */
.leave-badge {
  font-size: clamp(6px,1.6vw,8px);
  padding: 2px 5px;
  border-radius: 5px;
  margin-top: 2px;
  font-weight: 900;
  color: #fff;
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  font-family: 'SF Mono',monospace;
  letter-spacing: 0.03em;
}
.badge-pending  { background:linear-gradient(135deg,rgba(245,158,11,0.9),rgba(180,115,9,0.9)); border-left:2px solid #f59e0b; box-shadow:0 0 8px rgba(245,158,11,0.2); }
.badge-approved { background:linear-gradient(135deg,rgba(16,185,129,0.9),rgba(4,120,87,0.9));  border-left:2px solid #10b981; box-shadow:0 0 8px rgba(16,185,129,0.2); }
.badge-others   { background:linear-gradient(135deg,color-mix(in srgb,var(--v-accent) 80%,transparent),color-mix(in srgb,var(--v-accent) 55%,#000)); border-left:2px solid var(--v-accent); opacity:0.85; }

/* ══════════════════════════════════════════════════════════
   HISTORY CARD
══════════════════════════════════════════════════════════ */
.sv-history-card { padding: clamp(14px,4vw,22px); }
.sv-section-title {
  font-size: clamp(9px,2.3vw,12px);
  font-weight: 900;
  color: var(--v-text);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  margin-bottom: clamp(12px,3vw,20px);
  display: flex;
  align-items: center;

<!-- ══════════════════════════════════════════════════════════
     JAVASCRIPT — all original logic preserved
══════════════════════════════════════════════════════════ -->
<script>
(function () {
  const db = firebase.database();
  const user = sessionStorage.getItem('loggedInUser');
  let datePicker, editingId = null, editingData = null, currentViewDate = new Date();
  let _leaveListener = null; /* cleanup ref */

  /* ── Flatpickr ── */
  function initFlatpickr() {
    datePicker = flatpickr("#leaveDateRange", {
      mode:"range", dateFormat:"Y-m-d", theme:"dark", minDate:"today",
      locale:{rangeSeparator:' ~ '}, static:true, disableMobile:true
    });
  }

  /* ── Init ── */
  window.initLeavePage = function () {
    if (!user || user === "null") { alert("Login required."); return; }
    initFlatpickr();
    loadLeaveHistory();
    renderCalendar();
  };

  /* ── Calendar render ── */
  window.renderCalendar = function () {
    const container = document.getElementById('leaveCalendarContainer');
    const title = document.getElementById('calendarMonthTitle');
    if (!container || !title) return;

    const year = currentViewDate.getFullYear(), month = currentViewDate.getMonth();
    title.innerText = currentViewDate.toLocaleString('en-US', {month:'long',year:'numeric'});

    const firstDay = new Date(year,month,1).getDay();
    const lastDate  = new Date(year,month+1,0).getDate();
    const today     = new Date();
    const todayStr  = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

    db.ref('leaves').once('value', snap => {
      const allLeavesData = snap.val() || {};

      let html = `<table class="leave-calendar-table">
        <colgroup>
          <col class="weekend"><col class="weekday"><col class="weekday"><col class="weekday"><col class="weekday"><col class="weekday"><col class="weekend">
        </colgroup>
        <thead><tr>`;
      ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach((day,idx) => {
        const cls = idx===0?'th-sun':idx===6?'th-sat':'';
        html += `<th class="${cls}">${day}</th>`;
      });
      html += `</tr></thead><tbody><tr>`;
      for (let i=0;i<firstDay;i++) html += `<td></td>`;

      for (let d=1;d<=lastDate;d++) {
        const dow = (firstDay+d-1)%7;
        if (dow===0&&d>1) html += `</tr><tr>`;
        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const isToday = dateStr===todayStr;

        let tdClass = isToday?'today-cell':'';
        if (dow===0) tdClass += ' td-sun'; else if (dow===6) tdClass += ' td-sat';

        let numClass = 'leave-day-num';
        if (isToday) numClass += ' today-color';
        else if (dow===0) numClass += ' sun-color';
        else if (dow===6) numClass += ' sat-color';

        const todayBadge = isToday ? `<span class="today-mark">TODAY</span>` : '';

        let badges = '';
        Object.entries(allLeavesData).forEach(([uid, yearsData]) => {
          const userYearLeaves = yearsData[year] || {};
          Object.entries(userYearLeaves).forEach(([, item]) => {
            if (dateStr>=item.startDate && dateStr<=item.endDate && item.status==='Approved') {
              if (uid===user) {
                badges += `<div class="leave-badge badge-approved">${item.type}</div>`;
              } else {
                const dn = uid.includes('@')?uid.split('@')[0].toUpperCase():uid.toUpperCase();
                badges += `<div class="leave-badge badge-others">${dn} OFF</div>`;
              }
            }
          });
        });

        html += `<td class="${tdClass}">
          <div class="${numClass}">${d}${todayBadge}</div>
          <div class="overflow-y-auto no-scrollbar" style="max-height:clamp(35px,8vw,55px);">${badges}</div>
        </td>`;
      }
      html += `</tr></tbody></table>`;
      container.innerHTML = html;
    });
  };

  window.changeLeaveMonth = (val) => { currentViewDate.setMonth(currentViewDate.getMonth()+val); renderCalendar(); };
  window.goToToday = () => { currentViewDate=new Date(); renderCalendar(); };

  /* ── Leave history ── */
  function loadLeaveHistory() {
    const now = new Date(), thisYear=now.getFullYear(), thisMonth=String(now.getMonth()+1).padStart(2,'0');
    const LEAVE_TYPES=['PEL','ANL','HAL','SIL','SPL'];

    function detach() { if (_leaveListener) { _leaveListener.off('value'); _leaveListener=null; } }
    window._leavePageCleanup = detach;

    /* scan attendance → auto-create leaves */
    db.ref('attendance').once('value', attSnap => {
      const attData = attSnap.val()||{};
      const writes = [];
      Object.entries(attData).forEach(([dateStr,dayData]) => {
        if (!dayData||typeof dayData!=='object') return;
        const attYear=parseInt(dateStr.split('-')[0]);
        Object.entries(dayData).forEach(([name,info]) => {
          if (name!==user||typeof info!=='string') return;
          const lt=info.trim().toUpperCase(); if (!LEAVE_TYPES.includes(lt)) return;
          writes.push(
            db.ref(`leaves/${user}/${attYear}`).once('value').then(ls => {
              const yl=ls.val()||{};
              const dup=Object.values(yl).some(i=>i.startDate<=dateStr&&i.endDate>=dateStr);
              if (dup) return;
              return db.ref(`leaves/${user}/${attYear}`).push({
                type:lt, startDate:dateStr, endDate:dateStr,
                reason:'(From attendance record)', status:'Approved',
                requestedAt:new Date(dateStr).getTime(), reviewedAt:new Date(dateStr).getTime(),
                totalWeekdays:1, source:'attendance'
              });
            })
          );
        });
      });
      Promise.all(writes).then(() => { startListener(); loadStaffList(); });
    });

    function startListener() {
      _leaveListener = db.ref(`leaves/${user}`);
      _leaveListener.on('value', snap => {
        const tbody=document.getElementById('leaveHistoryBody');
        if (!tbody) { detach(); return; }
        const allYears=snap.val()||{};
        let all=[];
        Object.entries(allYears).forEach(([yr,yd])=>{
          if (!yd||typeof yd!=='object') return;
          Object.entries(yd).forEach(([id,item])=>{ if(item) all.push({id,year:parseInt(yr),...item}); });
        });
        const mp=`${thisYear}-${thisMonth}`;
        const thisM=all.filter(i=>i.startDate?.startsWith(mp));
        const thisY=all.filter(i=>i.startDate?.startsWith(`${thisYear}`));
        const overall=all;
        const sumD=arr=>arr.reduce((a,i)=>a+(i.totalWeekdays||0),0);

        const mkSection=(label,color,items,total)=>{
          let h=`<tr class="sv-group-row"><td colspan="6">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <span class="sv-group-label" style="color:${color};">${label}</span>
              <span style="font-size:clamp(7px,2vw,9px);font-weight:900;color:${color};background:rgba(0,0,0,0.2);padding:3px 10px;border-radius:999px;">${total} day${total!==1?'s':''} used</span>
            </div>
            <div style="height:1px;background:var(--v-border);margin-top:6px;"></div>
          </td></tr>`;
          if (!items.length) {
            h+=`<tr><td colspan="6" style="padding:12px;text-align:center;font-size:10px;color:var(--v-muted);font-style:italic;">No records</td></tr>`;
          } else {
            items.sort((a,b)=>(b.requestedAt||0)-(a.requestedAt||0)).forEach(item=>{
              const sc=item.status==='Pending'?'#f59e0b':item.status==='Rejected'?'#f43f5e':'#10b981';
              const src=item.source==='attendance'?`<span style="font-size:8px;background:rgba(0,0,0,0.25);color:var(--v-muted);padding:1px 5px;border-radius:4px;margin-left:4px;">ATT</span>`:'';
              const memo=item.adminMemo?`<span style="color:rgba(245,158,11,0.8);font-size:10px;font-style:italic;">💬 ${item.adminMemo.substring(0,30)}…</span>`:`<span style="color:var(--v-muted);">-</span>`;
              const dr=item.endDate!==item.startDate?`${item.startDate} → ${item.endDate}`:item.startDate;
              const evJson=encodeURIComponent(JSON.stringify(item));
              h+=`<tr onclick="window.openLeaveModal('${item.id}',JSON.parse(decodeURIComponent('${evJson}')))">
                <td><span style="color:var(--v-accent);font-weight:900;">${item.type}</span>${src}</td>
                <td>${dr}</td>
                <td style="max-width:clamp(60px,15vw,120px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${item.reason||'-'}</td>
                <td>${memo}</td>
                <td><span style="color:${sc};font-weight:900;font-size:clamp(8px,2vw,10px);text-transform:uppercase;">${item.status}</span></td>
                <td style="text-align:right;color:var(--v-muted);font-weight:700;">${item.totalWeekdays||0}d</td>
              </tr>`;
            });
          }
          return h;
        };

        tbody.innerHTML =
          mkSection(`This Month (${thisYear}.${thisMonth})`,'var(--v-accent)',thisM,sumD(thisM)) +
          mkSection(`This Year (${thisYear})`,'#10b981',thisY,sumD(thisY)) +
          mkSection('Overall','var(--v-muted)',overall,sumD(overall));
      });
    }
  }

  /* ── Staff list ── */
  window.loadStaffList = function () {
    db.ref('leaves').once('value', snap => {
      const users=Object.keys(snap.val()||{}).filter(u=>u!==user).sort();
      const c=document.getElementById('staffListContainer'); if (!c) return;
      c.innerHTML=users.length
        ? users.map(su=>`<button class="sv-staff-btn" onclick="window.showStaffLeaveOverview('${su}')">${su.includes('@')?su.split('@')[0].toUpperCase():su.toUpperCase()}</button>`).join('')
        : `<p style="font-size:12px;color:var(--v-muted);">No team members</p>`;
    });
  };

  /* ── Staff overview modal ── */
  window.showStaffLeaveOverview = function (staffName) {
    db.ref(`leaves/${staffName}`).once('value', snap => {
      const yearData=snap.val()||{};
      const modal=document.getElementById('staffLeaveModal');
      const title=document.getElementById('staffModalTitle');
      const content=document.getElementById('staffLeaveContent');
      if (!modal||!content) return;
      title.innerText=`${staffName.toUpperCase()} — Leave Records`;

      let all=[];
      Object.keys(yearData).forEach(yr=>{
        Object.entries(yearData[yr]||{}).forEach(([id,item])=>{ if(item) all.push({id,year:parseInt(yr),...item}); });
      });
      all.sort((a,b)=>new Date(b.startDate)-new Date(a.startDate));

      if (!all.length) {
        content.innerHTML=`<p style="text-align:center;padding:24px;color:var(--v-muted);font-size:13px;">No leave records found</p>`;
      } else {
        const byYear={};
        all.forEach(l=>{ if (!byYear[l.year]) byYear[l.year]=[]; byYear[l.year].push(l); });
        content.innerHTML=Object.keys(byYear).sort().reverse().map(yr=>{
          const leaves=byYear[yr];
          return `<div style="border-left:3px solid var(--v-accent);padding-left:14px;">
            <div style="font-size:10px;font-weight:900;color:var(--v-accent);text-transform:uppercase;margin-bottom:10px;letter-spacing:0.1em;">━ ${yr} ━</div>
            <div style="display:flex;flex-direction:column;gap:8px;">
              ${leaves.map(item=>{
                const sc=item.status==='Pending'?'rgba(245,158,11,0.9)':item.status==='Rejected'?'rgba(244,63,94,0.9)':'rgba(16,185,129,0.9)';
                const sbg=item.status==='Pending'?'rgba(245,158,11,0.1)':item.status==='Rejected'?'rgba(244,63,94,0.1)':'rgba(16,185,129,0.1)';
                const dr=item.startDate===item.endDate?item.startDate:`${item.startDate} ~ ${item.endDate}`;
                return `<div style="background:rgba(0,0,0,0.2);border:1px solid var(--v-border);border-radius:calc(var(--v-card-radius)*0.65);padding:12px;">
                  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px;flex-wrap:wrap;">
                    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                      <span style="color:var(--v-accent2);font-weight:900;font-size:13px;">${item.type}</span>
                      <span style="color:var(--v-muted);font-size:11px;font-family:'SF Mono',monospace;">${dr}</span>
                    </div>
                    <span style="font-weight:900;font-size:10px;padding:2px 10px;border-radius:999px;color:${sc};background:${sbg};text-transform:uppercase;">${item.status}</span>
                  </div>
                  <div style="color:var(--v-muted);font-size:11px;">${item.reason||'No reason provided'}</div>
                  ${item.totalWeekdays?`<div style="color:var(--v-muted);font-size:10px;margin-top:4px;">Days: <span style="color:var(--v-text);font-weight:700;">${item.totalWeekdays}d</span></div>`:''}
                </div>`;
              }).join('')}
            </div>
          </div>`;
        }).join('');
      }
      modal.classList.remove('hidden');
      document.body.style.overflow='hidden';
    });
  };

  window.closeStaffLeaveModal = function () {
    const m=document.getElementById('staffLeaveModal'); if(m) m.classList.add('hidden');
    document.body.style.overflow='';
  };

  /* ── Modal open/close ── */
  window.openLeaveModal = function (id=null, data=null) {
    editingId=id; editingData=data;
    const modal=document.getElementById('leaveModal'); if (!modal) return;
    modal.classList.remove('hidden');
    document.body.style.overflow='hidden';

    const delBtn=document.getElementById('deleteLeaveBtn');
    const saveBtn=document.getElementById('saveLeaveBtn');
    const memoCont=document.getElementById('adminMemoContainer');
    const memoText=document.getElementById('adminMemoText');
    const ltInput=document.getElementById('leaveType');
    const rsInput=document.getElementById('leaveReason');
    const dtInput=document.getElementById('leaveDateRange');
    const ttl=document.getElementById('modalTitle');

    if (id&&data) {
      if (data.status==='Approved') {
        if (ttl) ttl.innerText='View Approved Leave';
        [ltInput,rsInput,dtInput].forEach(el=>{ if(el) el.disabled=true; });
        if (delBtn) delBtn.classList.add('hidden');
        if (saveBtn) saveBtn.classList.add('hidden');
      } else {
        if (ttl) ttl.innerText=`Edit Leave Request (${data.status})`;
        [ltInput,rsInput,dtInput].forEach(el=>{ if(el) el.disabled=false; });
        if (delBtn) delBtn.classList.remove('hidden');
        if (saveBtn) saveBtn.classList.remove('hidden');
      }
      if (ltInput) ltInput.value=data.type;
      if (datePicker) datePicker.setDate([data.startDate,data.endDate]);
      if (rsInput) rsInput.value=data.reason||'';
      if (data.adminMemo) {
        if (memoCont) memoCont.classList.remove('hidden');
        if (memoText) memoText.innerText=data.adminMemo;
      } else { if (memoCont) memoCont.classList.add('hidden'); }
    } else {
      if (ttl) ttl.innerText='New Leave Request';
      if (ltInput) { ltInput.selectedIndex=0; ltInput.disabled=false; }
      if (datePicker) datePicker.clear();
      if (rsInput) { rsInput.value=''; rsInput.disabled=false; }
      if (dtInput) dtInput.disabled=false;
      if (delBtn) delBtn.classList.add('hidden');
      if (saveBtn) saveBtn.classList.remove('hidden');
      if (memoCont) memoCont.classList.add('hidden');
    }
  };

  window.closeLeaveModal = function () {
    const m=document.getElementById('leaveModal'); if(m) m.classList.add('hidden');
    document.body.style.overflow='';
  };

  /* ── Submit ── */
  window.submitLeaveRequest = function () {
    if (editingData&&editingData.status==='Approved') return alert("Approved requests cannot be modified.");
    const type=document.getElementById('leaveType').value;
    const range=datePicker.selectedDates;
    const escape=s=>s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"})[m]);
    const raw=document.getElementById('leaveReason').value.trim();
    const reason=escape(raw);
    if ((raw.match(/\b\w+\b/g)?.length||0)<5) { alert("Please describe your reason in more detail (at least 5 words)."); document.getElementById('leaveReason').focus(); return; }
    if (!range.length) return alert("Please select dates.");
    const start=new Date(range[0]), end=range.length>1?new Date(range[1]):new Date(range[0]);
    let valid=[],tmp=new Date(start);
    while(tmp<=end){ if(tmp.getDay()!==0&&tmp.getDay()!==6) valid.push(new Date(tmp)); tmp.setDate(tmp.getDate()+1); }
    if (!valid.length) return alert("Weekends are excluded. Please select weekdays.");
    const startDate=valid[0].toLocaleDateString('en-CA'), endDate=valid[valid.length-1].toLocaleDateString('en-CA');
    const year=new Date(startDate).getFullYear();
    const leaveData={type,startDate,endDate,reason,status:"Pending",requestedAt:editingData?.requestedAt||firebase.database.ServerValue.TIMESTAMP,totalWeekdays:valid.length};
    const ref=editingId?db.ref(`leaves/${user}/${year}/${editingId}`):db.ref(`leaves/${user}/${year}`).push();
    ref.set(leaveData).then(()=>{ alert("Request submitted successfully."); closeLeaveModal(); });
  };

  /* ── Delete ── */
  window.deleteLeave = function () {
    if (!editingId||!editingData||editingData.status==='Approved') return;
    if (!confirm("Cancel this request?")) return;
    const year=new Date(editingData.startDate).getFullYear();
    db.ref(`leaves/${user}/${year}/${editingId}`).remove().then(()=>{ alert("Deleted."); closeLeaveModal(); });
  };

  /* ── Start ── */
  initLeavePage();
})();
</script>
