<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
    .stat-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 1.5rem; padding: 2rem; margin-bottom: 2rem; }
    .chart-container { position: relative; height: 300px; width: 100%; }
    .nav-btn:hover { background-color: #1e293b; color: #3b82f6; }
    .stat-tab-btn { transition: all 0.3s; position: relative; }
    .stat-tab-btn.active { color: #facc15; }
    .stat-tab-btn.active::after { content: ''; position: absolute; bottom: -4px; left: 0; width: 100%; height: 2px; background: #facc15; border-radius: 2px; }

    /* 모달이 메뉴 바(Sidebar) 등 모든 요소를 덮도록 z-index를 최대로 설정 */
    #statDetailModal {
        z-index: 9999 !important;
        position: fixed !important;
        inset: 0 !important;
    }

    /* 스크롤바 커스텀 (모달 내부) */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
</style>

<div class="animate-fadeIn space-y-8 pb-10">
    <div class="flex gap-6 border-b border-slate-800 px-2">
        <button onclick="switchStatTab('att')" id="tabBtnAtt" class="stat-tab-btn active pb-3 text-sm font-black text-slate-500 tracking-widest uppercase">Attendance Stats</button>
        <button onclick="switchStatTab('leave')" id="tabBtnLeave" class="stat-tab-btn pb-3 text-sm font-black text-slate-500 tracking-widest uppercase">Leave Stats</button>
    </div>
<!-- 첫 번째 section.stat-card 바로 위에 추가 -->
<div id="summaryCards" class="grid grid-cols-2 md:grid-cols-4 gap-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 text-center">
        <div class="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-1">Attendance Days</div>
        <div id="sumCardAtt" class="text-2xl font-black text-emerald-400">—</div>
        <div id="sumCardAttPct" class="text-[10px] text-slate-500 mt-1">—%</div>
    </div>
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 text-center">
        <div class="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-1">Late Days</div>
        <div id="sumCardLate" class="text-2xl font-black text-rose-400">—</div>
        <div id="sumCardLatePct" class="text-[10px] text-slate-500 mt-1">—%</div>
    </div>
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 text-center">
        <div class="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-1">Leave Days</div>
        <div id="sumCardLeave" class="text-2xl font-black text-amber-400">—</div>
        <div id="sumCardLeavePct" class="text-[10px] text-slate-500 mt-1">—%</div>
    </div>
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 text-center">
        <div class="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-1">Punctuality</div>
        <div id="sumCardPunct" class="text-2xl font-black text-blue-400">—</div>
        <div id="sumCardPunctLabel" class="text-[10px] text-slate-500 mt-1">On-time rate</div>
    </div>
</div>

    <section class="stat-card">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
            <div>
                <h3 class="text-xl font-black text-yellow-400 flex items-center gap-2">
                    📊 <span id="statTitleMonth">Attendance</span> - Monthly (<span id="txtMonth"></span>)
                </h3>
            </div>
            <div class="flex bg-slate-800 rounded-lg p-1">
                <button onclick="changeStatPeriod('month', -1)" class="nav-btn px-3 py-1 text-slate-400 transition rounded-md text-xs font-black">PREV MONTH</button>
                <button onclick="changeStatPeriod('month', 1)" class="nav-btn px-3 py-1 text-slate-400 transition rounded-md text-xs font-black ml-1">NEXT MONTH</button>
            </div>
        </div>
        <div class="chart-container">
            <canvas id="monthlyChart"></canvas>
        </div>
    </section>
<section id="leaveHistSection" class="stat-card" style="display:none;">
    <h3 class="text-xl font-black text-yellow-400 mb-6 flex items-center gap-2">
        🕐 Checkout Time Distribution (This Month)
    </h3>
    <div class="chart-container">
        <canvas id="leaveHistChart"></canvas>
    </div>
</section>

    <section class="stat-card">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
            <div>
                <h3 class="text-xl font-black text-yellow-400 flex items-center gap-2">
                    📊 <span id="statTitleYear">Attendance</span> - Yearly (<span id="txtYear"></span>)
                </h3>
            </div>
            <div class="flex bg-slate-800 rounded-lg p-1">
                <button onclick="changeStatPeriod('year', -1)" class="nav-btn px-3 py-1 text-slate-400 transition rounded-md text-xs font-black">PREV YEAR</button>
                <button onclick="changeStatPeriod('year', 1)" class="nav-btn px-3 py-1 text-slate-400 transition rounded-md text-xs font-black ml-1">NEXT YEAR</button>
            </div>
        </div>
        <div class="chart-container">
            <canvas id="yearlyChart"></canvas>
        </div>
    </section>

    <section class="stat-card">
        <h3 class="text-xl font-black text-yellow-400 mb-6 flex items-center gap-2">
            🌍 Overall <span id="statTitleOverall">Attendance</span> Statistics
        </h3>
        <div class="chart-container">
            <canvas id="overallChart"></canvas>
        </div>
    </section>
</div>

<div id="statDetailModal" class="hidden flex items-center justify-center bg-slate-900/95 backdrop-blur-md p-4">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-2xl rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.5)] overflow-hidden animate-in fade-in zoom-in duration-200">
        <div class="p-6 border-b border-slate-700 flex justify-between items-center bg-slate-800/50">
            <h3 class="text-xl font-black text-yellow-400">
                <span id="detailUserName" class="text-white"></span>'s Detail Log
            </h3>
            <button onclick="closeStatModal()" class="text-slate-400 hover:text-white text-3xl transition-transform hover:rotate-90">&times;</button>
        </div>
        <div class="p-6 max-h-[70vh] overflow-y-auto custom-scrollbar">
            <table class="w-full text-left text-sm text-slate-300">
                <thead class="text-xs uppercase text-slate-500 border-b border-slate-700 sticky top-0 bg-slate-800">
                    <tr>
                        <th class="py-3 px-2">Date</th>
                        <th class="py-3 px-2">Status / Time</th>
                        <th class="py-3 px-2">Notes</th>
                    </tr>
                </thead>
                <tbody id="detailTableBody" class="divide-y divide-slate-700/50">
                    </tbody>
            </table>
        </div>
        <div class="p-4 bg-slate-900/30 border-t border-slate-700 flex justify-end">
            <button onclick="closeStatModal()" class="px-6 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-xl text-sm font-bold transition">Close</button>
        </div>
    </div>
</div>

<script>
    (function() {
        const db = firebase.database();
        let monthViewDate = new Date(); 
        let yearViewDate = new Date();
        let currentTab = 'att';
            let showOnlyMe = false;
    const currentUser = sessionStorage.getItem('loggedInUser') || '';
        const typeColors = {
            'ATT': '#10b981', 'LATE': '#f43f5e', 'WO': '#3b82f6', 'PEL': '#eab308',
            'ANL': '#f97316', 'HAL': '#a855f7', 'SIL': '#2dd4bf', 'SPL': '#64748b', 'EVL': '#475569',
            'LEAVE_DONE': '#6366f1'
        };

        let charts = { month: null, year: null, overall: null };
        let cachedData = null;

        window.switchStatTab = function(tab) {
            currentTab = tab;
            document.getElementById('tabBtnAtt').classList.toggle('active', tab === 'att');
            document.getElementById('tabBtnLeave').classList.toggle('active', tab === 'leave');
            const titles = ['statTitleMonth', 'statTitleYear', 'statTitleOverall'];
            const label = tab === 'att' ? 'Attendance' : 'Leave';
            titles.forEach(id => document.getElementById(id).innerText = label);
    // ▼ 히스토그램 섹션 표시/숨김
    const histSection = document.getElementById('leaveHistSection');
    if (histSection) histSection.style.display = tab === 'leave' ? 'block' : 'none';
    // ▲ 추가
            processAndRender();
        };

        window.changeStatPeriod = function(type, offset) {
            if(type === 'month') monthViewDate.setMonth(monthViewDate.getMonth() + offset);
            else if(type === 'year') yearViewDate.setFullYear(yearViewDate.getFullYear() + offset);
            processAndRender();
        };

        // --- 추가 기능: 모달 닫기 ---
        window.closeStatModal = function() {
            document.getElementById('statDetailModal').classList.add('hidden');
        };

        // --- 추가 기능: 상세 정보 표시 로직 ---
        window.showUserDetail = function(userName, periodType) {
            const monthKey = monthViewDate.toISOString().substring(0, 7);
            const yearKey = yearViewDate.getFullYear().toString();
            const tbody = document.getElementById('detailTableBody');
            
            document.getElementById('detailUserName').innerText = userName;
            tbody.innerHTML = '';

            // cachedData에서 해당 사용자의 기록만 필터링 및 정렬 (최신순)
            const logs = Object.entries(cachedData)
                .filter(([date]) => {
                    if (periodType === 'month') return date.startsWith(monthKey);
                    if (periodType === 'year') return date.startsWith(yearKey);
                    return true; // overall
                })
                .filter(([_, dayData]) => dayData[userName])
                .sort((a, b) => b[0].localeCompare(a[0]));

            if (logs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="py-4 text-center text-slate-500">No records found.</td></tr>';
            }

            logs.forEach(([date, dayData]) => {
                const record = dayData[userName];
                // 근태 타입 추출
                let type = (typeof record === 'string') ? record : (record.attend || record.leave || '-');
                // 비고/사유 추출 (데이터 구조에 따라 remark 또는 reason 사용)
                let note = (record.remark || record.reason || '-');
                
                // 간단한 타입 정규화 (배지 색상용)
                const typeKey = type.includes('LATE') ? 'LATE' : (type.includes('ATT') ? 'ATT' : type);

                const row = `
                    <tr class="border-b border-slate-700/50 hover:bg-slate-700/30 transition">
                        <td class="py-3 px-2 font-mono text-xs">${date}</td>
                        <td class="py-3 px-2">
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold text-white" style="background:${typeColors[typeKey] || '#475569'}">
                                ${type}
                            </span>
                        </td>
                        <td class="py-3 px-2 text-slate-400 text-xs">${note}</td>
                    </tr>`;
                tbody.insertAdjacentHTML('beforeend', row);
            });

            document.getElementById('statDetailModal').classList.remove('hidden');
        };

        async function initStats() {
            try {
                const snap = await db.ref('attendance').once('value');
                cachedData = snap.val() || {};
                if (document.getElementById('monthlyChart')) {
                    processAndRender();
                }
            } catch (e) {
                console.error("Stats Init Error:", e);
            }
        }

// ▼ 교체: renderLeaveHistogram 호출을 processAndRender 안으로 이동
        function processAndRender() {
            if (!cachedData || !document.getElementById('monthlyChart')) return;
            const monthKey = monthViewDate.toISOString().substring(0, 7);
            const yearKey = yearViewDate.getFullYear().toString();
            document.getElementById('txtMonth').innerText = monthViewDate.toLocaleString('en-US', { month: 'long', year: 'numeric' });
            document.getElementById('txtYear').innerText = yearKey;
            const stats = { month: {}, year: {}, overall: {} };

            Object.entries(cachedData).forEach(([date, dayData]) => {
                Object.entries(dayData).forEach(([user, record]) => {
                    if (currentTab === 'att') {
                        let type = (typeof record === 'string') ? record : (record.attend ? (record.attend.includes("ATT") ? "ATT" : (record.attend.includes("LATE") ? "LATE" : "")) : "");
                        if (!type || !typeColors[type]) return;
                        const updateCount = (obj) => {
                            if (!obj[user]) obj[user] = {};
                            obj[user][type] = (obj[user][type] || 0) + 1;
                        };
                        if (date.startsWith(monthKey)) updateCount(stats.month);
                        if (date.startsWith(yearKey)) updateCount(stats.year);
                        updateCount(stats.overall);
                    } else {
                        if (typeof record !== 'string' && record.leave) {
                            const timeParts = record.leave.split(':');
                            const decimalTime = parseInt(timeParts[0]) + (parseInt(timeParts[1]) / 60);
                            const updateTimeData = (obj) => {
                                if (!obj[user]) obj[user] = [];
                                obj[user].push({ x: date, y: decimalTime });
                            };
                            if (date.startsWith(monthKey)) updateTimeData(stats.month);
                            if (date.startsWith(yearKey)) updateTimeData(stats.year);
                            updateTimeData(stats.overall);
                        }
                    }
                });
            });

            renderChart('monthlyChart', 'month', stats.month);
            renderChart('yearlyChart', 'year', stats.year);
            renderChart('overallChart', 'overall', stats.overall);
            if (currentTab === 'att') updateSummaryCards(stats.month);
            if (currentTab === 'leave') renderLeaveHistogram(stats.month); // ← 함수 안으로 이동
        }

        function updateSummaryCards(monthStats) {
            if (!currentUser || !monthStats[currentUser]) return;
            const my = monthStats[currentUser];
            const att   = my['ATT']  || 0;
            const late  = my['LATE'] || 0;
            const leaveTypes = ['WO','PEL','ANL','HAL','SIL','SPL'];
            const leave = leaveTypes.reduce((s, t) => s + (my[t] || 0), 0);
            const total = att + late + leave;
            const punct = (att + late) > 0 ? Math.round((att / (att + late)) * 100) : 0;
            const attPct  = total > 0 ? Math.round(((att + late) / total) * 100) : 0;
            const latePct = (att + late) > 0 ? Math.round((late / (att + late)) * 100) : 0;
            const leavePct = total > 0 ? Math.round((leave / total) * 100) : 0;

            const el = id => document.getElementById(id);
            if (el('sumCardAtt'))      el('sumCardAtt').innerText      = att + late;
            if (el('sumCardAttPct'))   el('sumCardAttPct').innerText   = attPct + '% of total';
            if (el('sumCardLate'))     el('sumCardLate').innerText     = late;
            if (el('sumCardLatePct'))  el('sumCardLatePct').innerText  = latePct + '% of attended';
            if (el('sumCardLeave'))    el('sumCardLeave').innerText    = leave;
            if (el('sumCardLeavePct')) el('sumCardLeavePct').innerText = leavePct + '% of total';
            if (el('sumCardPunct'))    el('sumCardPunct').innerText    = punct + '%';

            const punctEl = el('sumCardPunct');
            if (punctEl) punctEl.style.color = punct >= 90 ? '#10b981' : punct >= 70 ? '#f59e0b' : '#f43f5e';
        }

        function renderChart(canvasId, chartType, chartData) {
            const canvas = document.getElementById(canvasId);
            if (!canvas || typeof Chart === 'undefined') return;
            const ctx = canvas.getContext('2d');
            const existingChart = Chart.getChart(canvas);
            if (existingChart) { existingChart.destroy(); }

            if (currentTab === 'att') {
                const users = Object.keys(chartData).sort();
                const relevantTypes = ['ATT', 'LATE', 'WO', 'PEL', 'ANL', 'HAL', 'SIL', 'SPL', 'EVL'];
                const datasets = relevantTypes.map(type => {
                    const dataPoints = users.map(user => chartData[user][type] || 0);
                    if (dataPoints.every(v => v === 0)) return null;
                    return {
                        label: type,
                        data: dataPoints,
                        backgroundColor: typeColors[type],
                        borderRadius: 4
                    };
                }).filter(d => d !== null);

                charts[chartType] = new Chart(ctx, {
                    type: 'bar',
                    data: { labels: users, datasets: datasets },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        // --- 추가 코드: 클릭 이벤트 핸들러 ---
                        onClick: (e, elements) => {
                            if (elements.length > 0 && currentTab === 'att') {
                                const index = elements[0].index;
                                const userName = charts[chartType].data.labels[index];
                                showUserDetail(userName, chartType);
                            }
                        },
                        scales: {
                            x: { stacked: false, ticks: { color: '#94a3b8', font: { size: 10 } } },
                            y: { 
                                beginAtZero: true, 
                                ticks: { stepSize: 1, color: '#94a3b8', callback: (value) => value + 'd' },
                                grid: { color: 'rgba(255, 255, 255, 0.05)' }
                            }
                        },
                        plugins: {
                            legend: { position: 'top', labels: { color: '#f8fafc', font: { size: 10 } } }
                        }
                    }
                });
            } else {
                const datasets = Object.entries(chartData).map(([user, points], idx) => {
                    points.sort((a, b) => a.x.localeCompare(b.x));
                    const color = `hsl(${(idx * 137.5) % 360}, 70%, 60%)`; 
                    return {
                        label: user,
                        data: points,
                        borderColor: color,
                        backgroundColor: color,
                        borderWidth: 2,
                        pointRadius: 4,
                        tension: 0.3,
                        fill: false
                    };
                });

                charts[chartType] = new Chart(ctx, {
                    type: 'line',
                    data: { datasets: datasets },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: { type: 'category', ticks: { color: '#64748b', font: { size: 10 } } },
                            y: {
                                min: 17.5, max: 22.0,
                                afterBuildTicks: function(axis) {
                                    const ticks = [];
                                    for (let time = 17.5; time <= 18.5 + 0.0001; time += (5/60)) { ticks.push({ value: time }); }
                                    for (let time = 18.5 + (20/60); time <= 22.0 + 0.0001; time += (20/60)) { ticks.push({ value: time }); }
                                    axis.ticks = ticks;
                                },
                                ticks: {
                                    color: '#94a3b8', font: { size: 9 }, autoSkip: false,
                                    callback: function(value) {
                                        const h = Math.floor(value + 0.0001);
                                        const m = Math.round((value - h) * 60);
                                        return `${h}:${m === 0 ? '00' : (m < 10 ? '0' + m : m)}`;
                                    }
                                },
                                grid: { 
                                    color: (context) => (context.tick && context.tick.value % 1 === 0 ? 'rgba(255, 255, 255, 0.15)' : 'rgba(255, 255, 255, 0.05)'),
                                    lineWidth: (context) => (context.tick && context.tick.value % 1 === 0 ? 1.5 : 1)
                                }
                            }
                        },
                        plugins: {
                            legend: { position: 'top', labels: { color: '#f8fafc', font: { size: 10 } } },
                            tooltip: {
                                callbacks: {
                                    label: (ctx) => {
                                        const h = Math.floor(ctx.parsed.y + 0.0001);
                                        const m = Math.round((ctx.parsed.y - h) * 60);
                                        return `${ctx.dataset.label}: ${h}:${m < 10 ? '0' + m : m}`;
                                    }
                                }
                            }
                        }
                    }
                });
            }
        }

function renderLeaveHistogram(monthData) {
    const canvas = document.getElementById('leaveHistChart');
    if (!canvas) return;
    const existing = Chart.getChart(canvas);
    if (existing) existing.destroy();

    // 30분 단위 버킷 생성 (17:30 ~ 21:30)
    const buckets = {};
    for (let h = 17; h <= 21; h++) {
        buckets[`${h}:00`] = 0;
        buckets[`${h}:30`] = 0;
    }
    buckets['22:00'] = 0;

    Object.values(monthData).forEach(points => {
        points.forEach(p => {
            const totalMins = Math.round(p.y * 60);
            const bucket = Math.floor(totalMins / 30) * 30;
            const h = Math.floor(bucket / 60);
            const m = bucket % 60;
            const key = `${h}:${m === 0 ? '00' : '30'}`;
            if (buckets[key] !== undefined) buckets[key]++;
        });
    });

    new Chart(canvas.getContext('2d'), {
        type: 'bar',
        data: {
            labels: Object.keys(buckets),
            datasets: [{
                label: 'Checkout Count',
                data: Object.values(buckets),
                backgroundColor: Object.keys(buckets).map(k => {
                    const h = parseInt(k.split(':')[0]);
                    return h <= 18 ? '#10b981' : h <= 19 ? '#f59e0b' : '#f43f5e';
                }),
                borderRadius: 6
            }]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { ticks: { color: '#94a3b8', font: { size: 10 } } },
                y: { beginAtZero: true, ticks: { stepSize: 1, color: '#94a3b8' },
                     grid: { color: 'rgba(255,255,255,0.05)' } }
            }
        }
    });
}

        setTimeout(() => { initStats(); }, 300);
        window.refreshStatistics = processAndRender;
    })();
</script>
