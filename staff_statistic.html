<style>
/* ══════════════════════════════════════════
   STAFF STATISTIC — 3D DARK COCKPIT THEME
   Deep navy + gold/amber command center
   SF Mono data readability
══════════════════════════════════════════ */

:root {
    --bg:        #040810;
    --surface:   #080f1e;
    --surface2:  #0d1628;
    --surface3:  #111e33;
    --border:    rgba(255,255,255,0.06);
    --border2:   rgba(255,255,255,0.12);
    --text:      #f1f5f9;
    --muted:     #475569;
    --dim:       #1e293b;
    --gold:      #facc15;
    --green:     #10b981;
    --red:       #f43f5e;
    --blue:      #3b82f6;
    --amber:     #f59e0b;
    --cyan:      #06b6d4;
    --green-dim: rgba(16,185,129,0.12);
    --red-dim:   rgba(244,63,94,0.12);
    --blue-dim:  rgba(59,130,246,0.12);
    --amber-dim: rgba(245,158,11,0.12);
    --gold-dim:  rgba(250,204,21,0.1);
}

*, *::before, *::after { box-sizing: border-box; }

/* ── Stat Card (3D) ── */
.stat-card {
    position: relative;
    background: linear-gradient(145deg, var(--surface2) 0%, var(--surface) 100%);
    border: 1px solid var(--border);
    border-top: 1px solid var(--border2);
    border-radius: 20px;
    padding: 20px 22px;
    margin-bottom: 16px;
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.07),
        inset 0 -1px 0 rgba(0,0,0,0.3),
        0 8px 28px rgba(0,0,0,0.5),
        0 2px 8px rgba(0,0,0,0.3);
    transition: transform 0.35s cubic-bezier(0.23,1,0.32,1), box-shadow 0.35s ease;
    overflow: hidden;
}
.stat-card::before {
    content: '';
    position: absolute; top: 0; left: 10%; right: 10%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(250,204,21,0.25), transparent);
    pointer-events: none;
}
.stat-card::after {
    content: '';
    position: absolute; top: -60px; right: -60px;
    width: 160px; height: 160px;
    background: radial-gradient(circle, rgba(250,204,21,0.06), transparent 70%);
    border-radius: 50%;
    pointer-events: none;
}
.stat-card:hover {
    transform: translateY(-3px) rotateX(2deg);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.09),
        0 20px 44px rgba(0,0,0,0.6),
        0 4px 14px rgba(0,0,0,0.4);
}

/* ── Chart Container — 작게 ── */
.chart-container {
    position: relative;
    height: 220px;
    width: 100%;
}

/* ── Summary Cards ── */
#summaryCards {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 16px;
}
@media (min-width: 640px) {
    #summaryCards { grid-template-columns: repeat(4, 1fr); }
}

#summaryCards > div {
    position: relative;
    background: linear-gradient(145deg, var(--surface2), var(--surface));
    border: 1px solid var(--border);
    border-top: 1px solid var(--border2);
    border-radius: 16px;
    padding: 14px 12px;
    text-align: center;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 4px 16px rgba(0,0,0,0.4);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    overflow: hidden;
}
#summaryCards > div::before {
    content: '';
    position: absolute; top: 0; left: 20%; right: 20%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
}
#summaryCards > div:hover {
    transform: translateY(-4px) scale(1.02);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.09), 0 12px 28px rgba(0,0,0,0.55);
}

/* ── Tab Nav ── */
.flex.gap-6.border-b {
    border-color: var(--border) !important;
    background: linear-gradient(145deg, var(--surface2), var(--surface));
    border-radius: 14px 14px 0 0;
    padding: 10px 16px 0 !important;
    margin-bottom: 16px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
}
.stat-tab-btn {
    transition: all 0.25s;
    position: relative;
    font-family: 'SF Mono', monospace;
    font-size: 9px !important;
    letter-spacing: 0.12em;
    color: var(--muted) !important;
    padding-bottom: 10px !important;
}
.stat-tab-btn:hover { color: var(--text) !important; }
.stat-tab-btn.active {
    color: var(--gold) !important;
    text-shadow: 0 0 12px rgba(250,204,21,0.4);
}
.stat-tab-btn.active::after {
    content: '';
    position: absolute; bottom: -1px; left: 0; width: 100%; height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    border-radius: 2px;
    box-shadow: 0 0 8px rgba(250,204,21,0.5);
}

/* ── Nav Buttons ── */
.nav-btn {
    font-family: 'SF Mono', monospace;
    font-size: 9px !important;
    font-weight: 900 !important;
    letter-spacing: 0.06em;
    border-radius: 8px;
    transition: all 0.2s;
    padding: 5px 10px;
    color: var(--muted);
}
.nav-btn:hover {
    background: rgba(59,130,246,0.12) !important;
    color: #60a5fa !important;
    box-shadow: 0 0 10px rgba(59,130,246,0.15);
}

/* Nav btn wrapper */
.flex.bg-slate-800.rounded-lg {
    background: linear-gradient(145deg, var(--surface3), var(--surface2)) !important;
    border: 1px solid var(--border) !important;
    border-radius: 10px !important;
    padding: 3px !important;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.04) !important;
}

/* ── Chart title ── */
.stat-card h3 {
    font-family: 'SF Mono', 'Fira Code', monospace !important;
    font-size: 12px !important;
    font-weight: 900 !important;
    font-style: italic;
    letter-spacing: -0.01em;
    color: var(--gold) !important;
    text-shadow: 0 0 16px rgba(250,204,21,0.25);
}

/* ── Section header row ── */
.stat-card .flex.flex-col.md\\:flex-row {
    margin-bottom: 14px !important;
}

/* ── Summary card labels/values ── */
#summaryCards .text-\[9px\] {
    font-family: 'SF Mono', monospace;
    letter-spacing: 0.1em;
    color: var(--muted) !important;
}
#summaryCards .text-2xl {
    font-family: 'SF Mono', monospace;
    letter-spacing: -0.02em;
    line-height: 1;
    text-shadow: 0 0 16px currentColor;
}
#summaryCards .text-\[10px\] {
    font-family: 'SF Mono', monospace;
    color: var(--muted) !important;
}

/* ── Modal ── */
#statDetailModal {
    z-index: 9999 !important;
    position: fixed !important;
    inset: 0 !important;
    background: rgba(0,0,0,0.88) !important;
    backdrop-filter: blur(12px) !important;
}
#statDetailModal > div {
    background: linear-gradient(145deg, #0d1628, #080f1e) !important;
    border: 1px solid rgba(255,255,255,0.08) !important;
    border-top: 1px solid rgba(255,255,255,0.15) !important;
    border-radius: 24px !important;
    box-shadow:
        0 40px 80px rgba(0,0,0,0.7),
        inset 0 1px 0 rgba(255,255,255,0.07) !important;
    animation: modalIn 0.35s cubic-bezier(0.23,1,0.32,1) both;
}
@keyframes modalIn {
    from { opacity:0; transform: scale(0.93) translateY(20px); }
    to   { opacity:1; transform: none; }
}
#statDetailModal .p-6.border-b {
    background: rgba(255,255,255,0.02) !important;
    border-color: var(--border) !important;
}
#statDetailModal thead tr {
    background: var(--surface2) !important;
    border-color: var(--border) !important;
}
#statDetailModal thead th {
    color: var(--muted) !important;
    font-family: 'SF Mono', monospace;
    font-size: 8px !important;
    letter-spacing: 0.12em;
}
#statDetailModal tbody tr:hover {
    background: rgba(59,130,246,0.05) !important;
}
#statDetailModal .p-4.bg-slate-900\/30 {
    background: rgba(4,8,16,0.5) !important;
    border-color: var(--border) !important;
}

/* ── Scrollbar ── */
.custom-scrollbar::-webkit-scrollbar { width: 4px; }
.custom-scrollbar::-webkit-scrollbar-track { background: var(--surface2); border-radius: 10px; }
.custom-scrollbar::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 10px; }
.custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #334155; }

/* ── Leave Histogram card ── */
#leaveHistSection {
    border-color: rgba(250,204,21,0.15) !important;
}
#leaveHistSection::before {
    background: linear-gradient(90deg, transparent, rgba(250,204,21,0.2), transparent) !important;
}

/* ── Summary card color accents ── */
#summaryCards > div:nth-child(1) { border-top-color: rgba(16,185,129,0.3); }
#summaryCards > div:nth-child(1)::before {
    background: linear-gradient(90deg, transparent, rgba(16,185,129,0.2), transparent);
}
#summaryCards > div:nth-child(2) { border-top-color: rgba(244,63,94,0.3); }
#summaryCards > div:nth-child(2)::before {
    background: linear-gradient(90deg, transparent, rgba(244,63,94,0.2), transparent);
}
#summaryCards > div:nth-child(3) { border-top-color: rgba(245,158,11,0.3); }
#summaryCards > div:nth-child(3)::before {
    background: linear-gradient(90deg, transparent, rgba(245,158,11,0.2), transparent);
}
#summaryCards > div:nth-child(4) { border-top-color: rgba(59,130,246,0.3); }
#summaryCards > div:nth-child(4)::before {
    background: linear-gradient(90deg, transparent, rgba(59,130,246,0.2), transparent);
}

/* ── Fade in animation ── */
.animate-fadeIn { animation: fadeIn 0.45s cubic-bezier(0.22,1,0.36,1) both; }
@keyframes fadeIn { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: none; } }

/* ── Utility overrides ── */
.space-y-8 > * + * { margin-top: 0 !important; }
.space-y-8 { display: flex; flex-direction: column; gap: 0; }
.pb-10 { padding-bottom: 40px; }
</style>


<div class="animate-fadeIn space-y-8 pb-10">

<script>
    (function() {
        const db = firebase.database();
        let monthViewDate = new Date(); 
        let yearViewDate = new Date();
        let currentTab = 'att';
            let showOnlyMe = false;
    const currentUser = sessionStorage.getItem('loggedInUser') || '';
        const typeColors = {
            'ATT': '#10b981', 'LATE': '#f43f5e', 'WO': '#3b82f6', 'PEL': '#eab308',
            'ANL': '#f97316', 'HAL': '#a855f7', 'SIL': '#2dd4bf', 'SPL': '#64748b', 'EVL': '#475569',
            'LEAVE_DONE': '#6366f1'
        };

        let charts = { month: null, year: null, overall: null };
        let cachedData = null;

        window.switchStatTab = function(tab) {
            currentTab = tab;
            document.getElementById('tabBtnAtt').classList.toggle('active', tab === 'att');
            document.getElementById('tabBtnLeave').classList.toggle('active', tab === 'leave');
            const titles = ['statTitleMonth', 'statTitleYear', 'statTitleOverall'];
            const label = tab === 'att' ? 'Attendance' : 'Leave';
            titles.forEach(id => document.getElementById(id).innerText = label);
    // ▼ 히스토그램 섹션 표시/숨김
    const histSection = document.getElementById('leaveHistSection');
    if (histSection) histSection.style.display = tab === 'leave' ? 'block' : 'none';
    // ▲ 추가
            processAndRender();
        };

        window.changeStatPeriod = function(type, offset) {
            if(type === 'month') monthViewDate.setMonth(monthViewDate.getMonth() + offset);
            else if(type === 'year') yearViewDate.setFullYear(yearViewDate.getFullYear() + offset);
            processAndRender();
        };

        // --- 추가 기능: 모달 닫기 ---
        window.closeStatModal = function() {
            document.getElementById('statDetailModal').classList.add('hidden');
        };

        // --- 추가 기능: 상세 정보 표시 로직 ---
        window.showUserDetail = function(userName, periodType) {
            const monthKey = monthViewDate.toISOString().substring(0, 7);
            const yearKey = yearViewDate.getFullYear().toString();
            const tbody = document.getElementById('detailTableBody');
            
            document.getElementById('detailUserName').innerText = userName;
            tbody.innerHTML = '';

            // cachedData에서 해당 사용자의 기록만 필터링 및 정렬 (최신순)
            const logs = Object.entries(cachedData)
                .filter(([date]) => {
                    if (periodType === 'month') return date.startsWith(monthKey);
                    if (periodType === 'year') return date.startsWith(yearKey);
                    return true; // overall
                })
                .filter(([_, dayData]) => dayData[userName])
                .sort((a, b) => b[0].localeCompare(a[0]));

            if (logs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="py-4 text-center text-slate-500">No records found.</td></tr>';
            }

            logs.forEach(([date, dayData]) => {
                const record = dayData[userName];
                // 근태 타입 추출
                let type = (typeof record === 'string') ? record : (record.attend || record.leave || '-');
                // 비고/사유 추출 (데이터 구조에 따라 remark 또는 reason 사용)
                let note = (record.remark || record.reason || '-');
                
                // 간단한 타입 정규화 (배지 색상용)
                const typeKey = type.includes('LATE') ? 'LATE' : (type.includes('ATT') ? 'ATT' : type);

                const row = `
                    <tr class="border-b border-slate-700/50 hover:bg-slate-700/30 transition">
                        <td class="py-3 px-2 font-mono text-xs">${date}</td>
                        <td class="py-3 px-2">
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold text-white" style="background:${typeColors[typeKey] || '#475569'}">
                                ${type}
                            </span>
                        </td>
                        <td class="py-3 px-2 text-slate-400 text-xs">${note}</td>
                    </tr>`;
                tbody.insertAdjacentHTML('beforeend', row);
            });

            document.getElementById('statDetailModal').classList.remove('hidden');
        };

        async function initStats() {
            try {
                const snap = await db.ref('attendance').once('value');
                cachedData = snap.val() || {};
                if (document.getElementById('monthlyChart')) {
                    processAndRender();
                }
            } catch (e) {
                console.error("Stats Init Error:", e);
            }
        }

// ▼ 교체: renderLeaveHistogram 호출을 processAndRender 안으로 이동
        function processAndRender() {
            if (!cachedData || !document.getElementById('monthlyChart')) return;
            const monthKey = monthViewDate.toISOString().substring(0, 7);
            const yearKey = yearViewDate.getFullYear().toString();
            document.getElementById('txtMonth').innerText = monthViewDate.toLocaleString('en-US', { month: 'long', year: 'numeric' });
            document.getElementById('txtYear').innerText = yearKey;
            const stats = { month: {}, year: {}, overall: {} };

            Object.entries(cachedData).forEach(([date, dayData]) => {
                Object.entries(dayData).forEach(([user, record]) => {
                    if (currentTab === 'att') {
                        let type = (typeof record === 'string') ? record : (record.attend ? (record.attend.includes("ATT") ? "ATT" : (record.attend.includes("LATE") ? "LATE" : "")) : "");
                        if (!type || !typeColors[type]) return;
                        const updateCount = (obj) => {
                            if (!obj[user]) obj[user] = {};
                            obj[user][type] = (obj[user][type] || 0) + 1;
                        };
                        if (date.startsWith(monthKey)) updateCount(stats.month);
                        if (date.startsWith(yearKey)) updateCount(stats.year);
                        updateCount(stats.overall);
                    } else {
                        if (typeof record !== 'string' && record.leave) {
                            const timeParts = record.leave.split(':');
                            const decimalTime = parseInt(timeParts[0]) + (parseInt(timeParts[1]) / 60);
                            const updateTimeData = (obj) => {
                                if (!obj[user]) obj[user] = [];
                                obj[user].push({ x: date, y: decimalTime });
                            };
                            if (date.startsWith(monthKey)) updateTimeData(stats.month);
                            if (date.startsWith(yearKey)) updateTimeData(stats.year);
                            updateTimeData(stats.overall);
                        }
                    }
                });
            });

            renderChart('monthlyChart', 'month', stats.month);
            renderChart('yearlyChart', 'year', stats.year);
            renderChart('overallChart', 'overall', stats.overall);
            if (currentTab === 'att') updateSummaryCards(stats.month);
            if (currentTab === 'leave') renderLeaveHistogram(stats.month); // ← 함수 안으로 이동
        }

        function updateSummaryCards(monthStats) {
            if (!currentUser || !monthStats[currentUser]) return;
            const my = monthStats[currentUser];
            const att   = my['ATT']  || 0;
            const late  = my['LATE'] || 0;
            const leaveTypes = ['WO','PEL','ANL','HAL','SIL','SPL'];
            const leave = leaveTypes.reduce((s, t) => s + (my[t] || 0), 0);
            const total = att + late + leave;
            const punct = (att + late) > 0 ? Math.round((att / (att + late)) * 100) : 0;
            const attPct  = total > 0 ? Math.round(((att + late) / total) * 100) : 0;
            const latePct = (att + late) > 0 ? Math.round((late / (att + late)) * 100) : 0;
            const leavePct = total > 0 ? Math.round((leave / total) * 100) : 0;

            const el = id => document.getElementById(id);
            if (el('sumCardAtt'))      el('sumCardAtt').innerText      = att + late;
            if (el('sumCardAttPct'))   el('sumCardAttPct').innerText   = attPct + '% of total';
            if (el('sumCardLate'))     el('sumCardLate').innerText     = late;
            if (el('sumCardLatePct'))  el('sumCardLatePct').innerText  = latePct + '% of attended';
            if (el('sumCardLeave'))    el('sumCardLeave').innerText    = leave;
            if (el('sumCardLeavePct')) el('sumCardLeavePct').innerText = leavePct + '% of total';
            if (el('sumCardPunct'))    el('sumCardPunct').innerText    = punct + '%';

            const punctEl = el('sumCardPunct');
            if (punctEl) punctEl.style.color = punct >= 90 ? '#10b981' : punct >= 70 ? '#f59e0b' : '#f43f5e';
        }

        function renderChart(canvasId, chartType, chartData) {
            const canvas = document.getElementById(canvasId);
            if (!canvas || typeof Chart === 'undefined') return;
            const ctx = canvas.getContext('2d');
            const existingChart = Chart.getChart(canvas);
            if (existingChart) { existingChart.destroy(); }

            if (currentTab === 'att') {
                const users = Object.keys(chartData).sort();
                const relevantTypes = ['ATT', 'LATE', 'WO', 'PEL', 'ANL', 'HAL', 'SIL', 'SPL', 'EVL'];
                const datasets = relevantTypes.map(type => {
                    const dataPoints = users.map(user => chartData[user][type] || 0);
                    if (dataPoints.every(v => v === 0)) return null;
                    return {
                        label: type,
                        data: dataPoints,
                        backgroundColor: typeColors[type],
                        borderRadius: 4
                    };
                }).filter(d => d !== null);

                charts[chartType] = new Chart(ctx, {
                    type: 'bar',
                    data: { labels: users, datasets: datasets },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        // --- 추가 코드: 클릭 이벤트 핸들러 ---
                        onClick: (e, elements) => {
                            if (elements.length > 0 && currentTab === 'att') {
                                const index = elements[0].index;
                                const userName = charts[chartType].data.labels[index];
                                showUserDetail(userName, chartType);
                            }
                        },
                        scales: {
                            x: { stacked: false, ticks: { color: '#94a3b8', font: { size: 10 } } },
                            y: { 
                                beginAtZero: true, 
                                ticks: { stepSize: 1, color: '#94a3b8', callback: (value) => value + 'd' },
                                grid: { color: 'rgba(255, 255, 255, 0.05)' }
                            }
                        },
                        plugins: {
                            legend: { position: 'top', labels: { color: '#f8fafc', font: { size: 10 } } }
                        }
                    }
                });
            } else {
                const datasets = Object.entries(chartData).map(([user, points], idx) => {
                    points.sort((a, b) => a.x.localeCompare(b.x));
                    const color = `hsl(${(idx * 137.5) % 360}, 70%, 60%)`; 
                    return {
                        label: user,
                        data: points,
                        borderColor: color,
                        backgroundColor: color,
                        borderWidth: 2,
                        pointRadius: 4,
                        tension: 0.3,
                        fill: false
                    };
                });

                charts[chartType] = new Chart(ctx, {
                    type: 'line',
                    data: { datasets: datasets },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: { type: 'category', ticks: { color: '#64748b', font: { size: 10 } } },
                            y: {
                                min: 17.5, max: 22.0,
                                afterBuildTicks: function(axis) {
                                    const ticks = [];
                                    for (let time = 17.5; time <= 18.5 + 0.0001; time += (5/60)) { ticks.push({ value: time }); }
                                    for (let time = 18.5 + (20/60); time <= 22.0 + 0.0001; time += (20/60)) { ticks.push({ value: time }); }
                                    axis.ticks = ticks;
                                },
                                ticks: {
                                    color: '#94a3b8', font: { size: 9 }, autoSkip: false,
                                    callback: function(value) {
                                        const h = Math.floor(value + 0.0001);
                                        const m = Math.round((value - h) * 60);
                                        return `${h}:${m === 0 ? '00' : (m < 10 ? '0' + m : m)}`;
                                    }
                                },
                                grid: { 
                                    color: (context) => (context.tick && context.tick.value % 1 === 0 ? 'rgba(255, 255, 255, 0.15)' : 'rgba(255, 255, 255, 0.05)'),
                                    lineWidth: (context) => (context.tick && context.tick.value % 1 === 0 ? 1.5 : 1)
                                }
                            }
                        },
                        plugins: {
                            legend: { position: 'top', labels: { color: '#f8fafc', font: { size: 10 } } },
                            tooltip: {
                                callbacks: {
                                    label: (ctx) => {
                                        const h = Math.floor(ctx.parsed.y + 0.0001);
                                        const m = Math.round((ctx.parsed.y - h) * 60);
                                        return `${ctx.dataset.label}: ${h}:${m < 10 ? '0' + m : m}`;
                                    }
                                }
                            }
                        }
                    }
                });
            }
        }

function renderLeaveHistogram(monthData) {
    const canvas = document.getElementById('leaveHistChart');
    if (!canvas) return;
    const existing = Chart.getChart(canvas);
    if (existing) existing.destroy();

    // 30분 단위 버킷 생성 (17:30 ~ 21:30)
    const buckets = {};
    for (let h = 17; h <= 21; h++) {
        buckets[`${h}:00`] = 0;
        buckets[`${h}:30`] = 0;
    }
    buckets['22:00'] = 0;

    Object.values(monthData).forEach(points => {
        points.forEach(p => {
            const totalMins = Math.round(p.y * 60);
            const bucket = Math.floor(totalMins / 30) * 30;
            const h = Math.floor(bucket / 60);
            const m = bucket % 60;
            const key = `${h}:${m === 0 ? '00' : '30'}`;
            if (buckets[key] !== undefined) buckets[key]++;
        });
    });

    new Chart(canvas.getContext('2d'), {
        type: 'bar',
        data: {
            labels: Object.keys(buckets),
            datasets: [{
                label: 'Checkout Count',
                data: Object.values(buckets),
                backgroundColor: Object.keys(buckets).map(k => {
                    const h = parseInt(k.split(':')[0]);
                    return h <= 18 ? '#10b981' : h <= 19 ? '#f59e0b' : '#f43f5e';
                }),
                borderRadius: 6
            }]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { ticks: { color: '#94a3b8', font: { size: 10 } } },
                y: { beginAtZero: true, ticks: { stepSize: 1, color: '#94a3b8' },
                     grid: { color: 'rgba(255,255,255,0.05)' } }
            }
        }
    });
}

        setTimeout(() => { initStats(); }, 300);
        window.refreshStatistics = processAndRender;
    })();
</script>
