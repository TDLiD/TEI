<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin - DAILY SYSTEM</title>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-database-compat.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css">
    <style>
        body { font-family: "Pretendard", sans-serif; background-color: #000; color: #f1f5f9; overflow-x: hidden; }
        .tab-btn { transition: all 0.3s; position: relative; display: flex; align-items: center; gap: 0.75rem; }
        .tab-active { color: #3b82f6; font-weight: 900; background: rgba(59, 130, 246, 0.1); border-radius: 1rem; }
        .tab-inactive { color: #64748b; }
        @media (min-width: 768px) {
            .tab-active::before { content: ''; position: absolute; left: -1rem; top: 20%; height: 60%; width: 4px; background: #3b82f6; border-radius: 0 4px 4px 0; }
        }
        @keyframes popup-in {
            0% { transform: translateY(-20px) scale(0.95); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        .animate-popup { animation: popup-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes toast-in {
            0% { transform: translateX(100%); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
        .animate-toast { animation: toast-in 0.4s ease-out forwards; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .pulse-red { animation: pulse-red 2s infinite; }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body class="min-h-screen relative flex flex-col md:flex-row">

    <div id="realtimeAlertContainer" class="fixed top-4 md:top-10 left-1/2 -translate-x-1/2 md:left-auto md:right-10 z-[10001] flex flex-col gap-4 w-[90%] md:w-[380px] pointer-events-none"></div>
    <div id="globalNotificationArea" class="fixed top-6 right-6 z-[10000] flex flex-col gap-3 w-[280px] md:w-[320px] pointer-events-none"></div>

    <aside class="w-full md:w-72 md:h-screen bg-slate-950/50 border-b md:border-b-0 md:border-r border-slate-800 backdrop-blur-xl flex-shrink-0 z-50 sticky top-0">
        <div class="h-full flex flex-col p-4 md:p-6">
            <div class="flex justify-between items-center mb-6 md:mb-12">
                <div class="flex items-center gap-2">
                    <img src="images/login/login.gif" alt="Logo" class="w-14 h-14 md:w-20 md:h-20 object-contain">
                    <h1 class="text-2xl md:text-3xl font-black italic tracking-tighter">
                        ADMIN <span class="text-blue-500">SYSTEM</span>
                    </h1>
                </div>
                <a href="index.html" class="md:hidden text-[10px] font-bold text-slate-500 border border-slate-800 px-3 py-1.5 rounded-full uppercase">Logout</a>
            </div>
            <nav class="flex md:flex-col gap-2 overflow-x-auto no-scrollbar relative pb-2 md:pb-0">
                <button onclick="switchAdminTab('dashboard')" id="btn-dashboard" class="tab-btn px-4 py-3 whitespace-nowrap text-sm tab-active uppercase tracking-tighter">📊 Dashboard</button>
                <button onclick="switchAdminTab('attendance')" id="btn-attendance" class="tab-btn px-4 py-3 whitespace-nowrap text-sm tab-inactive uppercase tracking-tighter">👤 Attendance</button>
                <button onclick="switchAdminTab('statistic')" id="btn-statistic" class="tab-btn px-4 py-3 whitespace-nowrap text-sm tab-inactive text-blue-400 uppercase tracking-tighter">📈 Statistics</button>
                <button onclick="switchAdminTab('reports')" id="btn-reports" class="tab-btn px-4 py-3 whitespace-nowrap text-sm tab-inactive uppercase tracking-tighter">📝 Reports</button>
                <button onclick="switchAdminTab('schedule')" id="btn-schedule" class="tab-btn px-4 py-3 whitespace-nowrap text-sm tab-inactive text-purple-400 uppercase tracking-tighter">📅 Schedule</button>
                <button onclick="switchAdminTab('settings')" id="btn-settings" class="tab-btn px-4 py-3 whitespace-nowrap text-sm tab-inactive text-amber-400 uppercase tracking-tighter">⚙️ Settings</button>
            </nav>
        </div>
    </aside>

    <main class="flex-grow min-w-0 h-screen overflow-y-auto overflow-x-hidden p-4 md:p-10">
        <div id="adminContent" class="max-w-[1200px] mx-auto animate-fadeIn"></div>
    </main>

    <div id="customAdminModal" class="fixed inset-0 z-[9999] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-md" onclick="window.closeAdminCustomModal()"></div>
        <div class="relative bg-slate-900 w-full max-w-lg rounded-[32px] border border-slate-700 shadow-2xl overflow-hidden animate-popup">
            <div id="modalHeaderArea" class="p-6 border-b border-slate-800/50"></div>
            <div id="modalBodyArea" class="p-6 max-h-[70vh] overflow-y-auto no-scrollbar"></div>
            <div class="p-6 pt-0">
                <button onclick="window.closeAdminCustomModal()" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-black py-4 rounded-2xl transition-colors">Close</button>
            </div>
        </div>
    </div>

<script>
    const firebaseConfig = { databaseURL: "https://tdlid-dailyreport-default-rtdb.firebaseio.com" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 상태 관리 변수
    let isInitialLoad = true;
    let isWatching = false;
    const processedKeys = new Set(); 

    // [디버그용] 콘솔에 진행 상황 출력
    const debugLog = (msg, data) => console.log(`[REALTIME_DEBUG] ${msg}`, data || "");

    function showRealtimeAttendancePopup(user, type, time, date) {
        debugLog(`팝업 실행 시도: ${user} / ${type}`);
        const container = document.getElementById('realtimeAlertContainer');
        if(!container) {
            console.error("Alert Container를 찾을 수 없습니다.");
            return;
        }

        const isArrival = type.includes('출근');
        const colorClass = isArrival ? 'blue' : 'rose';
        const icon = isArrival ? '☀️' : '🌙';

        const alertDiv = document.createElement('div');
        alertDiv.className = `animate-popup pointer-events-auto bg-slate-900 border-2 border-${colorClass}-500 shadow-2xl p-6 rounded-[28px] flex flex-col gap-4 mb-4 relative z-[10002]`;
        
        alertDiv.innerHTML = `
            <div class="flex items-start justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 flex items-center justify-center text-2xl bg-slate-800 rounded-full">${icon}</div>
                    <div>
                        <div class="text-[10px] font-black text-${colorClass}-400 uppercase tracking-widest">Real-time Alert</div>
                        <div class="text-xl font-black text-white uppercase">${isArrival ? 'Punch In' : 'Punch Out'}</div>
                    </div>
                </div>
                <div class="text-right">
                    <div class="text-[11px] text-slate-500 font-bold">${date}</div>
                    <div class="text-lg font-black text-white">${time}</div>
                </div>
            </div>
            <div class="bg-black/40 rounded-2xl p-4 border border-white/5">
                <div class="text-slate-400 text-[10px] font-bold uppercase mb-1">Staff Member</div>
                <div class="text-2xl font-black text-white">${user}</div>
            </div>
            <button onclick="this.parentElement.remove()" class="w-full bg-${colorClass}-600 text-white font-black py-4 rounded-xl text-xs uppercase transition-active active:scale-95">Confirm & Close</button>
        `;

        container.prepend(alertDiv);

        // 오디오 재생 (사용자 상호작용 후 가능)
        try {
            const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
            audio.volume = 0.5;
            audio.play().catch(e => debugLog("오디오 자동재생 차단됨 (정상)"));
        } catch(e){}
    }

    function startRealtimeWatch() {
        if (isWatching) return;
        isWatching = true;
        debugLog("감시 시작...");

        const attendRef = db.ref('attendance');

        // 1. 페이지 로드 시 '현재' 저장된 모든 키를 Set에 등록 (무시용)
        attendRef.once('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                Object.keys(data).forEach(date => {
                    Object.keys(data[date]).forEach(name => {
                        const r = data[date][name];
                        if (r.attend) processedKeys.add(`${date}_${name}_attend_${r.attend}`);
                        if (r.leave) processedKeys.add(`${date}_${name}_leave_${r.leave}`);
                    });
                });
            }
            isInitialLoad = false;
            debugLog("초기 데이터 로드 완료. 이제부터 발생하는 업데이트만 팝업됩니다.");
        });

        // 2. 핵심 로직: child_added와 child_changed 통합 관리
        const syncLogic = (snapshot) => {
            if (isInitialLoad) return;
            
            const date = snapshot.key;
            const staffData = snapshot.val();
            if (!staffData) return;

            debugLog(`데이터 변화 감지 (${date})`);

            Object.keys(staffData).forEach(name => {
                const r = staffData[name];
                
                // 출근 처리
                if (r.attend) {
                    const atKey = `${date}_${name}_attend_${r.attend}`;
                    if (!processedKeys.has(atKey)) {
                        debugLog(`새 출근 포착: ${name}`);
                        processedKeys.add(atKey);
                        showRealtimeAttendancePopup(name, "출근", r.attend, date);
                    }
                }
                
                // 퇴근 처리
                if (r.leave) {
                    const lvKey = `${date}_${name}_leave_${r.leave}`;
                    if (!processedKeys.has(lvKey)) {
                        debugLog(`새 퇴근 포착: ${name}`);
                        processedKeys.add(lvKey);
                        showRealtimeAttendancePopup(name, "퇴근", r.leave, date);
                    }
                }
            });
        };

        // 감시 리스너 연결
        attendRef.on('child_added', syncLogic);
        attendRef.on('child_changed', syncLogic);
    }

    // 초기화
    window.addEventListener('load', () => {
        startRealtimeWatch();
        switchAdminTab('dashboard');
    });

    // 탭 전환 (기존 로직 최적화)
    async function switchAdminTab(tab) {
        debugLog(`탭 전환: ${tab}`);
        document.querySelectorAll('.tab-btn').forEach(b => {
            b.classList.remove('tab-active'); b.classList.add('tab-inactive');
        });
        const activeBtn = document.getElementById(`btn-${tab}`);
        if (activeBtn) activeBtn.classList.add('tab-active');

        const fileMap = { 
            'dashboard': 'admin_dashboard.html', 'attendance': 'admin_attendance.html', 
            'statistic': 'admin_statistic.html', 'reports': 'admin_report.html', 
            'schedule': 'admin_calendar.html', 'settings': 'admin_setting.html' 
        };

        try {
            const response = await fetch(fileMap[tab]);
            const html = await response.text();
            document.getElementById('adminContent').innerHTML = html;
            
            // 삽입된 HTML 내 스크립트 실행
            const scripts = document.getElementById('adminContent').querySelectorAll('script');
            scripts.forEach(oldScript => {
                const newScript = document.createElement('script');
                Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                oldScript.parentNode.replaceChild(newScript, oldScript);
            });
        } catch (e) { debugLog("탭 전환 에러", e); }
    }
</script>

<script src="https://cdn.tailwindcss.com"></script>

</body>
</html>
