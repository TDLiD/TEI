<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant - GROQ</title>
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Pretendard', sans-serif; background: #000; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(51, 65, 85, 0.5);
        }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.4s ease-out forwards; }
        
        /* Textarea 스타일 최적화 */
        #userInput {
            min-height: 48px;
            max-height: 150px;
        }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md glass-panel rounded-[32px] shadow-2xl overflow-hidden animate-fadeIn">
        <div class="p-6 border-b border-slate-800/50 bg-slate-900/30 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-1.5 h-6 bg-purple-500 rounded-full"></div>
                <h1 class="text-lg font-black text-white uppercase tracking-widest">Groq AI Chat</h1>
            </div>
            <div id="statusDot" class="w-2.5 h-2.5 bg-rose-500 rounded-full shadow-[0_0_8px_rgba(244,63,94,0.6)]"></div>
        </div>

        <div id="chatBox" class="h-[450px] overflow-y-auto p-6 space-y-5 text-[13px] scrollbar-hide flex flex-col bg-black/20">
            <div id="initialMsg" class="bg-slate-800/40 p-4 rounded-2xl rounded-tl-none border border-slate-700/50 max-w-[85%] text-slate-400 italic">
                Checking system connection...
            </div>
        </div>

        <div class="p-5 bg-slate-900/40 border-t border-slate-800/50">
            <div class="flex gap-2 items-end">
                <textarea id="userInput" 
                    class="flex-1 bg-slate-950/50 border border-slate-700/50 rounded-2xl px-5 py-3 outline-none focus:border-purple-500 transition text-sm text-white placeholder-slate-500 resize-none scrollbar-hide" 
                    rows="1"
                    placeholder="Type your message..."
                    oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'"></textarea>
                <button onclick="window.askAI()" id="sendBtn" 
                    class="bg-purple-600 hover:bg-purple-500 text-white font-black px-6 py-3.5 rounded-2xl transition active:scale-95 disabled:opacity-50 uppercase text-[11px] tracking-widest shadow-lg shadow-purple-500/20">
                    Ask
                </button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            if (window.groqInited) return; 
            
            window.groqApiKey = ""; 
            window.isAILoading = false;

            window.initAI = function() {
                const database = (window.db) ? window.db : firebase.database();

                database.ref('settings/config/LLMAPIkey').on('value', (snap) => {
                    const key = snap.val();
                    if (key) {
                        window.groqApiKey = key;
                        const dot = document.getElementById('statusDot');
                        if(dot) dot.className = 'w-2.5 h-2.5 bg-emerald-500 rounded-full shadow-[0_0_10px_#10b981]';
                        const msg = document.getElementById('initialMsg');
                        if(msg) {
                            msg.innerText = "Connected! You can now ask questions.";
                            msg.classList.remove('italic');
                            msg.classList.add('text-slate-300');
                        }
                    }
                });
            };

            window.askAI = async function() {
                const inputField = document.getElementById('userInput');
                const question = inputField.value.trim();
                
                if (!question || window.isAILoading || !window.groqApiKey) return;

                addChatMsg(question, 'user');
                
                // Reset Input
                inputField.value = '';
                inputField.style.height = ''; 
                
                window.isAILoading = true;
                const sendBtn = document.getElementById('sendBtn');
                sendBtn.disabled = true;
                sendBtn.innerText = "...";

                try {
                    const weatherRes = await fetch("https://api.open-meteo.com/v1/forecast?latitude=-6.2088&longitude=106.8456&current_weather=true");
                    const weatherData = await weatherRes.json();
                    const weather = weatherData.current_weather ? weatherData.current_weather.temperature + "°C" : "Unknown";

                    const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                        method: "POST",
                        headers: {
                            "Authorization": `Bearer ${window.groqApiKey}`,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            model: "llama-3.3-70b-versatile", 
                            messages: [
                                { role: "system", content: `You are a professional assistant. The current temperature in Jakarta is ${weather}. Please respond in English.` },
                                { role: "user", content: question }
                            ],
                            temperature: 0.7,
                            max_tokens: 1024
                        })
                    });

                    const data = await response.json();
                    if (response.ok) {
                        addChatMsg(data.choices[0].message.content, 'ai');
                    } else {
                        addChatMsg(`Error: ${data.error.message}`, 'ai');
                    }
                } catch (err) {
                    addChatMsg("Network connection error.", 'ai');
                } finally {
                    window.isAILoading = false;
                    sendBtn.disabled = false;
                    sendBtn.innerText = "Ask";
                }
            };

            function addChatMsg(text, sender) {
                const chatBox = document.getElementById('chatBox');
                if(!chatBox) return;
                const msgDiv = document.createElement('div');
                msgDiv.className = sender === 'user' 
                    ? "ml-auto bg-purple-600 text-white p-4 rounded-2xl rounded-tr-none max-w-[85%] mb-2 animate-fadeIn whitespace-pre-wrap"
                    : "bg-slate-800/60 text-slate-200 p-4 rounded-2xl rounded-tl-none border border-slate-700/50 max-w-[85%] mb-2 animate-fadeIn whitespace-pre-wrap";
                
                msgDiv.innerText = text;
                chatBox.appendChild(msgDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            }

            // Keyboard Event: Enter for send, Shift+Enter for new line
            const input = document.getElementById('userInput');
            if(input) {
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        window.askAI();
                    }
                });
            }

            window.groqInited = true;
            initAI();
        })();
    </script>
</body>
</html>
