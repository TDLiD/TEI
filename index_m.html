<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Login - Daily Report System</title>

    <script src="https://cdn.tailwindcss.com?hide-warnings=true"></script>

    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-database-compat.js"></script>

<script>
    (function(){
        // 모바일 기기 체크
        const isMobileDevice = /iPhone|iPod|Android|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        // URL 파라미터 체크 (억지로 PC모드로 보려는 경우 방지)
        const urlParams = new URLSearchParams(window.location.search);
        const isPCMode = urlParams.get('view_mode') === 'pc';

        if (isMobileDevice && !isPCMode) {
            let path = window.location.pathname;
            let page = path.split("/").pop();
            // index.html이거나 경로만 있는 경우 index_m.html로 리다이렉트
            if (page === "" || page === "index.html") {
                window.location.href = "index_m.html";
            }
        }
    })();
</script>

    
<style>
:root{--bg:#03060f;--surface:rgba(8,18,36,0.7);--blue:#3b82f6;--cyan:#06b6d4}
* {-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;box-sizing:border-box}
body{font-family:"Pretendard",sans-serif;color:#f1f5f9;-webkit-tap-highlight-color:transparent;margin:0;overflow-x:hidden;background-color:var(--bg);
opacity:0;perspective:1500px;min-height:100vh;min-height:-webkit-fill-available}
body.loaded{opacity:1;transition:opacity .8s cubic-bezier(.16,1,.3,1)}

/* ── 3D TDLiD Background ── */
#tdlid-3d {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(8rem, 25vw, 20rem);
    font-weight: 900;
    letter-spacing: 0.1em;
    color: transparent;
    z-index: -1;
    pointer-events: none;
    text-transform: uppercase;
    user-select: none;
    will-change: transform;
}

#tdlid-3d span {
    display: inline-block;
    background: linear-gradient(135deg, 
        rgba(59, 130, 246, 0.08) 0%, 
        rgba(6, 182, 212, 0.12) 50%, 
        rgba(59, 130, 246, 0.08) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 
        0 0 40px rgba(59, 130, 246, 0.15),
        0 0 80px rgba(6, 182, 212, 0.1);
    animation: float3d 8s ease-in-out infinite;
    transform-style: preserve-3d;
}

#tdlid-3d span:nth-child(1) { animation-delay: 0s; }
#tdlid-3d span:nth-child(2) { animation-delay: 0.2s; }
#tdlid-3d span:nth-child(3) { animation-delay: 0.4s; }
#tdlid-3d span:nth-child(4) { animation-delay: 0.6s; }
#tdlid-3d span:nth-child(5) { animation-delay: 0.8s; }

@keyframes float3d {
    0%, 100% {
        transform: translateZ(0px) rotateY(0deg) translateY(0px);
        opacity: 0.5;
    }
    25% {
        transform: translateZ(30px) rotateY(5deg) translateY(-10px);
        opacity: 0.7;
    }
    50% {
        transform: translateZ(0px) rotateY(0deg) translateY(-20px);
        opacity: 0.9;
    }
    75% {
        transform: translateZ(-30px) rotateY(-5deg) translateY(-10px);
        opacity: 0.7;
    }
}

.video-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at center,transparent 0%,rgba(3,6,15,.5) 40%,rgba(3,6,15,.85) 100%);z-index:-1;animation:overlayPulse 10s ease-in-out infinite}
@keyframes overlayPulse{0%,100%{opacity:1}50%{opacity:.85}}

.particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-2;opacity:.3}

.logo-container{animation:float 6s ease-in-out infinite;transform-style:preserve-3d}
@keyframes float{0%,100%{transform:translateY(0px) translateZ(0px) rotateX(0deg)}50%{transform:translateY(-15px) translateZ(20px) rotateX(5deg)}}

.logo-glow{position:absolute;inset:-2px;background:linear-gradient(135deg,rgba(59,130,246,.4),rgba(6,182,212,.4));border-radius:50%;filter:blur(20px);opacity:0;transition:opacity .6s ease;animation:pulse 3s ease-in-out infinite}
.logo-container:hover .logo-glow{opacity:1}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.1);opacity:.9}}

.login-card{background:linear-gradient(135deg,rgba(8,18,36,.9) 0%,rgba(8,18,36,.7) 100%);backdrop-filter:blur(30px) saturate(200%);border:1.5px solid rgba(255,255,255,.15);box-shadow:0 40px 80px -20px rgba(0,0,0,.7),0 15px 35px -10px rgba(0,0,0,.5),inset 0 2px 1px rgba(255,255,255,.15),inset 0 -2px 1px rgba(0,0,0,.3),0 0 80px rgba(59,130,246,.2);transition:all .3s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d;position:relative;will-change:transform}

.login-card::before{content:'';position:absolute;top:-2px;left:-2px;right:-2px;bottom:-2px;background:linear-gradient(135deg,rgba(59,130,246,.3) 0%,rgba(6,182,212,.3) 50%,rgba(59,130,246,.3) 100%);border-radius:inherit;z-index:-1;opacity:0;transition:opacity .5s ease;filter:blur(15px)}
.login-card:hover::before{opacity:1;animation:borderGlow 3s ease-in-out infinite}
@keyframes borderGlow{0%,100%{opacity:.5}50%{opacity:1}}

.card-layer-1{transform:translateZ(30px);transition:transform .3s ease}
.card-layer-2{transform:translateZ(20px);transition:transform .3s ease}
.card-layer-3{transform:translateZ(50px);transition:transform .3s ease}

/* ── Enhanced Staff Member Selector ── */
#staff-selector-container {
    position: relative;
}

#selected-staff {
    background: linear-gradient(135deg, rgba(15,23,42,.8) 0%, rgba(15,23,42,.6) 100%);
    backdrop-filter: blur(15px);
    color: #fff;
    border: 1.5px solid rgba(255,255,255,.1);
    transition: all .4s cubic-bezier(.4,0,.2,1);
    box-shadow: inset 0 2px 4px rgba(0,0,0,.3), 0 4px 8px rgba(0,0,0,.2);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.25rem;
    border-radius: 1rem;
    font-size: 1rem;
    min-height: 3.5rem;
}

#selected-staff:hover {
    border-color: rgba(6,182,212,0.5);
    box-shadow: 0 0 0 3px rgba(6,182,212,.1), 0 8px 20px rgba(6,182,212,.2);
}

#selected-staff.active {
    border-color: var(--cyan);
    box-shadow: 0 0 0 3px rgba(6,182,212,.2), 0 8px 20px rgba(6,182,212,.3);
    background: linear-gradient(135deg, rgba(15,23,42,.95) 0%, rgba(15,23,42,.85) 100%);
}

#staff-dropdown {
    position: absolute;
    top: calc(100% + 0.5rem);
    left: 0;
    right: 0;
    max-height: 0;
    overflow: hidden;
    background: linear-gradient(135deg, rgba(15,23,42,.95) 0%, rgba(15,23,42,.9) 100%);
    backdrop-filter: blur(20px);
    border: 1.5px solid rgba(255,255,255,.1);
    border-radius: 1rem;
    box-shadow: 0 20px 40px rgba(0,0,0,.5);
    transition: all .4s cubic-bezier(.4,0,.2,1);
    opacity: 0;
    transform: translateY(-10px);
    z-index: 100;
}

#staff-dropdown.active {
    max-height: 320px;
    opacity: 1;
    transform: translateY(0);
    overflow-y: auto;
}

.staff-option {
    padding: 0.875rem 1.25rem;
    cursor: pointer;
    transition: all .2s ease;
    border-bottom: 1px solid rgba(255,255,255,.05);
    display: flex;
    align-items: center;
    gap: 0.75rem;
}

.staff-option:last-child {
    border-bottom: none;
}

.staff-option:hover {
    background: linear-gradient(90deg, rgba(6,182,212,.15) 0%, rgba(59,130,246,.1) 100%);
    padding-left: 1.5rem;
}

.staff-option.selected {
    background: linear-gradient(90deg, rgba(6,182,212,.25) 0%, rgba(59,130,246,.2) 100%);
}

.staff-avatar {
    width: 2rem;
    height: 2rem;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--blue), var(--cyan));
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.875rem;
    flex-shrink: 0;
}

.staff-name {
    flex: 1;
    font-weight: 500;
}

.staff-role {
    font-size: 0.75rem;
    color: #94a3b8;
    background: rgba(255,255,255,.05);
    padding: 0.25rem 0.5rem;
    border-radius: 0.375rem;
}

.dropdown-arrow {
    transition: transform .3s ease;
}

.dropdown-arrow.rotated {
    transform: rotate(180deg);
}

/* Scrollbar for dropdown */
#staff-dropdown::-webkit-scrollbar {
    width: 6px;
}

#staff-dropdown::-webkit-scrollbar-track {
    background: rgba(15,23,42,.3);
    border-radius: 1rem;
}

#staff-dropdown::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, var(--blue), var(--cyan));
    border-radius: 1rem;
}

input{background:linear-gradient(135deg,rgba(15,23,42,.8) 0%,rgba(15,23,42,.6) 100%)!important;backdrop-filter:blur(15px)!important;color:#fff!important;border:1.5px solid rgba(255,255,255,.1)!important;font-size:16px!important;transition:all .4s cubic-bezier(.4,0,.2,1)!important;box-shadow:inset 0 2px 4px rgba(0,0,0,.3),0 4px 8px rgba(0,0,0,.2)!important;transform-style:preserve-3d!important}

input:focus{border-color:var(--cyan)!important;box-shadow:0 0 0 3px rgba(6,182,212,.2),0 8px 20px rgba(6,182,212,.3),inset 0 2px 4px rgba(0,0,0,.2)!important;background:linear-gradient(135deg,rgba(15,23,42,.95) 0%,rgba(15,23,42,.85) 100%)!important;transform:translateZ(15px) scale(1.01)!important}

label{transform-style:preserve-3d;transition:all .3s ease}
.group:focus-within label{transform:translateZ(10px) translateY(-2px);text-shadow:0 2px 8px rgba(6,182,212,.5)}

.gradient-text{background:linear-gradient(135deg,#fff 0%,#94a3b8 50%,#64748b 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-shadow:0 0 30px rgba(255,255,255,.3);animation:textShine 4s ease-in-out infinite}
@keyframes textShine{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

@keyframes fadeIn{from{opacity:0;transform:translateY(40px) translateZ(-80px) rotateX(10deg)}to{opacity:1;transform:translateY(0) translateZ(0) rotateX(0deg)}}
.animate-fadeIn{animation:fadeIn 1s cubic-bezier(.16,1,.3,1) forwards;opacity:0}

#loginBtn{background:linear-gradient(135deg,#3b82f6 0%,#06b6d4 50%,#3b82f6 100%);background-size:200% 200%;position:relative;overflow:hidden;transform-style:preserve-3d;box-shadow:0 10px 30px rgba(59,130,246,.4),0 5px 15px rgba(6,182,212,.3),inset 0 1px 0 rgba(255,255,255,.2);transition:all .4s cubic-bezier(.4,0,.2,1)}

#loginBtn:hover{background-position:100% 50%;box-shadow:0 15px 40px rgba(59,130,246,.6),0 8px 20px rgba(6,182,212,.5),inset 0 1px 0 rgba(255,255,255,.3);transform:translateZ(10px) translateY(-2px)}

#loginBtn:active{transform:translateZ(5px) translateY(0px) scale(.98)}

#loginBtn::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(45deg,transparent 30%,rgba(255,255,255,.3) 50%,transparent 70%);transform:rotate(45deg);transition:.6s}
#loginBtn:hover::before{left:100%}

#loginBtn::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at center,rgba(255,255,255,.2) 0%,transparent 70%);opacity:0;transition:opacity .3s ease}
#loginBtn:active::after{opacity:1}

.forgot-btn{position:relative;overflow:hidden}
.forgot-btn::before{content:'';position:absolute;bottom:0;left:0;width:0;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);transition:width .4s ease}
.forgot-btn:hover::before{width:100%}

/* ── Responsive ── */
@media (max-width:640px){
    body{perspective:1000px}
    .login-card{max-width:100%;margin:0 16px}
    .gradient-text{font-size:2rem;line-height:1.2}
    #tdlid-3d {font-size:8rem}
    .staff-option {padding: 0.75rem 1rem;}
    .staff-avatar {width: 1.75rem; height: 1.75rem; font-size: 0.75rem;}
}

@media (min-width:641px) and (max-width:1024px){
    body{perspective:1200px}
    #tdlid-3d {font-size:12rem}
}

@media (min-width:1025px){
    body{perspective:1500px}
    .login-card:hover{box-shadow:0 50px 100px -25px rgba(0,0,0,.8),0 20px 45px -15px rgba(0,0,0,.6),inset 0 2px 1px rgba(255,255,255,.2),inset 0 -2px 1px rgba(0,0,0,.4),0 0 100px rgba(59,130,246,.3)}
    #tdlid-3d {font-size:20rem}
}

@media (hover:none){
    #loginBtn:active{transform:scale(.97)}
    .login-card{box-shadow:0 30px 60px -15px rgba(0,0,0,.6),0 10px 25px -8px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.1),0 0 60px rgba(59,130,246,.15)}
}

*:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:rgba(15,23,42,.3)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--blue),var(--cyan));border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,var(--cyan),var(--blue))}

/* ── Noise grain ── */
body::before{content:'';position:fixed;inset:0;z-index:1;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");opacity:0.025;pointer-events:none}

/* ── Optimized Star field ── */
#bg-stars{position:fixed;width:100%;height:100%;top:0;left:0;z-index:0;transform-style:preserve-3d;pointer-events:none;will-change:transform}
.star-dot{position:absolute;width:1.5px;height:1.5px;background:white;border-radius:50%;opacity:0.2;will-change:transform}

/* ── Energy rings ── */
.energy-ring{position:fixed;border-radius:50%;border:1px solid transparent;pointer-events:none;z-index:0;animation:ring-pulse 4s ease-in-out infinite;will-change:transform, opacity}
.energy-ring:nth-child(1){width:520px;height:520px;top:50%;left:50%;transform:translate(-50%,-50%) rotateX(72deg);border-color:rgba(59,130,246,0.12);animation-delay:0s}
.energy-ring:nth-child(2){width:780px;height:780px;top:50%;left:50%;transform:translate(-50%,-50%) rotateX(72deg);border-color:rgba(6,182,212,0.07);animation-delay:-1.5s}
.energy-ring:nth-child(3){width:1060px;height:1060px;top:50%;left:50%;transform:translate(-50%,-50%) rotateX(72deg);border-color:rgba(59,130,246,0.04);animation-delay:-3s}
@keyframes ring-pulse{0%,100%{opacity:0.4;transform:translate(-50%,-50%) rotateX(72deg) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) rotateX(72deg) scale(1.03)}}

/* ── Scan beam ── */
.scan-beam{position:fixed;left:0;right:0;height:1px;z-index:0;background:linear-gradient(90deg,transparent 0%,#06b6d4 50%,transparent 100%);opacity:0.2;animation:scan-v 10s ease-in-out infinite;pointer-events:none;will-change:top}
@keyframes scan-v{0%{top:100%;opacity:0}5%{opacity:0.2}95%{opacity:0.1}100%{top:-2%;opacity:0}}

#bg-image-overlay {
    position: fixed;
    inset: 0;
    z-index: -3;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    transition: opacity 1s ease-in-out;
}

/* ── Loading animation ── */
.loading-text {
    position: relative;
    color: #64748b;
}

.loading-text::after {
    content: '...';
    position: absolute;
    animation: dots 1.5s steps(4, end) infinite;
}

@keyframes dots {
    0%, 20% { content: '.'; }
    40% { content: '..'; }
    60%, 100% { content: '...'; }
}
/* 등장 애니메이션: 소용돌이치며 확대 */
@keyframes spiralIn {
    0% { transform: scale(0) rotate(-720deg); opacity: 0; filter: blur(20px); }
    100% { transform: scale(1) rotate(0deg); opacity: 1; filter: blur(0px); }
}

/* 퇴장 애니메이션: 안개처럼 흐릿하게 소멸 */
@keyframes mistyOut {
    0% { transform: scale(1); opacity: 1; filter: blur(0px); }
    100% { transform: scale(1.1); opacity: 0; filter: blur(20px); }
}

.animate-spiral-in {
    animation: spiralIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

.animate-misty-out {
    animation: mistyOut 0.8s ease-in forwards;
}
/* ── Horrifying Ghost Profile Image Effect ── */
#ghost-overlay {
    animation: fadeInOverlay 0.3s ease-out forwards;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.8) 100%);
}

#ghost-overlay.hidden {
    display: none !important;
}

#ghost-image {
    animation: horrorGhostAppear 3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    box-shadow: 
        0 0 80px rgba(139, 0, 139, 0.9),
        0 0 120px rgba(75, 0, 130, 0.7),
        0 0 160px rgba(30, 144, 255, 0.5),
        inset 0 0 50px rgba(255, 255, 255, 0.2),
        0 0 200px rgba(255, 0, 0, 0.3);
    border: 4px solid rgba(139, 0, 139, 0.8);
    filter: grayscale(80%) contrast(1.2);
    position: relative;
}

/* 귀신 아우라 효과 */
#ghost-image::before {
    content: '';
    position: absolute;
    inset: -20px;
    background: radial-gradient(circle, 
        rgba(139, 0, 139, 0.4) 0%, 
        rgba(75, 0, 130, 0.2) 40%,
        transparent 70%);
    border-radius: 50%;
    filter: blur(15px);
    animation: auraPulse 2s ease-in-out infinite;
    z-index: -1;
}

@keyframes fadeInOverlay {
    from {
        opacity: 0;
        backdrop-filter: blur(0px);
    }
    to {
        opacity: 1;
        backdrop-filter: blur(8px) brightness(0.7);
    }
}

@keyframes horrorGhostAppear {
    /* 첫 번째 단계: 먼 곳에서 무섭게 나타남 */
    0% {
        opacity: 0;
        transform: scale(0.1) translateY(80px) rotateX(-90deg) rotateZ(-30deg);
        filter: blur(40px) brightness(0.3);
        text-shadow: 0 0 20px rgba(139, 0, 139, 0.5);
    }
    
    /* 두 번째 단계: 빠르게 떠오름 */
    15% {
        opacity: 0.4;
        transform: scale(0.4) translateY(40px) rotateX(-45deg) rotateZ(-15deg);
        filter: blur(30px) brightness(0.5);
        text-shadow: 0 0 40px rgba(139, 0, 139, 0.7);
    }
    
    /* 세 번째 단계: 가까워지면서 무서워짐 */
    35% {
        opacity: 0.7;
        transform: scale(0.8) translateY(10px) rotateX(-20deg) rotateZ(-5deg);
        filter: blur(15px) brightness(0.7);
        text-shadow: 0 0 60px rgba(255, 0, 0, 0.6);
    }
    
    /* 네 번째 단계: 완전히 나타남 - 가장 무서운 순간 */
    50% {
        opacity: 1;
        transform: scale(1.1) translateY(-10px) rotateX(-5deg) rotateZ(0deg);
        filter: brightness(1.2) contrast(1.5) grayscale(80%);
        text-shadow: 0 0 80px rgba(139, 0, 139, 0.9);
    }
    
    /* 다섯 번째 단계: 떨림 효과 */
    55% {
        transform: scale(1.05) translateY(-15px) rotateX(2deg) rotateZ(2deg);
    }
    
    60% {
        transform: scale(1.08) translateY(-12px) rotateX(-2deg) rotateZ(-2deg);
        filter: brightness(1.3) contrast(1.6) grayscale(70%);
    }
    
    /* 여섯 번째 단계: 유지 */
    65% {
        opacity: 1;
        transform: scale(1.1) translateY(-10px) rotateX(0deg) rotateZ(0deg);
        filter: brightness(1.2) contrast(1.5) grayscale(80%);
        box-shadow: 
            0 0 80px rgba(139, 0, 139, 0.9),
            0 0 120px rgba(75, 0, 130, 0.7),
            0 0 160px rgba(30, 144, 255, 0.5),
            inset 0 0 50px rgba(255, 255, 255, 0.2),
            0 0 200px rgba(255, 0, 0, 0.4);
    }
    
    /* 일곱 번째 단계: 깜박임 효과 */
    72% {
        opacity: 0.3;
        filter: brightness(0.5) contrast(1.2) grayscale(100%);
        text-shadow: 0 0 40px rgba(139, 0, 139, 0.5);
    }
    
    75% {
        opacity: 1;
        filter: brightness(1.3) contrast(1.7) grayscale(75%);
    }
    
    /* 여덟 번째 단계: 사라짐 */
    85% {
        opacity: 0.5;
        transform: scale(1.2) translateY(-30px) rotateX(30deg) rotateZ(10deg);
        filter: blur(20px) brightness(0.4);
        text-shadow: 0 0 40px rgba(139, 0, 139, 0.3);
    }
    
    100% {
        opacity: 0;

<script>
(function() {
    'use strict';

    // ── Performance optimization: Reduce animation on low-end devices ──
    const isLowEndDevice = /Android|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) && 
                           window.devicePixelRatio < 2;
    
    if (isLowEndDevice) {
        document.body.style.perspective = '800px';
    }

    // ── 날짜 기반 배경 이미지 설정 ──
    (function setBgImage() {
        const totalImages = 10;
        const day = new Date().getDate();
        const imgIndex = ((day - 1) % totalImages) + 1;
        const fileName = `image-${String(imgIndex).padStart(3, '0')}.gif`;
        const imgPath = `images/gif/cats/${fileName}`;

        const bgEl = document.createElement('div');
        bgEl.id = 'bg-image-overlay';
        bgEl.style.backgroundImage = `url('${imgPath}')`;
        bgEl.style.opacity = '0.18';
        document.body.prepend(bgEl);
    })();

    // ── 3D Tilt Effect (데스크톱에서만 활성화) ──
    const card = document.getElementById('tilt-card');
    if (window.matchMedia('(hover: hover) and (min-width: 1025px)').matches) {
        let rafId = null;
        let currentRotateX = 0;
        let currentRotateY = 0;
        let targetRotateX = 0;
        let targetRotateY = 0;

        const lerp = (start, end, factor) => start + (end - start) * factor;

        const animate = () => {
            currentRotateX = lerp(currentRotateX, targetRotateX, 0.1);
            currentRotateY = lerp(currentRotateY, targetRotateY, 0.1);
            
            card.style.transform = `
                perspective(1500px) 
                rotateX(${currentRotateX}deg) 
                rotateY(${currentRotateY}deg)
                translateZ(0)
            `;
            
            rafId = requestAnimationFrame(animate);
        };

        document.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            targetRotateX = ((y - centerY) / centerY) * 8;
            targetRotateY = ((centerX - x) / centerX) * 8;
        });

        document.addEventListener('mouseleave', () => {
            targetRotateX = 0;
            targetRotateY = 0;
        });

        animate();
    }

    // ── 페이지 로드 완료 ──
    window.addEventListener('DOMContentLoaded', () => {
        document.body.classList.add('loaded');
    });

    // ── Firebase 설정 ──
    const firebaseConfig = { databaseURL: "https://tdlid-dailyreport-default-rtdb.firebaseio.com" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // ── Staff Selector Variables ──
    let staffData = {};
    let selectedStaff = '';
    const selectedStaffEl = document.getElementById('selected-staff');
    const selectedTextEl = document.getElementById('selected-text');
    const staffDropdown = document.getElementById('staff-dropdown');
    const dropdownArrow = selectedStaffEl.querySelector('.dropdown-arrow');
    const passwordInput = document.getElementById('password');

// 생일 체크 및 팝업 로직
(function() {
    const popup = document.getElementById('birthday-popup');
    const content = document.getElementById('popup-content');
    const timerDisplay = document.getElementById('timer-seconds');
    let autoCloseTimer;
    let countdownInterval;

    // [함수] 팝업 닫기: 애니메이션 실행 후 hidden 처리
    window.closePopup = () => {
        clearTimeout(autoCloseTimer);
        clearInterval(countdownInterval);
        
        content.classList.remove('animate-spiral-in');
        content.classList.add('animate-misty-out');
        
        setTimeout(() => {
            popup.classList.add('hidden');
            content.classList.remove('animate-misty-out');
        }, 800); // 0.8초 애니메이션 완료 후 제거
    };

    const checkTodayBirthdays = () => {
        const now = new Date();
        const todayMD = `${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        
        firebase.database().ref('users').once('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            const winners = [];
            Object.keys(data).forEach(name => {
                if (data[name].birthday && data[name].birthday.slice(5, 10) === todayMD) {
                    winners.push({ name: name, date: data[name].birthday });
                }
            });

            if (winners.length > 0) {
                // 상세 정보(메시지 + 이름 + 날짜) 렌더링
                document.getElementById('birthday-list').innerHTML = winners.map(s => `
                    <div class="p-4 bg-white/5 border border-blue-500/10 rounded-2xl">
                        <div class="text-sm text-blue-300 mb-2">I sincerely congratulate you on your special day!<br>
Have a happier day than anyone else.!</div>
                        <div class="text-2xl text-white font-black">${s.name}</div>
                        <div class="text-[10px] text-slate-500 mt-2 italic">Born on ${s.date}</div>
                    </div>
                `).join('');
                
                // 팝업 노출 및 등장 애니메이션
                popup.classList.remove('hidden');
                content.classList.add('animate-spiral-in');

                // 카운트다운 및 자동 닫기 타이머 시작
                let timeLeft = 10;
                timerDisplay.innerText = timeLeft;
                
                countdownInterval = setInterval(() => {
                    timeLeft -= 1;
                    timerDisplay.innerText = timeLeft;
                    if (timeLeft <= 0) clearInterval(countdownInterval);
                }, 1000);

                autoCloseTimer = setTimeout(closePopup, 10000);
            }
        });
    };

    // 초기 로드 1초 후 실행
    setTimeout(checkTodayBirthdays, 1000);
})();


    // ── Enhanced Staff Member Selector ──
    function initStaffSelector() {
        database.ref('users').limitToFirst(50).once('value', (snapshot) => {
            const users = snapshot.val();
            staffData = users || {};
            
            if (Object.keys(staffData).length === 0) {
                selectedTextEl.textContent = 'No staff available';
                selectedTextEl.classList.remove('loading-text');
                return;
            }

            selectedTextEl.textContent = 'Select Identity';
            selectedTextEl.classList.remove('loading-text');
            renderStaffDropdown();
        }).catch(err => {
            console.error('Error loading staff:', err);
            selectedTextEl.textContent = 'Error loading staff';
            selectedTextEl.classList.remove('loading-text');
        });
    }

    function renderStaffDropdown() {
        const fragment = document.createDocumentFragment();
        
        Object.keys(staffData).forEach(name => {
            const user = staffData[name];
            const option = document.createElement('div');
            option.className = 'staff-option';
            option.dataset.name = name;
            
            const avatar = document.createElement('div');
            avatar.className = 'staff-avatar';
            avatar.textContent = name.charAt(0).toUpperCase();
            
            const nameEl = document.createElement('div');
            nameEl.className = 'staff-name';
            nameEl.textContent = name;
            
            option.appendChild(avatar);
            option.appendChild(nameEl);
            
            if (user.role === 'admin' || user.role === 'manager') {
                const roleEl = document.createElement('div');
                roleEl.className = 'staff-role';
                roleEl.textContent = 'Manager';
                option.appendChild(roleEl);
            }
            
            option.addEventListener('click', () => selectStaff(name, option));
            
            fragment.appendChild(option);
        });
        
        staffDropdown.appendChild(fragment);
    }

    function selectStaff(name, optionEl) {
        selectedStaff = name;
        selectedTextEl.textContent = name;
        
        // Update selected state
        staffDropdown.querySelectorAll('.staff-option').forEach(opt => {
            opt.classList.remove('selected');
        });
        if (optionEl) {
            optionEl.classList.add('selected');
        }
        
        closeDropdown();
        passwordInput.focus();
    }

    function toggleDropdown() {
        const isActive = staffDropdown.classList.contains('active');
        
        if (isActive) {
            closeDropdown();
        } else {
            openDropdown();
        }
    }

    function openDropdown() {
        staffDropdown.classList.add('active');
        selectedStaffEl.classList.add('active');
        dropdownArrow.classList.add('rotated');
    }

    function closeDropdown() {
        staffDropdown.classList.remove('active');
        selectedStaffEl.classList.remove('active');
        dropdownArrow.classList.remove('rotated');
    }

    // Event listeners for staff selector
    selectedStaffEl.addEventListener('click', toggleDropdown);
    
    selectedStaffEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            toggleDropdown();
        }
    });

    // Close dropdown when clicking outside
    document.addEventListener('click', (e) => {
        if (!document.getElementById('staff-selector-container').contains(e.target)) {
            closeDropdown();
        }
    });

    // Initialize staff selector
    initStaffSelector();

    // ── Enter 키 이벤트 ──
    passwordInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { 
            e.preventDefault(); 
            handleLogin(); 
        }
    });

    // ── 로그인 처리 ──
window.handleLogin = function() {
    const name = selectedStaff;
    const pw = passwordInput.value;
    
    if(!name || !pw) {
        return alert("Please enter your credentials.");
    }
    
    database.ref('users/' + name).once('value', (snapshot) => {
        const userData = snapshot.val();
        if (!userData) {
            return alert("User not found.");
        }
        
        if (userData.password === pw) {
            sessionStorage.setItem('loggedInUser', name);
            sessionStorage.setItem('userRole', userData.role);
            firebase.database().ref('users/' + name).update({
                lastLogin: new Date().toISOString()
            });
            
            // Ghost 프로필 이미지 효과
            showGhostEffect(userData.profileImg, name, userData.role);
            
        } else { 
            alert("Incorrect password."); 
        }
    });
};

// Ghost 효과 표시 함수 (호러 버전)
function showGhostEffect(profileImg, name, role) {
    const ghostOverlay = document.getElementById('ghost-overlay');
    const ghostImage = document.getElementById('ghost-image');
    
    // 프로필 이미지 경로 설정 (중복 제거)
    let imagePath;
    
    if (profileImg) {
        // 이미 경로가 포함되어 있으면 그대로 사용, 아니면 경로 추가
        if (profileImg.startsWith('images/') || profileImg.startsWith('http')) {
            imagePath = profileImg;
        } else {
            imagePath = `images/profile/${profileImg}`;
        }
    } else {
        // 프로필 이미지가 없으면 기본 아바타 사용
        imagePath = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(name) + '&background=3b82f6&color=fff&size=256';
    }
    
    ghostImage.src = imagePath;
    
    // 호러 음향 효과 (선택사항)
    playHorrorSound();
    
    // Ghost 효과 시작
    ghostOverlay.classList.remove('hidden');
    ghostOverlay.classList.add('active');
    
    // 배경 화면 깜빡임 효과
    document.body.style.animation = 'screenFlicker 3s ease-in-out';
    
// 3초 후 페이지 이동
setTimeout(() => {
    ghostOverlay.classList.add('hidden');
    ghostOverlay.classList.remove('active');
    document.body.style.animation = 'none';
    
    // 역할에 따라 페이지 이동
    const userRole = (role || '').toLowerCase();
    if (userRole === 'admin' || userRole === 'manager') {
        location.href = "admin.html";
    } else {
        // [수정된 부분] 날짜 판별 로직 추가
        const today = new Date().getDate(); // 오늘 일자 (1~31)
        if (today % 2 !== 0) {
            // 홀수 날짜
            location.href = "staff_main_1.html";
        } else {
            // 짝수 날짜
            location.href = "staff_main_2.html";
        }
    }
}, 3000);
}

// 호러 음향 효과 (선택사항)
function playHorrorSound() {
    try {
        // Web Audio API를 사용한 으스스한 음향 생성
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        
        // 으스스한 저주파 사운드
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(80, audioContext.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(20, audioContext.currentTime + 0.5);
        
        gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
        
        oscillator.start(audioContext.currentTime);
        oscillator.stop(audioContext.currentTime + 0.5);
    } catch (err) {
        console.log('Sound effect skipped:', err);
    }
}

    // ── 비밀번호 보이기/숨기기 토글 ──

            `;
        } else {

                <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            `;

    };

    // ── 비밀번호 찾기 ──
    window.findPassword = function() {
        const name = selectedStaff;
        
        if (!name) {
            return alert("Please select your name from the list first.");
        }
        
        if (confirm(`Request password hint for '${name}'?`)) {
            database.ref('users/' + name).once('value', (snapshot) => {
                const userData = snapshot.val();
                if (userData && userData.password) {
                    const pw = userData.password;
                    const hint = pw.length > 2 ? pw.substring(0, 2) + "*".repeat(pw.length - 2) : pw;
                    alert(`[Security Hint]\n\nPassword starts with: ${hint}\n\nContact manager for full recovery.`);
                } else { 
                    alert("Data not found."); 
                }
            });
        }
    };

    // ── Optimized Star field (reduced count for performance) ──
    (function initStars() {
        const container = document.getElementById('bg-stars');
        if (!container) return;
        
        const starCount = isLowEndDevice ? 60 : 100;
        const fragment = document.createDocumentFragment();
        
        for (let i = 0; i < starCount; i++) {
            const d = document.createElement('div');
            d.className = 'star-dot';
            d.style.left = `${Math.random() * 100}%`;
            d.style.top = `${Math.random() * 100}%`;
            d.style.opacity = (Math.random() * 0.3 + 0.1).toFixed(2);
            d.style.transform = `translateZ(${Math.random() * 400 - 200}px)`;
            fragment.appendChild(d);
        }
        
        container.appendChild(fragment);
    })();

    // ── 3D TDLiD Text Parallax Effect ──
    if (!isLowEndDevice) {
        const tdlidEl = document.getElementById('tdlid-3d');
        let mouseMoveRaf = null;
        
        document.addEventListener('mousemove', (e) => {
            if (mouseMoveRaf) return;
            
            mouseMoveRaf = requestAnimationFrame(() => {
                const xPercent = (e.clientX / window.innerWidth - 0.5) * 20;
                const yPercent = (e.clientY / window.innerHeight - 0.5) * 20;
                
                tdlidEl.style.transform = `
                    translate(-50%, -50%) 
                    rotateY(${xPercent}deg) 
                    rotateX(${-yPercent}deg)
                `;
                
                mouseMoveRaf = null;
            });
        });
    }

})();
</script>

</body>
</html>
