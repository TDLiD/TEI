<div class="space-y-8 animate-fadeIn">
    <div class="bg-slate-900/50 p-6 rounded-3xl border border-slate-800 shadow-2xl backdrop-blur-sm">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-black text-white flex items-center gap-2">
                <span class="text-blue-500">■</span> RECENT ATTENDANCE
            </h2>
            <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest bg-slate-800/50 px-2 py-1 rounded-md">Last 5 Days</div>
        </div>
        <div id="recent_att_container" class="grid grid-cols-2 md:grid-cols-5 gap-4"></div>
    </div>

<div class="mt-6 pt-4 border-t border-slate-800/50">
            <div class="flex flex-wrap gap-y-2 gap-x-4">
                <div class="flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                    <span class="text-[9px] font-bold text-slate-400 uppercase tracking-tighter">ATT: Normal</span>
                </div>
                <div class="flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span>
                    <span class="text-[9px] font-bold text-slate-400 uppercase tracking-tighter">LATE: Late Arrival</span>
                </div>
                <div class="flex items-center gap-1.5 text-[9px] font-bold text-slate-500">
                    <span class="bg-slate-800 px-1.5 py-0.5 rounded text-amber-400/80">WO: Work Out</span>
                </div>
                <div class="flex items-center gap-1.5 text-[9px] font-bold text-slate-500">
                    <span class="bg-slate-800 px-1.5 py-0.5 rounded">PEL: Personal</span>
                </div>
                <div class="flex items-center gap-1.5 text-[9px] font-bold text-slate-500">
                    <span class="bg-slate-800 px-1.5 py-0.5 rounded">ANL: Annual</span>
                </div>
                <div class="flex items-center gap-1.5 text-[9px] font-bold text-slate-500">
                    <span class="bg-slate-800 px-1.5 py-0.5 rounded">HAL: Half Day</span>
                </div>
                <div class="flex items-center gap-1.5 text-[9px] font-bold text-slate-500">
                    <span class="bg-slate-800 px-1.5 py-0.5 rounded">SIL: Sick</span>
                </div>
                <div class="flex items-center gap-1.5 text-[9px] font-bold text-slate-500">
                    <span class="bg-slate-800 px-1.5 py-0.5 rounded">SPL: Special</span>
                </div>
            </div>
        </div>

    <div class="bg-slate-900/50 p-6 rounded-3xl border border-slate-800 shadow-2xl backdrop-blur-sm">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-black text-white flex items-center gap-2">
                <span class="text-emerald-500">■</span> RECENT WORK REPORTS
            </h2>
            <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest bg-slate-800/50 px-2 py-1 rounded-md">Last 5 Days Summary</div>
        </div>
        <div id="recent_work_container" class="grid grid-cols-2 md:grid-cols-5 gap-4"></div>
    </div>

    <div class="bg-slate-900/50 p-6 rounded-3xl border border-slate-800 shadow-2xl backdrop-blur-sm">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-black text-white flex items-center gap-2">
                <span class="text-purple-500">■</span> RECENT SCHEDULE
            </h2>
            <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest bg-slate-800/50 px-2 py-1 rounded-md">Upcoming & Current</div>
        </div>
        <div id="recent_sch_container" class="grid grid-cols-2 md:grid-cols-5 gap-4"></div>
    </div>
</div>

<div id="customAdminModal" class="fixed inset-0 z-[9999] hidden flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-md transition-opacity" onclick="window.closeAdminCustomModal()"></div>
    
    <div class="relative bg-slate-900 w-full max-w-md rounded-[32px] border border-slate-700 shadow-2xl overflow-hidden transform transition-all animate-in zoom-in duration-200">
        <div id="modalHeaderArea" class="p-6 pb-4 border-b border-slate-800/50 bg-gradient-to-br from-slate-800/50 to-transparent"></div>
        
        <div id="modalBodyArea" class="p-6 max-h-[60vh] overflow-y-auto"></div>
        
        <div class="p-6 pt-0">
            <button onclick="window.closeAdminCustomModal()" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-black py-4 rounded-2xl transition-all active:scale-95 text-sm tracking-widest uppercase border border-slate-700">
                Close
            </button>
        </div>
    </div>
</div>

<script>
(function() {
    const db = firebase.database();
    const today = new Date();
    const last5Days = [];
    for(let i=0; i<5; i++) {
        const d = new Date();
        d.setDate(today.getDate() - i);
        last5Days.push(d.toLocaleDateString('sv-SE'));
    }

    // --- 커스텀 모달 제어 함수 ---
    window.openAdminCustomModal = function(titleHtml, bodyHtml) {
        document.getElementById('modalHeaderArea').innerHTML = titleHtml;
        document.getElementById('modalBodyArea').innerHTML = bodyHtml;
        document.getElementById('customAdminModal').classList.remove('hidden');
        document.body.style.overflow = 'hidden';
    };

    window.closeAdminCustomModal = function() {
        document.getElementById('customAdminModal').classList.add('hidden');
        document.body.style.overflow = '';
    };

    // --- 개선된 상세 보기 (adminMemo 포함) ---
  // --- 개선된 상세 보기 (admin_report.html과 동일한 관리/수정 기능 연결) ---
  // --- 개선된 상세 보기 (CANCEL 버튼 포함) ---
    window.showWorkDetail = function(name, date, status, contentEncoded, memoEncoded) {
        db.ref(`reports/${date}/${name}`).once("value", snap => {
            const r = snap.val() || {};
            
            const titleHtml = `
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-emerald-500/20 flex items-center justify-center text-emerald-500 font-black text-xs border border-emerald-500/20">${name.charAt(0)}</div>
                    <div>
                        <div class="text-[11px] text-slate-500 font-bold uppercase tracking-tighter">${date}</div>
                        <div class="text-lg font-black text-white leading-tight">${name}'s Report</div>
                    </div>
                </div>`;

            const bodyHtml = `
                <div class="space-y-4 text-left">
                    <div>
                        <label class="text-[10px] text-blue-500 mb-1 block font-black uppercase tracking-widest">Status</label>
                        <select id="db_rp_status" class="w-full bg-slate-800 text-blue-400 p-3 rounded-xl border border-slate-700 font-bold text-sm focus:outline-none focus:border-blue-500">
                            <option ${r.status==='In Progress'?'selected':''}>In Progress</option>
                            <option ${r.status==='Completed'?'selected':''}>Completed</option>
                            <option ${r.status==='Pending'?'selected':''}>Pending</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-500 mb-1 block font-black uppercase tracking-widest">To-Do & Content</label>
                        <textarea id="db_rp_todo" class="w-full bg-slate-950 text-slate-300 p-3 rounded-xl border border-slate-800 text-sm h-24 resize-none focus:outline-none focus:border-slate-600">${r.todo || r.content || ''}</textarea>
                    </div>
                    <div>
                        <label class="text-[10px] text-emerald-500 mb-1 block font-black uppercase tracking-widest">Work Summary</label>
                        <textarea id="db_rp_summary" class="w-full bg-slate-950 text-slate-300 p-3 rounded-xl border border-slate-800 text-sm h-24 resize-none focus:outline-none focus:border-emerald-900">${r.summary || ''}</textarea>
                    </div>
                    <div>
                        <label class="text-[10px] text-amber-500 mb-1 block font-black uppercase tracking-widest">Admin Memo</label>
                        <textarea id="db_rp_memo" class="w-full bg-slate-950 text-amber-200/70 p-3 rounded-xl border border-amber-900/20 text-sm h-20 resize-none focus:outline-none focus:border-amber-700" placeholder="Private notes...">${r.adminMemo || ''}</textarea>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3 mt-6">
                        <button onclick="saveDashboardReport('${date}','${name}')" class="col-span-2 bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-2xl transition-all shadow-lg text-sm tracking-widest uppercase active:scale-95">
                            SAVE CHANGES
                        </button>
                        
                        <button onclick="window.closeAdminCustomModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 rounded-xl transition-all text-xs uppercase tracking-widest border border-slate-700 active:scale-95">
                            Cancel
                        </button>
                        <button onclick="deleteDashboardReport('${date}','${name}')" class="bg-rose-900/20 hover:bg-rose-600 text-rose-500 hover:text-white font-bold py-3 rounded-xl transition-all border border-rose-500/20 text-xs uppercase tracking-widest active:scale-95">
                            Delete
                        </button>
                    </div>
                </div>`;

            window.openAdminCustomModal(titleHtml, bodyHtml);
        });
    };

    // --- 대시보드 전용 저장/삭제 핸들러 ---
    window.saveDashboardReport = function(date, staff) {
        const updateData = {
            status: document.getElementById('db_rp_status').value,
            todo: document.getElementById('db_rp_todo').value,
            summary: document.getElementById('db_rp_summary').value,
            adminMemo: document.getElementById('db_rp_memo').value,
            lastModified: new Date().toISOString()
        };

        db.ref(`reports/${date}/${staff}`).update(updateData).then(() => {
            alert("Saved successfully");
            window.closeAdminCustomModal();
            // 대시보드 데이터 리로드
            if(window.renderRecentWork) window.renderRecentWork();
        });
    };

    window.deleteDashboardReport = function(date, staff) {
        if(confirm(`Are you sure you want to delete ${staff}'s report?`)) {
            db.ref(`reports/${date}/${staff}`).remove().then(() => {
                alert("Deleted successfully");
                window.closeAdminCustomModal();
                if(window.renderRecentWork) window.renderRecentWork();
            });
        }
    };



// --- 1. 출석 렌더링 (출근 ☀️ 및 퇴근 🌙 모두 표시 수정) ---
// --- 1. 출석 렌더링 (클릭 시 수정 기능 추가) ---
// --- 1. 출석 렌더링 (시간 형식 HH:mm으로 수정) ---
window.renderRecentAttendance = function() {
    const container = document.getElementById('recent_att_container');
    if(!container) return;

    // 시간을 HH:mm 형식으로 자르는 헬퍼 함수
    const formatTime = (timeStr) => {
        if(!timeStr) return "";
        // "ATT(08:30:15)" 또는 "17:05:22" 등에서 숫자:숫자 부분만 추출
        const match = timeStr.match(/\d{1,2}:\d{2}/);
        return match ? match[0] : timeStr;
    };

    db.ref('attendance').off();
    db.ref('attendance').on('value', snap => {
        const data = snap.val() || {};
        container.innerHTML = '';
        last5Days.forEach(dStr => {
            const dayData = data[dStr] || {};
            let staffHtml = '';
            
            Object.entries(dayData).forEach(([name, info]) => {
                let statusClass = "text-emerald-400";
                let attendanceHtml = '';
                const safeInfo = encodeURIComponent(JSON.stringify(info));

                if (typeof info === 'string') {
                    attendanceHtml = `<span class="text-amber-400 tracking-tighter">${info}</span>`;
                } else if (info && typeof info === 'object') {
                    // 시간 포맷팅 적용
                    const attVal = info.attend ? (info.attend.includes("LATE") ? "LATE " : "ATT ") + formatTime(info.attend) : "";
                    const leaVal = info.leave ? formatTime(info.leave) : "";
                    
                    if (info.attend && info.attend.includes("LATE")) statusClass = "text-red-400";

                    attendanceHtml = `
                        <div class="flex flex-col items-end gap-0.5">
                            <span class="${statusClass} tracking-tighter">☀️ ${attVal}</span>
                            ${leaVal ? `<span class="text-slate-400 tracking-tighter opacity-80">🌙 ${leaVal}</span>` : ''}
                        </div>`;
                }

                if (attendanceHtml) {
                    staffHtml += `
                    <div onclick="window.openEditAttendance('${name}', '${dStr}', '${safeInfo}')" 
                         class="flex justify-between items-start text-[10px] font-bold bg-slate-800/50 p-1.5 rounded mb-1 border border-slate-700/30 cursor-pointer hover:bg-slate-700 hover:border-blue-500/50 transition-all active:scale-95">
                        <span class="text-slate-300 mt-0.5">${name}</span>
                        ${attendanceHtml}
                    </div>`;
                }
            });

            container.innerHTML += `
                <div class="bg-slate-800/20 p-3 rounded-2xl border border-slate-800/50 hover:border-blue-500/30 transition-colors">
                    <div class="text-[10px] text-slate-500 mb-2 font-black">${dStr === last5Days[0] ? 'TODAY' : dStr}</div>
                    ${staffHtml || '<div class="text-[9px] text-slate-600 italic">No Data</div>'}
                </div>`;
        });
    });
};

// --- 출석 수정 모달 오픈 함수 (대시보드 통합용) ---
window.openEditAttendance = function(name, date, infoEncoded) {
    const info = JSON.parse(decodeURIComponent(infoEncoded));
    const isSpecial = typeof info === 'string';
    
    const currentAttend = isSpecial ? "" : (info.attend || "");
    const currentLeave = isSpecial ? "" : (info.leave || "");
    const currentSpecial = isSpecial ? info : "";

    const titleHtml = `
        <div class="flex flex-col">
            <span class="text-[10px] text-blue-500 font-black uppercase tracking-widest">Edit Attendance</span>
            <span class="text-lg font-black text-white">${name} <span class="text-slate-500 text-sm">(${date})</span></span>
        </div>`;

    const bodyHtml = `
        <div class="space-y-4 text-left">
            <div>
                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-2 ml-1">Standard Status</label>
                <div class="grid grid-cols-2 gap-3">
                    <div class="space-y-1">
                        <span class="text-[9px] text-slate-600 font-bold ml-1 uppercase">In</span>
                        <input type="text" id="editAttend" placeholder="ATT(8:00)" value="${currentAttend}" 
                               class="w-full bg-slate-800 text-white text-sm p-4 rounded-2xl border border-slate-700 outline-none focus:ring-2 focus:ring-emerald-500/50">
                    </div>
                    <div class="space-y-1">
                        <span class="text-[9px] text-slate-600 font-bold ml-1 uppercase">Out</span>
                        <input type="text" id="editLeave" placeholder="17:00:00" value="${currentLeave}" 
                               class="w-full bg-slate-800 text-white text-sm p-4 rounded-2xl border border-slate-700 outline-none focus:ring-2 focus:ring-blue-500/50">
                    </div>
                </div>
            </div>
            <div class="relative py-4">
                <div class="absolute inset-0 flex items-center"><span class="w-full border-t border-slate-800"></span></div>
                <div class="relative flex justify-center text-[10px] uppercase font-black text-slate-600"><span class="bg-slate-900 px-4">OR Special Status</span></div>
            </div>
            <div>
                <select id="editSpecial" class="w-full bg-slate-800 text-white text-sm p-4 rounded-2xl border border-slate-700 outline-none focus:ring-2 focus:ring-amber-500/50 cursor-pointer appearance-none">
                    <option value="" ${currentSpecial === "" ? "selected" : ""}>--- NO SPECIAL STATUS ---</option>
                    <option value="WO" ${currentSpecial === "WO" ? "selected" : ""}>WO (Work Out)</option>
                    <option value="PEL" ${currentSpecial === "PEL" ? "selected" : ""}>PEL (Personal Leave)</option>
                    <option value="ANL" ${currentSpecial === "ANL" ? "selected" : ""}>ANL (Annual Leave)</option>
                    <option value="SIL" ${currentSpecial === "SIL" ? "selected" : ""}>SIL (Sick Leave)</option>
                    <option value="OFF" ${currentSpecial === "OFF" ? "selected" : ""}>OFF (Day Off)</option>
                </select>
            </div>
            <div class="flex flex-col gap-2 pt-4">
                <button onclick="window.saveAttendanceEdit('${name}', '${date}')" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-2xl text-sm transition-all active:scale-95 shadow-lg shadow-blue-900/20 uppercase tracking-widest">Save Changes</button>
                
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="window.closeAdminCustomModal()" class="bg-slate-800 text-slate-500 font-bold py-3 rounded-xl text-xs hover:bg-slate-700 hover:text-slate-300 transition-all uppercase tracking-widest border border-slate-700">Cancel</button>
                    <button onclick="window.deleteAttendance('${name}', '${date}')" class="bg-rose-900/10 text-rose-500 font-bold py-3 rounded-xl text-xs hover:bg-rose-600 hover:text-white transition-all uppercase tracking-widest border border-rose-500/20">Delete</button>
                </div>
            </div>
        </div>`;

    window.openAdminCustomModal(titleHtml, bodyHtml);
};

// --- 출석 저장 핸들러 ---
window.saveAttendanceEdit = function(name, date) {
    const attend = document.getElementById('editAttend').value.trim();
    const leave = document.getElementById('editLeave').value.trim();
    const special = document.getElementById('editSpecial').value;
    let updateData = special ? special : { attend: attend, leave: leave };

    if(confirm(`Update record for ${name} on ${date}?`)) {
        db.ref(`attendance/${date}/${name}`).set(updateData).then(() => {
            alert("Updated successfully");
            window.closeAdminCustomModal();
        });
    }
};

// --- 출석 삭제 핸들러 ---
window.deleteAttendance = function(name, date) {
    if(confirm(`Delete ${name}'s record for ${date}?`)) {
        db.ref(`attendance/${date}/${name}`).remove().then(() => {
            alert("Deleted successfully");
            window.closeAdminCustomModal();
        });
    }
};



    // --- 2. 업무 보고 렌더링 (adminMemo 추출 포함) ---
    window.renderRecentWork = function() {
        const container = document.getElementById('recent_work_container');
        if(!container) return;
        db.ref('reports').off();
        db.ref('reports').on('value', snap => {
            const data = snap.val() || {};
            container.innerHTML = '';
            last5Days.forEach(dStr => {
                const dayData = data[dStr] || {};
                let reportHtml = '';
                Object.entries(dayData).forEach(([name, report]) => {
                    const statusColor = report.status === 'Completed' ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' : 
                                      (report.status === 'Pending' ? 'bg-amber-500/20 text-amber-400 border-amber-500/30' : 'bg-blue-500/20 text-blue-400 border-blue-500/30');
                    
                    const safeContent = encodeURIComponent(report.content || 'No content');
                    const safeMemo = encodeURIComponent(report.adminMemo || '');
                    
                    reportHtml += `
                        <div onclick="window.showWorkDetail('${name}', '${dStr}', '${report.status}', '${safeContent}', '${safeMemo}')" 
                             class="text-[9px] font-bold ${statusColor} border p-1.5 rounded mb-1 truncate cursor-pointer hover:scale-[1.02] active:scale-95 transition-all">
                            ${name}
                        </div>`;
                });
                container.innerHTML += `
                    <div class="bg-slate-800/20 p-3 rounded-2xl border border-slate-800/50 hover:border-emerald-500/30 transition-colors">
                        <div class="text-[10px] text-slate-500 mb-2 font-black">${dStr === last5Days[0] ? 'TODAY' : dStr}</div>
                        <div class="space-y-1">${reportHtml || '<div class="text-[9px] text-slate-600 italic">No Reports</div>'}</div>
                    </div>`;
            });
        });
    };

    // --- 3. 스케줄 렌더링 및 상세 보기 추가 ---
    window.renderRecentSchedule = function() {
        const container = document.getElementById('recent_sch_container');
        if(!container) return;
        db.ref('shared_schedules').off();
        db.ref('shared_schedules').on('value', snap => {
            const data = snap.val() || {};
            container.innerHTML = '';
            last5Days.forEach(dStr => {
                let schHtml = '';
                Object.entries(data).forEach(([id, ev]) => {
                    const startDate = ev.start ? ev.start.split('T')[0] : "";
                    const endDate = ev.end ? ev.end.split('T')[0] : "";
                    if (dStr >= startDate && dStr <= endDate) {
                        const author = ev.author || 'User';
                        schHtml += `
                            <div onclick="window.showSchDetail('${id}')" 
                                 class="text-[9px] font-bold bg-purple-500/20 text-purple-400 border border-purple-500/30 p-1.5 rounded mb-1 truncate cursor-pointer hover:scale-[1.02] active:scale-95 transition-all">
                                <span class="opacity-70">[${author}]</span> ${ev.title}
                            </div>`;
                    }
                });
                container.innerHTML += `
                    <div class="bg-slate-800/20 p-3 rounded-2xl border border-slate-800/50 hover:border-purple-500/30 transition-colors">
                        <div class="text-[10px] text-slate-500 mb-2 font-black">${dStr === last5Days[0] ? 'TODAY' : dStr}</div>
                        <div class="space-y-1">${schHtml || '<div class="text-[9px] text-slate-600 italic">Free</div>'}</div>
                    </div>`;
            });
        });
    };

    // --- 신규: 스케줄 상세 및 수정 모달 ---
    window.showSchDetail = function(scheduleId) {
        db.ref(`shared_schedules/${scheduleId}`).once("value", snap => {
            const ev = snap.val();
            if(!ev) return;

            const titleHtml = `
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-purple-500/20 flex items-center justify-center text-purple-500 font-black text-xs border border-purple-500/20">📅</div>
                    <div>
                        <div class="text-[11px] text-slate-500 font-bold uppercase tracking-tighter">Schedule Detail</div>
                        <div class="text-lg font-black text-white leading-tight">${ev.title}</div>
                    </div>
                </div>`;

            const bodyHtml = `
                <div class="space-y-4 text-left">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-[10px] text-slate-500 mb-1 block font-black uppercase tracking-widest">Start Date</label>
                            <input type="date" id="db_sch_start" value="${ev.start ? ev.start.split('T')[0] : ''}" class="w-full bg-slate-800 text-white p-3 rounded-xl border border-slate-700 text-sm focus:outline-none">
                        </div>
                        <div>
                            <label class="text-[10px] text-slate-500 mb-1 block font-black uppercase tracking-widest">End Date</label>
                            <input type="date" id="db_sch_end" value="${ev.end ? ev.end.split('T')[0] : ''}" class="w-full bg-slate-800 text-white p-3 rounded-xl border border-slate-700 text-sm focus:outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="text-[10px] text-purple-500 mb-1 block font-black uppercase tracking-widest">Event Title</label>
                        <input type="text" id="db_sch_title" value="${ev.title}" class="w-full bg-slate-950 text-slate-200 p-3 rounded-xl border border-slate-800 text-sm focus:outline-none focus:border-purple-600">
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-500 mb-1 block font-black uppercase tracking-widest">Description</label>
                        <textarea id="db_sch_desc" class="w-full bg-slate-950 text-slate-300 p-3 rounded-xl border border-slate-800 text-sm h-20 resize-none focus:outline-none focus:border-slate-600">${ev.desc || ev.description || ''}</textarea>
                    </div>
                    <div>
                        <label class="text-[10px] text-amber-500 mb-1 block font-black uppercase tracking-widest">Admin Memo</label>
                        <textarea id="db_sch_memo" class="w-full bg-slate-950 text-amber-200/70 p-3 rounded-xl border border-amber-900/20 text-sm h-16 resize-none focus:outline-none focus:border-amber-700" placeholder="Private notes...">${ev.adminMemo || ''}</textarea>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3 mt-6">
                        <button onclick="saveDashboardSchedule('${scheduleId}')" class="col-span-2 bg-purple-600 hover:bg-purple-500 text-white font-black py-4 rounded-2xl transition-all shadow-lg text-sm tracking-widest uppercase active:scale-95">
                            UPDATE SCHEDULE
                        </button>
                        <button onclick="window.closeAdminCustomModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 rounded-xl transition-all text-xs uppercase tracking-widest border border-slate-700 active:scale-95">
                            Cancel
                        </button>
                        <button onclick="deleteDashboardSchedule('${scheduleId}')" class="bg-rose-900/20 hover:bg-rose-600 text-rose-500 hover:text-white font-bold py-3 rounded-xl transition-all border border-rose-500/20 text-xs uppercase tracking-widest active:scale-95">
                            Delete
                        </button>
                    </div>
                </div>`;

            window.openAdminCustomModal(titleHtml, bodyHtml);
        });
    };

    window.saveDashboardSchedule = function(id) {
        const updateData = {
            title: document.getElementById('db_sch_title').value,
            start: document.getElementById('db_sch_start').value,
            end: document.getElementById('db_sch_end').value,
            desc: document.getElementById('db_sch_desc').value,
            adminMemo: document.getElementById('db_sch_memo').value,
            lastModified: new Date().toISOString()
        };

        db.ref(`shared_schedules/${id}`).update(updateData).then(() => {
            alert("Schedule updated");
            window.closeAdminCustomModal();
        });
    };

    window.deleteDashboardSchedule = function(id) {
        if(confirm("Are you sure you want to delete this schedule?")) {
            db.ref(`shared_schedules/${id}`).remove().then(() => {
                alert("Deleted successfully");
                window.closeAdminCustomModal();
            });
        }
    };

    window.initAdminDashboard = function() {
        window.renderRecentAttendance();
        window.renderRecentWork();
        window.renderRecentSchedule();
    };
})();
</script>
