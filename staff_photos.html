<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌌 TEI Staff Photos - Cyberpunk Gallery</title>
    <style>
        :root {
            --neon-cyan: #00FFF0;
            --neon-pink: #FF006E;
            --neon-purple: #B500FF;
            --neon-green: #39FF14;
            --neon-yellow: #FFFF00;
            --neon-orange: #FF6600;
            --bg-dark: #0a0e27;
            --bg-darker: #050811;
            --bg-card: rgba(10, 14, 39, 0.7);
            --surface: rgba(20, 24, 82, 0.5);
            --text-primary: #ffffff;
            --text-secondary: #a0b9ff;
            --text-muted: #5a6b8f;
            --gradient-neon: linear-gradient(135deg, #00FFF0 0%, #B500FF 50%, #FF006E 100%);
            --gradient-cyan-pink: linear-gradient(90deg, #00FFF0, #FF006E);
            --gradient-purple-cyan: linear-gradient(45deg, #B500FF, #00FFF0);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html {
            color-scheme: dark;
            background: var(--bg-darker);
        }

        body {
            font-family: 'Orbitron', 'Courier New', monospace;
            min-height: 100vh;
            background:
                radial-gradient(circle at 18% 12%, rgba(0, 255, 240, 0.08), transparent 28rem),
                radial-gradient(circle at 82% 8%, rgba(255, 0, 110, 0.07), transparent 24rem),
                linear-gradient(135deg, #03050d 0%, #090d24 45%, #040611 100%);
            color: var(--text-primary);
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            width: 200%; height: 200%;
            top: -50%; left: -50%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0, 255, 240, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(181, 0, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(255, 0, 110, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        body::after {
            content: '';
            position: fixed;
            width: 100%; height: 100%;
            top: 0; left: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 255, 240, 0.02),
                rgba(0, 255, 240, 0.02) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: -1;
            opacity: 0.7;
        }

        .header {
            padding: 60px 20px 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: var(--gradient-neon);
            opacity: 0.03;
            pointer-events: none;
        }

        .header-title {
            font-size: clamp(2rem, 8vw, 4.5rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            line-height: 1.1;
            margin-bottom: 15px;
            background: var(--gradient-neon);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 30px rgba(0, 255, 240, 0.3));
            position: relative;
            z-index: 1;
        }

        .header-subtitle {
            font-size: clamp(0.75rem, 2vw, 1.1rem);
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--neon-cyan);
            margin-bottom: 40px;
            font-weight: 300;
            text-shadow: 0 0 20px rgba(0, 255, 240, 0.5);
        }

        .filter-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 50px;
            position: relative;
            z-index: 2;
        }

        .filter-btn {
            padding: 12px 24px;
            border: 2px solid var(--neon-cyan);
            background: rgba(0, 255, 240, 0.05);
            color: var(--neon-cyan);
            text-transform: uppercase;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            font-family: 'Orbitron', monospace;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0, 255, 240, 0.1);
            white-space: nowrap;
        }

        .filter-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: var(--gradient-cyan-pink);
            transition: left 0.3s ease;
            z-index: -1;
        }

        .filter-btn:hover {
            color: #000;
            text-shadow: none;
            transform: translateY(-3px);
            box-shadow: 0 0 20px rgba(0, 255, 240, 0.4), 0 5px 15px rgba(0, 255, 240, 0.2);
        }

        .filter-btn:hover::before { left: 0; }

        .filter-btn-active {
            border-color: var(--neon-pink);
            background: var(--gradient-cyan-pink);
            color: #000;
            font-weight: 900;
            box-shadow: 0 0 30px rgba(255, 0, 110, 0.5), inset 0 0 20px rgba(0, 255, 240, 0.2);
        }

        /* Ray wedding 버튼 특별 스타일 */
        .filter-btn-wedding {
            border-color: #FFB6C1;
            background: rgba(255, 182, 193, 0.08);
            color: #FFB6C1;
            box-shadow: 0 0 10px rgba(255, 182, 193, 0.2);
        }

        .filter-btn-wedding::before {
            background: linear-gradient(90deg, #FFB6C1, #FF69B4);
        }

        .filter-btn-wedding:hover {
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.5), 0 5px 15px rgba(255, 182, 193, 0.3);
        }

        .filter-btn-wedding.filter-btn-active {
            border-color: #FF69B4;
            background: linear-gradient(90deg, #FFB6C1, #FF69B4);
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.6), inset 0 0 20px rgba(255, 182, 193, 0.3);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr));
            gap: clamp(12px, 2.4vw, 22px);
            width: min(1180px, 100%);
            margin: 0 auto;
            padding: 0 clamp(12px, 3vw, 24px) 64px;
            position: relative;
            z-index: 1;
            perspective: 1200px;
        }

        .photo-card {
            --day-accent: var(--neon-cyan);
            --day-accent-2: var(--neon-purple);
            --day-depth: rgba(0, 255, 240, 0.28);
            --day-tilt: rotateX(0deg) rotateY(0deg);
            aspect-ratio: 1;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            border-radius: 8px;
            border: 1px solid var(--day-accent);
            border-color: color-mix(in srgb, var(--day-accent) 58%, transparent);
            background:
                linear-gradient(145deg, rgba(255, 255, 255, 0.08), transparent 34%),
                linear-gradient(155deg, rgba(10, 14, 39, 0.94), rgba(2, 5, 17, 0.96));
            animation: cardEntrance 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
            box-shadow:
                0 16px 32px rgba(0, 0, 0, 0.45),
                8px 10px 0 -4px var(--day-depth),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            transform: translateZ(0) var(--day-tilt);
            transform-style: preserve-3d;
            transition: transform 0.24s ease, box-shadow 0.24s ease, border-color 0.24s ease;
            contain: layout paint style;
            content-visibility: auto;
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: scale(0.8) rotateZ(-5deg) translateY(30px); }
            to { opacity: 1; transform: scale(1) rotateZ(0deg) translateY(0); }
        }

        .photo-card:nth-child(1) { animation-delay: 0.05s; }
        .photo-card:nth-child(2) { animation-delay: 0.1s; }
        .photo-card:nth-child(3) { animation-delay: 0.15s; }
        .photo-card:nth-child(4) { animation-delay: 0.2s; }
        .photo-card:nth-child(5) { animation-delay: 0.25s; }
        .photo-card:nth-child(6) { animation-delay: 0.3s; }
        .photo-card:nth-child(7) { animation-delay: 0.35s; }
        .photo-card:nth-child(8) { animation-delay: 0.4s; }
        .photo-card:nth-child(9) { animation-delay: 0.45s; }
        .photo-card:nth-child(n+10) { animation-delay: 0.5s; }

        .photo-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--gradient-neon);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 2;
            pointer-events: none;
        }

        .photo-card:hover {
            border-color: var(--day-accent);
            box-shadow:
                0 22px 42px rgba(0, 0, 0, 0.55),
                12px 14px 0 -4px var(--day-depth),
                0 0 24px rgba(0, 255, 240, 0.18),
                0 0 24px color-mix(in srgb, var(--day-accent) 28%, transparent),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transform: translateY(-5px) rotateX(5deg) rotateY(-5deg);
        }

        .photo-card:hover::before { opacity: 0.14; }

        .photo-image {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.28s ease, filter 0.28s ease;
            filter: contrast(1.1) brightness(0.95);
            transform: translateZ(0);
        }

        .photo-card:hover .photo-image {
            transform: scale(1.06);
            filter: contrast(1.22) brightness(1.05);
        }

        .photo-badge {
            position: absolute;
            bottom: 8px; right: 8px;
            width: 40px; height: 40px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid var(--neon-cyan);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            z-index: 3;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 15px rgba(0, 255, 240, 0.4);
            transform: translateZ(28px);
        }

        .photo-card:hover .photo-badge {
            border-color: var(--neon-pink);
            box-shadow: 0 0 20px rgba(255, 0, 110, 0.6);
        }

        .photo-overlay-text {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.7);
            opacity: 0;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(5px);
            z-index: 2;
            font-size: clamp(0.7rem, 3vw, 0.9rem);
            text-align: center;
            padding: 10px;
            color: var(--neon-cyan);
        }

        .photo-card:hover .photo-overlay-text { opacity: 1; }

        .photo-day {
            position: absolute;
            top: 8px;
            left: 8px;
            z-index: 3;
            min-width: 34px;
            padding: 5px 8px;
            border: 1px solid var(--day-accent);
            border-color: color-mix(in srgb, var(--day-accent) 70%, transparent);
            border-radius: 4px;
            background: rgba(2, 5, 17, 0.72);
            color: var(--day-accent);
            font-size: 0.72rem;
            font-weight: 900;
            letter-spacing: 1px;
            text-align: center;
            text-shadow: 0 0 12px var(--day-accent);
            box-shadow: 0 0 18px rgba(0, 255, 240, 0.18);
            box-shadow: 0 0 18px color-mix(in srgb, var(--day-accent) 26%, transparent);
            transform: translateZ(30px);
        }

        .day-0 { --day-accent: #ff3b6b; --day-accent-2: #ff9f1c; --day-depth: rgba(255, 59, 107, 0.34); --day-tilt: rotateX(2deg) rotateY(-2deg); }
        .day-1 { --day-accent: #00fff0; --day-accent-2: #2d9cff; --day-depth: rgba(0, 255, 240, 0.30); --day-tilt: rotateX(-2deg) rotateY(2deg); }
        .day-2 { --day-accent: #39ff14; --day-accent-2: #00d084; --day-depth: rgba(57, 255, 20, 0.28); --day-tilt: rotateX(2deg) rotateY(2deg); }
        .day-3 { --day-accent: #ffff00; --day-accent-2: #ffb703; --day-depth: rgba(255, 255, 0, 0.26); --day-tilt: rotateX(-2deg) rotateY(-2deg); }
        .day-4 { --day-accent: #b500ff; --day-accent-2: #6d5dfc; --day-depth: rgba(181, 0, 255, 0.32); --day-tilt: rotateX(3deg) rotateY(-1deg); }
        .day-5 { --day-accent: #ff006e; --day-accent-2: #ff4fd8; --day-depth: rgba(255, 0, 110, 0.32); --day-tilt: rotateX(-1deg) rotateY(3deg); }
        .day-6 { --day-accent: #ff6600; --day-accent-2: #ffd166; --day-depth: rgba(255, 102, 0, 0.32); --day-tilt: rotateX(1deg) rotateY(-3deg); }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(5, 8, 17, 0.95);
            backdrop-filter: blur(20px);
            z-index: 5000;
            animation: modalFadeIn 0.4s ease-out;
            overflow: auto;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; backdrop-filter: blur(0px); }
            to { opacity: 1; backdrop-filter: blur(20px); }
        }

        .modal-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            animation: modalSlideUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes modalSlideUp {
            from { opacity: 0; transform: translateY(50px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal-image {
            width: 100%; height: 100%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 12px;
            border: 3px solid var(--neon-cyan);
            box-shadow: 
                0 0 40px rgba(0, 255, 240, 0.4),
                0 0 80px rgba(181, 0, 255, 0.2),
                inset 0 0 30px rgba(0, 255, 240, 0.1);
        }

        .modal-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px; height: 50px;
            background: rgba(0, 255, 240, 0.1);
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0, 255, 240, 0.2);
        }

        .modal-nav-btn:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 30px rgba(0, 255, 240, 0.6);
            transform: translateY(-50%) scale(1.1);
        }

        .modal-prev { left: -80px; }
        .modal-next { right: -80px; }

        .modal-close {
            position: absolute;
            top: 20px; right: 20px;
            width: 45px; height: 45px;
            background: rgba(255, 0, 110, 0.1);
            border: 2px solid var(--neon-pink);
            color: var(--neon-pink);
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
            box-shadow: 0 0 15px rgba(255, 0, 110, 0.2);
        }

        .modal-close:hover {
            background: var(--neon-pink);
            color: #000;
            box-shadow: 0 0 30px rgba(255, 0, 110, 0.6);
            transform: scale(1.15) rotate(90deg);
        }

        .modal-info {
            margin-top: 30px;
            padding: 20px;
            background: linear-gradient(135deg, rgba(0, 255, 240, 0.05), rgba(181, 0, 255, 0.05));
            border: 2px solid rgba(0, 255, 240, 0.2);
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }

        .modal-title {
            font-size: 1.8rem;
            font-weight: 900;
            text-transform: uppercase;
            background: var(--gradient-neon);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            letter-spacing: 2px;
        }

        .modal-meta {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .modal-date, .modal-category {
            font-size: 0.85rem;
            padding: 6px 14px;
            border-radius: 4px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .modal-date {
            background: rgba(0, 255, 240, 0.1);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
        }

        .modal-category {
            background: rgba(181, 0, 255, 0.1);
            border: 1px solid var(--neon-purple);
            color: var(--neon-purple);
        }

        .modal-counter {
            margin-left: auto;
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 700;
        }

        @media (max-width: 768px) {
            .header { padding: 40px 15px 30px; }
            .filter-container {
                justify-content: flex-start;
                overflow-x: auto;
                padding: 0 12px 10px;
                margin-bottom: 34px;
                scrollbar-width: thin;
            }
            .filter-btn { flex: 0 0 auto; }
            .gallery { grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 12px; padding: 0 12px 44px; }
            .modal-nav-btn { width: 40px; height: 40px; font-size: 1.2rem; }
            .modal-prev { left: 8px; }
            .modal-next { right: 8px; }
            .modal-content { max-width: 94vw; max-height: 88vh; }
            .modal-image { max-height: 68vh; }
            .modal-info { margin-top: 16px; padding: 14px; }
            .modal-title { font-size: 1.15rem; }
            .modal-meta { gap: 8px; }
            .modal-counter { width: 100%; margin-left: 0; }
        }

        @media (max-width: 480px) {
            .header-title { font-size: 1.8rem; }
            .header-subtitle { letter-spacing: 1.6px; margin-bottom: 28px; }
            .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 0 10px 34px; }
            .modal-nav-btn { width: 35px; height: 35px; font-size: 1rem; }
            .filter-container { gap: 8px; }
            .filter-btn { padding: 8px 16px; font-size: 0.65rem; }
            .photo-badge { width: 34px; height: 34px; font-size: 1.15rem; }
            .photo-day { font-size: 0.62rem; min-width: 30px; padding: 4px 6px; }
        }

        @media (hover: none) {
            .photo-card:active { transform: scale(0.98); }
            .modal-nav-btn { position: fixed; top: auto; bottom: 20px; }
            .modal-prev { left: 20px; transform: none; }
            .modal-next { right: 20px; transform: none; }
        }

        @media (prefers-reduced-motion: reduce), (max-width: 768px) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }

            .photo-card,
            .photo-image,
            .filter-btn,
            .modal-nav-btn,
            .modal-close {
                transition-duration: 0.16s;
            }

            body::before,
            body::after {
                opacity: 0.45;
            }
        }

        .loading-spinner {
            display: inline-block;
            width: 30px; height: 30px;
            border: 3px solid rgba(0, 255, 240, 0.3);
            border-top-color: var(--neon-cyan);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state {
            grid-column: 1 / -1;
            padding: 80px 20px;
            text-align: center;
        }

        .empty-state-text {
            font-size: 1.2rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
/* 메인 메뉴 버튼 스타일 */
.modal-home-btn {
    text-decoration: none;
    font-size: 0.85rem;
    padding: 6px 14px;
    border-radius: 4px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: rgba(57, 255, 20, 0.1); /* 네온 그린 배경 */
    border: 1px solid var(--neon-green);
    color: var(--neon-green);
    transition: all 0.3s ease;
    box-shadow: 0 0 10px rgba(57, 255, 20, 0.2);
}

.modal-home-btn:hover {
    background: var(--neon-green);
    color: #000;
    box-shadow: 0 0 20px rgba(57, 255, 20, 0.5);
    transform: translateY(-2px);
}

.modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(5, 8, 17, 0.95);
    backdrop-filter: blur(20px);
    z-index: 5000;
    animation: modalFadeIn 0.4s ease-out;
    overflow: hidden; /* 스크롤바 완전 제거 */
}

.modal-content {
    position: relative;
    max-width: min(80vw, calc(100vw - 180px)); /* 좌우 버튼(-80px)에 의한 가로 스크롤 방지 */
    max-height: 92vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    animation: modalSlideUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.modal-image {
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 62vh; /* 세로가 긴 브로셔 이미지도 하단 정보란과 함께 한 화면에 맞춤 */
    object-fit: contain;
    border-radius: 12px;
    border: 3px solid var(--neon-cyan);
    box-shadow: 
        0 0 40px rgba(0, 255, 240, 0.4),
        0 0 80px rgba(181, 0, 255, 0.2),
        inset 0 0 30px rgba(0, 255, 240, 0.1);
}

.modal-info {
    margin-top: 14px; /* 여백 축소 */
    padding: 12px 20px; /* 패딩 축소 */
    width: 100%;
    background: linear-gradient(135deg, rgba(0, 255, 240, 0.05), rgba(181, 0, 255, 0.05));
    border: 2px solid rgba(0, 255, 240, 0.2);
    border-radius: 8px;
    backdrop-filter: blur(10px);
}

    </style>
</head>
<body>
    <header class="header">
        <h1 class="header-title">🌌 Staff <span style="color: var(--neon-pink);">Photos</span></h1>
        <p class="header-subtitle">▸ Memories & Moments from Our Team ◂</p>
    </header>

    <div class="filter-container">
        <button class="filter-btn filter-btn-active" onclick="filterPhotos('all')">⚡ ALL</button>
        <button class="filter-btn" onclick="filterPhotos('work')">💼 WORK</button>
        <button class="filter-btn" onclick="filterPhotos('event')">🎉 EVENT</button>
        <button class="filter-btn" onclick="filterPhotos('team')">👥 TEAM</button>
        <button class="filter-btn" onclick="filterPhotos('staff')">🎭 STAFF</button>
        <button class="filter-btn" onclick="filterPhotos('Caricature')">✨ CARICATURE</button>
        <button class="filter-btn filter-btn-wedding" onclick="filterPhotos('Ray wedding')">💍 RAY WEDDING</button>
<button class="filter-btn" onclick="filterPhotos('Brochure')">📖 BROCHURE</button>
    </div>

    <div class="gallery" id="gallery"></div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div style="position: relative; display: inline-block; width: 100%;">
                <button class="modal-nav-btn modal-prev" onclick="previousPhoto()">◀</button>
                <img class="modal-image" id="modalImage" src="" alt="" />
                <button class="modal-nav-btn modal-next" onclick="nextPhoto()">▶</button>
            </div>
            <div class="modal-info">
                <div class="modal-title" id="modalTitle"></div>
                <div class="modal-meta">
                    <span class="modal-date" id="modalDate"></span>
                    <span class="modal-category" id="modalCategory"></span>
                    <span class="modal-counter" id="modalCounter"></span>
                </div>
            </div>
        </div>
    </div>

<script>
    (function () {
        const state = {
            allPhotos: [],
            filteredPhotos: [],
            currentFilter: 'all',
            currentIndex: 0,
            categoryIcons: {
                'work': '💼',
                'event': '🎉',
                'team': '👥',
                'staff': '🎭',
                'Caricature': '✨',
                'Ray wedding': '💍',
'Brochure': '📖'
            }
        };

        const dayLabels = ['일', '월', '화', '수', '목', '금', '토'];

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, (char) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        function parsePhotoDate(dateText) {
            const match = String(dateText || '').match(/(\d{4})[.\-/](\d{1,2})[.\-/](\d{1,2})/);
            if (!match) return null;
            const year = Number(match[1]);
            const month = Number(match[2]) - 1;
            const day = Number(match[3]);
            const parsed = new Date(year, month, day);
            return Number.isNaN(parsed.getTime()) ? null : parsed;
        }

        function withDayMeta(item, idx) {
            const parsedDate = parsePhotoDate(item[2]);
            const dayIndex = parsedDate ? parsedDate.getDay() : idx % 7;
            return {
                id: idx + 1,
                filename: item[0],
                title: item[1],
                date: item[2],
                category: item[3],
                dayIndex,
                dayLabel: dayLabels[dayIndex]
            };
        }

        const samplePhotos = [
            ['photo1.jpg', 'Team Meeting Moment', '2024.01.15', 'work'],
            ['photo2.jpg', 'Company Celebration', '2024.02.20', 'event'],
            ['photo3.jpg', 'Office Vibes', '2024.01.10', 'team'],
            ['photo4.jpg', 'Staff Portrait', '2024.03.05', 'staff'],
            ['photo5.jpg', 'Project Launch', '2024.02.28', 'work'],
            ['photo6.jpg', 'Team Outing', '2024.03.15', 'event'],
        ];

        // ── 필터 버튼 active 클래스 처리 ──
        // onclick 속성값에 작은따옴표가 포함되어 있어 이스케이프 필요
        function setActiveBtn(category) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('filter-btn-active');
            });
            document.querySelectorAll('.filter-btn').forEach(btn => {
                const attr = btn.getAttribute('onclick') || '';
                // filterPhotos('Ray wedding') 등 파싱
                const match = attr.match(/filterPhotos\('(.+?)'\)/);
                if (match && match[1] === category) {
                    btn.classList.add('filter-btn-active');
                }
            });
        }

        window.filterPhotos = function (category) {
            state.currentFilter = category;
            state.filteredPhotos = category === 'all'
                ? state.allPhotos
                : state.allPhotos.filter(p => p.category === category);

            setActiveBtn(category);
            renderGallery();
        };

window.openModal = function (index) {
    state.currentIndex = index;
    const photo = state.filteredPhotos[index];
    if (!photo) return;

    document.getElementById('modalImage').src = `images/TEI/${photo.filename}`;
    document.getElementById('modalTitle').innerText = photo.title;
    document.getElementById('modalDate').innerText = `📅 ${photo.date} · ${photo.dayLabel}요일`;
    document.getElementById('modalCategory').innerText = `🏷️ ${photo.category.toUpperCase()}`;

    // [수정된 부분] 카운터 숫자 옆에 메인 메뉴로 가는 버튼을 추가합니다.
    document.getElementById('modalCounter').innerHTML = `
        <span style="margin-right: 15px;">${index + 1} / ${state.filteredPhotos.length}</span>
        <a href="staff.html" class="modal-home-btn" style="text-decoration: none;">🏠 MAIN MENU</a>
    `;

    document.getElementById('modal').classList.add('active');
    document.body.style.overflow = 'hidden';
};

        window.closeModal = function () {
            document.getElementById('modal').classList.remove('active');
            document.body.style.overflow = 'auto';
        };

        window.previousPhoto = function () {
            if (state.currentIndex > 0) window.openModal(state.currentIndex - 1);
        };

        window.nextPhoto = function () {
            if (state.currentIndex < state.filteredPhotos.length - 1) window.openModal(state.currentIndex + 1);
        };

        function renderGallery() {
            const gallery = document.getElementById('gallery');
            if (!gallery) return;

            if (state.filteredPhotos.length === 0) {
                gallery.innerHTML = `
                    <div class="empty-state">
                        <div class="loading-spinner"></div>
                        <p class="empty-state-text">No photos found</p>
                    </div>`;
                return;
            }

            gallery.innerHTML = state.filteredPhotos.map((photo, idx) => {
                const categoryEmoji = state.categoryIcons[photo.category] || '📷';
                const safeTitle = escapeHtml(photo.title);
                const safeDayLabel = escapeHtml(photo.dayLabel);
                const safeFilename = escapeHtml(photo.filename);
                return `
                    <div class="photo-card day-${photo.dayIndex}" onclick="openModal(${idx})">
                        <img class="photo-image" src="images/TEI/${safeFilename}" alt="${safeTitle}" loading="lazy" decoding="async" />
                        <div class="photo-day">${safeDayLabel}</div>
                        <div class="photo-overlay-text">${safeTitle}</div>
                        <div class="photo-badge">${categoryEmoji}</div>
                    </div>`;
            }).join('');
        }

        function loadPhotos() {
            fetch('images/TEI/photos.json')
                .then(r => r.json())
                .then(data => {
                    state.allPhotos = data.map(withDayMeta);
                    window.filterPhotos('all');
                })
                .catch(err => {
                    console.warn('JSON load failed, using sample data:', err);
                    state.allPhotos = samplePhotos.map(withDayMeta);
                    window.filterPhotos('all');
                });
        }

        document.addEventListener('keydown', (e) => {
            const modal = document.getElementById('modal');
            if (!modal || !modal.classList.contains('active')) return;
            if (e.key === 'ArrowLeft') window.previousPhoto();
            if (e.key === 'ArrowRight') window.nextPhoto();
            if (e.key === 'Escape') window.closeModal();
        });

        const modalOverlay = document.getElementById('modal');
        if (modalOverlay) {
            modalOverlay.addEventListener('click', (e) => {
                if (e.target.id === 'modal') window.closeModal();
            });

            let touchStart = 0;
            modalOverlay.addEventListener('touchstart', (e) => {
                touchStart = e.changedTouches[0].screenX;
            }, { passive: true });

            modalOverlay.addEventListener('touchend', (e) => {
                const touchEnd = e.changedTouches[0].screenX;
                const diff = touchStart - touchEnd;
                if (Math.abs(diff) > 50) {
                    if (diff > 0) window.nextPhoto();
                    else window.previousPhoto();
                }
            }, { passive: true });
        }

        loadPhotos();
    })();
</script>
</body>
</html>
