<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌌 TEI Staff Photos - Cyberpunk Gallery</title>
    <style>
        /* ============================================
           SF 네온 사이버펑크 디자인 시스템
           ============================================ */
        
        :root {
            /* 네온 컬러 팔레트 */
            --neon-cyan: #00FFF0;
            --neon-pink: #FF006E;
            --neon-purple: #B500FF;
            --neon-green: #39FF14;
            --neon-yellow: #FFFF00;
            --neon-orange: #FF6600;
            
            /* 배경 및 기본 */
            --bg-dark: #0a0e27;
            --bg-darker: #050811;
            --bg-card: rgba(10, 14, 39, 0.7);
            --surface: rgba(20, 24, 82, 0.5);
            
            /* 텍스트 */
            --text-primary: #ffffff;
            --text-secondary: #a0b9ff;
            --text-muted: #5a6b8f;
            
            /* 그라데이션 */
            --gradient-neon: linear-gradient(135deg, #00FFF0 0%, #B500FF 50%, #FF006E 100%);
            --gradient-cyan-pink: linear-gradient(90deg, #00FFF0, #FF006E);
            --gradient-purple-cyan: linear-gradient(45deg, #B500FF, #00FFF0);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Orbitron', 'Courier New', monospace;
            background: var(--bg-darker);
            color: var(--text-primary);
            overflow-x: hidden;
            position: relative;
        }

        /* 배경 애니메이션 */
        body::before {
            content: '';
            position: fixed;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0, 255, 240, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(181, 0, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(255, 0, 110, 0.03) 0%, transparent 50%);
            animation: backgroundShift 20s ease-in-out infinite;
            pointer-events: none;
            z-index: -1;
        }

        @keyframes backgroundShift {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(50px, 50px); }
        }

        /* 스캔라인 효과 */
        body::after {
            content: '';
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: 
                repeating-linear-gradient(
                    0deg,
                    rgba(0, 255, 240, 0.02),
                    rgba(0, 255, 240, 0.02) 1px,
                    transparent 1px,
                    transparent 2px
                );
            pointer-events: none;
            z-index: -1;
            animation: scanlines 8s linear infinite;
        }

        @keyframes scanlines {
            0% { transform: translateY(0); }
            100% { transform: translateY(10px); }
        }

        /* ============================================
           헤더 섹션
           ============================================ */

        .header {
            padding: 60px 20px 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: var(--gradient-neon);
            opacity: 0.03;
            animation: rotate 20s linear infinite;
            pointer-events: none;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .header-title {
            font-size: clamp(2rem, 8vw, 4.5rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            line-height: 1.1;
            margin-bottom: 15px;
            background: var(--gradient-neon);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 30px rgba(0, 255, 240, 0.3));
            animation: titleGlow 3s ease-in-out infinite;
            position: relative;
            z-index: 1;
        }

        @keyframes titleGlow {
            0%, 100% { 
                filter: drop-shadow(0 0 30px rgba(0, 255, 240, 0.3)) drop-shadow(0 0 10px rgba(181, 0, 255, 0.2));
            }
            50% { 
                filter: drop-shadow(0 0 50px rgba(0, 255, 240, 0.5)) drop-shadow(0 0 20px rgba(181, 0, 255, 0.4));
            }
        }

        .header-subtitle {
            font-size: clamp(0.75rem, 2vw, 1.1rem);
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--neon-cyan);
            margin-bottom: 40px;
            font-weight: 300;
            text-shadow: 0 0 20px rgba(0, 255, 240, 0.5);
            animation: subtitleFloat 4s ease-in-out infinite;
        }

        @keyframes subtitleFloat {
            0%, 100% { transform: translateY(0px); opacity: 0.8; }
            50% { transform: translateY(-5px); opacity: 1; }
        }

        /* ============================================
           필터 버튼
           ============================================ */

        .filter-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 50px;
            position: relative;
            z-index: 2;
        }

        .filter-btn {
            padding: 12px 24px;
            border: 2px solid var(--neon-cyan);
            background: rgba(0, 255, 240, 0.05);
            color: var(--neon-cyan);
            text-transform: uppercase;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            font-family: 'Orbitron', monospace;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0, 255, 240, 0.1);
            white-space: nowrap;
        }

        .filter-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--gradient-cyan-pink);
            transition: left 0.3s ease;
            z-index: -1;
        }

        .filter-btn:hover {
            color: #000;
            text-shadow: none;
            transform: translateY(-3px);
            box-shadow: 0 0 20px rgba(0, 255, 240, 0.4), 0 5px 15px rgba(0, 255, 240, 0.2);
        }

        .filter-btn:hover::before {
            left: 0;
        }

        .filter-btn-active {
            border-color: var(--neon-pink);
            background: var(--gradient-cyan-pink);
            color: #000;
            font-weight: 900;
            box-shadow: 0 0 30px rgba(255, 0, 110, 0.5), inset 0 0 20px rgba(0, 255, 240, 0.2);
        }

        /* ============================================
           갤러리 그리드
           ============================================ */

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(clamp(130px, 20vw, 250px), 1fr));
            gap: clamp(12px, 3vw, 24px);
            padding: 0 20px 60px;
            position: relative;
            z-index: 1;
        }

        /* ============================================
           사진 카드
           ============================================ */

        .photo-card {
            aspect-ratio: 1;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            border-radius: 8px;
            border: 2px solid rgba(0, 255, 240, 0.2);
            background: var(--bg-card);
            animation: cardEntrance 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
            group: view;
        }

        @keyframes cardEntrance {
            from {
                opacity: 0;
                transform: scale(0.8) rotateZ(-5deg) translateY(30px);
            }
            to {
                opacity: 1;
                transform: scale(1) rotateZ(0deg) translateY(0);
            }
        }

        .photo-card:nth-child(1) { animation-delay: 0.05s; }
        .photo-card:nth-child(2) { animation-delay: 0.1s; }
        .photo-card:nth-child(3) { animation-delay: 0.15s; }
        .photo-card:nth-child(4) { animation-delay: 0.2s; }
        .photo-card:nth-child(5) { animation-delay: 0.25s; }
        .photo-card:nth-child(6) { animation-delay: 0.3s; }
        .photo-card:nth-child(7) { animation-delay: 0.35s; }
        .photo-card:nth-child(8) { animation-delay: 0.4s; }
        .photo-card:nth-child(9) { animation-delay: 0.45s; }
        .photo-card:nth-child(n+10) { animation-delay: 0.5s; }

        .photo-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--gradient-neon);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 2;
            pointer-events: none;
        }

        .photo-card:hover::before {
            opacity: 0.15;
        }

        .photo-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: contrast(1.1) brightness(0.95);
        }

        .photo-card:hover .photo-image {
            transform: scale(1.12) rotate(1deg);
            filter: contrast(1.3) brightness(1.1) drop-shadow(0 0 10px rgba(0, 255, 240, 0.3));
        }

        /* 아이콘 배지 */
        .photo-badge {
            position: absolute;
            bottom: 8px;
            right: 8px;
            width: 40px;
            height: 40px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid var(--neon-cyan);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            z-index: 3;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 15px rgba(0, 255, 240, 0.4);
            animation: badgePulse 2s ease-in-out infinite;
        }

        @keyframes badgePulse {
            0%, 100% { box-shadow: 0 0 15px rgba(0, 255, 240, 0.4); }
            50% { box-shadow: 0 0 25px rgba(0, 255, 240, 0.7); }
        }

        .photo-card:hover .photo-badge {
            border-color: var(--neon-pink);
            box-shadow: 0 0 20px rgba(255, 0, 110, 0.6);
        }

        /* 오버레이 텍스트 */
        .photo-overlay-text {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.7);
            opacity: 0;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(5px);
            z-index: 2;
            font-size: clamp(0.7rem, 3vw, 0.9rem);
            text-align: center;
            padding: 10px;
            color: var(--neon-cyan);
        }

        .photo-card:hover .photo-overlay-text {
            opacity: 1;
        }

        /* ============================================
           모달 / 라이트박스
           ============================================ */

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 8, 17, 0.95);
            backdrop-filter: blur(20px);
            z-index: 5000;
            animation: modalFadeIn 0.4s ease-out;
            overflow: auto;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                backdrop-filter: blur(0px);
            }
            to {
                opacity: 1;
                backdrop-filter: blur(20px);
            }
        }

        .modal-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            animation: modalSlideUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes modalSlideUp {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-image {
            width: 100%;
            height: 100%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 12px;
            border: 3px solid var(--neon-cyan);
            box-shadow: 
                0 0 40px rgba(0, 255, 240, 0.4),
                0 0 80px rgba(181, 0, 255, 0.2),
                inset 0 0 30px rgba(0, 255, 240, 0.1);
        }

        /* 네비게이션 버튼 */
        .modal-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background: rgba(0, 255, 240, 0.1);
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0, 255, 240, 0.2);
        }

        .modal-nav-btn:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 30px rgba(0, 255, 240, 0.6);
            transform: translateY(-50%) scale(1.1);
        }

        .modal-prev {
            left: -80px;
        }

        .modal-next {
            right: -80px;
        }

        /* 닫기 버튼 */
        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            background: rgba(255, 0, 110, 0.1);
            border: 2px solid var(--neon-pink);
            color: var(--neon-pink);
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
            box-shadow: 0 0 15px rgba(255, 0, 110, 0.2);
        }

        .modal-close:hover {
            background: var(--neon-pink);
            color: #000;
            box-shadow: 0 0 30px rgba(255, 0, 110, 0.6);
            transform: scale(1.15) rotate(90deg);
        }

        /* 정보 패널 */
        .modal-info {
            margin-top: 30px;
            padding: 20px;
            background: linear-gradient(135deg, rgba(0, 255, 240, 0.05), rgba(181, 0, 255, 0.05));
            border: 2px solid rgba(0, 255, 240, 0.2);
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }

        .modal-title {
            font-size: 1.8rem;
            font-weight: 900;
            text-transform: uppercase;
            background: var(--gradient-neon);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            letter-spacing: 2px;
        }

        .modal-meta {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .modal-date,
        .modal-category {
            font-size: 0.85rem;
            padding: 6px 14px;
            border-radius: 4px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .modal-date {
            background: rgba(0, 255, 240, 0.1);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
        }

        .modal-category {
            background: rgba(181, 0, 255, 0.1);
            border: 1px solid var(--neon-purple);
            color: var(--neon-purple);
        }

        .modal-counter {
            margin-left: auto;
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 700;
        }

        /* ============================================
           반응형 디자인
           ============================================ */

        @media (max-width: 768px) {
            .header {
                padding: 40px 15px 30px;
            }

            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 10px;
                padding: 0 15px 40px;
            }

            .modal-nav-btn {
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
            }

            .modal-prev {
                left: -60px;
            }

            .modal-next {
                right: -60px;
            }

            .modal-content {
                max-width: 95vw;
                max-height: 80vh;
            }

            .modal-image {
                max-height: 70vh;
            }
        }

        @media (max-width: 480px) {
            .header-title {
                font-size: 1.8rem;
            }

            .gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
                padding: 0 10px 30px;
            }

            .modal-nav-btn {
                width: 35px;
                height: 35px;
                font-size: 1rem;
            }

            .modal-prev {
                left: -50px;
            }

            .modal-next {
                right: -50px;
            }

            .filter-container {
                gap: 8px;
            }

            .filter-btn {
                padding: 8px 16px;
                font-size: 0.65rem;
            }
        }

        /* 터치 디바이스 최적화 */
        @media (hover: none) {
            .photo-card:active {
                transform: scale(0.98);
            }

            .modal-nav-btn {
                position: fixed;
                top: auto;
                bottom: 20px;
            }

            .modal-prev {
                left: 20px;
                transform: none;
            }

            .modal-next {
                right: 20px;
                transform: none;
            }
        }

        /* 로딩 스피너 */
        .loading-spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(0, 255, 240, 0.3);
            border-top-color: var(--neon-cyan);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            grid-column: 1 / -1;
            padding: 80px 20px;
            text-align: center;
        }

        .empty-state-text {
            font-size: 1.2rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <!-- 헤더 -->
    <header class="header">
        <h1 class="header-title">🌌 Staff <span style="color: var(--neon-pink);">Photos</span></h1>
        <p class="header-subtitle">▸ Memories & Moments from Our Team ◂</p>
    </header>

    <!-- 필터 -->
    <div class="filter-container">
        <button class="filter-btn filter-btn-active" onclick="filterPhotos('all')">
            ⚡ ALL
        </button>
        <button class="filter-btn" onclick="filterPhotos('work')">
            💼 WORK
        </button>
        <button class="filter-btn" onclick="filterPhotos('event')">
            🎉 EVENT
        </button>
        <button class="filter-btn" onclick="filterPhotos('team')">
            👥 TEAM
        </button>
        <button class="filter-btn" onclick="filterPhotos('staff')">
            🎭 STAFF
        </button>
        <button class="filter-btn" onclick="filterPhotos('Caricature')">
            ✨ CARICATURE
        </button>
    </div>

    <!-- 갤러리 -->
    <div class="gallery" id="gallery"></div>

    <!-- 모달 -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div style="position: relative; display: inline-block; width: 100%;">
                <button class="modal-nav-btn modal-prev" onclick="previousPhoto()">◀</button>
                <img class="modal-image" id="modalImage" src="" alt="" />
                <button class="modal-nav-btn modal-next" onclick="nextPhoto()">▶</button>
            </div>
            <div class="modal-info">
                <div class="modal-title" id="modalTitle"></div>
                <div class="modal-meta">
                    <span class="modal-date" id="modalDate"></span>
                    <span class="modal-category" id="modalCategory"></span>
                    <span class="modal-counter" id="modalCounter"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 전역 상태
        const state = {
            allPhotos: [],
            filteredPhotos: [],
            currentFilter: 'all',
            currentIndex: 0,
            categoryIcons: {
                'work': '💼',
                'event': '🎉',
                'team': '👥',
                'staff': '🎭',
                'Caricature': '✨'
            }
        };

        // 샘플 데이터 (실제 photos.json 사용 시 로드)
        const samplePhotos = [
            ['photo1.jpg', 'Team Meeting Moment', '2024.01.15', 'work'],
            ['photo2.jpg', 'Company Celebration', '2024.02.20', 'event'],
            ['photo3.jpg', 'Office Vibes', '2024.01.10', 'team'],
            ['photo4.jpg', 'Staff Portrait', '2024.03.05', 'staff'],
            ['photo5.jpg', 'Project Launch', '2024.02.28', 'work'],
            ['photo6.jpg', 'Team Outing', '2024.03.15', 'event'],
        ];

        // 사진 로드
        function loadPhotos() {
            fetch('images/TEI/photos.json')
                .then(r => r.json())
                .then(data => {
                    state.allPhotos = data.map((item, idx) => ({
                        id: idx + 1,
                        filename: item[0],
                        title: item[1],
                        date: item[2],
                        category: item[3]
                    }));
                    filterPhotos('all');
                })
                .catch(err => {
                    console.log('Using sample data:', err);
                    state.allPhotos = samplePhotos.map((item, idx) => ({
                        id: idx + 1,
                        filename: item[0],
                        title: item[1],
                        date: item[2],
                        category: item[3]
                    }));
                    filterPhotos('all');
                });
        }

        // 필터링
        function filterPhotos(category) {
            state.currentFilter = category;
            state.filteredPhotos = category === 'all' 
                ? state.allPhotos 
                : state.allPhotos.filter(p => p.category === category);
            
            // 버튼 업데이트
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('filter-btn-active');
            });
            document.querySelector(`[onclick="filterPhotos('${category}')"]`)?.classList.add('filter-btn-active');
            
            renderGallery();
        }

        // 갤러리 렌더
        function renderGallery() {
            const gallery = document.getElementById('gallery');
            if (state.filteredPhotos.length === 0) {
                gallery.innerHTML = `
                    <div class="empty-state">
                        <div class="loading-spinner"></div>
                        <p class="empty-state-text">No photos found</p>
                    </div>
                `;
                return;
            }

            gallery.innerHTML = state.filteredPhotos.map((photo, idx) => {
                const categoryEmoji = state.categoryIcons[photo.category] || '📷';
                return `
                    <div class="photo-card" onclick="openModal(${idx})">
                        <img class="photo-image" src="images/TEI/${photo.filename}" alt="${photo.title}" />
                        <div class="photo-overlay-text">${photo.title}</div>
                        <div class="photo-badge">${categoryEmoji}</div>
                    </div>
                `;
            }).join('');
        }

        // 모달 열기
        function openModal(index) {
            state.currentIndex = index;
            const photo = state.filteredPhotos[index];
            document.getElementById('modalImage').src = `images/TEI/${photo.filename}`;
            document.getElementById('modalTitle').innerText = photo.title;
            document.getElementById('modalDate').innerText = `📅 ${photo.date}`;
            document.getElementById('modalCategory').innerText = `🏷️ ${photo.category.toUpperCase()}`;
            document.getElementById('modalCounter').innerText = `${index + 1} / ${state.filteredPhotos.length}`;
            document.getElementById('modal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // 모달 닫기
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // 이전/다음
        function previousPhoto() {
            if (state.currentIndex > 0) {
                openModal(state.currentIndex - 1);
            }
        }

        function nextPhoto() {
            if (state.currentIndex < state.filteredPhotos.length - 1) {
                openModal(state.currentIndex + 1);
            }
        }

        // 키보드 제어
        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('modal').classList.contains('active')) return;
            if (e.key === 'ArrowLeft') previousPhoto();
            if (e.key === 'ArrowRight') nextPhoto();
            if (e.key === 'Escape') closeModal();
        });

        // 모달 외부 클릭으로 닫기
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') closeModal();
        });

        // 터치 제스처
        let touchStart = 0;
        document.getElementById('modal').addEventListener('touchstart', (e) => {
            touchStart = e.changedTouches[0].screenX;
        }, { passive: true });

        document.getElementById('modal').addEventListener('touchend', (e) => {
            const touchEnd = e.changedTouches[0].screenX;
            const diff = touchStart - touchEnd;
            if (Math.abs(diff) > 50) {
                if (diff > 0) nextPhoto();
                else previousPhoto();
            }
        }, { passive: true });

        // 초기화
        loadPhotos();
    </script>
</body>
</html>
