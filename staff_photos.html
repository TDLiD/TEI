<div class="w-full">
    <!-- 헤더 섹션 -->
    <div class="mb-8 lg:mb-12 animate-fadeIn px-2 sm:px-4">
        <h1 class="text-2xl sm:text-3xl lg:text-5xl font-black text-white uppercase tracking-tighter mb-2 sm:mb-3 italic leading-tight">
            📸 Staff <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-400">Photos</span>
        </h1>
        <p class="text-xs sm:text-sm lg:text-base text-slate-400 font-bold tracking-widest uppercase mb-6 sm:mb-8">Memories & Moments from Our Team</p>
        
<!-- 필터 버튼 -->
<div class="flex gap-2 mb-6 sm:mb-8 overflow-x-auto pb-2 scrollbar-hide w-full">
    <button onclick="filterPhotos('all')" class="filter-btn filter-btn-active px-2 sm:px-4 py-1.5 sm:py-2 rounded-lg sm:rounded-xl text-[9px] sm:text-xs font-black uppercase tracking-widest whitespace-nowrap bg-blue-500/20 text-blue-400 border border-blue-500/30 hover:bg-blue-500/30 transition-all flex-shrink-0" data-filter="all">All</button>
    <button onclick="filterPhotos('work')" class="filter-btn px-2 sm:px-4 py-1.5 sm:py-2 rounded-lg sm:rounded-xl text-[9px] sm:text-xs font-black uppercase tracking-widest whitespace-nowrap bg-white/5 text-slate-400 border border-white/10 hover:bg-white/10 transition-all flex-shrink-0" data-filter="work">💼 Work</button>
    <button onclick="filterPhotos('event')" class="filter-btn px-2 sm:px-4 py-1.5 sm:py-2 rounded-lg sm:rounded-xl text-[9px] sm:text-xs font-black uppercase tracking-widest whitespace-nowrap bg-white/5 text-slate-400 border border-white/10 hover:bg-white/10 transition-all flex-shrink-0" data-filter="event">🎉 Event</button>
    <button onclick="filterPhotos('team')" class="filter-btn px-2 sm:px-4 py-1.5 sm:py-2 rounded-lg sm:rounded-xl text-[9px] sm:text-xs font-black uppercase tracking-widest whitespace-nowrap bg-white/5 text-slate-400 border border-white/10 hover:bg-white/10 transition-all flex-shrink-0" data-filter="team">👥 Team</button>
    <button onclick="filterPhotos('staff')" class="filter-btn px-2 sm:px-4 py-1.5 sm:py-2 rounded-lg sm:rounded-xl text-[9px] sm:text-xs font-black uppercase tracking-widest whitespace-nowrap bg-white/5 text-slate-400 border border-white/10 hover:bg-white/10 transition-all flex-shrink-0" data-filter="staff">🎭 Staff</button>
    <button onclick="filterPhotos('Caricature')" class="filter-btn px-2 sm:px-4 py-1.5 sm:py-2 rounded-lg sm:rounded-xl text-[9px] sm:text-xs font-black uppercase tracking-widest whitespace-nowrap bg-gradient-to-r from-purple-500/20 to-pink-500/20 text-purple-400 border border-purple-500/30 hover:bg-gradient-to-r hover:from-purple-500/30 hover:to-pink-500/30 transition-all flex-shrink-0" data-filter="Caricature">✨ Caricature</button>
</div>

    </div>

    <!-- 갤러리 그리드 -->
    <div id="photoGallery" class="grid gap-3 sm:gap-4 lg:gap-5 px-2 sm:px-4" style="grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); grid-auto-rows: 150px;">
        <div class="col-span-full flex items-center justify-center py-20">
            <div class="animate-spin w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full"></div>
        </div>
    </div>

    <!-- 모달 라이트박스 -->
    <div id="photoModal" class="hidden fixed inset-0 z-[4000] flex items-center justify-center p-2 sm:p-4 bg-black/95 backdrop-blur-md">
        <button onclick="closePhotoModal()" class="absolute top-3 right-3 sm:top-5 sm:right-5 w-10 h-10 sm:w-12 sm:h-12 flex items-center justify-center text-white text-2xl sm:text-3xl hover:bg-white/10 rounded-full transition-all duration-200 z-50">
            ✕
        </button>
        
        <div class="w-full max-w-2xl sm:max-w-3xl lg:max-w-4xl animate-fadeIn">
            <div class="relative group">
                <img id="modalImage" src="" alt="" class="w-full rounded-xl sm:rounded-2xl shadow-2xl object-cover max-h-[60vh] sm:max-h-[75vh] lg:max-h-[85vh]">
                
                <!-- 네비게이션 버튼 -->
                <button id="prevBtn" onclick="previousPhoto()" class="absolute left-0 top-1/2 -translate-y-1/2 -translate-x-12 sm:-translate-x-16 lg:-translate-x-20 w-10 h-10 sm:w-12 sm:h-12 flex items-center justify-center text-white text-lg sm:text-2xl hover:scale-110 transition-transform duration-200 opacity-0 group-hover:opacity-100">
                    ◀
                </button>
                <button id="nextBtn" onclick="nextPhoto()" class="absolute right-0 top-1/2 -translate-y-1/2 translate-x-12 sm:translate-x-16 lg:translate-x-20 w-10 h-10 sm:w-12 sm:h-12 flex items-center justify-center text-white text-lg sm:text-2xl hover:scale-110 transition-transform duration-200 opacity-0 group-hover:opacity-100">
                    ▶
                </button>
            </div>
            
            <!-- 사진 정보 -->
            <div class="mt-3 sm:mt-6 flex flex-col gap-2 sm:gap-3">
                <div class="flex items-center justify-between flex-wrap gap-2">
                    <h2 id="modalTitle" class="text-base sm:text-xl font-black text-white uppercase tracking-wider italic"></h2>
                    <span id="modalCounter" class="text-xs sm:text-sm font-bold text-slate-400 tracking-widest uppercase"></span>
                </div>
                <div class="flex items-center gap-2 sm:gap-4 flex-wrap">
                    <span id="modalDate" class="text-[10px] sm:text-xs font-bold text-blue-400 uppercase tracking-widest"></span>
                    <span id="modalCategory" class="px-2 sm:px-3 py-1 rounded-lg text-[10px] sm:text-xs font-black uppercase tracking-widest bg-blue-500/20 text-blue-400 border border-blue-500/30"></span>
                </div>
            </div>
        </div>
    </div>

    <style>
        /* 갤러리 이미지 애니메이션 */
        .photo-card {
            animation: photoEntry 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
        }

        @keyframes photoEntry {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .photo-card:nth-child(1) { animation-delay: 0.05s; }
        .photo-card:nth-child(2) { animation-delay: 0.1s; }
        .photo-card:nth-child(3) { animation-delay: 0.15s; }
        .photo-card:nth-child(4) { animation-delay: 0.2s; }
        .photo-card:nth-child(5) { animation-delay: 0.25s; }
        .photo-card:nth-child(6) { animation-delay: 0.3s; }
        .photo-card:nth-child(7) { animation-delay: 0.35s; }
        .photo-card:nth-child(8) { animation-delay: 0.4s; }
        .photo-card:nth-child(9) { animation-delay: 0.45s; }
        .photo-card:nth-child(n+10) { animation-delay: 0.5s; }

        /* 이미지 호버 효과 */
        .photo-card-image {
            position: relative;
            overflow: hidden;
            border-radius: 0.75rem;
            width: 100%;
            height: 100%;
        }

        .photo-card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .photo-card:hover .photo-card-image img {
            transform: scale(1.08) rotate(1deg);
        }

        /* 오버레이 효과 */
        .photo-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(34, 211, 238, 0.1));
            opacity: 0;
            transition: opacity 0.3s ease;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .photo-card:hover .photo-overlay {
            opacity: 1;
        }

        .photo-overlay-icon {
            font-size: 1.5rem;
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        .photo-card:hover .photo-overlay-icon {
            transform: scale(1);
        }

        /* 필터 버튼 액티브 상태 */
        .filter-btn-active {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.3), rgba(34, 211, 238, 0.3)) !important;
            border-color: rgb(96, 165, 250) !important;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
        }

        /* 페이드 아웃 애니메이션 */
        .fade-out {
            animation: fadeOut 0.3s ease forwards;
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: scale(1);
            }
            to {
                opacity: 0;
                transform: scale(0.95);
            }
        }

        /* 빛나는 보더 효과 */
        .photo-card {
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 0.75rem;
            box-shadow: 
                0 0 1px rgba(59, 130, 246, 0.5),
                0 0 2px rgba(34, 211, 238, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .photo-card:hover {
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: 
                0 0 1px rgba(59, 130, 246, 0.8),
                0 0 10px rgba(59, 130, 246, 0.4),
                0 0 20px rgba(34, 211, 238, 0.2);
        }

        /* 반응형 그리드 조정 */
        @media (max-width: 640px) {
            #photoGallery {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)) !important;
                grid-auto-rows: 130px !important;
            }
        }

        @media (min-width: 641px) and (max-width: 1024px) {
            #photoGallery {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)) !important;
                grid-auto-rows: 180px !important;
            }
        }

        @media (min-width: 1025px) {
            #photoGallery {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)) !important;
                grid-auto-rows: 220px !important;
            }
        }

        /* 터치 디바이스 최적화 */
        @media (hover: none) and (pointer: coarse) {
            .photo-card:active {
                transform: scale(0.96);
            }

            .photo-card:active .photo-overlay {
                opacity: 1;
            }
        }
/* 필터 버튼 컨테이너 스크롤 개선 */
.filter-buttons-container {
    display: flex;
    gap: 8px;
    margin-bottom: 1.5rem;
    overflow-x: auto;
    padding-bottom: 0.5rem;
    width: 100%;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
}

.filter-buttons-container button {
    flex-shrink: 0;
}

/* 스크롤바 완전히 숨기기 */
.scrollbar-hide {
    -ms-overflow-style: none;
    scrollbar-width: none;
}

.scrollbar-hide::-webkit-scrollbar {
    display: none;
}

/* 모바일에서 스크롤 힌트 추가 */
@media (max-width: 640px) {
    .filter-buttons-container {
        scroll-snap-type: x mandatory;
    }
    
    .filter-buttons-container button {
        scroll-snap-align: start;
    }
}
    </style>

<script>
    // 1. 전역 변수 안전 초기화 (재선언 에러 방지)
    window.allPhotos = window.allPhotos || [];
    window.filteredPhotos = window.filteredPhotos || [];
    window.currentFilter = window.currentFilter || 'all';
    window.currentPhotoIndex = window.currentPhotoIndex || 0;
    window.touchStartX = 0;
    window.touchEndX = 0;

    // 2. 사진 데이터 로드
    async function loadPhotos() {
        try {
            const response = await fetch('images/TEI/photos.json');
            if (!response.ok) throw new Error('Network response was not ok');
            const data = await response.json();
            window.allPhotos = data.map((item, idx) => ({
                id: idx + 1,
                filename: item[0],
                title: item[1],
                date: item[2],
                category: item[3]
            }));
            window.filterPhotos(window.currentFilter || 'all');
        } catch (error) {
            console.error('Error loading photos:', error);
            var gallery = document.getElementById('photoGallery');
            if (gallery) {
                gallery.innerHTML = `<div class="col-span-full text-center py-20"><p class="text-rose-500 uppercase font-bold">Error loading photos</p></div>`;
            }
        }
    }

// 3. 필터링 함수 (수정된 버전)
window.filterPhotos = function(category) {
    window.currentFilter = category;
    var buttons = document.querySelectorAll('.filter-btn');
    if (buttons.length > 0) {
        buttons.forEach(function(btn) { btn.classList.remove('filter-btn-active'); });
        
        // 버튼 찾기 (대소문자 구분 없이)
        var activeBtn = document.querySelector('.filter-btn[data-filter="' + category + '"]');
        
        // 널 체크 추가
        if (activeBtn) {
            activeBtn.classList.add('filter-btn-active');
        } else {
            console.warn('Button not found for category:', category);
        }
    }

    window.filteredPhotos = category === 'all' 
        ? window.allPhotos 
        : window.allPhotos.filter(function(p) { return p.category === category; });
    
    renderGallery();
};

    // 4. 갤러리 렌더링
    function renderGallery() {
        var gallery = document.getElementById('photoGallery');
        if (!gallery) return; 
        
        if (window.filteredPhotos.length === 0) {
            gallery.innerHTML = `<div class="col-span-full text-center py-20 text-slate-500 font-bold uppercase">No photos found</div>`;
            return;
        }

        gallery.innerHTML = window.filteredPhotos.map(function(photo, index) {
            return `
            <div class="photo-card group" onclick="window.openPhotoModal(${index})">
                <div class="photo-card-image relative h-full">
                    <img src="images/TEI/${photo.filename}" alt="${photo.title}" loading="lazy" 
                         onerror="this.src='https://via.placeholder.com/300x300?text=Photo+Not+Found'">
                    <div class="photo-overlay"><div class="photo-overlay-icon">🔍</div></div>
                </div>
            </div>`;
        }).join('');
    }

    // 5. 모달 제어
    window.openPhotoModal = function(index) {
        window.currentPhotoIndex = index;
        var photo = window.filteredPhotos[index];
        var modal = document.getElementById('photoModal');
        if (!modal || !photo) return;

        var modalImg = document.getElementById('modalImage');
        if (modalImg) {
            modalImg.src = 'images/TEI/' + photo.filename;
            modalImg.onerror = function() { this.src = 'https://via.placeholder.com/800x600?text=Photo+Not+Found'; };
        }
        
        var safeSetText = function(id, text) {
            var el = document.getElementById(id);
            if (el) el.innerText = text;
        };

        safeSetText('modalTitle', photo.title);
        safeSetText('modalDate', photo.date);
        safeSetText('modalCategory', photo.category.toUpperCase());
        safeSetText('modalCounter', (index + 1) + ' / ' + window.filteredPhotos.length);
        
        modal.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
        updateNavigationButtons();
    };

    window.closePhotoModal = function() {
        var modal = document.getElementById('photoModal');
        if (modal) modal.classList.add('hidden');
        document.body.style.overflow = 'auto';
    };

    window.previousPhoto = function() {
        if (window.currentPhotoIndex > 0) {
            window.currentPhotoIndex--;
            updateModalContent();
        }
    };

    window.nextPhoto = function() {
        if (window.currentPhotoIndex < window.filteredPhotos.length - 1) {
            window.currentPhotoIndex++;
            updateModalContent();
        }
    };

    function updateModalContent() {
        var photo = window.filteredPhotos[window.currentPhotoIndex];
        if (!photo) return;
        document.getElementById('modalImage').src = 'images/TEI/' + photo.filename;
        document.getElementById('modalTitle').innerText = photo.title;
        document.getElementById('modalDate').innerText = photo.date;
        document.getElementById('modalCategory').innerText = photo.category.toUpperCase();
        document.getElementById('modalCounter').innerText = (window.currentPhotoIndex + 1) + ' / ' + window.filteredPhotos.length;
        updateNavigationButtons();
    }

    function updateNavigationButtons() {
        var prev = document.getElementById('prevBtn');
        var next = document.getElementById('nextBtn');
        if (prev) prev.style.opacity = window.currentPhotoIndex > 0 ? '1' : '0.3';
        if (next) next.style.opacity = window.currentPhotoIndex < window.filteredPhotos.length - 1 ? '1' : '0.3';
    }

    // 6. 전역 리스너 등록 (중복 방지)
    if (!window.staffPhotoEventsAttached) {
        document.addEventListener('keydown', function(e) {
            var modal = document.getElementById('photoModal');
            if (!modal || modal.classList.contains('hidden')) return;
            if (e.key === 'ArrowLeft') window.previousPhoto();
            if (e.key === 'ArrowRight') window.nextPhoto();
            if (e.key === 'Escape') window.closePhotoModal();
        });

        window.addEventListener('click', function(e) {
            if (e.target.id === 'photoModal') window.closePhotoModal();
        });
        window.staffPhotoEventsAttached = true;
    }

    // 7. 터치 핸들링 (에러 발생 지점: const 제거 및 var 사용)
    var photoModalEl = document.getElementById('photoModal');
    if (photoModalEl) {
        photoModalEl.addEventListener('touchstart', function(e) {
            if (e.target.id === 'photoModal') return;
            window.touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        photoModalEl.addEventListener('touchend', function(e) {
            if (e.target.id === 'photoModal') return;
            window.touchEndX = e.changedTouches[0].screenX;
            var diff = window.touchStartX - window.touchEndX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) window.nextPhoto();
                else window.previousPhoto();
            }
        }, { passive: true });
    }

// 캐리커처 필터링 함수 (수정된 버전)
window.openCaricatureModal = function() {
    window.currentFilter = 'Caricature';
    var buttons = document.querySelectorAll('.filter-btn');
    
    if (buttons.length > 0) {
        buttons.forEach(function(btn) { btn.classList.remove('filter-btn-active'); });
        
        // 수정: "caricature" → "Caricature" (대문자 C)
        var activeBtn = document.querySelector('.filter-btn[data-filter="Caricature"]');
        if (activeBtn) {
            activeBtn.classList.add('filter-btn-active');
        } else {
            console.warn('Caricature button not found');
        }
    }

    // Caricature 카테고리만 필터링
    window.filteredPhotos = window.allPhotos.filter(function(p) { 
        return p.category === 'Caricature'; 
    });
    
    renderGallery();
};

window.closeCaricatureModal = function() {
    var modal = document.getElementById('caricatureModal');
    if (modal) {
        modal.remove();
        document.body.style.overflow = 'auto';
    }
};

    // 로드 시 실행
    loadPhotos();
</script>


</div>
