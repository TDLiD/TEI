<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>


<script>
(function() {
    const reportDb = window.db || firebase.database();
    let reportViewDate = new Date();

    // [수정] 화면 갱신 시 제목 업데이트 포함
    window.renderWorkFull = function(){
        updateMonthTitle();
        drawReportCalendar();
    };


// 기존 스크립트 내부(IIFE) 혹은 적절한 위치에 추가
window.importAdminWorkReport = function(event) {
    const file = event.target.files[0];
    if (!file) return;

    // [추가] 엑셀 숫자 날짜(46430 등)를 YYYY-MM-DD 문자열로 변환하는 함수
    function formatExcelDate(value) {
        if (typeof value === 'number') {
            // 엑셀 날짜 일련번호를 JS 날짜 객체로 변환 (기준일: 1899-12-30)
            const date = new Date(Math.round((value - 25569) * 86400 * 1000));
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }
        return String(value).trim(); // 이미 문자열이면 공백만 제거 후 반환
    }

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const jsonData = XLSX.utils.sheet_to_json(firstSheet);

            if (jsonData.length === 0) {
                alert("No data found to import.");
                return;
            }

            if (!confirm(`Import ${jsonData.length} records? Existing data for the same staff/date will be overwritten.`)) {
                event.target.value = '';
                return;
            }

            const reportDb = firebase.database();
            let successCount = 0;
            
            const promises = jsonData.map(row => {
                // [수정] 날짜 데이터 읽을 때 formatExcelDate 함수 적용
                const rawDate = row["DATE"];
                const dateKey = formatExcelDate(rawDate); 
                const staffName = row["STAFF NAME"];

                // 유효성 검사 (변환 후 날짜 형식이 아니거나 이름이 없으면 스킵)
                if (!dateKey || dateKey === 'undefined' || !staffName) return Promise.resolve();

                const reportData = {
                    status: row["STATUS"] || "In Progress",
                    todo: row["TODO LIST"] || "",
                    summary: row["WORK SUMMARY"] || "",
                    adminMemo: row["ADMIN MEMO"] || "",
                    lastModified: new Date().toISOString()
                };

                return reportDb.ref(`reports/${dateKey}/${staffName}`).set(reportData)
                    .then(() => { successCount++; });
            });

            Promise.all(promises).then(() => {
                alert(`Successfully imported ${successCount} reports.`);
                if (typeof window.renderWorkFull === 'function') window.renderWorkFull(); 
                event.target.value = '';
            });

        } catch (err) {
            console.error(err);
            alert("Error parsing file. Please check if the format matches the exported Excel.");
        }
    };
    reader.readAsArrayBuffer(file);
};



function updateMonthTitle() {
    const titleBox = document.getElementById('currentReportMonthYear');
    if(titleBox) {
        // 'en-US'를 명시적으로 지정하여 영문(January 2026)으로 고정
        const options = { month: 'long', year: 'numeric' };
        titleBox.innerText = reportViewDate.toLocaleDateString('en-US', options);
    }
}
    // [추가] 월 이동 함수들
    window.changeReportMonth = function(offset) {
        reportViewDate.setMonth(reportViewDate.getMonth() + offset);
        window.renderWorkFull();
    };

    window.goReportToday = function() {
        reportViewDate = new Date();
        window.renderWorkFull();
    };

// (기존 코드) const currentMonthStr = ... 부분을 아래와 같이 확실하게 초기화
const now = new Date();
const currentMonthStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
const monthInput = document.getElementById('exportMonth');
if(monthInput) {
    monthInput.value = currentMonthStr;
    // 브라우저에게 영문 UI를 강력하게 요청
    monthInput.setAttribute('lang', 'en-US');
}


function drawReportCalendar() {
    // 1. 현재 뷰 날짜 기준 정보 계산
    const y = reportViewDate.getFullYear();
    const m = reportViewDate.getMonth();
    const first = new Date(y, m, 1).getDay();
    const last = new Date(y, m + 1, 0).getDate();

    // 2. Firebase 데이터 조회
    reportDb.ref("reports").once("value", snap => {
        // [방어 코드] 데이터를 그릴 DOM 요소가 있는지 가장 먼저 확인
        const body = document.getElementById("reportCalendarBody");
        if (!body) {
            console.warn("Calendar body element not found. Skipping render.");
            return;
        }

        const data = snap.val() || {};
        body.innerHTML = ""; // 기존 내용 초기화
        let d = 1;

        // 3. 달력 행(Row) 생성 (최대 6주)
        for (let i = 0; i < 6; i++) {
            const tr = document.createElement("tr");
            
            // 4. 달력 열(Cell) 생성 (일~토)
            for (let j = 0; j < 7; j++) {
                const td = document.createElement("td");
                
                // 해당 월의 날짜 범위 밖이면 빈 칸 처리
                if (i === 0 && j < first || d > last) {
                    tr.appendChild(td);
                    continue;
                }

                const date = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const reports = data[date] || {};
                const isToday = new Date().toISOString().split('T')[0] === date;

                // 오늘 날짜 배경 강조
                if (isToday) td.classList.add('bg-blue-500/5');

                // 셀 내부 HTML 생성
                let html = `<div class="font-black text-[10px] ${isToday ? 'text-blue-500' : 'text-slate-600'} mb-1">${d}</div>`;
                html += `<div class="flex flex-col gap-1 overflow-hidden">`;

                // 해당 날짜에 등록된 직원 리스트(배지) 추가
                html += Object.keys(reports).map(n => `
                    <div class="report-item-badge text-[9px] truncate cursor-pointer hover:bg-blue-500/20" 
                         onclick="event.stopPropagation(); openReportDetail('${date}', '${n}')">
                        ${n}
                    </div>
                `).join('');

                html += `</div>`;
                td.innerHTML = html;

                // 셀 자체 클릭 시 (빈 공간 포함) 첫 번째 직원 리포트 상세 열기
                td.onclick = () => {
                    const firstStaff = Object.keys(reports)[0];
                    if (firstStaff) openReportDetail(date, firstStaff);
                };

                tr.appendChild(td);
                d++;
            }
            body.appendChild(tr);
            
            // 모든 날짜를 다 그렸으면 루프 종료
            if (d > last) break;
        }
    }).catch(err => {
        console.error("Firebase data fetch error:", err);
    });
}


window.exportWorkReport = function(type) {
    let monthVal = "";
    let monthLabel = "";
    
    // Monthly 타입 설정
    if (type === 'monthly') {
        const y = document.getElementById('exportMonthYear').value;
        const m = document.getElementById('exportMonthOnly').value;
        const mText = document.getElementById('exportMonthOnly').options[document.getElementById('exportMonthOnly').selectedIndex].text;
        monthVal = `${y}-${m}`;
        monthLabel = `${y}_${mText}`; // 예: 2026_JANUARY
    }
    
    const yearVal = document.getElementById('exportYear').value;
    const todayStr = new Date().toISOString().split('T')[0]; // 현재 날짜 (2026-01-13)

    reportDb.ref("reports").once("value", snap => {
        const allData = snap.val() || {};
        let exportData = [];
        const dates = Object.keys(allData).sort();
        
        dates.forEach(date => {
            if (type === 'monthly' && !date.startsWith(monthVal)) return;
            if (type === 'yearly' && !date.startsWith(yearVal)) return;

            const staffRecords = allData[date];
            Object.keys(staffRecords).forEach(staff => {
                const r = staffRecords[staff];
                exportData.push({
                    "DATE": date,
                    "STAFF NAME": staff,
                    "STATUS": r.status || '-',
                    "TODO LIST": r.todo || '',      
                    "WORK SUMMARY": r.summary || '', 
                    "ADMIN MEMO": r.adminMemo || '', 
                    "LAST MODIFIED": r.lastModified ? r.lastModified.split('T')[0] : '-'
                });
            });
        });

        if (exportData.length === 0) {
            alert("No records found.");
            return;
        }

        const worksheet = XLSX.utils.json_to_sheet(exportData);
        
        // 셀 스타일 및 너비 설정 (기존 유지)
        if (worksheet['!ref']) {
            const range = XLSX.utils.decode_range(worksheet['!ref']);
            for (let R = range.s.r; R <= range.e.r; ++R) {
                for (let C = range.s.c; C <= range.e.c; ++C) {
                    const cell_ref = XLSX.utils.encode_cell({ c: C, r: R });
                    if (!worksheet[cell_ref]) continue;
                    worksheet[cell_ref].s = {
                        alignment: { wrapText: true, vertical: 'top', horizontal: 'left' }
                    };
                }
            }
        }
        worksheet['!cols'] = [{wch: 12}, {wch: 15}, {wch: 12}, {wch: 45}, {wch: 55}, {wch: 35}, {wch: 15}];

        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "WorkReports");

        // --- 파일명 생성 로직 수정 ---
        let filename = "";
        if (type === 'overall') {
            filename = `WorkReport_overall_${todayStr}`;
        } else if (type === 'yearly') {
            filename = `WorkReport_yearly_${yearVal}_${todayStr}`;
        } else if (type === 'monthly') {
            filename = `WorkReport_monthly_${monthLabel}_${todayStr}`;
        }
        
        XLSX.writeFile(workbook, `${filename}.xlsx`);
    });
};



  // [수정] 특정 직원의 이름을 인자로 받아 Firebase에서 해당 데이터만 가져오도록 변경
    window.openReportDetail = function(date, staff){
        if(!staff) return;

        reportDb.ref(`reports/${date}/${staff}`).once("value", snap => {
            const r = snap.val() || {};
            const box = document.getElementById("reportDetail");
            if(!box) return;
            box.classList.remove("hidden");

            box.innerHTML = `
            <div class="detail-panel p-6 sticky top-0">
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <h3 class="text-2xl font-black text-white">Report Detail</h3>
                        <p class="text-slate-500 text-xs font-bold uppercase">${date} / ${staff}</p>
                    </div>
                    <button onclick="closeReportDetail()" class="text-slate-500 hover:text-white transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="text-[10px] text-blue-500 mb-1 block uppercase">Status</label>
                        <select id="rp_status" class="custom-input font-bold text-blue-400">
                            <option ${r.status==='In Progress'?'selected':''}>In Progress</option>
                            <option ${r.status==='Completed'?'selected':''}>Completed</option>
                            <option ${r.status==='Pending'?'selected':''}>Pending</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-500 mb-1 block uppercase">Today's To-Do</label>
                        <textarea id="rp_todo" class="custom-input h-24 resize-none" placeholder="Enter task list...">${r.todo||''}</textarea>
                    </div>
                    <div>
                        <label class="text-[10px] text-emerald-500 mb-1 block uppercase">Work Summary</label>
                        <textarea id="rp_summary" class="custom-input h-32 resize-none" placeholder="Describe work results...">${r.summary||''}</textarea>
                    </div>
                    <div>
                        <label class="text-[10px] text-amber-500 mb-1 block uppercase">Admin Memo</label>
                        <textarea id="rp_memo" class="custom-input h-20 resize-none border-amber-500/20" placeholder="Private notes...">${r.adminMemo||''}</textarea>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3 mt-8">
                    <button onclick="saveReport('${date}','${staff}')"
                        class="col-span-2 bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-2xl transition-all shadow-lg shadow-blue-900/20">
                        SAVE CHANGES
                    </button>
                    <button onclick="closeReportDetail()"
                        class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 rounded-xl transition-all">
                        Cancel
                    </button>
                    <button onclick="deleteReport('${date}','${staff}')"
                        class="bg-rose-900/30 hover:bg-rose-600 text-rose-500 hover:text-white font-bold py-3 rounded-xl transition-all border border-rose-500/20">
                        Delete
                    </button>
                </div>
            </div>`;
        });
    }



    // HTML 요소의 onclick에서 접근할 수 있도록 전역으로 등록
    window.closeReportDetail = function() {
        document.getElementById("reportDetail").classList.add("hidden");
    };

    window.saveReport = function(date, staff){
        reportDb.ref(`reports/${date}/${staff}`).update({
            status: document.getElementById('rp_status').value,
            todo: document.getElementById('rp_todo').value,
            summary: document.getElementById('rp_summary').value,
            adminMemo: document.getElementById('rp_memo').value,
            lastModified: new Date().toISOString()
        }).then(() => {
            alert("Saved successfully");
            drawReportCalendar();
        });
    };

    window.deleteReport = function(date, staff){
        if(!confirm("Are you sure you want to delete this report?")) return;
        reportDb.ref(`reports/${date}/${staff}`).remove().then(() => {
            window.closeReportDetail();
            drawReportCalendar();
        });
    };

    // 최초 로드 시 실행
    drawReportCalendar();
})();
</script>
