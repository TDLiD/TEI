<style>
    /* attendance 스타일과 통일 */
    .report-calendar-wrapper {
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
    }

    .report-table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed; /* 셀 크기 고정 */
    }

    .report-table th { 
        padding: 12px 0; 
        color: #64748b; 
        font-size: 0.75rem; 
        text-align: center; 
        font-weight: 800; 
        text-transform: uppercase;
        border-bottom: 1px solid #1e293b;
    }

    .report-table td { 
        height: 100px; 
        border: 1px solid #1e293b; 
        vertical-align: top; 
        padding: 8px; 
        position: relative; 
        transition: background 0.2s;
    }

    .report-table td:hover { 
        background-color: #0f172a; 
        cursor: pointer; 
    }

    /* 리포트 배지 스타일 (attendance의 시간 라벨 스타일 적용) */
    .report-item-badge {
        display: block;
        font-size: 0.65rem;
        font-weight: 800;
        padding: 2px 6px;
        margin-top: 3px;
        border-radius: 4px;
        background-color: rgba(59, 130, 246, 0.1);
        color: #3b82f6;
        border-left: 2px solid #3b82f6;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* 상세 패널 디자인 개선 */
    .detail-panel {
        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 24px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .custom-input {
        background: #1e293b;
        color: #f1f5f9;
        padding: 12px;
        border-radius: 12px;
        width: 100%;
        border: 1px solid transparent;
        transition: border 0.2s;
        font-size: 0.875rem;
    }

    .custom-input:focus {
        border-color: #3b82f6;
        outline: none;
    }

    label {
        font-weight: 800;
        letter-spacing: -0.025em;
    }

/* 기존 스타일 유지... */
    .nav-btn:hover { background-color: #1e293b; color: #3b82f6; }
    #currentReportMonthYear { min-width: 150px; }

</style>

<div class="flex flex-col lg:flex-row gap-8 animate-fadeIn">

    <div class="flex-1 min-w-0">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 px-2 gap-4">
            <div class="flex flex-col">
                <h2 class="text-3xl font-black italic text-white">
                    WORK <span class="text-emerald-500">REPORTS</span>
                </h2>
                <div id="currentReportMonthYear" class="text-lg font-black text-slate-400 italic mt-1 uppercase tracking-tighter"></div>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="flex bg-slate-900 border border-slate-800 rounded-xl p-1 shadow-inner">
                    <button onclick="changeReportMonth(-1)" class="nav-btn px-4 py-2 text-slate-400 transition rounded-lg text-[10px] font-black tracking-widest hover:text-white uppercase">
                        &lt; Prev
                    </button>
                    <button onclick="goReportToday()" class="nav-btn px-4 py-2 text-blue-400 transition rounded-lg text-[10px] font-black tracking-widest mx-1 hover:bg-blue-500/10 uppercase">
                        Today
                    </button>
                    <button onclick="changeReportMonth(1)" class="nav-btn px-4 py-2 text-slate-400 transition rounded-lg text-[10px] font-black tracking-widest hover:text-white uppercase">
                        Next &gt;
                    </button>
                </div>
            </div>
        </div>

        <div class="report-calendar-wrapper bg-slate-950 rounded-[2rem] border border-slate-800 overflow-hidden shadow-2xl">
            <table class="report-table">
                <thead>
                    <tr class="bg-slate-900/50">
                        <th class="text-rose-500">Sun</th>
                        <th>Mon</th><th>Tue</th><th>Wed</th>
                        <th>Thu</th><th>Fri</th>
                        <th class="text-blue-500">Sat</th>
                    </tr>
                </thead>
                <tbody id="reportCalendarBody"></tbody>
            </table>
        </div>
    </div>

    <div id="reportDetail" class="w-full lg:w-[420px] hidden shrink-0"></div>
</div>


<div class="mt-8 bg-slate-900/50 p-6 rounded-[2rem] border border-slate-800 shadow-xl">
    <div class="flex items-center gap-3 mb-6">
        <div class="p-2 bg-emerald-500/20 rounded-lg">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
        </div>
        <h3 class="text-xl font-black text-white italic">EXPORT <span class="text-emerald-500">EXCEL</span></h3>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="space-y-3 bg-slate-800/30 p-4 rounded-2xl border border-slate-700/50">
            <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Monthly Report</label>
            <div class="flex gap-2">
                <input type="month" id="exportMonth" class="custom-input !py-2 text-xs font-bold">
                <button onclick="exportWorkReport('monthly')" class="shrink-0 bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-[10px] font-black transition-all">GO</button>
            </div>
        </div>

        <div class="space-y-3 bg-slate-800/30 p-4 rounded-2xl border border-slate-700/50">
            <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Yearly Report</label>
            <div class="flex gap-2">
                <select id="exportYear" class="custom-input !py-2 text-xs font-bold">
                    <option value="2024">2024</option>
                    <option value="2025">2025</option>
                    <option value="2026" selected>2026</option>
                </select>
                <button onclick="exportWorkReport('yearly')" class="shrink-0 bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-[10px] font-black transition-all">GO</button>
            </div>
        </div>

        <div class="space-y-3 bg-slate-800/30 p-4 rounded-2xl border border-slate-700/50 flex flex-col justify-between">
            <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest">All-Time Overall</label>
            <button onclick="exportWorkReport('overall')" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-2 rounded-xl text-[10px] font-black transition-all border border-blue-400/20 shadow-lg shadow-blue-900/40">
                EXPORT ALL RECORDS
            </button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>


<script>
(function() {
    const reportDb = window.db || firebase.database();
    let reportViewDate = new Date();

    // [수정] 화면 갱신 시 제목 업데이트 포함
    window.renderWorkFull = function(){
        updateMonthTitle();
        drawReportCalendar();
    };

    function updateMonthTitle() {
        const titleBox = document.getElementById('currentReportMonthYear');
        if(titleBox) {
            titleBox.innerText = reportViewDate.toLocaleString('en-US', { month: 'long', year: 'numeric' });
        }
    }

    // [추가] 월 이동 함수들
    window.changeReportMonth = function(offset) {
        reportViewDate.setMonth(reportViewDate.getMonth() + offset);
        window.renderWorkFull();
    };

    window.goReportToday = function() {
        reportViewDate = new Date();
        window.renderWorkFull();
    };

    function drawReportCalendar(){
        const y = reportViewDate.getFullYear();
        const m = reportViewDate.getMonth();
        const first = new Date(y, m, 1).getDay();
        const last = new Date(y, m + 1, 0).getDate();

        // [참고] 기존 drawReportCalendar 내부 로직은 유지하되 
        // y, m 변수가 reportViewDate를 참조하도록 변경됨
        reportDb.ref("reports").once("value", snap => {
            const data = snap.val() || {};
            const body = document.getElementById("reportCalendarBody");
            if(!body) return;
            body.innerHTML = "";
            let d = 1;

            for(let i = 0; i < 6; i++){
                const tr = document.createElement("tr");
                for(let j = 0; j < 7; j++){
                    const td = document.createElement("td");
                    if(i === 0 && j < first || d > last){
                        tr.appendChild(td); continue;
                    }

                    const date = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                    const reports = data[date] || {};
                    const isToday = new Date().toISOString().split('T')[0] === date;
                    
                    if(isToday) td.classList.add('bg-blue-500/5'); // 테일윈드 클래스로 변경

                    let html = `<div class="font-black text-[10px] ${isToday ? 'text-blue-500' : 'text-slate-600'} mb-1">${d}</div>`;
                    html += `<div class="flex flex-col gap-1 overflow-hidden">`;
                    html += Object.keys(reports).map(n => `
                        <div class="report-item-badge text-[9px] truncate">${n}</div>
                    `).join('');
                    html += `</div>`;
                    
                    td.innerHTML = html;
                    td.onclick = () => openReportDetail(date, reports);
                    tr.appendChild(td);
                    d++;
                }
                body.appendChild(tr);
                if(d > last) break;
            }
        });
    }


window.exportWorkReport = function(type) {
    const monthVal = document.getElementById('exportMonth').value; 
    const yearVal = document.getElementById('exportYear').value;   

    reportDb.ref("reports").once("value", snap => {
        const allData = snap.val() || {};
        let exportData = [];
        const dates = Object.keys(allData).sort();
        
        dates.forEach(date => {
            if (type === 'monthly' && !date.startsWith(monthVal)) return;
            if (type === 'yearly' && !date.startsWith(yearVal)) return;

            const staffRecords = allData[date];
            Object.keys(staffRecords).forEach(staff => {
                const r = staffRecords[staff];
                exportData.push({
                    "DATE": date,
                    "STAFF NAME": staff,
                    "STATUS": r.status || '-',
                    "TODO LIST": r.todo || '',      
                    "WORK SUMMARY": r.summary || '', 
                    "ADMIN MEMO": r.adminMemo || '', 
                    "LAST MODIFIED": r.lastModified ? r.lastModified.split('T')[0] : '-'
                });
            });
        });

        if (exportData.length === 0) {
            alert("No records found.");
            return;
        }

        // 1. 워크시트 생성
        const worksheet = XLSX.utils.json_to_sheet(exportData);

        // 2. 모든 셀을 순회하며 '텍스트 줄 바꿈' 속성 강제 주입
        if (worksheet['!ref']) {
            const range = XLSX.utils.decode_range(worksheet['!ref']);
            for (let R = range.s.r; R <= range.e.r; ++R) {
                for (let C = range.s.c; C <= range.e.c; ++C) {
                    const cell_ref = XLSX.utils.encode_cell({ c: C, r: R });
                    if (!worksheet[cell_ref]) continue;

                    // 줄바꿈 인식 및 상단 정렬 설정
                    worksheet[cell_ref].s = {
                        alignment: { 
                            wrapText: true, 
                            vertical: 'top',
                            horizontal: 'left'
                        }
                    };
                }
            }
        }

        // 3. 열 너비 설정 (줄바꿈이 잘 보이도록 넉넉하게 설정)
        worksheet['!cols'] = [
            {wch: 12}, // DATE
            {wch: 15}, // STAFF
            {wch: 12}, // STATUS
            {wch: 45}, // TODO LIST
            {wch: 55}, // WORK SUMMARY
            {wch: 35}, // ADMIN MEMO
            {wch: 15}  // LAST MODIFIED
        ];

        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "WorkReports");

        let filename = `WorkReport_${type}_${new Date().getTime()}`;
        XLSX.writeFile(workbook, `${filename}.xlsx`);
    });
};



    function openReportDetail(date, reports){
        const staff = Object.keys(reports)[0];
        if(!staff) return;

        reportDb.ref(`reports/${date}/${staff}`).once("value", snap => {
            const r = snap.val() || {};
            const box = document.getElementById("reportDetail");
            if(!box) return;
            box.classList.remove("hidden");

            box.innerHTML = `
            <div class="detail-panel p-6 sticky top-0">
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <h3 class="text-2xl font-black text-white">Report Detail</h3>
                        <p class="text-slate-500 text-xs font-bold uppercase">${date} / ${staff}</p>
                    </div>
                    <button onclick="closeReportDetail()" class="text-slate-500 hover:text-white transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="text-[10px] text-blue-500 mb-1 block uppercase">Status</label>
                        <select id="rp_status" class="custom-input font-bold text-blue-400">
                            <option ${r.status==='In Progress'?'selected':''}>In Progress</option>
                            <option ${r.status==='Completed'?'selected':''}>Completed</option>
                            <option ${r.status==='Pending'?'selected':''}>Pending</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-500 mb-1 block uppercase">Today's To-Do</label>
                        <textarea id="rp_todo" class="custom-input h-24 resize-none" placeholder="Enter task list...">${r.todo||''}</textarea>
                    </div>
                    <div>
                        <label class="text-[10px] text-emerald-500 mb-1 block uppercase">Work Summary</label>
                        <textarea id="rp_summary" class="custom-input h-32 resize-none" placeholder="Describe work results...">${r.summary||''}</textarea>
                    </div>
                    <div>
                        <label class="text-[10px] text-amber-500 mb-1 block uppercase">Admin Memo</label>
                        <textarea id="rp_memo" class="custom-input h-20 resize-none border-amber-500/20" placeholder="Private notes...">${r.adminMemo||''}</textarea>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3 mt-8">
                    <button onclick="saveReport('${date}','${staff}')"
                        class="col-span-2 bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-2xl transition-all shadow-lg shadow-blue-900/20">
                        SAVE CHANGES
                    </button>
                    <button onclick="closeReportDetail()"
                        class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 rounded-xl transition-all">
                        Cancel
                    </button>
                    <button onclick="deleteReport('${date}','${staff}')"
                        class="bg-rose-900/30 hover:bg-rose-600 text-rose-500 hover:text-white font-bold py-3 rounded-xl transition-all border border-rose-500/20">
                        Delete
                    </button>
                </div>
            </div>`;
        });
    }

    // HTML 요소의 onclick에서 접근할 수 있도록 전역으로 등록
    window.closeReportDetail = function() {
        document.getElementById("reportDetail").classList.add("hidden");
    };

    window.saveReport = function(date, staff){
        reportDb.ref(`reports/${date}/${staff}`).update({
            status: document.getElementById('rp_status').value,
            todo: document.getElementById('rp_todo').value,
            summary: document.getElementById('rp_summary').value,
            adminMemo: document.getElementById('rp_memo').value,
            lastModified: new Date().toISOString()
        }).then(() => {
            alert("Saved successfully");
            drawReportCalendar();
        });
    };

    window.deleteReport = function(date, staff){
        if(!confirm("Are you sure you want to delete this report?")) return;
        reportDb.ref(`reports/${date}/${staff}`).remove().then(() => {
            window.closeReportDetail();
            drawReportCalendar();
        });
    };

    // 최초 로드 시 실행
    drawReportCalendar();
})();
</script>
