<style>
    /* attendance 스타일과 통일 */
    .report-calendar-wrapper {
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
    }

    .report-table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed; /* 셀 크기 고정 */
    }

    .report-table th { 
        padding: 12px 0; 
        color: #64748b; 
        font-size: 0.75rem; 
        text-align: center; 
        font-weight: 800; 
        text-transform: uppercase;
        border-bottom: 1px solid #1e293b;
    }

    .report-table td { 
        height: 100px; 
        border: 1px solid #1e293b; 
        vertical-align: top; 
        padding: 8px; 
        position: relative; 
        transition: background 0.2s;
    }

    .report-table td:hover { 
        background-color: #0f172a; 
        cursor: pointer; 
    }

    /* 리포트 배지 스타일 (attendance의 시간 라벨 스타일 적용) */
    .report-item-badge {
        display: block;
        font-size: 0.65rem;
        font-weight: 800;
        padding: 2px 6px;
        margin-top: 3px;
        border-radius: 4px;
        background-color: rgba(59, 130, 246, 0.1);
        color: #3b82f6;
        border-left: 2px solid #3b82f6;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* 상세 패널 디자인 개선 */
    .detail-panel {
        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 24px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .custom-input {
        background: #1e293b;
        color: #f1f5f9;
        padding: 12px;
        border-radius: 12px;
        width: 100%;
        border: 1px solid transparent;
        transition: border 0.2s;
        font-size: 0.875rem;
    }

    .custom-input:focus {
        border-color: #3b82f6;
        outline: none;
    }

    label {
        font-weight: 800;
        letter-spacing: -0.025em;
    }
</style>

<div class="flex flex-col lg:flex-row gap-8 animate-fadeIn">

    <div class="flex-1 min-w-0">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-3xl font-black italic text-white">
                WORK <span class="text-emerald-500">REPORTS</span>
            </h2>
            <div class="text-slate-500 text-sm font-bold bg-slate-900 px-4 py-2 rounded-full border border-slate-800">
                Monthly Overview
            </div>
        </div>

        <div class="report-calendar-wrapper bg-slate-950 rounded-[2rem] border border-slate-800 overflow-hidden">
            <table class="report-table">
                <thead>
                    <tr class="bg-slate-900/50">
                        <th class="text-rose-500">Sun</th>
                        <th>Mon</th><th>Tue</th><th>Wed</th>
                        <th>Thu</th><th>Fri</th>
                        <th class="text-blue-500">Sat</th>
                    </tr>
                </thead>
                <tbody id="reportCalendarBody"></tbody>
            </table>
        </div>
    </div>

    <div id="reportDetail" class="w-full lg:w-[420px] hidden shrink-0">
        </div>

</div>

<script>
/** * 중복 선언 방지를 위해 즉시 실행 함수(IIFE)로 감쌉니다.
 * 이 안에서 선언된 변수는 이 페이지 안에서만 유효합니다.
 */
(function() {
    // 부모 창에 이미 정의된 db를 가져오거나, 없으면 새로 초기화합니다.
    const reportDb = window.db || firebase.database();
    let reportViewDate = new Date();

    // 부모 창에서 호출할 수 있도록 함수 등록
    window.renderWorkFull = function(){
        drawReportCalendar();
    };

    function drawReportCalendar(){
        const y = reportViewDate.getFullYear();
        const m = reportViewDate.getMonth();
        const first = new Date(y, m, 1).getDay();
        const last = new Date(y, m + 1, 0).getDate();

        reportDb.ref("reports").once("value", snap => {
            const data = snap.val() || {};
            const body = document.getElementById("reportCalendarBody");
            if(!body) return;
            body.innerHTML = "";
            let d = 1;

            for(let i = 0; i < 6; i++){
                const tr = document.createElement("tr");
                for(let j = 0; j < 7; j++){
                    const td = document.createElement("td");
                    if(i === 0 && j < first || d > last){
                        tr.appendChild(td); continue;
                    }

                    const date = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                    const reports = data[date] || {};
                    const isToday = new Date().toISOString().split('T')[0] === date;
                    if(isToday) td.style.backgroundColor = "rgba(59, 130, 246, 0.05)";

                    let html = `<div class="font-black text-[10px] ${isToday ? 'text-blue-500' : 'text-slate-600'} mb-1">${d}</div>`;
                    html += `<div class="flex flex-col gap-1">`;
                    html += Object.keys(reports).map(n => `
                        <div class="report-item-badge">${n}</div>
                    `).join('');
                    html += `</div>`;
                    
                    td.innerHTML = html;
                    td.onclick = () => openReportDetail(date, reports);
                    tr.appendChild(td);
                    d++;
                }
                body.appendChild(tr);
                if(d > last) break;
            }
        });
    }

    function openReportDetail(date, reports){
        const staff = Object.keys(reports)[0];
        if(!staff) return;

        reportDb.ref(`reports/${date}/${staff}`).once("value", snap => {
            const r = snap.val() || {};
            const box = document.getElementById("reportDetail");
            if(!box) return;
            box.classList.remove("hidden");

            box.innerHTML = `
            <div class="detail-panel p-6 sticky top-0">
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <h3 class="text-2xl font-black text-white">Report Detail</h3>
                        <p class="text-slate-500 text-xs font-bold uppercase">${date} / ${staff}</p>
                    </div>
                    <button onclick="closeReportDetail()" class="text-slate-500 hover:text-white transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="text-[10px] text-blue-500 mb-1 block uppercase">Status</label>
                        <select id="rp_status" class="custom-input font-bold text-blue-400">
                            <option ${r.status==='In Progress'?'selected':''}>In Progress</option>
                            <option ${r.status==='Completed'?'selected':''}>Completed</option>
                            <option ${r.status==='Pending'?'selected':''}>Pending</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-500 mb-1 block uppercase">Today's To-Do</label>
                        <textarea id="rp_todo" class="custom-input h-24 resize-none" placeholder="Enter task list...">${r.todo||''}</textarea>
                    </div>
                    <div>
                        <label class="text-[10px] text-emerald-500 mb-1 block uppercase">Work Summary</label>
                        <textarea id="rp_summary" class="custom-input h-32 resize-none" placeholder="Describe work results...">${r.summary||''}</textarea>
                    </div>
                    <div>
                        <label class="text-[10px] text-amber-500 mb-1 block uppercase">Admin Memo</label>
                        <textarea id="rp_memo" class="custom-input h-20 resize-none border-amber-500/20" placeholder="Private notes...">${r.adminMemo||''}</textarea>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3 mt-8">
                    <button onclick="saveReport('${date}','${staff}')"
                        class="col-span-2 bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-2xl transition-all shadow-lg shadow-blue-900/20">
                        SAVE CHANGES
                    </button>
                    <button onclick="closeReportDetail()"
                        class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 rounded-xl transition-all">
                        Cancel
                    </button>
                    <button onclick="deleteReport('${date}','${staff}')"
                        class="bg-rose-900/30 hover:bg-rose-600 text-rose-500 hover:text-white font-bold py-3 rounded-xl transition-all border border-rose-500/20">
                        Delete
                    </button>
                </div>
            </div>`;
        });
    }

    // HTML 요소의 onclick에서 접근할 수 있도록 전역으로 등록
    window.closeReportDetail = function() {
        document.getElementById("reportDetail").classList.add("hidden");
    };

    window.saveReport = function(date, staff){
        reportDb.ref(`reports/${date}/${staff}`).update({
            status: document.getElementById('rp_status').value,
            todo: document.getElementById('rp_todo').value,
            summary: document.getElementById('rp_summary').value,
            adminMemo: document.getElementById('rp_memo').value,
            lastModified: new Date().toISOString()
        }).then(() => {
            alert("Saved successfully");
            drawReportCalendar();
        });
    };

    window.deleteReport = function(date, staff){
        if(!confirm("Are you sure you want to delete this report?")) return;
        reportDb.ref(`reports/${date}/${staff}`).remove().then(() => {
            window.closeReportDetail();
            drawReportCalendar();
        });
    };

    // 최초 로드 시 실행
    drawReportCalendar();
})();
</script>
