<style>
    .report-calendar-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .report-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .report-table th { padding: 12px 0; color: #64748b; font-size: 0.75rem; text-align: center; font-weight: 800; text-transform: uppercase; border-bottom: 1px solid #1e293b; }
    .report-table td { height: 100px; border: 1px solid #1e293b; vertical-align: top; padding: 8px; position: relative; transition: background 0.2s; }
    .report-table td:hover { background-color: #0f172a; cursor: pointer; }
    .report-item-badge { display: block; font-size: 0.65rem; font-weight: 800; padding: 2px 6px; margin-top: 3px; border-radius: 4px; background-color: rgba(59, 130, 246, 0.1); color: #3b82f6; border-left: 2px solid #3b82f6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* 상세 패널 스타일 수정: 화면에 고정되고 내부 스크롤 지원 */
.detail-panel {
    background: #0f172a;
    border: 1px solid #1e293b;
    border-radius: 24px;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    /* 핵심 속성 */
    position: sticky;
    top: 20px;
    max-height: calc(100vh - 40px); /* 화면 높이에서 상하 여백 제외 */
    display: flex;
    flex-direction: column;
}

/* 내부 콘텐츠 영역 스크롤 설정 */
.detail-content-scroll {
    overflow-y: auto;
    flex: 1;
    padding-right: 8px; /* 스크롤바 겹침 방지 */
}

/* 스크롤바 디자인 (다크모드 최적화) */
.detail-content-scroll::-webkit-scrollbar { width: 6px; }
.detail-content-scroll::-webkit-scrollbar-track { background: transparent; }
.detail-content-scroll::-webkit-scrollbar-thumb { 
    background: #1e293b; 
    border-radius: 10px; 
}
.detail-content-scroll::-webkit-scrollbar-thumb:hover { background: #334155; }
    .custom-input { background: #1e293b; color: #f1f5f9; padding: 12px; border-radius: 12px; width: 100%; border: 1px solid transparent; transition: border 0.2s; font-size: 0.875rem; }
    .custom-input:focus { border-color: #3b82f6; outline: none; }
    label { font-weight: 800; letter-spacing: -0.025em; }
    .nav-btn:hover { background-color: #1e293b; color: #3b82f6; }
    #currentReportMonthYear { min-width: 150px; }
/* 주말 전용 배경색 */
    .report-table td.sunday-cell { background-color: rgba(244, 63, 94, 0.03); }
    .report-table td.saturday-cell { background-color: rgba(59, 130, 246, 0.03); }
    
    /* 호버 시 주말 색상 유지 및 강조 */
    .report-table td.sunday-cell:hover { background-color: rgba(244, 63, 94, 0.08); }
    .report-table td.saturday-cell:hover { background-color: rgba(59, 130, 246, 0.08); }

    /* 주말 날짜 숫자 색상 */
    .text-sunday-bright { color: #fb7185 !important; } /* 연한 빨강 */
    .text-saturday-bright { color: #60a5fa !important; } /* 연한 파랑 */
/* 리포트 호버 팝업 스타일 */
#reportHoverPopup {
    position: fixed;
    z-index: 10000;
    pointer-events: none; /* 마우스 이벤트를 방해하지 않음 */
    background: #1e293b;
    border: 1px solid #3b82f6;
    padding: 12px;
    border-radius: 12px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    width: 250px;
    display: none;
    font-size: 0.75rem;
    color: #f1f5f9;
}
.popup-label { color: #64748b; font-weight: 800; font-size: 0.65rem; text-transform: uppercase; margin-bottom: 2px; display: block; }
/* 기존 스타일 시트에서 수정 */
.popup-content { 
    margin-bottom: 8px; 
    white-space: pre-wrap; /* 줄바꿈과 공백 유지 */
    word-break: break-all; 
    color: #3b82f6; 
    line-height: 1.4; /* 가독성을 위한 줄간격 추가 */
}
/* 상세 패널 부모 컨테이너 보정 */
#reportDetail {
    transition: all 0.3s ease;
    min-width: 380px; /* 너무 좁아지지 않게 최소 너비 설정 */
}

/* 상세 패널 내부 스타일 */
.detail-panel {
    background: #0f172a;
    border: 1px solid #1e293b;
    border-radius: 24px;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    position: sticky;
    top: 20px;
    max-height: calc(100vh - 40px);
    display: flex;
    flex-direction: column;
    width: 100%; /* 부모 너비를 가득 채움 */
}

/* 입력 필드 가독성 향상 */
.custom-input {
    line-height: 1.5;
    font-family: inherit;
}
/* 토/일 열 너비 축소 */
.report-table col.weekend { width: 5%; }
.report-table col.weekday { width: calc((100% - 10%) / 5); }
.report-table td.sunday-cell,
.report-table td.saturday-cell { width: 5%; padding: 4px 2px; }
.report-table td.sunday-cell .text-sunday-bright,
.report-table td.saturday-cell .text-saturday-bright { font-size: 8px; }
/* Admin Memo 퀵 리플라이 스타일 */
.memo-quick-reply-container { position: relative; }
.memo-quick-reply-list {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: #1e293b;
    border: 1px solid #3b82f6;
    border-radius: 8px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    max-height: 150px;
    overflow-y: auto;
    z-index: 50;
    display: none;
    margin-top: 4px;
}
/* 퀵 리플라이 스크롤바 디자인 */
.memo-quick-reply-list::-webkit-scrollbar { width: 6px; }
.memo-quick-reply-list::-webkit-scrollbar-track { background: transparent; }
.memo-quick-reply-list::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
.memo-quick-reply-item {
    padding: 8px 12px;
    font-size: 0.75rem;
    color: #f1f5f9;
    cursor: pointer;
    border-bottom: 1px solid #0f172a;
    transition: background 0.2s;
}
.memo-quick-reply-item:last-child { border-bottom: none; }
.memo-quick-reply-item:hover { background-color: #3b82f6; color: white; }
</style>

<script>
(function() {

// Admin Memo 자동 완성 멘트 리스트
    window.memoQuickReplies = [
        "Great job today, thank you!",
        "Thanks for your hard work on this.",
        "Excellent progress, keep it up!",
        "I appreciate your dedication.",
        "Well done completing these tasks.",
        "Thank you for the detailed report.",
        "Good work handling this efficiently.",
        "Thanks for staying on top of things.",
        "Awesome effort today, thanks!",
        "Your hard work is much appreciated!",
"오늘도 정말 수고 많으셨습니다. 감사합니다!",
"꼼꼼하게 진행해 주셔서 감사합니다. 고생하셨어요!",
"훌륭한 성과네요! 이 흐름대로 계속 화이팅입니다.",
"언제나 책임감을 가지고 임해 주셔서 진심으로 감사드립니다.",
"오늘 목표한 업무들을 깔끔하게 마무리해 주셨네요. 수고하셨습니다!",
"자세하고 명확한 업무 보고 감사합니다. 리포트가 보기 좋네요.",
"이슈를 신속하고 효율적으로 처리해 주셔서 감사합니다. 좋은 성과입니다!",
"놓치는 부분 없이 꼼꼼하게 챙겨주셔서 늘 든든합니다. 고생하셨습니다.",
"오늘 보여주신 멋진 추진력에 감사드립니다. 수고하셨어요!",
"작은 부분까지 신경 써서 업무 진행해 주신 점 깊이 감사드립니다."
    ];

    // 선택한 멘트를 텍스트 영역에 추가하는 함수
    window.insertQuickReply = function(text) {
        const memoEl = document.getElementById('rp_memo');
        if(memoEl) {
            // 기존 내용이 있으면 줄바꿈 후 추가
            if(memoEl.value && !memoEl.value.endsWith('\n')) {
                memoEl.value += '\n';
            }
            memoEl.value += text;
            window.autoResize(memoEl); // 높이 자동 조절 트리거
            document.getElementById('memoQuickReplyList').style.display = 'none'; // 리스트 숨기기
        }
    };

    window._reportPopupData = {};  // ← 이 줄 추가

    const reportDb = window.db || firebase.database();
    let reportViewDate = new Date();

window.autoResize = function(el) {
        if (!el) return;
        el.style.height = 'auto';
        el.style.height = (el.scrollHeight) + 'px';
    };

    window.renderWorkFull = function(){
        updateMonthTitle();
        drawReportCalendar();
    };

    // 팝업 표시 함수
    window.showReportPopup = function(event, todo, summary) {
        const popup = document.getElementById('reportHoverPopup');
        if(!popup) return;
        
        popup.innerHTML = `
            <span class="popup-label">To-Do</span>
            <div class="popup-content">${stripHtml(todo) || 'No data'}</div>
            <span class="popup-label" style="color:#10b981">Summary</span>
            <div class="popup-content" style="color:#f1f5f9">${stripHtml(summary) || 'No data'}</div>
        `;
        
        popup.style.display = 'block';
        moveReportPopup(event);
    };

window.showReportPopupByKey = function(event, key) {
    const data = window._reportPopupData && window._reportPopupData[key];
    if (!data) return;
    window.showReportPopup(event, data.todo, data.summary);
};

    // 팝업 위치 이동
    window.moveReportPopup = function(event) {
        const popup = document.getElementById('reportHoverPopup');
        if(!popup) return;
        popup.style.left = (event.clientX + 15) + 'px';
        popup.style.top = (event.clientY + 15) + 'px';
    };

    // 팝업 숨기기
    window.hideReportPopup = function() {
        const popup = document.getElementById('reportHoverPopup');
        if(popup) popup.style.display = 'none';
    };

    function updateMonthTitle() {
        const titleBox = document.getElementById('currentReportMonthYear');
        if(titleBox) {
            titleBox.innerText = reportViewDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
        }
    }

    window.changeReportMonth = function(offset) {
        reportViewDate.setMonth(reportViewDate.getMonth() + offset);
        window.renderWorkFull();
    };

    window.goReportToday = function() {
        reportViewDate = new Date();
        window.renderWorkFull();
    };

    // [수정] 오류 발생 지점 방어 코드 추가
    const monthInput = document.getElementById('exportMonth');
    if(monthInput) {
        const now = new Date();
        const currentMonthStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
        monthInput.value = currentMonthStr;
        monthInput.setAttribute('lang', 'en-US');
    }

    function drawReportCalendar() {
        const y = reportViewDate.getFullYear();
        const m = reportViewDate.getMonth();
        const first = new Date(y, m, 1).getDay();
        const last = new Date(y, m + 1, 0).getDate();
        
        reportDb.ref("reports").once("value", snap => {
            const body = document.getElementById("reportCalendarBody");
            if (!body) return;
            const data = snap.val() || {};
            body.innerHTML = "";
            let d = 1;
            
            for (let i = 0; i < 6; i++) {
                const tr = document.createElement("tr");
                for (let j = 0; j < 7; j++) {
                    const td = document.createElement("td");
                    
                    if (i === 0 && j < first || d > last) {
                        tr.appendChild(td);
                        continue;
                    }
                    
                    const date = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    const reports = data[date] || {};
                    const isToday = new Date().toISOString().split('T')[0] === date;
                    
if (isToday) td.classList.add('bg-blue-500/5');
else if (j === 0) td.classList.add('sunday-cell');
else if (j === 6) td.classList.add('saturday-cell');

let dateColorClass = isToday ? 'text-blue-500' : (j === 0 ? 'text-sunday-bright' : (j === 6 ? 'text-saturday-bright' : 'text-slate-600'));

let html = `<div class="font-black text-[10px] ${dateColorClass} mb-1 flex items-center gap-1">
    ${d}
    ${isToday ? '<span style="font-size:7px;font-weight:900;background:#3b82f6;color:white;padding:1px 4px;border-radius:3px;letter-spacing:0.05em;">TODAY</span>' : ''}
</div>`;

                    html += `<div class="flex flex-col gap-1 overflow-hidden">`;
// 전역 팝업 데이터 저장소 초기화
window._reportPopupData = window._reportPopupData || {};

html += Object.keys(reports).map(n => {
    const r = reports[n];
    const key = `${date}_${n}`;
    
    // 인라인 속성 대신 전역 객체에 저장
    window._reportPopupData[key] = {
        todo: stripHtml(r.todo || ''),
        summary: stripHtml(r.summary || '')
    };

    return `
        <div class="report-item-badge text-[9px] truncate cursor-pointer hover:bg-blue-500/20" 
             onclick="event.stopPropagation(); openReportDetail('${date}', '${n}')"
             onmouseenter="showReportPopupByKey(event, '${key}')"
             onmousemove="moveReportPopup(event)"
             onmouseleave="hideReportPopup()">
             ${n}
        </div>
    `;
}).join('');

                    html += `</div>`;
                    
                    td.innerHTML = html;
td.onclick = (e) => {
    // 이미 배지를 클릭했다면 중복 실행 방지
    if (e.target.classList.contains('report-item-badge')) return;
    
    const staffNames = Object.keys(reports);
    if (staffNames.length > 0) {
        // 해당 날짜의 첫 번째 스태프 리포트를 즉시 오픈
        openReportDetail(date, staffNames[0]);
    }
};
                    tr.appendChild(td);
                    d++;
                }
                body.appendChild(tr);
                if (d > last) break;
            }
        });
    }

    window.exportWorkReport = function(type) {
        let monthVal = "", monthLabel = "";
        if (type === 'monthly') {
            const y = document.getElementById('exportMonthYear').value;
            const m = document.getElementById('exportMonthOnly').value;
            const mText = document.getElementById('exportMonthOnly').options[document.getElementById('exportMonthOnly').selectedIndex].text;
            monthVal = `${y}-${m}`;
            monthLabel = `${y}_${mText}`;
        }
        const yearVal = document.getElementById('exportYear').value;
        const todayStr = new Date().toISOString().split('T')[0];
        reportDb.ref("reports").once("value", snap => {
            const allData = snap.val() || {};
            let exportData = [];
            const dates = Object.keys(allData).sort();
            dates.forEach(date => {
                if (type === 'monthly' && !date.startsWith(monthVal)) return;
                if (type === 'yearly' && !date.startsWith(yearVal)) return;
                const staffRecords = allData[date];
                Object.keys(staffRecords).forEach(staff => {
                    const r = staffRecords[staff];
                    exportData.push({
                        "DATE": date, "STAFF NAME": staff, "STATUS": r.status || '-', "TODO LIST": r.todo || '', 
                        "WORK SUMMARY": r.summary || '', "ADMIN MEMO": r.adminMemo || '', 
                        "LAST MODIFIED": r.lastModified ? r.lastModified.split('T')[0] : '-'
                    });
                });
            });
            if (exportData.length === 0) return alert("No records found.");
            const worksheet = XLSX.utils.json_to_sheet(exportData);
            if (worksheet['!ref']) {
                const range = XLSX.utils.decode_range(worksheet['!ref']);
                for (let R = range.s.r; R <= range.e.r; ++R) {
                    for (let C = range.s.c; C <= range.e.c; ++C) {
                        const cell_ref = XLSX.utils.encode_cell({ c: C, r: R });
                        if (worksheet[cell_ref]) worksheet[cell_ref].s = { alignment: { wrapText: true, vertical: 'top', horizontal: 'left' } };
                    }
                }
            }
            worksheet['!cols'] = [{wch: 12}, {wch: 15}, {wch: 12}, {wch: 45}, {wch: 55}, {wch: 35}, {wch: 15}];
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "WorkReports");
            let filename = type === 'overall' ? `WorkReport_overall_${todayStr}` : (type === 'yearly' ? `WorkReport_yearly_${yearVal}_${todayStr}` : `WorkReport_monthly_${monthLabel}_${todayStr}`);
            XLSX.writeFile(workbook, `${filename}.xlsx`);
        });
    };

// HTML 태그를 제거하는 헬퍼 함수
function stripHtml(html) {
    let tmp = document.createElement("DIV");
    tmp.innerHTML = html;
    return tmp.textContent || tmp.innerText || "";
}

window.openReportDetail = function(date, staff) {
        if (!staff) return;
        reportDb.ref(`reports/${date}/${staff}`).once("value", snap => {
            const r = snap.val() || {};
            const box = document.getElementById("reportDetail");
            if (!box) return;

            const cleanTodo = stripHtml(r.todo || '');
            const cleanSummary = stripHtml(r.summary || '');

            box.classList.remove("hidden");
            
            if (window.innerWidth < 1024) {
                box.scrollIntoView({ behavior: 'smooth' });
            }

            box.innerHTML = `
            <div class="detail-panel p-6 animate-fadeIn">
                <div class="flex justify-between items-start mb-5">
                    <div>
                        <h3 class="text-2xl font-black text-white leading-tight">Report Detail</h3>
                        <p class="text-emerald-500 text-xs font-bold uppercase tracking-wider">${date} / ${staff}</p>
                    </div>
                    <button onclick="closeReportDetail()" class="p-2 text-slate-500 hover:text-white hover:bg-slate-800 rounded-full transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
                
                <div class="detail-content-scroll space-y-5 pr-2">
                    <div>
                        <label class="text-[11px] text-blue-400 mb-2 block uppercase font-black tracking-widest">Work Status</label>
                        <select id="rp_status" class="custom-input !py-3 font-bold text-blue-100 border-slate-700 bg-slate-900/50">
                            <option ${r.status==='In Progress'?'selected':''}>In Progress</option>
                            <option ${r.status==='Completed'?'selected':''}>Completed</option>
                            <option ${r.status==='Pending'?'selected':''}>Pending</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="text-[11px] text-slate-400 mb-2 block uppercase font-black tracking-widest">Today's To-Do</label>
                        <textarea id="rp_todo" 
                            oninput="window.autoResize(this)" 
                            class="custom-input h-auto resize-none text-sm leading-relaxed overflow-hidden" 
                            placeholder="Enter tasks...">${cleanTodo}</textarea>
                    </div>
                    
                    <div>
                        <label class="text-[11px] text-emerald-400 mb-2 block uppercase font-black tracking-widest">Work Summary</label>
                        <textarea id="rp_summary" 
                            oninput="window.autoResize(this)" 
                            class="custom-input h-auto resize-none text-sm leading-relaxed overflow-hidden" 
                            placeholder="Describe work done...">${cleanSummary}</textarea>
                    </div>
                    
<div class="memo-quick-reply-container">
                        <label class="text-[11px] text-amber-400 mb-2 block uppercase font-black tracking-widest">Admin Memo</label>
                        <textarea id="rp_memo" 
                            oninput="window.autoResize(this)" 
                            onfocus="document.getElementById('memoQuickReplyList').style.display='block'"
                            onblur="setTimeout(() => document.getElementById('memoQuickReplyList').style.display='none', 200)"
                            class="custom-input h-auto resize-none border-amber-500/10 text-sm bg-amber-500/5 overflow-hidden relative z-10" 
                            placeholder="Admin notes here...">${r.adminMemo||''}</textarea>
                        
<div id="memoQuickReplyList" class="memo-quick-reply-list">
    ${window.memoQuickReplies.map(reply => `<div class="memo-quick-reply-item" onmousedown="insertQuickReply('${reply}'); event.preventDefault();">${reply}</div>`).join('')}
</div>

                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3 mt-6 pt-5 border-t border-slate-800/50">
                    <button onclick="saveReport('${date}','${staff}')" class="col-span-2 bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-2xl transition-all shadow-xl shadow-blue-900/40 text-sm tracking-widest uppercase">Save All Changes</button>
                    <button onclick="closeReportDetail()" class="bg-slate-800 hover:bg-slate-700 text-slate-400 font-bold py-3 rounded-xl transition-all text-xs">Close</button>
                    <button onclick="deleteReport('${date}','${staff}')" class="bg-rose-950/30 hover:bg-rose-600 text-rose-500 hover:text-white font-bold py-3 rounded-xl transition-all border border-rose-500/10 text-xs">Delete Record</button>
                </div>
            </div>`;

            // [핵심] 데이터 렌더링 직후 높이 자동 조절 실행
            setTimeout(() => {
                window.autoResize(document.getElementById('rp_todo'));
                window.autoResize(document.getElementById('rp_summary'));
                window.autoResize(document.getElementById('rp_memo'));
            }, 10);
        });
    };

    window.closeReportDetail = function() { document.getElementById("reportDetail").classList.add("hidden"); };
    window.saveReport = function(date, staff){
        reportDb.ref(`reports/${date}/${staff}`).update({
            status: document.getElementById('rp_status').value,
            todo: document.getElementById('rp_todo').value,
            summary: document.getElementById('rp_summary').value,
            adminMemo: document.getElementById('rp_memo').value,
            lastModified: new Date().toISOString()
        }).then(() => { alert("Saved successfully"); drawReportCalendar(); });
    };
    window.deleteReport = function(date, staff){
        if(!confirm("Are you sure?")) return;
        reportDb.ref(`reports/${date}/${staff}`).remove().then(() => { window.closeReportDetail(); drawReportCalendar(); });
    };

    drawReportCalendar();
    updateMonthTitle();
})();
</script>
