<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Login - Daily Report System</title>

    <script src="https://cdn.tailwindcss.com?hide-warnings=true"></script>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-database-compat.js"></script>

    <!--
        Day theme fonts:
        MON Deep Space -> Orbitron | TUE Wabi-Sabi -> Noto Serif JP | WED Art Deco -> Cormorant Garamond
        THU Biophilic -> DM Serif Display | FRI Synthwave -> Bungee | SAT Arctic Steel -> Rajdhani | SUN Sunset Ember -> Playfair Display

        NOTE ON CREATURES: the roaming background creatures are original, per-day designs
        (not reproductions of any licensed characters). Each has its own multi-color
        gradient fill so it reads as a distinct "monster" per weekday theme.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Serif+JP:wght@400;700;900&family=Cormorant+Garamond:wght@400;600;700&family=DM+Serif+Display&family=Bungee&family=Rajdhani:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,600&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <link rel="icon" href="data:,">

<script>
    /* ── DEVICE / ENVIRONMENT DETECTION ──────────────────────────────
       Keeps the existing mobile-page redirect (index_m.html) intact,
       but also exposes a finer-grained "viewport class" on <html> so
       the CSS below can optimize tablets and small phones separately
       from the redirect, without touching the redirect logic itself. */
    (function(){
        const isMobileDevice = /iPhone|iPod|Android|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const urlParams = new URLSearchParams(window.location.search);
        const isPCMode = urlParams.get('view_mode') === 'pc';
        if (isMobileDevice && !isPCMode) {
            let path = window.location.pathname;
            let page = path.split("/").pop();
            if (page === "" || page === "index.html") {
                window.location.href = "index_m.html";
            }
        }

        function applyViewportClass(){
            const w = window.innerWidth;
            let cls = 'vp-desktop';
            if (w < 480) cls = 'vp-phone';
            else if (w < 768) cls = 'vp-phone-lg';
            else if (w < 1024) cls = 'vp-tablet';
            else if (w < 1440) cls = 'vp-desktop';
            else cls = 'vp-desktop-xl';
            document.documentElement.classList.remove('vp-phone','vp-phone-lg','vp-tablet','vp-desktop','vp-desktop-xl');
            document.documentElement.classList.add(cls);
            document.documentElement.classList.toggle('vp-coarse', matchMedia('(pointer: coarse)').matches);
        }
        applyViewportClass();
        window.addEventListener('resize', applyViewportClass, { passive: true });
        window.addEventListener('orientationchange', applyViewportClass, { passive: true });
    })();
</script>

<style>
/* ═══════════════════════════════════════════════════════════════
   BASE RESET & LAYOUT
   All animation below uses only transform / opacity so the browser
   compositor handles it on the GPU -- no layout/paint thrash, no JS
   rAF loops, so CPU load stays flat regardless of theme.
═══════════════════════════════════════════════════════════════ */
*, *::before, *::after {
    box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

html, body { background: #030308; }

body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: clamp(1rem, 4vw, 2rem);
    overflow-x: hidden;
    color: var(--text, #e2e8f0);
    background-color: var(--bg-base, #030308);
    background-image: var(--bg-image, none);
    font-family: var(--font-body, 'Pretendard', 'Inter', sans-serif);
    transition: background-color 0.6s ease, color 0.6s ease;
    position: relative;
    perspective: 1200px;
    isolation: isolate;
}

@media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}

/* Pause all ambient/compositor animation when the tab is hidden or the
   browser flags a low-power / coarse-only context that struggles with
   many concurrent GPU layers -- this is the main CPU/GPU cost lever. */
body.anim-paused .bg-monster,
body.anim-paused .brand-text3d,
body.anim-paused .orb,
body.anim-paused .scan-line,
body.anim-paused .login-card {
    animation-play-state: paused !important;
}

.page-wrapper {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(1.5rem, 4vw, 2.5rem);
    position: relative;
    z-index: 10;
}

@media (min-width: 768px) {
    .page-wrapper { max-width: 500px; }
}
@media (min-width: 1024px) {
    .page-wrapper { max-width: 520px; }
    .login-card { padding: 3rem !important; }
    body { padding: 2rem; }
}
@media (min-width: 1440px) {
    .page-wrapper { max-width: 560px; }
}
@media (max-width: 360px) {
    .page-wrapper { gap: 1.1rem; }
    .login-card { border-radius: 1.1rem !important; }
}

/* ═══════════════════════════════════════════════════════════════
   GENERIC COMPONENTS -- themed purely through CSS custom properties
   set by each `body.day-*` rule further down. One ruleset, seven
   looks; keeps the stylesheet small and cheap to parse.
═══════════════════════════════════════════════════════════════ */
.login-card {
    width: 100%;
    border-radius: var(--card-radius, 1.75rem);
    padding: clamp(1.5rem, 5vw, 2.5rem);
    position: relative;
    overflow: hidden;
    background: var(--card-bg);
    border: var(--card-border);
    box-shadow: var(--card-shadow);
    transform-style: preserve-3d;
    animation: cardUp3d 0.9s cubic-bezier(0.34,1.56,0.64,1) both, cardFloat 7s ease-in-out infinite 1s;
}
.login-card::before {
    content: var(--card-frame, none);
    position: absolute;
    inset: 6px;
    border: var(--card-frame-border, none);
    pointer-events: none;
}
.login-card::after {
    /* subtle holographic sweep across the card edge -- one element, one animation */
    content: '';
    position: absolute;
    inset: -40%;
    background: var(--card-sheen, linear-gradient(115deg, transparent 40%, rgba(255,255,255,0.06) 50%, transparent 60%));
    transform: translateX(-60%);
    animation: sheenSweep 6s ease-in-out infinite;
    pointer-events: none;
}
@keyframes sheenSweep {
    0%, 100% { transform: translateX(-60%); }
    50% { transform: translateX(60%); }
}

@keyframes cardUp3d {
    from { opacity: 0; transform: translateY(60px) rotateX(12deg) scale(0.94); }
    to   { opacity: 1; transform: translateY(0) rotateX(0deg) scale(1); }
}
@keyframes cardFloat {
    0%, 100% { transform: translateY(0) rotateX(0deg); }
    50%      { transform: translateY(-6px) rotateX(0.6deg); }
}

.field-label {
    display: block;
    font-size: clamp(0.6rem, 2vw, 0.7rem);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    margin-bottom: 0.5rem;
    margin-left: 0.25rem;
    font-family: var(--font-heading);
    color: var(--label-color);
}

.field-wrap { margin-bottom: clamp(1rem, 3vw, 1.5rem); }

.input-field, #selected-staff {
    width: 100%;
    padding: clamp(0.75rem, 2.5vw, 1rem) clamp(1rem, 3vw, 1.25rem);
    font-size: 16px; /* prevent zoom on iOS */
    border-radius: var(--input-radius, 1rem);
    border: var(--input-border);
    outline: none;
    background: var(--input-bg);
    color: var(--text);
    box-shadow: var(--input-shadow);
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
    display: block;
}
.input-field::placeholder { color: var(--placeholder-color); }
.input-field:focus, #selected-staff:hover, #selected-staff.active {
    border-color: var(--accent) !important;
    box-shadow: var(--input-shadow-focus) !important;
}
.input-field:focus-visible, #selected-staff:focus-visible, .login-btn:focus-visible, .eye-btn:focus-visible, .forgot-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
}

.password-wrap { position: relative; }
.eye-btn {
    position: absolute; right: 1rem; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; padding: 0.25rem; line-height: 1;
    color: var(--label-color); transition: color 0.2s, opacity 0.2s;
    z-index: 5;
}
.eye-btn:hover { color: var(--accent); }

.forgot-row { display: flex; justify-content: flex-end; margin-top: 0.5rem; }
.forgot-btn {
    background: none; border: none; cursor: pointer;
    font-size: clamp(0.6rem, 2vw, 0.7rem); font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.15em; padding: 0.25rem 0;
    color: var(--accent);
}

.login-btn {
    width: 100%;
    padding: clamp(0.875rem, 2.5vw, 1rem) 2rem;
    border: none; cursor: pointer;
    font-family: var(--font-heading);
    font-size: clamp(0.75rem, 2.5vw, 0.9rem);
    font-weight: 900; letter-spacing: 0.2em;
    border-radius: var(--input-radius, 1rem);
    background: var(--btn-bg);
    background-size: 220% 220%;
    color: var(--btn-text, #000);
    box-shadow: var(--btn-shadow);
    transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.35s ease, background-position 0.6s ease;
    margin-top: clamp(0.75rem, 2.5vw, 1rem);
}
.login-btn:hover { transform: translateY(-3px) scale(1.02); background-position: 100% 50%; box-shadow: var(--btn-shadow-hover); }
.login-btn:active { transform: translateY(-1px) scale(0.98); }

/* Staff selector dropdown */
#staff-selector-container { position: relative; }
#selected-staff { cursor: pointer; display: flex; align-items: center; justify-content: space-between; min-height: 3.25rem; }
#staff-dropdown {
    position: absolute; top: calc(100% + 0.5rem); left: 0; right: 0;
    max-height: 0; overflow-y: auto; overflow-x: hidden;
    border-radius: var(--input-radius, 1rem);
    background: var(--dropdown-bg);
    border: var(--input-border);
    box-shadow: var(--card-shadow);
    transition: max-height 0.35s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s ease;
    opacity: 0; pointer-events: none; z-index: 10000;
}
#staff-dropdown.active { max-height: 240px; opacity: 1; pointer-events: auto; padding: 0.5rem; }
#staff-dropdown::-webkit-scrollbar { width: 5px; }
#staff-dropdown::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 10px; }
#staff-dropdown::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

.staff-option {
    padding: 0.875rem 1rem; cursor: pointer; border-radius: 0.75rem;
    display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.25rem;
    transition: background-color 0.15s ease;
}
.staff-option:hover { background: var(--option-hover); }
.staff-option.selected { background: var(--option-selected); border-left: 3px solid var(--accent); }
.staff-avatar {
    width: 2.25rem; height: 2.25rem; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.9rem; flex-shrink: 0;
    background: var(--avatar-bg); color: var(--avatar-text, #000);
}
.staff-name { flex: 1; font-weight: 600; font-size: 0.9rem; color: var(--text); }
.staff-role-badge { font-size: 0.65rem; padding: 0.25rem 0.5rem; border-radius: 0.4rem; font-weight: 700; background: var(--badge-bg); color: var(--accent); border: 1px solid var(--badge-border); }
#selected-text { color: var(--text-dim); }
#selected-staff .dropdown-arrow { color: var(--accent); transition: transform 0.3s ease; flex-shrink: 0; width: 1.1rem; height: 1.1rem; }
#selected-staff .dropdown-arrow.rotated { transform: rotate(180deg); }

.day-badge {
    font-size: clamp(0.55rem, 2vw, 0.65rem); font-weight: 800; letter-spacing: 0.25em;
    text-transform: uppercase; padding: 0.35rem 0.9rem; border-radius: 2rem; display: inline-block;
    background: var(--badge-bg); color: var(--accent); border: 1px solid var(--badge-border);
    font-family: var(--font-heading);
}

.logo-img { width: clamp(3.5rem, 10vw, 5rem); height: clamp(3.5rem, 10vw, 5rem); object-fit: contain; border-radius: 1.25rem; display: block; margin: 0 auto clamp(0.75rem, 2.5vw, 1rem); }

.page-title {
    font-family: var(--font-heading);
    font-size: clamp(1.6rem, 5.5vw, 2.5rem); font-weight: 900; line-height: 1.1; margin: 0 0 0.35rem;
    background: var(--title-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    filter: var(--title-glow, none);
}
.page-subtitle { font-size: clamp(0.6rem, 2vw, 0.7rem); font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; margin: 0; color: var(--subtitle-color); font-family: var(--font-heading); }
.welcome-heading { font-size: clamp(1rem, 3.5vw, 1.35rem); font-weight: 900; margin: 0 0 0.35rem; color: var(--text); font-family: var(--font-heading); }
.welcome-sub { font-size: clamp(0.75rem, 2.5vw, 0.85rem); margin: 0 0 clamp(1.25rem, 4vw, 2rem); color: var(--text-dim); }

/* Card entrance for header */
@keyframes cardUp {
    from { opacity: 0; transform: translateY(50px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}
.animate-up { opacity: 0; animation: cardUp 0.7s cubic-bezier(0.34,1.56,0.64,1) forwards; }
.animate-up:nth-child(1) { animation-delay: 0.1s; }
.animate-up:nth-child(2) { animation-delay: 0.25s; }

/* ═══════════════════════════════════════════════════════════════
   FLOATING 3D "TDLiD" BRAND TEXT
   Pure CSS transform animation -- one element, GPU-composited only.
═══════════════════════════════════════════════════════════════ */
.brand-text3d {
    position: fixed;
    top: 8%;
    left: 50%;
    width: 100%;
    text-align: center;
    pointer-events: none;
    z-index: 0;
    transform-style: preserve-3d;
    font-size: clamp(3rem, 17vw, 11rem);
    font-weight: 900;
    letter-spacing: 0.08em;
    white-space: nowrap;
    font-family: var(--font-heading);
    background: var(--brand-gradient);
    background-size: 200% 200%;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    opacity: var(--brand-opacity, 0.16);
    animation: var(--brand-anim, brandDriftMon) var(--brand-duration, 16s) ease-in-out infinite,
               brandGradShift 9s ease-in-out infinite;
}
@keyframes brandGradShift {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
}
/* One distinct 3D drift style per day -- picked via --brand-anim in each body.day-* block */
@keyframes brandDriftMon {
    0%   { transform: translate(-50%, 0) rotateY(0deg) rotateX(4deg); }
    25%  { transform: translate(-50%, 18px) rotateY(10deg) rotateX(-2deg); }
    50%  { transform: translate(-50%, -8px) rotateY(0deg) rotateX(6deg); }
    75%  { transform: translate(-50%, 14px) rotateY(-10deg) rotateX(-2deg); }
    100% { transform: translate(-50%, 0) rotateY(0deg) rotateX(4deg); }
}
@keyframes brandSwayTue {
    0%, 100% { transform: translate(-50%, 0) rotateZ(-1deg) rotateX(2deg); }
    50%      { transform: translate(-50%, 10px) rotateZ(1deg) rotateX(-2deg); }
}
@keyframes brandSpinWed {
    0%, 100% { transform: translate(-50%, 0) rotateY(0deg) scale(1); }
    50%      { transform: translate(-50%, -6px) rotateY(180deg) scale(1.03); }
}
@keyframes brandWindThu {
    0%, 100% { transform: translate(-50%, 0) rotateZ(0deg) skewX(0deg); }
    30%      { transform: translate(-50%, 10px) rotateZ(-2deg) skewX(3deg); }
    60%      { transform: translate(-50%, -6px) rotateZ(2deg) skewX(-3deg); }
}
@keyframes brandBounceFri {
    0%, 100% { transform: translate(-50%, 0) rotateZ(-2deg) scale(1); }
    25%      { transform: translate(-50%, -14px) rotateZ(2deg) scale(1.02); }
    50%      { transform: translate(-50%, 6px) rotateZ(-3deg) scale(0.99); }
    75%      { transform: translate(-50%, -10px) rotateZ(3deg) scale(1.03); }
}
@keyframes brandMechSat {
    0%, 20%  { transform: translate(-50%, 0) rotateY(0deg); }
    25%, 45% { transform: translate(-50%, 0) rotateY(8deg); }
    50%, 70% { transform: translate(-50%, 0) rotateY(0deg); }
    75%, 95% { transform: translate(-50%, 0) rotateY(-8deg); }
    100%     { transform: translate(-50%, 0) rotateY(0deg); }
}
@keyframes brandRiseSun {
    0%, 100% { transform: translate(-50%, 10px) rotateX(4deg) scale(1); opacity: 0.14; }
    50%      { transform: translate(-50%, -14px) rotateX(-2deg) scale(1.03); opacity: 0.2; }
}

/* ═══════════════════════════════════════════════════════════════
   BACKGROUND CREATURE
   Single inline SVG, animated with transform only (translate/rotate/scale).
   Sized and pathed to roam the FULL viewport (not just a corner strip).
   Colorful per-day gradient fill, drawn once as static markup -- no
   per-frame JS, no layout thrash, just compositor transforms.
═══════════════════════════════════════════════════════════════ */
.bg-monster {
    position: fixed;
    top: 0; left: 0;
    width: clamp(220px, 34vw, 480px);
    height: auto;
    opacity: var(--monster-opacity, 0.5);
    filter: var(--monster-glow);
    z-index: 0;
    pointer-events: none;
    animation: var(--monster-anim, monsterRoamMon) var(--monster-duration, 26s) ease-in-out infinite;
    will-change: transform;
}
.bg-monster.second {
    width: clamp(140px, 20vw, 320px);
    opacity: calc(var(--monster-opacity, 0.5) * 0.75);
    animation: var(--monster-anim, monsterRoamMon) calc(var(--monster-duration, 26s) * 1.4) ease-in-out infinite reverse;
    display: none;
}
/* Tablet and up get the second, smaller companion creature.
   Phones only render one to keep GPU layer count minimal. */
@media (min-width: 768px) {
    .bg-monster.second { display: block; }
}
@media (min-width: 1440px) {
    .bg-monster { width: clamp(280px, 30vw, 560px); }
    .bg-monster.second { width: clamp(180px, 18vw, 380px); }
}

/* Seven full-viewport roaming paths, one per day theme -- picked via --monster-anim.
   Ranges use vw/vh so the creature genuinely traverses the whole screen. */
@keyframes monsterRoamMon {
    0%   { transform: translate(-6vw, 65vh) rotate(-4deg) scale(1); }
    20%  { transform: translate(55vw, 10vh) rotate(3deg) scale(1.05); }
    40%  { transform: translate(85vw, 55vh) rotate(-2deg) scale(0.96); }
    50%  { transform: translate(85vw, 55vh) rotate(-2deg) scale(0.96) scaleX(-1); }
    70%  { transform: translate(40vw, 78vh) rotate(4deg) scale(1.02) scaleX(-1); }
    90%  { transform: translate(0vw, 30vh) rotate(-3deg) scale(1) scaleX(-1); }
    100% { transform: translate(-6vw, 65vh) rotate(-4deg) scale(1); }
}
@keyframes monsterRoamTue {
    0%, 100% { transform: translate(4vw, 60vh) rotate(0deg) scale(1); }
    25%      { transform: translate(60vw, 20vh) rotate(3deg) scale(1.06); }
    50%      { transform: translate(30vw, 70vh) rotate(-2deg) scale(0.95); }
    75%      { transform: translate(75vw, 45vh) rotate(2deg) scale(1.03); }
}
@keyframes monsterRoamWed {
    0%    { transform: translate(-8vw, 20vh) rotate(-6deg) scale(1); }
    49%   { transform: translate(78vw, 60vh) rotate(4deg) scale(1.04); }
    50%   { transform: translate(78vw, 60vh) rotate(4deg) scale(1.04) scaleX(-1); }
    99%   { transform: translate(-8vw, 20vh) rotate(-6deg) scale(1) scaleX(-1); }
    100%  { transform: translate(-8vw, 20vh) rotate(-6deg) scale(1); }
}
@keyframes monsterRoamThu {
    0%   { transform: translate(0vw, 66vh) rotate(-2deg) scale(1); }
    10%  { transform: translate(12vw, 46vh) rotate(2deg) scale(1.02); }
    20%  { transform: translate(24vw, 66vh) rotate(-2deg) scale(1); }
    30%  { transform: translate(38vw, 40vh) rotate(2deg) scale(1.03); }
    40%  { transform: translate(52vw, 66vh) rotate(-2deg) scale(1); }
    50%  { transform: translate(66vw, 36vh) rotate(2deg) scale(1.04) scaleX(-1); }
    60%  { transform: translate(52vw, 66vh) rotate(-2deg) scale(1) scaleX(-1); }
    70%  { transform: translate(38vw, 40vh) rotate(2deg) scale(1.03) scaleX(-1); }
    80%  { transform: translate(24vw, 66vh) rotate(-2deg) scale(1) scaleX(-1); }
    90%  { transform: translate(12vw, 46vh) rotate(2deg) scale(1.02) scaleX(-1); }
    100% { transform: translate(0vw, 66vh) rotate(-2deg) scale(1); }
}
@keyframes monsterRoamFri {
    0%   { transform: translate(-4vw, 30vh) rotate(-8deg) scale(1); }
    20%  { transform: translate(48vw, 8vh) rotate(10deg) scale(1.08); }
    40%  { transform: translate(20vw, 55vh) rotate(-10deg) scale(0.95); }
    50%  { transform: translate(72vw, 20vh) rotate(8deg) scale(1.06) scaleX(-1); }
    70%  { transform: translate(50vw, 68vh) rotate(-8deg) scale(1) scaleX(-1); }
    90%  { transform: translate(10vw, 42vh) rotate(6deg) scale(1.03) scaleX(-1); }
    100% { transform: translate(-4vw, 30vh) rotate(-8deg) scale(1); }
}
@keyframes monsterRoamSat {
    0%    { transform: translate(-6vw, 50vh) rotate(0deg) scale(1); }
    49%   { transform: translate(88vw, 25vh) rotate(0deg) scale(1.05); }
    50%   { transform: translate(88vw, 25vh) rotate(0deg) scale(1.05) scaleX(-1); }
    99%   { transform: translate(-6vw, 50vh) rotate(0deg) scale(1) scaleX(-1); }
    100%  { transform: translate(-6vw, 50vh) rotate(0deg) scale(1); }
}
@keyframes monsterRoamSun {
    0%   { transform: translate(10vw, 70vh) rotate(-4deg) scale(1); opacity: var(--monster-opacity); }
    50%  { transform: translate(60vw, 12vh) rotate(4deg) scale(1.12); opacity: calc(var(--monster-opacity) * 1.3); }
    100% { transform: translate(10vw, 70vh) rotate(-4deg) scale(1); opacity: var(--monster-opacity); }
}

/* Generic ambient orbs used by every theme's .bg-deco layer */
.bg-deco { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.orb { position: absolute; border-radius: 50%; border: 1px solid var(--orb-border, rgba(255,255,255,0.08)); animation: orbPulse 5s ease-in-out infinite; }
@keyframes orbPulse { 0%, 100% { transform: scale(1); opacity: 0.45; } 50% { transform: scale(1.12); opacity: 0.9; } }
.scan-line { position: absolute; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: 0.35; animation: scanMove 7s linear infinite; }
@keyframes scanMove { 0% { top: -2px; opacity: 0; } 6% { opacity: 0.6; } 94% { opacity: 0.6; } 100% { top: 100%; opacity: 0; } }

/* Fewer/cheaper ambient elements on phones -- lowers concurrent GPU layers */
@media (max-width: 479px) {
    .orb:nth-child(3) { display: none; }
    .bg-monster { width: clamp(180px, 46vw, 280px); }
}

/* ═══════════════════════════════════════════════════════════════
   GHOST OVERLAY / BIRTHDAY POPUP (shared, theme accent injected)
═══════════════════════════════════════════════════════════════ */
#ghost-overlay {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(8px) brightness(0.55);
    pointer-events: none; animation: ghostFadeIn 0.3s ease forwards;
}
#ghost-overlay.hidden { display: none !important; }
#ghost-image {
    width: clamp(10rem, 30vw, 16rem); height: clamp(10rem, 30vw, 16rem);
    object-fit: cover; border-radius: 50%;
    animation: ghostPulse 2.2s cubic-bezier(0.34,1.56,0.64,1) forwards;
}
@keyframes ghostFadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes ghostPulse { 0% { opacity: 0; transform: scale(0.4) rotateY(-40deg); } 60% { opacity: 1; transform: scale(1.05) rotateY(10deg); } 100% { opacity: 1; transform: scale(1) rotateY(0deg); } }

#birthday-popup { position: fixed; inset: 0; z-index: 10000; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.8); backdrop-filter: blur(6px); }
#birthday-popup.hidden { display: none !important; }
.birthday-inner {
    width: 90%; max-width: 340px; padding: clamp(1.5rem, 5vw, 2rem);
    border-radius: 1.5rem; text-align: center;
    background: var(--card-bg); border: 1.5px solid var(--accent); color: var(--text);
    box-shadow: 0 25px 60px rgba(0,0,0,0.6), 0 0 40px var(--accent);
}

        <div id="day-badge-wrap" style="margin-bottom:0.75rem;"></div>
        <h1 class="page-title" id="page-title">Staff Login</h1>
        <p class="page-subtitle" id="page-subtitle">Daily Report System</p>
    </div>

    <!-- Login Card -->
    <div class="login-card animate-up w-full">
        <div style="position:relative;z-index:10;">

            <p class="welcome-heading" id="welcome-heading">Welcome back</p>
            <p class="welcome-sub" id="welcome-sub">Select your profile to continue</p>

            <!-- Staff Selector -->
            <div class="field-wrap">
                <label class="field-label">Staff Member</label>
                <div id="staff-selector-container">
                    <div id="selected-staff" tabindex="0">
                        <span id="selected-text">Loading staff list...</span>
                        <svg class="dropdown-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor">
                            <path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80a8,8,0,0,1,11.32-11.32L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"/>
                        </svg>
                    </div>
                    <div id="staff-dropdown"></div>
                </div>
            </div>

            <!-- Password -->
            <div class="field-wrap">
                <label class="field-label">Secure Password</label>
                <div class="password-wrap">
                    <input type="password" id="password" class="input-field" placeholder="••••••••">
                    <button type="button" class="eye-btn" onclick="togglePassword()">
                        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            <path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                        </svg>
                    </button>
                </div>
                <div class="forgot-row">
                    <button onclick="findPassword()" class="forgot-btn">Forgot Password?</button>
                </div>
            </div>

            <!-- Login Button -->
            <button id="loginBtn" class="login-btn" onclick="handleLogin()">AUTHENTICATE</button>
        </div>
    </div>

</div><!-- /page-wrapper -->

<!-- Birthday Popup -->
<div id="birthday-popup" class="hidden">
    <div class="birthday-inner">
        <div style="font-size:3rem;margin-bottom:0.75rem;">🎂</div>
        <h2 style="font-size:1.35rem;font-weight:700;color:var(--accent);margin:0 0 0.75rem;">Happy Birthday!</h2>
        <div id="birthday-list" style="margin-bottom:1rem;"></div>
        <div style="font-size:0.65rem;letter-spacing:0.2em;opacity:0.5;margin-bottom:1rem;">
            CLOSING IN <span id="timer-seconds" style="font-weight:900;">10</span>s
        </div>
        <button onclick="closePopup()" id="birthday-close-btn"
            style="width:100%;padding:0.75rem;border:none;cursor:pointer;border-radius:0.75rem;font-weight:700;font-size:0.85rem;background:var(--btn-bg);color:var(--btn-text);transition:all 0.2s;">
            Close
        </button>
    </div>
</div>

<!-- Ghost Overlay -->
<div id="ghost-overlay" class="hidden">
    <img id="ghost-image" src="" alt="Profile">
</div>

<script>
(function() {
    'use strict';

    /* ── DAY THEMING (Sun=0 .. Sat=6, matches Date.getDay()) ── */
    const DAY_CONFIG = {
        0: { cls: 'day-sun', badge: '🌇 Sunday',   title: 'Staff Login', heading: 'Restful Sunday',  sub: 'Select your profile to continue', btnText: 'SIGN IN' },
        1: { cls: 'day-mon', badge: '⚡ Monday',    title: 'Staff Login', heading: 'Welcome back',    sub: 'Select your profile to continue', btnText: 'AUTHENTICATE' },
        2: { cls: 'day-tue', badge: '◎ Tuesday',   title: 'Staff Login', heading: '안녕하세요 ^^*',   sub: 'Select your profile to continue', btnText: 'SIGN IN' },
        3: { cls: 'day-wed', badge: '◆ Wednesday', title: 'Staff Login', heading: 'Welcome',         sub: 'Enter your credentials to proceed', btnText: 'ENTER' },
        4: { cls: 'day-thu', badge: '🌿 Thursday',  title: 'Staff Login', heading: 'Good morning',    sub: 'Choose your name and sign in', btnText: 'SIGN IN' },
        5: { cls: 'day-fri', badge: '🎉 Friday',    title: 'TGIF Login',  heading: "It's Friday!",   sub: 'Pick your name and let\'s go 🚀', btnText: "LET'S GO" },
        6: { cls: 'day-sat', badge: '❄ Saturday',  title: 'Staff Login', heading: 'Easy Saturday',   sub: 'Select your profile to continue', btnText: 'SIGN IN' }
    };

    /* ── Testing day themes without redeployment ──
       ?day=0..6 forces a theme (e.g. index.html?day=5 previews Friday).
       Falls back to the real current day when absent/invalid. */
    const dayParam = new URLSearchParams(window.location.search).get('day');
    const forcedDay = (dayParam !== null && /^[0-6]$/.test(dayParam)) ? Number(dayParam) : null;
    const now = new Date();
    const cfg = DAY_CONFIG[forcedDay !== null ? forcedDay : now.getDay()] || DAY_CONFIG[1];

    document.body.classList.add(cfg.cls);
    document.getElementById('day-badge-wrap').innerHTML = `<span class="day-badge">${cfg.badge}</span>`;
    document.getElementById('page-title').textContent = cfg.title;
    document.getElementById('welcome-heading').textContent = cfg.heading;
    document.getElementById('welcome-sub').textContent = cfg.sub;
    document.getElementById('loginBtn').textContent = cfg.btnText;

    /* ── ORIGINAL PER-DAY CREATURES ──
       Each entry is fully original artwork (not a reproduction of any
       licensed character): a <defs> radial/linear gradient for a
       colorful body fill, plus simple silhouette paths. Rendered once
       as static markup -- all movement comes from the CSS transform
       animation on the parent <svg>, so there is zero per-frame JS cost. */
    const MONSTER_SVGS = {
        'day-mon': /* "Voltling" -- crystalline neon scout */
            '<defs><linearGradient id="gradMon" x1="0%" y1="0%" x2="100%" y2="100%">' +
            '<stop offset="0%" stop-color="#00eaff"/><stop offset="50%" stop-color="#7b5bff"/><stop offset="100%" stop-color="#ff2e9e"/>' +
            '</linearGradient></defs>' +
            '<path d="M100 18 L156 78 L146 140 L54 140 L44 78 Z" fill="url(#gradMon)"/>' +
            '<line x1="100" y1="6" x2="100" y2="20" stroke="#00eaff" stroke-width="4"/>' +
            '<circle cx="100" cy="6" r="7" fill="#ffd23f"/>' +
            '<circle cx="100" cy="90" r="26" fill="#050814"/>' +
            '<circle cx="100" cy="90" r="12" fill="#ffd23f"/>' +
            '<rect x="66" y="132" width="17" height="30" rx="5" fill="url(#gradMon)"/>' +
            '<rect x="117" y="132" width="17" height="30" rx="5" fill="url(#gradMon)"/>',
        'day-tue': /* "Claymoth" -- calm round gilded spirit */
            '<defs><radialGradient id="gradTue" cx="35%" cy="30%" r="80%">' +
            '<stop offset="0%" stop-color="#ffe8a3"/><stop offset="55%" stop-color="#d9a24a"/><stop offset="100%" stop-color="#8a5a2e"/>' +
            '</radialGradient></defs>' +
            '<ellipse cx="100" cy="112" rx="78" ry="62" fill="url(#gradTue)"/>' +
            '<path d="M52 58 Q58 18 80 50 Z" fill="url(#gradTue)"/>' +
            '<path d="M148 58 Q142 18 120 50 Z" fill="url(#gradTue)"/>' +
            '<path d="M72 104 Q84 116 96 104" stroke="#050300" stroke-width="6" fill="none" stroke-linecap="round"/>' +
            '<path d="M104 104 Q116 116 128 104" stroke="#050300" stroke-width="6" fill="none" stroke-linecap="round"/>' +
            '<path d="M88 134 Q100 144 112 134" stroke="#050300" stroke-width="5" fill="none" stroke-linecap="round"/>',
        'day-wed': /* "Decoserpent" -- sleek finned art-deco wyrm */
            '<defs><linearGradient id="gradWed" x1="0%" y1="0%" x2="100%" y2="0%">' +
            '<stop offset="0%" stop-color="#e7e04a"/><stop offset="50%" stop-color="#9db93c"/><stop offset="100%" stop-color="#3f7d3a"/>' +
            '</linearGradient></defs>' +
            '<path d="M18 126 Q60 58 100 90 Q140 58 182 126 Q140 150 100 138 Q60 150 18 126Z" fill="url(#gradWed)"/>' +
            '<path d="M83 60 L100 10 L117 60Z" fill="url(#gradWed)"/>' +
            '<path d="M56 68 L72 28 L88 64Z" fill="url(#gradWed)"/>' +
            '<path d="M112 64 L128 28 L144 68Z" fill="url(#gradWed)"/>' +
            '<rect x="84" y="94" width="14" height="14" fill="#0a0e05" transform="rotate(45 91 101)"/>' +
            '<rect x="102" y="94" width="14" height="14" fill="#0a0e05" transform="rotate(45 109 101)"/>',
        'day-thu': /* "Mossgolem" -- mossy forest guardian */
            '<defs><radialGradient id="gradThu" cx="40%" cy="25%" r="85%">' +
            '<stop offset="0%" stop-color="#b8f2a0"/><stop offset="55%" stop-color="#4fbf7a"/><stop offset="100%" stop-color="#1f5c3c"/>' +
            '</radialGradient></defs>' +
            '<ellipse cx="100" cy="118" rx="76" ry="54" fill="url(#gradThu)"/>' +
            '<path d="M54 66 Q40 22 72 46 Q66 60 54 66Z" fill="url(#gradThu)"/>' +
            '<path d="M146 66 Q160 22 128 46 Q134 60 146 66Z" fill="url(#gradThu)"/>' +
            '<circle cx="70" cy="78" r="8" fill="#ffd23f" opacity="0.7"/>' +
            '<circle cx="134" cy="74" r="7" fill="#ffd23f" opacity="0.7"/>' +
            '<circle cx="80" cy="110" r="9" fill="#0a1408"/>' +
            '<circle cx="120" cy="110" r="9" fill="#0a1408"/>' +
            '<path d="M84 140 Q100 152 116 140" stroke="#0a1408" stroke-width="6" fill="none" stroke-linecap="round"/>',
        'day-fri': /* "Neonbat" -- spiky synthwave night flyer */
            '<defs><linearGradient id="gradFri" x1="0%" y1="0%" x2="100%" y2="0%">' +
            '<stop offset="0%" stop-color="#00e5ff"/><stop offset="50%" stop-color="#ff2ec4"/><stop offset="100%" stop-color="#8c3bff"/>' +
            '</linearGradient></defs>' +
            '<path d="M100 98 L52 38 L70 90 L8 52 L48 106 L100 142 L152 106 L192 52 L130 90 L148 38Z" fill="url(#gradFri)"/>' +
            '<polygon points="82,102 94,82 100,102" fill="#0a0320"/>' +
            '<polygon points="106,102 112,82 124,102" fill="#0a0320"/>',
        'day-sat': /* "Frostshard" -- crystalline ice beast */
            '<defs><linearGradient id="gradSat" x1="0%" y1="0%" x2="100%" y2="100%">' +
            '<stop offset="0%" stop-color="#dff6ff"/><stop offset="50%" stop-color="#7fc4e8"/><stop offset="100%" stop-color="#2c5c82"/>' +
            '</linearGradient></defs>' +
            '<polygon points="100,14 148,72 130,152 70,152 52,72" fill="url(#gradSat)"/>' +
            '<polygon points="100,44 126,82 113,124 87,124 74,82" fill="#0a141c" opacity="0.55"/>' +
            '<circle cx="82" cy="90" r="7" fill="#0a141c"/>' +
            '<circle cx="118" cy="90" r="7" fill="#0a141c"/>',
        'day-sun': /* "Emberphoenix" -- warm rising ember bird */
            '<defs><radialGradient id="gradSun" cx="50%" cy="30%" r="80%">' +
            '<stop offset="0%" stop-color="#ffd98a"/><stop offset="50%" stop-color="#e8966e"/><stop offset="100%" stop-color="#c8465a"/>' +
            '</radialGradient></defs>' +
            '<path d="M100 148 Q52 136 40 86 Q66 98 78 72 Q70 48 96 36 Q100 54 104 36 Q130 48 122 72 Q134 98 160 86 Q148 136 100 148Z" fill="url(#gradSun)"/>' +
            '<circle cx="85" cy="98" r="7" fill="#170a09"/>' +
            '<circle cx="115" cy="98" r="7" fill="#170a09"/>' +
            '<path d="M87 118 Q100 128 113 118" stroke="#170a09" stroke-width="5" fill="none" stroke-linecap="round"/>'
    };
    const monsterMarkup = MONSTER_SVGS[cfg.cls] || MONSTER_SVGS['day-mon'];
    document.getElementById('monster1').innerHTML = monsterMarkup;
    document.getElementById('monster2').innerHTML = monsterMarkup;

    /* Ambient orbs + scanline -- built once per load, cheap fixed DOM (no JS animation loop) */
    document.getElementById('bg-deco').innerHTML =
        '<div class="orb" style="width:520px;height:520px;top:-12%;left:-12%;animation-delay:0s;"></div>' +
        '<div class="orb" style="width:600px;height:600px;bottom:-16%;right:-10%;animation-delay:1.4s;"></div>' +
        '<div class="orb" style="width:360px;height:360px;bottom:15%;left:35%;animation-delay:2.8s;"></div>' +
        '<div class="scan-line"></div>';

    /* ── CPU / GPU LOAD MANAGEMENT ──
       Pause every ambient animation while the tab isn't visible, and
       drop the companion creature + trim ambient orbs on small or
       coarse-pointer (touch) devices where extra GPU layers cost more. */
    function syncAnimState() {
        document.body.classList.toggle('anim-paused', document.hidden);
    }
    document.addEventListener('visibilitychange', syncAnimState, { passive: true });
    syncAnimState();

    if (window.matchMedia('(max-width: 640px)').matches) {
        const m2 = document.getElementById('monster2');
        if (m2) m2.remove();
    }

    /* ── FIREBASE ── */
    const firebaseConfig = { databaseURL: "https://tdlid-dailyreport-default-rtdb.firebaseio.com" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    /* ── STAFF SELECTOR ── */
    let staffData = {};
    let selectedStaff = '';
    const selectedStaffEl = document.getElementById('selected-staff');
    const selectedTextEl = document.getElementById('selected-text');
    const staffDropdown = document.getElementById('staff-dropdown');
    const dropdownArrow = selectedStaffEl.querySelector('.dropdown-arrow');
    const passwordInput = document.getElementById('password');

    function initStaffSelector() {
        database.ref('users').limitToFirst(50).once('value', (snap) => {
            staffData = snap.val() || {};
            if (!Object.keys(staffData).length) {
                selectedTextEl.textContent = 'No staff available';
                return;
            }
            selectedTextEl.textContent = 'Select Identity';
            renderStaffDropdown();
        }).catch(() => { selectedTextEl.textContent = 'Error loading staff'; });
    }

    function renderStaffDropdown() {
        const frag = document.createDocumentFragment();
        Object.keys(staffData).forEach(name => {
            const user = staffData[name];
            const opt = document.createElement('div');
            opt.className = 'staff-option';
            opt.dataset.name = name;

            const av = document.createElement('div');
            av.className = 'staff-avatar';
            av.textContent = name.charAt(0).toUpperCase();

            const nm = document.createElement('div');
            nm.className = 'staff-name';
            nm.textContent = name;

            opt.appendChild(av);
            opt.appendChild(nm);

            if (user.role === 'admin' || user.role === 'manager') {
                const rb = document.createElement('div');
                rb.className = 'staff-role-badge';
                rb.textContent = 'Manager';
                opt.appendChild(rb);
            }

            opt.addEventListener('click', () => selectStaff(name, opt));
            frag.appendChild(opt);
        });
        staffDropdown.appendChild(frag);
    }

    function selectStaff(name, optEl) {
        selectedStaff = name;
        selectedTextEl.textContent = name;
        staffDropdown.querySelectorAll('.staff-option').forEach(o => o.classList.remove('selected'));
        if (optEl) optEl.classList.add('selected');
        closeDropdown();
        passwordInput.focus();
    }

    function toggleDropdown() {
        staffDropdown.classList.contains('active') ? closeDropdown() : openDropdown();
    }
    function openDropdown() {
        staffDropdown.classList.add('active');
        selectedStaffEl.classList.add('active');
        dropdownArrow.classList.add('rotated');
    }
    function closeDropdown() {
        staffDropdown.classList.remove('active');
        selectedStaffEl.classList.remove('active');
        dropdownArrow.classList.remove('rotated');
    }

    selectedStaffEl.addEventListener('click', toggleDropdown);
    selectedStaffEl.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleDropdown(); }
    });
    document.addEventListener('click', e => {
        if (!document.getElementById('staff-selector-container').contains(e.target)) closeDropdown();
    });
    passwordInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); handleLogin(); }
    });

    /* ── LOGIN ── */
    window.handleLogin = function() {
        const name = selectedStaff;
        const pw = passwordInput.value;
        if (!name || !pw) return alert("Please enter your credentials.");

        database.ref('users/' + name).once('value', snap => {
            const ud = snap.val();
            if (!ud) return alert("User not found.");
            if (ud.password === pw) {
                sessionStorage.setItem('loggedInUser', name);
                sessionStorage.setItem('userRole', ud.role);
                database.ref('users/' + name).update({
                    lastLogin: new Date().toISOString(),
                    online_sts: 'ON'
                });
                showGhostEffect(ud.profileImg, name, ud.role);
            } else {
                alert("Incorrect password.");
            }
        });
    };

    function showGhostEffect(profileImg, name, role) {
        const overlay = document.getElementById('ghost-overlay');
        const img = document.getElementById('ghost-image');
        let src;
        if (profileImg) {
            src = (profileImg.startsWith('images/') || profileImg.startsWith('http'))
                ? profileImg : `images/profile/${profileImg}`;
        } else {
            src = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(name) + '&background=3b82f6&color=fff&size=256';
        }

        const borders = { 'day-mon': '#00d4ff', 'day-tue': '#c9a84c', 'day-wed': '#b4b43c', 'day-thu': '#4fbf7a', 'day-fri': '#ff2ec4', 'day-sat': '#7fc4e8', 'day-sun': '#e8966e' };
        const bColor = borders[cfg.cls] || '#00d4ff';
        img.style.border = `3px solid ${bColor}`;
        img.style.boxShadow = `0 0 60px ${bColor}88`;

        img.src = src;
        overlay.classList.remove('hidden');

        setTimeout(() => {
            overlay.classList.add('hidden');
            const userRole = (role || '').toLowerCase();
            if (userRole === 'admin' || userRole === 'manager') {
                location.href = "admin.html";
            } else {
                location.href = "staff_main.html";
            }
        }, 2500);
    }

    /* ── TOGGLE PASSWORD ── */
    window.togglePassword = function() {
        const inp = document.getElementById('password');
        const icon = document.getElementById('eyeIcon');
        if (inp.type === 'password') {
            inp.type = 'text';
            icon.innerHTML = `<path d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/>`;
        } else {
            inp.type = 'password';
            icon.innerHTML = `<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>`;
        }
    };

    /* ── FORGOT PASSWORD ── */
    window.findPassword = function() {
        const name = selectedStaff;
        if (!name) return alert("Please select your name from the list first.");
        if (confirm(`Request password hint for '${name}'?`)) {
            database.ref('users/' + name).once('value', snap => {
                const ud = snap.val();
                if (ud && ud.password) {
                    const pw = ud.password;
                    const hint = pw.length > 2 ? pw.substring(0, 2) + '*'.repeat(pw.length - 2) : pw;
                    alert(`[Security Hint]\n\nPassword starts with: ${hint}\n\nContact manager for full recovery.`);
                } else {
                    alert("Data not found.");
                }
            });
        }
    };

    /* ── BIRTHDAY POPUP ── */
    (function() {
        const popup = document.getElementById('birthday-popup');
        const timerEl = document.getElementById('timer-seconds');
        let autoClose, countdown;

        window.closePopup = function() {
            clearTimeout(autoClose);
            clearInterval(countdown);
            popup.classList.add('hidden');
        };

        const checkBirthdays = () => {
            const n = new Date();
            const todayMD = `${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
            database.ref('users').once('value', snap => {
                const data = snap.val();
                if (!data) return;
                const winners = Object.keys(data).filter(nm => data[nm].birthday && data[nm].birthday.slice(5,10) === todayMD)
                    .map(nm => ({ name: nm, date: data[nm].birthday }));
                if (!winners.length) return;

                document.getElementById('birthday-list').innerHTML = winners.map(s => `
                    <div style="padding:0.6rem 0.75rem;background:rgba(255,255,255,0.05);border:1px solid var(--accent);border-radius:0.75rem;margin-bottom:0.5rem;">
                        <div style="font-size:0.75rem;font-weight:700;">🎂 ${s.name}</div>
                        <div style="font-size:0.7rem;opacity:0.6;">${s.date}</div>
                    </div>`).join('');

                popup.classList.remove('hidden');
                let t = 10;
                timerEl.textContent = t;
                countdown = setInterval(() => { timerEl.textContent = --t; if (t <= 0) clearInterval(countdown); }, 1000);
                autoClose = setTimeout(window.closePopup, 10000);
            });
        };

        setTimeout(checkBirthdays, 1000);
    })();

    initStaffSelector();

})();
</script>

</body>
</html>
