<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Login - Daily Report System</title>
    
    <script src="https://cdn.tailwindcss.com?hide-warnings=true"></script>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    
    <style>
        body { 
            font-family: "Pretendard", sans-serif; 
            color: #f1f5f9; 
            -webkit-tap-highlight-color: transparent; 
            margin: 0; 
            overflow-x: hidden; 
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed; 
            background-repeat: no-repeat; 
            transition: background 0.5s ease-in-out;
            opacity: 0;
        }
        body.loaded { opacity: 1; transition: opacity 0.5s ease-in; }
        #video-bg { position: fixed; top: 50%; left: 50%; min-width: 100%; min-height: 100%; width: auto; height: auto; z-index: -2; transform: translate(-50%, -50%); object-fit: cover; display: none; }
        .video-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: -1; }
        select, input { background-color: rgba(30, 41, 59, 0.7) !important; backdrop-filter: blur(10px); color: white !important; border-color: rgba(51, 65, 85, 0.5) !important; font-size: 16px !important; }
        .login-card { background-color: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.6s ease-out forwards; }
    </style>
</head>
<body class="flex flex-col justify-center items-center min-h-screen p-4 md:p-8">
    <video autoplay muted loop playsinline id="video-bg">
        <source src="images/gif/jennie.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

    <div class="text-center mb-8 md:mb-12 animate-fadeIn w-full max-w-lg">
        <div class="flex flex-col md:flex-row items-center justify-center gap-4 md:gap-6">
            <img src="images/login/login.gif" alt="Logo" class="w-24 h-24 md:w-32 md:h-32 object-contain">
            <div class="text-center md:text-left">
                <h2 class="text-3xl md:text-5xl font-black text-white tracking-tighter leading-tight drop-shadow-2xl">
                    Staff Login
                </h2>
                <p class="text-slate-300 text-xs md:text-sm font-medium tracking-[0.2em] uppercase mt-2 drop-shadow-lg">
                    Daily Report System
                </p>
            </div>
        </div>
    </div>

    <div class="login-card p-6 md:p-10 rounded-[2.5rem] shadow-2xl w-full max-w-[440px] animate-fadeIn" style="animation-delay: 0.2s;">
        <div class="mb-8 text-center md:text-left">
            <p class="text-slate-200 text-xl md:text-2xl font-bold">Welcome back</p>
            <p class="text-slate-400 text-sm mt-1">Select your name to continue</p>
        </div>
        <div class="space-y-6">
            <div>
                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 ml-1">Staff Member</label>
                <div class="relative">
                    <select id="userName" class="w-full border p-4 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 transition appearance-none cursor-pointer shadow-xl">
                        <option value="" disabled selected>Loading staff list...</option>
                    </select>
                    <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-slate-500 text-xs">▼</div>
                </div>
            </div>
            <div>
                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 ml-1">Password</label>
                <input type="password" id="password" class="w-full border p-4 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 transition shadow-xl" placeholder="••••••••">
                <div class="flex justify-end px-1 mt-2">
                    <button onclick="findPassword()" class="text-[10px] text-slate-400 hover:text-blue-400 transition font-bold uppercase tracking-wider">
                        Forgot Password?
                    </button>
                </div>
            </div>
            <div class="pt-2">
                <button id="loginBtn" onclick="handleLogin()" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-black hover:bg-blue-500 shadow-xl shadow-blue-900/30 transition-all active:scale-95 text-base uppercase tracking-widest">
                    Sign In
                </button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            window.addEventListener('DOMContentLoaded', () => {
                document.body.classList.add('loaded');
            });

            const setResponsiveBackground = () => {
                const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
                const videoEl = document.getElementById('video-bg');
                if (isMobile) {
                    videoEl.style.display = 'none';
                    const day = new Date().getDay();
                    const dailyImages = { 1: "jennie-1.gif", 2: "jennie-2.gif", 3: "jennie-3.gif", 4: "jennie-4.gif", 5: "jennie-5.gif", 6: "jennie-6.gif", 0: "jennie-7.gif" };
                    const bgImage = dailyImages[day] || "jennie-1.gif";
                    document.body.style.backgroundImage = `linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('images/gif/${bgImage}')`;
                } else {
                    videoEl.style.display = 'block';
                    document.body.style.backgroundImage = 'none';
                }
            };

            setResponsiveBackground();

            const firebaseConfig = { databaseURL: "https://tdlid-dailyreport-default-rtdb.firebaseio.com" };
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            const database = firebase.database();
            
            const userSelect = document.getElementById('userName');
            const passwordInput = document.getElementById('password');

            passwordInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') { e.preventDefault(); handleLogin(); }
            });

            database.ref('users').limitToFirst(50).once('value', (snapshot) => {
                const users = snapshot.val();
                if (!userSelect) return;
                userSelect.innerHTML = '<option value="" disabled selected>Select Name</option>';
                if (users) {
                    const fragment = document.createDocumentFragment();
                    Object.keys(users).forEach(name => {
                        const option = document.createElement('option');
                        option.value = name;
                        option.textContent = name + (users[name].role === 'admin' ? ' (Manager)' : '');
                        fragment.appendChild(option);
                    });
                    userSelect.appendChild(fragment);
                }
            });

window.handleLogin = function() {
    const name = document.getElementById('userName').value;
    const pw = document.getElementById('password').value;
    if(!name || !pw) return alert("Please check your credentials.");
    
    database.ref('users/' + name).once('value', (snapshot) => {
        const userData = snapshot.val();
        if (!userData) return alert("User not found.");
        
        if (userData.password === pw) {
            sessionStorage.setItem('loggedInUser', name);
            sessionStorage.setItem('userRole', userData.role);
            
            // 관리자가 아니면 staff_list.html로 이동하게 수정
            if (userData.role === 'admin' || name === 'Admin') {
                location.href = "admin.html";
            } else {
                location.href = "staff_list.html"; // 수정된 부분
            }
        } else { 
            alert("Incorrect password."); 
        }
    });
};

            window.findPassword = function() {
                const name = document.getElementById('userName').value;
                if (!name) return alert("Please select your name from the list first.");
                if (confirm(`Do you want to see a password hint for '${name}'?`)) {
                    database.ref('users/' + name).once('value', (snapshot) => {
                        const userData = snapshot.val();
                        if (userData && userData.password) {
                            const pw = userData.password;
                            const hint = pw.length > 2 ? pw.substring(0, 2) + "*".repeat(pw.length - 2) : pw;
                            alert(`[Password Hint for ${name}]\n\nHint: ${hint}\n\nIf you still cannot remember your password, please contact the System Manager.`);
                        } else { alert("User information or password not found."); }
                    });
                }
            };
        })();
    </script>
</body>
</html>
