<style>
    .calendar-wrapper { width: 100%; overflow-x: hidden; }
    .calendar-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    
    @media (min-width: 769px) {
        .calendar-table { min-width: auto; } 
        .calendar-table td { height: 140px; vertical-align: top; padding: 8px; border: 1px solid #1e293b; width: 14.28%; }
    }

    .attendance-record-item { font-size: clamp(8px, 0.8vw, 10px); transition: all 0.2s ease; width: 100%; }
    
    input[type="time"]::-webkit-calendar-picker-indicator {
        filter: invert(1);
        cursor: pointer;
    }

    @media (max-width: 768px) {
        .calendar-table thead { display: none; }
        #full_att_calendar_body { display: flex; flex-direction: column; gap: 14px; padding: 4px; }
        #full_att_calendar_body tr { display: contents; }
        #full_att_calendar_body td { display: block; width: 100% !important; height: auto !important; border: none !important; padding: 0 !important; }
        #full_att_calendar_body td:empty { display: none; }
        .mobile-date-card { background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%); border-radius: 24px; padding: 18px; border: 1px solid rgba(51, 65, 85, 0.5); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); position: relative; overflow: hidden; }
        .today-highlight { border: 2px solid #3b82f6 !important; background: linear-gradient(145deg, #1e293b 0%, #1e1b4b 100%) !important; }
        .mobile-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .mobile-record-list { display: flex; flex-direction: column; gap: 8px; }
        .attendance-record-item { background: rgba(15, 23, 42, 0.6) !important; padding: 12px !important; border-radius: 14px !important; border: 1px solid rgba(255, 255, 255, 0.05) !important; }
/* 주말 배경색 클래스 추가 */
    .sunday-bg { background-color: rgba(244, 63, 94, 0.05) !important; }
    .saturday-bg { background-color: rgba(59, 130, 246, 0.05) !important; }
    
    /* 오늘 날짜 하이라이트와 주말 색상이 겹칠 때 오늘 날짜를 우선함 */
    .today-highlight { 
        border: 2px solid #3b82f6 !important; 
        background: linear-gradient(145deg, #1e293b 0%, #1e1b4b 100%) !important; 
    }

    /* 요일 헤더 색상 */
    .text-sunday { color: #f43f5e !important; }
    .text-saturday { color: #3b82f6 !important; }
    }
</style>

<div class="bg-slate-900/50 p-4 md:p-6 rounded-[2.5rem] md:rounded-3xl border border-slate-800 shadow-2xl backdrop-blur-sm max-w-full overflow-hidden">
    <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-6">
        <h2 class="text-xl font-black text-white flex items-center gap-2">
            <div class="w-1.5 h-6 bg-blue-500 rounded-full"></div>
            STAFF ATTENDANCE <span class="text-slate-500 font-light text-sm uppercase tracking-widest ml-1 hidden md:inline">Management</span>
        </h2>
        <div class="flex items-center gap-3 bg-slate-800/50 p-1.5 rounded-2xl border border-slate-700/50 w-full md:w-auto justify-between">
            <div class="flex items-center gap-1">
                <button onclick="changeFullMonth(-1)" class="p-2 hover:bg-slate-700 rounded-xl transition-all active:scale-90 text-slate-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7" /></svg>
                </button>
                <div id="full_att_month" class="text-xs md:text-sm font-black text-white min-w-[100px] md:min-w-[140px] text-center uppercase tracking-widest italic"></div>
                <button onclick="changeFullMonth(1)" class="p-2 hover:bg-slate-700 rounded-xl transition-all active:scale-90 text-slate-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7" /></svg>
                </button>
            </div>
            <button onclick="goTodayFull()" class="px-4 py-2 bg-blue-600/20 text-blue-400 text-[10px] font-black rounded-xl hover:bg-blue-600 hover:text-white transition-all uppercase tracking-widest border border-blue-500/20">Today</button>
        </div>
    </div>
    <div class="calendar-wrapper">
        <table class="calendar-table">
            <thead>
                <tr class="text-slate-500 text-[10px] uppercase tracking-[0.2em] font-black">
<th class="py-4 text-sunday">Sun</th>  <th class="py-4">Mon</th>  <th class="py-4">Tue</th>  <th class="py-4">Wed</th>  <th class="py-4">Thu</th>  <th class="py-4">Fri</th>       <th class="py-4 text-saturday">Sat</th>
                </tr>
            </thead>
            <tbody id="full_att_calendar_body"></tbody>
        </table>
    </div>
</div>

<script>
    (function () {
        const db = firebase.database();
        let viewDate = new Date();

        const normalizeTime = (timeStr) => {
            if (!timeStr) return "";
            const match = timeStr.match(/(\d{1,2}):(\d{1,2})/);
            if (match) {
                return `${match[1].padStart(2, '0')}:${match[2].padStart(2, '0')}`;
            }
            return "";
        };

        const formatTimeShort = (timeStr) => {
            if (!timeStr) return "";
            return timeStr.replace(/(\d{1,2}:\d{1,2}):\d{1,2}/, '$1');
        };

        window.openEditAttendance = function (name, date, infoEncoded) {
            const info = JSON.parse(decodeURIComponent(infoEncoded));
            const isSpecial = typeof info === 'string';
            const currentAttend = isSpecial ? "" : normalizeTime(info.attend || "");
            const currentLeave = isSpecial ? "" : normalizeTime(info.leave || "");
            const currentSpecial = isSpecial ? info : "";

            const titleHtml = `
                <div class="flex flex-col">
                    <span class="text-[10px] text-blue-500 font-black uppercase tracking-widest">Edit Attendance</span>
                    <span class="text-lg font-black text-white">${name} <span class="text-slate-500 text-sm">(${date})</span></span>
                </div>`;

            const bodyHtml = `
                <div class="space-y-4">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-2 ml-1">Standard Status</label>
                        <div class="grid grid-cols-2 gap-3">
                            <div class="space-y-1">
                                <span class="text-[9px] text-slate-600 font-bold ml-1 uppercase">In</span>
                                <input type="time" id="editAttend" value="${currentAttend}" class="w-full bg-slate-800 text-white text-sm p-4 rounded-2xl border border-slate-700 outline-none focus:ring-2 focus:ring-emerald-500/50">
                            </div>
                            <div class="space-y-1">
                                <span class="text-[9px] text-slate-600 font-bold ml-1 uppercase">Out</span>
                                <input type="time" id="editLeave" value="${currentLeave}" class="w-full bg-slate-800 text-white text-sm p-4 rounded-2xl border border-slate-700 outline-none focus:ring-2 focus:ring-blue-500/50">
                            </div>
                        </div>
                    </div>
                    <div class="relative py-4">
                        <div class="absolute inset-0 flex items-center"><span class="w-full border-t border-slate-800"></span></div>
                        <div class="relative flex justify-center text-[10px] uppercase font-black text-slate-600"><span class="bg-slate-900 px-4">OR Special Status</span></div>
                    </div>
                    <div>
                        <select id="editSpecial" class="w-full bg-slate-800 text-white text-sm p-4 rounded-2xl border border-slate-700 outline-none focus:ring-2 focus:ring-amber-500/50 cursor-pointer appearance-none">
                            <option value="" ${currentSpecial === "" ? "selected" : ""}>--- NO SPECIAL STATUS ---</option>
                            <option value="WO" ${currentSpecial === "WO" ? "selected" : ""}>WO (Work Out)</option>
                            <option value="PEL" ${currentSpecial === "PEL" ? "selected" : ""}>PEL (Personal Leave)</option>
                            <option value="ANL" ${currentSpecial === "ANL" ? "selected" : ""}>ANL (Annual Leave)</option>
                            <option value="SIL" ${currentSpecial === "SIL" ? "selected" : ""}>SIL (Sick Leave)</option>
                            <option value="OFF" ${currentSpecial === "OFF" ? "selected" : ""}>OFF (Day Off)</option>
                        </select>
                    </div>
                    <div class="flex flex-col gap-2 pt-4">
                        <button onclick="window.saveAttendanceEdit('${name}', '${date}')" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-2xl text-sm transition-all active:scale-95 shadow-lg shadow-blue-900/20 uppercase tracking-widest">Save Changes</button>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="window.deleteAttendance('${name}', '${date}')" class="text-rose-500 font-bold py-3 rounded-xl text-xs hover:bg-rose-500/10 transition-all uppercase tracking-widest">Delete</button>
                            <button onclick="window.closeAdminCustomModal()" class="text-slate-500 font-bold py-3 rounded-xl text-xs hover:bg-slate-800 transition-all uppercase tracking-widest">Cancel</button>
                        </div>
                    </div>
                </div>`;

            if (window.openAdminCustomModal) window.openAdminCustomModal(titleHtml, bodyHtml);
            else alert("Modal function not found.");
        };

window.saveAttendanceEdit = function (name, date) {
    const attendVal = document.getElementById('editAttend').value.trim();
    const leaveVal = document.getElementById('editLeave').value.trim();
    const special = document.getElementById('editSpecial').value;

    if (!confirm(`Update record for ${name} on ${date}?`)) return;

    // 1. 특별 상태(휴가 등)가 선택된 경우 문자열 그대로 저장
    if (special) {
        db.ref(`attendance/${date}/${name}`).set(special).then(() => {
            if (window.closeAdminCustomModal) window.closeAdminCustomModal();
        });
        return;
    }

    // 2. 출석 시간 판단 (설정된 기준 시간 참조)
    db.ref('settings/config/stdAttendance').once('value', snap => {
        const standardTime = (snap.val() || "08:30").trim();
        let finalAttend = attendVal;

        if (attendVal) {
            // 시간 비교를 위해 숫자로 변환 (예: "08:30" -> 830)
            const toNum = (t) => {
                const parts = t.split(':');
                return parseInt(parts[0], 10) * 100 + parseInt(parts[1], 10);
            };

            const inputNum = toNum(attendVal);
            const standardNum = toNum(standardTime);

            // 지각 여부 판별 및 형식 강제
            if (inputNum > standardNum) {
                finalAttend = `LATE(${attendVal})`;
            } else {
                finalAttend = `ATT(${attendVal})`;
            }
        }

        const updateData = {
            attend: finalAttend,
            leave: leaveVal
        };

        db.ref(`attendance/${date}/${name}`).set(updateData).then(() => {
            if (window.closeAdminCustomModal) window.closeAdminCustomModal();
        });
    });
};

        window.deleteAttendance = function (name, date) {
            if (confirm(`Delete ${name}'s record for ${date}?`)) {
                db.ref(`attendance/${date}/${name}`).remove().then(() => {
                    if (window.closeAdminCustomModal) window.closeAdminCustomModal();
                });
            }
        };

window.renderAttendanceFull = function () {
            const monthLabel = document.getElementById('full_att_month');
            const tbody = document.getElementById('full_att_calendar_body');
            if (!monthLabel || !tbody) { setTimeout(window.renderAttendanceFull, 100); return; }
            
            monthLabel.innerText = viewDate.toLocaleString('en-US', { month: 'long', year: 'numeric' });
            const attRef = db.ref('attendance');
            attRef.off();
            attRef.on('value', snap => {
                const data = snap.val() || {};
                const currentTbody = document.getElementById('full_att_calendar_body');
                if (!currentTbody) { attRef.off(); return; }
                currentTbody.innerHTML = '';
                
                const year = viewDate.getFullYear(), month = viewDate.getMonth();
                const lastDate = new Date(year, month + 1, 0).getDate();
                
                // 오늘 날짜 정보
                const now = new Date();
                const todayStr = now.toISOString().split('T')[0];
                const isCurrentMonth = (now.getFullYear() === year && now.getMonth() === month);
                
                const isMobile = window.innerWidth <= 768;

                if (isMobile) {
                    // 모바일: 오늘 날짜부터 역순으로 표시
                    // 이번 달을 보고 있다면 '오늘'부터 시작, 이전 달을 보고 있다면 '말일'부터 시작
                    let startDay = isCurrentMonth ? now.getDate() : lastDate;

                    for (let d = startDay; d >= 1; d--) {
                        createDateCell(d, year, month, data, todayStr, true, currentTbody);
                    }
                } else {
                    // 데스크톱: 표준 그리드 (1일부터 표시)
                    const firstDay = new Date(year, month, 1).getDay();
                    let dateNum = 1;
                    for (let i = 0; i < 6; i++) {
                        let row = document.createElement('tr');
                        for (let j = 0; j < 7; j++) {
                            if (i === 0 && j < firstDay || dateNum > lastDate) {
                                row.appendChild(document.createElement('td'));
                            } else {
                                createDateCell(dateNum, year, month, data, todayStr, false, row);
                                dateNum++;
                            }
                        }
                        currentTbody.appendChild(row);
                        if (dateNum > lastDate) break;
                    }
                }
            });
        };

        // Helper function to create the cell content to avoid duplication
function createDateCell(dateNum, year, month, data, todayStr, isMobile, parentElement) {
            const dateObj = new Date(year, month, dateNum);
            const dStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(dateNum).padStart(2, '0')}`;
            const isToday = dStr === todayStr;
            const dayOfWeekIdx = dateObj.getDay(); // 0: 일요일, 6: 토요일
            const dayOfWeek = dateObj.toLocaleString('en-US', { weekday: 'long' });
            
            let cell = document.createElement('td');
            
            // 주말 색상 결정
            let weekendClass = "";
            let dateColorClass = isToday ? 'text-blue-400' : 'text-white';
            
            if (dayOfWeekIdx === 0) {
                weekendClass = "sunday-bg";
                if (!isToday) dateColorClass = "text-rose-500";
            } else if (dayOfWeekIdx === 6) {
                weekendClass = "saturday-bg";
                if (!isToday) dateColorClass = "text-blue-500";
            }

            // 클래스 할당
            cell.className = isMobile 
                ? `mobile-date-card ${isToday ? 'today-highlight' : weekendClass}` 
                : `transition-all ${isToday ? 'today-highlight' : weekendClass}`;
            
            let content = `
                <div class="${isMobile ? 'mobile-card-header' : 'flex justify-between items-center mb-3'}">
                    <div class="flex items-baseline gap-2">
                        <span class="text-lg font-black ${dateColorClass}">${dateNum}</span>
                        ${isMobile ? `<span class="text-[10px] font-bold ${dayOfWeekIdx === 0 ? 'text-rose-500/70' : (dayOfWeekIdx === 6 ? 'text-blue-500/70' : 'text-slate-500')} uppercase tracking-widest">${dayOfWeek}</span>` : ''}
                    </div>
                    ${isToday ? '<span class="text-[8px] bg-blue-600 text-white px-2 py-0.5 rounded-full font-black tracking-tighter shadow-lg shadow-blue-500/40">TODAY</span>' : ''}
                </div>`;
            
            const dayRecords = data[dStr] || {};
            content += isMobile ? `<div class="mobile-record-list">` : `<div>`;
            
            const recordEntries = Object.entries(dayRecords);
            if (recordEntries.length > 0) {
                recordEntries.forEach(([name, info]) => {
                    let attHtml = '';
                    const safeInfo = encodeURIComponent(JSON.stringify(info));
                    if (typeof info === 'string') { 
                        attHtml = `<span class="px-3 py-1 rounded-lg bg-amber-500/10 text-amber-500 font-black text-[10px] border border-amber-500/20">${info}</span>`; 
                    } else {
                        const displayAttend = formatTimeShort(info.attend || "");
                        const displayLeave = formatTimeShort(info.leave || "");
                        const sClass = (info.attend || "").includes("LATE") ? "text-rose-500" : "text-emerald-500";
                        attHtml = `<div class="flex flex-col items-end gap-0.5"><span class="${sClass} font-black tracking-tighter">☀️ ${displayAttend}</span>${displayLeave ? `<span class="text-slate-400 font-black tracking-tighter">🌙 ${displayLeave}</span>` : ''}</div>`;
                    }
                    content += `<div onclick="window.openEditAttendance('${name}', '${dStr}', '${safeInfo}')" class="attendance-record-item flex justify-between items-center p-2.5 rounded-xl bg-slate-800/40 border border-slate-700/30 cursor-pointer hover:bg-slate-700 hover:border-blue-500/50 transition-all active:scale-[0.98]"><span class="truncate font-black text-slate-200 text-[11px]" style="max-width: 55%">${name}</span>${attHtml}</div>`;
                });
            } else if (isMobile) {
                content += `<div class="text-[10px] text-slate-600 font-bold italic py-4 text-center bg-slate-900/50 rounded-xl border border-dashed border-slate-800">NO RECORDS</div>`;
            }
            content += `</div>`;
            cell.innerHTML = content;
            parentElement.appendChild(cell);
        }

        window.changeFullMonth = (offset) => { viewDate.setMonth(viewDate.getMonth() + offset); window.renderAttendanceFull(); };
        window.goTodayFull = () => { viewDate = new Date(); window.renderAttendanceFull(); };
        
        let resizeTimer;
        window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(window.renderAttendanceFull, 250); });
        
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', window.renderAttendanceFull);
        else window.renderAttendanceFull();
    })();
</script>
