<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - DAILY SYSTEM</title>

    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css">

    <style>
        body { font-family: Pretendard, sans-serif; background:#000; color:#f1f5f9; }
        .tab-btn{transition:.25s; cursor: pointer;}
        .tab-active{color:#3b82f6;font-weight:900;background:rgba(59,130,246,.1);border-radius:1rem}
        .tab-inactive{color:#64748b}
    </style>
</head>

<body class="flex min-h-screen">

<aside class="w-72 bg-slate-950/60 border-r border-slate-800 p-6">
    <div class="flex items-center gap-3 mb-10">
        <h1 class="text-2xl font-black italic">
            ADMIN <span class="text-blue-500">SYSTEM</span>
        </h1>
    </div>

    <nav class="flex flex-col gap-2">
        <button id="btn-dashboard" onclick="switchAdminTab('dashboard')" class="tab-btn px-4 py-3 text-left">📊 Dashboard</button>
        <button id="btn-attendance" onclick="switchAdminTab('attendance')" class="tab-btn px-4 py-3 text-left">👤 Attendance</button>
        <button id="btn-reports" onclick="switchAdminTab('reports')" class="tab-btn px-4 py-3 text-left">📝 Reports</button>
        <button id="btn-schedule" onclick="switchAdminTab('schedule')" class="tab-btn px-4 py-3 text-left">📅 Schedule</button>
        <button id="btn-settings" onclick="switchAdminTab('settings')" class="tab-btn px-4 py-3 text-left">⚙️ Settings</button>
    </nav>
</aside>

<main class="flex-1 p-8 overflow-y-auto">
    <div id="adminContent" class="max-w-[1300px] mx-auto"></div>
</main>

<div id="adminCustomModal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="closeAdminCustomModal()"></div>
    <div class="relative bg-slate-900 border border-slate-800 w-full max-w-md rounded-[2.5rem] shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-200">
        <div class="p-8">
            <div id="modalTitle" class="mb-6"></div>
            <div id="modalBody"></div>
        </div>
    </div>
</div>

<script>
/* =========================================================
   1. Firebase 초기화 (🔥 단 한 번만)
   ========================================================= */
(function () {

    if (!window.firebase) return;

    const firebaseConfig = {
        databaseURL: "https://tdlid-dailyreport-default-rtdb.firebaseio.com"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }

    /* 🔒 db 전역 단일 인스턴스 */
    if (!window.db) {
        window.db = firebase.database();
    }

})();

/* =========================================================
   2. ADMIN 공용 모달 (🔥 단 한 번만 정의)
   ========================================================= */
if (!window.openAdminCustomModal) {

    window.openAdminCustomModal = function (titleHtml, bodyHtml) {
        const modal = document.getElementById('adminCustomModal');
        const tBox  = document.getElementById('modalTitle');
        const bBox  = document.getElementById('modalBody');

        if (!modal || !tBox || !bBox) {
            console.error('[ADMIN MODAL] DOM not found');
            return;
        }

        tBox.innerHTML = titleHtml;
        bBox.innerHTML = bodyHtml;
        modal.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
    };

    window.closeAdminCustomModal = function () {
        const modal = document.getElementById('adminCustomModal');
        if (modal) {
            modal.classList.add('hidden');
            document.body.style.overflow = '';
        }
    };

    /* 🔒 절대 덮어쓰기 방지 */
    Object.defineProperty(window, 'openAdminCustomModal', {
        writable: false,
        configurable: false
    });
    Object.defineProperty(window, 'closeAdminCustomModal', {
        writable: false,
        configurable: false
    });
}

/* =========================================================
   3. 탭 전환 (SPA Loader - 충돌 방지 버전)
   ========================================================= */
async function switchAdminTab(tab) {

    document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.remove('tab-active');
        b.classList.add('tab-inactive');
    });
    document.getElementById(`btn-${tab}`)?.classList.add('tab-active');

    const map = {
        dashboard:  'admin_dashboard.html',
        attendance: 'admin_attendance.html',
        reports:    'admin_report.html',
        schedule:   'admin_calendar.html',
        settings:   'admin_setting.html'
    };

    try {
        const res  = await fetch(map[tab]);
        const html = await res.text();
        const area = document.getElementById('adminContent');

        /* 기존 내용 제거 */
        area.innerHTML = html;

        /* ⚠️ 핵심 수정
           - IIFE로 감싸지 않음
           - const / let 재선언 방지
           - window 전역 함수만 살아있게 함
        */
        area.querySelectorAll('script').forEach(oldScript => {
            const s = document.createElement('script');

            if (oldScript.src) {
                s.src = oldScript.src;
            } else {
                s.textContent = oldScript.textContent;
            }

            document.body.appendChild(s);
            document.body.removeChild(s);
        });

        /* 탭별 초기화 */
        setTimeout(() => {
            if (tab === 'dashboard')  window.initAdminDashboard?.();
            if (tab === 'attendance') window.renderAttendanceFull?.();
            if (tab === 'reports')    window.renderWorkFull?.();
            if (tab === 'schedule')   window.renderScheduleFull?.();
            if (tab === 'settings')   window.initAdminSettings?.();
        }, 150);

    } catch (e) {
        console.error('[ADMIN TAB LOAD ERROR]', e);
    }
}

/* =========================================================
   4. 초기 진입
   ========================================================= */
window.addEventListener('DOMContentLoaded', () => {
    switchAdminTab('dashboard');
});
</script>




</body>
</html>
