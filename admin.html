<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin - DAILY SYSTEM</title>

    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css">

    <style>
        /* =====================================================
           DAY-BASED THEME SYSTEM
           0=Sun 1=Mon 2=Tue 3=Wed 4=Thu 5=Fri 6=Sat
        ===================================================== */

        /* MON - Deep Navy Steel: Cold industrial blue */
        body.day-1 {
            --day-accent: #3b82f6;
            --day-accent2: #1d4ed8;
            --day-accent3: #60a5fa;
            --day-glow: rgba(59,130,246,0.18);
            --day-glow2: rgba(29,78,216,0.12);
            --day-border: rgba(59,130,246,0.25);
            --day-surface: rgba(15,23,42,0.95);
            --day-card: rgba(15,23,42,0.8);
            --day-name: "MONDAY";
            --day-label: "MON";
            --panel-bg: linear-gradient(160deg, #050e1f 0%, #0a1628 50%, #07112a 100%);
            --aside-bg: linear-gradient(180deg, #04091a 0%, #071022 60%, #060e1e 100%);
        }
        /* TUE - Dark Emerald Forge: Deep green factory */
        body.day-2 {
            --day-accent: #10b981;
            --day-accent2: #047857;
            --day-accent3: #34d399;
            --day-glow: rgba(16,185,129,0.18);
            --day-glow2: rgba(4,120,87,0.12);
            --day-border: rgba(16,185,129,0.25);
            --day-surface: rgba(2,20,14,0.95);
            --day-card: rgba(3,16,12,0.8);
            --panel-bg: linear-gradient(160deg, #021008 0%, #041a10 50%, #031410 100%);
            --aside-bg: linear-gradient(180deg, #020c06 0%, #04140a 60%, #030e08 100%);
        }
        /* WED - Crimson Obsidian: Deep blood red */
        body.day-3 {
            --day-accent: #ef4444;
            --day-accent2: #b91c1c;
            --day-accent3: #f87171;
            --day-glow: rgba(239,68,68,0.18);
            --day-glow2: rgba(185,28,28,0.12);
            --day-border: rgba(239,68,68,0.25);
            --day-surface: rgba(20,5,5,0.95);
            --day-card: rgba(18,4,4,0.8);
            --panel-bg: linear-gradient(160deg, #100303 0%, #1a0505 50%, #140404 100%);
            --aside-bg: linear-gradient(180deg, #0c0202 0%, #160404 60%, #100303 100%);
        }
        /* THU - Violet Abyss: Dark purple cosmos */
        body.day-4 {
            --day-accent: #a855f7;
            --day-accent2: #7c3aed;
            --day-accent3: #c084fc;
            --day-glow: rgba(168,85,247,0.18);
            --day-glow2: rgba(124,58,237,0.12);
            --day-border: rgba(168,85,247,0.25);
            --day-surface: rgba(12,5,20,0.95);
            --day-card: rgba(10,4,18,0.8);
            --panel-bg: linear-gradient(160deg, #080313 0%, #0f0520 50%, #0a0418 100%);
            --aside-bg: linear-gradient(180deg, #06020f 0%, #0d041a 60%, #090315 100%);
        }
        /* FRI - Amber Furnace: Dark gold forge */
        body.day-5 {
            --day-accent: #f59e0b;
            --day-accent2: #d97706;
            --day-accent3: #fcd34d;
            --day-glow: rgba(245,158,11,0.18);
            --day-glow2: rgba(217,119,6,0.12);
            --day-border: rgba(245,158,11,0.25);
            --day-surface: rgba(20,14,2,0.95);
            --day-card: rgba(18,12,2,0.8);
            --panel-bg: linear-gradient(160deg, #100900 0%, #1a1000 50%, #140c00 100%);
            --aside-bg: linear-gradient(180deg, #0c0700 0%, #160e00 60%, #100900 100%);
        }
        /* SAT/SUN fallback - Slate Void */
        body.day-0, body.day-6 {
            --day-accent: #64748b;
            --day-accent2: #475569;
            --day-accent3: #94a3b8;
            --day-glow: rgba(100,116,139,0.15);
            --day-glow2: rgba(71,85,105,0.10);
            --day-border: rgba(100,116,139,0.2);
            --day-surface: rgba(8,10,15,0.95);
            --day-card: rgba(7,9,13,0.8);
            --panel-bg: linear-gradient(160deg, #050709 0%, #080a0f 50%, #060809 100%);
            --aside-bg: linear-gradient(180deg, #040508 0%, #070910 60%, #050709 100%);
        }

        /* =====================================================
           GLOBAL BASE
        ===================================================== */
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: Pretendard, sans-serif;
            background: var(--panel-bg);
            color: #e2e8f0;
            margin: 0; padding: 0;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background grid */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--day-border) 1px, transparent 1px),
                linear-gradient(90deg, var(--day-border) 1px, transparent 1px);
            background-size: 60px 60px;
            opacity: 0.18;
            pointer-events: none;
            z-index: 0;
            animation: gridShift 30s linear infinite;
        }
        @keyframes gridShift {
            0% { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        /* Radial ambient glow */
        body::after {
            content: '';
            position: fixed;
            top: -30%;
            left: -20%;
            width: 80%;
            height: 80%;
            background: radial-gradient(ellipse, var(--day-glow) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: ambientFloat 12s ease-in-out infinite alternate;
        }
        @keyframes ambientFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(8%, 5%) scale(1.1); }
        }

        main, aside, header, nav { position: relative; z-index: 1; }

        /* =====================================================
           3D CARD SYSTEM
        ===================================================== */
        .card-3d {
            background: var(--day-card);
            border: 1px solid var(--day-border);
            box-shadow:
                0 0 0 1px var(--day-border),
                0 4px 8px rgba(0,0,0,0.4),
                0 8px 24px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.06),
                inset 0 -1px 0 rgba(0,0,0,0.3);
            transform: translateZ(0);
            transition: box-shadow 0.3s ease, transform 0.3s ease;
        }
        .card-3d:hover {
            box-shadow:
                0 0 0 1px var(--day-accent),
                0 8px 16px rgba(0,0,0,0.5),
                0 16px 40px var(--day-glow),
                inset 0 1px 0 rgba(255,255,255,0.08),
                inset 0 -1px 0 rgba(0,0,0,0.3);
            transform: translateY(-2px) translateZ(0);
        }

        /* =====================================================
           ASIDE / SIDEBAR
        ===================================================== */
        aside {
            background: var(--aside-bg);
            border-right: 1px solid var(--day-border);
            box-shadow:
                inset -1px 0 0 var(--day-border),
                4px 0 30px rgba(0,0,0,0.6),
                inset 0 0 60px var(--day-glow2);
            overflow: hidden;
        }
        aside > div:first-child { flex-shrink: 0; }
        aside nav.flex {
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: thin;
            scrollbar-color: var(--day-accent) transparent;
            min-height: 0;
            padding-bottom: 0.5rem;
        }
        aside nav.flex::-webkit-scrollbar { width: 2px; }
        aside nav.flex::-webkit-scrollbar-track { background: transparent; }
        aside nav.flex::-webkit-scrollbar-thumb { background: var(--day-accent); border-radius: 99px; }
        aside > button:last-child { flex-shrink: 0; }

        /* Sidebar brand */
        .brand-title {
            font-size: 1.4rem;
            font-weight: 900;
            font-style: italic;
            letter-spacing: -0.03em;
            text-shadow: 0 0 20px var(--day-glow), 0 2px 4px rgba(0,0,0,0.5);
        }
        .brand-accent { color: var(--day-accent); }

        /* Profile card */
        .profile-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--day-border);
            border-radius: 1.25rem;
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.06),
                0 4px 20px rgba(0,0,0,0.4),
                0 0 30px var(--day-glow2);
        }

        /* Profile image container */
        .profile-img-wrap {
            border: 2px solid var(--day-accent);
            box-shadow:
                0 0 0 3px var(--day-glow),
                0 0 20px var(--day-glow),
                inset 0 0 10px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        .profile-img-wrap:hover {
            box-shadow:
                0 0 0 4px var(--day-accent),
                0 0 30px var(--day-glow),
                0 0 60px var(--day-glow2);
            transform: scale(1.05);
        }

        /* Edit badge */
        .edit-badge {
            background: var(--day-accent);
            box-shadow: 0 0 10px var(--day-glow), 0 2px 4px rgba(0,0,0,0.5);
        }

        /* Weather chip */
        .weather-chip {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--day-border);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
        }
        .weather-temp { color: var(--day-accent3) !important; }

        /* Online dot */
        .online-dot {
            background: var(--day-accent);
            box-shadow: 0 0 6px var(--day-glow), 0 0 12px var(--day-glow);
        }
        .online-text { color: var(--day-accent3) !important; }

        /* =====================================================
           NAV TABS
        ===================================================== */
        .tab-btn {
            transition: all 0.2s ease;
            cursor: pointer;
            border-radius: 0.75rem;
            margin-bottom: 0.25rem;
            font-weight: 700;
            font-size: 0.78rem;
            letter-spacing: 0.02em;
            border: 1px solid transparent;
            position: relative;
            overflow: hidden;
        }
        .tab-btn::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: var(--day-accent);
            border-radius: 0 2px 2px 0;
            transform: scaleY(0);
            transition: transform 0.2s ease;
        }
        .tab-active {
            color: var(--day-accent3);
            font-weight: 900;
            background: var(--day-glow);
            border-color: var(--day-border);
            box-shadow:
                0 2px 8px var(--day-glow2),
                inset 0 1px 0 rgba(255,255,255,0.05);
            text-shadow: 0 0 10px var(--day-glow);
        }
        .tab-active::before { transform: scaleY(1); }
        .tab-inactive { color: #475569; }
        .tab-inactive:hover {
            color: #94a3b8;
            background: rgba(255,255,255,0.04);
            border-color: rgba(255,255,255,0.05);
        }

        /* Day indicator badge in sidebar */
        .day-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 999px;
            background: var(--day-glow);
            border: 1px solid var(--day-border);
            font-size: 0.65rem;
            font-weight: 900;
            letter-spacing: 0.1em;
            color: var(--day-accent3);
            text-transform: uppercase;
            box-shadow: 0 0 12px var(--day-glow2);
        }
        .day-badge-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--day-accent);
            box-shadow: 0 0 6px var(--day-accent);
            animation: pulse-dot 2s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.7); }
        }

        /* =====================================================
           MOBILE HEADER
        ===================================================== */
        .mobile-header {
            background: var(--aside-bg);
            border-bottom: 1px solid var(--day-border);
            box-shadow:
                0 2px 20px rgba(0,0,0,0.5),
                0 0 30px var(--day-glow2),
                inset 0 -1px 0 var(--day-border);
        }

        /* =====================================================
           MOBILE NAV
        ===================================================== */
        .mobile-nav {
            background: var(--aside-bg);
            border-top: 1px solid var(--day-border);
            box-shadow:
                0 -4px 20px rgba(0,0,0,0.6),
                0 -1px 0 var(--day-border),
                inset 0 1px 0 rgba(255,255,255,0.04);
        }
        .mobile-tab-active {
            color: var(--day-accent) !important;
            font-weight: 900;
            text-shadow: 0 0 8px var(--day-glow);
        }
        .mobile-nav button span:first-child {
            filter: drop-shadow(0 0 4px var(--day-glow));
        }

        /* =====================================================
           MAIN CONTENT AREA
        ===================================================== */
        main {
            background: transparent;
        }

        /* Day header strip in main */
        .day-strip {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 20px;
            margin-bottom: 1.5rem;
            border-radius: 1rem;
            background: var(--day-glow2);
            border: 1px solid var(--day-border);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.04),
                0 2px 12px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }
        .day-strip::after {
            content: '';
            position: absolute;
            right: -20px; top: -20px;
            width: 80px; height: 80px;
            border-radius: 50%;
            background: var(--day-glow);
            filter: blur(20px);
        }
        .day-strip-label {
            font-size: 0.65rem;
            font-weight: 900;
            letter-spacing: 0.15em;
            color: var(--day-accent);
            text-transform: uppercase;
        }
        .day-strip-date {
            font-size: 0.7rem;
            font-weight: 700;
            color: #64748b;
            letter-spacing: 0.05em;
        }
        .day-strip-divider {
            width: 1px; height: 16px;
            background: var(--day-border);
        }

        /* =====================================================
           MODAL
        ===================================================== */
        #adminCustomModal > div {
            background: var(--day-surface);
            border: 1px solid var(--day-border);
            box-shadow:
                0 0 0 1px var(--day-border),
                0 20px 60px rgba(0,0,0,0.8),
                0 0 80px var(--day-glow2),
                inset 0 1px 0 rgba(255,255,255,0.06);
        }
        #adminCustomModal > div > div:first-child {
            background: var(--day-glow2);
            border-bottom: 1px solid var(--day-border);
        }
        #modalTitle {
            color: var(--day-accent3);
            text-shadow: 0 0 12px var(--day-glow);
        }
        #adminCustomModal > div > div:first-child button {
            color: #64748b;
            border-radius: 50%;
            transition: all 0.2s;
        }
        #adminCustomModal > div > div:first-child button:hover {
            color: var(--day-accent);
            background: var(--day-glow);
        }

        /* Logout button */
        .logout-btn {
            color: #475569;
            transition: all 0.2s ease;
            border-radius: 0.75rem;
            border: 1px solid transparent;
        }
        .logout-btn:hover {
            color: #ef4444;
            background: rgba(239,68,68,0.08);
            border-color: rgba(239,68,68,0.2);
        }

        /* Separator line */
        .aside-separator {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--day-border), transparent);
            margin: 1rem 0;
        }

        /* =====================================================
           RESPONSIVE
        ===================================================== */
        @media (max-width: 767px) {
            aside { display: none !important; }
            main { padding: 1rem !important; padding-bottom: 85px !important; padding-top: 60px !important; }
            .mobile-header { display: flex !important; }
            .mobile-nav { display: grid !important; }
        }

        /* =====================================================
           SCROLLBAR
        ===================================================== */
        ::-webkit-scrollbar { width: 0px; background: transparent; }

        /* =====================================================
           ANIMATIONS
        ===================================================== */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in-up { animation: fadeInUp 0.4s ease both; }

        /* =====================================================
           PROFILE PICKER
        ===================================================== */
        .profile-picker-item {
            transition: all 0.2s;
            border: 2px solid transparent;
            border-radius: 0.75rem;
            overflow: hidden;
            background: rgba(255,255,255,0.05);
        }
        .profile-picker-item:hover {
            transform: scale(1.06);
            border-color: var(--day-accent);
            box-shadow: 0 0 12px var(--day-glow);
        }

        /* admin profile containers */
        .admin-profile-img-container {
            width: 45px !important;
            height: 45px !important;
            transition: all 0.3s ease;
        }
        @media (min-width: 1024px) {
            .admin-profile-img-container {
                width: 88px !important;
                height: 88px !important;
            }
        }

        /* Typing cursor */
        .typing-cursor::after { content: '|'; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* Birthday alert */
        #mobile-birthday-dot.active { display: block !important; }

        /* Birthday section accent */
        #adminBirthdayAlert span:first-child { color: var(--day-accent3) !important; }
        #mobileBirthdayAlert span:first-child { color: var(--day-accent3) !important; }

        /* Horizontal rule in sidebar */
        .special-tab {
            color: var(--day-accent) !important;
            font-weight: 900;
        }

        /* TDLiD link */
        .tdlid-link {
            color: var(--day-accent3) !important;
            transition: all 0.2s;
            border-radius: 0.75rem;
            border: 1px solid transparent;
        }
        .tdlid-link:hover {
            background: var(--day-glow);
            border-color: var(--day-border);
        }

        /* Loading spinner uses accent color */
        .day-spinner {
            border-color: var(--day-border);
            border-top-color: var(--day-accent);
        }
    </style>
</head>

<body class="flex min-h-screen">

<!-- MOBILE HEADER -->
<header class="mobile-header fixed top-0 left-0 right-0 h-14 z-40 hidden items-center px-4 justify-between">
    <div class="flex items-center gap-3">
        <div class="relative cursor-pointer" onclick="openProfileImagePicker()">
            <div class="admin-profile-img-container rounded-full overflow-hidden bg-slate-900 profile-img-wrap">
                <img src="images/profile/image-01.jfif" alt="Admin" class="w-full h-full object-cover admin-profile-img"
                     onerror="this.src='https://ui-avatars.com/api/?name=Admin&background=0f172a&color=3b82f6'">
            </div>
            <div class="absolute -bottom-1 -right-1 w-4 h-4 edit-badge rounded-full border border-slate-950 flex items-center justify-center text-[8px]">✏️</div>
        </div>

        <div class="flex flex-col">
            <h1 class="brand-title text-sm leading-none">ADMIN <span class="brand-accent">SYSTEM</span></h1>

            <div id="mobileBirthdayAlert" class="hidden flex flex-col mt-0.5">
                <span class="text-[9px] font-black animate-pulse flex items-center gap-1">🎂 HAPPY BIRTHDAY!</span>
                <span id="mobileBirthdayNames" class="text-[8px] font-bold text-white uppercase tracking-tight leading-tight"></span>
            </div>

            <div id="weather-mobile" class="flex items-center gap-1 mt-0.5 opacity-80">
                <span class="weather-icon text-[10px]">☀️</span>
                <span class="weather-temp text-[9px] font-bold">--°C</span>
                <span class="text-[8px] text-slate-500 font-bold uppercase ml-0.5">JKT</span>
            </div>
        </div>
    </div>

    <div class="flex items-center gap-3">
        <!-- Day Badge mobile -->
        <div class="day-badge hidden md:flex" id="mobileDayBadge">
            <span class="day-badge-dot"></span>
            <span id="mobileDayLabel">MON</span>
        </div>
        <a href="https://tdlid.github.io" target="_blank" class="tdlid-link px-2 py-1 text-sm font-bold">🌐</a>
        <button onclick="adminLogout()" class="logout-btn px-2 py-1 text-lg">➡️</button>
    </div>
</header>

<!-- MOBILE BOTTOM NAV -->
<nav class="mobile-nav fixed bottom-0 left-0 right-0 z-50 hidden grid-cols-8 h-[70px] px-1 shadow-2xl">
    <button onclick="switchAdminTab('dashboard')"  class="flex flex-col items-center justify-center gap-1 text-[9px] font-bold text-slate-500"><span class="text-lg">📊</span><span>DASH</span></button>
    <button onclick="switchAdminTab('attendance')" class="flex flex-col items-center justify-center gap-1 text-[9px] font-bold text-slate-500"><span class="text-lg">👤</span><span>ATTEND</span></button>
    <button onclick="switchAdminTab('reports')"    class="flex flex-col items-center justify-center gap-1 text-[9px] font-bold text-slate-500"><span class="text-lg">📝</span><span>REPORTS</span></button>
    <button onclick="switchAdminTab('vacation')"   class="flex flex-col items-center justify-center gap-1 text-[9px] font-bold text-slate-500"><span class="text-lg">🏖️</span><span>VACATION</span></button>
    <button onclick="switchAdminTab('schedule')"   class="flex flex-col items-center justify-center gap-1 text-[9px] font-bold text-slate-500"><span class="text-lg">📅</span><span>CAL</span></button>
    <button onclick="switchAdminTab('workstat')"   class="flex flex-col items-center justify-center gap-1 text-[9px] font-bold text-slate-500"><span class="text-lg">📉</span><span>W.ANIS</span></button>
    <button onclick="switchAdminTab('statistic')"  class="flex flex-col items-center justify-center gap-1 text-[9px] font-bold text-slate-500"><span class="text-lg">📈</span><span>A.STAT</span></button>
    <button onclick="switchAdminTab('settings')"   class="flex flex-col items-center justify-center gap-1 text-[9px] font-bold text-slate-500"><span class="text-lg">⚙️</span><span>SET</span></button>
</nav>

<!-- SIDEBAR -->
<aside class="hidden md:flex w-72 p-6 sticky top-0 h-screen flex-col min-h-0">

    <!-- Brand + Day Badge -->

async function updateAdminWeather() {
    try {
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-6.2088&longitude=106.8456&current_weather=true');
        const data = await res.json();
        const { temperature, weathercode } = data.current_weather;
        let icon = '☀️';
        if (weathercode >= 1 && weathercode <= 3) icon = '⛅';
        else if (weathercode >= 45 && weathercode <= 48) icon = '☁️';
        else if (weathercode >= 51 && weathercode <= 67) icon = '🌧️';
        else if (weathercode >= 80 && weathercode <= 82) icon = '🌦️';
        else if (weathercode >= 95) icon = '⛈️';
        const tempStr = `${Math.round(temperature)}°C`;
        document.querySelectorAll('.weather-icon').forEach(el => el.innerText = icon);
        document.querySelectorAll('.weather-temp').forEach(el => el.innerText = tempStr);
    } catch (e) { console.error("Weather Update Failed", e); }
}

/* ============================================================
   BIRTHDAY CHECK
============================================================ */
async function checkStaffBirthdays() {
    const today = new Date();
    const tMonthDay = `${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
    const lunar = Lunar.fromDate(today);
    const lMonthDay = `${String(lunar.getMonth()).padStart(2,'0')}-${String(lunar.getDay()).padStart(2,'0')}`;

    db.ref('users').once('value', snap => {
        const users = snap.val();
        if (!users) return;
        let birthdayMessages = [];
        Object.keys(users).forEach(id => {
            const u = users[id];
            if (!u.birthday) return;
            const bMonthDay = u.birthday.substring(5);
            const type = u.birthType || "Solar";
            const bDateFull = u.birthday.replace(/-/g, '.');
            const isSolarMatch = (type === "Solar" || type === "양력") && bMonthDay === tMonthDay;
            const isLunarMatch = (type === "Lunar" || type === "음력") && bMonthDay === lMonthDay;
            if (isSolarMatch || isLunarMatch) birthdayMessages.push(`${id}: ${bDateFull}`);
        });

        const alertBox = document.getElementById('adminBirthdayAlert');
        const nameText = document.getElementById('adminBirthdayNames');
        const mobAlert = document.getElementById('mobileBirthdayAlert');
        const mobNames = document.getElementById('mobileBirthdayNames');

        if (alertBox && nameText) {
            if (birthdayMessages.length > 0) {
                alertBox.classList.remove('hidden');
                nameText.innerHTML = birthdayMessages.join('<br>');
            } else { alertBox.classList.add('hidden'); }
        }
        if (mobAlert && mobNames) {
            if (birthdayMessages.length > 0) {
                mobAlert.classList.remove('hidden');
                mobNames.innerHTML = birthdayMessages.join('<br>');
            } else { mobAlert.classList.add('hidden'); }
        }
    });
}

/* ============================================================

function restoreCoreModalFunctions() {
    window._coreModalRestored = true;

    window.openAdminCustomModal = function(title, bodyHtml) {
        const ac = document.getElementById('adminContent');
        if (ac) {
            ['modalTitle','modalBody','adminCustomModal'].forEach(id => {
                ac.querySelectorAll(`#${id}`).forEach(el => el.removeAttribute('id'));
            });
        }
        const m = document.getElementById('adminCustomModal');
        if (!m) { console.error('adminCustomModal not found'); return; }
        const tB = m.querySelector('#modalTitle');
        const bB = m.querySelector('#modalBody');
        if (!tB || !bB) { console.error('Modal inner elements not found'); return; }
        tB.innerHTML = title;
        bB.innerHTML = bodyHtml;
        m.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
    };

    window.closeAdminCustomModal = function() {
        ['attStartPicker','attEndPicker','editStartPicker','editEndPicker'].forEach(key => {
            if (window[key]) { window[key].destroy(); window[key] = null; }
        });
        document.querySelectorAll('.flatpickr-calendar').forEach(el => el.remove());
        const m = document.getElementById('adminCustomModal');
        if (m) { m.classList.add('hidden'); document.body.style.overflow = ''; }
    };
}

/* ============================================================
   TAB SWITCHER
============================================================ */
async function switchAdminTab(tab) {
    ['attStartPicker','attEndPicker','editStartPicker','editEndPicker'].forEach(key => {
        if (window[key]) { window[key].destroy(); window[key] = null; }
    });
    document.querySelectorAll('.flatpickr-calendar').forEach(el => el.remove());

    const existingModal = document.getElementById('adminCustomModal');
    if (existingModal) { existingModal.classList.add('hidden'); document.body.style.overflow = ''; }

    const area = document.getElementById('adminContent');
    if (!area) return;
    area.innerHTML = `<div class="flex justify-center items-center h-64"><div class="animate-spin rounded-full h-12 w-12 border-b-2 day-spinner" style="border-color:var(--day-border);border-top-color:var(--day-accent)"></div></div>`;

    document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.remove('tab-active');
        b.classList.add('tab-inactive');
    });
    const activeBtn = document.getElementById(`btn-${tab}`);
    if (activeBtn) {
        activeBtn.classList.remove('tab-inactive');
        activeBtn.classList.add('tab-active');
    }

    const mBtns = document.querySelectorAll('.mobile-nav button');
    mBtns.forEach(b => b.classList.remove('mobile-tab-active'));
    const idxMap = { dashboard:0, attendance:1, reports:2, vacation:3, schedule:4, workstat:5, statistic:6, settings:7 };
    const idx = idxMap[tab];
    if (idx !== undefined) mBtns[idx]?.classList.add('mobile-tab-active');

    const fileMap = {
        dashboard: 'admin_dashboard.html',
        attendance: 'admin_attendance.html',
        reports:    'admin_report.html',
        vacation:   'admin_vacation.html',
        schedule:   'admin_calendar.html',
        statistic:  'admin_statistic.html',
        workstat:   'work_statistic.html',
        settings:   'admin_setting.html'
    };

    try {
        const res  = await fetch(fileMap[tab]);
        const html = await res.text();
        area.innerHTML = html;

        document.querySelectorAll('script[data-dynamic="true"]').forEach(s => s.remove());

        const scripts = Array.from(area.querySelectorAll('script'));
        const externalScripts = scripts.filter(s => s.src);
        const inlineScripts   = scripts.filter(s => !s.src);

        await Promise.all(externalScripts.map(oldScript => new Promise(resolve => {
            const newScript = document.createElement('script');
            newScript.setAttribute('data-dynamic', 'true');
            Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
            newScript.onload  = resolve;
            newScript.onerror = resolve;
            document.head.appendChild(newScript);
        })));

        for (const oldScript of inlineScripts) {
            const newScript = document.createElement('script');
            newScript.setAttribute('data-dynamic', 'true');
            Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
            newScript.textContent = oldScript.textContent;
            document.head.appendChild(newScript);
        }

        setTimeout(() => restoreCoreModalFunctions(), 0);

    } catch (e) {
        area.innerHTML = `<div class="p-10 text-center font-bold" style="color:var(--day-accent)">Load Failed.</div>`;
    }
}

/* ============================================================
   LOGOUT
============================================================ */
window.adminLogout = function() {
    if (confirm("Logout?")) {
        firebase.auth().signOut().then(() => window.location.replace("index.html"));
    }
};

   INIT
============================================================ */
window.addEventListener('DOMContentLoaded', () => {
    restoreCoreModalFunctions();
    updateAdminWeather();
    checkStaffBirthdays();
    switchAdminTab('dashboard');
    setInterval(updateAdminWeather, 1800000);
    setInterval(checkStaffBirthdays, 3600000);
});
</script>
