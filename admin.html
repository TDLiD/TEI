window.saveAdminProfile = function(imgName) {
    const path = `images/profile/admin/${imgName}`;
    if(!confirm("Would you like to change your admin profile to this image?")) return;
    
    // [수정] admin_settings/profile -> users/Admin 경로로 변경
    db.ref('users/Admin').update({ 
        profileImg: path, 
        updatedAt: firebase.database.ServerValue.TIMESTAMP 
    }).then(() => {
        const timestamp = new Date().getTime();

// 자카르타 날씨 연동 함수 (Admin 전용)
async function updateAdminWeather() {
    try {
        // Open-Meteo API (Jakarta 좌표 사용)
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-6.2088&longitude=106.8456&current_weather=true');
        const data = await res.json();
        const { temperature, weathercode } = data.current_weather;
        
        // 날씨 상태 코드별 이모지 설정
        let icon = '☀️';
        if (weathercode >= 1 && weathercode <= 3) icon = '⛅';
        else if (weathercode >= 45 && weathercode <= 48) icon = '☁️';
        else if (weathercode >= 51 && weathercode <= 67) icon = '🌧️';
        else if (weathercode >= 80 && weathercode <= 82) icon = '🌦️';
        else if (weathercode >= 95) icon = '⛈️';

        const tempStr = `${Math.round(temperature)}°C`;

        // 헤더 및 사이드바(사이드바에도 클래스가 있다면)의 날씨 정보 업데이트
        document.querySelectorAll('.weather-icon').forEach(el => el.innerText = icon);
        document.querySelectorAll('.weather-temp').forEach(el => el.innerText = tempStr);
        
        console.log("Admin System: Jakarta Weather Updated", tempStr);
    } catch (e) {
        console.error("Weather Update Failed", e);
    }
}

/* ───── STAFF 생일 판단 및 표시 로직 (Admin용) ───── */
async function checkStaffBirthdays() {
    const today = new Date();
    const tMonthDay = `${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
    
    // 음력 날짜 계산
    const lunar = Lunar.fromDate(today);
    const lMonthDay = `${String(lunar.getMonth()).padStart(2, '0')}-${String(lunar.getDay()).padStart(2, '0')}`;

    db.ref('users').once('value', snap => {
        const users = snap.val();
        if (!users) return;

        let birthdayMessages = [];

        Object.keys(users).forEach(id => {
            const u = users[id];
            if (!u.birthday) return;

            const bMonthDay = u.birthday.substring(5); 
            const type = u.birthType || "Solar";
            const bDateFull = u.birthday.replace(/-/g, '.');

            const isSolarMatch = (type === "Solar" || type === "양력") && bMonthDay === tMonthDay;
            const isLunarMatch = (type === "Lunar" || type === "음력") && bMonthDay === lMonthDay;

            if (isSolarMatch || isLunarMatch) {
                // 형식: Mr-Ray: 2000.03.06
                birthdayMessages.push(`${id}: ${bDateFull}`);
            }
        });

        const alertBox = document.getElementById('adminBirthdayAlert');
        const nameText = document.getElementById('adminBirthdayNames');

        if (alertBox && nameText) {
            if (birthdayMessages.length > 0) {
                alertBox.classList.remove('hidden');
                nameText.innerHTML = birthdayMessages.join('<br>'); 
            } else {
                alertBox.classList.add('hidden');
            }
        }
    });
}

                            <span class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">${u.role || 'Staff'}</span>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="text-[10px] font-black text-blue-400 uppercase tracking-tighter italic">${bType}</div>
                        <div class="text-xs font-bold text-slate-300">${bDate}</div>
                    </div>
                </div>`;
            }
        });

        // 스태프가 없을 경우 예외 처리 및 하단 닫기 버튼 추가
        if (userList.filter(u => u.birthday).length === 0) {
            html = `<div class="text-center py-10 text-slate-500 font-bold">No birthday data found.</div>`;
        }

        html += `
            </div>
            <div class="mt-4 pt-4 border-t border-slate-800">
                <button onclick="closeAdminCustomModal()" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl transition-all">
                    CLOSE
                </button>
            </div>`;
        
        // Admin 전용 모달 함수 호출
        if(typeof openAdminCustomModal === 'function') {
            openAdminCustomModal('STAFF BIRTHDAYS', html);
        }
    });
};


// 페이지 로드 시 즉시 실행 및 30분마다 자동 갱신
updateAdminWeather();
setInterval(updateAdminWeather, 1800000);

    // 5. 탭 전환 시스템 (수정됨: 스크립트 중복 선언 방지 로직 추가)
    async function switchAdminTab(tab) {
        const area = document.getElementById('adminContent');
        if (!area) return;
        area.innerHTML = '<div class="flex justify-center items-center h-64"><div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500"></div></div>';
        
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.replace('tab-active', 'tab-inactive'));
        document.getElementById(`btn-${tab}`)?.classList.add('tab-active');
        
        const mBtns = document.querySelectorAll('.mobile-nav button');
        mBtns.forEach(b => b.classList.remove('mobile-tab-active'));
        
        const idxMap = { dashboard:0, attendance:1, reports:2, leave:3, schedule:4, workstat:5, statistic:6, settings:7 };
        const idx = idxMap[tab];
        if(idx !== undefined) mBtns[idx].classList.add('mobile-tab-active');

        const fileMap = { 
            dashboard: 'admin_dashboard.html', 
            attendance: 'admin_attendance.html', 
            reports: 'admin_report.html', 
            leave: 'admin_leave.html', 
            schedule: 'admin_calendar.html', 
            statistic: 'admin_statistic.html',
            workstat: 'work_statistic.html', 
            settings: 'admin_setting.html' 
        };

        try {
            const res = await fetch(fileMap[tab]);
            const html = await res.text();
            area.innerHTML = html;
            
            // [중요] 기존에 동적으로 추가된 스크립트 태그들을 제거하여 '이미 선언됨' 오류 방지
            document.querySelectorAll('script[data-dynamic="true"]').forEach(s => s.remove());

            const scripts = area.querySelectorAll('script');
            for (const oldScript of scripts) {
                const newScript = document.createElement('script');
                // 동적으로 추가된 스크립트임을 표시
                newScript.setAttribute('data-dynamic', 'true');
                
                Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                if (oldScript.src) { 
                    newScript.src = oldScript.src; 
                    document.head.appendChild(newScript); 
                } else { 
                    newScript.textContent = oldScript.textContent; 
                    document.head.appendChild(newScript); 
                }
            }
        } catch (e) { area.innerHTML = `<div class="p-10 text-center text-rose-500">Load Failed.</div>`; }
    }

    window.adminLogout = function() { if (confirm("Logout?")) { firebase.auth().signOut().then(() => window.location.replace("index.html")); } };

    window.addEventListener('DOMContentLoaded', () => { 
        switchAdminTab('dashboard'); 
    });
</script>
