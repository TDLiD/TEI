<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin - DAILY SYSTEM</title>

    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css">

    <style>
        /* =====================================================
           DAY-BASED THEME SYSTEM
           0=Sun 1=Mon 2=Tue 3=Wed 4=Thu 5=Fri 6=Sat
        ===================================================== */

        /* MON - Deep Navy Steel */
        body.day-1 {
            --day-accent: #3b82f6; --day-accent2: #1d4ed8; --day-accent3: #60a5fa;
            --day-glow: rgba(59,130,246,0.18); --day-glow2: rgba(29,78,216,0.12);
            --day-border: rgba(59,130,246,0.25);
            --day-surface: rgba(15,23,42,0.95); --day-card: rgba(15,23,42,0.8);
            --panel-bg: linear-gradient(160deg,#050e1f 0%,#0a1628 50%,#07112a 100%);
            --aside-bg: linear-gradient(180deg,#04091a 0%,#071022 60%,#060e1e 100%);
            --online-bg: linear-gradient(135deg,rgba(5,14,31,.98) 0%,rgba(10,22,40,.95) 100%);
            --online-header-bg: linear-gradient(90deg,rgba(29,78,216,.3) 0%,rgba(59,130,246,.15) 100%);
            --online-item-bg: rgba(59,130,246,.06); --online-item-hover: rgba(59,130,246,.12);
            --online-pulse: #3b82f6; --online-scan: rgba(59,130,246,.08);
            --online-dot-color: #22d3ee; --online-time-color: #38bdf8;
            /* 3D extras */
            --day-pattern: repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(59,130,246,.1) 39px,rgba(59,130,246,.1) 40px),
                           repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(59,130,246,.1) 39px,rgba(59,130,246,.1) 40px);
            --day-orb1: rgba(59,130,246,.22); --day-orb2: rgba(29,78,216,.10);
            --aside-top-bar: linear-gradient(90deg,#1d4ed8,#3b82f6,#60a5fa,#3b82f6,#1d4ed8);
        }
        /* TUE - Dark Emerald Forge */
        body.day-2 {
            --day-accent: #10b981; --day-accent2: #047857; --day-accent3: #34d399;
            --day-glow: rgba(16,185,129,.18); --day-glow2: rgba(4,120,87,.12);
            --day-border: rgba(16,185,129,.25);
            --day-surface: rgba(2,20,14,.95); --day-card: rgba(3,16,12,.8);
            --panel-bg: linear-gradient(160deg,#021008 0%,#041a10 50%,#031410 100%);
            --aside-bg: linear-gradient(180deg,#020c06 0%,#04140a 60%,#030e08 100%);
            --online-bg: linear-gradient(135deg,rgba(2,10,8,.98) 0%,rgba(4,26,16,.95) 100%);
            --online-header-bg: linear-gradient(90deg,rgba(4,120,87,.3) 0%,rgba(16,185,129,.15) 100%);
            --online-item-bg: rgba(16,185,129,.06); --online-item-hover: rgba(16,185,129,.12);
            --online-pulse: #10b981; --online-scan: rgba(16,185,129,.08);
            --online-dot-color: #6ee7b7; --online-time-color: #34d399;
            --day-pattern: repeating-linear-gradient(-45deg,transparent 0,transparent 8px,rgba(16,185,129,.05) 8px,rgba(16,185,129,.05) 9px);
            --day-orb1: rgba(16,185,129,.20); --day-orb2: rgba(4,120,87,.10);
            --aside-top-bar: linear-gradient(90deg,#047857,#10b981,#34d399,#10b981,#047857);
        }
        /* WED - Crimson Obsidian */
        body.day-3 {
            --day-accent: #ef4444; --day-accent2: #b91c1c; --day-accent3: #f87171;
            --day-glow: rgba(239,68,68,.18); --day-glow2: rgba(185,28,28,.12);
            --day-border: rgba(239,68,68,.25);
            --day-surface: rgba(20,5,5,.95); --day-card: rgba(18,4,4,.8);
            --panel-bg: linear-gradient(160deg,#100303 0%,#1a0505 50%,#140404 100%);
            --aside-bg: linear-gradient(180deg,#0c0202 0%,#160404 60%,#100303 100%);
            --online-bg: linear-gradient(135deg,rgba(16,3,3,.98) 0%,rgba(26,5,5,.95) 100%);
            --online-header-bg: linear-gradient(90deg,rgba(185,28,28,.3) 0%,rgba(239,68,68,.15) 100%);
            --online-item-bg: rgba(239,68,68,.06); --online-item-hover: rgba(239,68,68,.12);
            --online-pulse: #ef4444; --online-scan: rgba(239,68,68,.08);
            --online-dot-color: #fca5a5; --online-time-color: #f87171;
            --day-pattern: repeating-conic-gradient(rgba(239,68,68,.07) 0% 25%,transparent 0% 50%) 0 0/28px 28px;
            --day-orb1: rgba(239,68,68,.20); --day-orb2: rgba(185,28,28,.10);
            --aside-top-bar: linear-gradient(90deg,#b91c1c,#ef4444,#f87171,#ef4444,#b91c1c);
        }
        /* THU - Violet Abyss */
        body.day-4 {
            --day-accent: #a855f7; --day-accent2: #7c3aed; --day-accent3: #c084fc;
            --day-glow: rgba(168,85,247,.18); --day-glow2: rgba(124,58,237,.12);
            --day-border: rgba(168,85,247,.25);
            --day-surface: rgba(12,5,20,.95); --day-card: rgba(10,4,18,.8);
            --panel-bg: linear-gradient(160deg,#080313 0%,#0f0520 50%,#0a0418 100%);
            --aside-bg: linear-gradient(180deg,#06020f 0%,#0d041a 60%,#090315 100%);
            --online-bg: linear-gradient(135deg,rgba(8,3,19,.98) 0%,rgba(15,5,32,.95) 100%);
            --online-header-bg: linear-gradient(90deg,rgba(124,58,237,.3) 0%,rgba(168,85,247,.15) 100%);
            --online-item-bg: rgba(168,85,247,.06); --online-item-hover: rgba(168,85,247,.12);
            --online-pulse: #a855f7; --online-scan: rgba(168,85,247,.08);
            --online-dot-color: #d8b4fe; --online-time-color: #c084fc;
            --day-pattern: radial-gradient(circle at 50% 50%,rgba(168,85,247,.06) 15%,transparent 16%) 0 0/26px 26px,
                           radial-gradient(circle at 0 100%,rgba(168,85,247,.06) 15%,transparent 16%) 0 0/26px 26px;
            --day-orb1: rgba(168,85,247,.22); --day-orb2: rgba(124,58,237,.10);
            --aside-top-bar: linear-gradient(90deg,#7c3aed,#a855f7,#c084fc,#a855f7,#7c3aed);
        }
        /* FRI - Amber Furnace */
        body.day-5 {
            --day-accent: #f59e0b; --day-accent2: #d97706; --day-accent3: #fcd34d;
            --day-glow: rgba(245,158,11,.18); --day-glow2: rgba(217,119,6,.12);
            --day-border: rgba(245,158,11,.25);
            --day-surface: rgba(20,14,2,.95); --day-card: rgba(18,12,2,.8);
            --panel-bg: linear-gradient(160deg,#100900 0%,#1a1000 50%,#140c00 100%);
            --aside-bg: linear-gradient(180deg,#0c0700 0%,#160e00 60%,#100900 100%);
            --online-bg: linear-gradient(135deg,rgba(16,9,0,.98) 0%,rgba(26,16,0,.95) 100%);
            --online-header-bg: linear-gradient(90deg,rgba(217,119,6,.3) 0%,rgba(245,158,11,.15) 100%);
            --online-item-bg: rgba(245,158,11,.06); --online-item-hover: rgba(245,158,11,.12);
            --online-pulse: #f59e0b; --online-scan: rgba(245,158,11,.08);
            --online-dot-color: #fde68a; --online-time-color: #fcd34d;
            --day-pattern: repeating-radial-gradient(ellipse at 50% 200%,transparent 0%,transparent 20%,rgba(245,158,11,.06) 21%,rgba(245,158,11,.06) 22%,transparent 23%);
            --day-orb1: rgba(245,158,11,.20); --day-orb2: rgba(217,119,6,.10);
            --aside-top-bar: linear-gradient(90deg,#d97706,#f59e0b,#fcd34d,#f59e0b,#d97706);
        }
        /* SAT/SUN - Slate Void */
        body.day-0, body.day-6 {
            --day-accent: #64748b; --day-accent2: #475569; --day-accent3: #94a3b8;
            --day-glow: rgba(100,116,139,.15); --day-glow2: rgba(71,85,105,.10);
            --day-border: rgba(100,116,139,.2);
            --day-surface: rgba(8,10,15,.95); --day-card: rgba(7,9,13,.8);
            --panel-bg: linear-gradient(160deg,#050709 0%,#080a0f 50%,#060809 100%);
            --aside-bg: linear-gradient(180deg,#040508 0%,#070910 60%,#050709 100%);
            --online-bg: linear-gradient(135deg,rgba(5,7,9,.98) 0%,rgba(8,10,15,.95) 100%);
            --online-header-bg: linear-gradient(90deg,rgba(71,85,105,.3) 0%,rgba(100,116,139,.15) 100%);
            --online-item-bg: rgba(100,116,139,.06); --online-item-hover: rgba(100,116,139,.10);
            --online-pulse: #64748b; --online-scan: rgba(100,116,139,.06);
            --online-dot-color: #cbd5e1; --online-time-color: #94a3b8;
            --day-pattern: radial-gradient(circle,rgba(100,116,139,.12) 1px,transparent 1px) 0 0/18px 18px;
            --day-orb1: rgba(100,116,139,.15); --day-orb2: rgba(71,85,105,.08);
            --aside-top-bar: linear-gradient(90deg,#475569,#64748b,#94a3b8,#64748b,#475569);
        }

        /* =====================================================
           GLOBAL BASE
        ===================================================== */
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: Pretendard, sans-serif;
            background: var(--panel-bg);
            color: #e2e8f0;
            margin: 0; padding: 0;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Day pattern layer */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background: var(--day-pattern);
            opacity: .85;
            pointer-events: none; z-index: 0;
            animation: patternDrift 50s linear infinite;
        }
        @keyframes patternDrift {
            0%   { background-position: 0 0, 0 0; }
            100% { background-position: 60px 60px, 60px 60px; }
        }

        /* Ambient orb top-left */
        body::after {
            content: '';
            position: fixed;
            top: -30%; left: -20%;
            width: 80%; height: 80%;
            background: radial-gradient(ellipse, var(--day-orb1) 0%, transparent 70%);
            pointer-events: none; z-index: 0;
            animation: ambientFloat 12s ease-in-out infinite alternate;
        }
        @keyframes ambientFloat {
            0%   { transform: translate(0,0) scale(1); }
            100% { transform: translate(8%,5%) scale(1.1); }
        }

        /* Ambient orb bottom-right */
        .orb-br {
            position: fixed;
            bottom: -20%; right: -15%;
            width: 55%; height: 55%;
            background: radial-gradient(ellipse, var(--day-orb2) 0%, transparent 70%);
            pointer-events: none; z-index: 0;
            animation: orbBR 16s ease-in-out infinite alternate;
        }
        @keyframes orbBR {
            0%   { transform: translate(0,0) scale(1); opacity: .6; }
            100% { transform: translate(-5%,-5%) scale(1.08); opacity: 1; }
        }

        main, aside, header, nav { position: relative; z-index: 1; }

        /* =====================================================
           3D CARD SYSTEM
        ===================================================== */
        .card-3d {
            background: var(--day-card);
            border: 1px solid var(--day-border);
            box-shadow:
                0 0 0 1px var(--day-border),
                0 4px 8px rgba(0,0,0,.4),
                0 8px 24px rgba(0,0,0,.5),
                inset 0 1px 0 rgba(255,255,255,.06),
                inset 0 -1px 0 rgba(0,0,0,.3);
            transform: translateZ(0);
            transition: box-shadow .3s ease, transform .3s ease;
        }
        .card-3d:hover {
            box-shadow:
                0 0 0 1px var(--day-accent),
                0 8px 16px rgba(0,0,0,.5),
                0 16px 40px var(--day-glow),
                inset 0 1px 0 rgba(255,255,255,.08),
                inset 0 -1px 0 rgba(0,0,0,.3);
            transform: translateY(-3px) rotateX(2deg) translateZ(0);
        }

        /* =====================================================
           ★ SIDEBAR COLLAPSE SYSTEM ★
        ===================================================== */
        aside {
            --aside-w: 18rem;
            width: var(--aside-w);
            min-width: var(--aside-w);
            background: var(--aside-bg);
            border-right: 1px solid var(--day-border);
            box-shadow: inset -1px 0 0 var(--day-border), 4px 0 30px rgba(0,0,0,.6), inset 0 0 60px var(--day-glow2);
            overflow: hidden;
            position: relative;
            /* collapse transition */
            transition:
                width .45s cubic-bezier(.4,0,.2,1),
                min-width .45s cubic-bezier(.4,0,.2,1),
                opacity .35s ease,
                box-shadow .35s ease;
            will-change: width;
        }

        /* Sidebar inner — fixed width so content never reflows */
        aside > .sidebar-inner {
            width: var(--aside-w);
            min-width: var(--aside-w);
            height: 100%;
            overflow: hidden;
        }

        @media (min-width: 768px) {
            aside {
                position: sticky;
                top: 0;
                height: 100vh;
            }
            aside.sidebar-collapsed {
                width: 0 !important;
                min-width: 0 !important;
                opacity: 0;
                pointer-events: none;
                border-right-color: transparent;
                box-shadow: none;
            }
        }

        /* Shimmer top bar */
        aside .sidebar-inner::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: var(--aside-top-bar);
            background-size: 200% 100%;
            animation: shimmer 3s linear infinite;
            z-index: 10;
        }
        @keyframes shimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Hover zone strip on left edge */
        #sidebarHoverZone {
            position: fixed;
            left: 0; top: 0; bottom: 0;
            width: 18px;
            z-index: 1100;
            cursor: pointer;
            display: none;
        }

        /* Peek tab shown when sidebar is collapsed */
        #sidebarToggleTab {
            position: fixed;
            left: 0; top: 50%;
            transform: translateY(-50%);
            z-index: 1200;
            background: var(--day-accent2);
            border: 1px solid var(--day-border);
            border-left: none;
            border-radius: 0 12px 12px 0;
            padding: 14px 7px;
            cursor: pointer;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            opacity: 0;
            transition: opacity .3s ease, background .2s;
            box-shadow: 4px 0 16px var(--day-glow), 0 0 0 1px var(--day-border);
        }
        #sidebarToggleTab.tab-visible { opacity: 1; }
        #sidebarToggleTab:hover { background: var(--day-accent); }
        #sidebarToggleTab .tab-chevron { font-size: 12px; color: white; font-weight: 900; }
        #sidebarToggleTab .tab-label {
            font-size: 8px; color: rgba(255,255,255,.75); font-weight: 900;
            text-transform: uppercase; letter-spacing: .06em;
            writing-mode: vertical-rl; text-orientation: mixed;
        }

        /* Accent edge line when collapsed */
        #sidebarEdgeLine {
            position: fixed;
            left: 0; top: 0; bottom: 0;
            width: 2px;
            background: linear-gradient(180deg,transparent,var(--day-accent),var(--day-accent3),var(--day-accent),transparent);
            z-index: 1050;
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s ease;
        }
        #sidebarEdgeLine.el-visible { opacity: 1; }

        aside nav.flex {
            overflow-y: auto; overflow-x: hidden;
            scrollbar-width: thin; scrollbar-color: var(--day-accent) transparent;
            min-height: 0; padding-bottom: .5rem;
        }
        aside nav.flex::-webkit-scrollbar { width: 2px; }
        aside nav.flex::-webkit-scrollbar-thumb { background: var(--day-accent); border-radius: 99px; }

        /* =====================================================
           BRAND & PROFILE
        ===================================================== */
        .brand-title {
            font-size: 1.4rem; font-weight: 900;
            font-style: italic; letter-spacing: -.03em;
            text-shadow: 0 0 20px var(--day-glow), 0 2px 4px rgba(0,0,0,.5);
        }
        .brand-accent { color: var(--day-accent); }

        .profile-card {
            background: rgba(255,255,255,.03);
            border: 1px solid var(--day-border);
            border-radius: 1.25rem;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 4px 20px rgba(0,0,0,.4), 0 0 30px var(--day-glow2);
        }
        .profile-img-wrap {
            border: 2px solid var(--day-accent);
            box-shadow: 0 0 0 3px var(--day-glow), 0 0 20px var(--day-glow), inset 0 0 10px rgba(0,0,0,.3);
            transition: all .3s ease;
        }
        .profile-img-wrap:hover {
            box-shadow: 0 0 0 4px var(--day-accent), 0 0 30px var(--day-glow), 0 0 60px var(--day-glow2);
            transform: scale(1.05);
        }
        .edit-badge { background: var(--day-accent); box-shadow: 0 0 10px var(--day-glow), 0 2px 4px rgba(0,0,0,.5); }
        .weather-chip { background: rgba(0,0,0,.3); border: 1px solid var(--day-border); box-shadow: inset 0 1px 0 rgba(255,255,255,.05); }
        .weather-temp { color: var(--day-accent3) !important; }
        .online-dot { background: var(--day-accent); box-shadow: 0 0 6px var(--day-glow), 0 0 12px var(--day-glow); }
        .online-text { color: var(--day-accent3) !important; }

        /* =====================================================
           NAV TABS
        ===================================================== */
        .tab-btn {
            transition: all .2s ease; cursor: pointer;
            border-radius: .75rem; margin-bottom: .25rem;
            font-weight: 700; font-size: .78rem;
            letter-spacing: .02em;
            border: 1px solid transparent;
            position: relative; overflow: hidden;
        }
        .tab-btn::before {
            content: '';
            position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
            background: var(--day-accent); border-radius: 0 2px 2px 0;
            transform: scaleY(0); transition: transform .2s ease;
        }
        .tab-active {
            color: var(--day-accent3); font-weight: 900;
            background: var(--day-glow); border-color: var(--day-border);
            box-shadow: 0 2px 8px var(--day-glow2), inset 0 1px 0 rgba(255,255,255,.05);
            text-shadow: 0 0 10px var(--day-glow);
        }
        .tab-active::before { transform: scaleY(1); }
        .tab-inactive { color: #475569; }
        .tab-inactive:hover { color: #94a3b8; background: rgba(255,255,255,.04); border-color: rgba(255,255,255,.05); }

        .day-badge {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 4px 10px; border-radius: 999px;
            background: var(--day-glow); border: 1px solid var(--day-border);
            font-size: .65rem; font-weight: 900; letter-spacing: .1em;
            color: var(--day-accent3); text-transform: uppercase;
            box-shadow: 0 0 12px var(--day-glow2);
        }
        .day-badge-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--day-accent); box-shadow: 0 0 6px var(--day-accent);
            animation: pulse-dot 2s ease-in-out infinite;
        }
        @keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.6;transform:scale(.7)} }

        /* =====================================================
           MOBILE HEADER
        ===================================================== */
        .mobile-header {
            background: var(--aside-bg);
            border-bottom: 1px solid var(--day-border);
            box-shadow: 0 2px 20px rgba(0,0,0,.5), 0 0 30px var(--day-glow2), inset 0 -1px 0 var(--day-border);
            position: relative;
        }
        .mobile-header::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: var(--aside-top-bar); background-size: 200% 100%;
            animation: shimmer 3s linear infinite;
        }

        /* =====================================================
           MOBILE NAV
        ===================================================== */
        .mobile-nav {
            background: var(--aside-bg);
            border-top: 1px solid var(--day-border);
            box-shadow: 0 -4px 20px rgba(0,0,0,.6), 0 -1px 0 var(--day-border), inset 0 1px 0 rgba(255,255,255,.04);
        }
        .mobile-tab-active { color: var(--day-accent) !important; font-weight: 900; text-shadow: 0 0 8px var(--day-glow); }

        /* =====================================================
           MAIN
        ===================================================== */
        main {
            flex: 1; background: transparent;
            transition: all .45s cubic-bezier(.4,0,.2,1);
        }

        /* Click ripple on main */
        .main-ripple {
            position: fixed; border-radius: 50%;
            background: radial-gradient(circle,var(--day-accent) 0%,transparent 70%);
            pointer-events: none; z-index: 9999;
            transform: scale(0); opacity: .25;
            animation: rippleExpand .65s cubic-bezier(.22,1,.36,1) forwards;
        }
        @keyframes rippleExpand { 0%{transform:scale(0);opacity:.25} 100%{transform:scale(1);opacity:0} }

        /* =====================================================
           DAY STRIP
        ===================================================== */
        .day-strip {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 20px; margin-bottom: 1.5rem;
            border-radius: 1rem;
            background: var(--day-glow2); border: 1px solid var(--day-border);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 2px 12px rgba(0,0,0,.3);
            position: relative; overflow: hidden;
        }
        .day-strip::after {
            content: '';
            position: absolute; right: -20px; top: -20px;
            width: 80px; height: 80px;
            border-radius: 50%; background: var(--day-glow);
            filter: blur(20px);
        }
        .day-strip-label { font-size: .65rem; font-weight: 900; letter-spacing: .15em; color: var(--day-accent); text-transform: uppercase; }
        .day-strip-date  { font-size: .7rem;  font-weight: 700; color: #64748b; letter-spacing: .05em; }
        .day-strip-divider { width: 1px; height: 16px; background: var(--day-border); }

        /* =====================================================
           MODAL
        ===================================================== */
        #adminCustomModal > div {
            background: var(--day-surface); border: 1px solid var(--day-border);

<script>
/* ── Day theme init ── */
(function applyDayTheme() {
    const day = new Date().getDay();
    document.body.classList.add('day-' + day);
    const dayNames = {0:'SUN',1:'MON',2:'TUE',3:'WED',4:'THU',5:'FRI',6:'SAT'};
    const label = dayNames[day] || 'MON';
    document.addEventListener('DOMContentLoaded', () => {
        ['sidebarDayLabel','mobileDayLabel'].forEach(id => {
            const el = document.getElementById(id); if (el) el.textContent = label;
        });

        /* THU: star particles */
        if (day === 4) {
            for (let i = 0; i < 10; i++) {
                const s = document.createElement('div');
                s.style.cssText = `position:fixed;pointer-events:none;z-index:0;width:${1+Math.random()*2}px;height:${1+Math.random()*2}px;border-radius:50%;background:var(--day-accent);left:${Math.random()*100}%;top:${Math.random()*100}%;opacity:${.3+Math.random()*.5};animation:starF ${6+Math.random()*8}s ease-in-out infinite alternate;animation-delay:${Math.random()*5}s;`;
                document.body.appendChild(s);
            }
            const st = document.createElement('style');
            st.textContent = `@keyframes starF{0%{transform:translate(0,0) scale(1);opacity:.3}50%{opacity:.8}100%{transform:translate(${Math.random()>0.5?'':'-'}${12+Math.floor(Math.random()*18)}px,${Math.random()>0.5?'':'-'}${12+Math.floor(Math.random()*18)}px) scale(1.5);opacity:.2}}`;
            document.head.appendChild(st);
        }
        /* FRI: ember particles */
        if (day === 5) {
            for (let i = 0; i < 7; i++) {
                const e = document.createElement('div');
                const dx = (Math.random()>0.5?'':'-') + (10+Math.floor(Math.random()*30)) + 'px';
                e.style.cssText = `position:fixed;pointer-events:none;z-index:0;width:3px;height:3px;border-radius:50%;background:${Math.random()>0.5?'#f59e0b':'#ef4444'};left:${10+Math.random()*30}%;bottom:${Math.random()*20}%;opacity:0;animation:emberR ${3+Math.random()*4}s ease-out infinite;animation-delay:${Math.random()*3}s;--dx:${dx};`;
                document.body.appendChild(e);
            }
            const st = document.createElement('style');
            st.textContent = `@keyframes emberR{0%{opacity:.8;transform:translateY(0) translateX(0) scale(1)}100%{opacity:0;transform:translateY(-110px) translateX(var(--dx,20px)) scale(.3)}}`;
            document.head.appendChild(st);
        }
    });
})();

/* ── Weather ── */
async function updateAdminWeather() {
    try {
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-6.2088&longitude=106.8456&current_weather=true');
        const data = await res.json();
        const { temperature, weathercode } = data.current_weather;
        let icon = '☀️';
        if (weathercode >= 1 && weathercode <= 3) icon = '⛅';
        else if (weathercode >= 45 && weathercode <= 48) icon = '☁️';
        else if (weathercode >= 51 && weathercode <= 67) icon = '🌧️';
        else if (weathercode >= 80 && weathercode <= 82) icon = '🌦️';
        else if (weathercode >= 95) icon = '⛈️';
        const tempStr = `${Math.round(temperature)}°C`;
        document.querySelectorAll('.weather-icon').forEach(el => el.innerText = icon);
        document.querySelectorAll('.weather-temp').forEach(el => el.innerText = tempStr);
    } catch(e) { console.error("Weather failed", e); }
}

/* ── Birthday check ── */
async function checkStaffBirthdays() {
    const today = new Date();
    const tMonthDay = `${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
    const lunar = Lunar.fromDate(today);
    const lMonthDay = `${String(lunar.getMonth()).padStart(2,'0')}-${String(lunar.getDay()).padStart(2,'0')}`;
    db.ref('users').once('value', snap => {
        const users = snap.val(); if (!users) return;
        let msgs = [];
        Object.keys(users).forEach(id => {
            const u = users[id]; if (!u.birthday) return;
            const bMD = u.birthday.substring(5), type = u.birthType || 'Solar';
            const bDateFull = u.birthday.replace(/-/g, '.');
            const solar = (type === 'Solar' || type === '양력') && bMD === tMonthDay;
            const lunar_ = (type === 'Lunar' || type === '음력') && bMD === lMonthDay;
            if (solar || lunar_) msgs.push(`${id}: ${bDateFull}`);
        });
        ['adminBirthdayAlert','adminBirthdayNames','mobileBirthdayAlert','mobileBirthdayNames'].forEach(id => {
            const el = document.getElementById(id); if (!el) return;
        });
        const show = msgs.length > 0, namesHtml = msgs.join('<br>');
        const alertBox = document.getElementById('adminBirthdayAlert');
        const nameText = document.getElementById('adminBirthdayNames');
        const mobAlert = document.getElementById('mobileBirthdayAlert');
        const mobNames = document.getElementById('mobileBirthdayNames');
        if (alertBox) alertBox.classList.toggle('hidden', !show);
        if (nameText && show) nameText.innerHTML = namesHtml;
        if (mobAlert) mobAlert.classList.toggle('hidden', !show);
        if (mobNames && show) mobNames.innerHTML = namesHtml;
    });
}

/* ── Tab switcher ── */
async function switchAdminTab(tab) {
    ['attStartPicker','attEndPicker','editStartPicker','editEndPicker'].forEach(key => {
        if (window[key]) { window[key].destroy(); window[key] = null; }
    });
    document.querySelectorAll('.flatpickr-calendar').forEach(el => el.remove());
    const existingModal = document.getElementById('adminCustomModal');
    if (existingModal) { existingModal.classList.add('hidden'); document.body.style.overflow = ''; }

    const area = document.getElementById('adminContent'); if (!area) return;
    area.innerHTML = `<div class="flex justify-center items-center h-64"><div class="animate-spin rounded-full h-12 w-12 border-b-2 day-spinner"></div></div>`;

    document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('tab-active'); b.classList.add('tab-inactive'); });
    const activeBtn = document.getElementById(`btn-${tab}`);
    if (activeBtn) { activeBtn.classList.remove('tab-inactive'); activeBtn.classList.add('tab-active'); }

    const mBtns = document.querySelectorAll('.mobile-nav button');
    mBtns.forEach(b => b.classList.remove('mobile-tab-active'));
    const idxMap = {dashboard:0,attendance:1,reports:2,vacation:3,schedule:4,workstat:5,statistic:6,settings:7};
    const idx = idxMap[tab];
    if (idx !== undefined) mBtns[idx]?.classList.add('mobile-tab-active');

    const fileMap = {
        dashboard:'admin_dashboard.html', attendance:'admin_attendance.html',
        reports:'admin_report.html', vacation:'admin_vacation.html',
        schedule:'admin_calendar.html', statistic:'admin_statistic.html',
        workstat:'work_statistic.html', settings:'admin_setting.html', kospi_ai: 'kospi_ai.html'
    };

    try {
        const res = await fetch(fileMap[tab]);
        const html = await res.text();
        area.innerHTML = html;
        document.querySelectorAll('script[data-dynamic="true"]').forEach(s => s.remove());
        const scripts = Array.from(area.querySelectorAll('script'));
        const externalScripts = scripts.filter(s => s.src);
        const inlineScripts   = scripts.filter(s => !s.src);
        await Promise.all(externalScripts.map(oldScript => new Promise(resolve => {
            const ns = document.createElement('script');
            ns.setAttribute('data-dynamic','true');
            Array.from(oldScript.attributes).forEach(at => ns.setAttribute(at.name, at.value));
            ns.onload = resolve; ns.onerror = resolve;
            document.head.appendChild(ns);
        })));
        for (const oldScript of inlineScripts) {
            const ns = document.createElement('script');
            ns.setAttribute('data-dynamic','true');
            Array.from(oldScript.attributes).forEach(at => ns.setAttribute(at.name, at.value));
            ns.textContent = oldScript.textContent;
            document.head.appendChild(ns);
        }
        setTimeout(() => restoreCoreModalFunctions(), 0);
    } catch(e) {
        area.innerHTML = `<div class="p-10 text-center font-bold" style="color:var(--day-accent)">Load Failed.</div>`;
    }
}

/* =====================================================
   ★ SIDEBAR COLLAPSE LOGIC ★
   Desktop (≥768px):
     • Click on main area  → sidebar slides left (collapse)
     • Mouse over left edge zone OR aside itself → expand
     • Toggle tab click → expand
===================================================== */
(function initSidebarCollapse() {
    const aside      = document.getElementById('mainAside');
    const hoverZone  = document.getElementById('sidebarHoverZone');
    const toggleTab  = document.getElementById('sidebarToggleTab');
    const edgeLine   = document.getElementById('sidebarEdgeLine');
    const mainArea   = document.getElementById('mainArea');
    let collapsed    = false;
    let hoverTimer   = null;

    function isDesktop() { return window.innerWidth >= 768; }

    function collapseSidebar() {
        if (!isDesktop() || collapsed) return;
        collapsed = true;
        aside.classList.add('sidebar-collapsed');
        hoverZone.style.display = 'block';
        toggleTab.style.display = 'flex';
        edgeLine.classList.add('el-visible');
        requestAnimationFrame(() => toggleTab.classList.add('tab-visible'));
    }

    function expandSidebar() {
        if (!isDesktop() || !collapsed) return;
        collapsed = false;
        aside.classList.remove('sidebar-collapsed');
        hoverZone.style.display = 'none';
        toggleTab.classList.remove('tab-visible');
        edgeLine.classList.remove('el-visible');
        setTimeout(() => { if (!collapsed) toggleTab.style.display = 'none'; }, 320);
    }

    /* Click on main → collapse + ripple */
    if (mainArea) {
        mainArea.addEventListener('click', (e) => {
            if (!isDesktop()) return;
            collapseSidebar();
            /* ripple */
            const rpl = document.createElement('div');
            rpl.className = 'main-ripple';
            const sz = 100;
            rpl.style.cssText = `width:${sz}px;height:${sz}px;top:${e.clientY-sz/2}px;left:${e.clientX-sz/2}px;`;
            document.body.appendChild(rpl);
            setTimeout(() => rpl.remove(), 700);
        });
    }

    /* Hover zone (left-edge strip) → expand */
    hoverZone.addEventListener('mouseenter', () => {
        clearTimeout(hoverTimer);
        hoverTimer = setTimeout(expandSidebar, 60);
    });
    hoverZone.addEventListener('mouseleave', () => clearTimeout(hoverTimer));

    /* Aside hover → expand */
    aside.addEventListener('mouseenter', () => {
        if (!isDesktop()) return;
        clearTimeout(hoverTimer);
        expandSidebar();
    });

    /* Toggle tab click → expand */
    toggleTab.addEventListener('click', expandSidebar);

    /* Resize: reset on mobile */
    window.addEventListener('resize', () => {
        if (!isDesktop()) {
            aside.classList.remove('sidebar-collapsed');
            hoverZone.style.display = 'none';
            toggleTab.style.display = 'none';
            edgeLine.classList.remove('el-visible');
            collapsed = false;
        }
    });
})();

/* ── Online Users Tracker ── */
(function initOnlineTracker() {
    const THRESHOLD = 5 * 60 * 1000;
    const DAY_LABELS = {0:'🌑 STANDBY',1:'📡 NETWORK',2:'🖥️ ACTIVE',3:'🔴 ALERT',4:'🌌 COSMIC',5:'🔥 FORGE',6:'🌙 OFFLINE'};
    const dayOfWeek = new Date().getDay();

    function fmtElapsed(ms) {
        const s = Math.floor(ms/1000); if(s<60) return `${s}s ago`;
        const m = Math.floor(s/60);   if(m<60) return `${m}m ago`;
        return `${Math.floor(m/60)}h ago`;
    }
    function fmtHHMM(ts) {
        const d = new Date(ts);
        return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    function renderSidebar(users) {
        const listEl = document.getElementById('onlineUsersList');
        const countEl = document.getElementById('onlineCountBadge');
        const labelEl = document.getElementById('onlinePanelLabel');
        if (!listEl) return;
        if (labelEl) labelEl.textContent = DAY_LABELS[dayOfWeek] || 'CONNECTED';
        const now = Date.now();
        const online = users.filter(u => (now - u.lastSeen) < THRESHOLD).sort((a,b) => b.lastSeen - a.lastSeen);
        if (countEl) countEl.textContent = online.length;
        if (!online.length) { listEl.innerHTML = `<div class="online-empty">NO ACTIVE SESSIONS</div>`; return; }
        listEl.innerHTML = online.map((u,i) => {
            const elapsed = now - u.lastSeen, timeStr = elapsed < 120000 ? 'LIVE' : fmtElapsed(elapsed);
            const loginStr = fmtHHMM(u.loginTime || u.lastSeen);
            const imgSrc = u.profileImg ? (u.profileImg.includes('/') ? u.profileImg : `images/profile/${u.profileImg}`)
                : `https://ui-avatars.com/api/?name=${encodeURIComponent(u.name)}&background=0D1A24&color=64748b&size=64`;
            const isLive = elapsed < 120000;
            return `<div class="online-user-item" style="animation-delay:${i*.05}s">
                <img src="${imgSrc}" class="online-user-avatar" alt="${u.name}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(u.name)}&background=0D1A24&color=64748b'">
                <div class="flex flex-col flex-1 min-w-0">
                    <span class="online-user-name">${u.name}</span>
                    <span style="font-size:.48rem;color:#475569;font-weight:700;letter-spacing:.05em;text-transform:uppercase;">${u.role||'Staff'} · IN ${loginStr}</span>
                </div>
                <div class="flex flex-col items-end gap-0.5">
                    <span class="online-user-time">${timeStr}</span>
                    ${isLive ? '<span class="online-user-dot"></span>' : ''}
                </div>
            </div>`;
        }).join('');
    }

    function renderMobile(users) {
        const listEl = document.getElementById('mobileOnlineList'); if (!listEl) return;
        const now = Date.now();
        const online = users.filter(u => (now - u.lastSeen) < THRESHOLD).sort((a,b) => b.lastSeen - a.lastSeen);
        if (!online.length) { listEl.innerHTML = `<span class="text-[9px] text-slate-600 font-bold uppercase tracking-widest">NO SESSIONS</span>`; return; }
        listEl.innerHTML = online.map((u,i) => {
            const elapsed = Date.now() - u.lastSeen, timeStr = elapsed < 120000 ? 'LIVE' : fmtElapsed(elapsed);
            const imgSrc = u.profileImg ? (u.profileImg.includes('/') ? u.profileImg : `images/profile/${u.profileImg}`)
                : `https://ui-avatars.com/api/?name=${encodeURIComponent(u.name)}&background=0D1A24&color=64748b&size=32`;
            return `<div class="mobile-online-user" style="animation-delay:${i*.06}s">
                <img src="${imgSrc}" alt="${u.name}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(u.name)}&background=0D1A24&color=64748b'">
                <span class="mobile-online-user-name">${u.name}</span>
                <span class="mobile-online-user-time">${timeStr}</span>
                ${elapsed < 120000 ? '<span class="mobile-online-dot"></span>' : ''}
            </div>`;
        }).join('');
    }

    function buildUserList(usersData) {
        const now = Date.now();
        return Object.keys(usersData).filter(uid => usersData[uid]?.online_sts === 'ON').map(uid => {
            const u = usersData[uid];
            const lastSeen = u.lastSeen || u.lastOnline || u.updatedAt || now;
            return { name: u.name || uid, role: u.role || 'Staff', profileImg: u.profileImg || '', lastSeen: typeof lastSeen === 'number' ? lastSeen : now, loginTime: u.loginTime || u.connectedAt || lastSeen };
        });
    }

    function startListener() {
        if (!window.db) { setTimeout(startListener, 300); return; }
        db.ref('users').on('value', snap => {
            const ul = buildUserList(snap.val() || {});
            renderSidebar(ul); renderMobile(ul);
        });
        setInterval(() => {
            if (!window.db) return;
            db.ref('users').once('value').then(snap => {
                const ul = buildUserList(snap.val() || {});
                renderSidebar(ul); renderMobile(ul);
            });
        }, 30000);
    }

    document.addEventListener('DOMContentLoaded', () => { setTimeout(startListener, 500); });
})();

/* ── Init ── */
window.addEventListener('DOMContentLoaded', () => {
    restoreCoreModalFunctions();
    updateAdminWeather();
    checkStaffBirthdays();
    switchAdminTab('dashboard');
    setInterval(updateAdminWeather, 1800000);
    setInterval(checkStaffBirthdays, 3600000);
});
</script>
