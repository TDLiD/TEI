<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin - DAILY SYSTEM</title>

    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="staff-level.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css">
    <style>
        body { font-family: Pretendard, sans-serif; background: #000; color: #f1f5f9; margin: 0; padding: 0; }
        .tab-btn { transition: .25s; cursor: pointer; border-radius: 0.75rem; margin-bottom: 0.25rem; }
        .tab-active { color: #3b82f6; font-weight: 900; background: rgba(59, 130, 246, .1); }
        .tab-inactive { color: #64748b; }
        .tab-inactive:hover { color: #f1f5f9; background: rgba(255, 255, 255, 0.05); }
        .mobile-tab-active { color: #3b82f6 !important; font-weight: 900; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        @media (max-width: 767px) {
            aside { display: none !important; }
            main { padding: 1rem !important; padding-bottom: 85px !important; padding-top: 60px !important; }
            .mobile-header { display: flex !important; }
            .mobile-nav { display: grid !important; }
        }
        /* 프로필 픽커 스타일 */
        .profile-picker-item { transition: all 0.2s; border: 2px solid transparent; }
        .profile-picker-item:hover { transform: scale(1.05); border-color: #3b82f6; }
        .admin-profile-img-container { width: 45px !important; height: 45px !important; transition: all 0.3s ease; }
        @media (min-width: 1024px) { .admin-profile-img-container { width: 100px !important; height: 100px !important; } }
        .typing-cursor::after { content: '|'; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body class="flex min-h-screen">
    <header class="mobile-header fixed top-0 left-0 right-0 h-14 bg-slate-950/80 backdrop-blur-md border-b border-slate-800 z-40 hidden items-center px-4 justify-between">
        <div class="flex items-center gap-3">
            <div class="relative cursor-pointer" onclick="openProfileImagePicker()">
                <div class="admin-profile-img-container rounded-full border border-slate-700 overflow-hidden bg-slate-800">
                    <img src="images/profile/admin/1.gif" alt="Admin" class="w-full h-full object-cover admin-profile-img" onerror="this.src='https://ui-avatars.com/api/?name=Admin&background=0f172a&color=3b82f6'">
                </div>
                <div class="absolute -bottom-1 -right-1 w-4 h-4 bg-blue-600 rounded-full border border-slate-950 flex items-center justify-center text-[8px] shadow-lg">✏️</div>
            </div>
            <h1 class="text-sm font-black italic">ADMIN <span class="text-blue-500">SYSTEM</span></h1>
        </div>
        <div class="flex items-center gap-4">
            <a href="https://tdlid.github.io" target="_blank" class="text-emerald-500 text-sm font-bold">🌐</a>
            <button onclick="adminLogout()" class="text-slate-400 text-lg">🚪</button>
        </div>
    </header>

    <nav class="mobile-nav fixed bottom-0 left-0 right-0 bg-slate-950/90 backdrop-blur-xl border-t border-slate-800 z-50 hidden grid-cols-8 h-[70px] px-1 shadow-2xl">
        <button onclick="switchAdminTab('dashboard')" class="flex flex-col items-center justify-center gap-1 text-[9px] font-bold text-slate-500"><span class="text-lg">📊</span><span>DASH</span></button>
        <button onclick="switchAdminTab('attendance')" class="flex flex-col items-center justify-center gap-1 text-[9px] font-bold text-slate-500"><span class="text-lg">👤</span><span>ATTEND</span></button>
        <button onclick="switchAdminTab('reports')" class="flex flex-col items-center justify-center gap-1 text-[9px] font-bold text-slate-500"><span class="text-lg">📝</span><span>REPORTS</span></button>
        <button onclick="switchAdminTab('leave')" class="flex flex-col items-center justify-center gap-1 text-[9px] font-bold text-slate-500"><span class="text-lg">🏖️</span><span>LEAVE</span></button>
        <button onclick="switchAdminTab('schedule')" class="flex flex-col items-center justify-center gap-1 text-[9px] font-bold text-slate-500"><span class="text-lg">📅</span><span>CAL</span></button>
        <button onclick="switchAdminTab('workstat')" class="flex flex-col items-center justify-center gap-1 text-[9px] font-bold text-slate-500"><span class="text-lg">📉</span><span>W.STAT</span></button>
        <button onclick="switchAdminTab('statistic')" class="flex flex-col items-center justify-center gap-1 text-[9px] font-bold text-slate-500"><span class="text-lg">📈</span><span>A.STAT</span></button>
        <button onclick="switchAdminTab('settings')" class="flex flex-col items-center justify-center gap-1 text-[9px] font-bold text-slate-500"><span class="text-lg">⚙️</span><span>SET</span></button>
    </nav>

    <aside class="hidden md:flex w-72 bg-slate-950/60 border-r border-slate-800 p-6 sticky top-0 h-screen flex-col">
        <div class="mb-10">
            <h1 class="text-2xl font-black italic mb-6">ADMIN <span class="text-blue-500">SYSTEM</span></h1>
            <div class="bg-slate-900/50 border border-slate-800 p-4 rounded-2xl flex items-center gap-4">
                <div class="relative group cursor-pointer shadow-lg" onclick="openProfileImagePicker()">
                    <div class="admin-profile-img-container rounded-full border-2 border-blue-500/30 overflow-hidden bg-slate-800 shrink-0 shadow-blue-500/10 transition-transform group-hover:scale-105">
                        <img src="images/profile/admin/1.gif" alt="Admin" class="w-full h-full object-cover admin-profile-img" onerror="this.src='https://ui-avatars.com/api/?name=Admin&background=0f172a&color=3b82f6'">
                    </div>
                    <div class="absolute -bottom-0.5 -right-0.5 w-6 h-6 bg-blue-600 rounded-full border-2 border-slate-950 flex items-center justify-center text-[12px] shadow-lg group-hover:bg-blue-500 transition-colors">✏️</div>
                </div>
                <div class="overflow-hidden">
                    <div class="text-xs font-bold text-slate-500 uppercase tracking-tighter mb-0.5">Administrator</div>
                    <div class="text-sm font-black text-white truncate uppercase">Master Manager</div>
                    <div class="inline-flex items-center gap-1.5 mt-1">
                        <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span>
                        <span class="text-[10px] text-emerald-500 font-bold uppercase tracking-widest">Online</span>
                    </div>
                </div>
            </div>
        </div>
        <nav class="flex flex-col gap-1 flex-1">
            <button id="btn-dashboard" onclick="switchAdminTab('dashboard')" class="tab-btn px-4 py-3 text-left">📊 DASHBOARD</button>
            <button id="btn-attendance" onclick="switchAdminTab('attendance')" class="tab-btn px-4 py-3 text-left">👤 ATTENDANCE</button>
            <button id="btn-reports" onclick="switchAdminTab('reports')" class="tab-btn px-4 py-3 text-left">📝 WORK REPORT</button>
            <button id="btn-leave" onclick="switchAdminTab('leave')" class="tab-btn px-4 py-3 text-left">🏖️ LEAVE MGT</button>
            <button id="btn-schedule" onclick="switchAdminTab('schedule')" class="tab-btn px-4 py-3 text-left">📅 SCHEDULE</button>
            <button id="btn-workstat" onclick="switchAdminTab('workstat')" class="tab-btn px-4 py-3 text-left font-bold text-amber-500">📉 WORK STAT</button>
            <button id="btn-statistic" onclick="switchAdminTab('statistic')" class="tab-btn px-4 py-3 text-left">📈 ATTEND STAT</button>
            <button id="btn-settings" onclick="switchAdminTab('settings')" class="tab-btn px-4 py-3 text-left">⚙️ SETTINGS</button>
            <div class="h-[1px] bg-slate-800 my-4"></div>
            <a href="https://tdlid.github.io" target="_blank" class="px-4 py-3 text-xs uppercase tracking-widest text-emerald-500 font-bold hover:bg-emerald-500/10 rounded-xl transition-all flex items-center gap-2">🌐 TDLiD Homepage</a>
        </nav>
        <button onclick="adminLogout()" class="mt-auto flex items-center gap-2 px-4 py-3 text-slate-500 hover:text-rose-500 transition-colors font-bold text-sm">🚪 Logout System</button>
    </aside>

    <main class="flex-1 p-8 overflow-y-auto">
        <div id="adminContent" class="max-w-[1300px] mx-auto"></div>
    </main>

    <div id="aiGreetingModal" class="hidden fixed inset-0 z-[200] flex items-center justify-center p-4 bg-black/60 backdrop-blur-md">
        <div class="bg-slate-900 border border-blue-500/30 w-full max-w-lg rounded-[2.5rem] overflow-hidden shadow-2xl shadow-blue-500/10">
            <div class="p-8">
                <div class="flex items-center gap-4 mb-6">
                    <div class="w-14 h-14 bg-gradient-to-br from-blue-600 to-indigo-700 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/20">
                        <span class="text-3xl animate-bounce">🤖</span>
                    </div>
                    <div>
                        <h4 class="text-blue-400 text-xs font-black uppercase tracking-[0.2em]">AI Assistant Message</h4>
                        <p class="text-white font-bold text-xl">Daily Admin Briefing</p>
                    </div>
                </div>
                <div class="bg-slate-950/50 border border-slate-800 rounded-2xl p-6 mb-8">
                    <div id="aiGreetingContent" class="text-slate-300 leading-relaxed text-sm min-h-[120px] font-medium typing-cursor"></div>
                </div>
                <button onclick="closeAiGreeting()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-2xl transition-all active:scale-95 shadow-lg shadow-blue-900/20 uppercase tracking-widest text-xs">Access the system</button>
            </div>
        </div>
    </div>

    <div id="adminCustomModal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-2xl rounded-3xl overflow-hidden shadow-2xl">
            <div class="p-6 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
                <h3 id="modalTitle" class="text-xl font-bold text-white"></h3>
                <button onclick="closeAdminCustomModal()" class="text-slate-400 hover:text-white text-2xl">&times;</button>
            </div>
            <div id="modalBody" class="p-6 max-h-[70vh] overflow-y-auto text-slate-300"></div>
        </div>
    </div>

<script>
    // 1. Firebase 초기화
    (function () {
        if (!window.firebase) return;
        const firebaseConfig = {
            apiKey: "AIzaSyD7AmDGW7b03SHjvnH5YyAx4yyaHR0qWZQ",
            authDomain: "tdlid-dailyreport.firebaseapp.com",
            databaseURL: "https://tdlid-dailyreport-default-rtdb.firebaseio.com",
            projectId: "tdlid-dailyreport",
            storageBucket: "tdlid-dailyreport.firebasestorage.app",
            messagingSenderId: "922333077514",
            appId: "1:922333077514:web:8914e5b06ac1f417707ff3",
            measurementId: "G-1TVZQYHWDL"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        if (!window.db) window.db = firebase.database();
    })();

    // 2. 공용 모달 제어
    (function () {
        const openFn = function (titleHtml, bodyHtml) {
            const modal = document.getElementById('adminCustomModal');
            const tBox = document.getElementById('modalTitle');
            const bBox = document.getElementById('modalBody');
            if (!modal) return;
            if (tBox) tBox.innerHTML = titleHtml;
            if (bBox) bBox.innerHTML = bodyHtml;
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        };
        const closeFn = function () {
            const modal = document.getElementById('adminCustomModal');
            if (modal) modal.classList.add('hidden');
            document.body.style.overflow = '';
        };
        window.openAdminCustomModal = openFn;
        window.closeAdminCustomModal = closeFn;
    })();

    // 3. 프로필 이미지 업데이트 및 실시간 동기화 (원본 복구 및 최적화)
    const PROFILE_IMAGES = ['1.gif', '1.webp', '2.gif', '2.webp', '3.gif', '3.webp', '4.gif', '5.gif', '6.gif'];
    
    window.openProfileImagePicker = function() {
        let gridHtml = `<div class="grid grid-cols-4 sm:grid-cols-5 gap-4">`;
        PROFILE_IMAGES.forEach(img => {
            gridHtml += `
                <div onclick="saveAdminProfile('${img}')" class="profile-picker-item cursor-pointer rounded-xl overflow-hidden bg-slate-800 border-2 border-transparent hover:border-blue-500 shadow-md">
                    <img src="images/profile/admin/${img}" class="w-full h-full object-cover aspect-square" alt="profile">
                </div>`;
        });
        gridHtml += `</div>`;
        openAdminCustomModal('Select Admin Profile', gridHtml);
    };

    window.saveAdminProfile = function(imgName) {
        const path = `images/profile/admin/${imgName}`;
        if(!confirm("Would you like to change your admin profile to this image?")) return;
        
        // Firebase DB 업데이트
        db.ref('admin_settings/profile').update({ 
            profileImg: path, 
            updatedAt: firebase.database.ServerValue.TIMESTAMP 
        }).then(() => {
            // 즉시 UI 반영 (캐시 방지 파라미터 포함)
            const timestamp = new Date().getTime();
            document.querySelectorAll('.admin-profile-img').forEach(img => { 
                img.src = `${path}?t=${timestamp}`; 
            });
            closeAdminCustomModal();
        }).catch(e => { 
            console.error(e); 
            alert("Save failed"); 
        });
    };

    // DB의 이미지 경로 감시하여 실시간 동기화
    (function initProfileSync() {
        const checkDB = setInterval(() => {
            if (window.db) {
                clearInterval(checkDB);
                db.ref('admin_settings/profile/profileImg').on('value', snap => {
                    const imgUrl = snap.val();
                    if (imgUrl) {
                        document.querySelectorAll('.admin-profile-img').forEach(img => { 
                            // 이미 같은 소스면 중복 설정 방지
                            if(!img.src.includes(imgUrl)) img.src = imgUrl; 
                        });
                    }
                });
            }
        }, 100);
    })();

    // 4. AI 브리핑 로직 (생략 가능하나 유지)
// 4. AI 브리핑 로직 (기온, 시간, 리포트 변수 추가 수정본)
    async function startAiBriefing() {
        const modal = document.getElementById('aiGreetingModal');
        const contentArea = document.getElementById('aiGreetingContent');
        if (!modal || !contentArea) return;

        modal.classList.remove('hidden');
        contentArea.innerHTML = "Analyzing real-time information from Jakarta and Seoul...";

        let GROQ_API_KEY = "";
        try {
            const keySnapshot = await db.ref('settings/config/LLMAPIkey').once('value');
            GROQ_API_KEY = keySnapshot.val();
            if (!GROQ_API_KEY) throw new Error("API Key missing");
        } catch (e) {
            contentArea.innerHTML = "Config Load Error. Please check API Key.";
            return;
        }

        // --- 데이터 수집 시작 ---

        // 1. 시간 데이터 (자카르타 기준)
        const now = new Date();
        const jakartaDate = new Intl.DateTimeFormat('ko-KR', { 
            timeZone: 'Asia/Jakarta', 
            year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' 
        }).format(now);
        const jakartaTime = new Intl.DateTimeFormat('ko-KR', { 
            timeZone: 'Asia/Jakarta', 
            hour: '2-digit', minute: '2-digit', hour12: false 
        }).format(now);

        // 2. 날씨 데이터 (Open-Meteo API 사용)
        let weatherInfoJakarta = "No data";
        let weatherInfoSeoul = "No data";
        try {
            const [resJkt, resSel] = await Promise.all([
                fetch('https://api.open-meteo.com/v1/forecast?latitude=-6.2088&longitude=106.8456&current_weather=true'),
                fetch('https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&current_weather=true')
            ]);
            const dataJkt = await resJkt.json();
            const dataSel = await resSel.json();
            weatherInfoJakarta = `${dataJkt.current_weather.temperature}°C`;
            weatherInfoSeoul = `${dataSel.current_weather.temperature}°C`;
        } catch (e) {
            console.error("Weather Fetch Error:", e);
        }

        // 3. 최신 업무 보고 데이터 (Firebase 'reports' 노드에서 마지막 1건 추출)
        let lastReport = "No recent records found.";
        try {
            // 날짜별/사용자별 구조인 경우 전체 리포트 중 가장 마지막 기록을 가져옵니다.
            const reportSnapshot = await db.ref('reports').limitToLast(1).once('value');
            if (reportSnapshot.exists()) {
                const dateData = reportSnapshot.val();
                const lastDateKey = Object.keys(dateData)[0];
                const lastDayReports = dateData[lastDateKey];
                const lastUserKey = Object.keys(lastDayReports)[0];
                const reportContent = lastDayReports[lastUserKey];
                
                // summary나 todo가 있으면 가져오고 없으면 텍스트 요약
                lastReport = reportContent.summary || reportContent.todo || "Latest work updated.";
            }
        } catch (e) {
            console.error("Report Fetch Error:", e);
        }

        // --- AI API 호출 ---
        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { 
                    "Authorization": `Bearer ${GROQ_API_KEY}`, 
                    "Content-Type": "application/json" 
                },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [{
                        role: "system",
                        content: `당신은 관리 시스템의 비서입니다. 
                        [STRICT RESPONSE RULE] 
                        1. 언어: 한글/영어 5:5 섞어서 사용. 
                        2. 제3국어 절대 금지. 
                        3. 전문적인 비즈니스 톤. 
                        데이터: 자카르타 ${jakartaDate} ${jakartaTime}, 기온 ${weatherInfoJakarta}, 서울기온 ${weatherInfoSeoul}, Last Report: ${lastReport}. 
                        구성: 인사말, 업무보고, 날씨비교, 인니 전기오토바이 산업뉴스(1줄), 유머(한글로만), 명언 및 행운.`
                    }, { 
                        role: "user", 
                        content: "준비된 데이터를 바탕으로 오늘의 관리 브리핑을 작성해줘." 
                    }],
                    temperature: 0.5, 
                    max_tokens: 800,
                    top_p: 0.9
                })
            });

            const aiData = await response.json();
            if (aiData.choices && aiData.choices[0]) {
                typeWriter(aiData.choices[0].message.content, contentArea);
            } else {
                throw new Error("Invalid AI Response");
            }
        } catch (error) {
            console.error("AI Briefing Error:", error);
            contentArea.innerHTML = "Good Morning, Admin. System is ready to work.";
        }
    }

    function typeWriter(text, element) {
        let i = 0; element.innerHTML = ""; element.classList.add('typing-cursor');
        function step() {
            if (i < text.length) {
                const char = text.charAt(i);
                element.innerHTML += (char === '\n') ? '<br>' : char;
                i++; setTimeout(step, 15);
            } else { element.classList.remove('typing-cursor'); }
        }
        step();
    }
    window.closeAiGreeting = function() { document.getElementById('aiGreetingModal').classList.add('hidden'); };

    // 5. 탭 전환 시스템 (workstat 추가됨)
    async function switchAdminTab(tab) {
        const area = document.getElementById('adminContent');
        if (!area) return;
        area.innerHTML = '<div class="flex justify-center items-center h-64"><div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500"></div></div>';
        
        // 버튼 스타일 업데이트
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.replace('tab-active', 'tab-inactive'));
        document.getElementById(`btn-${tab}`)?.classList.add('tab-active');
        
        const mBtns = document.querySelectorAll('.mobile-nav button');
        mBtns.forEach(b => b.classList.remove('mobile-tab-active'));
        
        // 8개 탭 인덱스 매칭
        const idxMap = { dashboard:0, attendance:1, reports:2, leave:3, schedule:4, workstat:5, statistic:6, settings:7 };
        const idx = idxMap[tab];
        if(idx !== undefined) mBtns[idx].classList.add('mobile-tab-active');

        // 파일 맵
        const fileMap = { 
            dashboard: 'admin_dashboard.html', 
            attendance: 'admin_attendance.html', 
            reports: 'admin_report.html', 
            leave: 'admin_leave.html', 
            schedule: 'admin_calendar.html', 
            statistic: 'admin_statistic.html',
            workstat: 'work_statistic.html', 
            settings: 'admin_setting.html' 
        };

        try {
            const res = await fetch(fileMap[tab]);
            const html = await res.text();
            area.innerHTML = html;
            
            // 삽입된 스크립트 실행
            const scripts = area.querySelectorAll('script');
            for (const oldScript of scripts) {
                const newScript = document.createElement('script');
                Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                if (oldScript.src) { 
                    newScript.src = oldScript.src; 
                    document.head.appendChild(newScript); 
                } else { 
                    newScript.textContent = oldScript.textContent; 
                    document.head.appendChild(newScript); 
                }
            }
        } catch (e) { area.innerHTML = `<div class="p-10 text-center text-rose-500">Load Failed.</div>`; }
    }

    window.adminLogout = function() { if (confirm("Logout?")) { firebase.auth().signOut().then(() => window.location.replace("index.html")); } };

    window.addEventListener('DOMContentLoaded', () => { 
        switchAdminTab('dashboard'); 
        setTimeout(startAiBriefing, 1000); 
    });
</script>
</body>
</html>
