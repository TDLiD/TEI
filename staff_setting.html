<style>
    /* 프로필 교체 시 부드러운 애니메이션 */
    @keyframes localFadeIn {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
    }
    .fade-in-quick {
        animation: localFadeIn 0.3s ease-out forwards;
    }
</style>

<div class="animate-fadeIn max-w-md mx-auto">
    <h3 class="text-xl font-bold text-white mb-6">Account Settings</h3>
    
    <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-6">
        
        <div class="pb-6 border-b border-slate-800/50">
            <div class="flex items-center gap-4 bg-slate-950/50 p-4 rounded-xl border border-slate-800">
                <div id="currentAvatarDisplay" class="w-12 h-12 rounded-full border border-slate-700 bg-slate-900 overflow-hidden flex items-center justify-center">
                    <div class="animate-pulse w-full h-full bg-slate-800"></div>
                </div>
                <div>
                    <div id="displayUserName" class="text-white font-bold text-base uppercase tracking-tight">Loading...</div>
                    <div class="text-slate-500 text-[10px] uppercase font-bold tracking-widest">Staff Member</div>
                </div>
            </div>
        </div>

        <div class="space-y-4">

<div>
    <label class="block text-xs font-semibold text-slate-500 uppercase mb-2">Staff Birthday</label>
    <div class="flex gap-2">
        <select id="settingBirthType" class="bg-slate-800 border border-slate-700 p-3 rounded-xl text-white text-xs outline-none focus:ring-2 focus:ring-blue-500 transition-all cursor-pointer">
            <option value="Solar">Solar (양력)</option>
            <option value="Lunar">Lunar (음력)</option>
        </select>
        <input type="date" id="settingBirthDate" 
               class="flex-1 bg-slate-800 border border-slate-700 p-3 rounded-xl text-white outline-none focus:ring-2 focus:ring-blue-500 transition-all">
    </div>

<div class="mt-4 p-4 bg-slate-950/30 rounded-xl border border-slate-800/50">
    <label class="block text-[10px] font-bold text-slate-600 uppercase mb-3 tracking-widest">Team Birthdays</label>
    <div id="allUsersBirthdayList" class="space-y-2 max-h-40 overflow-y-auto no-scrollbar text-[11px]">
        <div class="text-slate-500 animate-pulse">Loading team birthdays...</div>
    </div>
</div>

</div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-2">Password</label>
                <div class="relative">
                    <input type="password" id="settingNewPw" 
                           class="w-full bg-slate-800 border border-slate-700 p-3 pr-12 rounded-xl text-white outline-none focus:ring-2 focus:ring-blue-500 transition-all" 
                           placeholder="Loading password..."
                           autocomplete="new-password">
                    
                    <button type="button" id="togglePwBtn" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 transition-colors z-10">
                        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 pointer-events-none">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                        </svg>
                    </button>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-2">Confirm Password</label>
                <input type="password" id="confirmPw" 
                       class="w-full bg-slate-800 border border-slate-700 p-3 rounded-xl text-white outline-none focus:ring-2 focus:ring-blue-500 transition-all" 
                       placeholder="Re-type password to verify"
                       autocomplete="new-password">
                <p id="pwMatchMessage" class="text-[10px] mt-2 font-bold hidden"></p>
            </div>
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase mb-3">Profile Icon</label>
            <div id="emojiGrid" class="grid grid-cols-5 gap-2 bg-slate-950 p-3 rounded-xl border border-slate-800 max-h-48 overflow-y-auto no-scrollbar"></div>
            <input type="hidden" id="selectedEmoji">
        </div>
        
        <div class="space-y-3 pt-4">
            <button id="saveBtn" onclick="updateUserAccount()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-black border border-blue-500/20 hover:bg-blue-500 transition shadow-lg disabled:opacity-50 disabled:cursor-not-allowed active:scale-95 flex items-center justify-center gap-2">
                <span id="saveBtnText">SAVE CHANGES</span>
                <svg id="saveBtnSpinner" class="hidden animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>

            <button onclick="handleLogout()" class="w-full bg-slate-800 text-rose-500 py-3 rounded-xl font-bold text-xs hover:bg-rose-500/10 transition border border-rose-500/20">
                LOGOUT
            </button>
        </div>
    </div>
</div>

<script>
(function() {
    const pwInput = document.getElementById('settingNewPw');
    const confirmInput = document.getElementById('confirmPw');
    const pwMessage = document.getElementById('pwMatchMessage');
    const saveBtn = document.getElementById('saveBtn');
    const grid = document.getElementById('emojiGrid');
    const hiddenInput = document.getElementById('selectedEmoji');
    const toggleBtn = document.getElementById('togglePwBtn');
    const eyeIcon = document.getElementById('eyeIcon');
    
    const user = sessionStorage.getItem('loggedInUser');

    // 1. 이미지를 부드럽게 업데이트하는 함수
    function updateAvatarWithFade(imgName) {
        const display = document.getElementById('currentAvatarDisplay');
        const newImg = document.createElement('img');
        newImg.src = `images/profile/${imgName}`;
        newImg.className = "w-full h-full object-cover fade-in-quick";
        
        display.innerHTML = ""; 
        display.appendChild(newImg);
    }

    // 2. 눈 아이콘 토글 로직
    const eyeOnPath = `<path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />`;
    const eyeOffPath = `<path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />`;

    toggleBtn.onclick = function() {
        const isPw = pwInput.type === 'password';
        pwInput.type = isPw ? 'text' : 'password';
        confirmInput.type = isPw ? 'text' : 'password';
        eyeIcon.innerHTML = isPw ? eyeOffPath : eyeOnPath;
    };

    // 3. 비밀번호 실시간 일치 체크
    function checkMatch() {
        const p1 = pwInput.value;
        const p2 = confirmInput.value;
        if (!p2) { pwMessage.classList.add('hidden'); saveBtn.disabled = false; return; }
        
        pwMessage.classList.remove('hidden');
        if (p1 === p2) {
            pwMessage.textContent = "✓ Passwords match";
            pwMessage.className = "text-[10px] mt-2 font-bold text-emerald-500";
            saveBtn.disabled = false;
        } else {
            pwMessage.textContent = "✕ Passwords do not match";
            pwMessage.className = "text-[10px] mt-2 font-bold text-rose-500";
            saveBtn.disabled = true;
        }
    }
    pwInput.oninput = checkMatch;
    confirmInput.oninput = checkMatch;

    // 4. 데이터 로드 및 초기화
    if (user) {
        firebase.database().ref('users/' + user).once('value').then(snap => {
            const data = snap.val();
            if (data) {
setTimeout(() => {
        pwInput.value = data.password || "";
        // 생일 정보 불러오기 추가
        if (data.birthday) {
            document.getElementById('settingBirthDate').value = data.birthday;
        }
        if (data.birthType) {
            document.getElementById('settingBirthType').value = data.birthType;
        }
    }, 150);

                pwInput.placeholder = "Enter password";
                document.getElementById('displayUserName').textContent = data.name || user;
                
                const currentImg = data.profileImg || 'image-001.webp';
                hiddenInput.value = currentImg;
                
                updateAvatarWithFade(currentImg);
                renderGrid(currentImg);
            }
        });
    }

    // 5. 이모지 그리드 생성
    function renderGrid(currentImg) {
        grid.innerHTML = "";
        const emojis = [];
        for (let i = 1; i <= 5; i++) emojis.push(`image-${String(i).padStart(3, '0')}.webp`);
        for (let i = 1; i <= 27; i++) emojis.push(`image-${String(i).padStart(2, '0')}.gif`);

        emojis.forEach(name => {
            const wrap = document.createElement('div');
            const active = name === currentImg;
            wrap.className = `cursor-pointer p-1 rounded-lg border-2 transition-all ${active ? 'border-blue-500 bg-blue-500/20' : 'border-transparent hover:bg-slate-800'}`;
            wrap.innerHTML = `<img src="images/profile/${name}" class="w-full h-auto rounded-md object-cover aspect-square">`;
            wrap.onclick = () => {
                const kids = grid.children;
                for(let k of kids) { k.classList.remove('border-blue-500', 'bg-blue-500/20'); k.classList.add('border-transparent'); }
                wrap.classList.remove('border-transparent');
                wrap.classList.add('border-blue-500', 'bg-blue-500/20');
                
                hiddenInput.value = name;
                updateAvatarWithFade(name);
            };
            grid.appendChild(wrap);
        });
    }
// 모든 사용자 생일 리스트 렌더링 함수
    function renderAllStaffBirthdays() {
        const listContainer = document.getElementById('allUsersBirthdayList');
        
        firebase.database().ref('users').once('value').then(snap => {
            const allUsers = snap.val();
            if (!allUsers) return;

            let html = "";
            // 사용자 ID순으로 정렬
            const sortedKeys = Object.keys(allUsers).sort();

            sortedKeys.forEach(uid => {
                const u = allUsers[uid];
                if (u.birthday) {
                    const bType = u.birthType === "Lunar" ? "🌙" : "☀️";
                    const bDate = u.birthday.replace(/-/g, '.');
                    const isMe = uid === user ? "(ME)" : "";
                    
                    html += `
                        <div class="flex justify-between items-center py-1.5 border-b border-slate-800/30 last:border-0">
                            <span class="text-slate-300 font-bold uppercase ${uid === user ? 'text-blue-400' : ''}">
                                ${uid} <span class="text-[9px] opacity-50">${isMe}</span>
                            </span>
                            <span class="text-slate-500 font-mono">
                                <span class="text-[9px] mr-1">${bType}</span>${bDate}
                            </span>
                        </div>`;
                }
            });

            listContainer.innerHTML = html || '<div class="text-slate-600 italic">No birthday data available.</div>';
        });
    }

    // 초기 실행 목록에 추가
    renderAllStaffBirthdays();


    // 6. 업데이트 (페이지 튕김 방지 수정 완료)
    window.updateUserAccount = function() {
        const passValue = pwInput.value.trim();
const birthValue = document.getElementById('settingBirthDate').value; // 추가
    const birthTypeValue = document.getElementById('settingBirthType').value; // 추가
        if(!passValue) return alert("Password cannot be empty.");

        const btnText = document.getElementById('saveBtnText');
        const btnSpinner = document.getElementById('saveBtnSpinner');
        
        saveBtn.disabled = true;
        btnText.textContent = "SAVING...";
        btnSpinner.classList.remove('hidden');

firebase.database().ref('users/' + user).update({
        password: passValue,
        profileImg: hiddenInput.value,
        birthday: birthValue,    // Firebase에 저장될 필드
        birthType: birthTypeValue // Firebase에 저장될 필드 (Solar/Lunar)
    }).then(() => {
            alert("Changes saved successfully!");
            // UI 복구 (location.reload() 제거)
            saveBtn.disabled = false;
            btnText.textContent = "SAVE CHANGES";
            btnSpinner.classList.add('hidden');
        }).catch(err => {
            alert("Error: " + err.message);
            saveBtn.disabled = false;
            btnText.textContent = "SAVE CHANGES";
            btnSpinner.classList.add('hidden');
        });
    };

    // 7. 로그아웃 (Firebase 서버 세션 종료 추가)
    window.handleLogout = function() {
        if(confirm("Are you sure you want to logout?")) {
            // Firebase 인증 로그아웃 호출 (서버 세션 확실히 종료)
            firebase.auth().signOut().then(() => {
                sessionStorage.clear();
                location.href = 'index.html';
            }).catch((error) => {
                console.error("Logout Error:", error);
                // 에러가 나더라도 클라이언트 세션은 정리 후 이동
                sessionStorage.clear();
                location.href = 'index.html';
            });
        }
    };
})();
</script>
