<div class="animate-fadeIn max-w-md">
    <h3 class="text-xl font-bold text-white mb-6">Account Settings</h3>
    
    <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-8">
        <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase mb-2">Change Password</label>

<input type="password" id="settingNewPw" class="w-full bg-slate-800 border border-slate-700 p-3 rounded-xl text-white outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter new password" autocomplete="new-password">
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase mb-3">Profile Icon</label>
<div id="emojiGrid" class="grid grid-cols-5 gap-2 bg-slate-950 p-3 rounded-xl border border-slate-800 max-h-64 overflow-y-auto no-scrollbar">
            </div>
            <input type="hidden" id="selectedEmoji" value="1.webp">
        </div>
        
        <button onclick="updateUserAccount()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-black border border-blue-500/20 hover:bg-blue-500 transition shadow-lg active:scale-95">
            SAVE CHANGES
        </button>
    </div>
</div>

<script>
    (function() {
        const grid = document.getElementById('emojiGrid');
        const hiddenInput = document.getElementById('selectedEmoji');
        const user = sessionStorage.getItem('loggedInUser');

        // 1. 이미지 리스트 생성 (image-001.webp ~ image-032.webp)
        const emojis = [];
        for (let i = 1; i <= 32; i++) {
            // 숫자를 3자리 문자열로 변환 (예: 1 -> 001, 10 -> 010)
            const imgNumber = String(i).padStart(3, '0');
            emojis.push(`image-${imgNumber}.webp`);
        }
        
        firebase.database().ref('users/' + user).once('value', snap => {
            // 기본값도 새로운 파일명 형식에 맞춰 수정 (예: image-001.webp)
            const currentImg = snap.val()?.profileImg || 'image-001.webp';
            hiddenInput.value = currentImg;

            emojis.forEach(imgName => {
                const imgWrap = document.createElement('div');
                const isSelected = currentImg === imgName;
                imgWrap.className = `cursor-pointer p-1 rounded-lg border-2 transition-all ${isSelected ? 'border-blue-500 bg-blue-500/20' : 'border-transparent hover:bg-slate-800'}`;
                
                imgWrap.innerHTML = `<img src="images/profile/${imgName}" class="w-full h-auto rounded-md object-cover aspect-square" alt="profile">`;
                
                imgWrap.onclick = () => {
                    Array.from(grid.children).forEach(child => {
                        child.classList.remove('border-blue-500', 'bg-blue-500/20');
                        child.classList.add('border-transparent');
                    });
                    imgWrap.classList.remove('border-transparent');
                    imgWrap.classList.add('border-blue-500', 'bg-blue-500/20');
                    hiddenInput.value = imgName;
                };
                grid.appendChild(imgWrap);
            });
        });

        // 2. 통합 저장 함수 (기존과 동일)
        window.updateUserAccount = function() {
            const pwInput = document.getElementById('settingNewPw');
            const newPw = pwInput.value.trim();
            const profileImg = hiddenInput.value;
            const updates = { profileImg: profileImg };
            if(newPw !== "") { updates.password = newPw; }
            
            firebase.database().ref('users/' + user).update(updates).then(() => {
                alert("Account updated successfully!");
                pwInput.value = ""; 
            }).catch(e => {
                console.error(e);
                alert("Update failed.");
            });
        };
    })();
</script>
