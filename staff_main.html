<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="theme-color" content="#0a0e27">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Daily System</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Serif+JP:wght@300;700&family=Cormorant+Garamond:ital,wght@0,300;0,700;1,400&family=DM+Serif+Display&family=Bungee&family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<style>
/* ══════════════════════════════════════════════════════════
   CSS CUSTOM PROPERTIES — injected per day via <body> class
══════════════════════════════════════════════════════════ */
:root {
  --card-perspective: 900px;
  --card-hover-lift: -8px;
  --card-hover-scale: 1.03;
  --anim-dur: 0.35s;
}

/* ══════════════════════════════════════════════════════════
   RESET
══════════════════════════════════════════════════════════ */
*, *::before, *::after {
  margin: 0; padding: 0;
  box-sizing: border-box;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

html, body { width: 100%; height: 100%; overflow: hidden; }

body {
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  transition: background 0.5s ease, color 0.5s ease;
}

/* ══════════════════════════════════════════════════════════
   SCROLLABLE WRAPPER
══════════════════════════════════════════════════════════ */
.content-wrapper {
  position: relative;
  z-index: 10;
  width: 100%;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: clamp(4.25rem, 12vw, 5.5rem) clamp(1rem, 4vw, 1.5rem) clamp(1rem, 3vw, 1.5rem);
  overflow-y: auto;
  scrollbar-width: none;
  gap: clamp(0.65rem, 2.2vw, 1.1rem);
}
.content-wrapper::-webkit-scrollbar { display: none; }

/* ══════════════════════════════════════════════════════════
   BACKGROUND LAYER
══════════════════════════════════════════════════════════ */
#bg-layer {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}

/* ══════════════════════════════════════════════════════════
   TOP BAR
══════════════════════════════════════════════════════════ */
.top-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: clamp(0.55rem, 2vw, 0.8rem) clamp(0.875rem, 3vw, 1.25rem);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--topbar-border, rgba(255,255,255,0.08));
  background: var(--topbar-bg, rgba(0,0,0,0.6));
  transition: background 0.5s, border-color 0.5s;
}

.profile-pill {
  display: flex;
  align-items: center;
  gap: 0.55rem;
  min-width: 0;
  max-width: 58%;
}

.profile-img {
  width: clamp(1.85rem, 7.5vw, 2.35rem);
  height: clamp(1.85rem, 7.5vw, 2.35rem);
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
  border: 2px solid var(--accent, #6366f1);
  box-shadow: 0 0 0 3px var(--accent-glow, rgba(99,102,241,0.2));
  transition: border-color 0.5s, box-shadow 0.5s;
}

.profile-name {
  font-size: clamp(0.68rem, 2.8vw, 0.82rem);
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text-primary, #fff);
  font-family: var(--font-ui, 'Pretendard', sans-serif);
}

.day-chip {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 0;
  flex-shrink: 0;
}
.chip-label {
  font-size: clamp(0.5rem, 1.9vw, 0.62rem);
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent-muted, rgba(99,102,241,0.6));
  font-family: var(--font-display, 'Inter', sans-serif);
  line-height: 1.3;
}
.chip-num {
  font-size: clamp(1.2rem, 4.8vw, 1.65rem);
  font-weight: 900;
  line-height: 1;
  color: var(--accent, #6366f1);
  font-family: var(--font-display, 'Inter', sans-serif);
}

/* ══════════════════════════════════════════════════════════
   HEADER SECTION
══════════════════════════════════════════════════════════ */
.header-section {
  text-align: center;
  width: 100%;
  animation: fadeSlideDown 0.55s cubic-bezier(0.22,1,0.36,1) both;
}

@keyframes fadeSlideDown {
  from { opacity: 0; transform: translateY(-14px); }
  to   { opacity: 1; transform: translateY(0); }
}

.live-time-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: clamp(0.62rem, 2.4vw, 0.72rem);
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: clamp(0.45rem, 1.8vw, 0.75rem);
  color: var(--accent, #6366f1);
  font-family: var(--font-display, 'Inter', sans-serif);
}

.live-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent, #6366f1);
  box-shadow: 0 0 8px var(--accent, #6366f1);
  animation: livePulse 2.4s ease-in-out infinite;
  flex-shrink: 0;
}
@keyframes livePulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.35; transform: scale(0.65); }
}

.greeting {
  font-size: clamp(1.55rem, 6.5vw, 2.6rem);
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.1;
  margin-bottom: clamp(0.18rem, 0.8vw, 0.35rem);
  color: var(--text-primary, #fff);
  font-family: var(--font-display, 'Inter', sans-serif);
}
.greeting em {
  font-style: normal;
  background: var(--accent-gradient, linear-gradient(90deg, #6366f1, #a78bfa));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.sub-label {
  font-size: clamp(0.58rem, 2.3vw, 0.68rem);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-muted, rgba(255,255,255,0.38));
  font-family: var(--font-ui, 'Pretendard', sans-serif);
}

/* ══════════════════════════════════════════════════════════
   3D CARD GRID — Perspective container
══════════════════════════════════════════════════════════ */
.menu-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: clamp(0.6rem, 2.4vw, 0.9rem);
  width: 100%;
  max-width: 480px;
  perspective: var(--card-perspective);
  animation: fadeSlideUp 0.6s 0.08s cubic-bezier(0.22,1,0.36,1) both;
}

.bottom-actions {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: clamp(0.5rem, 2vw, 0.72rem);
  width: 100%;
  max-width: 480px;
  animation: fadeSlideUp 0.6s 0.16s cubic-bezier(0.22,1,0.36,1) both;
}

@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── 3D Card base ── */
.menu-card, .action-btn {
  position: relative;
  border-radius: var(--card-radius, 14px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
  overflow: hidden;
  border: 1px solid var(--card-border, rgba(255,255,255,0.12));
  background: var(--card-bg, rgba(255,255,255,0.05));
  /* Multi-layer shadow = 3D floating depth */
  box-shadow:
    0 1px 0 0 var(--card-shine, rgba(255,255,255,0.07)) inset,
    0 2px 4px rgba(0,0,0,0.12),
    0 6px 14px rgba(0,0,0,0.18),
    0 14px 32px var(--card-shadow-far, rgba(0,0,0,0.28));
  transform: translateZ(0);
  will-change: transform;
  transition:
    transform var(--anim-dur) cubic-bezier(0.34,1.56,0.64,1),
    box-shadow var(--anim-dur) ease,
    border-color var(--anim-dur) ease;
  -webkit-tap-highlight-color: transparent;
}

.menu-card {
  padding: clamp(0.9rem, 3.8vw, 1.4rem) clamp(0.7rem, 2.8vw, 1rem);
  gap: clamp(0.45rem, 1.8vw, 0.7rem);
  min-height: clamp(105px, 21vw, 145px);
}

.action-btn {
  padding: clamp(0.6rem, 2.4vw, 0.85rem) clamp(0.35rem, 1.4vw, 0.5rem);
  gap: clamp(0.3rem, 1.3vw, 0.48rem);
  min-height: clamp(72px, 16vw, 100px);
  background: var(--card-bg, rgba(255,255,255,0.05));
  font-family: inherit;
}

/* 3D lift on hover (desktop) */
@media (hover: hover) {
  .menu-card:hover {
    transform: translateY(var(--card-hover-lift)) scale(var(--card-hover-scale)) translateZ(0);
    border-color: var(--accent, #6366f1);
    box-shadow:
      0 1px 0 0 var(--card-shine, rgba(255,255,255,0.12)) inset,
      0 4px 8px rgba(0,0,0,0.18),
      0 12px 28px rgba(0,0,0,0.22),
      0 22px 50px var(--card-shadow-far, rgba(0,0,0,0.32)),
      0 0 0 1px var(--accent-glow, rgba(99,102,241,0.2)),
      0 0 30px var(--accent-glow, rgba(99,102,241,0.12));
  }
  .action-btn:hover {
    transform: translateY(-4px) scale(1.04) translateZ(0);
    border-color: var(--accent, #6366f1);
    box-shadow:
      0 1px 0 0 var(--card-shine, rgba(255,255,255,0.1)) inset,
      0 8px 20px rgba(0,0,0,0.22),
      0 0 0 1px var(--accent-glow, rgba(99,102,241,0.2));
  }
}

/* Active press */
.menu-card:active { transform: scale(0.96) translateZ(0) !important; }
.action-btn:active { transform: scale(0.94) translateZ(0) !important; }

/* Card top-edge highlight (3D bevel illusion) */
.menu-card::before, .action-btn::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: var(--card-bevel, linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent));
  pointer-events: none;
}

/* Card face overlay */
.menu-card::after {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--card-face, linear-gradient(155deg, rgba(255,255,255,0.04) 0%, transparent 55%));
  pointer-events: none;
  border-radius: inherit;
}

/* Icon */
.card-icon-wrap {
  width: clamp(2.35rem, 8.5vw, 3.1rem);
  height: clamp(2.35rem, 8.5vw, 3.1rem);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
  transition: transform 0.3s ease, filter 0.3s ease;
}
.card-icon-wrap img {
  width: 100%; height: 100%;
  object-fit: contain;
  display: block;
}
.action-icon {
  font-size: clamp(1.4rem, 5.5vw, 1.9rem);
  line-height: 1;
  display: block;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,0.35));
  transition: transform 0.3s ease;
}

@media (hover: hover) {
  .menu-card:hover .card-icon-wrap { transform: translateY(-2px) scale(1.08); filter: drop-shadow(0 6px 14px rgba(0,0,0,0.4)); }
  .action-btn:hover .action-icon { transform: scale(1.14) translateY(-1px); }
}

.card-label, .action-label {
  font-size: clamp(0.58rem, 2.3vw, 0.7rem);
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  text-align: center;
  line-height: 1.2;
  color: var(--card-label, rgba(255,255,255,0.6));
  font-family: var(--font-ui, 'Pretendard', sans-serif);
  transition: color 0.25s ease;
}
@media (hover: hover) {
  .menu-card:hover .card-label,
  .action-btn:hover .action-label { color: var(--accent, #6366f1); }
}

/* ══════════════════════════════════════════════════════════
   POPUP MODAL
══════════════════════════════════════════════════════════ */
.popup-overlay {
  position: fixed; inset: 0;
  background: rgba(5,8,20,0.92);
  backdrop-filter: blur(10px);
  z-index: 9999;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  animation: fadeIn 0.3s ease-out;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.popup-container {
  position: relative;
  background: linear-gradient(135deg, #1a1f3a 0%, #232d4d 100%);
  border: 1px solid rgba(99,102,241,0.3);
  border-radius: 16px;
  max-width: 90vw;
  max-height: 85vh;
  overflow: hidden;
  box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  animation: popIn 0.38s cubic-bezier(0.22,1,0.36,1);
}
@keyframes popIn { from { opacity:0; transform:scale(0.9) translateY(10px);} to {opacity:1;transform:scale(1) translateY(0);} }

.popup-close-top {
  position: absolute; top: 14px; right: 14px;
  width: 34px; height: 34px;
  background: #ec4899; border: none; border-radius: 6px;
  color: white; font-size: 17px; cursor: pointer; z-index: 10;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.3s ease, background 0.2s;
  box-shadow: 0 4px 12px rgba(236,72,153,0.35);
}
.popup-close-top:hover { transform: rotate(90deg) scale(1.1); background: #e91e63; }

.popup-content {
  padding: 28px 20px;
  display: flex; flex-direction: column;
  align-items: center; gap: 18px;
  max-height: calc(85vh - 80px);
  overflow-y: auto;
}

.popup-image {
  max-width: 100%; max-height: 48vh;
  border-radius: 10px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  object-fit: contain;
}

.popup-message {
  font-size: clamp(1.05rem, 3vw, 1.4rem);
  font-weight: 700;
  text-align: center;
  background: linear-gradient(135deg, #10b981, #3b82f6, #8b5cf6);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  padding: 8px 18px;
  animation: livePulse 2s ease-in-out infinite;
}

.popup-close-bottom {
  display: block;
  width: calc(100% - 40px);
  margin: 0 20px 18px;
  padding: 13px 20px;
  background: linear-gradient(135deg, #6366f1 0%, #818cf8 100%);
  border: none; border-radius: 8px;
  color: white;
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.1em;
  cursor: pointer;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
  box-shadow: 0 4px 14px rgba(99,102,241,0.35);
}
.popup-close-bottom:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(99,102,241,0.45); }

/* ══════════════════════════════════════════════════════════
   ▌MON — DEEP SPACE  (dark navy · neon blue · holographic)
══════════════════════════════════════════════════════════ */
.day-mon {
  --accent: #38bdf8;
  --accent-muted: rgba(56,189,248,0.5);
  --accent-glow: rgba(56,189,248,0.22);
  --accent-gradient: linear-gradient(90deg,#38bdf8,#818cf8,#c084fc);
  --text-primary: #e2e8f0;
  --text-muted: rgba(148,163,184,0.5);
  --topbar-bg: rgba(3,6,20,0.85);
  --topbar-border: rgba(56,189,248,0.18);
  --card-bg: linear-gradient(160deg, rgba(15,23,42,0.96) 0%, rgba(8,14,32,0.94) 100%);
  --card-border: rgba(56,189,248,0.18);
  --card-shine: rgba(56,189,248,0.1);
  --card-bevel: linear-gradient(90deg, transparent, rgba(56,189,248,0.25), transparent);
  --card-face: linear-gradient(155deg, rgba(56,189,248,0.05) 0%, transparent 55%);
  --card-label: rgba(148,163,184,0.65);
  --card-shadow-far: rgba(0,0,0,0.45);
  --card-radius: 12px;
  --font-display: 'Orbitron', sans-serif;
  --font-ui: 'Pretendard', sans-serif;
  font-family: 'Pretendard', sans-serif;
  background: #030614;
  color: #e2e8f0;
}
.day-mon .greeting { font-family: 'Orbitron', sans-serif; font-size: clamp(1.1rem, 4.8vw, 1.95rem); }
.day-mon .chip-label, .day-mon .chip-num { font-family: 'Orbitron', sans-serif; }

/* Mon BG — static gradient layers, NO animation loops */
.mon-bg {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 70% 45% at 15% 20%, rgba(56,189,248,0.06) 0%, transparent 65%),
    radial-gradient(ellipse 55% 50% at 85% 75%, rgba(129,140,248,0.05) 0%, transparent 65%),
    radial-gradient(ellipse 40% 30% at 50% 50%, rgba(192,132,252,0.03) 0%, transparent 70%);
  pointer-events: none;
}
.mon-grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(56,189,248,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(56,189,248,0.04) 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%);
  pointer-events: none;
}
.mon-orb {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
}
.mon-orb.o1 {
  width: 480px; height: 480px;
  top: -180px; left: -140px;
  background: radial-gradient(circle, rgba(56,189,248,0.07) 0%, transparent 70%);
  animation: orbFloat 14s ease-in-out infinite;
}
.mon-orb.o2 {
  width: 380px; height: 380px;
  bottom: -130px; right: -100px;
  background: radial-gradient(circle, rgba(192,132,252,0.06) 0%, transparent 70%);
  animation: orbFloat 18s ease-in-out infinite reverse;
}
@keyframes orbFloat {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(18px, 14px); }
}

/* ══════════════════════════════════════════════════════════
   ▌TUE — WABI-SABI PAPER  (warm ivory · ink wash · organic)
══════════════════════════════════════════════════════════ */
.day-tue {
  --accent: #7c6652;
  --accent-muted: rgba(124,102,82,0.5);
  --accent-glow: rgba(124,102,82,0.18);
  --accent-gradient: linear-gradient(90deg,#5c4a35,#a07850,#c8b89a);
  --text-primary: #2d2621;
  --text-muted: rgba(92,74,53,0.45);
  --topbar-bg: rgba(245,239,230,0.88);
  --topbar-border: rgba(124,102,82,0.18);
  --card-bg: rgba(255,253,248,0.92);
  --card-border: rgba(180,155,125,0.35);
  --card-shine: rgba(255,255,255,0.9);
  --card-bevel: linear-gradient(90deg, transparent, rgba(255,255,255,0.95), transparent);
  --card-face: linear-gradient(155deg, rgba(255,255,255,0.45) 0%, transparent 55%);
  --card-label: rgba(92,74,53,0.7);
  --card-shadow-far: rgba(92,74,53,0.14);
  --card-radius: 6px;
  --font-display: 'Noto Serif JP', serif;
  --font-ui: 'Noto Serif JP', serif;
  font-family: 'Noto Serif JP', serif;
  background: #f0e8dc;
  color: #2d2621;
}
.day-tue .greeting { font-family: 'Noto Serif JP', serif; }
.day-tue .chip-label, .day-tue .chip-num { font-family: 'Noto Serif JP', serif; }

.tue-bg {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 65% 50% at 10% 15%, rgba(124,102,82,0.06) 0%, transparent 65%),
    radial-gradient(ellipse 55% 40% at 88% 80%, rgba(92,74,53,0.05) 0%, transparent 65%);
  pointer-events: none;
}
.tue-stroke {
  position: absolute;
  background: rgba(45,38,33,0.055);
  border-radius: 2px;
  pointer-events: none;
}
.tue-circle {
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(45,38,33,0.055);
  pointer-events: none;
}

/* ══════════════════════════════════════════════════════════
   ▌WED — ART DECO VAULT  (deep forest · muted gold · beveled)
══════════════════════════════════════════════════════════ */
.day-wed {
  --accent: #c8a84b;
  --accent-muted: rgba(200,168,75,0.5);
  --accent-glow: rgba(200,168,75,0.18);
  --accent-gradient: linear-gradient(90deg,#a07830,#e8d48a,#a07830);
  --text-primary: #f0e8d0;
  --text-muted: rgba(210,185,120,0.4);
  --topbar-bg: rgba(10,18,11,0.88);
  --topbar-border: rgba(200,168,75,0.2);
  --card-bg: linear-gradient(160deg, rgba(16,28,17,0.97) 0%, rgba(10,18,12,0.95) 100%);

<script>
/* ══════════════════════════════════════════════════════════
   DAY CONFIG — 0=Sun, 1=Mon … 6=Sat (all 7 days)
══════════════════════════════════════════════════════════ */
const DAY_CONFIG = {
  0: {
    cls: 'day-sun',
    sub: 'Rest, reflect & recharge ☀️',
    chipLabel: '☀ Sunday',
    buildBg(el) {
      const rays = Array.from({length: 12}, (_, i) => {
        const deg = i * 30;
        return `<div class="sun-ray" style="transform:rotate(${deg}deg) translateX(-50%);opacity:${0.5 + (i%3)*0.25};"></div>`;
      }).join('');
      el.innerHTML = `<div class="sun-bg"></div>${rays}`;
    }
  },
  1: {
    cls: 'day-mon',
    sub: 'New week. New energy. ⚡',
    chipLabel: '⚡ Monday',
    buildBg(el) {
      el.innerHTML = `
        <div class="mon-bg"></div>
        <div class="mon-grid"></div>
        <div class="mon-orb o1"></div>
        <div class="mon-orb o2"></div>`;
    }
  },
  2: {
    cls: 'day-tue',
    sub: 'Select task to continue',
    chipLabel: '◎ Tuesday',
    buildBg(el) {
      el.innerHTML = `
        <div class="tue-bg"></div>
        <div class="tue-circle" style="width:480px;height:480px;top:-160px;right:-140px;"></div>
        <div class="tue-circle" style="width:320px;height:320px;bottom:-110px;left:-110px;"></div>
        <div class="tue-stroke" style="width:2px;height:60vh;top:8%;left:11%;transform:rotate(-5deg);"></div>
        <div class="tue-stroke" style="width:1.5px;height:42vh;top:6%;right:17%;transform:rotate(4deg);"></div>`;
    }
  },
  3: {
    cls: 'day-wed',
    sub: 'Enter a task to proceed',
    chipLabel: '◆ Wednesday',
    buildBg(el) {
      el.innerHTML = `
        <div class="wed-bg"></div>
        <div class="wed-diamond" style="width:400px;height:400px;top:-120px;right:-120px;"></div>
        <div class="wed-diamond" style="width:540px;height:540px;bottom:-175px;left:-175px;"></div>
        <div class="wed-diamond" style="width:190px;height:190px;top:28%;right:5%;"></div>
        <div class="wed-hline" style="top:16%;"></div>
        <div class="wed-hline" style="bottom:16%;"></div>`;
    }
  },
  4: {
    cls: 'day-thu',
    sub: 'Choose a task & begin 🌿',
    chipLabel: '🌿 Thursday',
    buildBg(el) {
      el.innerHTML = `
        <div class="thu-bg"></div>
        <div class="thu-leaf" style="width:170px;height:260px;top:3%;right:3%;--leaf-base:rotate(-20deg);animation-delay:0s;"></div>
        <div class="thu-leaf" style="width:120px;height:190px;bottom:7%;left:2%;--leaf-base:rotate(15deg) scaleX(-1);animation-delay:-5s;"></div>
        <div class="thu-leaf" style="width:85px;height:130px;top:44%;right:10%;--leaf-base:rotate(-34deg);animation-delay:-8s;"></div>`;
    }
  },
  5: {
    cls: 'day-fri',
    sub: "TGIF — Let's go 🚀",
    chipLabel: '🎉 Friday',
    buildBg(el) {
      const stars = Array.from({length: 40}, () => {
        const x = (Math.random() * 100).toFixed(1);
        const y = (Math.random() * 52).toFixed(1);
        const s = (Math.random() * 2.2 + 0.8).toFixed(1);
        const d = (Math.random() * 3).toFixed(2);
        return `<div class="fri-star" style="left:${x}%;top:${y}%;width:${s}px;height:${s}px;animation-delay:${d}s;"></div>`;
      }).join('');
      el.innerHTML = `<div class="fri-bg"></div>${stars}<div class="fri-grid"></div>`;
    }
  },
  6: {
    cls: 'day-sat',
    sub: 'Take it easy today 🧊',
    chipLabel: '🧊 Saturday',
    buildBg(el) {
      el.innerHTML = `
        <div class="sat-bg"></div>
        <div class="sat-frost" style="width:460px;height:460px;top:-155px;right:-130px;"></div>
        <div class="sat-frost" style="width:340px;height:340px;bottom:-115px;left:-115px;border-color:rgba(188,213,250,0.07);"></div>`;
    }
  }
};

/* ══════════════════════════════════════════════════════════
   APPLY DAY THEME
══════════════════════════════════════════════════════════ */
const todayIdx = new Date().getDay();
const cfg = DAY_CONFIG[todayIdx] || DAY_CONFIG[1];
document.body.classList.add(cfg.cls);

/* ══════════════════════════════════════════════════════════
   FIREBASE
══════════════════════════════════════════════════════════ */
let database;
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCBYlhoIPDtXnPrKugo_AQ7dYVCEyMyO-w",
  authDomain: "tdlid-dailyreport.firebaseapp.com",
  databaseURL: "https://tdlid-dailyreport-default-rtdb.firebaseio.com",
  projectId: "tdlid-dailyreport",
  storageBucket: "tdlid-dailyreport.appspot.com"
};

/* ══════════════════════════════════════════════════════════
   NAVIGATION & AUTH
══════════════════════════════════════════════════════════ */
function navigateTo(page) {
  sessionStorage.setItem('targetPage', page);
  location.href = 'staff.html';
}

function handleLogout() {
  if (!confirm('Do you want to logout?')) return;
  const name = sessionStorage.getItem('loggedInUser');
  const doLogout = () => {
    sessionStorage.clear();
    localStorage.removeItem('loggedInUser');
    location.replace('index.html');
  };
  if (name && database) {
    database.ref('users/' + name).update({ online_sts: 'OFF' })
      .then(doLogout).catch(doLogout);
  } else {
    doLogout();
  }
}

/* ══════════════════════════════════════════════════════════
   PROFILE
══════════════════════════════════════════════════════════ */
let _profileRef = null;

function loadProfile(userId) {
  if (!userId || !database) return;
  _profileRef = database.ref('users/' + userId);
  _profileRef.on('value', (snap) => {
    const container = document.getElementById('profileContainer');
    if (!container) return;

    const ud = snap.val() || {};
    const displayName = ud.displayName || userId;

    // Greeting
    const ge = document.getElementById('userGreeting');
    if (ge) ge.textContent = displayName;

    // Profile img
    let img = container.querySelector('.profile-img');
    if (!img) {
      img = document.createElement('img');
      img.className = 'profile-img';
      img.alt = 'Profile';
      container.appendChild(img);
    }
    img.src = ud.profileImg ? `images/profile/${ud.profileImg}` : 'images/default-profile.png';
    img.onerror = () => {
      img.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(displayName)}&background=6366f1&color=fff`;
    };

    // Name
    let nm = container.querySelector('.profile-name');
    if (!nm) {
      nm = document.createElement('div');
      nm.className = 'profile-name';
      container.appendChild(nm);
    }
    nm.textContent = displayName;
  });
}

/* ══════════════════════════════════════════════════════════
   CLOCK — single setInterval, no DOM query inside loop
══════════════════════════════════════════════════════════ */
let _clockEl = null;
let _clockTimer = null;

function updateClock() {
  if (!_clockEl) _clockEl = document.getElementById('liveTime');
  if (_clockEl) _clockEl.textContent = new Date().toLocaleTimeString('en-US', { hour12: false });
}

/* ══════════════════════════════════════════════════════════
   DATE DISPLAY
══════════════════════════════════════════════════════════ */
function initDate() {
  const n = new Date();
  const labelEl = document.getElementById('dayChipLabel');
  const numEl   = document.getElementById('dayNumber');
  if (labelEl) labelEl.textContent = cfg.chipLabel;
  if (numEl) numEl.textContent = String(n.getDate()).padStart(2, '0');
}

/* ══════════════════════════════════════════════════════════
   POPUP
══════════════════════════════════════════════════════════ */
let _popupTimer = null;

function closePopup() {
  const el = document.getElementById('popup_overlay');
  if (el) el.style.display = 'none';
  if (_popupTimer) { clearTimeout(_popupTimer); _popupTimer = null; }
}

function checkPopup() {
  if (!database) return;
  database.ref('settings/config/Popup').once('value', (snap) => {
    const p = snap.val();
    if (!p || p.Flag !== 'ON') return;
    const todayStr = new Date().toISOString().slice(0,10).replace(/-/g,'');
    if (todayStr < (p.Start || '00000000') || todayStr > (p.End || '99999999')) return;

    const overlay = document.getElementById('popup_overlay');
    const imgEl   = document.getElementById('popup_img');
    const txtEl   = document.getElementById('popup_text');
    if (!overlay) return;

    if (p.Image) { imgEl.src = p.Image; imgEl.style.display = 'block'; imgEl.onerror = () => { imgEl.style.display = 'none'; }; }
    else imgEl.style.display = 'none';

    if (p.Msg) { txtEl.textContent = p.Msg; txtEl.style.display = 'block'; }
    else txtEl.style.display = 'none';

    overlay.style.display = 'flex';
    _popupTimer = setTimeout(closePopup, 5000);
  });
}

/* ══════════════════════════════════════════════════════════
   3D POINTER TILT — Desktop only, passive RAF loop
══════════════════════════════════════════════════════════ */
function init3DTilt() {
  if (!window.matchMedia('(hover:hover) and (min-width:1025px)').matches) return;
  const lerp = (a, b, t) => a + (b - a) * t;

  document.querySelectorAll('.menu-card').forEach(card => {
    let tx = 0, ty = 0, cx = 0, cy = 0;
    let raf = null, active = false;

    const tick = () => {
      if (!active) return;
      cx = lerp(cx, tx, 0.1);
      cy = lerp(cy, ty, 0.1);
      card.style.transform = `perspective(900px) rotateX(${cx}deg) rotateY(${cy}deg) translateY(-6px) scale(1.03) translateZ(0)`;
      raf = requestAnimationFrame(tick);
    };

    card.addEventListener('mouseenter', () => {
      active = true;
      raf = requestAnimationFrame(tick);
    }, { passive: true });

    card.addEventListener('mousemove', (e) => {
      const r = card.getBoundingClientRect();
      tx = -((e.clientY - r.top  - r.height / 2) / (r.height / 2)) * 9;
      ty =  ((e.clientX - r.left - r.width  / 2) / (r.width  / 2)) * 9;
    }, { passive: true });

    card.addEventListener('mouseleave', () => {
      active = false;
      if (raf) cancelAnimationFrame(raf);
      card.style.transform = '';
      cx = cy = tx = ty = 0;
    }, { passive: true });
  });
}

/* ══════════════════════════════════════════════════════════
   KEYBOARD NAVIGATION for menu cards
══════════════════════════════════════════════════════════ */
function initKeyboard() {
  document.querySelectorAll('.menu-card[role="button"]').forEach(card => {
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); card.click(); }
    });
  });
}

/* ══════════════════════════════════════════════════════════
   CLEANUP on page unload
══════════════════════════════════════════════════════════ */
window.addEventListener('beforeunload', () => {
  if (_clockTimer) clearInterval(_clockTimer);
  if (_popupTimer) clearTimeout(_popupTimer);
  if (_profileRef) _profileRef.off();
});

/* ══════════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
  const userId = sessionStorage.getItem('loggedInUser');
  if (!userId) { location.href = 'index.html'; return; }

  // Background
  const bgEl = document.getElementById('bg-layer');
  if (bgEl && cfg.buildBg) cfg.buildBg(bgEl);

  // Sub-label
  const subEl = document.getElementById('pageSub');
  if (subEl) subEl.textContent = cfg.sub;

  // Firebase
  if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  database = firebase.database();
  firebase.auth().onAuthStateChanged(() => loadProfile(userId));

  // Clock — single interval, cached element
  updateClock();
  _clockTimer = setInterval(updateClock, 1000);

  // Date
  initDate();

  // 3D tilt (desktop)
  init3DTilt();

  // Keyboard nav
  initKeyboard();

  // Popup (delayed)
  setTimeout(checkPopup, 1200);
});

// Global exports for inline onclick handlers
window.navigateTo = navigateTo;
window.handleLogout = handleLogout;
window.closePopup = closePopup;
</script>
