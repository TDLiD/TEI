<style>
    /* (기존 스타일 유지) */
    .calendar-table th { padding: 6px 0; color: #64748b; font-size: 0.6rem; text-align: center; font-weight: 800; }
    .calendar-table td { 
        height: 70px; width: 14.28%; border: 1px solid #1e293b; vertical-align: top; padding: 2px; position: relative; transition: background 0.2s;
    }

    @media (max-width: 640px) {
        .calendar-table td { height: 55px !important; padding: 1px; }
        .time-label { font-size: 0.45rem !important; padding: 1px !important; margin-top: 1px !important; line-height: 1; letter-spacing: -0.05em; }
        #currentMonthYear { font-size: 0.9rem; }
        .nav-btn { padding: 3px 5px !important; font-size: 0.65rem !important; }
        h2#mainWelcomeMsg { font-size: 1.25rem !important; line-height: 1.2; }
        section { padding: 1rem !important; border-radius: 1.5rem !important; }
    }

    .calendar-table td:hover { background-color: #0f172a; }
    .today-highlight { background-color: rgba(37, 99, 235, 0.1); border: 2px solid #3b82f6 !important; z-index: 10; }
    
    .time-label {
        display: block; font-family: 'JetBrains Mono', monospace; font-size: 0.55rem; font-weight: 800;
        padding: 1px 2px; margin-top: 1px; border-radius: 3px; text-align: center;
    }
    
    .att-color { background-color: rgba(16, 185, 129, 0.15); color: #10b981; } 
    .late-color { background-color: rgba(244, 63, 94, 0.15); color: #f43f5e; } 
    .other-color { background-color: rgba(245, 158, 11, 0.15); color: #f59e0b; } 
    .out-time { background-color: rgba(148, 163, 184, 0.1); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.2); }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* [추가] 주간 경고 바 애니메이션 */
    .warning-pulse { animation: pulse-red 2s infinite; }
    @keyframes pulse-red {
        0% { border-color: rgba(244, 63, 94, 0.3); }
        50% { border-color: rgba(244, 63, 94, 1); box-shadow: 0 0 10px rgba(244, 63, 94, 0.2); }
        100% { border-color: rgba(244, 63, 94, 0.3); }
    }
</style>

<div class="flex flex-col lg:flex-row gap-4 md:gap-8 animate-fadeIn p-2 md:p-0">
    
    <div class="w-full lg:w-1/3 space-y-3 md:space-y-6">
        <div class="px-1">
            <p class="text-slate-500 text-[9px] uppercase font-black tracking-widest mb-0.5">Authenticated as</p>
            <h2 id="mainWelcomeMsg" class="text-xl md:text-3xl font-black text-white"></h2>

            <div id="weeklySummaryCard" class="mt-4 p-4 rounded-2xl border border-slate-800 bg-slate-900/50 transition-all duration-500">
                <div class="flex items-center justify-between mb-1">
                    <span id="warningIcon" class="text-lg opacity-0 transition-opacity">⚠️</span>
                    <span class="text-[9px] font-black text-slate-500 uppercase tracking-widest">Weekly Late Ratio</span>
                </div>
                <div class="flex items-end gap-2">
                    <span id="lateRatioPercent" class="text-3xl font-black text-white">0%</span>
                    <span id="lateRatioStatus" class="text-[10px] font-bold text-slate-500 mb-1 uppercase">Checking...</span>
                </div>
                <div class="w-full bg-slate-800 h-1.5 rounded-full mt-3 overflow-hidden">
                    <div id="lateRatioBar" class="h-full bg-blue-500 transition-all duration-1000" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <section class="bg-slate-900 p-4 md:p-6 rounded-[2rem] border border-slate-800 shadow-2xl">
            <div class="flex justify-between items-center mb-4 md:mb-6">
                <p class="text-[9px] text-slate-500 uppercase font-black tracking-widest">Attendance Panel</p>
                <p id="liveDate" class="text-[9px] font-bold text-blue-500 bg-blue-500/10 px-2 py-0.5 rounded"></p>
            </div>
            
            <div class="space-y-3 md:space-y-4">
                <div id="timeInputWrapper" class="bg-slate-800/50 p-3 md:p-4 rounded-xl border border-slate-700/50 transition-opacity">
                    <label class="block text-[9px] font-bold text-slate-500 uppercase mb-1 md:mb-2">Time (24H)</label>
                    <input type="text" id="manualTime" 
                           placeholder="00:00:00" maxlength="8"
                           class="w-full bg-slate-800 text-white text-xl md:text-2xl font-black p-2 md:p-3 rounded-lg border border-slate-600 outline-none text-center">
                </div>

                <div class="bg-slate-800/50 p-3 md:p-4 rounded-xl border border-slate-700/50">
                    <select id="specialStatus" onchange="toggleInputMode()" class="w-full bg-slate-800 text-white font-bold p-2 md:p-3 rounded-lg border border-slate-600 outline-none cursor-pointer text-xs">
                        <option value="">--- REGULAR (IN/OUT) ---</option>
                        <option value="WO">WO (Work Out)</option>
                        <option value="PEL">PEL (Personal Leave)</option>
                        <option value="ANL">ANL (Annual Leave)</option>
                        <option value="HAL">HAL (Half Day Leave)</option>
                        <option value="SIL">SIL (Sick Leave)</option>
                        <option value="SPL">SPL (Special Leave)</option>
                    </select>
                </div>

                <div id="buttonArea" class="grid grid-cols-2 gap-2 md:gap-3">
                    <button id="btnIn" onclick="handleAttendance('attend')" class="bg-emerald-600 text-white py-3 md:py-4 rounded-xl text-xs font-black transition active:scale-95">SET IN</button>
                    <button id="btnOut" onclick="handleAttendance('leave')" class="bg-rose-600 text-white py-3 md:py-4 rounded-xl text-xs font-black transition active:scale-95">SET OUT</button>
                </div>
                
                <div id="specialButtonArea" class="hidden">
                    <button onclick="handleSpecialStatus()" class="w-full bg-blue-600 text-white py-3 md:py-4 rounded-xl text-xs font-black transition active:scale-95">SAVE STATUS</button>
                </div>
            </div>

            <div id="attendanceLog" class="mt-3 p-2 bg-black/30 rounded-lg text-center text-[9px] font-bold text-slate-400 italic">No records</div>
        </section>
    </div>

    <div class="flex-1">
        <section class="bg-slate-900 p-3 md:p-8 rounded-[2rem] border border-slate-800 shadow-2xl h-full">
            <div class="mb-6 flex justify-center sm:justify-start">
                <button onclick="switchTab('allatt')" 
                        class="group relative flex items-center gap-3 bg-black hover:bg-slate-900 text-white px-5 py-2 md:py-3 rounded-2xl text-[10px] md:text-xs font-black transition-all active:scale-95 shadow-lg shadow-black/50 border border-slate-800 w-full sm:w-auto justify-center sm:justify-start h-fit">
                    <img src="images/gif/click.gif" alt="click" class="w-8 h-8 md:w-10 md:h-10 object-contain group-hover:scale-110 transition-transform">
                    <span class="uppercase tracking-widest whitespace-nowrap">All Staff Record</span>
                    <span class="opacity-50 group-hover:translate-x-1 transition-transform hidden xs:inline">❯</span>
                </button>
            </div>

            <div class="flex flex-col sm:flex-row justify-between items-center mb-4 px-1 gap-3">
                <div class="flex items-center justify-between w-full sm:w-auto gap-3">
                    <div id="currentMonthYear" class="text-sm md:text-lg font-black text-white italic underline decoration-blue-500 underline-offset-4"></div>
                    <div class="flex bg-slate-800 rounded-lg p-0.5">
                        <button onclick="changeMonth(-1)" class="nav-btn px-2 py-1 text-slate-400 text-[10px] font-black">PREV</button>
                        <button onclick="goToday()" class="nav-btn px-2 py-1 text-blue-400 text-[10px] font-black mx-0.5">TODAY</button>
                        <button onclick="changeMonth(1)" class="nav-btn px-2 py-1 text-slate-400 text-[10px] font-black">NEXT</button>
                    </div>
                </div>

                <div class="flex items-center gap-3 w-full sm:w-auto justify-end sm:border-l sm:border-slate-800 sm:pl-4">
                    <span class="text-[9px] text-slate-500 font-bold uppercase">Std: <span id="displayStdTime" class="text-slate-300">--:--</span></span>
                    <div class="w-1.5 h-1.5 rounded-full bg-blue-500 animate-pulse"></div>
                </div>
            </div>

            <div class="overflow-x-auto no-scrollbar rounded-xl border border-slate-800">
                <table class="calendar-table min-w-[300px] w-full border-collapse bg-slate-900/50">
                    <thead>
                        <tr class="bg-slate-800/30">
                            <th class="text-rose-500 uppercase">Sun</th>
                            <th class="uppercase">Mon</th><th class="uppercase">Tue</th><th class="uppercase">Wed</th>
                            <th class="uppercase">Thu</th><th class="uppercase">Fri</th>
                            <th class="text-blue-500 uppercase">Sat</th>
                        </tr>
                    </thead>
                    <tbody id="calendarBody"></tbody>
                </table>
            </div>
        </section>
    </div>
</div>

<script>
function getJakartaDate() {
    const now = new Date();
    const jakartaStr = now.toLocaleString("en-US", {timeZone: "Asia/Jakarta"});
    return new Date(jakartaStr);
}

(function() {
    const user = sessionStorage.getItem('loggedInUser');
    document.getElementById('mainWelcomeMsg').innerText = user;
    const db = firebase.database();
    
    let now = getJakartaDate(); 
    let viewDate = new Date(now);

    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    const todayStr = `${y}-${m}-${d}`;
    let standardTime = "";

    const btnIn = document.getElementById('btnIn');
    const timeInput = document.getElementById('manualTime');

    // --- [수정 및 추가된 부분 시작] ---

    // 1. 실시간 시간 업데이트 함수
    function updateLiveTime() {
        // 사용자가 직접 입력 중(포커스 상태)일 때는 자동 업데이트를 하지 않음
        if (document.activeElement === timeInput) return;
        
        const liveNow = getJakartaDate();
        const hh = String(liveNow.getHours()).padStart(2, '0');
        const mm = String(liveNow.getMinutes()).padStart(2, '0');
        
        // 입력창 값을 현재 시간으로 변경
        timeInput.value = `${hh}:${mm}`;
    }

    // 2. 1초마다 실시간 시간 업데이트 실행
    setInterval(updateLiveTime, 1000);

    // 3. 페이지 로드 시 즉시 한 번 실행 (00:00 방지)
    updateLiveTime();

    // 입력 마스크 유지
    timeInput.addEventListener('input', function(e) {
        let v = e.target.value.replace(/[^0-9]/g, '');
        if (v.length >= 3) {
            v = v.substring(0, 2) + ":" + v.substring(2, 4);
        }
        e.target.value = v;
    });

    // --- [수정 및 추가된 부분 끝] ---

    // 주간 지각률 계산 로직
    function updateWeeklyLateRatio(data) {
        const current = getJakartaDate();
        const day = current.getDay(); 
        const diffToMonday = current.getDate() - day + (day === 0 ? -6 : 1);
        const monday = new Date(current.setDate(diffToMonday));
        
        let totalRecords = 0;
        let lateCount = 0;

        for (let i = 0; i < 7; i++) {
            let dObj = new Date(monday);
            dObj.setDate(monday.getDate() + i);
            const dStr = `${dObj.getFullYear()}-${String(dObj.getMonth() + 1).padStart(2, '0')}-${String(dObj.getDate()).padStart(2, '0')}`;
            
            const rec = data[dStr] ? data[dStr][user] : null;
            if (rec && typeof rec !== 'string' && rec.attend) {
                totalRecords++;
                if (rec.attend.includes("LATE")) lateCount++;
            }
        }

        const ratio = totalRecords > 0 ? Math.round((lateCount / totalRecords) * 100) : 0;
        
        const card = document.getElementById('weeklySummaryCard');
        const ratioText = document.getElementById('lateRatioPercent');
        const statusText = document.getElementById('lateRatioStatus');
        const bar = document.getElementById('lateRatioBar');
        const icon = document.getElementById('warningIcon');

        ratioText.innerText = `${ratio}%`;
        bar.style.width = `${ratio}%`;

        if (ratio >= 50) {
            card.classList.add('bg-rose-950/30', 'border-rose-500', 'warning-pulse');
            ratioText.classList.replace('text-white', 'text-rose-500');
            statusText.innerText = "Warning: High Lateness";
            statusText.classList.replace('text-slate-500', 'text-rose-500');
            bar.classList.replace('bg-blue-500', 'bg-rose-500');
            icon.classList.replace('opacity-0', 'opacity-100');
        } else {
            card.classList.remove('bg-rose-950/30', 'border-rose-500', 'warning-pulse');
            ratioText.classList.replace('text-rose-500', 'text-white');
            statusText.innerText = totalRecords > 0 ? "Weekly Condition: Good" : "No records this week";
            statusText.classList.replace('text-rose-500', 'text-slate-500');
            bar.classList.replace('bg-rose-500', 'bg-blue-500');
            icon.classList.replace('opacity-100', 'opacity-0');
        }
    }

    db.ref('settings/standardTime').on('value', (snap) => {
        const val = snap.val();
        if(val) {
            standardTime = val;
            document.getElementById('displayStdTime').innerText = standardTime;
            if(btnIn) btnIn.disabled = false;
        }
    });

    function isValidTime(t) {
        if(!t) return false;
        return /^([01][0-9]|2[0-3]):([0-5][0-9])$/.test(t);
    }

    window.handleAttendance = function(type) {
        if (!type || typeof type !== 'string') return;
        const inputTime = timeInput.value; 
        if(!isValidTime(inputTime)) {
            alert("Please enter a valid time (HH:mm).");
            return;
        }

        db.ref('attendance/' + todayStr + '/' + user).once('value', (snap) => {
            const currentData = snap.val() || {};
            if (type === 'attend' && currentData.attend) {
                alert("Attendance time has already been set.");
                return;
            }

            let finalVal = inputTime;
            if(type === 'attend') {
                if(!standardTime) { alert("Standard time is loading..."); return; }
                
                const [iHH, iMM] = inputTime.split(':').map(Number);
                const [sHH, sMM] = standardTime.split(':').map(Number);
                const stdMinutes = sHH * 60 + sMM;
                const inputMinutes = iHH * 60 + iMM;
                
                if (inputMinutes <= stdMinutes) {
                    finalVal = `ATT(${inputTime})`;
                } else {
                    finalVal = `LATE(${inputTime})`;
                }
            }

            if(confirm(`Update ${type.toUpperCase()} to ${finalVal}?`)) {
                db.ref('attendance/' + todayStr + '/' + user).update({ [type]: finalVal })
                .then(() => alert("Success."));
            }
        });
    };

    document.getElementById('liveDate').innerText = now.toLocaleDateString('en-US', { 
        month: 'short', day: 'numeric', weekday: 'short', timeZone: 'Asia/Jakarta' 
    }).toUpperCase();

    window.toggleInputMode = function() {
        const status = document.getElementById('specialStatus').value;
        const timeInputWrapper = document.getElementById('timeInputWrapper');
        const btnArea = document.getElementById('buttonArea');
        const specialBtnArea = document.getElementById('specialButtonArea');

        if(status !== "") {
            timeInputWrapper.classList.add('opacity-30', 'pointer-events-none');
            btnArea.classList.add('hidden');
            specialBtnArea.classList.remove('hidden');
        } else {
            timeInputWrapper.classList.remove('opacity-30', 'pointer-events-none');
            btnArea.classList.remove('hidden');
            specialBtnArea.classList.add('hidden');
        }
    };

    window.handleSpecialStatus = function() {
        const status = document.getElementById('specialStatus').value;
        if(!status) return;
        if(confirm(`Set status to ${status}?`)) {
            db.ref('attendance/' + todayStr + '/' + user).set(status)
            .then(() => {
                alert("Success.");
                document.getElementById('specialStatus').value = "";
                toggleInputMode();
            });
        }
    };

    window.goToday = function() {
        viewDate = getJakartaDate();
        renderCalendar();
    };

    window.changeMonth = function(offset) {
        viewDate.setMonth(viewDate.getMonth() + offset);
        renderCalendar();
    };

    function renderCalendar() {
        const year = viewDate.getFullYear(), month = viewDate.getMonth();
        const firstDay = new Date(year, month, 1).getDay();
        const lastDate = new Date(year, month + 1, 0).getDate();
        
        document.getElementById('currentMonthYear').innerText = 
            viewDate.toLocaleString('en-US', { month: 'long', year: 'numeric' }).toUpperCase();
        
        db.ref('attendance').off();
        db.ref('attendance').on('value', (snap) => {
            const data = snap.val() || {};
            updateWeeklyLateRatio(data);

            const tbody = document.getElementById('calendarBody');
            tbody.innerHTML = '';
            
            let dateCounter = 1;
            for (let i = 0; i < 6; i++) {
                let row = document.createElement('tr');
                for (let j = 0; j < 7; j++) {
                    let cell = document.createElement('td');
                    if (i === 0 && j < firstDay || dateCounter > lastDate) {
                        row.appendChild(cell);
                    } else {
                        const dStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(dateCounter).padStart(2, '0')}`;
                        const rec = data[dStr] ? data[dStr][user] : null;
                        if (dStr === todayStr) cell.classList.add('today-highlight');
                        
                        let content = `<div class="text-[9px] font-black text-slate-500 opacity-50 ml-1 mt-1">${dateCounter}</div>`;
                        
                        if (rec) {
                            if (typeof rec === 'string') {
                                content += `<span class="time-label other-color mt-2">${rec}</span>`;
                            } else {
                                let attendText = rec.attend ? rec.attend : "";
                                let attendColor = "other-color"; 
                                if(attendText.includes("ATT")) attendColor = "att-color";
                                else if(attendText.includes("LATE")) attendColor = "late-color";
                                
                                content += `<span class="time-label ${attendColor}">☀️ ${attendText}</span>`;
                                let leaveText = rec.leave ? rec.leave : "";
                                content += `<span class="time-label out-time">🌙 ${leaveText}</span>`;
                            }
                        }
                        
                        cell.innerHTML = content;
                        row.appendChild(cell); 
                        dateCounter++;
                    }
                }
                tbody.appendChild(row);
                if (dateCounter > lastDate) break; 
            }
        });
    }

    renderCalendar();
})();
</script>
