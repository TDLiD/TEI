<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="theme-color" content="#03060f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Menu Select - Daily System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<style>
/* ══════════════════════════════════════════════════════════════
   CSS VARIABLES & RESET
   ══════════════════════════════════════════════════════════════ */
:root {
    --bg: #03060f;
    --surface: rgba(8, 18, 36, 0.85);
    --surface-2: rgba(16, 32, 60, 0.6);
    --surface-glass: rgba(255, 255, 255, 0.05);
    
    --blue: #3b82f6;
    --blue-glow: rgba(59, 130, 246, 0.25);
    --cyan: #06b6d4;
    --violet: #818cf8;
    --rose: #f43f5e;
    --gold: #f59e0b;
        --vh: 1vh;

    --chrome: #e2e8f0;
    --text: #cbd5e1;
    --muted: #475569;
    
    --border: rgba(255, 255, 255, 0.08);
    --border-2: rgba(255, 255, 255, 0.15);
    --border-glow: rgba(59, 130, 246, 0.4);
    
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
    --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.6);
    --shadow-glow: 0 0 40px var(--blue-glow);
}

*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: "Pretendard", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
    perspective: 2000px;
    position: relative;
}

/* ══════════════════════════════════════════════════════════════
   BACKGROUND & ATMOSPHERE
   ══════════════════════════════════════════════════════════════ */
#dynamicBg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    transition: opacity 1s ease;
}

#dynamicBg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: 
        radial-gradient(ellipse 70% 50% at 50% 0%, rgba(59, 130, 246, 0.15) 0%, transparent 65%),
        radial-gradient(ellipse 50% 60% at 10% 80%, rgba(129, 140, 248, 0.1) 0%, transparent 60%),
        linear-gradient(180deg, rgba(3, 6, 15, 0.5) 0%, rgba(3, 6, 15, 0.8) 100%);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
}

/* Film Grain Noise */
body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 1;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    opacity: 0.03;
    pointer-events: none;
}

/* Animated Orbs */
.orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(140px);
    pointer-events: none;
    z-index: 1;
    animation: orb-float 30s ease-in-out infinite alternate;
    will-change: transform, opacity;
}

.orb-a {
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(59, 130, 246, 0.12) 0%, transparent 70%);
    top: -25%;
    right: -20%;
}

.orb-b {
    width: 550px;
    height: 550px;
    background: radial-gradient(circle, rgba(129, 140, 248, 0.1) 0%, transparent 70%);
    bottom: -20%;
    left: -15%;
    animation-delay: -10s;
}

.orb-c {
    width: 450px;
    height: 450px;
    background: radial-gradient(circle, rgba(6, 182, 212, 0.08) 0%, transparent 70%);
    top: 50%;
    right: 15%;
    animation-delay: -18s;
}

@keyframes orb-float {
    0% {
        transform: translate(0, 0) scale(1);
        opacity: 0.6;
    }
    50% {
        transform: translate(40px, 60px) scale(1.15);
        opacity: 0.85;
    }
    100% {
        transform: translate(25px, 45px) scale(1.1);
        opacity: 0.65;
    }
}

/* ══════════════════════════════════════════════════════════════
   LAYOUT
   ══════════════════════════════════════════════════════════════ */
.content-wrapper {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100vh;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 1.5rem 1rem 4rem;
    -ms-overflow-style: none;
    scrollbar-width: none;
}

.content-wrapper::-webkit-scrollbar {
    display: none;
}

.main-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: calc(100vh - 3rem);
    /* 모바일에서 주소창 대응 */
    min-height: calc(var(--vh, 1vh) * 100 - 3rem);
    padding-bottom: 1rem;
}

/* ══════════════════════════════════════════════════════════════
   HEADER SECTION
   ══════════════════════════════════════════════════════════════ */
.header-section {
    text-align: center;
    margin-bottom: clamp(2rem, 5vh, 4rem);
    animation: reveal-down 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
    transform-style: preserve-3d;
}

.live-time {
    font-size: clamp(9px, 2vw, 11px);
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--cyan);
    margin-bottom: clamp(14px, 3vw, 18px);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    opacity: 0.9;
    transform: translateZ(25px);
    font-weight: 600;
}

.live-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 
        0 0 12px var(--cyan),
        0 0 24px rgba(6, 182, 212, 0.6);
    animation: pulse 2.5s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% {
        opacity: 1;
        transform: scale(1);
        box-shadow: 0 0 12px var(--cyan), 0 0 24px rgba(6, 182, 212, 0.6);
    }
    50% {
        opacity: 0.3;
        transform: scale(0.5);
        box-shadow: 0 0 6px var(--cyan);
    }
}

.greeting {
    font-size: clamp(2rem, 6vw, 4.2rem);
    font-weight: 900;
    letter-spacing: -0.03em;
    line-height: 1.1;
    color: #fff;
    text-shadow: 
        0 0 70px rgba(59, 130, 246, 0.5),
        0 12px 35px rgba(0, 0, 0, 0.6);
    margin-bottom: clamp(10px, 2.5vw, 14px);
    transform: translateZ(50px);
}

.greeting span {
    background: linear-gradient(135deg, var(--blue) 0%, var(--cyan) 50%, var(--violet) 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradient-shift 5s ease infinite;
    filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.4));
}

@keyframes gradient-shift {
    0%, 100% {
        background-position: 0% 50%;
    }
    50% {
        background-position: 100% 50%;
    }
}

.sub-label {
    font-size: clamp(9px, 2vw, 11px);
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 700;
    transform: translateZ(35px);
}

/* ══════════════════════════════════════════════════════════════
   MENU GRID & CARDS (3D Enhanced)
   ══════════════════════════════════════════════════════════════ */
.menu-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: clamp(14px, 3vw, 24px);
    width: 100%;
    max-width: 850px;
    margin-bottom: clamp(2rem, 5vh, 3rem);
    perspective: 2500px;
    transform-style: preserve-3d;
}

.menu-card {
    position: relative;
    background: linear-gradient(
        135deg, 
        rgba(16, 32, 60, 0.95) 0%, 
        rgba(8, 18, 36, 0.9) 100%
    );
    border: 1.5px solid var(--border);
    border-radius: clamp(20px, 5vw, 28px);
    padding: clamp(28px, 7vw, 45px) clamp(12px, 3.5vw, 24px);
    
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(14px, 4vw, 20px);
    
    cursor: pointer;
    overflow: hidden;
    transform-style: preserve-3d;
    transform: translateZ(0);
    transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    animation: card-in 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    
    box-shadow: 
        0 2px 4px rgba(255, 255, 255, 0.12),
        0 18px 36px rgba(0, 0, 0, 0.5),
        0 8px 20px rgba(0, 0, 0, 0.35),
        inset 0 1px 2px rgba(255, 255, 255, 0.2),
        inset 0 -1px 2px rgba(0, 0, 0, 0.3);
    
    will-change: transform, box-shadow;
}

/* Glass Morphism Overlay */
.menu-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.12) 0%,
        transparent 35%,
        transparent 65%,
        rgba(255, 255, 255, 0.08) 100%
    );
    pointer-events: none;
    opacity: 0.7;
    transition: opacity 0.5s ease;
}

/* Top Highlight Line */
.menu-card::after {
    content: '';
    position: absolute;
    top: 0;
    left: 15%;
    right: 15%;
    height: 2.5px;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(59, 130, 246, 0.7),
        rgba(6, 182, 212, 0.7),
        transparent
    );
    filter: blur(1px);
    opacity: 0.9;
}

/* Card Glow Effect */
.card-glow {
    position: absolute;
    width: clamp(90px, 22vw, 140px);
    height: clamp(90px, 22vw, 140px);
    border-radius: 50%;
    background: radial-gradient(
        circle,
        rgba(59, 130, 246, 0.5) 0%,
        rgba(6, 182, 212, 0.25) 40%,
        transparent 70%
    );
    top: 8%;
    left: 50%;
    transform: translateX(-50%) translateZ(15px);
    opacity: 0;
    transition: opacity 0.6s ease, transform 0.6s ease;
    pointer-events: none;
    filter: blur(18px);
}

/* Icon Container */
.card-icon-wrap {
    width: clamp(56px, 14vw, 80px);
    height: clamp(56px, 14vw, 80px);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 2;
    transform-style: preserve-3d;
    transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    filter: 
        drop-shadow(0 12px 24px rgba(0, 0, 0, 0.6))
        drop-shadow(0 6px 12px rgba(0, 0, 0, 0.4));
}

.card-icon-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    transform-style: preserve-3d;
}

/* Card Label */
.card-label {
    font-size: clamp(7.5px, 2vw, 12px);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.25em;
    color: var(--text);
    text-align: center;
    position: relative;
    z-index: 2;
    transform-style: preserve-3d;
    transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    line-height: 1.6;
    text-shadow: 0 3px 8px rgba(0, 0, 0, 0.7);
}

/* Hover Effects (Desktop) */
@media (hover: hover) {
    .menu-card:hover {
        transform: translateY(-18px) translateZ(70px) scale(1.08) rotateX(10deg);
        border-color: rgba(59, 130, 246, 0.7);
        background: linear-gradient(
            135deg,
            rgba(59, 130, 246, 0.3) 0%,
            rgba(6, 182, 212, 0.25) 100%
        );
        box-shadow: 
            0 3px 6px rgba(255, 255, 255, 0.25),
            0 35px 70px rgba(0, 0, 0, 0.8),
            0 18px 42px rgba(59, 130, 246, 0.5),
            0 0 50px rgba(59, 130, 246, 0.4),
            inset 0 1px 3px rgba(255, 255, 255, 0.35),
            inset 0 -1px 3px rgba(0, 0, 0, 0.35);
    }
    
    .menu-card:hover::before {
        opacity: 1;
        background: linear-gradient(
            135deg,
            rgba(255, 255, 255, 0.25) 0%,
            rgba(59, 130, 246, 0.15) 35%,
            rgba(6, 182, 212, 0.15) 65%,
            rgba(255, 255, 255, 0.2) 100%
        );
    }
    
    .menu-card:hover .card-label {
        color: #fff;
        text-shadow: 
            0 0 18px rgba(59, 130, 246, 0.8),
            0 3px 10px rgba(0, 0, 0, 0.9);
        transform: translateZ(25px);
    }
    
    .menu-card:hover .card-icon-wrap {
        transform: translateZ(50px) scale(1.2) rotateY(10deg);
        filter: 
            drop-shadow(0 18px 36px rgba(0, 0, 0, 0.7))
            drop-shadow(0 0 30px rgba(59, 130, 246, 0.6));
    }
    
    .menu-card:hover .card-glow {
        opacity: 1;
        transform: translateX(-50%) translateZ(20px) scale(1.1);
    }
}

/* Active State */
.menu-card:active {
    transform: scale(0.96) translateY(5px) translateZ(-15px);
    box-shadow: 
        0 6px 18px rgba(0, 0, 0, 0.6),
        inset 0 1px 3px rgba(255, 255, 255, 0.15);
}

/* Card Animation Delays */
.menu-card:nth-child(1) { animation-delay: 0.1s; }
.menu-card:nth-child(2) { animation-delay: 0.2s; }
.menu-card:nth-child(3) { animation-delay: 0.3s; }
.menu-card:nth-child(4) { animation-delay: 0.4s; }

@keyframes card-in {
    from {
        opacity: 0;
        transform: translateY(50px) translateZ(-120px) scale(0.88) rotateX(25deg);
    }
    to {
        opacity: 1;
        transform: translateY(0) translateZ(0) scale(1) rotateX(0deg);
    }
}

@keyframes reveal-down {
    from {
        opacity: 0;
        transform: translateY(-40px) translateZ(-60px);
    }
    to {
        opacity: 1;
        transform: translateY(0) translateZ(0);
    }
}

/* ══════════════════════════════════════════════════════════════
   BOTTOM ACTIONS
   ══════════════════════════════════════════════════════════════ */
.bottom-actions {
    display: flex;
    align-items: center;
    gap: clamp(18px, 5vw, 45px);
    animation: reveal-down 1s cubic-bezier(0.16, 1, 0.3, 1) 0.6s both;
    transform-style: preserve-3d;
}

.action-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(7px, 2.5vw, 10px);
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    background: none;
    border: none;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    transform-style: preserve-3d;
}

.action-btn:active {
    transform: scale(0.93) translateZ(-12px);
}

.action-icon {
    width: clamp(46px, 11vw, 52px);
    height: clamp(46px, 11vw, 52px);
    border-radius: clamp(14px, 3.5vw, 18px);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(1.1rem, 3.5vw, 1.4rem);
    border: 1.5px solid var(--border);
    background: var(--surface);
    transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    transform-style: preserve-3d;
    box-shadow: 
        0 8px 20px rgba(0, 0, 0, 0.45),
        0 3px 8px rgba(0, 0, 0, 0.35),
        inset 0 1px 1px rgba(255, 255, 255, 0.15),
        inset 0 -1px 1px rgba(0, 0, 0, 0.25);
}

@media (hover: hover) {
    .action-btn.settings:hover .action-icon {
        background: rgba(59, 130, 246, 0.25);
        border-color: rgba(59, 130, 246, 0.6);
        box-shadow: 
            0 0 35px rgba(59, 130, 246, 0.5),
            0 12px 30px rgba(0, 0, 0, 0.6);
        transform: translateZ(18px) scale(1.1);
    }
    
    .action-btn.logout:hover .action-icon {
        background: rgba(244, 63, 94, 0.25);
        border-color: rgba(244, 63, 94, 0.6);
        box-shadow: 
            0 0 35px rgba(244, 63, 94, 0.5),
            0 12px 30px rgba(0, 0, 0, 0.6);
        transform: translateZ(18px) scale(1.1);
    }
}

.action-label {
    font-size: clamp(8px, 2.2vw, 10px);
    font-weight: 800;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
}

.action-btn.settings .action-label {
    color: var(--muted);
}

.action-btn.logout .action-label {
    color: rgba(244, 63, 94, 0.8);
}

.divider {
    width: 1.5px;
    height: clamp(32px, 7vw, 36px);
    background: linear-gradient(
        180deg,
        transparent,
        var(--border-2),
        transparent
    );
    transform: translateZ(8px);
}

/* ══════════════════════════════════════════════════════════════
   DAY INDICATOR
   ══════════════════════════════════════════════════════════════ */
.day-indicator {
    position: fixed;
    top: clamp(18px, 3.5vw, 24px);
    right: clamp(18px, 3.5vw, 24px);
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 5px;
    animation: reveal-down 0.8s ease 0.25s both;
    transform-style: preserve-3d;
}

.day-name {
    font-size: clamp(8.5px, 1.8vw, 11px);
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 700;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
    transform: translateZ(12px);
}

.day-number {
    font-size: clamp(1.8rem, 5.5vw, 2.5rem);
    font-weight: 900;
    line-height: 1;
    color: rgba(255, 255, 255, 0.1);
    letter-spacing: -0.04em;
    text-shadow: 0 3px 10px rgba(0, 0, 0, 0.4);
    transform: translateZ(8px);
}

/* ══════════════════════════════════════════════════════════════
   PROFILE SECTION
   ══════════════════════════════════════════════════════════════ */
.profile-container {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    vertical-align: middle;
    margin-left: 14px;
    cursor: pointer;
    z-index: 10;
    line-height: 0;
}

.profile-img {
    width: clamp(44px, 11vw, 66px);
    height: clamp(44px, 11vw, 66px);
    border-radius: 50%;
    border: 2.5px solid var(--cyan);
    object-fit: cover;
    display: block;
    transition: transform 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
    box-shadow: 
        0 0 18px var(--blue-glow),
        0 6px 20px rgba(0, 0, 0, 0.5);
}

.profile-edit-icon {
    position: absolute;
    bottom: 3px;
    left: 3px;
    width: 20px;
    height: 20px;
    background: var(--blue);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: white;
    border: 2px solid var(--bg);
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.6);
    pointer-events: none;
    z-index: 11;
    transition: transform 0.3s ease;
}

.profile-container:hover .profile-img {
    transform: scale(1.12);
    border-color: var(--blue);
    box-shadow: 
        0 0 25px rgba(59, 130, 246, 0.5),
        0 8px 25px rgba(0, 0, 0, 0.6);
}

.profile-container:hover .profile-edit-icon {
    transform: scale(1.1);
}

/* ══════════════════════════════════════════════════════════════
   PROFILE MODAL
   ══════════════════════════════════════════════════════════════ */
.profile-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.profile-modal {
    background: var(--surface);
    border: 1.5px solid var(--border-2);
    border-radius: 28px;
    padding: 28px;
    width: 90%;
    max-width: 420px;
    box-shadow: 
        0 25px 60px rgba(0, 0, 0, 0.6),
        0 0 50px rgba(59, 130, 246, 0.2);
    animation: modalSlideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes modalSlideIn {
    from {
        opacity: 0;
        transform: translateY(-30px) scale(0.95);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.profile-grid {
    display: grid !important;
    grid-template-columns: repeat(4, 1fr) !important;
    gap: 14px;
    margin-top: 22px;
    max-height: 320px;
    overflow-y: auto;
    padding: 12px;
    align-items: start;
}

.profile-grid::-webkit-scrollbar {
    width: 6px;
}

.profile-grid::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.05);
    border-radius: 10px;
}

.profile-grid::-webkit-scrollbar-thumb {
    background: var(--blue);
    border-radius: 10px;
}

.profile-option {
    position: relative;
    aspect-ratio: 1;
    border-radius: 14px;
    cursor: pointer;
    border: 2.5px solid transparent;
    transition: all 0.3s ease;
    overflow: hidden;
    background: var(--surface-2);
}

.profile-option:hover {
    border-color: var(--blue);
    transform: scale(1.08);
    z-index: 2;
    box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
}

.profile-option img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.profile-option.active {
    border-color: var(--cyan) !important;
    box-shadow: 0 0 20px var(--blue-glow);
    transform: scale(1.08);
}

/* Modal Footer */
.modal-footer {
    display: flex;
    gap: 14px;
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1.5px solid var(--border);
}

.modal-btn {
    flex: 1;
    padding: 14px;
    border-radius: 14px;
    font-weight: 800;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    cursor: pointer;
    transition: all 0.4s ease;
    border: none;
}

.btn-cancel {
    background: var(--surface-2);
    color: var(--text);
}

.btn-cancel:hover {
    background: rgba(16, 32, 60, 0.8);
    transform: translateY(-2px);
}

.btn-save {
    background: var(--blue);
    color: white;
    box-shadow: 0 5px 18px rgba(59, 130, 246, 0.4);
}

.btn-save:hover {
    background: #4a90ff;
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(59, 130, 246, 0.5);
}

.btn-save:disabled {
    background: var(--muted);
    cursor: not-allowed;
    opacity: 0.5;
}

/* 고해상도 디스플레이 */
@media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {

/* 애니메이션 감소 설정 준수 */
@media (prefers-reduced-motion: reduce) {

}

/* 2. 화면 이동(궤도) 애니메이션 */
@keyframes orbitAround {

    75%  { left: 0%;   top: 100%; transform: translate(-50%, -50%) rotate(270deg); }
    100% { left: 0%;   top: 0%;   transform: translate(-50%, -50%) rotate(360deg); }
}

}

<script>
/* ══════════════════════════════════════════════════════════════
   GLOBAL CONFIGURATION
   ══════════════════════════════════════════════════════════════ */
let database;
let profileListener = null;

const PROFILE_IMAGES = [
    'image-001.webp', 'image-002.webp', 'image-003.webp', 'image-004.webp', 'image-005.webp',
    'image-01.gif', 'image-02.gif', 'image-03.gif', 'image-04.gif', 'image-05.gif',

    'image-21.gif', 'image-22.gif', 'image-23.gif', 'image-24.gif', 'image-25.gif', 
    'image-26.gif', 'image-27.gif',
    'image-01.jfif', 'image-02.jpg', 'image-03.webp', 'image-04.jfif', 'image-05.jpg',
    'image-06.webp', 'image-07.jfif', 'image-08.jpg', 'image-09.jfif', 'image-10.jpg',
    'image-11.jfif', 'image-12.jpg', 'image-13.jfif', 'image-14.jpg', 'image-15.jfif',
    'image-16.jpg', 'image-17.jfif', 'image-18.jpg', 'image-19.jfif', 'image-20.jpg',
    'image-21.jfif', 'image-22.jpg', 'image-23.jfif'
];

const FIREBASE_CONFIG = {
    apiKey: "AIzaSyCBYlhoIPDtXnPrKugo_AQ7dYVCEyMyO-w",
    authDomain: "tdlid-dailyreport.firebaseapp.com",
    databaseURL: "https://tdlid-dailyreport-default-rtdb.firebaseio.com",
    projectId: "tdlid-dailyreport",
    storageBucket: "tdlid-dailyreport.appspot.com"
};

/* ══════════════════════════════════════════════════════════════
   NAVIGATION & AUTHENTICATION
   ══════════════════════════════════════════════════════════════ */
const navigateTo = (page) => {
    sessionStorage.setItem('targetPage', page);
    location.href = 'staff.html';
};

const handleLogout = () => {
    if (confirm("Do you want to logout?")) {
        sessionStorage.clear();
        localStorage.removeItem('loggedInUser');
        
        if (typeof firebase !== 'undefined' && firebase.auth) {
            firebase.auth().signOut().finally(() => {
                location.replace('index.html');
            });
        } else {
            location.replace('index.html');
        }
    }
};

/* ══════════════════════════════════════════════════════════════
   PROFILE MANAGEMENT
   ══════════════════════════════════════════════════════════════ */
let selectedImgTmp = null;

const openProfileModal = (title, bodyHtml) => {
    const modal = document.getElementById('profileCustomModal');
    const titleEl = document.getElementById('modalTitle');
    const bodyEl = document.getElementById('modalBody');
    
    if (titleEl) titleEl.innerText = title;
    if (bodyEl) bodyEl.innerHTML = bodyHtml;
    if (modal) modal.style.display = 'flex';
};

const closeProfileModal = () => {
    const modal = document.getElementById('profileCustomModal');
    if (modal) modal.style.display = 'none';
    selectedImgTmp = null;
};

const openProfileImagePicker = () => {
    selectedImgTmp = null;
    
    const gridHtml = PROFILE_IMAGES.map(img => `
        <div onclick="selectImgTemp(this, '${img}')" class="profile-option">
            <img src="images/profile/${img}" loading="lazy" alt="Profile option">
        </div>
    `).join('');

    const fullHtml = `
        <div class="profile-grid">${gridHtml}</div>
        <div class="modal-footer">
            <button class="modal-btn btn-cancel" onclick="closeProfileModal()">Cancel</button>
            <button id="btnSaveProfile" class="modal-btn btn-save" onclick="confirmSaveProfile()" disabled>Save Profile</button>
        </div>
    `;
    
    openProfileModal('Change Profile', fullHtml);
};

const selectImgTemp = (element, fileName) => {
    document.querySelectorAll('.profile-option').forEach(opt => {
        opt.classList.remove('active');
    });
    
    element.classList.add('active');
    selectedImgTmp = fileName;
    
    const saveBtn = document.getElementById('btnSaveProfile');
    if (saveBtn) saveBtn.disabled = false;
};

const confirmSaveProfile = async () => {
    if (!selectedImgTmp) return;

    const userId = sessionStorage.getItem('loggedInUser') || 
                   (firebase.auth().currentUser ? firebase.auth().currentUser.uid : null);
    
    if (!userId) {
        alert("Session expired. Please login again.");
        return;
    }

    const saveBtn = document.getElementById('btnSaveProfile');
    if (saveBtn) {
        saveBtn.innerText = "Saving...";
        saveBtn.disabled = true;
    }

    try {
        await database.ref(`users/${userId}/profileImg`).set(selectedImgTmp);
        closeProfileModal();
    } catch (error) {
        console.error('Profile update error:', error);
        alert("Failed to update profile.");
        
        if (saveBtn) {
            saveBtn.innerText = "Save Profile";
            saveBtn.disabled = false;
        }
    }
};

const loadProfileImg = (userId) => {
    if (!userId || !database) return;

    // Remove previous listener
    if (profileListener) {
        database.ref(`users/${userId}`).off('value', profileListener);
    }

    profileListener = database.ref(`users/${userId}`).on('value', (snapshot) => {
        const userData = snapshot.val() || {};
        const imgFileName = userData.profileImg;
        const displayName = userData.displayName || userId;
        const greetingEl = document.getElementById('userGreeting');

        if (greetingEl) greetingEl.innerText = displayName;

        let container = document.querySelector('.profile-container');
        
        if (!container) {
            container = document.createElement('div');
            container.className = 'profile-container';
            container.onclick = openProfileImagePicker;
            
            const imgEl = document.createElement('img');
            imgEl.className = 'profile-img';
            imgEl.alt = 'Profile';
            
            const editIcon = document.createElement('div');
            editIcon.className = 'profile-edit-icon';
            editIcon.innerHTML = '✏️';

            container.appendChild(imgEl);
            container.appendChild(editIcon);
            
            if (greetingEl && greetingEl.parentNode) {
                greetingEl.parentNode.insertBefore(container, greetingEl.nextSibling);
            }
        }

        const img = container.querySelector('.profile-img');
        if (img) {
            const newSrc = imgFileName ? 
                `images/profile/${imgFileName}` : 
                'images/default-profile.png';
            
            if (img.getAttribute('src') !== newSrc) {
                img.src = newSrc;
                img.onerror = () => {
                    img.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(displayName)}&background=3b82f6&color=fff`;
                };
            }
        }
    });
};

/* ══════════════════════════════════════════════════════════════
   CLOCK & DATE
   ══════════════════════════════════════════════════════════════ */
const updateClock = () => {
    const clockEl = document.getElementById('liveTime');
    if (clockEl) {
        clockEl.textContent = new Date().toLocaleTimeString('en-US', { 
            hour12: false 
        });
    }
};

const initDateDisplay = () => {
    const daysArr = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const now = new Date();
    
    const dayNameEl = document.getElementById('dayName');
    const dayNumberEl = document.getElementById('dayNumber');
    
    if (dayNameEl) dayNameEl.textContent = daysArr[now.getDay()];
    if (dayNumberEl) dayNumberEl.textContent = String(now.getDate()).padStart(2, '0');
};

/* ══════════════════════════════════════════════════════════════
   DYNAMIC BACKGROUND
   ══════════════════════════════════════════════════════════════ */
const setDynamicBackground = () => {
    const day = new Date().getDate();
    const imgIndex = ((day - 1) % 10) + 1;
    const bgEl = document.getElementById('dynamicBg');
    
    if (bgEl) {
        bgEl.style.backgroundImage = `url('images/gif/cats/image-${String(imgIndex).padStart(3, '0')}.gif')`;
        bgEl.style.opacity = '1';
    }
};

/* ══════════════════════════════════════════════════════════════
   3D TILT EFFECT (Desktop only)
   ══════════════════════════════════════════════════════════════ */
const init3DTiltEffect = () => {
    if (!window.matchMedia('(hover: hover) and (min-width: 1025px)').matches) {
        return;
    }

    const cards = document.querySelectorAll('.menu-card');
    
    cards.forEach(card => {
        let targetX = 0, targetY = 0;
        let currentX = 0, currentY = 0;
        let rafId = null;
        let isAnimating = false;

        const lerp = (start, end, factor) => start + (end - start) * factor;

        const animate = () => {
            if (!isAnimating) return;

            currentX = lerp(currentX, targetX, 0.12);
            currentY = lerp(currentY, targetY, 0.12);

            card.style.transform = `
                perspective(1200px) 
                rotateX(${currentX}deg) 
                rotateY(${currentY}deg) 
                scale(1.05)
            `;

            rafId = requestAnimationFrame(animate);
        };

        card.addEventListener('mouseenter', () => {
            isAnimating = true;
            rafId = requestAnimationFrame(animate);
        });

        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            targetX = -((e.clientY - centerY) / (rect.height / 2)) * 12;
            targetY = ((e.clientX - centerX) / (rect.width / 2)) * 12;
        });

        card.addEventListener('mouseleave', () => {
            isAnimating = false;
            if (rafId) cancelAnimationFrame(rafId);
            
            card.style.transform = '';
            currentX = 0;
            currentY = 0;
            targetX = 0;
            targetY = 0;
        });
    });
};

/* ══════════════════════════════════════════════════════════════
   MOBILE TOUCH OPTIMIZATION
   ══════════════════════════════════════════════════════════════ */
const initMobileTouchEffects = () => {
    // 모바일에서만 실행
    if (window.matchMedia('(hover: none) and (pointer: coarse)').matches) {
        const cards = document.querySelectorAll('.menu-card');
        
        cards.forEach(card => {
            // 터치 시작
            card.addEventListener('touchstart', () => {
                card.style.transform = 'scale(0.96)';
            }, { passive: true });
            
            // 터치 종료
            card.addEventListener('touchend', () => {
                card.style.transform = '';
            }, { passive: true });
            
            // 터치 취소
            card.addEventListener('touchcancel', () => {
                card.style.transform = '';
            }, { passive: true });
        });
        
        // 액션 버튼 터치 피드백
        const actionBtns = document.querySelectorAll('.action-btn');
        actionBtns.forEach(btn => {
            const icon = btn.querySelector('.action-icon');
            
            btn.addEventListener('touchstart', () => {
                if (icon) icon.style.transform = 'scale(0.92)';
            }, { passive: true });
            
            btn.addEventListener('touchend', () => {
                if (icon) icon.style.transform = '';
            }, { passive: true });
        });
    }
};

/* ══════════════════════════════════════════════════════════════
   PREVENT ZOOM ON DOUBLE TAP (iOS)
   ══════════════════════════════════════════════════════════════ */
const preventDoubleTapZoom = () => {
    let lastTouchEnd = 0;
    
    document.addEventListener('touchend', (event) => {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
            event.preventDefault();
        }
        lastTouchEnd = now;
    }, { passive: false });
};

/* ══════════════════════════════════════════════════════════════
   MOBILE VIEWPORT HEIGHT FIX
   ══════════════════════════════════════════════════════════════ */
const setMobileVH = () => {
    const vh = window.innerHeight * 0.01;
    document.documentElement.style.setProperty('--vh', `${vh}px`);
};

// 리사이즈 시 재계산
let resizeTimer;
window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
        setMobileVH();
    }, 100);
});

// 오리엔테이션 변경 감지
window.addEventListener('orientationchange', () => {
    setTimeout(setMobileVH, 100);
});

/* ══════════════════════════════════════════════════════════════
   INITIALIZATION
   ══════════════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
    const userId = sessionStorage.getItem('loggedInUser');
    
    if (!userId) {
        location.href = 'index.html';
        return;
    }

    // Firebase initialization
    if (!firebase.apps.length) {
        firebase.initializeApp(FIREBASE_CONFIG);
    }
    database = firebase.database();

    // Load user profile
    firebase.auth().onAuthStateChanged(() => {
        loadProfileImg(userId);
    });

    // Initialize clock
    updateClock();
    setInterval(updateClock, 1000);

    // Initialize date display
    initDateDisplay();

    // Set dynamic background
    setDynamicBackground();

    // Initialize 3D tilt effect (Desktop)
    init3DTiltEffect();
    
    // ===== 아래 3줄 추가 =====
    // Mobile optimizations
    initMobileTouchEffects();
    preventDoubleTapZoom();
    setMobileVH();
});

// Expose functions to global scope
window.navigateTo = navigateTo;
window.handleLogout = handleLogout;
window.openProfileImagePicker = openProfileImagePicker;
window.closeProfileModal = closeProfileModal;
window.selectImgTemp = selectImgTemp;
window.confirmSaveProfile = confirmSaveProfile;

// Easter Egg Logic
(function() {
    const eeImages = [
        'images/easteregg/image-01.jpg', 'images/easteregg/image-02.jpg',
        'images/easteregg/image-03.jpg', 'images/easteregg/image-04.jpg',
        'images/easteregg/image-05.jpg', 'images/easteregg/image-06.jpg',
        'images/easteregg/image-07.jpg'
    ];

    window.triggerEasterEgg = function(e) {
        if(e) e.stopPropagation(); // 이벤트 전파 방지

        // 1. 화면 흔들기 효과
        document.body.classList.remove('apply-shake');
        void document.body.offsetWidth; // 리플로우 강제 발생
        document.body.classList.add('apply-shake');
        setTimeout(() => document.body.classList.remove('apply-shake'), 500);

        // 2. 이미지 질주 로직
        eeImages.forEach((src, index) => {
            const img = document.createElement('img');
            img.src = src;
            img.className = 'easter-egg-img';
            
            // 판타스틱 효과: 랜덤 사이즈 + 네온 효과
            const randomSize = 500;
            const colors = ['#3b82f6', '#ef4444', '#10b981', '#f59e0b', '#8b5cf6'];
            
            Object.assign(img.style, {
                width: `${randomSize}px`,
                height: `${randomSize}px`,
                filter: `drop-shadow(0 0 20px ${colors[index % colors.length]}) brightness(1.2)`,
            });

            document.body.appendChild(img);

            setTimeout(() => {
                img.style.display = 'block';
                // 아주 빠르게 3바퀴 질주! (가속도 효과 포함)
                const duration = 8.0 + (Math.random() * 2.0); 
               // 2. 가속도 효과를 'linear'(일정하게) 또는 'ease-in-out'(부드럽게)으로 변경
               // 3. 바퀴 수도 너무 많으면 지겨우니 1~2바퀴 정도로 조절 (아래는 2바퀴)
               const rotations = 2;
               img.style.animation = `orbitAround ${duration}s ease-in-out ${rotations} forwards`;                
               // 애니메이션 종료 후 제거
                setTimeout(() => img.remove(), (duration * 1000) + 500);
            }, index * 500); 
        });
    };

    // 확실한 클릭 바인딩을 위한 함수
    function initEasterEgg() {
        const greetingElement = document.querySelector('.greeting');
        if (greetingElement) {
            greetingElement.style.cursor = 'default';
            greetingElement.removeAttribute('title');
            // 기존 이벤트 제거 후 새로 등록 (중복 방지)
            greetingElement.removeEventListener('click', window.triggerEasterEgg);
            greetingElement.addEventListener('click', window.triggerEasterEgg);
            console.log("Easter Egg Ready!"); 
        }
    }

    // 페이지 로드 즉시 및 1초 후 재시도 (동적 생성 대응)
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initEasterEgg);
    } else {
        initEasterEgg();
    }
    setTimeout(initEasterEgg, 1500); // 넉넉하게 한 번 더 실행
})();

</script>
