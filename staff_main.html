function getJakartaDate() {
    const now = new Date();
    const jakartaStr = now.toLocaleString("en-US", { timeZone: "Asia/Jakarta" });
    return new Date(jakartaStr);
}
(function () {
    const user = sessionStorage.getItem('loggedInUser');
    const welcomeMsg = document.getElementById('mainWelcomeMsg');
    if (welcomeMsg) {
        welcomeMsg.innerText = user;
    }
    const db = firebase.database();
    if (user) {
        checkLeaveStatus(user);
autoFillYesterdayLeave(user); 
    }
    let now = getJakartaDate();
    let viewDate = new Date(now);
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    const todayStr = `${y}-${m}-${d}`;
    let standardTime = "";
    let hasCheckedMissing = false;
    const btnIn = document.getElementById('btnIn');
    const timeInput = document.getElementById('manualTime');
    function checkLeaveStatus(uid) {
        const currentYear = new Date().getFullYear();
        db.ref(`leaves/${uid}/${currentYear}`).on('value', (snapshot) => {
            const leaves = snapshot.val();
            if (!leaves) return;
            const leaveArray = Object.values(leaves);
            const alertTarget = leaveArray.find(l => l.status === 'Pending' || l.status === 'Rejected');
            const alertDiv = document.getElementById('leaveStatusAlert');
            const content = document.getElementById('leaveAlertContent');
            const icon = document.getElementById('leaveAlertIcon');
            const title = document.getElementById('leaveAlertTitle');
            const msg = document.getElementById('leaveAlertMsg');
            if (alertTarget) {
                alertDiv.classList.remove('hidden');
                if (alertTarget.status === 'Pending') {
                    content.className = "p-4 rounded-[1.5rem] border border-amber-500/30 bg-amber-500/10 animate-pulse-slow flex items-center justify-between shadow-lg shadow-amber-500/5";
                    icon.innerText = "⏳";
                    title.className = "text-[10px] font-black uppercase italic leading-none text-amber-500";
                    title.innerText = "Leave Request Pending";
                    msg.innerText = `${alertTarget.type} (${alertTarget.startDate}) is awaiting approval.`;
                } else if (alertTarget.status === 'Rejected') {
                    content.className = "p-4 rounded-[1.5rem] border border-rose-500/30 bg-rose-500/10 flex items-center justify-between shadow-lg shadow-rose-500/5";
                    icon.innerText = "🚫";
                    title.className = "text-[10px] font-black uppercase italic leading-none text-rose-500";
                    title.innerText = "Leave Request Rejected";
                    msg.innerText = `${alertTarget.type} was rejected. Check admin memo.`;
                }
            } else {
                alertDiv.classList.add('hidden');
            }
        });
    }
function autoFillYesterdayLeave(uid) {
    const yesterday = getJakartaDate();
    yesterday.setDate(yesterday.getDate() - 1);
    const y = yesterday.getFullYear();
    const m = String(yesterday.getMonth() + 1).padStart(2, '0');
    const d = String(yesterday.getDate()).padStart(2, '0');
    const yestStr = `${y}-${m}-${d}`;
    const dayOfWeek = yesterday.getDay();
    if (dayOfWeek === 0 || dayOfWeek === 6) return;
    db.ref('settings/config/autoLeave').once('value', (configSnap) => {
        const autoLeaveTime = configSnap.val() || "18:00";
        db.ref('attendance/' + yestStr).once('value', (snapshot) => {
            const allData = snapshot.val();
            if (!allData) return;
            const myData = allData[uid];
            if (myData && typeof myData === 'object' && myData.attend && !myData.leave) {
                console.log(`Auto-filling leave for ${yestStr} with config time: ${autoLeaveTime}...`);
                db.ref(`attendance/${yestStr}/${uid}`).update({
                    leave: autoLeaveTime 
                }).then(() => {
                    console.log(`Successfully updated ${yestStr} leave to ${autoLeaveTime} for ${uid}`);
                    if (typeof renderCalendar === 'function') renderCalendar();
                });
            }
        });
    });
}
    function updateLiveTime() {
        if (document.activeElement === timeInput) return;
        const liveNow = getJakartaDate();
        const hh = String(liveNow.getHours()).padStart(2, '0');
        const mm = String(liveNow.getMinutes()).padStart(2, '0');
        const ss = String(liveNow.getSeconds()).padStart(2, '0');
        timeInput.value = `${hh}:${mm}:${ss}`;
    }
    setInterval(updateLiveTime, 1000);
    updateLiveTime();
    timeInput.addEventListener('input', function (e) {
        let v = e.target.value.replace(/[^0-9]/g, '');
        if (v.length >= 5) {
            v = v.substring(0, 2) + ":" + v.substring(2, 4) + ":" + v.substring(4, 6);
        } else if (v.length >= 3) {
            v = v.substring(0, 2) + ":" + v.substring(2, 4);
        }
        e.target.value = v;
    });
    function isValidTime(t) {
        if (!t) return false;
        return /^([01][0-9]|2[0-3]):([0-5][0-9])(:([0-5][0-9]))?$/.test(t);
    }
let config = {

};

        if (stdTimeElem) stdTimeElem.innerText = config.stdAttendance;
        standardTime = config.stdAttendance;
    }
});
let isAILoading = false; 
async function fetchAIComment(type, time, userName) {
    if (!config.LLMAPIkey || isAILoading) {
        return getFallbackMessage(type);
    }
    isAILoading = true;
    const url = "https://api.groq.com/openai/v1/chat/completions";
    const isAttend = type === 'attend';
    let weatherInfo = "sedang bagus"; 
    try {
        const weatherRes = await fetch("https://api.open-meteo.com/v1/forecast?latitude=-6.2088&longitude=106.8456&current_weather=true");
        const weatherData = await weatherRes.json();
        if (weatherData.current_weather) {
            weatherInfo = `${weatherData.current_weather.temperature}°C`;
        }
    } catch (err) {
        console.error("Weather Fetch Error:", err);
    }
    const prompt = isAttend 
        ? `[ATTENDANCE]
           User: ${userName}
           Time: ${time}
           Jakarta Temp: ${weatherInfo}
           Instruction:
           1. Greet the user and mention the temperature.
           2. Add one short Indonesian "Peribahasa" (proverb) about success or hard work.
           3. Add a very short "tebak-tebakan" (joke) related to coffee or work to start the day.
           4. Language: Indonesian Only.`
        : `[LEAVING]
           User: ${userName}
           Time: ${time}
           Instruction:
           1. Thank the user for their hard work.
           2. Add one short Indonesian "Peribahasa" about resting or the value of effort.
           3. Add a short, witty office-related joke for a good laugh.
           4. Language: Indonesian Only.`;
    try {
        const response = await fetch(url, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${config.LLMAPIkey}`
            },
            body: JSON.stringify({
                model: "llama-3.3-70b-versatile",
                messages: [
                    { 
                        role: "system", 
                        content: "You are a professional yet witty office assistant. Respond in Indonesian. Keep the response concise (under 3 sentences)." 
                    },
                    { role: "user", content: prompt }
                ],
                temperature: 0.8, 
                max_tokens: 250
            })
        });
        if (response.status === 429) return getFallbackMessage(type);
        const data = await response.json();
        return data.choices[0].message.content.trim();
    } catch (error) {
        console.error("Groq API Call Error:", error);
        return getFallbackMessage(type);
    } finally {
        setTimeout(() => { isAILoading = false; }, 2000);
    }
}
function getFallbackMessage(type) {
    return type === 'attend' 
        ? "Selamat pagi! Semoga hari Anda menyenangkan! 😊" 
        : "Terima kasih atas kerja keras Anda hari ini! Selamat beristirahat! 👏";
}

            <div class="text-white text-lg font-bold leading-relaxed mb-6">
                "${message}"
            </div>
            <button onclick="this.parentElement.parentElement.remove()" class="close-modal-btn w-full py-3 hover:bg-blue-600 transition-colors">
                OK, NOTED!
            </button>
        </div>
    `;
    document.body.appendChild(overlay);
}

window.handleAttendance = function (type) {
    if (!type || typeof type !== 'string') return;
    const btn = (type === 'attend') ? document.getElementById('btnIn') : document.getElementById('btnOut');
    if (btn.disabled) return;
    const rawTime = timeInput.value;
    if (!isValidTime(rawTime)) {
        alert("Please enter a valid time (HH:mm:ss).");
        return;
    }
    btn.disabled = true;
    btn.style.opacity = "0.5";
    const timeParts = rawTime.split(':');
    const storageTime = `${timeParts[0]}:${timeParts[1]}`;
    db.ref('attendance/' + todayStr + '/' + user).once('value', (snap) => {
        const currentData = snap.val() || {};
        if (type === 'attend' && currentData.attend) {
            alert("Attendance time has already been set.");
            btn.disabled = false; btn.style.opacity = "1";
            return;
        }
        let finalVal = storageTime;
        if (type === 'attend') {
            if (!standardTime) { 
                alert("Standard time is loading..."); 
                btn.disabled = false; btn.style.opacity = "1";
                return; 
            }
            const [iHH, iMM] = storageTime.split(':').map(Number);
            const [sHH, sMM] = standardTime.split(':').map(Number);
            const stdMinutes = sHH * 60 + sMM;
            const inputMinutes = iHH * 60 + iMM;
            finalVal = (inputMinutes <= stdMinutes) ? `ATT(${storageTime})` : `LATE(${storageTime})`;
        }
        if (confirm(`Update ${type.toUpperCase()} to ${finalVal}?`)) {
            db.ref('attendance/' + todayStr + '/' + user).update({ [type]: finalVal })
            .then(async () => {
                if (isAILoading) return; 
                const aiMsg = await fetchAIComment(type, storageTime, user);
                showAIPopup(aiMsg);
            })
            .finally(() => {
                btn.disabled = false;
                btn.style.opacity = "1";
            });
        } else {
            btn.disabled = false;
            btn.style.opacity = "1";
        }
    });
};
function updateAttendanceStats(data) {
    const viewYear = viewDate.getFullYear();
    const viewMonth = viewDate.getMonth() + 1;
    let totalRecords = 0, lateCount = 0, attCount = 0, totalLeaveMinutes = 0, leaveRecordCount = 0;
    Object.keys(data).forEach(dateStr => {
        const [year, month] = dateStr.split('-').map(Number);
        if (year === viewYear && month === viewMonth) {
            const rec = data[dateStr][user];
            if (rec && typeof rec === 'object' && rec.attend) {
                totalRecords++;
                if (rec.attend.includes("LATE")) lateCount++;
                else if (rec.attend.includes("ATT")) attCount++;
                if (rec.leave) {
                    const timeMatch = rec.leave.match(/(\d{2}):(\d{2})/);
                    if (timeMatch) {
                        totalLeaveMinutes += (parseInt(timeMatch[1]) * 60 + parseInt(timeMatch[2]));
                        leaveRecordCount++;
                    }
                }
            }
        }
    });
    const ratio = totalRecords > 0 ? Math.round((lateCount / totalRecords) * 100) : 0;
    const ratioText = document.getElementById('lateRatioPercent');
    const bar = document.getElementById('lateRatioBar');
    const card = document.getElementById('weeklySummaryCard');
    const statusText = document.getElementById('lateRatioStatus');
    const warnIcon = document.getElementById('warningIcon');
    const statCountsElem = document.getElementById('statCounts');
    const avgLeaveElem = document.getElementById('avgLeaveTime');
    if (ratioText) ratioText.innerText = `${ratio}%`;
    if (bar && card && statusText && warnIcon) {
        bar.style.width = `${ratio}%`;
        if (ratio >= 50) {
            bar.className = "h-full bg-rose-500 transition-all duration-1000";
            card.classList.add('warning-pulse');
            statusText.innerText = "Aku terlambat!";
            statusText.className = "text-[10px] font-bold text-rose-500 mb-1 uppercase animate-blink";
            if (ratioText) ratioText.classList.add('animate-blink', 'text-rose-500');
            warnIcon.classList.remove('hidden');
        } else {
            bar.className = "h-full bg-blue-500 transition-all duration-1000";
            card.classList.remove('warning-pulse');
            statusText.innerText = "GOOD STANDING";
            statusText.className = "text-[10px] font-bold text-slate-500 mb-1 uppercase";
            if (ratioText) {
                ratioText.classList.remove('animate-blink', 'text-rose-500');
                ratioText.classList.add('text-white');
            }
            warnIcon.classList.add('hidden');
        }
    }
    if (statCountsElem) statCountsElem.innerText = `T: ${totalRecords} | A: ${attCount} | L: ${lateCount}`;
    if (avgLeaveElem) {
        if (leaveRecordCount > 0) {
            const avgTotal = Math.round(totalLeaveMinutes / leaveRecordCount);
            avgLeaveElem.innerText = `Avg Leave: ${String(Math.floor(avgTotal / 60)).padStart(2, '0')}:${String(avgTotal % 60).padStart(2, '0')}`;
        } else {
            avgLeaveElem.innerText = `Avg Leave: --:--`;
        }
    }
}
db.ref('settings/config/stdAttendance').on('value', (snap) => {
    const val = snap.val();

document.getElementById('liveDate').innerText = now.toLocaleDateString('en-US', {

}).toUpperCase();
window.toggleInputMode = function () {
    const status = document.getElementById('specialStatus').value;

    const btnArea = document.getElementById('buttonArea');
    const specialBtnArea = document.getElementById('specialButtonArea');
    if (status !== "") {

        btnArea.classList.add('hidden');
        specialBtnArea.classList.remove('hidden');

window.handleSpecialStatus = function () {
    const status = document.getElementById('specialStatus').value;

        db.ref('attendance/' + todayStr + '/' + user).set(status)

};
window.goToday = function () { viewDate = getJakartaDate(); renderCalendar(); };
window.changeMonth = function (offset) { viewDate.setMonth(viewDate.getMonth() + offset); renderCalendar(); };
function renderCalendar() {
    const year = viewDate.getFullYear(), month = viewDate.getMonth();
    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();
    const monthYearElem = document.getElementById('currentMonthYear');
    if (monthYearElem) {
        monthYearElem.innerText = viewDate.toLocaleString('en-US', { month: 'long', year: 'numeric' }).toUpperCase();
    }
    db.ref('attendance').off();
    db.ref('attendance').on('value', (snap) => {
        const tbody = document.getElementById('calendarBody');
        if (!tbody) return;
        const data = snap.val() || {};
        updateAttendanceStats(data);
        if (!hasCheckedMissing) {
            checkMissingRecords(data);
            hasCheckedMissing = true;
        }
        tbody.innerHTML = '';
        let dateCounter = 1;
        for (let i = 0; i < 6; i++) {
            let row = document.createElement('tr');
            for (let j = 0; j < 7; j++) {
                let cell = document.createElement('td');
                if (i === 0 && j < firstDay || dateCounter > lastDate) {
                    row.appendChild(cell);
                } else {
                    const dStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(dateCounter).padStart(2, '0')}`;
                    const rec = data[dStr] ? data[dStr][user] : null;
                    if (j === 0) {
                        cell.style.backgroundColor = 'rgba(244, 63, 94, 0.15)'; 
                    } else if (j === 6) {
                        cell.style.backgroundColor = 'rgba(59, 130, 246, 0.15)';
                    }
                    if (dStr === todayStr) cell.classList.add('today-highlight');
                    cell.style.cursor = 'pointer';
                    cell.onclick = () => openEditPopup(dStr, rec);
                    let dateColorClass = "text-slate-500";
                    if (j === 0) dateColorClass = "text-rose-500";
                    else if (j === 6) dateColorClass = "text-blue-500";
                    let content = `<div class="${dateColorClass} text-[9px] font-black opacity-80 ml-1 mt-1">${dateCounter}</div>`;
                    if (rec) {
                        if (typeof rec === 'string') {
                            content += `<span class="time-label other-color mt-2">${rec}</span>`;
                        } else {
                            let attendText = rec.attend || "";
                            let displayAttend = "";
                            if (attendText) {
                                const attMatch = attendText.match(/(\d{1,2}:\d{2})/);
                                const prefix = attendText.includes("LATE") ? "LATE" : "ATT";
                                displayAttend = attMatch ? `${prefix}(${attMatch[1]})` : attendText;
                            }
                            let attendColor = attendText.includes("ATT") ? "att-color" : (attendText.includes("LATE") ? "late-color" : "other-color");
                            if (displayAttend) content += `<span class="time-label ${attendColor}">☀️ ${displayAttend}</span>`;
                            let leaveText = rec.leave || "";
                            let displayLeave = "";
                            if (leaveText) {
                                const leaveMatch = leaveText.match(/(\d{1,2}:\d{2})/);
                                displayLeave = leaveMatch ? leaveMatch[1] : leaveText;
                            }
                            if (displayLeave) content += `<span class="time-label out-time">🌙 ${displayLeave}</span>`;
                        }
                    }
                    cell.innerHTML = content;
                    row.appendChild(cell);
                    dateCounter++;
                }
            }
            tbody.appendChild(row);
            if (dateCounter > lastDate) break;
        }
    });
}
window.openEditPopup = function (dateStr, currentRec) {
    if (document.getElementById('editPopup')) return;
    let attVal = "", leaveVal = "", isAttReadOnly = false, isLeaveInfo = false, leaveTypeText = "";
    const leaveCodes = ["PEL", "ANL", "HAL", "SIL", "SPL", "WO"];
    if (currentRec) {
        if (typeof currentRec === 'string') {
            if (leaveCodes.includes(currentRec)) { isLeaveInfo = true; leaveTypeText = currentRec; }
            attVal = currentRec; isAttReadOnly = true;
        } else {
            if (currentRec.attend) {
                const timeMatch = currentRec.attend.match(/(\d{1,2}:\d{2})/);
                if (timeMatch) {
                    const [hh, mm] = timeMatch[1].split(':');
                    attVal = `${hh.padStart(2, '0')}:${mm}`;
                } else {
                    if (leaveCodes.includes(currentRec.attend)) { isLeaveInfo = true; leaveTypeText = currentRec.attend; }
                    attVal = currentRec.attend;
                }
                isAttReadOnly = true;
            }
            if (currentRec.leave) {
                const leaveMatch = currentRec.leave.match(/(\d{1,2}:\d{2})/);
                if (leaveMatch) {
                    const [hh, mm] = leaveMatch[1].split(':');
                    leaveVal = `${hh.padStart(2, '0')}:${mm}`;
                } else { leaveVal = currentRec.leave; }
            }
        }
    }
    const overlay = document.createElement('div');
    overlay.id = 'editPopup';
    overlay.className = 'edit-modal-overlay animate-fadeIn';
    let footerButtons = isLeaveInfo ? 
        `<button onclick="document.getElementById('editPopup').remove()" class="w-full bg-slate-700 text-white py-4 rounded-xl text-xs font-black uppercase tracking-widest transition active:scale-95">Close (Read Only)</button>` :
        `<button onclick="document.getElementById('editPopup').remove()" class="bg-slate-800 text-slate-400 py-4 rounded-xl text-xs font-black uppercase tracking-widest transition active:scale-95">Cancel</button>
         <button onclick="saveEditRecord('${dateStr}', ${isAttReadOnly})" class="bg-blue-600 text-white py-4 rounded-xl text-xs font-black uppercase tracking-widest transition active:scale-95 shadow-lg shadow-blue-500/20">Save Change</button>`;
    overlay.innerHTML = `
        <div class="edit-modal">
            <div class="mb-4 text-center">
                <p class="text-[10px] font-black ${isLeaveInfo ? 'text-amber-500' : (isAttReadOnly ? 'text-rose-500' : 'text-emerald-500')} uppercase tracking-widest mb-1">
                    ${isLeaveInfo ? '📅 Leave Information' : (isAttReadOnly ? '⚠️ Attendance Locked' : '✍️ Attendance Missing')}
                </p>
                <h3 class="text-white font-black text-lg">${dateStr}</h3>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-[9px] font-black text-slate-500 uppercase mb-1">Attendance / Status</label>
                    ${isLeaveInfo ? `<div class="w-full bg-slate-800 text-amber-500 p-3 rounded-xl border border-amber-500/30 font-black text-xl text-center">${leaveTypeText}</div>` :
                        `<input type="time" id="editAttTime" value="${attVal}" ${isAttReadOnly ? 'readonly' : ''} class="w-full ${isAttReadOnly ? 'bg-slate-800 text-slate-400 border-slate-700' : 'bg-slate-800 text-white border-emerald-500/50'} p-3 rounded-xl border outline-none font-black text-xl">`}
                </div>
                ${!isLeaveInfo ? `<div>
                    <label class="block text-[9px] font-black text-blue-500 uppercase mb-1">Leave Time</label>
                    <div class="flex gap-2">
                        <input type="time" id="editLeaveTime" value="${leaveVal}" class="flex-1 bg-slate-800 text-white p-3 rounded-xl border border-blue-500/50 outline-none font-black text-xl">
                        <button onclick="deleteLeaveTime('${dateStr}')" class="bg-rose-600/20 hover:bg-rose-600 text-rose-500 hover:text-white px-4 rounded-xl border border-rose-600/30 transition-all active:scale-95" title="Delete Leave Time">
                            🗑️
                        </button>
                    </div>
                </div>` : '<p class="text-[10px] text-slate-500 text-center italic">This record is a registered leave and cannot be modified.</p>'}
                <div class="${isLeaveInfo ? '' : 'grid grid-cols-2'} gap-3 mt-6">${footerButtons}</div>
            </div>
        </div>`;
    document.body.appendChild(overlay);
};
window.deleteLeaveTime = function (dateStr) {
    if (!confirm(`${dateStr}의 Leave Time 기록을 삭제하시겠습니까?`)) return;
    const user = sessionStorage.getItem('loggedInUser');
    const db = firebase.database();
    db.ref(`attendance/${dateStr}/${user}/leave`).remove()
        .then(() => {
            alert("Leave time has been deleted.");
            const popup = document.getElementById('editPopup');
            if (popup) popup.remove();
            if (typeof renderCalendar === 'function') renderCalendar();
        })
        .catch((error) => {
            console.error("Delete failed:", error);
            alert("Failed to delete record.");
        });
};
window.saveEditRecord = function (dateStr, isAttReadOnly) {
    const user = sessionStorage.getItem('loggedInUser');
    const newAtt = document.getElementById('editAttTime').value;
    const newLeave = document.getElementById('editLeaveTime').value;
    const updateData = {};
    if (!isAttReadOnly && newAtt) {
        if (typeof standardTime === 'undefined') { alert("Standard time loading..."); return; }
        const [iHH, iMM] = newAtt.split(':').map(Number);
        const [sHH, sMM] = standardTime.split(':').map(Number);
        const stdMinutes = sHH * 60 + sMM;
        const inputMinutes = iHH * 60 + iMM;
        updateData.attend = (inputMinutes <= stdMinutes) ? `ATT(${newAtt})` : `LATE(${newAtt})`;
    }
    if (newLeave) updateData.leave = newLeave;
    if (Object.keys(updateData).length === 0) { alert("No changes to save."); return; }
    if (confirm(`Save changes for ${dateStr}?`)) {
        firebase.database().ref('attendance/' + dateStr + '/' + user).update(updateData)
            .then(() => {
                alert("Record updated successfully.");
                document.getElementById('editPopup').remove();
                if (typeof renderCalendar === 'function') renderCalendar();
            }).catch(err => alert("Error: " + err.message));
    }
};
async function checkMissingRecords() {
    const user = sessionStorage.getItem('loggedInUser');
    if (!user) return;
    const db = firebase.database();
    try {
        const userSnap = await db.ref(`users/${user}/WarnFlag`).once('value');
        const warnFlag = userSnap.val();
        if (warnFlag === "off") {
            console.log(`Report check skipped: ${user}'s WarnFlag is OFF.`);
            return;
        }
        const todayStr = getJakartaDate().toISOString().split('T')[0];
        if (localStorage.getItem('hideReportPopup') === todayStr) {
            console.log("Report popup is hidden for today.");
            return;
        }
        const missingInfo = [];
        const today = getJakartaDate();
        for (let i = 1; i <= 6; i++) {
            const checkDate = new Date(today);
            checkDate.setDate(today.getDate() - i);
            const dayOfWeek = checkDate.getDay(); 
            if (dayOfWeek === 0 || dayOfWeek === 6) continue; 
            const y = checkDate.getFullYear();
            const m = String(checkDate.getMonth() + 1).padStart(2, '0');
            const d = String(checkDate.getDate()).padStart(2, '0');
            const dStr = `${y}-${m}-${d}`;
            const snap = await db.ref(`reports/${dStr}/${user}`).once('value');
            if (!snap.exists()) {
                const dayName = checkDate.toLocaleDateString('en-US', { weekday: 'short' });
                missingInfo.push({ 
                    date: `${dStr} (${dayName})`, 
                    status: "Work Report" 
                });
            }
        }
        if (missingInfo.length > 0) {
            showMissingPopup(missingInfo);
        }
    } catch (err) {
        console.error("Report check / WarnFlag fetch error:", err);
    }
}
function showMissingPopup(missingInfo) {
    if (document.getElementById('missingPopup')) return;
    const overlay = document.createElement('div');
    overlay.id = 'missingPopup';
    overlay.className = 'missing-modal-overlay animate-fadeIn';
    let listHtml = missingInfo.map(info => `
        <div class="bg-slate-800/50 p-3 rounded-xl border border-slate-700/50 mb-2 flex justify-between items-center">
            <div class="text-left">
                <p class="text-[10px] font-black text-slate-500 uppercase tracking-tighter">${info.date}</p>
                <p class="text-rose-400 font-mono text-xs font-black uppercase">Missing: <span class="text-white">${info.status}</span></p>
            </div>
            <div class="w-1.5 h-1.5 rounded-full bg-rose-500 animate-pulse"></div>
        </div>`).join('');
    overlay.innerHTML = `
        <div class="missing-modal text-center">
            <div class="w-16 h-16 bg-rose-500/10 rounded-full flex items-center justify-center mx-auto mb-4 border border-rose-500/20">
                <span class="text-2xl">✍️</span>
            </div>
            <h3 class="text-xl font-black text-white mb-2 uppercase tracking-tight italic">Missing Report</h3>
            <p class="text-slate-400 text-[10px] mb-2 font-bold leading-tight uppercase">Daily Work Report is not submitted:</p>
            <div class="flex items-center gap-2 mb-6">
                <span class="bg-rose-500 text-white text-[9px] px-2 py-0.5 rounded font-black animate-blink shrink-0">REQUIRED</span>
                <span class="text-[10px] text-slate-500 font-bold tracking-tight flex-grow text-left">Please complete your work reports for the dates below</span>
            </div>
            <div class="max-h-[200px] overflow-y-auto no-scrollbar mb-6 px-1">${listHtml}</div>
            <div class="space-y-3">
                <button onclick="document.getElementById('missingPopup').remove()" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-black py-4 rounded-2xl transition-all active:scale-95 shadow-xl shadow-rose-900/20 uppercase tracking-widest text-xs">I will write it now</button>
                <button onclick="hidePopupToday()" class="w-full text-slate-500 hover:text-slate-300 text-[10px] font-bold uppercase tracking-widest transition-colors">Don't show this again today</button>
            </div>
        </div>`;
    document.body.appendChild(overlay);
}
window.hidePopupToday = function() {
    const todayStr = getJakartaDate().toISOString().split('T')[0];
    localStorage.setItem('hideReportPopup', todayStr);
    const popup = document.getElementById('missingPopup');
    if (popup) popup.remove();
    console.log("Popup disabled until tomorrow.");
};

    setTimeout(() => {
        if (typeof showFortune === 'function') showFortune();

if (typeof renderCalendar === 'function') renderCalendar();
