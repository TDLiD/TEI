<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="theme-color" content="#05060d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Daily System</title>

<!-- Fonts (unchanged set — every day theme below reuses these, no extra font requests) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Serif+JP:wght@300;700&family=Cormorant+Garamond:ital,wght@0,300;0,700;1,400&family=DM+Serif+Display&family=Bungee&family=Inter:wght@400;700;800&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script>
    /* ── FINE-GRAINED VIEWPORT CLASS ──────────────────────────────
       Complements the existing is-desktop/is-mobile matchMedia logic
       below (unchanged) with a phone/tablet/desktop-xl split so the
       CSS can trim decorative layers on small or coarse-pointer
       screens without any extra JS polling loop. */
    (function(){
        function applyViewportClass(){
            const w = window.innerWidth;
            let cls = 'vp-desktop';
            if (w < 480) cls = 'vp-phone';
            else if (w < 768) cls = 'vp-phone-lg';
            else if (w < 1024) cls = 'vp-tablet';
            else if (w < 1440) cls = 'vp-desktop';
            else cls = 'vp-desktop-xl';
            document.documentElement.classList.remove('vp-phone','vp-phone-lg','vp-tablet','vp-desktop','vp-desktop-xl');
            document.documentElement.classList.add(cls);
        }
        applyViewportClass();
        window.addEventListener('resize', applyViewportClass, { passive: true });
        window.addEventListener('orientationchange', applyViewportClass, { passive: true });
    })();
</script>

<style>
/* ══════════════════════════════════════════════════════════
   ROOT — every day is dark. Shape, palette AND signature 3D
   scene change per day. Everything animated below is transform
   / opacity only (compositor-only, GPU), so idle CPU stays low
   even with several ambient elements running at once.
══════════════════════════════════════════════════════════ */
:root {
  --card-perspective: 900px;
  --card-hover-lift: -8px;
  --card-hover-scale: 1.03;
  --anim-dur: 0.3s;
  --grid-cols: 2;
  --card-min-h: clamp(108px, 22vw, 150px);
}

*, *::before, *::after {
  margin: 0; padding: 0;
  box-sizing: border-box;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

html, body { width: 100%; height: 100%; overflow: hidden; }

body {
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  background: #05060d;
  transition: background 0.4s ease, color 0.4s ease;
}

/* Hidden SVG clip-path defs (heart shape, objectBoundingBox = fully responsive) */
.svg-defs { position: absolute; width: 0; height: 0; overflow: hidden; }

.content-wrapper {
  position: relative;
  z-index: 10;
  width: 100%;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: clamp(4.25rem, 12vw, 5.5rem) clamp(1rem, 4vw, 1.5rem) clamp(1rem, 3vw, 1.5rem);
  overflow-y: auto;
  scrollbar-width: none;
  gap: clamp(0.7rem, 2.4vw, 1.2rem);
}
.content-wrapper::-webkit-scrollbar { display: none; }

/* Background layer — day gradients + the per-day signature 3D scene.
   CPU-cheap: gradients + a small, fixed number of CSS-animated nodes,
   never JS-driven, never per-frame DOM writes. */
#bg-layer {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}

/* ══════════════════════════════════════════════════════════
   TDLiD WORDMARK — one element, styled purely from the active
   day's CSS variables (--accent / --font-display), so every
   day automatically gets its own huge drifting 3D wordmark
   without any per-day duplication. Transform-only animation.
══════════════════════════════════════════════════════════ */
#wordmark-layer {
  position: fixed;
  inset: 0;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  overflow: hidden;
  perspective: 1400px;
}
.tdlid-wordmark {
  font-family: var(--font-display, 'Orbitron', sans-serif);
  font-weight: 900;
  font-size: clamp(5rem, 34vw, 24rem);
  letter-spacing: -0.03em;
  white-space: nowrap;
  color: transparent;
  background: linear-gradient(180deg, var(--accent, #6366f1) 0%, transparent 78%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-stroke: 1px var(--accent-glow, rgba(99,102,241,0.25));
  opacity: 0.08;
  will-change: transform;
  transform-style: preserve-3d;
  animation: wordmarkDrift 24s ease-in-out infinite;
  user-select: none;
}
@keyframes wordmarkDrift {
  0%   { transform: rotateY(-10deg) rotateX(4deg)  translateZ(0)   scale(1);    }
  50%  { transform: rotateY(10deg)  rotateX(-4deg) translateZ(40px) scale(1.05); }
  100% { transform: rotateY(-10deg) rotateX(4deg)  translateZ(0)   scale(1);    }
}

/* ══════════════════════════════════════════════════════════
   BIG ROAMING CREATURE LAYER
   Two inline SVGs (primary + smaller companion), each an
   original per-day creature design with a colorful multi-stop
   gradient fill and a stacked two-tone glow. All movement comes
   from a single transform keyframe set per day, GPU-composited
   only (translate/rotate/scale) -- zero per-frame JS cost.
══════════════════════════════════════════════════════════ */
.bg-creature {
  position: fixed;
  top: 0; left: 0;
  width: clamp(220px, 34vw, 480px);
  height: auto;
  z-index: 0;
  pointer-events: none;
  opacity: 0.5;
  will-change: transform;
  animation: creatureRoamMon 26s ease-in-out infinite;
}
.bg-creature.second {
  width: clamp(140px, 20vw, 300px);
  opacity: 0.36;
  animation-direction: reverse;
  display: none;
}
/* Tablet and up get the companion creature; phones render only one
   to keep concurrent GPU layers minimal. */
.vp-tablet .bg-creature.second,
.vp-desktop .bg-creature.second,
.vp-desktop-xl .bg-creature.second {
  display: block;
}
.vp-desktop-xl .bg-creature { width: clamp(280px, 30vw, 560px); }
.vp-desktop-xl .bg-creature.second { width: clamp(180px, 18vw, 380px); }
.vp-phone .bg-creature { width: clamp(180px, 46vw, 280px); }

/* Pause every decorative animation while the tab is hidden --
   the single biggest lever for idle CPU/GPU cost. */
body.anim-paused .bg-creature,
body.anim-paused .tdlid-wordmark,
body.anim-paused .sig-cube,
body.anim-paused .sig-ensou-ring,
body.anim-paused .sig-gem,
body.anim-paused .sig-leaf3d,
body.anim-paused .sig-sun-disc,
body.anim-paused .sig-crystal,
body.anim-paused .sig-ember-orb,
body.anim-paused .sig-ember-particle,
body.anim-paused .mon-orb,
body.anim-paused .thu-leaf,
body.anim-paused .fri-stars,
body.anim-paused .live-dot {
  animation-play-state: paused !important;
}

/* Seven full-viewport roaming paths, one per day theme. Ranges use
   vw/vh so the creature genuinely traverses the whole screen. */
@keyframes creatureRoamMon {
  0%   { transform: translate(-6vw, 65vh) rotate(-4deg) scale(1); }
  20%  { transform: translate(55vw, 10vh) rotate(3deg) scale(1.05); }
  40%  { transform: translate(85vw, 55vh) rotate(-2deg) scale(0.96); }
  50%  { transform: translate(85vw, 55vh) rotate(-2deg) scale(0.96) scaleX(-1); }
  70%  { transform: translate(40vw, 78vh) rotate(4deg) scale(1.02) scaleX(-1); }
  90%  { transform: translate(0vw, 30vh) rotate(-3deg) scale(1) scaleX(-1); }
  100% { transform: translate(-6vw, 65vh) rotate(-4deg) scale(1); }
}
@keyframes creatureRoamTue {
  0%, 100% { transform: translate(4vw, 60vh) rotate(0deg) scale(1); }
  25%      { transform: translate(60vw, 20vh) rotate(3deg) scale(1.06); }
  50%      { transform: translate(30vw, 70vh) rotate(-2deg) scale(0.95); }
  75%      { transform: translate(75vw, 45vh) rotate(2deg) scale(1.03); }
}
@keyframes creatureRoamWed {
  0%    { transform: translate(-8vw, 20vh) rotate(-6deg) scale(1); }
  49%   { transform: translate(78vw, 60vh) rotate(4deg) scale(1.04); }
  50%   { transform: translate(78vw, 60vh) rotate(4deg) scale(1.04) scaleX(-1); }
  99%   { transform: translate(-8vw, 20vh) rotate(-6deg) scale(1) scaleX(-1); }
  100%  { transform: translate(-8vw, 20vh) rotate(-6deg) scale(1); }
}
@keyframes creatureRoamThu {
  0%   { transform: translate(0vw, 66vh) rotate(-2deg) scale(1); }
  10%  { transform: translate(12vw, 46vh) rotate(2deg) scale(1.02); }
  20%  { transform: translate(24vw, 66vh) rotate(-2deg) scale(1); }
  30%  { transform: translate(38vw, 40vh) rotate(2deg) scale(1.03); }
  40%  { transform: translate(52vw, 66vh) rotate(-2deg) scale(1); }
  50%  { transform: translate(66vw, 36vh) rotate(2deg) scale(1.04) scaleX(-1); }
  60%  { transform: translate(52vw, 66vh) rotate(-2deg) scale(1) scaleX(-1); }
  70%  { transform: translate(38vw, 40vh) rotate(2deg) scale(1.03) scaleX(-1); }
  80%  { transform: translate(24vw, 66vh) rotate(-2deg) scale(1) scaleX(-1); }
  90%  { transform: translate(12vw, 46vh) rotate(2deg) scale(1.02) scaleX(-1); }
  100% { transform: translate(0vw, 66vh) rotate(-2deg) scale(1); }
}
@keyframes creatureRoamFri {
  0%   { transform: translate(-4vw, 30vh) rotate(-8deg) scale(1); }
  20%  { transform: translate(48vw, 8vh) rotate(10deg) scale(1.08); }
  40%  { transform: translate(20vw, 55vh) rotate(-10deg) scale(0.95); }
  50%  { transform: translate(72vw, 20vh) rotate(8deg) scale(1.06) scaleX(-1); }
  70%  { transform: translate(50vw, 68vh) rotate(-8deg) scale(1) scaleX(-1); }
  90%  { transform: translate(10vw, 42vh) rotate(6deg) scale(1.03) scaleX(-1); }
  100% { transform: translate(-4vw, 30vh) rotate(-8deg) scale(1); }
}
@keyframes creatureRoamSat {
  0%    { transform: translate(-6vw, 50vh) rotate(0deg) scale(1); }
  49%   { transform: translate(88vw, 25vh) rotate(0deg) scale(1.05); }
  50%   { transform: translate(88vw, 25vh) rotate(0deg) scale(1.05) scaleX(-1); }
  99%   { transform: translate(-6vw, 50vh) rotate(0deg) scale(1) scaleX(-1); }
  100%  { transform: translate(-6vw, 50vh) rotate(0deg) scale(1); }
}
@keyframes creatureRoamSun {
  0%   { transform: translate(10vw, 70vh) rotate(-4deg) scale(1); opacity: 0.5; }
  50%  { transform: translate(60vw, 12vh) rotate(4deg) scale(1.12); opacity: 0.65; }
  100% { transform: translate(10vw, 70vh) rotate(-4deg) scale(1); opacity: 0.5; }
}
.day-mon .bg-creature { animation-name: creatureRoamMon; animation-duration: 28s; filter: drop-shadow(0 0 22px rgba(56,189,248,0.6)) drop-shadow(0 0 38px rgba(129,140,248,0.35)); }
.day-tue .bg-creature { animation-name: creatureRoamTue; animation-duration: 32s; filter: drop-shadow(0 0 20px rgba(212,180,131,0.55)) drop-shadow(0 0 34px rgba(160,120,80,0.3)); }
.day-wed .bg-creature { animation-name: creatureRoamWed; animation-duration: 26s; filter: drop-shadow(0 0 20px rgba(200,168,75,0.55)) drop-shadow(0 0 34px rgba(232,212,138,0.3)); }
.day-thu .bg-creature { animation-name: creatureRoamThu; animation-duration: 20s; filter: drop-shadow(0 0 20px rgba(111,191,95,0.55)) drop-shadow(0 0 34px rgba(217,154,91,0.3)); }
.day-fri .bg-creature { animation-name: creatureRoamFri; animation-duration: 16s; filter: drop-shadow(0 0 26px rgba(255,0,204,0.6)) drop-shadow(0 0 42px rgba(0,238,255,0.4)); }
.day-sat .bg-creature { animation-name: creatureRoamSat; animation-duration: 22s; filter: drop-shadow(0 0 22px rgba(125,184,255,0.6)) drop-shadow(0 0 36px rgba(167,202,250,0.35)); }
.day-sun .bg-creature { animation-name: creatureRoamSun; animation-duration: 26s; filter: drop-shadow(0 0 24px rgba(249,115,22,0.6)) drop-shadow(0 0 40px rgba(190,24,93,0.35)); }
.bg-creature.second { animation-duration: calc(var(--dur, 26s) * 1.4); }

/* ══════════════════════════════════════════════════════════
   TOP BAR
══════════════════════════════════════════════════════════ */
.top-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: clamp(0.55rem, 2vw, 0.8rem) clamp(0.875rem, 3vw, 1.25rem);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--topbar-border, rgba(255,255,255,0.08));
  background: var(--topbar-bg, rgba(0,0,0,0.6));
  transition: background 0.4s, border-color 0.4s;
}

.profile-pill { display: flex; align-items: center; gap: 0.55rem; min-width: 0; max-width: 58%; }

.profile-img {
  width: clamp(1.85rem, 7.5vw, 2.35rem);
  height: clamp(1.85rem, 7.5vw, 2.35rem);
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
  border: 2px solid var(--accent, #6366f1);
  box-shadow: 0 0 0 3px var(--accent-glow, rgba(99,102,241,0.2));
  transition: border-color 0.4s, box-shadow 0.4s;
}

.profile-name {
  font-size: clamp(0.68rem, 2.8vw, 0.82rem);
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text-primary, #fff);
  font-family: var(--font-ui, 'Pretendard', sans-serif);
}

.day-chip { display: flex; flex-direction: column; align-items: flex-end; gap: 0; flex-shrink: 0; }
.chip-label {
  font-size: clamp(0.5rem, 1.9vw, 0.62rem);
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent-muted, rgba(99,102,241,0.6));
  font-family: var(--font-display, 'Inter', sans-serif);
  line-height: 1.3;
}
.chip-num {
  font-size: clamp(1.2rem, 4.8vw, 1.65rem);
  font-weight: 900;
  line-height: 1;
  color: var(--accent, #6366f1);
  font-family: var(--font-display, 'Inter', sans-serif);
}

/* ══════════════════════════════════════════════════════════
   HEADER
══════════════════════════════════════════════════════════ */
.header-section { text-align: center; width: 100%; animation: fadeSlideDown 0.5s cubic-bezier(0.22,1,0.36,1) both; }
@keyframes fadeSlideDown { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: translateY(0); } }

.live-time-row {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  font-size: clamp(0.62rem, 2.4vw, 0.72rem);
  font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
  margin-bottom: clamp(0.45rem, 1.8vw, 0.75rem);
  color: var(--accent, #6366f1);
  font-family: var(--font-display, 'Inter', sans-serif);
}
.live-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent, #6366f1);
  box-shadow: 0 0 8px var(--accent, #6366f1);
  animation: livePulse 2.4s ease-in-out infinite;
  flex-shrink: 0;
}
@keyframes livePulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.65); } }

.greeting {
  font-size: clamp(1.55rem, 6.5vw, 2.6rem);
  font-weight: 800; letter-spacing: -0.02em; line-height: 1.1;
  margin-bottom: clamp(0.18rem, 0.8vw, 0.35rem);
  color: var(--text-primary, #fff);
  font-family: var(--font-display, 'Inter', sans-serif);
}
.greeting em {
  font-style: normal;
  background: var(--accent-gradient, linear-gradient(90deg, #6366f1, #a78bfa));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.sub-label {
  font-size: clamp(0.58rem, 2.3vw, 0.68rem);
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--text-muted, rgba(255,255,255,0.38));
  font-family: var(--font-ui, 'Pretendard', sans-serif);
}

/* ══════════════════════════════════════════════════════════
   GRID — device-aware column count via --grid-cols
   (mobile 2 / tablet 3 / desktop 4, no JS layout polling)
══════════════════════════════════════════════════════════ */
.menu-grid {
  display: grid;
  grid-template-columns: repeat(var(--grid-cols), 1fr);
  gap: clamp(0.65rem, 2.4vw, 1rem);
  width: 100%;
  max-width: 480px;
  perspective: var(--card-perspective);
  animation: fadeSlideUp 0.55s 0.06s cubic-bezier(0.22,1,0.36,1) both;
}
body.is-desktop .menu-grid { max-width: 620px; }

@media (min-width: 620px) and (max-width: 1024px) {
  :root { --grid-cols: 3; }
}

.bottom-actions {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: clamp(0.5rem, 2vw, 0.72rem);
  width: 100%;
  max-width: 480px;
  animation: fadeSlideUp 0.55s 0.12s cubic-bezier(0.22,1,0.36,1) both;
}
body.is-desktop .bottom-actions { max-width: 620px; }

@keyframes fadeSlideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

/* ── Card base — shape comes from per-day rules below,
   entrance choreography comes from --card-enter per day ── */
.menu-card, .action-btn {
  position: relative;
  border-radius: var(--card-radius, 14px);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; text-decoration: none; color: inherit;
  overflow: hidden;
  border: 1px solid var(--card-border, rgba(255,255,255,0.12));
  background: var(--card-bg, rgba(255,255,255,0.05));
  box-shadow:
    0 1px 0 0 var(--card-shine, rgba(255,255,255,0.07)) inset,
    0 2px 4px rgba(0,0,0,0.2),
    0 8px 20px var(--card-shadow-far, rgba(0,0,0,0.4));
  transform: translateZ(0);
  will-change: transform;
  transition: transform var(--anim-dur) cubic-bezier(0.34,1.56,0.64,1), box-shadow var(--anim-dur) ease, border-color var(--anim-dur) ease;
}

.menu-card {
  padding: clamp(0.9rem, 3.8vw, 1.4rem) clamp(0.7rem, 2.8vw, 1rem);
  gap: clamp(0.45rem, 1.8vw, 0.7rem);
  min-height: var(--card-min-h);
  animation: var(--card-enter, cardFadeUp) 0.7s cubic-bezier(0.22,1,0.36,1) both;
}
.menu-card:nth-child(1) { animation-delay: 0.05s; }
.menu-card:nth-child(2) { animation-delay: 0.12s; }
.menu-card:nth-child(3) { animation-delay: 0.19s; }
.menu-card:nth-child(4) { animation-delay: 0.26s; }

.action-btn {
  padding: clamp(0.6rem, 2.4vw, 0.85rem) clamp(0.35rem, 1.4vw, 0.5rem);
  gap: clamp(0.3rem, 1.3vw, 0.48rem);
  min-height: clamp(72px, 16vw, 100px);
  font-family: inherit;
}

/* Fallback / fair-default entrance if a day forgets to set --card-enter */
@keyframes cardFadeUp { from { opacity: 0; transform: translateY(18px) translateZ(0); } to { opacity: 1; transform: translateY(0) translateZ(0); } }

/* Per-day signature entrance choreography — CSS keyframes only,
   run once on load, GPU compositor, no continuous JS cost */
@keyframes cardFlipIn {      /* Mon — circuit boot-up */
  from { opacity: 0; transform: perspective(700px) rotateY(-95deg) translateZ(0); }
  to   { opacity: 1; transform: perspective(700px) rotateY(0deg) translateZ(0); }
}
@keyframes cardInkIn {       /* Tue — ink bleeding onto paper */
  from { opacity: 0; transform: scale(0.85) translateZ(0); filter: blur(6px); }
  to   { opacity: 1; transform: scale(1) translateZ(0); filter: blur(0); }
}
@keyframes cardVaultOpen {   /* Wed — vault door swinging open */
  from { opacity: 0; transform: perspective(800px) rotateY(-70deg) translateX(-10%) translateZ(0); }
  to   { opacity: 1; transform: perspective(800px) rotateY(0deg) translateX(0) translateZ(0); }
}
@keyframes cardUnfurl {      /* Thu — a leaf unfurling */
  from { opacity: 0; transform: scale(0.55) rotate(-18deg) translateZ(0); }
  to   { opacity: 1; transform: scale(1) rotate(0deg) translateZ(0); }
}
@keyframes cardGlitchIn {    /* Fri — arcade CRT power-on glitch */
  0%   { opacity: 0; transform: translateX(-14px) skewX(8deg) translateZ(0); }
  30%  { opacity: 0.5; transform: translateX(10px) skewX(-6deg) translateZ(0); }
  55%  { opacity: 0.7; transform: translateX(-6px) skewX(3deg) translateZ(0); }
  100% { opacity: 1; transform: translateX(0) skewX(0deg) translateZ(0); }
}
@keyframes cardFrostIn {     /* Sat — frost crystallizing into shape */
  from { opacity: 0; transform: scale(1.18) translateZ(0); filter: blur(8px) brightness(1.4); }
  to   { opacity: 1; transform: scale(1) translateZ(0); filter: blur(0) brightness(1); }
}
@keyframes cardEmberRise {   /* Sun — an ember rising and cooling into place */
  from { opacity: 0; transform: translateY(34px) translateZ(0); filter: brightness(1.6) saturate(1.4); }
  to   { opacity: 1; transform: translateY(0) translateZ(0); filter: brightness(1) saturate(1); }
}

@media (hover: hover) {
  .menu-card:hover {
    transform: translateY(var(--card-hover-lift)) scale(var(--card-hover-scale)) translateZ(0);
    border-color: var(--accent, #6366f1);
    box-shadow:
      0 1px 0 0 var(--card-shine, rgba(255,255,255,0.12)) inset,
      0 14px 32px rgba(0,0,0,0.4),
      0 0 0 1px var(--accent-glow, rgba(99,102,241,0.2)),
      0 0 26px var(--accent-glow, rgba(99,102,241,0.14));
  }
  .action-btn:hover {
    transform: translateY(-4px) scale(1.04) translateZ(0);
    border-color: var(--accent, #6366f1);
    box-shadow: 0 1px 0 0 var(--card-shine, rgba(255,255,255,0.1)) inset, 0 8px 20px rgba(0,0,0,0.3), 0 0 0 1px var(--accent-glow, rgba(99,102,241,0.2));
  }
}
.menu-card:active { transform: scale(0.96) translateZ(0) !important; }
.action-btn:active { transform: scale(0.94) translateZ(0) !important; }

.menu-card::before, .action-btn::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: var(--card-bevel, linear-gradient(90deg, transparent, rgba(255,255,255,0.16), transparent));
  pointer-events: none;
}
.menu-card::after {
  content: '';
  position: absolute; inset: 0;
  background: var(--card-face, linear-gradient(155deg, rgba(255,255,255,0.04) 0%, transparent 55%));
  pointer-events: none;
  border-radius: inherit;
}

.card-icon-wrap {
  width: clamp(2.35rem, 8.5vw, 3.1rem);
  height: clamp(2.35rem, 8.5vw, 3.1rem);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.35));
  transition: transform 0.3s ease, filter 0.3s ease;
}
.card-icon-wrap img { width: 100%; height: 100%; object-fit: contain; display: block; }
.action-icon {
  font-size: clamp(1.4rem, 5.5vw, 1.9rem);
  line-height: 1; display: block;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));
  transition: transform 0.3s ease;
}
@media (hover: hover) {
  .menu-card:hover .card-icon-wrap { transform: translateY(-2px) scale(1.08); }
  .action-btn:hover .action-icon { transform: scale(1.14) translateY(-1px); }
}

.card-label, .action-label {
  font-size: clamp(0.58rem, 2.3vw, 0.7rem);
  font-weight: 800; letter-spacing: 0.09em; text-transform: uppercase;
  text-align: center; line-height: 1.2;
  color: var(--card-label, rgba(255,255,255,0.6));
  font-family: var(--font-ui, 'Pretendard', sans-serif);
  transition: color 0.25s ease;
}
@media (hover: hover) {
  .menu-card:hover .card-label, .action-btn:hover .action-label { color: var(--accent, #6366f1); }
}

/* ══════════════════════════════════════════════════════════
   SHAPE SYSTEM — applied per day via body.shape-* classes
   square / circle / oval / heart — content re-centered so
   clipping never eats the icon or label.
══════════════════════════════════════════════════════════ */

/* SQUARE — sharp, minor radius only */
.shape-square .menu-card { border-radius: var(--card-radius, 10px); }

/* CIRCLE — force 1:1 box then round fully */
.shape-circle .menu-card {
  aspect-ratio: 1 / 1;
  min-height: 0;
  border-radius: 50%;
  padding: clamp(0.8rem, 6vw, 1.6rem);
}
.shape-circle .menu-grid { align-items: start; }

/* OVAL — rectangular box, fully rounded -> natural ellipse */
.shape-oval .menu-card { border-radius: 50%; }

/* HEART — SVG clip-path (objectBoundingBox = scales with element) */
.shape-heart .menu-card {
  aspect-ratio: 1 / 1;
  min-height: 0;
  clip-path: url(#heartClip);
  border-radius: 0;
  padding: clamp(0.9rem, 6vw, 1.7rem) clamp(0.8rem, 5vw, 1.5rem) clamp(1.5rem, 8vw, 2.2rem);
  justify-content: flex-start;
  padding-top: clamp(1.6rem, 9vw, 2.6rem);
}
.shape-heart .menu-grid { align-items: start; }

/* ══════════════════════════════════════════════════════════
   POPUP MODAL (unchanged behaviour, dark styling)
══════════════════════════════════════════════════════════ */
.popup-overlay {
  position: fixed; inset: 0;
  background: rgba(3,4,10,0.94);
  backdrop-filter: blur(10px);
  z-index: 9999;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  animation: fadeIn 0.3s ease-out;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.popup-container {
  position: relative;
  background: linear-gradient(135deg, #12141f 0%, #1a1d2e 100%);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 16px;
  max-width: 90vw; max-height: 85vh;
  overflow: hidden;
  box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  animation: popIn 0.36s cubic-bezier(0.22,1,0.36,1);
}
@keyframes popIn { from { opacity:0; transform:scale(0.9) translateY(10px);} to {opacity:1;transform:scale(1) translateY(0);} }

.popup-close-top {
  position: absolute; top: 14px; right: 14px;
  width: 34px; height: 34px;
  background: #ec4899; border: none; border-radius: 6px;
  color: white; font-size: 17px; cursor: pointer; z-index: 10;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.3s ease, background 0.2s;
  box-shadow: 0 4px 12px rgba(236,72,153,0.35);
}
.popup-close-top:hover { transform: rotate(90deg) scale(1.1); background: #e91e63; }

.popup-content {
  padding: 28px 20px;
  display: flex; flex-direction: column; align-items: center; gap: 18px;
  max-height: calc(85vh - 80px);
  overflow-y: auto;
}
.popup-image { max-width: 100%; max-height: 48vh; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.35); object-fit: contain; }
.popup-message {
  font-size: clamp(1.05rem, 3vw, 1.4rem); font-weight: 700; text-align: center;
  background: linear-gradient(135deg, #10b981, #3b82f6, #8b5cf6);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  padding: 8px 18px;
  animation: livePulse 2s ease-in-out infinite;
}
.popup-close-bottom {
  display: block; width: calc(100% - 40px); margin: 0 20px 18px; padding: 13px 20px;
  background: linear-gradient(135deg, #6366f1 0%, #818cf8 100%);
  border: none; border-radius: 8px; color: white;
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;
  cursor: pointer;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
  box-shadow: 0 4px 14px rgba(99,102,241,0.35);
}
.popup-close-bottom:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(99,102,241,0.45); }

/* ══════════════════════════════════════════════════════════
   SIGNATURE 3D SCENES — one small preserve-3d rig per day,
   built from 1–6 lightweight divs. Purely decorative, sits in
   #bg-layer behind the content, pointer-events:none, and is a
   single CSS animation each — no JS, no layout thrash.
══════════════════════════════════════════════════════════ */
.sig-scene { position: absolute; pointer-events: none; }

/* Mon — spinning wireframe cube (Void Circuit) */
.sig-cube-scene { top: 8%; right: 6%; width: 120px; height: 120px; perspective: 600px; opacity: 0.4; }
.sig-cube { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; animation: cubeSpin 15s linear infinite; }
.sig-cube-face { position: absolute; width: 120px; height: 120px; border: 1px solid var(--accent); background: linear-gradient(135deg, var(--accent-glow), transparent); }
.sig-cube-face.f1 { transform: translateZ(60px); }
.sig-cube-face.f2 { transform: rotateY(180deg) translateZ(60px); }
.sig-cube-face.f3 { transform: rotateY(90deg) translateZ(60px); }
.sig-cube-face.f4 { transform: rotateY(-90deg) translateZ(60px); }
.sig-cube-face.f5 { transform: rotateX(90deg) translateZ(60px); }
.sig-cube-face.f6 { transform: rotateX(-90deg) translateZ(60px); }
@keyframes cubeSpin { from { transform: rotateX(-18deg) rotateY(0deg); } to { transform: rotateX(-18deg) rotateY(360deg); } }

/* Tue — tumbling ensou ring (Sumi-e Night) */
.sig-ensou-scene { top: 10%; right: 7%; width: 190px; height: 190px; perspective: 500px; opacity: 0.45; }
.sig-ensou-ring { width: 100%; height: 100%; border-radius: 50%; border: 3px solid var(--accent); border-right-color: transparent; border-bottom-color: transparent; transform-style: preserve-3d; animation: ensouTumble 18s ease-in-out infinite; }
@keyframes ensouTumble { 0%, 100% { transform: rotateX(55deg) rotateZ(0deg); } 50% { transform: rotateX(55deg) rotateZ(180deg); } }

/* Wed — spinning faceted gem (Obsidian Vault) */
.sig-gem-scene { top: 9%; right: 7%; width: 108px; height: 138px; perspective: 600px; opacity: 0.42; }
.sig-gem { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; animation: gemSpin 17s linear infinite; }
.sig-gem-facet { position: absolute; inset: 0; background: linear-gradient(135deg, var(--accent-glow), transparent 60%); clip-path: polygon(50% 0%, 100% 35%, 80% 100%, 20% 100%, 0% 35%); border: 1px solid var(--accent); }
.sig-gem-facet.f2 { transform: rotateY(60deg); }
.sig-gem-facet.f3 { transform: rotateY(-60deg); }
@keyframes gemSpin { from { transform: rotateY(0deg) rotateX(8deg); } to { transform: rotateY(360deg) rotateX(8deg); } }

/* Thu — a leaf breathing in 3D (Night Terra) */
.sig-leaf3d-scene { top: 6%; right: 5%; width: 150px; height: 150px; perspective: 500px; opacity: 0.45; }
.sig-leaf3d { width: 100%; height: 100%; border: 1px solid var(--accent); border-radius: 0 80% 0 80%; background: linear-gradient(135deg, var(--accent-glow), transparent); transform-style: preserve-3d; animation: leafFloat3d 10s ease-in-out infinite; }
@keyframes leafFloat3d { 0%, 100% { transform: rotateY(-15deg) rotateX(10deg) translateY(0); } 50% { transform: rotateY(15deg) rotateX(-6deg) translateY(-14px); } }

/* Fri — retro perspective sun disc (Synthwave Arcade) */
.sig-sun-scene { bottom: 20%; left: 50%; transform: translateX(-50%); width: 220px; height: 110px; overflow: hidden; opacity: 0.55; perspective: 400px; }
.sig-sun-disc { width: 220px; height: 220px; border-radius: 50%; background: linear-gradient(0deg, var(--accent) 0%, transparent 70%); position: relative; animation: sunPulseTilt 6s ease-in-out infinite; }
.sig-sun-disc::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, transparent 0 8px, #04010d 8px 12px); border-radius: 50%; }
@keyframes sunPulseTilt { 0%, 100% { transform: rotateX(55deg) scale(1); filter: brightness(1); } 50% { transform: rotateX(55deg) scale(1.05); filter: brightness(1.3); } }

/* Sat — spinning ice crystal (Glacial Void) */
.sig-crystal-scene { top: 10%; right: 6%; width: 128px; height: 128px; perspective: 600px; opacity: 0.4; }
.sig-crystal { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; animation: crystalSpin 20s linear infinite; }
.sig-crystal-face { position: absolute; inset: 0; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); border: 1px solid var(--accent); background: linear-gradient(160deg, rgba(255,255,255,0.14), transparent); }
.sig-crystal-face.f2 { transform: rotateY(90deg); }
@keyframes crystalSpin { from { transform: rotateY(0) rotateX(10deg); } to { transform: rotateY(360deg) rotateX(10deg); } }

/* Sun — pulsing ember sphere with rising embers (Ember Night) */
.sig-ember-scene { top: 8%; right: 6%; width: 128px; height: 128px; perspective: 500px; opacity: 0.55; }
.sig-ember-orb { width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fbbf24, #f97316 55%, #7c1d0e 100%); box-shadow: 0 0 40px var(--accent-glow); animation: emberPulse 5s ease-in-out infinite; }
@keyframes emberPulse { 0%, 100% { transform: rotateY(0deg) scale(1); filter: brightness(1); } 50% { transform: rotateY(180deg) scale(1.06); filter: brightness(1.25); } }
.sig-ember-particle { position: absolute; bottom: 0; width: 4px; height: 4px; border-radius: 50%; background: #fbbf24; animation: emberRise 4s ease-in infinite; }
@keyframes emberRise { 0% { transform: translateY(0) scale(1); opacity: 0.8; } 100% { transform: translateY(-160px) scale(0.3); opacity: 0; } }

   polling: a single matchMedia listener updates the class only
   if the device class truly changes (crossing the breakpoint).
══════════════════════════════════════════════════════════ */
const _dvMQ = window.matchMedia('(hover:hover) and (pointer:fine) and (min-width:1025px)');
function applyDeviceClass(isDesktop) {
  document.body.classList.toggle('is-desktop', isDesktop);
  document.body.classList.toggle('is-mobile', !isDesktop);
}
applyDeviceClass(_dvMQ.matches);
_dvMQ.addEventListener('change', (e) => applyDeviceClass(e.matches));

/* ══════════════════════════════════════════════════════════

   (day-*), shape class (shape-*), and a signature 3D scene
   markup fragment. Backgrounds stay cheap: gradients + a small
   fixed set of CSS-animated nodes, no JS animation loops, no
   per-frame DOM writes.
══════════════════════════════════════════════════════════ */
const DAY_CONFIG = {
  0: {
    cls: 'day-sun', shape: 'shape-oval',
    sub: 'Rest, reflect & recharge ☀️', chipLabel: '☀ Sunday',
    buildBg(el) {
      const rays = Array.from({length: 10}, (_, i) => {
        const deg = i * 36;
        return `<div class="sun-ray" style="transform:rotate(${deg}deg) translateX(-50%);opacity:${0.5 + (i%3)*0.25};"></div>`;
      }).join('');
      const particles = Array.from({length: 3}, (_, i) =>
        `<div class="sig-ember-particle" style="left:${20 + i*35}%;animation-delay:${i * 1.3}s;"></div>`
      ).join('');
      el.innerHTML = `<div class="sun-bg"></div>${rays}
        <div class="sig-scene sig-ember-scene">
          <div class="sig-ember-orb"></div>
          ${particles}
        </div>`;
    }
  },
  1: {
    cls: 'day-mon', shape: 'shape-square',
    sub: 'New week. New energy. ⚡', chipLabel: '⚡ Monday',
    buildBg(el) {
      el.innerHTML = `<div class="mon-bg"></div><div class="mon-grid"></div><div class="mon-orb o1"></div><div class="mon-orb o2"></div>

            <div class="sig-cube-face f5"></div><div class="sig-cube-face f6"></div>

        </div>`;
    }
  },
  2: {
    cls: 'day-tue', shape: 'shape-circle',
    sub: 'Breathe. Focus. Begin.', chipLabel: '◎ Tuesday',
    buildBg(el) {

        <div class="sig-scene sig-ensou-scene"><div class="sig-ensou-ring"></div></div>`;

    cls: 'day-wed', shape: 'shape-oval',

/* ══════════════════════════════════════════════════════════
   PROFILE — single .on() listener, reused DOM nodes
══════════════════════════════════════════════════════════ */
let _profileRef = null;

function loadProfile(userId) {
  if (!userId || !database) return;
  _profileRef = database.ref('users/' + userId);
  _profileRef.on('value', (snap) => {
    const container = document.getElementById('profileContainer');
    if (!container) return;

    const ud = snap.val() || {};
    const displayName = ud.displayName || userId;

    const ge = document.getElementById('userGreeting');
    if (ge) ge.textContent = displayName;

    let img = container.querySelector('.profile-img');
    if (!img) {
      img = document.createElement('img');
      img.className = 'profile-img';
      img.alt = 'Profile';
      container.appendChild(img);
    }
    img.src = ud.profileImg ? `images/profile/${ud.profileImg}` : 'images/default-profile.png';
    img.onerror = () => { img.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(displayName)}&background=6366f1&color=fff`; };

    let nm = container.querySelector('.profile-name');
    if (!nm) {
      nm = document.createElement('div');
      nm.className = 'profile-name';
      container.appendChild(nm);
    }
    nm.textContent = displayName;
  });
}

/* ══════════════════════════════════════════════════════════
   CLOCK — single setInterval, cached element reference
══════════════════════════════════════════════════════════ */
let _clockEl = null;
let _clockTimer = null;
function updateClock() {
  if (!_clockEl) _clockEl = document.getElementById('liveTime');

  const n = new Date();
  const labelEl = document.getElementById('dayChipLabel');
  const numEl   = document.getElementById('dayNumber');
  if (labelEl) labelEl.textContent = cfg.chipLabel;
  if (numEl) numEl.textContent = String(n.getDate()).padStart(2, '0');

/* ══════════════════════════════════════════════════════════
   POPUP
══════════════════════════════════════════════════════════ */
let _popupTimer = null;
function closePopup() {
  const el = document.getElementById('popup_overlay');
  if (el) el.style.display = 'none';
  if (_popupTimer) { clearTimeout(_popupTimer); _popupTimer = null; }
}
function checkPopup() {
  if (!database) return;
  database.ref('settings/config/Popup').once('value', (snap) => {
    const p = snap.val();
    if (!p || p.Flag !== 'ON') return;
    const todayStr = new Date().toISOString().slice(0,10).replace(/-/g,'');
    if (todayStr < (p.Start || '00000000') || todayStr > (p.End || '99999999')) return;

    const overlay = document.getElementById('popup_overlay');
    const imgEl   = document.getElementById('popup_img');
    const txtEl   = document.getElementById('popup_text');
    if (!overlay) return;

    if (p.Image) { imgEl.src = p.Image; imgEl.style.display = 'block'; imgEl.onerror = () => { imgEl.style.display = 'none'; }; }
    else imgEl.style.display = 'none';

    if (p.Msg) { txtEl.textContent = p.Msg; txtEl.style.display = 'block'; }
    else txtEl.style.display = 'none';

    overlay.style.display = 'flex';
    _popupTimer = setTimeout(closePopup, 5000);
  });
}

/* ══════════════════════════════════════════════════════════
   3D POINTER TILT — desktop + hover only, event-driven RAF
   (loop only runs while the pointer is actually over a card,
   never a background timer)
══════════════════════════════════════════════════════════ */
function init3DTilt() {
  if (!document.body.classList.contains('is-desktop')) return;
  const lerp = (a, b, t) => a + (b - a) * t;

  document.querySelectorAll('.menu-card').forEach(card => {
    let tx = 0, ty = 0, cx = 0, cy = 0;
    let raf = null, active = false;

    const tick = () => {
      if (!active) return;
      cx = lerp(cx, tx, 0.12);
      cy = lerp(cy, ty, 0.12);
      card.style.transform = `perspective(900px) rotateX(${cx}deg) rotateY(${cy}deg) translateY(-6px) scale(1.03) translateZ(0)`;
      raf = requestAnimationFrame(tick);
    };

    card.addEventListener('mouseenter', () => { active = true; raf = requestAnimationFrame(tick); }, { passive: true });
    card.addEventListener('mousemove', (e) => {
      const r = card.getBoundingClientRect();
      tx = -((e.clientY - r.top  - r.height / 2) / (r.height / 2)) * 8;
      ty =  ((e.clientX - r.left - r.width  / 2) / (r.width  / 2)) * 8;
    }, { passive: true });
    card.addEventListener('mouseleave', () => {
      active = false;
      if (raf) cancelAnimationFrame(raf);
      card.style.transform = '';
      cx = cy = tx = ty = 0;
    }, { passive: true });
  });
}

/* ══════════════════════════════════════════════════════════
   KEYBOARD NAVIGATION
══════════════════════════════════════════════════════════ */
function initKeyboard() {
  document.querySelectorAll('.menu-card[role="button"]').forEach(card => {
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); card.click(); }
    });
  });
}

/* ══════════════════════════════════════════════════════════
   CLEANUP — mirrors the established _leavePageCleanup pattern
══════════════════════════════════════════════════════════ */
window._leavePageCleanup = function () {
  if (_clockTimer) { clearInterval(_clockTimer); _clockTimer = null; }
  if (_popupTimer) { clearTimeout(_popupTimer); _popupTimer = null; }
  if (_profileRef) { _profileRef.off(); _profileRef = null; }
};
window.addEventListener('beforeunload', window._leavePageCleanup);
window.addEventListener('pagehide', window._leavePageCleanup);

/* ══════════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
  const userId = sessionStorage.getItem('loggedInUser');
  if (!userId) { location.href = 'index.html'; return; }

  const bgEl = document.getElementById('bg-layer');
  if (bgEl && cfg.buildBg) cfg.buildBg(bgEl);

  const subEl = document.getElementById('pageSub');
  if (subEl) subEl.textContent = cfg.sub;

  if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  database = firebase.database();
  firebase.auth().onAuthStateChanged(() => loadProfile(userId));

  updateClock();
  _clockTimer = setInterval(updateClock, 1000);

  initDate();
  init3DTilt();
  initKeyboard();

  setTimeout(checkPopup, 1200);
});
