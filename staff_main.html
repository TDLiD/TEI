<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menu Select - Daily System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<style>
:root {--bg:#03060f;--surface:rgba(8,18,36,0.7);--surface-2:rgba(16,32,60,0.5);--blue:#3b82f6;--blue-glow:rgba(59,130,246,0.25);--cyan:#06b6d4;--violet:#818cf8;--rose:#f43f5e;--gold:#f59e0b;--chrome:#e2e8f0;--text:#cbd5e1;--muted:#475569;--border:rgba(255,255,255,0.07);--border-2:rgba(255,255,255,0.14);}
*,*::before,*::after {box-sizing:border-box;margin:0;padding:0;}
html,body {width:100%;height:100%;overflow:hidden;}
body {font-family:"Pretendard",system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased;perspective:2000px;position:relative;}

#dynamicBg {position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;background-repeat:no-repeat;transition:opacity 0.8s ease;}
#dynamicBg::after {content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(59,130,246,0.12) 0%,transparent 60%),radial-gradient(ellipse 50% 60% at 10% 80%,rgba(129,140,248,0.08) 0%,transparent 55%),linear-gradient(180deg,rgba(3,6,15,0.55) 0%,rgba(3,6,15,0.75) 100%);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);}
body::before {content:'';position:fixed;inset:0;z-index:1;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");opacity:0.025;pointer-events:none;}
.orb {position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none;z-index:1;animation:orb-float 25s ease-in-out infinite alternate;will-change:transform;}
.orb-a {width:600px;height:600px;background:rgba(59,130,246,0.08);top:-20%;right:-15%;}
.orb-b {width:500px;height:500px;background:rgba(129,140,248,0.08);bottom:-15%;left:-12%;animation-delay:-8s;}
.orb-c {width:400px;height:400px;background:rgba(6,182,212,0.06);top:50%;right:20%;animation-delay:-14s;}
@keyframes orb-float {0%{transform:translate(0,0) scale(1);opacity:0.6;}50%{transform:translate(30px,50px) scale(1.1);opacity:0.8;}100%{transform:translate(20px,40px) scale(1.08);opacity:0.6;}}

.content-wrapper {
    position:relative;z-index:2;width:100%;height:100vh;
    overflow-y:auto;overflow-x:hidden;
    display:flex;flex-direction:column;align-items:center;
    justify-content:flex-start;
    padding:1.5rem 1rem 4rem;
    -ms-overflow-style:none;scrollbar-width:none;gap:0;
}
.content-wrapper::-webkit-scrollbar {display:none;}

/* 메뉴 카드 4개 영역: 화면 중앙에 보이도록 최소 높이 확보 */
.main-section {
    display:flex;flex-direction:column;align-items:center;
    justify-content:center;
    width:100%;
    min-height:calc(100vh - 3rem); /* 헤더 패딩 제외한 뷰포트 높이 */
    padding-bottom:1rem;
}

@media (max-width:768px) {
    .content-wrapper {padding:1rem 0.75rem 4rem;}
    .main-section {min-height:auto;justify-content:flex-start;padding-top:1rem;}
    .menu-grid {margin-bottom:1rem;}
    .header-section {margin-bottom:1rem;}
}

.header-section {text-align:center;margin-bottom:clamp(1.5rem,4vh,3.5rem);animation:reveal-down 0.8s cubic-bezier(0.16,1,0.3,1) both;transform-style:preserve-3d;}
.live-time {font-size:clamp(9px,2vw,10.5px);letter-spacing:0.35em;text-transform:uppercase;color:var(--cyan);margin-bottom:clamp(12px,3vw,16px);display:flex;align-items:center;justify-content:center;gap:8px;opacity:0.8;transform:translateZ(20px);}
.live-dot {width:5px;height:5px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan),0 0 20px rgba(6,182,212,0.5);animation:pulse 2s ease-in-out infinite;}
@keyframes pulse {0%,100%{opacity:1;transform:scale(1);box-shadow:0 0 10px var(--cyan),0 0 20px rgba(6,182,212,0.5);}50%{opacity:0.4;transform:scale(0.6);box-shadow:0 0 5px var(--cyan);}}
.greeting {font-size:clamp(1.75rem,5vw,3.8rem);font-weight:900;letter-spacing:-0.03em;line-height:1.1;color:#fff;text-shadow:0 0 60px rgba(59,130,246,0.4),0 10px 30px rgba(0,0,0,0.5);margin-bottom:clamp(8px,2vw,10px);transform:translateZ(40px);}
.greeting span {background:linear-gradient(135deg,var(--blue) 0%,var(--cyan) 50%,var(--violet) 100%);background-size:200% 200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:gradient-shift 4s ease infinite;}
@keyframes gradient-shift {0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
.sub-label {font-size:clamp(9px,2vw,10.5px);letter-spacing:0.35em;text-transform:uppercase;color:var(--muted);font-weight:700;transform:translateZ(30px);}
.menu-grid {display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(12px,2.5vw,20px);width:100%;max-width:800px;margin-bottom:clamp(1.5rem,4vh,2.5rem);perspective:2000px;transform-style:preserve-3d;}
@media (max-width:640px) {.menu-grid {grid-template-columns:repeat(2,1fr);max-width:100%;gap:clamp(10px,3vw,14px);padding:0 0.5rem;}}
@media (min-width:641px) and (max-width:1024px) {.menu-grid {grid-template-columns:repeat(2,1fr);max-width:500px;}}
.menu-card {position:relative;background:linear-gradient(135deg,rgba(16,32,60,0.9) 0%,rgba(8,18,36,0.8) 100%);border:1.5px solid var(--border);border-radius:clamp(18px,4vw,24px);padding:clamp(16px,4vw,28px) clamp(10px,3vw,20px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,3vw,14px);cursor:pointer;overflow:hidden;transform-style:preserve-3d;transform:translateZ(0);transition:all 0.5s cubic-bezier(0.16,1,0.3,1);animation:card-in 0.7s cubic-bezier(0.16,1,0.3,1) both;touch-action:manipulation;-webkit-tap-highlight-color:transparent;box-shadow:0 1px 2px rgba(255,255,255,0.1),0 15px 30px rgba(0,0,0,0.4),0 5px 15px rgba(0,0,0,0.3),inset 0 1px 1px rgba(255,255,255,0.15),inset 0 -1px 1px rgba(0,0,0,0.25);will-change:transform,box-shadow;}
@media (hover:hover) {.menu-card:hover {transform:translateY(-15px) translateZ(60px) scale(1.05) rotateX(8deg);border-color:rgba(59,130,246,0.6);background:linear-gradient(135deg,rgba(59,130,246,0.25) 0%,rgba(6,182,212,0.2) 100%);box-shadow:0 2px 4px rgba(255,255,255,0.2),0 30px 60px rgba(0,0,0,0.7),0 15px 35px rgba(59,130,246,0.4),0 0 40px rgba(59,130,246,0.3),inset 0 1px 2px rgba(255,255,255,0.3),inset 0 -1px 2px rgba(0,0,0,0.3);}
.menu-card:hover .card-label {color:#fff;text-shadow:0 0 15px rgba(59,130,246,0.7),0 2px 8px rgba(0,0,0,0.8);transform:translateZ(20px);}
.menu-card:hover .card-icon-wrap {transform:translateZ(40px) scale(1.15) rotateY(8deg);filter:drop-shadow(0 15px 30px rgba(0,0,0,0.6)) drop-shadow(0 0 25px rgba(59,130,246,0.5));}
.menu-card:hover .card-glow {opacity:1;}}
.menu-card:active {transform:scale(0.95) translateY(4px) translateZ(-10px);box-shadow:0 5px 15px rgba(0,0,0,0.5),inset 0 1px 2px rgba(255,255,255,0.1);}
.menu-card:nth-child(1) {animation-delay:0.08s;}
.menu-card:nth-child(2) {animation-delay:0.16s;}
.menu-card:nth-child(3) {animation-delay:0.24s;}
.menu-card:nth-child(4) {animation-delay:0.32s;}
@keyframes card-in {from{opacity:0;transform:translateY(40px) translateZ(-100px) scale(0.9) rotateX(20deg);}to{opacity:1;transform:translateY(0) translateZ(0) scale(1) rotateX(0deg);}}
@keyframes reveal-down {from{opacity:0;transform:translateY(-30px) translateZ(-50px);}to{opacity:1;transform:translateY(0) translateZ(0);}}
.menu-card::before {content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,rgba(255,255,255,0.1) 0%,transparent 30%,transparent 70%,rgba(255,255,255,0.05) 100%);pointer-events:none;opacity:0.6;transition:opacity 0.4s ease;}
.menu-card:hover::before {opacity:1;background:linear-gradient(135deg,rgba(255,255,255,0.2) 0%,rgba(59,130,246,0.1) 30%,rgba(6,182,212,0.1) 70%,rgba(255,255,255,0.15) 100%);}
.menu-card::after {content:'';position:absolute;top:0;left:15%;right:15%;height:2px;background:linear-gradient(90deg,transparent,rgba(59,130,246,0.6),rgba(6,182,212,0.6),transparent);filter:blur(1px);opacity:0.8;}
.card-glow {position:absolute;width:clamp(80px,20vw,120px);height:clamp(80px,20vw,120px);border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,0.4) 0%,rgba(6,182,212,0.2) 40%,transparent 70%);top:10%;left:50%;transform:translateX(-50%) translateZ(10px);opacity:0;transition:opacity 0.5s ease,transform 0.5s ease;pointer-events:none;filter:blur(15px);}
.card-icon-wrap {width:clamp(50px,12vw,72px);height:clamp(50px,12vw,72px);display:flex;align-items:center;justify-content:center;position:relative;z-index:2;transform-style:preserve-3d;transition:all 0.5s cubic-bezier(0.16,1,0.3,1);filter:drop-shadow(0 10px 20px rgba(0,0,0,0.5)) drop-shadow(0 5px 10px rgba(0,0,0,0.3));}
.card-icon-wrap img {width:100%;height:100%;object-fit:contain;transform-style:preserve-3d;}
.card-label {font-size:clamp(7px,1.8vw,11px);font-weight:800;text-transform:uppercase;letter-spacing:0.2em;color:var(--text);text-align:center;position:relative;z-index:2;transform-style:preserve-3d;transition:all 0.4s cubic-bezier(0.16,1,0.3,1);line-height:1.5;text-shadow:0 2px 6px rgba(0,0,0,0.6);}
.bottom-actions {display:flex;align-items:center;gap:clamp(16px,4vw,40px);animation:reveal-down 0.9s cubic-bezier(0.16,1,0.3,1) 0.5s both;transform-style:preserve-3d;}
.action-btn {display:flex;flex-direction:column;align-items:center;gap:clamp(6px,2vw,8px);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;background:none;border:none;transition:all 0.3s cubic-bezier(0.16,1,0.3,1);transform-style:preserve-3d;}
.action-btn:active {transform:scale(0.92) translateZ(-10px);}
.action-icon {width:clamp(42px,10vw,48px);height:clamp(42px,10vw,48px);border-radius:clamp(12px,3vw,16px);display:flex;align-items:center;justify-content:center;font-size:clamp(1rem,3vw,1.25rem);border:1.5px solid var(--border);background:var(--surface);transition:all 0.4s cubic-bezier(0.16,1,0.3,1);transform-style:preserve-3d;box-shadow:0 6px 16px rgba(0,0,0,0.4),0 2px 6px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.1),inset 0 -1px 0 rgba(0,0,0,0.2);}
@media (hover:hover) {.action-btn.settings:hover .action-icon {background:rgba(59,130,246,0.2);border-color:rgba(59,130,246,0.5);box-shadow:0 0 30px rgba(59,130,246,0.4),0 10px 25px rgba(0,0,0,0.5);transform:translateZ(15px) scale(1.08);}
.action-btn.logout:hover .action-icon {background:rgba(244,63,94,0.2);border-color:rgba(244,63,94,0.5);box-shadow:0 0 30px rgba(244,63,94,0.4),0 10px 25px rgba(0,0,0,0.5);transform:translateZ(15px) scale(1.08);}}
.action-label {font-size:clamp(8px,2vw,9px);font-weight:800;letter-spacing:0.2em;text-transform:uppercase;text-shadow:0 1px 3px rgba(0,0,0,0.5);}
.action-btn.settings .action-label {color:var(--muted);}
.action-btn.logout .action-label {color:rgba(244,63,94,0.7);}
.day-indicator {position:fixed;top:clamp(16px,3vw,20px);right:clamp(16px,3vw,20px);z-index:10;display:flex;flex-direction:column;align-items:flex-end;gap:4px;animation:reveal-down 0.7s ease 0.2s both;transform-style:preserve-3d;}
.day-name {font-size:clamp(8px,1.5vw,10px);letter-spacing:0.3em;text-transform:uppercase;color:var(--muted);font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,0.5);transform:translateZ(10px);}
.day-number {font-size:clamp(1.5rem,5vw,2.2rem);font-weight:900;line-height:1;color:rgba(255,255,255,0.08);letter-spacing:-0.04em;text-shadow:0 2px 8px rgba(0,0,0,0.3);transform:translateZ(5px);}
.divider {width:1px;height:clamp(28px,6vw,32px);background:linear-gradient(180deg,transparent,var(--border-2),transparent);transform:translateZ(5px);}
@media (max-height:700px) {.header-section {margin-bottom:1rem;}.menu-grid {gap:8px;margin-bottom:1rem;}.menu-card {padding:12px 8px;gap:8px;}}
@media (max-height:600px) {.greeting {font-size:clamp(1.5rem,4vw,2.5rem);}.live-time,.sub-label {font-size:8px;}}
@media (orientation:landscape) and (max-height:500px) {.content-wrapper {justify-content:flex-start;padding-top:1rem;}.header-section {margin-bottom:0.75rem;}.menu-grid {margin-bottom:1rem;}}
/* 상태 정보 텍스트 스타일 */
.card-status {
    font-size: clamp(8px, 1.6vw, 10px);
    font-weight: 500;
    color: var(--cyan); /* 강조색 */
    margin-top: 4px;
    opacity: 0.9;
    letter-spacing: 0.02em;
    text-transform: none;
    z-index: 2;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
}
/* 1. 프로필 이미지 컨테이너 (연필 아이콘 배치를 위해 추가) */
.profile-container {
    position: relative;
    display: inline-flex; /* inline-block 대신 inline-flex 사용 */
    align-items: center;
    justify-content: center;
    vertical-align: middle; /* 텍스트와 라인 맞춤 */
    margin-left: 12px;
    cursor: pointer;
    z-index: 10;
    line-height: 0; /* 불필요한 하단 여백 제거 */
}
/* 2. 기존 프로필 이미지 스타일 (일부 수정) */
.profile-img {
    width: clamp(40px, 10vw, 60px);
    height: clamp(40px, 10vw, 60px);
    border-radius: 50%;
    border: 2px solid var(--cyan);
    object-fit: cover;
    display: block; /* 컨테이너 안에서 꽉 차게 변경 */
    transition: transform 0.3s ease, border-color 0.3s ease;
    box-shadow: 0 0 15px var(--blue-glow);
}

/* 3. 좌측 하단 연필 표시 아이콘 추가 */
.profile-edit-icon {
    position: absolute;
    bottom: 2px;
    left: 2px; /* 좌측 하단 배치 */
    width: 18px;
    height: 18px;
    background: var(--blue);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: white;
    border: 1.5px solid var(--bg);
    box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    pointer-events: none;
    z-index: 11;
}
/* 호버 효과를 컨테이너 기준으로 변경 */
.profile-container:hover .profile-img {
    transform: scale(1.1);
    border-color: var(--blue);
}

/* 4. 프로필 선택 모달 스타일 (기존 유지) */
.profile-modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    backdrop-filter: blur(10px); z-index: 1000;
    display: none; align-items: center; justify-content: center;
}

.profile-modal {
    background: var(--surface); border: 1px solid var(--border-2);
    border-radius: 24px; padding: 24px; width: 90%; max-width: 400px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}

/* 5. 이미지 겹침 해결을 위한 그리드 스타일 수정 */
.profile-grid {
    display: grid !important;
    grid-template-columns: repeat(4, 1fr) !important; /* 4열 강제 고정 */
    gap: 12px;
    margin-top: 20px;
    max-height: 300px;
    overflow-y: auto;
    padding: 10px;
    align-items: start; /* 아이템들이 겹치지 않게 시작점 정렬 */
}

.profile-option {
    position: relative; /* 자식 요소 위치 기준 */
    aspect-ratio: 1; 
    border-radius: 12px; 
    cursor: pointer;
    border: 2px solid transparent; 
    transition: all 0.2s; 
    overflow: hidden;
    background: var(--surface-2); /* 이미지 로딩 전 배경색 */
}

.profile-option:hover { 
    border-color: var(--blue); 
    transform: scale(1.05); 
    z-index: 2; /* 호버 시 위로 올라오게 */
}

.profile-option img { 
    width: 100%; 
    height: 100%; 
    object-fit: cover; 
    display: block; 
}
/* 뉴스 & 정보 카드 */
.info-card {
    position:relative;background:linear-gradient(135deg,rgba(16,32,60,0.9) 0%,rgba(8,18,36,0.8) 100%);
    border:1.5px solid var(--border);border-radius:clamp(18px,4vw,24px);
    padding:clamp(14px,3vw,22px);width:100%;max-width:800px;box-sizing:border-box;
    margin-top:0;
    margin-bottom:2rem;
    animation:reveal-down 1s cubic-bezier(0.16,1,0.3,1) 0.4s both;
    box-shadow:0 15px 30px rgba(0,0,0,0.4),inset 0 1px 1px rgba(255,255,255,0.1);
    overflow:visible; /* hidden → visible */
}

.info-card::after {
    content:'';position:absolute;top:0;left:15%;right:15%;height:2px;
    background:linear-gradient(90deg,transparent,rgba(6,182,212,0.6),rgba(129,140,248,0.6),transparent);
    filter:blur(1px);opacity:0.8;
    pointer-events:none;
}
.info-grid {display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.info-section {background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:14px;padding:12px;}
.info-title {font-size:8px;font-weight:900;letter-spacing:0.2em;text-transform:uppercase;color:var(--cyan);margin-bottom:8px;display:flex;align-items:center;gap:5px;}
.news-item {font-size:9px;color:var(--text);padding:5px 0;border-bottom:1px solid var(--border);line-height:1.5;cursor:pointer;transition:color 0.2s;}

@media (max-width:768px) {
    .info-grid {grid-template-columns:1fr;}
    .info-card {margin-bottom:1rem;padding:clamp(12px,3vw,18px);border-radius:16px;}
    .info-section {border-radius:10px;padding:10px;}
    .news-item {font-size:10px;padding:6px 0;}
    .info-title {font-size:9px;}
    .stat-label {font-size:9px;}
    .stat-value {font-size:12px;}
    .quote-text {font-size:10px;}
    .lucky-num {width:24px;height:24px;font-size:9px;}
}

.news-item:hover {color:var(--cyan);}
.news-item:last-child {border-bottom:none;}
.news-badge {display:inline-block;font-size:7px;font-weight:900;padding:1px 5px;border-radius:4px;background:rgba(59,130,246,0.2);color:var(--blue);border:1px solid rgba(59,130,246,0.3);margin-right:4px;}
.news-badge.ev {background:rgba(16,185,129,0.2);color:#10b981;border-color:rgba(16,185,129,0.3);}
.stat-row {display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);}
.stat-row:last-child {border-bottom:none;}
.stat-label {font-size:8px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;}
.stat-value {font-size:11px;font-weight:900;color:#fff;}
.lucky-nums {display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
.lucky-num {width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#fff;}
.quote-text {font-size:9px;color:var(--text);line-height:1.6;font-style:italic;margin-top:4px;}
.quote-author {font-size:8px;color:var(--cyan);font-weight:700;margin-top:4px;text-align:right;}
.info-loading {font-size:9px;color:var(--muted);text-align:center;padding:10px;animation:pulse 1.5s infinite;}
</style>

</head>
<body>

        <div class="info-grid">
            <!-- 좌측: 인도네시아 뉴스 -->
            <div class="info-section">
                <div class="info-title">📰 Indonesia News Today</div>
                <div id="indo-news-list"><div class="info-loading">Loading news...</div></div>
            </div>
            <!-- 우측: 날씨 + 명언 + 행운 -->
            <div style="display:flex;flex-direction:column;gap:10px;">
                <div class="info-section">
                    <div class="info-title">🌤 Jakarta Weather</div>
                    <div id="weather-info"><div class="info-loading">Loading...</div></div>
                </div>
                <div class="info-section">
                    <div class="info-title">💬 Quote of the Day</div>
                    <div id="quote-info"><div class="info-loading">Loading...</div></div>

<div id="profileCustomModal" class="profile-modal-overlay" onclick="closeProfileModal()">
    <div class="profile-modal" onclick="event.stopPropagation()">
        <h3 id="modalTitle" style="color:#fff;text-align:center;font-weight:800;letter-spacing:0.1em;margin-bottom:15px;">SELECT PROFILE</h3>
        <div id="modalBody" class="profile-grid"></div>
        <button onclick="closeProfileModal()" style="width:100%;margin-top:20px;padding:12px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:12px;font-weight:700;cursor:pointer;">CLOSE</button>
    </div>
</div>
    <input type="file" id="profileInput" accept="image/*" style="display: none;" />

<script>
    /* ═══════════════════════════════════════════
        DYNAMIC BACKGROUND & CORE LOGIC
    ═══════════════════════════════════════════ */
    (function() {
        // 1. 사용자 확인 및 기본 설정
        const user = sessionStorage.getItem('loggedInUser');
        if (!user) location.href = 'index.html';
        document.getElementById('userGreeting').innerText = user || '—';

        let PEXELS_API_KEY = null;
        const firebaseConfig = { databaseURL: "https://tdlid-dailyreport-default-rtdb.firebaseio.com" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        /* --- [수정] 새로운 프로필 이미지 리스트 정의 --- */
        const PROFILE_IMAGES = [
            'image-001.webp', 'image-002.webp', 'image-003.webp', 'image-004.webp', 'image-005.webp', 
            'image-01.gif', 'image-02.gif', 'image-03.gif', 'image-04.gif', 'image-05.gif', 
            'image-06.gif', 'image-07.gif', 'image-08.gif', 'image-09.gif', 'image-10.gif', 
            'image-11.gif', 'image-12.gif', 'image-13.gif', 'image-14.gif', 'image-15.gif', 
            'image-16.gif', 'image-17.gif', 'image-18.gif', 'image-19.gif', 'image-20.gif', 
            'image-21.gif', 'image-22.gif', 'image-23.gif', 'image-24.gif', 'image-25.gif', 
            'image-26.gif', 'image-27.gif'
        ];

/* --- [수정] 공통 모달 열기 함수 --- */
window.openProfileModal = function(title, bodyHtml) { 
    const m = document.getElementById('profileCustomModal'); 
    const t = document.getElementById('modalTitle');
    const b = document.getElementById('modalBody');
    
    if(t) t.innerText = title; 
    if(b) b.innerHTML = bodyHtml; 
    // classList 대신 style.display로 확실하게 제어
    if(m) m.style.display = 'flex'; 
};

/* --- [수정] 모달 닫기 함수 --- */
window.closeProfileModal = function() {
    const m = document.getElementById('profileCustomModal');
    if(m) m.style.display = 'none';
};

        /* --- [수정] 프로필 이미지 피커 실행 함수 --- */
window.openProfileImagePicker = function() { 
    let g = ""; // 바깥쪽 div 제거
    PROFILE_IMAGES.forEach(i => { 
        g += `<div onclick="saveStaffProfile('${i}')" 
                   class="profile-option"
                   style="border: 2px solid transparent; transition: all 0.2s; aspect-ratio: 1/1; border-radius: 12px; overflow: hidden; cursor: pointer;">
                <img src="images/profile/${i}" style="width: 100%; height: 100%; object-fit: cover;" 
                     onerror="this.src='https://ui-avatars.com/api/?name=Error&background=random'">
              </div>`; 
    }); 
    openProfileModal('Change Profile', g); 
};

        /* --- [수정] DB 저장 함수 --- */
        window.saveStaffProfile = async function(fileName) {
            const userId = sessionStorage.getItem('loggedInUser');
            if (!userId) return;

            if (confirm("이 이미지로 프로필을 변경하시겠습니까?")) {
                try {
                    await database.ref(`users/${userId}/profileImg`).set(fileName);
                    const currentImg = document.querySelector('.profile-img');
                    if (currentImg) currentImg.src = `images/profile/${fileName}`;
                    alert("Profile updated!");
                    closeProfileModal();
                } catch (e) {
                    console.error(e);
                    alert("Update failed.");
                }
            }
        };

        /* --- [수정] 프로필 이미지 로드 함수 --- */
/* --- [수정된] 프로필 이미지 로드 함수 --- */
const loadProfileImg = (userId) => {
    if (!userId) return;
    database.ref(`users/${userId}/profileImg`).once('value', (snap) => {
        const imgFileName = snap.val();
        const greetingEl = document.getElementById('userGreeting');
        
        // 1. 기존에 이미 생성된 컨테이너가 있다면 삭제
        const oldContainer = document.querySelector('.profile-container');
        if (oldContainer) oldContainer.remove();

        // 2. 전체를 감싸는 컨테이너 생성
        const container = document.createElement('div');
        container.className = 'profile-container';
        container.onclick = () => openProfileImagePicker();

        // 3. 이미지 요소 생성
        const imgEl = document.createElement('img');
        imgEl.className = 'profile-img';
        imgEl.src = imgFileName ? `images/profile/${imgFileName}` : 'images/default-profile.png';
        imgEl.onerror = () => { imgEl.src = 'https://ui-avatars.com/api/?name=' + userId; };
        
        // 4. 연필 아이콘 생성
        const editIcon = document.createElement('div');
        editIcon.className = 'profile-edit-icon';
        editIcon.innerHTML = '✏️'; // 또는 <i class="fas fa-pen"></i> 등 아이콘 폰트

        // 5. 구조 조립 및 화면 삽입
        container.appendChild(imgEl);
        container.appendChild(editIcon);
        
        // 인사말(span) 바로 뒤에 삽입
        greetingEl.parentNode.insertBefore(container, greetingEl.nextSibling);
    });
};

        /* ── [기능 3] 실시간 상태 정보 (기존 유지) ── */
        const updateStaffStatus = (userId) => {
            if (!userId) return;
            const getLastWorkDay = () => {
                const d = new Date();
                const dayOfWeek = d.getDay();
                if (dayOfWeek === 1) d.setDate(d.getDate() - 3);
                else if (dayOfWeek === 0) d.setDate(d.getDate() - 2);
                else d.setDate(d.getDate() - 1);
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, '0');
                const date = String(d.getDate()).padStart(2, '0');
                return `${y}-${m}-${date}`;
            };
            const targetDateStr = getLastWorkDay();

            database.ref(`attendance/${targetDateStr}/${userId}`).on('value', (snap) => {
                const data = snap.val();
                const el = document.getElementById('status-attendance');
                if(el) {
                    const inTime = (data && data.attend) ? data.attend : "Not Checked-in";
                    const outTime = (data && data.leave) ? data.leave : "Not Checked-Out";
                    el.innerHTML = `Yesterday In: ${inTime}<br>Yesterday Out: ${outTime}`;
                    el.style.color = (data && (data.attend || data.leave)) ? "var(--cyan)" : "var(--rose)";
                }
            });

            database.ref(`reports/${targetDateStr}/${userId}`).on('value', (snap) => {
                const data = snap.val();
                const el = document.getElementById('status-report');
                if(el) {
                    if (data && data.todo && data.todo.trim() !== "") {
                        el.innerText = "Yesterday Report: Submitted";
                        el.style.color = "var(--cyan)";
                    } else {
                        el.innerText = "Yesterday Report: Required";
                        el.style.color = "var(--rose)";
                    }
                }
            });

            database.ref(`schedules/${userId}/today_next`).on('value', (snap) => {
                const nextEvent = snap.val();
                const el = document.getElementById('status-calendar');
                if(el) el.innerText = nextEvent ? `Next: ${nextEvent}` : "No more plans";
            });

            database.ref(`staff_info/${userId}/vacation_left`).on('value', (snap) => {
                const days = snap.val() || 0;
                const el = document.getElementById('status-vacation');
                if(el) el.innerText = `${days} Days Left`;
            });
        };

        // 초기 실행
        if (user) {
            loadProfileImg(user);
            updateStaffStatus(user);
        }

        /* ── [기능 4] 배경화면 및 기타 UI (기존 유지) ── */
        const updateBackground = async () => {
            if (!PEXELS_API_KEY) return;
            try {
                const response = await fetch(
                    "https://api.pexels.com/v1/search?query=jakarta city&per_page=30",
                    { headers: { Authorization: PEXELS_API_KEY } }
                );
                const data = await response.json();
                if (data.photos && data.photos.length > 0) {
                    const randomPhoto = data.photos[Math.floor(Math.random() * data.photos.length)];
                    const imgUrl = randomPhoto.src.large2x || randomPhoto.src.landscape;
                    const bgLayer = document.getElementById('dynamicBg');
                    bgLayer.style.backgroundImage = `url('${imgUrl}')`;
                }
            } catch (e) { console.error("Pexels Error:", e); }
        };

        database.ref('settings/config/PexelAPI').once('value', (snap) => {
            if (snap.exists()) {
                PEXELS_API_KEY = snap.val();
                updateBackground();
                setInterval(updateBackground, 10000);
            }
        });

        window.navigateTo = (page) => {
            sessionStorage.setItem('targetPage', page);
            location.href = 'staff.html';
        };

        window.handleLogout = () => {
            if (confirm("Do you want to logout?")) {
                sessionStorage.clear();
                localStorage.removeItem('loggedInUser');
                location.replace('index.html');
            }
        };

        function updateClock() {
            document.getElementById('liveTime').textContent = new Date().toLocaleTimeString('en-US', { hour12: false });
        }
        setInterval(updateClock, 1000);
        updateClock();

/* ── Daily Info Panel ── */
(async function loadDailyInfo() {
    // ① 날씨 (Jakarta - Open-Meteo 무료)
    try {
        const wr = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-6.2088&longitude=106.8456&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Asia%2FJakarta&forecast_days=1');
        const wd = await wr.json();
        const cw = wd.current_weather;
        const wCodes = {0:'☀️ Clear',1:'🌤 Mainly Clear',2:'⛅ Partly Cloudy',3:'☁️ Overcast',45:'🌫 Foggy',48:'🌫 Icy Fog',51:'🌦 Drizzle',61:'🌧 Rain',71:'❄️ Snow',80:'🌧 Showers',95:'⛈ Thunderstorm'};
        const desc = wCodes[cw.weathercode] || '🌡 ' + cw.weathercode;
        const max = wd.daily.temperature_2m_max[0], min = wd.daily.temperature_2m_min[0];
        document.getElementById('weather-info').innerHTML = `
            <div class="stat-row"><span class="stat-label">Condition</span><span class="stat-value" style="font-size:10px;">${desc}</span></div>
            <div class="stat-row"><span class="stat-label">Now</span><span class="stat-value" style="color:var(--cyan);">${cw.temperature}°C</span></div>
            <div class="stat-row"><span class="stat-label">High / Low</span><span class="stat-value" style="font-size:10px;">${max}° / ${min}°</span></div>
            <div class="stat-row"><span class="stat-label">Wind</span><span class="stat-value" style="font-size:10px;">${cw.windspeed} km/h</span></div>`;
    } catch(e) {
        document.getElementById('weather-info').innerHTML = '<div class="info-loading">Weather unavailable</div>';
    }

    // ② 명언 (랜덤 고정 리스트)
    const quotes = [
        {q:"The secret of getting ahead is getting started.",a:"Mark Twain"},
        {q:"It always seems impossible until it's done.",a:"Nelson Mandela"},
        {q:"Don't watch the clock; do what it does. Keep going.",a:"Sam Levenson"},
        {q:"Success is not final, failure is not fatal.",a:"Winston Churchill"},
        {q:"Believe you can and you're halfway there.",a:"Theodore Roosevelt"},
        {q:"The harder you work, the luckier you get.",a:"Gary Player"},
        {q:"Dream big and dare to fail.",a:"Norman Vaughan"},
        {q:"Act as if what you do makes a difference. It does.",a:"William James"},
        {q:"Quality is not an act, it is a habit.",a:"Aristotle"},
        {q:"Energy and persistence conquer all things.",a:"Benjamin Franklin"},
        {q:"Opportunities don't happen. You create them.",a:"Chris Grosser"},
        {q:"Great things never come from comfort zones.",a:"Unknown"},
        {q:"Push yourself, because no one else is going to do it for you.",a:"Unknown"},
        {q:"Little things make big days.",a:"Unknown"},
        {q:"It's going to be hard, but hard is not impossible.",a:"Unknown"},
    ];
    const todaySeed = new Date().getDate() + new Date().getMonth() * 31;
    const q = quotes[todaySeed % quotes.length];
    document.getElementById('quote-info').innerHTML = `
        <div class="quote-text">"${q.q}"</div>
        <div class="quote-author">— ${q.a}</div>`;

    // ③ 행운 번호 (오늘 날짜 시드 기반)
    const seed = new Date().getFullYear() * 10000 + (new Date().getMonth()+1) * 100 + new Date().getDate();
    const rand = (s, min, max) => { let x = Math.sin(s) * 10000; return min + Math.floor((x - Math.floor(x)) * (max - min + 1)); };
    const nums = [], colors = ['#3b82f6','#06b6d4','#818cf8','#f59e0b','#10b981','#f43f5e'];
    for(let i = 0; i < 6; i++) { let n; do { n = rand(seed + i * 7, 1, 49); } while(nums.includes(n)); nums.push(n); }
    const luckyColor = ['Red 🔴','Blue 🔵','Green 🟢','Gold 🟡','Purple 🟣','White ⚪'][rand(seed, 0, 5)];
    document.getElementById('lucky-info').innerHTML = `
        <div class="lucky-nums">${nums.map((n,i)=>`<div class="lucky-num" style="background:${colors[i]};box-shadow:0 0 8px ${colors[i]}60;">${n}</div>`).join('')}</div>
        <div class="stat-row" style="margin-top:8px;"><span class="stat-label">Lucky Color</span><span class="stat-value" style="font-size:10px;">${luckyColor}</span></div>`;

    // ④ 인도네시아 뉴스 (RSS → allorigins 프록시)
    try {
        const rssUrl = 'https://news.google.com/rss/search?q=indonesia+electric+vehicle+OR+motor+listrik+OR+mobil+listrik&hl=id&gl=ID&ceid=ID:id';
        const proxy = `https://api.allorigins.win/get?url=${encodeURIComponent(rssUrl)}`;
        const res = await fetch(proxy);
        const data = await res.json();
        const parser = new DOMParser();
        const xml = parser.parseFromString(data.contents, 'text/xml');
        const items = Array.from(xml.querySelectorAll('item')).slice(0, 10);
        
        if(items.length > 0) {
            const evKeywords = ['listrik','electric','ev','byd','wuling','hyundai','battery','baterai'];
            document.getElementById('indo-news-list').innerHTML = items.map(item => {
                const title = item.querySelector('title')?.textContent || '';
                const link = item.querySelector('link')?.textContent || '#';
                const isEV = evKeywords.some(k => title.toLowerCase().includes(k));
                return `<div class="news-item" onclick="window.open('${link}','_blank')">
                    ${isEV ? '<span class="news-badge ev">EV</span>' : '<span class="news-badge">NEWS</span>'}${title.substring(0,60)}${title.length>60?'...':''}
                </div>`;
            }).join('');
        } else {
            throw new Error('No items');
        }
    } catch(e) {
        // RSS 실패 시 하드코딩 뉴스
        const fallbackNews = [
            {t:'Pemerintah dorong percepatan kendaraan listrik nasional',ev:true},
            {t:'PLN perluas jaringan SPKLU di seluruh Indonesia',ev:true},
            {t:'Motor listrik lokal semakin diminati konsumen Indonesia',ev:true},
            {t:'BYD Indonesia luncurkan model terbaru dengan harga kompetitif',ev:true},
            {t:'Subsidi motor listrik 2025 resmi diperpanjang pemerintah',ev:true},
            {t:'Industri baterai EV Indonesia terus berkembang pesat',ev:true},
            {t:'Wuling Air EV raih penjualan tertinggi bulan ini',ev:true},
            {t:'Pemerintah bangun 1000 SPKLU baru di Jawa-Bali',ev:true},
            {t:'Pertumbuhan ekonomi Indonesia Q1 2025 capai target',ev:false},
            {t:'Bank Indonesia pertahankan suku bunga acuan',ev:false},
        ];
        document.getElementById('indo-news-list').innerHTML = fallbackNews.map(n=>
            `<div class="news-item">${n.ev?'<span class="news-badge ev">EV</span>':'<span class="news-badge">NEWS</span>'}${n.t}</div>`
        ).join('');
    }
})();

        const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
        const now = new Date();
        document.getElementById('dayName').textContent = days[now.getDay()];
        document.getElementById('dayNumber').textContent = String(now.getDate()).padStart(2, '0');

        /* ── [기능 5] 4D 틸트 효과 (기존 유지) ── */
        if (window.matchMedia('(hover: hover) and (min-width: 1025px)').matches) {
            document.querySelectorAll('.menu-card').forEach(card => {
                let targetRotateX = 0, targetRotateY = 0, currentRotateX = 0, currentRotateY = 0, rafId = null;
                const lerp = (s, e, f) => s + (e - s) * f;
                const animate = () => {
                    currentRotateX = lerp(currentRotateX, targetRotateX, 0.1);
                    currentRotateY = lerp(currentRotateY, targetRotateY, 0.1);
                    card.style.transform = `perspective(2000px) translateY(-15px) translateZ(60px) scale(1.05) rotateX(${8 + currentRotateX}deg) rotateY(${currentRotateY}deg)`;
                    rafId = requestAnimationFrame(animate);
                };
                card.addEventListener('mouseenter', () => rafId = requestAnimationFrame(animate));
                card.addEventListener('mousemove', e => {
                    const rect = card.getBoundingClientRect();
                    targetRotateX = -((e.clientY - (rect.top + rect.height/2)) / (rect.height/2)) * 10;
                    targetRotateY = ((e.clientX - (rect.left + rect.width/2)) / (rect.width/2)) * 10;
                });
                card.addEventListener('mouseleave', () => {
                    cancelAnimationFrame(rafId);
                    targetRotateX = 0; targetRotateY = 0;
                    card.style.transform = '';
                });
            });
        }
    })();
</script>
