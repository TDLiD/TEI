<style>
    /* (기존 스타일 유지) */
    .calendar-table th { padding: 6px 0; color: #64748b; font-size: 0.6rem; text-align: center; font-weight: 800; }
    .calendar-table td { 
        height: 70px; width: 14.28%; border: 1px solid #1e293b; vertical-align: top; padding: 2px; position: relative; transition: background 0.2s;
    }

    @media (max-width: 640px) {
        .calendar-table td { height: 55px !important; padding: 1px; }
        .time-label { font-size: 0.45rem !important; padding: 1px !important; margin-top: 1px !important; line-height: 1; letter-spacing: -0.05em; }
        #currentMonthYear { font-size: 0.9rem; }
        .nav-btn { padding: 3px 5px !important; font-size: 0.65rem !important; }

h2#mainWelcomeMsg { 
        font-size: 1.5rem !important; /* 이름 텍스트 크기 */
        display: flex;
        align-items: center;
        gap: 10px; /* 이모티콘과 이름 사이 간격 */
    }

    /* 이모티콘 크기를 기존 대비 2배 이상으로 확대 */
    h2#mainWelcomeMsg .main-emoji {
        font-size: 3.2rem !important; /* 2배 정도 커진 크기 */
        display: inline-block;
        line-height: 1;
        margin-right: 5px;
        /* 약간의 생동감을 위해 애니메이션 추가 (선택사항) */
        animation: wave 2s infinite origin-bottom;
    }

    /* 손 흔드는 애니메이션 (선택사항) */
    @keyframes wave {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(15deg); }
    }

        section { padding: 1rem !important; border-radius: 1.5rem !important; }
    }

    .calendar-table td:hover { background-color: #0f172a; }
    .today-highlight { background-color: rgba(37, 99, 235, 0.1); border: 2px solid #3b82f6 !important; z-index: 10; }
    
    .time-label {
        display: block; font-family: 'JetBrains Mono', monospace; font-size: 0.55rem; font-weight: 800;
        padding: 1px 2px; margin-top: 1px; border-radius: 3px; text-align: center;
    }
    
    .att-color { background-color: rgba(16, 185, 129, 0.15); color: #10b981; } 
    .late-color { background-color: rgba(244, 63, 94, 0.15); color: #f43f5e; } 
    .other-color { background-color: rgba(245, 158, 11, 0.15); color: #f59e0b; } 
    .out-time { background-color: rgba(148, 163, 184, 0.1); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.2); }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* [추가] 지각 경고 바 애니메이션 */
    .warning-pulse { animation: pulse-red 2s infinite; border: 2px solid #f43f5e !important; }
    @keyframes pulse-red {
        0% { box-shadow: 0 0 0px rgba(244, 63, 94, 0); }
        50% { box-shadow: 0 0 15px rgba(244, 63, 94, 0.4); }
        100% { box-shadow: 0 0 0px rgba(244, 63, 94, 0); }
    }

/* 미입력 알림 모달 스타일 */
    .missing-modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
        display: flex; align-items: center; justify-content: center; z-index: 9999;
    }
    .missing-modal {
        background: #0f172a; border: 1px solid #334155; border-radius: 1.5rem;
        width: 90%; max-width: 400px; padding: 2rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

/* 수정 모달 스타일 */
.edit-modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center; z-index: 10000;
}
.edit-modal {
    background: #0f172a; border: 1px solid #334155; border-radius: 1.5rem;
    width: 90%; max-width: 400px; padding: 2rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
}
.edit-modal input[readonly] {
    background-color: #1e293b; color: #64748b; cursor: not-allowed;
}
.edit-modal input[type="time"] {
    color-scheme: dark; /* 브라우저 시간 선택기 다크모드 대응 */
}

@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
}
.animate-blink {
    animation: blink 1s infinite;
}

</style>



<div class="flex flex-col lg:flex-row gap-4 md:gap-8 animate-fadeIn p-2 md:p-0">
    <div class="w-full lg:w-1/3 space-y-3 md:space-y-6">
        <div class="px-1">
            <p class="text-slate-500 text-[9px] uppercase font-black tracking-widest mb-0.5">Authenticated as</p>
            <h2 id="mainWelcomeMsg" class="text-xl md:text-3xl font-black text-white"></h2>

            <div id="weeklySummaryCard" class="mt-4 p-4 rounded-2xl border border-slate-800 bg-slate-900/50 transition-all duration-500">
                <div class="flex items-center justify-between mb-1">
                    <span id="warningIcon" class="text-lg hidden">⚠️</span>
                    <span class="text-[9px] font-black text-slate-500 uppercase tracking-widest">Monthly Attendance Stats</span>
                </div>
                
                <div class="flex items-end justify-between gap-2">
                    <div class="flex items-end gap-2">
                        <span id="lateRatioPercent" class="text-3xl font-black text-white">0%</span>
                        <span id="lateRatioStatus" class="text-[10px] font-bold text-slate-500 mb-1 uppercase">Checking...</span>
                    </div>
                    <div class="text-right text-[10px] font-bold text-slate-400 leading-tight">
                        <div id="statCounts">T: 0 | A: 0 | L: 0</div>
                        <div id="avgLeaveTime" class="text-blue-400">Avg Leave: --:--</div>
                    </div>
                </div>

                <div class="w-full bg-slate-800 h-1.5 rounded-full mt-3 overflow-hidden">
                    <div id="lateRatioBar" class="h-full bg-blue-500 transition-all duration-1000" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <section class="bg-slate-900 p-4 md:p-6 rounded-[2rem] border border-slate-800 shadow-2xl">
            <div class="flex justify-between items-center mb-4 md:mb-6">
                <p class="text-[9px] text-slate-500 uppercase font-black tracking-widest">Attendance Panel</p>
                <p id="liveDate" class="text-[9px] font-bold text-blue-500 bg-blue-500/10 px-2 py-0.5 rounded"></p>
            </div>
            
            <div class="space-y-3 md:space-y-4">
                <div id="timeInputWrapper" class="bg-slate-800/50 p-3 md:p-4 rounded-xl border border-slate-700/50 transition-opacity">
                    <label class="block text-[9px] font-bold text-slate-500 uppercase mb-1 md:mb-2">Time (24H)</label>
                    <input type="text" id="manualTime" 
                           placeholder="00:00:00" maxlength="8"
                           class="w-full bg-slate-800 text-white text-xl md:text-2xl font-black p-2 md:p-3 rounded-lg border border-slate-600 outline-none text-center">
                </div>

                <div class="bg-slate-800/50 p-3 md:p-4 rounded-xl border border-slate-700/50">
                    <select id="specialStatus" onchange="toggleInputMode()" class="w-full bg-slate-800 text-white font-bold p-2 md:p-3 rounded-lg border border-slate-600 outline-none cursor-pointer text-xs">
                        <option value="">--- REGULAR (IN/OUT) ---</option>
                        <option value="WO">WO (Work Out)</option>
                        <option value="PEL">PEL (Personal Leave)</option>
                        <option value="ANL">ANL (Annual Leave)</option>
                        <option value="HAL">HAL (Half Day Leave)</option>
                        <option value="SIL">SIL (Sick Leave)</option>
                        <option value="SPL">SPL (Special Leave)</option>

                <div id="buttonArea" class="grid grid-cols-2 gap-2 md:gap-3">

                    <button id="btnOut" onclick="handleAttendance('leave')" class="bg-rose-600 text-white py-3 md:py-4 rounded-xl text-xs font-black transition active:scale-95">SET OUT</button>
                </div>
                
                <div id="specialButtonArea" class="hidden">
                    <button onclick="handleSpecialStatus()" class="w-full bg-blue-600 text-white py-3 md:py-4 rounded-xl text-xs font-black transition active:scale-95">SAVE STATUS</button>

    <div class="flex-1">
        <section class="bg-slate-900 p-3 md:p-8 rounded-[2rem] border border-slate-800 shadow-2xl h-full">
            <div class="mb-6 flex justify-center sm:justify-start">
                <button onclick="switchTab('allatt')" 
                        class="group relative flex items-center gap-3 bg-black hover:bg-slate-900 text-white px-5 py-2 md:py-3 rounded-2xl text-[10px] md:text-xs font-black transition-all active:scale-95 shadow-lg shadow-black/50 border border-slate-800 w-full sm:w-auto justify-center sm:justify-start h-fit">
                    <img src="images/gif/click.gif" alt="click" class="w-8 h-8 md:w-10 md:h-10 object-contain group-hover:scale-110 transition-transform">
                    <span class="uppercase tracking-widest whitespace-nowrap">All Staff Record</span>
                    <span class="opacity-50 group-hover:translate-x-1 transition-transform hidden xs:inline">❯</span>
                </button>
            </div>

            <div class="flex flex-col sm:flex-row justify-between items-center mb-4 px-1 gap-3">
                <div class="flex items-center justify-between w-full sm:w-auto gap-3">
                    <div id="currentMonthYear" class="text-sm md:text-lg font-black text-white italic underline decoration-blue-500 underline-offset-4"></div>
                    <div class="flex bg-slate-800 rounded-lg p-0.5">
                        <button onclick="changeMonth(-1)" class="nav-btn px-2 py-1 text-slate-400 text-[10px] font-black">PREV</button>
                        <button onclick="goToday()" class="nav-btn px-2 py-1 text-blue-400 text-[10px] font-black mx-0.5">TODAY</button>
                        <button onclick="changeMonth(1)" class="nav-btn px-2 py-1 text-slate-400 text-[10px] font-black">NEXT</button>
                    </div>

                <div class="flex items-center gap-3 w-full sm:w-auto justify-end sm:border-l sm:border-slate-800 sm:pl-4">
                    <span class="text-[9px] text-slate-500 font-bold uppercase">Std: <span id="displayStdTime" class="text-slate-300">--:--</span></span>
                    <div class="w-1.5 h-1.5 rounded-full bg-blue-500 animate-pulse"></div>
                </div>
            </div>

            <div class="overflow-x-auto no-scrollbar rounded-xl border border-slate-800">
                <table class="calendar-table min-w-[300px] w-full border-collapse bg-slate-900/50">
                    <thead>
                        <tr class="bg-slate-800/30">
                            <th class="text-rose-500 uppercase">Sun</th>
                            <th class="uppercase">Mon</th><th class="uppercase">Tue</th><th class="uppercase">Wed</th>
                            <th class="uppercase">Thu</th><th class="uppercase">Fri</th>
                            <th class="text-blue-500 uppercase">Sat</th>
                        </tr>
                    </thead>
                    <tbody id="calendarBody"></tbody>
                </table>
            </div>
        </section>
    </div>
</div>

<script>
function getJakartaDate() {
    const now = new Date();
    const jakartaStr = now.toLocaleString("en-US", {timeZone: "Asia/Jakarta"});
    return new Date(jakartaStr);
}

(function() {

const user = sessionStorage.getItem('loggedInUser');
// 이모티콘을 span으로 감싸서 클래스를 부여합니다.
document.getElementById('mainWelcomeMsg').innerHTML = `<span class="main-emoji">👋</span> ${user}`;

    const db = firebase.database();
    
    let now = getJakartaDate(); 
    let viewDate = new Date(now);

    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    const todayStr = `${y}-${m}-${d}`;
    let standardTime = "";
    let hasCheckedMissing = false; // [추가] 팝업 중복 실행 방지 플래그

    const btnIn = document.getElementById('btnIn');
    const timeInput = document.getElementById('manualTime');

    function updateLiveTime() {
        if (document.activeElement === timeInput) return;
        const liveNow = getJakartaDate();
        const hh = String(liveNow.getHours()).padStart(2, '0');
        const mm = String(liveNow.getMinutes()).padStart(2, '0');
        const ss = String(liveNow.getSeconds()).padStart(2, '0'); 
        timeInput.value = `${hh}:${mm}:${ss}`;
    }
    setInterval(updateLiveTime, 1000);
    updateLiveTime();

    timeInput.addEventListener('input', function(e) {
        let v = e.target.value.replace(/[^0-9]/g, '');
        if (v.length >= 5) {
            v = v.substring(0, 2) + ":" + v.substring(2, 4) + ":" + v.substring(4, 6);
        } else if (v.length >= 3) {
            v = v.substring(0, 2) + ":" + v.substring(2, 4);
        }
        e.target.value = v;
    });

    function isValidTime(t) {
        if(!t) return false;
        return /^([01][0-9]|2[0-3]):([0-5][0-9])(:([0-5][0-9]))?$/.test(t);
    }

    window.handleAttendance = function(type) {
        if (!type || typeof type !== 'string') return;
        const rawTime = timeInput.value; 
        if(!isValidTime(rawTime)) {
            alert("Please enter a valid time (HH:mm:ss).");
            return;
        }
        const timeParts = rawTime.split(':');
        const storageTime = `${timeParts[0]}:${timeParts[1]}`; 

        db.ref('attendance/' + todayStr + '/' + user).once('value', (snap) => {
            const currentData = snap.val() || {};
            if (type === 'attend' && currentData.attend) {
                alert("Attendance time has already been set.");
                return;
            }
            let finalVal = storageTime;
            if(type === 'attend') {
                if(!standardTime) { alert("Standard time is loading..."); return; }
                const [iHH, iMM] = storageTime.split(':').map(Number);
                const [sHH, sMM] = standardTime.split(':').map(Number);
                const stdMinutes = sHH * 60 + sMM;
                const inputMinutes = iHH * 60 + iMM;
                if (inputMinutes <= stdMinutes) {
                    finalVal = `ATT(${storageTime})`;
                } else {
                    finalVal = `LATE(${storageTime})`;
                }
            }
            if(confirm(`Update ${type.toUpperCase()} to ${finalVal}?`)) {
                db.ref('attendance/' + todayStr + '/' + user).update({ [type]: finalVal })
                .then(() => alert("Success."));
            }
        });
    };

function updateAttendanceStats(data) {
    const viewYear = viewDate.getFullYear();
    const viewMonth = viewDate.getMonth() + 1;

    let totalRecords = 0;
    let lateCount = 0;
    let attCount = 0;
    let totalLeaveMinutes = 0;
    let leaveRecordCount = 0;

    Object.keys(data).forEach(dateStr => {
        const [year, month] = dateStr.split('-').map(Number);
        if (year === viewYear && month === viewMonth) {
            const rec = data[dateStr][user];
            if (rec && typeof rec === 'object' && rec.attend) {
                totalRecords++;
                if (rec.attend.includes("LATE")) lateCount++;
                else if (rec.attend.includes("ATT")) attCount++;

                if (rec.leave) {
                    const timeMatch = rec.leave.match(/(\d{2}):(\d{2})/);
                    if (timeMatch) {
                        totalLeaveMinutes += (parseInt(timeMatch[1]) * 60 + parseInt(timeMatch[2]));
                        leaveRecordCount++;
                    }
                }
            }
        }
    });

    const ratio = totalRecords > 0 ? Math.round((lateCount / totalRecords) * 100) : 0;
    
    // --- [중요] 여기서부터 요소 존재 여부 체크 ---
    const ratioText = document.getElementById('lateRatioPercent');
    const bar = document.getElementById('lateRatioBar');
    const card = document.getElementById('weeklySummaryCard');
    const statusText = document.getElementById('lateRatioStatus');
    const warnIcon = document.getElementById('warningIcon');
    const statCountsElem = document.getElementById('statCounts');
    const avgLeaveElem = document.getElementById('avgLeaveTime');

    // 요소가 있을 때만 실행하도록 조건문 처리
    if (ratioText) ratioText.innerText = `${ratio}%`;
    
    if (bar && card && statusText && warnIcon) {
        bar.style.width = `${ratio}%`;
        if (ratio >= 50) {
            bar.className = "h-full bg-rose-500 transition-all duration-1000";
            card.classList.add('warning-pulse');
            statusText.innerText = "WARNING: HIGH LATE";
            statusText.className = "text-[10px] font-bold text-rose-500 mb-1 uppercase";
            warnIcon.classList.remove('hidden');
        } else {
            bar.className = "h-full bg-blue-500 transition-all duration-1000";
            card.classList.remove('warning-pulse');
            statusText.innerText = "GOOD STANDING";
            statusText.className = "text-[10px] font-bold text-slate-500 mb-1 uppercase";
            warnIcon.classList.add('hidden');
        }
    }

    if (statCountsElem) {
        statCountsElem.innerText = `T: ${totalRecords} | A: ${attCount} | L: ${lateCount}`;
    }

    if (avgLeaveElem) {
        if (leaveRecordCount > 0) {
            const avgTotal = Math.round(totalLeaveMinutes / leaveRecordCount);
            avgLeaveElem.innerText = `Avg Leave: ${String(Math.floor(avgTotal / 60)).padStart(2, '0')}:${String(avgTotal % 60).padStart(2, '0')}`;
        } else {
            avgLeaveElem.innerText = `Avg Leave: --:--`;
        }
    }
}

db.ref('settings/standardTime').on('value', (snap) => {
    const val = snap.val();
    if(val) {
        standardTime = val;
        // 이 부분을 안전하게 수정
        const stdTimeElem = document.getElementById('displayStdTime');
        if (stdTimeElem) {
            stdTimeElem.innerText = standardTime;
        }
        
        if(btnIn) btnIn.disabled = false;
    }
});

    document.getElementById('liveDate').innerText = now.toLocaleDateString('en-US', { 
        month: 'short', day: 'numeric', weekday: 'short', timeZone: 'Asia/Jakarta' 
    }).toUpperCase();

    window.toggleInputMode = function() {
        const status = document.getElementById('specialStatus').value;
        const timeInputWrapper = document.getElementById('timeInputWrapper');
        const btnArea = document.getElementById('buttonArea');
        const specialBtnArea = document.getElementById('specialButtonArea');
        if(status !== "") {
            timeInputWrapper.classList.add('opacity-30', 'pointer-events-none');
            btnArea.classList.add('hidden');
            specialBtnArea.classList.remove('hidden');
        } else {
            timeInputWrapper.classList.remove('opacity-30', 'pointer-events-none');
            btnArea.classList.remove('hidden');
            specialBtnArea.classList.add('hidden');
        }
    };

    window.handleSpecialStatus = function() {
        const status = document.getElementById('specialStatus').value;
        if(!status) return;
        if(confirm(`Set status to ${status}?`)) {
            db.ref('attendance/' + todayStr + '/' + user).set(status)
            .then(() => {
                alert("Success.");
                document.getElementById('specialStatus').value = "";
                toggleInputMode();
            });
        }
    };

    window.goToday = function() { viewDate = getJakartaDate(); renderCalendar(); };
    window.changeMonth = function(offset) { viewDate.setMonth(viewDate.getMonth() + offset); renderCalendar(); };


function renderCalendar() {
    const year = viewDate.getFullYear(), month = viewDate.getMonth();
    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();

    // [추가] 월/년 표시 요소 체크
    const monthYearElem = document.getElementById('currentMonthYear');
    if (monthYearElem) {
        monthYearElem.innerText = viewDate.toLocaleString('en-US', { month: 'long', year: 'numeric' }).toUpperCase();
    }
    
    db.ref('attendance').off();
    db.ref('attendance').on('value', (snap) => {
        // [중요] 리스너 내부에서도 tbody가 존재하는지 매번 확인
        const tbody = document.getElementById('calendarBody');
        if (!tbody) return; // 요소가 없으면(다른 탭으로 이동했다면) 함수 즉시 종료

        const data = snap.val() || {};
        
        updateAttendanceStats(data);

        if (!hasCheckedMissing) {
            checkMissingRecords(data);
            hasCheckedMissing = true;
        }

        // 기존 내용 삭제 전 다시 한번 안전 확인
        tbody.innerHTML = '';
        
        let dateCounter = 1;
        for (let i = 0; i < 6; i++) {
            let row = document.createElement('tr');
            for (let j = 0; j < 7; j++) {
                let cell = document.createElement('td');
                if (i === 0 && j < firstDay || dateCounter > lastDate) {
                    row.appendChild(cell);
                } else {
                    const dStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(dateCounter).padStart(2, '0')}`;
                    const rec = data[dStr] ? data[dStr][user] : null;
                    
                    if (dStr === todayStr) cell.classList.add('today-highlight');
                    
                    cell.style.cursor = 'pointer';
                    cell.onclick = () => openEditPopup(dStr, rec);

                    let content = `<div class="text-[9px] font-black text-slate-500 opacity-50 ml-1 mt-1">${dateCounter}</div>`;
                    if (rec) {
                        if (typeof rec === 'string') {
                            content += `<span class="time-label other-color mt-2">${rec}</span>`;
                        } else {
                            let attendText = rec.attend || "";
                            let displayAttend = "";
                            if (attendText) {
                                const attMatch = attendText.match(/(\d{1,2}:\d{2})/);
                                const prefix = attendText.includes("LATE") ? "LATE" : "ATT";
                                displayAttend = attMatch ? `${prefix}(${attMatch[1]})` : attendText;
                            }
                            
                            let attendColor = attendText.includes("ATT") ? "att-color" : (attendText.includes("LATE") ? "late-color" : "other-color");
                            if(displayAttend) content += `<span class="time-label ${attendColor}">☀️ ${displayAttend}</span>`;
                            
                            let leaveText = rec.leave || "";
                            let displayLeave = "";
                            if (leaveText) {
                                const leaveMatch = leaveText.match(/(\d{1,2}:\d{2})/);
                                displayLeave = leaveMatch ? leaveMatch[1] : leaveText;
                            }
                            if(displayLeave) content += `<span class="time-label out-time">🌙 ${displayLeave}</span>`;
                        }
                    }
                    cell.innerHTML = content;
                    row.appendChild(cell); 
                    dateCounter++;
                }
            }
            tbody.appendChild(row);
            if (dateCounter > lastDate) break; 
        }
    });
}


// [수정] 출근/퇴근 통합 수정 팝업 기능
window.openEditPopup = function(dateStr, currentRec) {
    if (document.getElementById('editPopup')) return;

    let attVal = "";
    let leaveVal = "";
    let isAttReadOnly = false;

// [수정된 로직] openEditPopup 내부 시간 추출 부분
if (currentRec) {
    if (typeof currentRec === 'string') {
        attVal = currentRec;
        isAttReadOnly = true;
    } else {
        // 출근 시간 추출: 시(Hour)가 1자리(8:23) 또는 2자리(08:23) 모두 대응
        if (currentRec.attend) {
            // \d{1,2}를 사용하여 1~2자리 숫자 모두 매칭
            const timeMatch = currentRec.attend.match(/(\d{1,2}:\d{2})/);
            if (timeMatch) {
                // 입력 필드(type="time")는 HH:mm (2자리) 형식을 요구하므로 padStart 추가
                const [hh, mm] = timeMatch[1].split(':');
                attVal = `${hh.padStart(2, '0')}:${mm}`;
            } else {
                attVal = currentRec.attend;
            }
            isAttReadOnly = true; 
        }
        
        // 퇴근 시간 추출: 동일하게 1~2자리 대응 및 포맷 보정
        if (currentRec.leave) {
            const leaveMatch = currentRec.leave.match(/(\d{1,2}:\d{2})/);
            if (leaveMatch) {
                const [hh, mm] = leaveMatch[1].split(':');
                leaveVal = `${hh.padStart(2, '0')}:${mm}`;
            } else {
                leaveVal = currentRec.leave;
            }
        }
    }
}

    const overlay = document.createElement('div');
    overlay.id = 'editPopup';
    overlay.className = 'edit-modal-overlay animate-fadeIn';
    
    overlay.innerHTML = `
        <div class="edit-modal">
            <div class="mb-4">
                <p class="text-[10px] font-black ${isAttReadOnly ? 'text-rose-500' : 'text-emerald-500'} uppercase tracking-widest text-center mb-1">
                    ${isAttReadOnly ? '⚠️ Attendance Locked' : '✍️ Attendance Missing'}
                </p>
                <h3 class="text-white font-black text-center text-lg">${dateStr}</h3>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-[9px] font-black text-slate-500 uppercase mb-1">Attendance Time</label>
                    <input type="time" id="editAttTime" value="${attVal}" ${isAttReadOnly ? 'readonly' : ''} 
                           class="w-full ${isAttReadOnly ? 'bg-slate-800 text-slate-400 border-slate-700' : 'bg-slate-800 text-white border-emerald-500/50'} p-3 rounded-xl border outline-none font-black text-xl">
                </div>
                
                <div>
                    <label class="block text-[9px] font-black text-blue-500 uppercase mb-1">Leave Time</label>
                    <input type="time" id="editLeaveTime" value="${leaveVal}"
                           class="w-full bg-slate-800 text-white p-3 rounded-xl border border-blue-500/50 outline-none font-black text-xl">
                </div>

                <div class="grid grid-cols-2 gap-3 mt-6">
                    <button onclick="document.getElementById('editPopup').remove()" 
                            class="bg-slate-800 text-slate-400 font-black py-3 rounded-xl hover:bg-slate-700 transition">CANCEL</button>
                    <button onclick="saveEditRecord('${dateStr}', ${isAttReadOnly})" 
                            class="bg-blue-600 text-white font-black py-3 rounded-xl hover:bg-blue-500 transition shadow-lg shadow-blue-900/20">SAVE RECORD</button>
                </div>
            </div>
        </div>
    `;
    document.body.appendChild(overlay);
};


// [수정] 저장 로직: 출근 기록 여부에 따른 조건부 업데이트
window.saveEditRecord = function(dateStr, isAttReadOnly) {
    const newAtt = document.getElementById('editAttTime').value;
    const newLeave = document.getElementById('editLeaveTime').value;
    const updateData = {};

    // 1. 출근 시간 처리 (이미 있는 경우는 업데이트 제외)
    if (!isAttReadOnly && newAtt) {
        if (!standardTime) { alert("Standard time loading..."); return; }
        
        const [iHH, iMM] = newAtt.split(':').map(Number);
        const [sHH, sMM] = standardTime.split(':').map(Number);
        const stdMinutes = sHH * 60 + sMM;
        const inputMinutes = iHH * 60 + iMM;
        
        updateData.attend = (inputMinutes <= stdMinutes) ? `ATT(${newAtt})` : `LATE(${newAtt})`;
    }

    // 2. 퇴근 시간 처리
    if (newLeave) {
        updateData.leave = newLeave;
    }

    if (Object.keys(updateData).length === 0) {
        alert("No changes to save.");
        return;
    }

    if (confirm(`Save changes for ${dateStr}?`)) {
        db.ref('attendance/' + dateStr + '/' + user).update(updateData)
        .then(() => {
            alert("Record updated successfully.");
            document.getElementById('editPopup').remove();
        }).catch(err => {
            alert("Error: " + err.message);
        });
    }
};


  // [수정] 미입력 기록 체크 로직 - Attendance/Leave 개별 표시 추가
function checkMissingRecords(data) {
    if (!user) return;

    const today = getJakartaDate();
    const currentYear = today.getFullYear();
    const currentMonth = today.getMonth();
    const todayDate = today.getDate();
    
    let missingInfo = []; // 날짜와 누락 정보를 담을 배열

    // 1일부터 어제까지 루프
    for (let day = 1; day < todayDate; day++) {
        const checkDate = new Date(currentYear, currentMonth, day);
        const dayOfWeek = checkDate.getDay(); 
        
        // 주말 제외
        if (dayOfWeek !== 0 && dayOfWeek !== 6) {
            const dStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const dayData = data[dStr]; 
            
            if (dayData) {
                const hasAnyStaffRecord = Object.keys(dayData).length > 0;

                if (hasAnyStaffRecord) {
                    const myRec = dayData[user]; // 로그인한 사용자의 기록
                    let missingStatus = [];

                    if (!myRec) {
                        // 기록이 아예 없는 경우
                        missingStatus.push("Attendance", "Leave");
                    } else if (typeof myRec === 'object') {
                        // 객체는 있지만 필드가 누락된 경우
                        if (!myRec.attend) missingStatus.push("Attendance");
                        if (!myRec.leave) missingStatus.push("Leave");
                    } else if (typeof myRec === 'string') {
                        // WO, ANL 등 문자열 상태인 경우는 누락이 없는 것으로 간주
                        continue;
                    }

                    if (missingStatus.length > 0) {
                        const dayName = checkDate.toLocaleDateString('en-US', { weekday: 'short' });
                        missingInfo.push({
                            date: `${dStr} (${dayName})`,
                            status: missingStatus.join(' & ')
                        });
                    }
                }
            }
        }
    }

    if (missingInfo.length > 0) {
        showMissingPopup(missingInfo);
    }
}



function showMissingPopup(missingInfo) {
    if (document.getElementById('missingPopup')) return;

    const overlay = document.createElement('div');
    overlay.id = 'missingPopup';
    overlay.className = 'missing-modal-overlay animate-fadeIn';
    
    // [수정] 객체에서 속성(date, status)을 추출하여 HTML 생성
    let listHtml = missingInfo.map(info => `
        <div class="bg-slate-800/50 p-3 rounded-xl border border-slate-700/50 mb-2 flex justify-between items-center">
            <div class="text-left">
                <p class="text-[10px] font-black text-slate-500 uppercase tracking-tighter">${info.date}</p>
                <p class="text-rose-400 font-mono text-xs font-black uppercase">
                    Missing: <span class="text-white">${info.status}</span>
                </p>
            </div>
            <div class="w-1.5 h-1.5 rounded-full bg-rose-500 animate-pulse"></div>
        </div>
    `).join('');

    overlay.innerHTML = `
        <div class="missing-modal text-center">

<div class="w-16 h-16 bg-rose-500/10 rounded-full flex items-center justify-center mx-auto mb-4 border border-rose-500/20">
    <span class="text-2xl">⚠️</span>
</div>
<h3 class="text-xl font-black text-white mb-2 uppercase tracking-tight italic">Missing Records</h3>
<p class="text-slate-400 text-[10px] mb-2 font-bold leading-tight uppercase">
    The following dates have incomplete logs:
</p>

<div class="flex items-center gap-2 mb-6">
    <span class="bg-rose-500 text-white text-[9px] px-2 py-0.5 rounded font-black animate-blink shrink-0">
        WARNING
    </span>
    <span class="text-[10px] text-slate-500 font-bold tracking-tight flex-grow text-left">
        Please fill in the times for the unrecorded dates below
    </span>
</div>

<div class="max-h-[250px] overflow-y-auto no-scrollbar mb-6 px-1">
    ${listHtml}
</div>
<button onclick="document.getElementById('missingPopup').remove()" 
    class="w-full bg-rose-600 hover:bg-rose-500 text-white font-black py-4 rounded-2xl transition-all active:scale-95 shadow-xl shadow-rose-900/20">
    I UNDERSTAND
</button>

        </div>
    `;
    document.body.appendChild(overlay);
}

    renderCalendar();

})();
</script>
